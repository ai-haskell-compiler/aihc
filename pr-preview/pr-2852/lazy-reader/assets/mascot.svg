<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A sleepy cat lies on a book. Its tail is a lambda.">
  <!-- The book -->
  <path d="M28 150 L100 142 L172 150 L172 166 L100 160 L28 166 Z" fill="#46396b"/>
  <path d="M30 148 L100 140 L170 148 L100 154 Z" fill="#faf8f3"/>
  <path d="M100 140 L100 160" stroke="#e6e0d6" stroke-width="2"/>
  <!-- The tail, a lambda -->
  <path d="M138 128 C150 110 150 92 136 84 M126 128 C140 112 150 100 160 128" fill="none" stroke="#5e5086" stroke-width="9" stroke-linecap="round"/>
  <!-- The body -->
  <ellipse cx="96" cy="122" rx="56" ry="26" fill="#7d6fa6"/>
  <!-- The head -->
  <circle cx="66" cy="100" r="30" fill="#8e82b5"/>
  <path d="M44 80 L40 56 L60 72 Z" fill="#8e82b5"/>
  <path d="M86 78 L92 56 L74 70 Z" fill="#8e82b5"/>
  <path d="M46 78 L44 64 L56 73 Z" fill="#f2b8c6"/>
  <path d="M84 77 L88 64 L76 72 Z" fill="#f2b8c6"/>
  <!-- Closed eyes -->
  <path d="M52 100 Q58 106 64 100" fill="none" stroke="#2b2240" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 100 Q76 106 82 100" fill="none" stroke="#2b2240" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose and mouth -->
  <path d="M64 110 L70 110 L67 114 Z" fill="#f2b8c6"/>
  <path d="M67 114 Q63 118 60 115 M67 114 Q71 118 74 115" fill="none" stroke="#2b2240" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <path d="M40 108 L54 110 M40 114 L54 113 M94 108 L80 110 M94 114 L80 113" stroke="#2b2240" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Zzz -->
  <text x="110" y="70" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#5e5086">z</text>
  <text x="122" y="54" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#5e5086" opacity="0.7">z</text>
  <text x="138" y="36" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#5e5086" opacity="0.45">z</text>
</svg>
