name: Deploy Documentation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/setup-nix-ci/action.yml
      - .github/workflows/deploy-docs.yml
      - docs/aihc-manual/**
      - flake.lock
      - flake.nix
      - scripts/nix/docs.nix
      - scripts/nix/packages.nix
  push:
    branches:
      - main
    paths:
      - .github/actions/setup-nix-ci/action.yml
      - .github/workflows/deploy-docs.yml
      - docs/aihc-manual/**
      - flake.lock
      - flake.nix
      - scripts/nix/docs.nix
      - scripts/nix/packages.nix

permissions:
  contents: write

concurrency:
  group: documentation-content
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      - name: Build the manual
        run: |
          echo "=== Building the AIHC Manual ==="
          nix build .#manual --print-out-paths
          # Wrangler reads the site from docs/aihc-manual/site.
          cp -rL result docs/aihc-manual/site

          # Nix outputs are read-only; the publishing worktree must be removable.
          chmod -R u+w docs/aihc-manual/site

          echo "=== Site structure ==="
          find docs/aihc-manual/site -type f | head -50

      - name: Check the Cloudflare deployment
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/aihc-manual
          command: deploy --dry-run

      - name: Deploy to docs.aihc.app
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/aihc-manual
          command: deploy

      - name: Redirect the GitHub Pages site to docs.aihc.app
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          publish_dir=$(mktemp -d)
          trap 'git worktree remove --force "$publish_dir"' EXIT

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach "$publish_dir" origin/gh-pages
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan gh-pages
            git -C "$publish_dir" rm -rf .
          fi

          # The manual lives at docs.aihc.app. The old GitHub Pages root
          # redirects each page there. The pr-preview directory stays.
          find "$publish_dir" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name .git \
            ! -name pr-preview \
            -exec rm -rf {} +
          cp docs/aihc-manual/redirect.html "$publish_dir/index.html"
          cp docs/aihc-manual/redirect.html "$publish_dir/404.html"
          touch "$publish_dir/.nojekyll"

          git -C "$publish_dir" config user.name github-actions[bot]
          git -C "$publish_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish_dir" add --all

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "GitHub Pages redirect is already current."
            exit 0
          fi

          git -C "$publish_dir" commit -m "docs: redirect to docs.aihc.app for $GITHUB_SHA"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run complete; the redirect was committed locally."
            exit 0
          fi

          git -C "$publish_dir" push origin HEAD:gh-pages
