name: Deploy Documentation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/setup-nix-ci/action.yml
      - .github/workflows/deploy-docs.yml
      - docs/aihc-manual/**
      - editors/grammars/**
      - flake.lock
      - flake.nix
      - bin/aihc/dev/src/Aihc/Dev/PipelineExamples.hs
      - scripts/nix/checks.nix
      - scripts/nix/docs.nix
      - scripts/nix/editor-grammars.nix
      - scripts/nix/packages.nix
  # The manual shows the output of the compiler. Thus, each change on main
  # can change the manual, and each push deploys it again.
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: documentation-content
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      - name: Build the manual
        run: |
          echo "=== Building the AIHC Manual ==="
          nix build .#manual --print-out-paths
          # Wrangler reads the site from docs/aihc-manual/site.
          cp -rL result docs/aihc-manual/site

          # Nix outputs are read-only; the publishing worktree must be removable.
          chmod -R u+w docs/aihc-manual/site

          echo "=== Site structure ==="
          find docs/aihc-manual/site -type f | head -50

      # `wrangler deploy --dry-run` does not send requests to Cloudflare.
      # Thus it cannot find a token that has incorrect permissions.
      # This step sends the first deployment requests with the deployment token.
      # It fails on the PR, before the deployment on main can fail.
      - name: Check the Cloudflare token access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_ZONE: aihc.app
          DOCS_WORKER: aihc-manual
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

          cf_get() {
            curl --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/$1"
          }

          require() {
            local what=$1 response=$2 filter=$3
            if ! jq --exit-status "$filter" <<<"$response" >/dev/null; then
              echo "::error::The Cloudflare token cannot access $what."
              jq '{success, errors}' <<<"$response" || true
              exit 1
            fi
            echo "OK: $what"
          }

          # This request needs the "Workers Scripts" account permission.
          require "the Workers scripts of the account" \
            "$(cf_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")" \
            '.success'
          # The deployment starts with this request. It needs the
          # "Workers Scripts: Edit" account permission. The session only
          # lists the assets to upload. It does not make or change a Worker.
          require "an asset upload session for the $DOCS_WORKER Worker" \
            "$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"manifest":{"/ci-token-check.txt":{"hash":"00000000000000000000000000000000","size":1}}}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DOCS_WORKER/assets-upload-session")" \
            '.success'
          # The custom domain route needs access to the zone.
          require "the $DOCS_ZONE zone in the account" \
            "$(cf_get "zones?name=$DOCS_ZONE&account.id=$CLOUDFLARE_ACCOUNT_ID")" \
            '.success and (.result | length) == 1'

      - name: Check the Cloudflare deployment
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/aihc-manual
          wranglerVersion: "4.143.0"
          command: deploy --dry-run

      - name: Deploy to docs.aihc.app
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/aihc-manual
          wranglerVersion: "4.143.0"
          command: deploy

      - name: Redirect the GitHub Pages site to docs.aihc.app
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          publish_dir=$(mktemp -d)
          trap 'git worktree remove --force "$publish_dir"' EXIT

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach "$publish_dir" origin/gh-pages
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan gh-pages
            git -C "$publish_dir" rm -rf .
          fi

          # The manual lives at docs.aihc.app. The old GitHub Pages root
          # redirects each page there. The pr-preview directory stays.
          find "$publish_dir" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name .git \
            ! -name pr-preview \
            -exec rm -rf {} +
          cp docs/aihc-manual/redirect.html "$publish_dir/index.html"
          cp docs/aihc-manual/redirect.html "$publish_dir/404.html"
          touch "$publish_dir/.nojekyll"

          git -C "$publish_dir" config user.name github-actions[bot]
          git -C "$publish_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish_dir" add --all

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "GitHub Pages redirect is already current."
            exit 0
          fi

          git -C "$publish_dir" commit -m "docs: redirect to docs.aihc.app for $GITHUB_SHA"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run complete; the redirect was committed locally."
            exit 0
          fi

          git -C "$publish_dir" push origin HEAD:gh-pages
