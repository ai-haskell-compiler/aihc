name: Generated Reports Update

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  select-runner:
    runs-on: ubuntu-24.04
    outputs:
      use_self_hosted: ${{ steps.select.outputs.use_self_hosted }}
      runs_on: ${{ steps.select.outputs.runs_on }}
      selected_runner: ${{ steps.select.outputs.selected_runner }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: select
        uses: ./.github/actions/select-ci-runner
        with:
          repository: ${{ github.repository }}
          runner-label: ${{ vars.CI_SELF_HOSTED_RUNNER_LABEL != '' && vars.CI_SELF_HOSTED_RUNNER_LABEL || 'aihc-lima' }}
          fallback-runner: ${{ vars.CI_HOSTED_FALLBACK_RUNNER != '' && vars.CI_HOSTED_FALLBACK_RUNNER || 'ubuntu-24.04' }}
          runner-token: ${{ secrets.SELF_HOSTED_RUNNER_ADMIN_TOKEN != '' && secrets.SELF_HOSTED_RUNNER_ADMIN_TOKEN || secrets.AUTOMATION_PR_TOKEN }}
          allow-self-hosted: true

      - name: Summarize runner selection
        run: |
          {
            echo "### Runner selection"
            echo
            echo "- Selected runner: \`${{ steps.select.outputs.selected_runner }}\`"
            echo "- Self-hosted enabled: \`${{ steps.select.outputs.use_self_hosted }}\`"
            echo "- Reason: ${{ steps.select.outputs.reason }}"
          } >>"$GITHUB_STEP_SUMMARY"

  update-generated-reports:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      - name: Cache package downloads
        uses: actions/cache@v6
        with:
          path: |
            .cache/aihc/hackage
          key: generated-reports-aihc-downloads-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            generated-reports-aihc-downloads-${{ runner.os }}-

      - name: Update generated reports
        env:
          # Keep the install log of each self-hosting package for the upload below.
          SELF_HOSTING_PROGRESS_CMD: nix run .#self-hosting-progress -- --log-dir ${{ github.workspace }}/self-hosting-logs --report
        run: nix run .#generate-reports

      - name: Upload the self-hosting install logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-hosting-logs
          path: ${{ github.workspace }}/self-hosting-logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Open pull request for generated updates
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_PR_TOKEN }}
          branch-token: ${{ secrets.AUTOMATION_PR_TOKEN }}
          commit-message: "chore(reports): update generated reports"
          add-paths: |
            README.md
            docs/*-supported-extensions.md
            docs/self-hosting-packages.md
            bin/aihc/aihc.lock
          branch: "automation/generated-reports-update"
          title: "chore(reports): update generated reports"
          body: |
            This PR was created automatically by the weekly generated reports workflow.

            It updates generated README sections and report artifacts when they drift.
