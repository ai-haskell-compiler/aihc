name: GHC Compatibility Images

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/docker/ghc-compat/**
      - .github/workflows/ghc-compat-images.yml
      - cabal.project.ghc-compat
      - components/aihc-resolve/aihc-resolve.cabal
      - components/aihc-tc/aihc-tc.cabal
  workflow_dispatch:
  workflow_call:
    inputs:
      extra_tag:
        description: Extra image tag suffix without a leading hyphen.
        required: false
        type: string
        default: ""
      push_stable:
        description: Push the floating GHC version tag.
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the runs of the same workflow that are
# still queued or in progress for that pull request. Merge queue runs always
# complete: each merge group gets its own ref, and cancelling one would stall
# the queue.
concurrency:
  group: ghc-compat-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/ghc-compat
  CABAL_VERSION: 3.16.0.0

jobs:
  build:
    name: Build GHC ${{ matrix.ghc }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ghc:
          - 9.8.4
          - 9.10.3
          - 9.12.4
          - 9.14.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        run: |
          set -euo pipefail
          image="${{ env.IMAGE }}"
          ghc="${{ matrix.ghc }}"
          tags=()
          if [ "${{ github.event_name }}" = "push" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ "${{ inputs.push_stable }}" = "true" ]; then
            tags+=("${image}:${ghc}")
          fi
          extra="${{ inputs.extra_tag }}"
          if [ -n "$extra" ]; then
            tags+=("${image}:${ghc}-${extra}")
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No image tags to push." >&2
            exit 1
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/ghc-compat/Dockerfile
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GHC_VERSION=${{ matrix.ghc }}
            CABAL_VERSION=${{ env.CABAL_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=aihc GHC ${{ matrix.ghc }} compatibility toolchain
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.ghc }}
            type=registry,ref=${{ env.IMAGE }}:${{ matrix.ghc }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.ghc }},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd

  publish-visibility:
    name: Make the image package public
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.push_stable == true
    runs-on: ubuntu-24.04
    steps:
      - name: Set GHCR package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/aihc%2Fghc-compat" \
            -f visibility=public
