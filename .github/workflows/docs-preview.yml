name: Documentation Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - .github/workflows/docs-preview.yml
      - docs/aihc-manual/**
      - docs/aihc-guide/**
      - bin/aihc-play/**
      - scripts/build-lazy-reader-helper.sh
      - scripts/build-play-tools.mjs
      - scripts/transpile-play.mjs
      - scripts/package-play-runtime.mjs
      - scripts/publish-play-tools.sh
      - scripts/nix/play-tools.nix
      - editors/grammars/**
      - flake.lock
      - flake.nix
      - bin/aihc/dev/src/Aihc/Dev/PipelineExamples.hs
      - scripts/nix/apps.nix
      - scripts/nix/checks.nix
      - scripts/nix/docs.nix
      - scripts/nix/editor-grammars.nix
      - scripts/nix/packages.nix

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: documentation-content
  queue: max
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        if: github.event.action != 'closed'
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      - name: Build the manual
        if: github.event.action != 'closed'
        run: |
          nix build .#manual --out-link manual-result
          cp -rL manual-result manual-preview
          chmod -R u+w manual-preview

      # The guide and its playground helper go under lazy-reader/ of the
      # same preview.
      - name: Publish the browser tools to R2
        if: github.event.action != 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix run .#publish-play-tools

      - name: Build The Lazy Reader
        env:
          AIHC_PLAY_TOOLS_URL: https://assets.aihc.app/play
        if: github.event.action != 'closed'
        run: |
          nix build .#guide --out-link guide-result
          cp -rL guide-result manual-preview/lazy-reader
          chmod -R u+w manual-preview/lazy-reader
          nix run .#build-lazy-reader-helper -- --output manual-preview/lazy-reader/play/helper
          rm -f manual-preview/lazy-reader/play/aihc-play.wasm

      - name: Publish preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: manual-preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
