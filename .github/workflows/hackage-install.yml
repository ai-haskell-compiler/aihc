name: Hackage Install

# Install the pinned Hackage packages of docs/hackage-install-packages.md for
# every backend at every optimization level, one job per configuration, then
# open one issue per package that failed in any of them.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hackage-install
  cancel-in-progress: false

jobs:
  install:
    name: Install for ${{ matrix.target }} at -O${{ matrix.level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # linux-amd64 is the native backend of the runner; llvm goes through
        # Clang, and wasm32-wasip3 is a cross target.
        target: [linux-amd64, llvm, wasm32-wasip3]
        # -O2 and -Os compile the whole program at once, -O0 one module at a
        # time, so the three levels exercise both paths of the compiler.
        level: ["0", "2", s]
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      CONFIGURATION: ${{ matrix.target }}-O${{ matrix.level }}
      REPORT_DIR: ${{ github.workspace }}/hackage-install-report-${{ matrix.target }}-O${{ matrix.level }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      - name: Install the pinned Hackage packages
        id: install
        continue-on-error: true
        run: |
          nix run .#install-hackage-packages -- \
            --target "${{ matrix.target }}" \
            -O "${{ matrix.level }}" \
            --report-dir "$REPORT_DIR"

      - name: Summarize the run
        run: |
          set -euo pipefail
          {
            echo "### Hackage install for \`$CONFIGURATION\`"
            echo
            if [ -s "$REPORT_DIR/failed.txt" ]; then
              echo "Failed to install:"
              echo
              while read -r package; do
                echo "- \`$package\`"
              done <"$REPORT_DIR/failed.txt"
            elif [ "${{ steps.install.outcome }}" != "success" ]; then
              echo "The install step failed before any package was attempted."
            else
              echo "Every package of \`docs/hackage-install-packages.md\` installed."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # The report job merges these; a configuration that failed before any
      # package was attempted has no report and fails its own job instead.
      - name: Upload the report
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: hackage-install-report-${{ matrix.target }}-O${{ matrix.level }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail when a package failed to install
        if: steps.install.outcome == 'failure'
        run: exit 1

  report:
    name: Open an issue for each failed package
    needs: install
    if: always() && needs.install.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPORT_DIR: ${{ github.workspace }}/hackage-install-report
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the reports
        uses: actions/download-artifact@v8
        with:
          pattern: hackage-install-report-*
          path: reports

      - name: Merge the reports
        run: scripts/merge-hackage-install-reports.sh reports "$REPORT_DIR"

      - name: Summarize the run
        run: |
          set -euo pipefail
          {
            echo "### Hackage install"
            echo
            if [ -s "$REPORT_DIR/failed.txt" ]; then
              echo "Failed to install in at least one configuration:"
              echo
              while read -r package; do
                echo "- \`$package\`"
              done <"$REPORT_DIR/failed.txt"
            else
              echo "No package failed, but an install job did; see its log."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Open an issue for each failed package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          label="hackage-install-failure"
          gh label create "$label" \
            --description "A package of docs/hackage-install-packages.md fails to install" \
            --color B60205 >/dev/null 2>&1 || true

          if [ ! -s "$REPORT_DIR/failed.txt" ]; then
            echo "An install job failed before any package was attempted." >&2
            exit 1
          fi

          # One issue per package, titled after the exact release, so a rerun
          # that still fails finds its own issue rather than opening another.
          # The body has a section per configuration the package failed in.
          open_titles="$(gh issue list --state open --label "$label" --limit 200 --json title --jq '.[].title')"

          while read -r package; do
            title="aihc install fails: $package"
            if printf '%s\n' "$open_titles" | grep -Fxq "$title"; then
              echo "An open issue already tracks $package."
              continue
            fi
            body="$REPORT_DIR/body-$package.md"
            {
              cat "$REPORT_DIR/$package.md"
              echo
              echo "Found by the daily [Hackage install]($RUN_URL) workflow."
            } >"$body"
            gh issue create --title "$title" --label "$label" --body-file "$body"
          done <"$REPORT_DIR/failed.txt"

      - name: Fail when a package failed to install
        run: exit 1
