name: Release

# Build the release executables of aihc with aihc. GHC compiles stage 0,
# stage 0 compiles stage 1, and stage 1 compiles stage 2, each at -O2 with
# the core-libs sources in the executable. The job fails when stage 1 and
# stage 2 are not byte-for-byte identical, and ships stage 2.
#
# The Linux build job also builds the web kit with its stage 2 executable.
# The kit is aihc for the browser: see web-kit/README.md. A smoke test loads
# the packed kit in a headless browser, and compiles and runs a program there.
# The web kit does not wait for the macOS build, which takes more time.
#
# A pushed tag v<version> makes a draft release with the archives, their
# SHA-256 sums, and a build provenance attestation. The tag must match the
# version in bin/aihc/aihc.cabal. Then the workflow publishes the web kit to
# https://assets.aihc.app/play/releases/<version>/, where it never changes.
# A manual run only builds the archives and keeps them as workflow artifacts.
#
# The executable must not depend on the paths of the build. Thus stage 2
# builds in a different checkout path, work directory, and cache directory
# than stage 1, and the comparison still requires identical bytes. The
# executables must also not contain these paths.
#
# The release executables must run without Nix. The Linux executable is a
# static musl executable. The macOS executable loads only libraries of macOS.
# The release-compile-stage app supplies the toolchain for each target.
#
# The Linux build job also makes a Debian package and an RPM package that
# contain the same executable as the Linux archive. packaging/nfpm.yaml
# gives their dependencies. A test installs each package in a container of
# its distribution, and builds and runs an example with it.
#
# The homebrew workflow updates the Homebrew formula after you publish the
# draft release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPTIMIZATION: "2"
  WORK_DIR: /tmp/aihc-release
  # Stage 2 builds in these directories, which have different paths than
  # the checkout, WORK_DIR, and the cache directory of stage 1.
  STAGE2_WORK_DIR: /tmp/aihc-release-second-stage
  STAGE2_CHECKOUT_NAME: aihc-second-stage-checkout
  STAGE2_CACHE_NAME: aihc-second-stage-cache

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          cabal_version=$(sed -n 's/^version:[[:space:]]*//p' bin/aihc/aihc.cabal)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_version" != "$cabal_version" ]]; then
              echo "::error::The tag v$tag_version does not match version $cabal_version in bin/aihc/aihc.cabal."
              exit 1
            fi
            version="$tag_version"
          else
            version="$cabal_version-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Release version: $version" >>"$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: apple-arm64
            runner: macos-15
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      # Without AIHC, the app uses the GHC-built aihc, which is stage 0.
      - name: Compile stage 1
        run: |
          nix run .#release-compile-stage -- \
            --work-dir "$WORK_DIR" \
            --output "$RUNNER_TEMP/stages/aihc-stage1" \
            --target "$TARGET" \
            -O "$OPTIMIZATION" \
            --embed-core-libs

      - name: Remove the stage 1 work directory
        run: rm -rf "$WORK_DIR"

      - name: Copy the checkout for stage 2
        run: cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/$STAGE2_CHECKOUT_NAME"

      - name: Compile stage 2
        working-directory: ${{ runner.temp }}/${{ env.STAGE2_CHECKOUT_NAME }}
        run: |
          chmod +x "$RUNNER_TEMP/stages/aihc-stage1"
          AIHC="$RUNNER_TEMP/stages/aihc-stage1" nix run .#release-compile-stage -- \
            --work-dir "$STAGE2_WORK_DIR" \
            --cache-dir "$RUNNER_TEMP/$STAGE2_CACHE_NAME" \
            --output "$RUNNER_TEMP/stages/aihc-stage2" \
            --target "$TARGET" \
            -O "$OPTIMIZATION" \
            --embed-core-libs

      - name: Compare stage 1 and stage 2
        run: |
          set -euo pipefail
          stage1="$RUNNER_TEMP/stages/aihc-stage1"
          stage2="$RUNNER_TEMP/stages/aihc-stage2"
          status=0
          cmp "$stage1" "$stage2" || status=$?
          {
            echo "### Self-compile of aihc for $TARGET"
            echo
            echo "| Stage | Size in bytes | SHA-256 |"
            echo "| --- | --- | --- |"
            for stage in 1 2; do
              file="$RUNNER_TEMP/stages/aihc-stage$stage"
              echo "| $stage | $(wc -c <"$file" | tr -d ' ') | \`$(shasum -a 256 "$file" | cut -d' ' -f1)\` |"
            done
            echo
            if [ "$status" -eq 0 ]; then
              echo "Stage 1 and stage 2 are identical."
            else
              echo "Stage 1 and stage 2 are different."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::Stage 1 and stage 2 of aihc for $TARGET are not byte-for-byte identical."
            exit 1
          fi

      - name: Check the executables for build paths
        run: |
          set -euo pipefail
          for stage in 1 2; do
            scripts/check-build-paths.sh "$RUNNER_TEMP/stages/aihc-stage$stage" \
              "$GITHUB_WORKSPACE" \
              "$RUNNER_TEMP" \
              "$HOME" \
              "$WORK_DIR" \
              "$STAGE2_WORK_DIR"
          done

      # The executable must run on Linux without Nix. Thus it must have no
      # program interpreter and no shared library. The runner has no Nix
      # store in its library paths, so a run outside Nix is a real test.
      - name: Check the static executable
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/stages/aihc-stage2"
          chmod +x "$file"
          {
            echo "### Executable of aihc for $TARGET"
            echo
            echo "- $(file -b "$file")"
          } >>"$GITHUB_STEP_SUMMARY"
          status=0
          if readelf -l "$file" | grep -q INTERP; then
            echo "::error::The executable has a program interpreter."
            status=1
          fi
          if readelf -d "$file" | grep -q NEEDED; then
            echo "::error::The executable loads shared libraries: $(readelf -d "$file" | grep NEEDED | tr -s ' ')"
            status=1
          fi
          env -i "$file" --help >/dev/null || {
            echo "::error::The executable does not run outside Nix."
            status=1
          }
          exit "$status"

      # The executable must run on a Mac without Nix. Thus it may only load
      # libraries of macOS, and it must run on macOS 12. Aihc.Native links for macOS 12.
      - name: Check the dynamic libraries
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/stages/aihc-stage2"
          libraries="$(otool -L "$file" | tail -n +2 | awk '{print $1}')"
          minimum="$(otool -l "$file" | awk '/LC_BUILD_VERSION/ {found = 1} found && $1 == "minos" {print $2; exit}')"
          {
            echo "### Dynamic libraries of aihc for $TARGET"
            echo
            echo "- Minimum macOS version: $minimum"
            echo "- Libraries: $(echo "$libraries" | tr '\n' ' ')"
          } >>"$GITHUB_STEP_SUMMARY"
          status=0
          while IFS= read -r library; do
            case "$library" in
            /usr/lib/* | /System/*) ;;
            *)
              echo "::error::The executable loads $library, which is not a library of macOS."
              status=1
              ;;
            esac
          done <<<"$libraries"
          if [ "$minimum" != 12.0 ]; then
            echo "::error::The minimum macOS version is $minimum, not 12.0."
            status=1
          fi
          exit "$status"

      - name: Run the smoke test
        run: |
          chmod +x "$RUNNER_TEMP/stages/aihc-stage2"
          nix run .#release-smoke-test -- \
            --aihc "$RUNNER_TEMP/stages/aihc-stage2" \
            --target "$TARGET"

      - name: Pack the archive
        run: |
          set -euo pipefail
          name="aihc-$VERSION-$TARGET"
          mkdir -p "$RUNNER_TEMP/archive/$name"
          cp "$RUNNER_TEMP/stages/aihc-stage2" "$RUNNER_TEMP/archive/$name/aihc"
          chmod 755 "$RUNNER_TEMP/archive/$name/aihc"
          cp LICENSE "$RUNNER_TEMP/archive/$name/LICENSE"
          tar -C "$RUNNER_TEMP/archive" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          echo "Wrote $name.tar.gz ($(wc -c <"$RUNNER_TEMP/$name.tar.gz" | tr -d ' ') bytes)" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: aihc-${{ env.VERSION }}-${{ env.TARGET }}
          path: ${{ runner.temp }}/aihc-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Make the Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          nix run .#release-packages -- \
            --archive "$RUNNER_TEMP/aihc-$VERSION-$TARGET.tar.gz" \
            --version "$VERSION" \
            --output "$RUNNER_TEMP/packages"
          {
            echo "### Linux packages"
            echo
            for file in "$RUNNER_TEMP"/packages/*; do
              echo "- $(basename "$file") ($(wc -c <"$file" | tr -d ' ') bytes)"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      # Each container has only the base system of its distribution. Thus
      # the package manager must install all the tools that aihc needs.
      - name: Test the Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test_package() {
            local image="$1"
            local install="$2"
            docker run --rm \
              --volume "$RUNNER_TEMP/packages:/packages:ro" \
              --volume "$GITHUB_WORKSPACE/examples/arithmetic:/example:ro" \
              "$image" sh -euc "
                $install
                cp /example/Main.hs /tmp/Main.hs
                cd /tmp
                aihc build Main.hs -o example
                ./example | cmp - /example/stdout
              "
          }
          test_package docker.io/library/debian:trixie \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/*.deb >/dev/null'
          test_package docker.io/library/ubuntu:24.04 \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/*.deb >/dev/null'
          test_package registry.fedoraproject.org/fedora:43 \
            'dnf install -y -q /packages/*.rpm >/dev/null'

      - name: Upload the Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: aihc-${{ env.VERSION }}-linux-packages
          path: |
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.rpm
          retention-days: 30
          if-no-files-found: error

      # The stage 2 work and cache directories are not necessary after this
      # step. Remove them to make disk space for the web kit.
      - name: Remove the stage 2 directories
        if: runner.os == 'Linux'
        run: rm -rf "$STAGE2_WORK_DIR" "${RUNNER_TEMP:?}/$STAGE2_CACHE_NAME"

      # The stage 2 executable compiles the helper and the core libraries.
      # aihc-dev from the Nix build writes the bundle and the linker inputs
      # from the store of that executable. Both come from this commit.
      - name: Build the web kit
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          AIHC="$RUNNER_TEMP/stages/aihc-stage2" nix run .#build-web-kit -- \
            --output "$RUNNER_TEMP/kit" \
            --version "$VERSION" \
            --archive "$RUNNER_TEMP/aihc-$VERSION-web.tar.gz"
          {
            echo "### Web kit $VERSION"
            echo
            echo "| Group | Size in bytes |"
            echo "| --- | --- |"
            jq --raw-output '.files | group_by(.group)[] | "| \(.[0].group) | \(map(.bytes) | add) |"' "$RUNNER_TEMP/kit/manifest.json"
          } >>"$GITHUB_STEP_SUMMARY"

      # The test reads the archive and not the build directory. Thus it
      # tests the files that the release ships.
      - name: Run the web kit smoke test
        if: runner.os == 'Linux'
        run: nix run .#web-kit-smoke-test -- --archive "$RUNNER_TEMP/aihc-$VERSION-web.tar.gz"

      - name: Upload the web archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: aihc-${{ env.VERSION }}-web
          path: ${{ runner.temp }}/aihc-${{ env.VERSION }}-web.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs-${{ env.TARGET }}
          path: |
            ${{ env.WORK_DIR }}/logs
            ${{ env.STAGE2_WORK_DIR }}/logs
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Make the draft release
    needs:
      - version
      - build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the archives and packages
        uses: actions/download-artifact@v8
        with:
          pattern: aihc-${{ env.VERSION }}-*
          path: archives
          merge-multiple: true

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd archives
          sha256sum aihc-*.tar.gz aihc*.deb aihc*.rpm >SHA256SUMS
          cat SHA256SUMS >>"$GITHUB_STEP_SUMMARY"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            archives/aihc-*.tar.gz
            archives/aihc*.deb
            archives/aihc*.rpm

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Binaries of aihc $VERSION, compiled with aihc at -O$OPTIMIZATION."
            echo "The core libraries are embedded in each binary."
            echo "The web archive is aihc for the browser, also at https://assets.aihc.app/play/releases/$VERSION/manifest.json."
            echo "The .deb and .rpm packages contain the Linux AMD64 binary."
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum name; do
              echo "| $name | $sum |"
            done <archives/SHA256SUMS
          } >notes.md
          gh release create "v$VERSION" \
            --draft \
            --verify-tag \
            --title "aihc $VERSION" \
            --notes-file notes.md \
            archives/aihc-*.tar.gz archives/aihc*.deb archives/aihc*.rpm archives/SHA256SUMS
          echo "Draft release v$VERSION is ready for review." >>"$GITHUB_STEP_SUMMARY"

  # A website pins a version of the kit. Thus the files of a version must
  # never change. The script does not replace or delete a file, and it fails
  # when the version is there with different contents.
  publish-web:
    name: Publish the web kit
    needs:
      - version
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

      - name: Download the web archive
        uses: actions/download-artifact@v8
        with:
          name: aihc-${{ env.VERSION }}-web
          path: ${{ runner.temp }}/web

      - name: Publish the web kit to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/web" -xzf "$RUNNER_TEMP/web/aihc-$VERSION-web.tar.gz"
          nix run .#publish-web-kit -- "$RUNNER_TEMP/web/aihc-$VERSION-web" "$VERSION"
          echo "Web kit: https://assets.aihc.app/play/releases/$VERSION/manifest.json" >>"$GITHUB_STEP_SUMMARY"
