name: Setup Nix CI
description: >-
  Configure Nix with the shared R2 cache after checkout. Without R2
  credentials, such as in a pull request from a fork, the cache is read-only
  through its public URL.

inputs:
  r2-account-id:
    description: Cloudflare R2 account ID.
    required: true
  r2-access-key:
    description: Cloudflare R2 access key ID.
    required: true
  r2-secret-access-key:
    description: Cloudflare R2 secret access key. Empty for a read-only cache.
    required: false
    default: ""
  nix-cache-private-key:
    description: Private signing key for the Nix cache. Empty for a read-only cache.
    required: false
    default: ""
  nix-preinstalled:
    description: >-
      Set to "true" when the runner already provides Nix and a configured cache,
      such as the sandboxed self-hosted pool that shares the host nix-daemon.
      Both setup steps are skipped in that case.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      if: inputs.nix-preinstalled != 'true'
      uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

    - name: Configure Cloudflare R2 cache
      if: inputs.nix-preinstalled != 'true' && inputs.r2-secret-access-key != ''
      uses: lemmih/nix-s3-cache-action@22f88358e2469d46847772dc4ec5787be21eb3b4 # fix/macos-support, v1.0.4
      with:
        s3-endpoint: ${{ inputs.r2-account-id }}.r2.cloudflarestorage.com
        bucket: nix-cache
        public-key: nix-cache:2eICaC37vEBexPk98J0dRt5FzSX7f6hx0vRl9tPaUuM=
        aws-access-key-id: ${{ inputs.r2-access-key }}
        aws-secret-access-key: ${{ inputs.r2-secret-access-key }}
        private-key: ${{ inputs.nix-cache-private-key }}

    - name: Configure the public read-only cache
      if: inputs.nix-preinstalled != 'true' && inputs.r2-secret-access-key == ''
      shell: bash
      run: |
        config=/etc/nix/nix.conf
        if [ -f /etc/nix/nix.custom.conf ]; then
          config=/etc/nix/nix.custom.conf
        fi
        printf '%s\n' \
          'extra-substituters = https://nix-cache.aihc.app' \
          'extra-trusted-public-keys = nix-cache:2eICaC37vEBexPk98J0dRt5FzSX7f6hx0vRl9tPaUuM=' |
          sudo tee -a "$config" >/dev/null
        sudo systemctl restart nix-daemon || true
