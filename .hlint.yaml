- ignore:
    name: Use camelCase
    within: Prelude
- ignore:
    name: Use camelCase
    within: GHC.IO.Exception
- ignore:
    name: Use foldl
    within: GHC.Read.Lex
# The class defaults of Num are mutually recursive, exactly as in GHC: (-)
# goes through negate and negate goes through (-). Writing either hint's
# suggestion makes the default call itself.
- ignore:
    name: Use -
    within: GHC.Prim.Num
- ignore:
    name: Redundant fromInteger
    within: GHC.Prim.Num
# The one-element unboxed tuple is a tuple, not a wrapper: making it a
# newtype would erase the constructor and change how it is laid out.
- ignore:
    name: Use newtype instead of data
    within: GHC.Types

- ignore:
    name: Use traverse
    within: GHC.Internal.Traversable
- ignore:
    name: Use sequenceA
    within: GHC.Internal.Traversable
- ignore:
    within: GHC.Boot.TH.Lib.Map
- ignore:
    within: GHC.Boot.TH.Ppr
- ignore:
    within: GHC.Boot.TH.PprLib
- ignore:
    within: GHC.Internal.TH.Lib
- ignore:
    within: GHC.Internal.TH.Lift
- ignore:
    within: GHC.Internal.TH.Syntax
- ignore:
    within: Language.Haskell.TH.Lib
- ignore:
    within: System.FilePath.Posix
- ignore:
    within: System.FilePath.Windows

# Importing Paths_aihc bakes the configured datadir into the importer's
# interface, so the check derivation that reuses the package intermediates
# recompiles every transitive importer. Aihc.DataFiles re-exports the one
# function that is needed behind a NOINLINE binding, which keeps the store path
# out of its interface and stops the cascade there.
- modules:
    - name: Paths_aihc
      within: Aihc.DataFiles
      message: "Import Aihc.DataFiles instead of Paths_aihc; see Aihc.DataFiles for why."
