reason: >-
  A byte array of a size that is not fixed starts at the heap pointer when
  it is small and the nursery has room. The code computes the charge, takes
  the words, and writes the header. It calls the runtime only for a size
  that needs a check, for a large array, and for a full nursery. The shrink
  is in the code too. It stores only the size when the size does not change,
  and it clears the words that the array gives up.
