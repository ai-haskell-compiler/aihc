    (first%2 :: BoxedRep Lifted) <- store (CBox (1 :: IntRep))
    (doubled%3 :: IntRep) <- primitive-call @IntRep +# (2 :: IntRep) (2 :: IntRep)
    (second%4 :: BoxedRep Lifted) <- store (CBox (doubled%3 :: IntRep))
    store (CPair (first%2 :: BoxedRep Lifted) (second%4 :: BoxedRep Lifted))
