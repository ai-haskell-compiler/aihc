status: pass
reason: |
  A primitive that cannot allocate does not split the reservations around
  it. The addition here becomes `add i64 2, 2` and takes nothing from the
  heap, so the three stores share one reservation of seven words rather
  than paying two heap checks. Nothing is spilled across the addition
  either: the single reservation runs before any object exists, so only the
  continuation is a root, where the second of two reservations had to carry
  the first object as well.

  See isReservationBarrier in Aihc.Grin.Heap and the classification in
  Aihc.Grin.Primitive.
