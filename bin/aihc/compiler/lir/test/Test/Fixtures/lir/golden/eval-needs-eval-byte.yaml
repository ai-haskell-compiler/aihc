status: pass
reason: |
  The inline evaluation check loads the header, removes the two evaluation
  bits, loads the needs_eval byte of the info table, and goes to the ready
  branch when the byte is zero. Only an object that is not a value compares
  the byte with 2 and follows an indirection. A thunk and a blackhole go to
  the slow branch. The slow branch gives the value, the info table of the
  frame, and the fields to a shared force helper. The helper pushes the frame
  and evaluates the value. Each info table has five byte fields, and the thunk table
  has a needs_eval byte of 1.
  The ready branch contains a copy of the continuation of $entry. The copy
  loads the payload and continues with it, without a tail call to the
  continuation. The original continuation stays for the frame.
