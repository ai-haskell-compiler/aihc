reason: |
  The inline evaluation check loads the header, removes the two evaluation
  bits, loads the needs_eval byte of the info table, and goes to the ready
  branch when the byte is zero. Only an object that is not a value compares
  the byte with 2 and follows an indirection. A thunk and a blackhole go to
  the slow branch. Each info table has five byte fields, and the thunk table
  has a needs_eval byte of 1.
