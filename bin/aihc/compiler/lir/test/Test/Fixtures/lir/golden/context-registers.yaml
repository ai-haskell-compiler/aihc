status: pass
reason: |
  The heap pointer, the stack pointer, and the capability are parameters of
  the function. The heap limit and the stack limit are fields of the
  capability, as in GHC. Each heap check loads the heap limit at offset 24
  of the capability. The code reads the capability from the parameter, not
  from the header of a stack chunk. The arithmetic and the comparison
  between the two allocations touch no field of the capability. A store
  only advances the heap pointer value.

  The capability gets the heap pointer and the stack pointer only before a
  C call that can read them. Here that is newMutVar#, which allocates, and
  the collector on the slow path of a reservation. After each of these
  calls, the heap pointer comes back from the capability. The stack pointer
  does not come back, because no such call changes it. The tail call passes
  all three values on.

  See "Lowering from GC-GRIN" in docs/lir.md and Context in Aihc.Lir.Lower.
