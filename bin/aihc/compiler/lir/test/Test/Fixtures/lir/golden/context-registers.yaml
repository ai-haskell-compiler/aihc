reason: |
  The heap pointer, the heap limit, the stack pointer, and the stack limit
  are parameters of the function, not fields of the machine. The arithmetic
  and the comparison between the two allocations touch no field of the
  machine: no load and no store of offset 24, 32, or 40. A store only
  advances the heap pointer value.

  The machine gets the heap pointer and the stack pointer only before a C
  call that can read them. Here that is newMutVar#, which allocates, and the
  collector on the slow path of a reservation. After each of these calls,
  the heap pointer and the heap limit come back from the machine. The stack
  pointer and the stack limit do not come back, because no such call changes
  them. The tail call passes all four values on.

  See "Lowering from GC-GRIN" in docs/lir.md and Context in Aihc.Lir.Lower.
