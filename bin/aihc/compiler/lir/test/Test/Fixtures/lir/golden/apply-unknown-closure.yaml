program: |
  $entry (f :: BoxedRep Lifted) (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    apply @(BoxedRep Lifted) (f :: BoxedRep Lifted) (x :: BoxedRep Lifted)
expected: |
  extern func @aihc_lir_apply_p(ptr, ptr, ptr, ptr, ptr, ptr)

  func @aihc_f_aihc_entry___sentry(%hp_0: ptr, %sp_1: ptr, %base_2: ptr, %f_3: ptr, %x_4: ptr, %$cps_return_5: ptr) {
  entry:
    %header_word_6 = load i64 [%f_3] align 8
    %info_word_7 = and i64 %header_word_6, -4
    %header_8 = ptr.from_int %info_word_7
    %kind_9 = load.invariant i8 [%header_8 + 43] align 1
    %closure_13 = eq i8 %kind_9, 1
    br %closure_13, entry$next0, apply_helper_17

  entry$next0:
    %arity_11 = load.invariant i8 [%header_8 + 41] align 1
    %saturated_14 = eq i8 %arity_11, 1
    br %saturated_14, apply_enter_16, apply_helper_17

  cold apply_helper_17:
    tailcall @aihc_lir_apply_p(%hp_0, %sp_1, %base_2, %f_3, %$cps_return_5, %x_4)

  apply_enter_16:
    %entry_18 = load.invariant code [%header_8 + 24] align 1 word
    tailcall.indirect %entry_18(%hp_0, %sp_1, %base_2, %f_3, %$cps_return_5, %x_4) : (ptr, ptr, ptr, ptr, ptr, ptr)
  }
status: pass
reason: |
  An application of an unknown function to one group tests the info table of
  the function. A closure that takes exactly one group is entered at the call
  site with one indirect call. Any other function goes to the shared apply
  helper in a cold block.
