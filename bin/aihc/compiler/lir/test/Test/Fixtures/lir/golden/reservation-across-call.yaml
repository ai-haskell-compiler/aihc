status: pass
reason: |
  A call can collect, so it ends the caller's reservation and the store after it
  reserves again in the continuation the call returns to. The pointer that stays
  live across the reservation is a root: the fast path passes it straight to the
  merge block. The slow path gives the arguments of the function to a shared
  replay helper. The helper writes the roots to the root array, collects, and
  enters the function again with the addresses that the collector moved them to.
  The continuation takes its frame directly and loads the stored fields. Its
  slow path first pushes the frame again above the stack pointer and passes
  the frame as a root, so the collector relocates the stored fields.
  The continuation frame of the call adds zero words to the first reservation.
  The code pushes it on the thread stack and calls the runtime only when it
  needs a new chunk. The runtime charges the new chunk to the nursery, so the
  next heap check loads the changed heap limit from the capability.
