  data @aihc_lir_bitmap_0 align 1 = { bytes "\x00" }

  data @aihc_c_aihc_entry_Just_0 align 8 = { ptr @aihc_c_aihc_entry_Just_0, ptr @aihc_lir_bitmap_0, ptr null, code null, ptr null, i8 1, i8 0, i8 0, i8 0, i8 0, i8 0, i16 0 }
status: pass
reason: |
  A case that can match no alternative has a default that is a case without
  alternatives. The last data alternative thus keeps its comparison, and a
  value that it does not match calls aihc_no_match and traps. The failure
  does not load the header of the object again.
