  func @aihc_lir_collect_replay_p(%hp_37: ptr, %hp_limit_38: ptr, %sp_39: ptr, %sp_limit_40: ptr, %value_41: ptr, %code_42: code, %words_43: i64, %srt_44: ptr) {
  entry:
    %roots_45 = stack.alloc 8 align 8
    store ptr %value_41, [%roots_45] align 8
    %capability_46 = load ptr [%sp_limit_40 - 4040] align 1 word
    store ptr %hp_37, [%capability_46 + 16] align 1 word
    store ptr %sp_39, [%capability_46 + 32] align 1 word
    call @aihc_heap_collect(%capability_46, %words_43, 1, %roots_45, %srt_44)
    %value_47 = load ptr [%roots_45] align 8
    %hp_48 = load ptr [%capability_46 + 16] align 1 word
    %hp_limit_49 = load ptr [%capability_46 + 24] align 1 word
    tailcall.indirect %code_42(%hp_48, %hp_limit_49, %sp_39, %sp_limit_40, %value_47) : (ptr, ptr, ptr, ptr, ptr)
