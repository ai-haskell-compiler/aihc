check-prim-bounds: true
program: |
  primitive newByteArray#%1 :: BoxedRep Unlifted/1
  primitive readWordArray#%2 :: WordRep/2

  $entry -> WordRep =
    (array%3 :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) newByteArray# (8 :: IntRep)
    primitive-call @WordRep readWordArray# (array%3 :: BoxedRep Unlifted) (4 :: IntRep)
expected: |
  extern func @aihc_byte_array_bounds_fail() cc c

  extern func @aihc_byte_array_new(ptr, i64) -> ptr cc c

  extern func @aihc_byte_array_words(i64, i64, i64) -> i64 cc c

  extern func @aihc_heap_collect(ptr, i64, i64, ptr, ptr) cc c

  extern func @aihc_lir_continue_i(ptr, ptr, i64)

  func @aihc_f_aihc_entry___sentry(%machine_0: ptr, %$cps_return_1: ptr) {
  entry:
    %roots_2 = stack.alloc 8 align 8
    %result_3 = call @aihc_byte_array_words(8, 0, 8)
    %heap_4 = load ptr [%machine_0 + 24] align 1 word
    %heap_end_5 = load ptr [%machine_0 + 32] align 1 word
    %heap_word_6 = ptr.to_int %heap_4
    %heap_end_word_7 = ptr.to_int %heap_end_5
    %heap_room_8 = sub i64 %heap_end_word_7, %heap_word_6
    %heap_room_words_9 = shr.u i64 %heap_room_8, 3
    %heap_fits_10 = ge.u i64 %heap_room_words_9, %result_3
    br %heap_fits_10, gc_reserved_12(%$cps_return_1), gc_collect_11

  cold gc_collect_11:
    store ptr %$cps_return_1, [%roots_2] align 8
    call @aihc_heap_collect(%machine_0, %result_3, 1, %roots_2, null)
    %$cps_return$gc_14 = load ptr [%roots_2] align 8
    jump gc_reserved_12(%$cps_return$gc_14)

  gc_reserved_12(%$cps_return$gc_13: ptr):
    %result_15 = call @aihc_byte_array_new(%machine_0, 8)
    %size_16 = load i64 [%result_15 + 8] align 8
    %limit_17 = div.u i64 %size_16, 8
    %invalid_18 = ge.u i64 4, %limit_17
    br %invalid_18, out_of_bounds_19, inside_20

  cold out_of_bounds_19:
    call @aihc_byte_array_bounds_fail()
    trap "byte array access is out of bounds"

  inside_20:
    %offset_21 = mul i64 4, 8
    %contents_22 = load ptr [%result_15 + 16] align 8
    %address_23 = ptr.add %contents_22, %offset_21
    %value_24 = load i64 [%address_23] align 1
    tailcall @aihc_lir_continue_i(%machine_0, %$cps_return$gc_13, %value_24)
  }
status: pass
reason: |
  With --check-prim-bounds the array primitive compares the index against the
  length of the array and branches to a call of aihc_byte_array_bounds_fail,
  which the same program without the flag does not mention at all.
