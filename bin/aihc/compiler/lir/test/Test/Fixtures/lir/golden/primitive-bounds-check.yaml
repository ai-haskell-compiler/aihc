check-prim-bounds: true
program: |
  primitive newByteArray#%1 :: BoxedRep Unlifted/1
  primitive readWordArray#%2 :: WordRep/2
  $entry -> WordRep =
    (array%3 :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) newByteArray# (8 :: IntRep)
    primitive-call @WordRep readWordArray# (array%3 :: BoxedRep Unlifted) (4 :: IntRep)
expected: |
  extern func @aihc_byte_array_bounds_fail() cc c

  extern func @aihc_heap_collect(ptr, i64, i64, ptr, ptr) cc c

  extern func @aihc_lir_continue_i(ptr, ptr, ptr, ptr, i64)

  extern data @aihc_byte_array_info

  func @aihc_f_aihc_entry___sentry(%hp_0: ptr, %sp_1: ptr, %base_2: ptr, %$cps_return_3: ptr) {
  entry:
    %roots_4 = stack.alloc 8 align 8
    %hp_limit_5 = load ptr [%base_2 + 24] align 1 word
    %heap_end_6 = ptr.add %hp_0, 24
    %heap_fits_7 = le.u ptr %heap_end_6, %hp_limit_5
    br %heap_fits_7, gc_reserved_9(%$cps_return_3, %hp_0), gc_collect_8

  cold gc_collect_8:
    tailcall @aihc_lir_collect_replay_p(%hp_0, %sp_1, %base_2, %$cps_return_3, @aihc_f_aihc_entry___sentry, 3, null)

  gc_reserved_9(%$cps_return$gc_10: ptr, %hp_11: ptr):
    %hp_12 = ptr.add %hp_11, 24
    store ptr @aihc_byte_array_info, [%hp_11] align 8 region heap
    store i64 8, [%hp_11 + 8] align 8 region heap
    %size_13 = load i64 [%hp_11 + 8] align 8 region heap
    %limit_14 = div.u i64 %size_13, 8
    %invalid_15 = ge.u i64 4, %limit_14
    br %invalid_15, out_of_bounds_16, inside_17

  cold out_of_bounds_16:
    call @aihc_byte_array_bounds_fail()
    trap "byte array access is out of bounds"

  inside_17:
    %offset_18 = shl i64 4, 3
    %contents_19 = ptr.add %hp_11, 16
    %address_20 = ptr.add %contents_19, %offset_18
    %value_21 = load i64 [%address_20] align 1
    %header_word_22 = load i64 [%$cps_return$gc_10] align 8 region stack
    %info_word_23 = and i64 %header_word_22, -4
    %header_24 = ptr.from_int %info_word_23
    %entry_25 = load.invariant code [%header_24 + 24] align 1 word
    %forward_28 = eq code %entry_25, null
    br %forward_28, continue_slow_26, continue_enter_27

  cold continue_slow_26:
    tailcall @aihc_lir_continue_i(%hp_12, %sp_1, %base_2, %$cps_return$gc_10, %value_21)

  continue_enter_27:
    tailcall.indirect %entry_25(%hp_12, %$cps_return$gc_10, %base_2, %$cps_return$gc_10, %value_21) : (ptr, ptr, ptr, ptr, i64)
  }

  func @aihc_lir_collect_replay_p(%hp_29: ptr, %sp_30: ptr, %base_31: ptr, %value_32: ptr, %code_33: code, %words_34: i64, %srt_35: ptr) {
  entry:
    %roots_36 = stack.alloc 8 align 8
    store ptr %value_32, [%roots_36] align 8
    store ptr %hp_29, [%base_31 + 16] align 1 word
    store ptr %sp_30, [%base_31 + 32] align 1 word
    call @aihc_heap_collect(%base_31, %words_34, 1, %roots_36, %srt_35)
    %value_37 = load ptr [%roots_36] align 8
    %hp_38 = load ptr [%base_31 + 16] align 1 word
    tailcall.indirect %code_33(%hp_38, %sp_30, %base_31, %value_37) : (ptr, ptr, ptr, ptr)
  }
status: pass
reason: |
  With --check-prim-bounds the array primitive compares the index against the
  length of the array and branches to a call of aihc_byte_array_bounds_fail,
  which the same program without the flag does not mention at all.
  The array has a fixed size of 8 bytes, so a normal heap check of three
  words covers it. The lowering writes the two header words in the heap.
  The calls of aihc_byte_array_words, aihc_heap_allocate, and
  aihc_byte_array_initialize do not occur.
