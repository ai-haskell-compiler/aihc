    %heap_fits_13 = and i1 %heap_below_limit_9, %heap_enough_12
    br %heap_fits_13, gc_reserved_15(%$cps_return_4, %hp_0, %hp_limit_1), gc_collect_14

  cold gc_collect_14:
    store ptr %$cps_return_4, [%roots_5] align 8
    %capability_19 = load ptr [%sp_limit_3 - 4040] align 1 word
    store ptr %hp_0, [%capability_19 + 16] align 1 word
    store ptr %sp_2, [%capability_19 + 32] align 1 word
    call @aihc_heap_collect(%capability_19, %result_6, 1, %roots_5, null)
    %$cps_return$gc_20 = load ptr [%roots_5] align 8
