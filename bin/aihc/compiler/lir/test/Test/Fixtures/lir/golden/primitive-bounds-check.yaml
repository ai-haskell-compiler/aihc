check-prim-bounds: true
program: |
  primitive newByteArray#%1 :: BoxedRep Unlifted/1
  primitive readWordArray#%2 :: WordRep/2
  $entry -> WordRep =
    (array%3 :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) newByteArray# (8 :: IntRep)
    primitive-call @WordRep readWordArray# (array%3 :: BoxedRep Unlifted) (4 :: IntRep)
expected: |
  extern func @aihc_byte_array_bounds_fail() cc c

  extern func @aihc_heap_collect(ptr, i64, i64, ptr, ptr) cc c

  extern func @aihc_lir_continue_i(ptr, ptr, ptr, ptr, ptr, i64)

  extern data @aihc_byte_array_info

  func @aihc_f_aihc_entry___sentry(%hp_0: ptr, %hp_limit_1: ptr, %sp_2: ptr, %sp_limit_3: ptr, %$cps_return_4: ptr) {
  entry:
    %roots_5 = stack.alloc 8 align 8
    %heap_end_6 = ptr.add %hp_0, 56
    %heap_fits_7 = le.u ptr %heap_end_6, %hp_limit_1
    br %heap_fits_7, gc_reserved_9(%$cps_return_4, %hp_0, %hp_limit_1), gc_collect_8

  cold gc_collect_8:
    tailcall @aihc_lir_collect_replay_p(%hp_0, %hp_limit_1, %sp_2, %sp_limit_3, %$cps_return_4, @aihc_f_aihc_entry___sentry, 7, null)

  gc_reserved_9(%$cps_return$gc_10: ptr, %hp_11: ptr, %hp_limit_12: ptr):
    %hp_13 = ptr.add %hp_11, 56
    %contents_14 = ptr.add %hp_11, 48
    store ptr @aihc_byte_array_info, [%hp_11] align 8 region heap
    store i64 8, [%hp_11 + 8] align 8 region heap
    store ptr %contents_14, [%hp_11 + 16] align 8 region heap
    store i64 0, [%hp_11 + 24] align 8 region heap
    store i64 8, [%hp_11 + 32] align 8 region heap
    store i64 7, [%hp_11 + 40] align 8 region heap
    %size_15 = load i64 [%hp_11 + 8] align 8 region heap
    %limit_16 = div.u i64 %size_15, 8
    %invalid_17 = ge.u i64 4, %limit_16
    br %invalid_17, out_of_bounds_18, inside_19

  cold out_of_bounds_18:
    call @aihc_byte_array_bounds_fail()
    trap "byte array access is out of bounds"

  inside_19:
    %offset_20 = shl i64 4, 3
    %contents_21 = load ptr [%hp_11 + 16] align 8 region heap
    %address_22 = ptr.add %contents_21, %offset_20
    %value_23 = load i64 [%address_22] align 1
    %header_word_24 = load i64 [%$cps_return$gc_10] align 8 region stack
    %info_word_25 = and i64 %header_word_24, -4
    %header_26 = ptr.from_int %info_word_25
    %entry_27 = load.invariant code [%header_26 + 24] align 1 word
    %chunk_word_28 = ptr.to_int %$cps_return$gc_10
    %chunk_last_29 = or i64 %chunk_word_28, 4095
    %chunk_end_30 = add i64 %chunk_last_29, 1
    %sp_limit_31 = ptr.from_int %chunk_end_30
    %forward_35 = eq code %entry_27, null
    br %forward_35, continue_slow_32, continue_chunk_33

  continue_chunk_33:
    %same_chunk_36 = eq ptr %sp_limit_31, %sp_limit_3
    br %same_chunk_36, continue_enter_34, continue_slow_32

  cold continue_slow_32:
    tailcall @aihc_lir_continue_i(%hp_13, %hp_limit_12, %sp_2, %sp_limit_3, %$cps_return$gc_10, %value_23)

  continue_enter_34:
    tailcall.indirect %entry_27(%hp_13, %hp_limit_12, %$cps_return$gc_10, %sp_limit_3, %$cps_return$gc_10, %value_23) : (ptr, ptr, ptr, ptr, ptr, i64)
