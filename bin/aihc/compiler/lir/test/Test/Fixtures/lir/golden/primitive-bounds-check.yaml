check-prim-bounds: true
program: |
  primitive newByteArray#%1 :: BoxedRep Unlifted/1
  primitive readWordArray#%2 :: WordRep/2
  $entry -> WordRep =
    (array%3 :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) newByteArray# (8 :: IntRep)
    primitive-call @WordRep readWordArray# (array%3 :: BoxedRep Unlifted) (4 :: IntRep)
expected: |
  extern func @aihc_byte_array_bounds_fail() cc c

  extern func @aihc_byte_array_initialize(ptr, i64, i64, i64) -> ptr cc c

  extern func @aihc_byte_array_words(i64, i64, i64) -> i64 cc c

  extern func @aihc_heap_allocate(ptr, i64, i64, i64, ptr, ptr) -> ptr cc c

  extern func @aihc_lir_continue_i(ptr, ptr, ptr, ptr, ptr, i64)

  func @aihc_f_aihc_entry___sentry(%hp_0: ptr, %hp_limit_1: ptr, %sp_2: ptr, %sp_limit_3: ptr, %$cps_return_4: ptr) {
  entry:
    %roots_5 = stack.alloc 8 align 8
    %result_6 = call @aihc_byte_array_words(8, 0, 8)
    store ptr %$cps_return_4, [%roots_5] align 8
    %capability_7 = load ptr [%sp_limit_3 - 4040] align 1 word
    store ptr %hp_0, [%capability_7 + 16] align 1 word
    store ptr %sp_2, [%capability_7 + 32] align 1 word
    %result_8 = call @aihc_heap_allocate(%capability_7, %result_6, 0, 1, %roots_5, null)
    %$cps_return$gc_9 = load ptr [%roots_5] align 8
    %hp_10 = load ptr [%capability_7 + 16] align 1 word
    %hp_limit_11 = load ptr [%capability_7 + 24] align 1 word
    %result_12 = call @aihc_byte_array_initialize(%result_8, 8, 0, 8)
    %size_13 = load i64 [%result_12 + 8] align 8
    %limit_14 = div.u i64 %size_13, 8
    %invalid_15 = ge.u i64 4, %limit_14
    br %invalid_15, out_of_bounds_16, inside_17

  cold out_of_bounds_16:
    call @aihc_byte_array_bounds_fail()
    trap "byte array access is out of bounds"

  inside_17:
    %offset_18 = mul i64 4, 8
    %contents_19 = load ptr [%result_12 + 16] align 8
    %address_20 = ptr.add %contents_19, %offset_18
    %value_21 = load i64 [%address_20] align 1
    tailcall @aihc_lir_continue_i(%hp_10, %hp_limit_11, %sp_2, %sp_limit_3, %$cps_return$gc_9, %value_21)
  }
status: pass
reason: |
  With --check-prim-bounds the array primitive compares the index against the
  length of the array and branches to a call of aihc_byte_array_bounds_fail,
  which the same program without the flag does not mention at all.
