  data @aihc_c_aihc_entry_Box_0 align 8 = { ptr @aihc_c_aihc_entry_Box_0, ptr @aihc_lir_bitmap_0, ptr null, code null, ptr null, i8 1, i8 0, i8 0, i8 0, i8 0 }

  data @aihc_constructor_aihc_entry_Box_partial align 8 = { ptr @aihc_c_aihc_entry_Box_0, ptr @aihc_lir_bitmap_0, ptr @aihc_c_aihc_entry_Box_0, code null, ptr null, i8 1, i8 1, i8 0, i8 3, i8 0 }
status: pass
reason: |
  The shape every managed allocation takes. The reservation compares the bump
  pointer against the end of the space and branches; the fast path carries the
  live roots as block parameters and the slow path is the only one that spills
  them, calls the collector and reloads what moved. The store itself loads the
  bump pointer, advances it by the words of the object, and writes the header
  and the field. The module also pins the info tables of a constructor and of
  its partial stage.
