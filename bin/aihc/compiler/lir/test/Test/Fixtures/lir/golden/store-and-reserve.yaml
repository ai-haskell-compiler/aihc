status: pass
reason: |
  The shape every managed allocation takes. The reservation compares the bump
  pointer against the end of the space and branches. The fast path carries the
  live roots as block parameters. No code before the reservation has an effect,
  so the slow path is one tail call to a shared replay helper. The helper spills
  the arguments of the function, calls the collector, and enters the function
  again with the arguments that moved. The store itself loads the
  bump pointer, advances it by the words of the object, and writes the header
  and the field. The module also pins the info tables of a constructor and of
  its partial stage.
