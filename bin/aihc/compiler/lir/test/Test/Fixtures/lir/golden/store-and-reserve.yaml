program: |
  constructor Box/1 [IntRep]

  $entry -> BoxedRep Lifted =
    store (CBox (1 :: IntRep))
expected: |
  extern func @aihc_heap_collect(ptr, i64, i64, ptr, ptr) cc c

  extern func @aihc_lir_continue_p(ptr, ptr, ptr)

  func @aihc_f_aihc_entry___sentry(%machine_0: ptr, %$cps_return_1: ptr) {
  entry:
    %roots_2 = stack.alloc 8 align 8
    %heap_3 = load ptr [%machine_0 + 24] align 1 word
    %heap_end_4 = load ptr [%machine_0 + 32] align 1 word
    %heap_word_5 = ptr.to_int %heap_3
    %heap_end_word_6 = ptr.to_int %heap_end_4
    %heap_room_7 = sub i64 %heap_end_word_6, %heap_word_5
