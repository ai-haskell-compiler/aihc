program: |
  constructor Box/1 [IntRep]

  $entry -> BoxedRep Lifted =
    store (CBox (1 :: IntRep))
expected: |
  extern func @aihc_heap_collect(ptr, i64, i64, ptr, ptr) cc c

  extern func @aihc_lir_continue_p(ptr, ptr, ptr, ptr, ptr, ptr)

  func @aihc_f_aihc_entry___sentry(%hp_0: ptr, %hp_limit_1: ptr, %sp_2: ptr, %sp_limit_3: ptr, %$cps_return_4: ptr) {
  entry:
    %roots_5 = stack.alloc 8 align 8
    %heap_end_6 = ptr.add %hp_0, 16
    %heap_fits_7 = le.u ptr %heap_end_6, %hp_limit_1
    br %heap_fits_7, gc_reserved_9(%$cps_return_4, %hp_0, %hp_limit_1), gc_collect_8

  cold gc_collect_8:
    tailcall @aihc_lir_collect_replay_p(%hp_0, %hp_limit_1, %sp_2, %sp_limit_3, %$cps_return_4, @aihc_f_aihc_entry___sentry, 2, null)

  gc_reserved_9(%$cps_return$gc_10: ptr, %hp_11: ptr, %hp_limit_12: ptr):
    %hp_13 = ptr.add %hp_11, 16
    store ptr @aihc_c_aihc_entry_Box_0, [%hp_11] align 8 region heap
    store i64 1, [%hp_11 + 8] align 8 region heap
    tailcall @aihc_lir_continue_p(%hp_13, %hp_limit_12, %sp_2, %sp_limit_3, %$cps_return$gc_10, %hp_11)
  }

  data @aihc_lir_bitmap_0 align 1 = { bytes "\x00" }

  data @aihc_c_aihc_entry_Box_0 align 8 = { ptr @aihc_c_aihc_entry_Box_0, ptr @aihc_lir_bitmap_0, ptr null, code null, ptr null, i8 1, i8 0, i8 0, i8 0, i8 0, i8 0, i16 0 }

  func @aihc_lir_collect_replay_p(%hp_14: ptr, %hp_limit_15: ptr, %sp_16: ptr, %sp_limit_17: ptr, %value_18: ptr, %code_19: code, %words_20: i64, %srt_21: ptr) {
  entry:
    %roots_22 = stack.alloc 8 align 8
    store ptr %value_18, [%roots_22] align 8
    %capability_23 = load ptr [%sp_limit_17 - 4040] align 1 word
    store ptr %hp_14, [%capability_23 + 16] align 1 word
    store ptr %sp_16, [%capability_23 + 32] align 1 word
    call @aihc_heap_collect(%capability_23, %words_20, 1, %roots_22, %srt_21)
    %value_24 = load ptr [%roots_22] align 8
    %hp_25 = load ptr [%capability_23 + 16] align 1 word
    %hp_limit_26 = load ptr [%capability_23 + 24] align 1 word
    tailcall.indirect %code_19(%hp_25, %hp_limit_26, %sp_16, %sp_limit_17, %value_24) : (ptr, ptr, ptr, ptr, ptr)
