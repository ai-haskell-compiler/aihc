program: |
  constructor Box/1 [IntRep]

  $entry -> BoxedRep Lifted =
    store (CBox (1 :: IntRep))
expected: |
  extern func @aihc_heap_collect(ptr, i64, i64, ptr, ptr) cc c

  extern func @aihc_lir_continue_p(ptr, ptr, ptr, ptr, ptr, ptr, ptr)

  func @aihc_f_aihc_entry___sentry(%machine_0: ptr, %hp_1: ptr, %hp_limit_2: ptr, %sp_3: ptr, %sp_limit_4: ptr, %$cps_return_5: ptr) {
  entry:
    %roots_6 = stack.alloc 8 align 8
    %heap_end_7 = ptr.add %hp_1, 16
    %heap_fits_8 = le.u ptr %heap_end_7, %hp_limit_2
    br %heap_fits_8, gc_reserved_10(%$cps_return_5, %hp_1, %hp_limit_2), gc_collect_9

  gc_collect_9:
    store ptr %$cps_return_5, [%roots_6] align 8
    store ptr %hp_1, [%machine_0 + 24] align 1 word
    store ptr %sp_3, [%machine_0 + 40] align 1 word
    call @aihc_heap_collect(%machine_0, 2, 1, %roots_6, null)
    %$cps_return$gc_14 = load ptr [%roots_6] align 8
    %hp_15 = load ptr [%machine_0 + 24] align 1 word
    %hp_limit_16 = load ptr [%machine_0 + 32] align 1 word
    jump gc_reserved_10(%$cps_return$gc_14, %hp_15, %hp_limit_16)

  gc_reserved_10(%$cps_return$gc_11: ptr, %hp_12: ptr, %hp_limit_13: ptr):
    %hp_17 = ptr.add %hp_12, 16
    store ptr @aihc_c_aihc_entry_Box_0, [%hp_12] align 8
