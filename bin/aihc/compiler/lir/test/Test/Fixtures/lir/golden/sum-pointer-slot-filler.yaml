status: pass
reason: |
  The first alternative of the sum has no field, so the pointer slot of the
  sum gets a filler. The filler has the pointer type, the same type as the
  slot in the other alternative. On wasm32 a pointer is narrower than an
  integer, and a continuation with a different type traps.
