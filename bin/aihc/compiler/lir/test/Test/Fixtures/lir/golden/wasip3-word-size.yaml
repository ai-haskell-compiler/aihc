  export data @aihc_c_aihc_entry_Box_0 align 4 = { ptr @aihc_c_aihc_entry_Box_0, ptr @aihc_lir_bitmap_0, ptr null, code null, ptr null, i8 1, i8 0, i8 0, i8 0 }

  export data @aihc_constructor_aihc_entry_Box_partial align 4 = { ptr @aihc_c_aihc_entry_Box_0, ptr @aihc_lir_bitmap_0, ptr @aihc_c_aihc_entry_Box_0, code null, ptr null, i8 1, i8 1, i8 0, i8 3 }
status: pass
reason: |
  The same program on the 32-bit target. A heap slot is eight bytes everywhere,
  so the field offsets are unchanged, but a pointer is four bytes: the machine
  fields move to their 32-bit offsets and a pointer stored in a slot travels
  through an i64.
