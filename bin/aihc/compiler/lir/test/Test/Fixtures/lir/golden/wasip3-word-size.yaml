    %slot_17 = ptr.to_int @aihc_c_aihc_entry_Box_0
    store i64 %slot_17, [%object_15] align 8
    store i64 1, [%object_15 + 8] align 8
    tailcall @aihc_lir_continue_p(%machine_0, %$cps_return$gc_11, %object_15)
