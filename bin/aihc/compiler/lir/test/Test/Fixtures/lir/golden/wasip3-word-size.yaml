status: pass
reason: |
  The same program on the 32-bit target. A heap slot is eight bytes everywhere,
  so the field offsets are unchanged, but a pointer is four bytes: the machine
  fields move to their 32-bit offsets and a pointer stored in a slot travels
  through an i64.
