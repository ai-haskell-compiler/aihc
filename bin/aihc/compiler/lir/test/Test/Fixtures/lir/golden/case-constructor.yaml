check-data-references: true
program: |
  constructor Nothing/0 []
  constructor Just/1 [IntRep]

  $entry (value%1 :: BoxedRep Lifted) -> IntRep =
    case (value%1 :: BoxedRep Lifted) as scrutinee%2 :: BoxedRep Lifted of
      data Nothing ->
        constant (0 :: IntRep)
      data Just (payload%3 :: IntRep) ->
        constant (payload%3 :: IntRep)
expected: |
  extern func @aihc_lir_continue_i(ptr, ptr, ptr, ptr, ptr, i64)

  func @aihc_f_aihc_entry___sentry(%hp_0: ptr, %hp_limit_1: ptr, %sp_2: ptr, %sp_limit_3: ptr, %value_4: ptr, %$cps_return_5: ptr) {
  entry:
    %header_word_8 = load i64 [%value_4] align 8 region heap
    %info_word_9 = and i64 %header_word_8, -4
    %header_10 = ptr.from_int %info_word_9
    %matches_11 = eq ptr %header_10, @aihc_c_aihc_entry_Nothing_0
    br %matches_11, alt_6, alt_7

  alt_6:
    %header_word_12 = load i64 [%$cps_return_5] align 8 region stack
    %info_word_13 = and i64 %header_word_12, -4
    %header_14 = ptr.from_int %info_word_13
    %entry_15 = load.invariant code [%header_14 + 24] align 1 word
    %forward_18 = eq code %entry_15, null
    br %forward_18, continue_slow_16, continue_enter_17

  cold continue_slow_16:
    tailcall @aihc_lir_continue_i(%hp_0, %hp_limit_1, %sp_2, %sp_limit_3, %$cps_return_5, 0)

  continue_enter_17:
    tailcall.indirect %entry_15(%hp_0, %hp_limit_1, %$cps_return_5, %sp_limit_3, %$cps_return_5, 0) : (ptr, ptr, ptr, ptr, ptr, i64)

  alt_7:
    %payload_19 = load i64 [%value_4 + 8] align 8 region heap
    %header_word_20 = load i64 [%$cps_return_5] align 8 region stack
    %info_word_21 = and i64 %header_word_20, -4
    %header_22 = ptr.from_int %info_word_21
    %entry_23 = load.invariant code [%header_22 + 24] align 1 word
    %forward_26 = eq code %entry_23, null
    br %forward_26, continue_slow_24, continue_enter_25

  cold continue_slow_24:
    tailcall @aihc_lir_continue_i(%hp_0, %hp_limit_1, %sp_2, %sp_limit_3, %$cps_return_5, %payload_19)

  continue_enter_25:
    tailcall.indirect %entry_23(%hp_0, %hp_limit_1, %$cps_return_5, %sp_limit_3, %$cps_return_5, %payload_19) : (ptr, ptr, ptr, ptr, ptr, i64)
  }

  data @aihc_c_aihc_entry_Nothing_0 align 8 = { ptr @aihc_c_aihc_entry_Nothing_0, ptr null, ptr null, code null, ptr null, i8 0, i8 0, i8 0, i8 0, i8 0, i8 1, i16 0 }
status: pass
reason: |
  A case on a pointer with fewer than four constructor alternatives loads the
  header and the identity field of the object and
  compares it with each constructor table in turn, so the alternatives become a
  chain of two-way branches rather than a switch. The case has no default, so
  it matches each value, and the last alternative needs no comparison. A bound
  field is loaded from its slot only in the alternative that uses it.
