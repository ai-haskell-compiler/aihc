status: pass
reason: |
  A case on a pointer with fewer than four constructor alternatives loads the
  header and the identity field of the object and
  compares it with each constructor table in turn, so the alternatives become a
  chain of two-way branches rather than a switch. The case has no default, so
  it matches each value, and the last alternative needs no comparison. A bound
  field is loaded from its slot only in the alternative that uses it.
