entry: $entry
gc-stress: true
source: |
  module Test where
  import GHC.Prim
  data Int = I# Int#
  data Unit = Unit
  data FunPtr a = FunPtr Addr#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall "wrapper" wrap :: (Int -> IO Int) -> IO (FunPtr (Int -> IO Int))
  foreign import ccall "dynamic" invoke :: FunPtr (Int -> IO Int) -> Int -> IO Int
  foreign import ccall unsafe "aihc_free_haskell_fun_ptr" free :: FunPtr a -> IO Unit
  burn :: Int# -> Int -> State# RealWorld -> (# State# RealWorld, Int #)
  burn n value state = case n of
    0# -> (# state, value #)
    _ -> case newMutVar# value state of
      (# next, variable #) -> case readMutVar# variable next of
        (# done, result #) -> burn (n -# 1#) result done
  callback value = IO (burn 50000# value)
  value = runRW# (\s -> case wrap callback of
    IO make -> case make s of
      (# s1, f #) -> case invoke f (I# 42#) of
        IO call -> case call s1 of
          (# s2, I# answer #) -> case free f of
            IO release -> case release s2 of
              (# _, _ #) -> I# answer)
return: "@0"
heap: |
  @0 = CI# 42
status: pass
reason: A callback must reserve heap space before each mutable reference allocation.
