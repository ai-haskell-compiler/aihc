  small _ = 0#
  wide :: (# Int8# | Word64# #) -> Word64#
  wide (# | n #) = n
  wide _ = 0#Word64
  floating :: (# Float# | Double# #) -> Float#
  floating (# n | #) = n
  floating _ = castWord32ToFloat# 0#Word32
  double :: (# Float# | Double# #) -> Double#
  double (# | n #) = n
  double _ = castWord64ToDouble# 0#Word64
  address :: (# Addr# | Int# #) -> Int#
  address (# p | #) = addr2Int# p
  address (# | n #) = n
  value = Result
    (small (# intToInt8# 128# | #))
    (wide (# | 18446744073709551615#Word64 #))
    (floating (# castWord32ToFloat# 1069547520#Word32 | #))
    (double (# | castWord64ToDouble# 4612811918334230528#Word64 #))
    (address (# nullAddr# | #))
