entry: $entry
gc-stress: false
source: |
  module Test where
  import GHC.Prim
  data Int32 = I32# Int32#
  data Result = Result Int# Int# Int# Int# Int# Int# Int# Int# Int#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall unsafe "stg_sig_install" install :: Int32 -> Int32 -> Addr# -> IO Int32
  foreign import ccall "&nocldstop" stopFlag :: Addr#
  foreign import ccall unsafe "raise" raise :: Int32 -> IO Int32
  run :: IO Int32 -> State# RealWorld -> (# State# RealWorld, Int# #)
  run (IO action) s = case action s of
    (# s1, I32# n #) -> (# s1, int32ToInt# n #)
  code :: Int# -> Int32
  code n = I32# (intToInt32# n)
  hangup = code 1#
  kill = code 9#
  ignore = code (negateInt# 2#)
  defaultAction = code (negateInt# 1#)
  handle = code (negateInt# 4#)
  value = runRW# (\s ->
    case run (install hangup ignore nullAddr#) s of
      (# s1, first #) -> case run (raise hangup) s1 of
        (# s2, raised #) -> case run (install hangup handle nullAddr#) s2 of
          (# s3, handled #) -> case run (install hangup defaultAction nullAddr#) s3 of
            (# s4, restored #) -> case run (install hangup defaultAction nullAddr#) s4 of
              (# s5, again #) -> case run (install kill ignore nullAddr#) s5 of
                (# s6, killed #) -> case run (install (code 0#) ignore nullAddr#) s6 of
                  (# s7, invalid #) -> case run (install hangup (code 7#) nullAddr#) s7 of
                    (# s8, unknown #) -> case readInt64OffAddr# stopFlag 0# s8 of
                      (# _, flag #) -> Result first raised handled restored again killed invalid unknown (int64ToInt# flag))
return: "@0"
heap: |
  @0 = CResult -1 0 -3 -2 -1 -3 -3 -3 0
status: pass
reason: >-
  The unix package installs the default and ignore actions through stg_sig_install.
  The runtime refuses a Haskell handler, an invalid signal, and an unknown action code.
