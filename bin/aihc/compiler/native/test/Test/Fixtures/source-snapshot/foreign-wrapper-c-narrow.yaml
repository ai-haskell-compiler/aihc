  module Test where
  import GHC.Prim
  data Int = I# Int#
  data Unit = Unit
  data FunPtr a = FunPtr Addr#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall "wrapper" wrap :: (Int8# -> Int8#) -> IO (FunPtr (Int8# -> Int8#))
  foreign import ccall safe "aihc_test_narrow" check :: FunPtr (Int8# -> Int8#) -> Int
  foreign import ccall unsafe "aihc_free_haskell_fun_ptr" free :: FunPtr a -> IO Unit
  identity :: Int8# -> Int8#
  identity n = intToInt8# (int8ToInt# n)
  value = runRW# (\s -> case wrap identity of
    IO make -> case make s of
      (# s1, callback #) -> case check callback of
        I# answer -> case free callback of
          IO release -> case release s1 of
            (# _, _ #) -> I# answer)
