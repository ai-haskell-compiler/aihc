entry: $entry
gc-stress: true
source: |
  module Test where
  import GHC.Prim
  data Int = I# Int#
  data Unit = Unit
  data FunPtr a = FunPtr Addr#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall "wrapper" wrap :: (Int -> Int) -> IO (FunPtr (Int -> Int))
  foreign import ccall "dynamic" invoke :: FunPtr (Int -> Int) -> Int -> Int
  foreign import ccall unsafe "aihc_free_haskell_fun_ptr" free :: FunPtr a -> IO Unit
  add (I# n) (I# m) = I# (n +# m)
  loop n s = case n of
    0# -> I# 42#
    _ -> case wrap (add (I# n)) of
      IO make -> case make s of
        (# s1, callback #) -> case invoke callback (I# 0#) of
          I# answer -> case answer ==# n of
            1# -> case free callback of
              IO release -> case release s1 of
                (# s2, _ #) -> loop (n -# 1#) s2
            _ -> I# 0#
  value = runRW# (loop 80#)
return: "@0"
heap: |
  @0 = CI# 42
status: pass
reason: Slot reuse permits more total callbacks than the pool capacity.
