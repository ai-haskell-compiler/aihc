source: |
  module Test where
  import GHC.Prim
  data Int = I# Int#
  data Unit = Unit
  data FunPtr a = FunPtr Addr#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall "wrapper" wrap :: (Int -> Int) -> IO (FunPtr (Int -> Int))
  foreign import ccall "dynamic" invoke :: FunPtr (Int -> Int) -> Int -> Int
  foreign import ccall unsafe "aihc_free_haskell_fun_ptr" free :: FunPtr a -> IO Unit
  foreign import ccall safe "aihc_test_call_twice" twice :: FunPtr (Int -> Int) -> Int -> Int
  add (I# x) (I# y) = I# (x +# y)
  value = runRW# (\s -> case wrap (add (I# 1#)) of
    IO make -> case make s of
      (# s1, f #) -> case twice f (I# 20#) of
        I# answer -> case free f of
          IO release -> case release s1 of
            (# _, _ #) -> I# answer)
c-source: |
  #include <stdint.h>
  int64_t aihc_test_call_twice(int64_t (*callback)(int64_t), int64_t value) {
    return callback(value) + callback(value);
  }
