entry: $entry
gc-stress: true
source: |
  module Test where
  import GHC.Prim
  data Int = I# Int#
  data Unit = Unit
  data FunPtr a = FunPtr Addr#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall "wrapper" wrap :: (Int -> Int) -> IO (FunPtr (Int -> Int))
  foreign import ccall "dynamic" invoke :: FunPtr (Int -> Int) -> Int -> Int
  foreign import ccall unsafe "aihc_free_haskell_fun_ptr" free :: FunPtr a -> IO Unit
  add (I# n) (I# m) = I# (n +# m)
  nested f n = invoke f n
  value = runRW# (\s -> case wrap (add (I# 20#)) of
    IO make -> case make s of
      (# s1, first #) -> case wrap (nested first) of
        IO makeSecond -> case makeSecond s1 of
          (# s2, second #) -> case invoke second (I# 22#) of
            I# answer -> case free second of
              IO release -> case release s2 of
                (# s3, _ #) -> case free first of
                  IO releaseFirst -> case releaseFirst s3 of
                    (# _, _ #) -> I# answer)
return: "@0"
heap: |
  @0 = CI# 42
status: pass
reason: Nested callbacks keep both closures and the suspended callers alive.
