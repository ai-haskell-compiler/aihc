entry: $entry
gc-stress: true
rts-arguments: ["+RTS", "-M8192", "-RTS"]
source: |
  module Test where
  import GHC.Prim
  import Aihc.Prim.IO
  foreign import prim submitIOWrite# :: IOHandle# -> Addr# -> Int# -> Int# -> State# RealWorld -> (# State# RealWorld, IORequest# #)
  data Result = Result Int#
  foreign import prim stdoutIOHandle# :: IOHandle#
  foreign import prim takeIOResult# :: IORequest# -> Int#
  burn :: Int# -> State# RealWorld -> State# RealWorld
  burn n state = case n of
    0# -> state
    _ -> case newPinnedByteArray# 256# state of
      (# next, array #) -> case setByteArray# array 0# 256# 7# next of
        written -> burn (n -# 1#) written
  value = runRW# (\state ->
    case newPinnedByteArray# 8# state of
      (# next, array #) -> case writeWordArray# array 0# 42## next of
        written -> case mutableByteArrayContents# array of
          address -> case submitIOWrite# stdoutIOHandle# address 0# 0# written of
            (# submitted, request #) -> case touch# array submitted of
              retained -> case burn 100# retained of
                before -> case awaitIO# request before of
                  completed -> case burn 100# completed of
                    after -> case readWordOffAddr# address 0# after of
                      (# read, number #) -> case takeIOResult# request of
                        result -> Result (word2Int# number +# result))
return: "@0"
heap: |
  @0 = CResult 42
allocated-bytes:
  macos-arm64: 64336
  linux-amd64: 64336
status: pass
reason: A request must retain its pinned buffer before await and after completion.
