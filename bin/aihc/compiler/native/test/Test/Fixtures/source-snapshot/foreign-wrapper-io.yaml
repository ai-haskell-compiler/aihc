entry: $entry
gc-stress: true
source: |
  module Test where
  import GHC.Prim
  data Int = I# Int#
  data Unit = Unit
  data FunPtr a = FunPtr Addr#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall "wrapper" wrap :: (Int -> Int) -> IO (FunPtr (Int -> Int))
  foreign import ccall "dynamic" invoke :: FunPtr (Int -> Int) -> Int -> Int
  foreign import ccall unsafe "aihc_free_haskell_fun_ptr" free :: FunPtr a -> IO Unit
  foreign import ccall "wrapper" wrapIO :: (Int -> IO Int) -> IO (FunPtr (Int -> IO Int))
  foreign import ccall "dynamic" invokeIO :: FunPtr (Int -> IO Int) -> Int -> IO Int
  addIO (I# n) (I# m) = IO (\s -> case newMutVar# (I# (n +# m)) s of
    (# s1, ref #) -> readMutVar# ref s1)
  value = runRW# (\s -> case wrapIO (addIO (I# 20#)) of
    IO make -> case make s of
      (# s1, callback #) -> case invokeIO callback (I# 22#) of
        IO action -> case action s1 of
          (# s2, I# answer #) -> case free callback of
            IO release -> case release s2 of
              (# _, _ #) -> I# answer)
return: "@0"
heap: |
  @0 = CI# 42
status: pass
reason: An IO callback can allocate and use mutable references.
