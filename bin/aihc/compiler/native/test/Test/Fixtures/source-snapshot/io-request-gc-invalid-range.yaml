entry: $entry
gc-stress: true
source: |
  module Test where
  import GHC.Prim
  import Aihc.Prim.IO
  foreign import prim submitIOWrite# :: IOHandle# -> Addr# -> Int# -> Int# -> State# RealWorld -> (# State# RealWorld, IORequest# #)
  data Result = Result Int#
  foreign import prim stdoutIOHandle# :: IOHandle#
  foreign import prim takeIOResult# :: IORequest# -> Int#
  burn :: Int# -> State# RealWorld -> State# RealWorld
  burn n state = case n of
    0# -> state
    _ -> case newPinnedByteArray# 256# state of
      (# next, array #) -> case setByteArray# array 0# 256# 7# next of
        written -> burn (n -# 1#) written
  value = runRW# (\state ->
    case newPinnedByteArray# 8# state of
      (# next, array #) -> case mutableByteArrayContents# array of
        address -> case submitIOWrite# stdoutIOHandle# address 4# 8# next of
          (# submitted, request #) -> case touch# array submitted of
            retained -> case awaitIO# request retained of
              done -> Result (takeIOResult# request))
return: "@0"
heap: |
  @0 = CResult -23
allocated-bytes:
  macos-arm64: 216
  linux-amd64: 216
status: pass
reason: Submission must reject a slice outside its pinned byte-array owner.
