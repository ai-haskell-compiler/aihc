      fetch (P$first/1) (f :: BoxedRep Lifted)
    call @(BoxedRep Lifted) $first (a%1 :: BoxedRep Lifted) (x :: BoxedRep Lifted)

  $applyEither (f :: BoxedRep Lifted) (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    apply @(BoxedRep Lifted) (f :: BoxedRep Lifted) (x :: BoxedRep Lifted)

  $applyTwice (f :: BoxedRep Lifted) (x :: BoxedRep Lifted) (y :: BoxedRep Lifted) -> BoxedRep Lifted =
    g :: BoxedRep Lifted <-
