    r1 :: BoxedRep Lifted <-
      call @(BoxedRep Lifted) $applyKnown (known :: BoxedRep Lifted) (two :: BoxedRep Lifted)
    r2 :: BoxedRep Lifted <-
      call @(BoxedRep Lifted) $applyEither (firstOf :: BoxedRep Lifted) (r1 :: BoxedRep Lifted)
    r3 :: BoxedRep Lifted <-
      call @(BoxedRep Lifted) $applyEither (secondOf :: BoxedRep Lifted) (r2 :: BoxedRep Lifted)
    three :: BoxedRep Lifted <-
      store (P$three/2 (one :: BoxedRep Lifted))
    call @(BoxedRep Lifted) $applyTwice (three :: BoxedRep Lifted) (r3 :: BoxedRep Lifted) (two :: BoxedRep Lifted)
rewrites:
  dead-alternatives: 0
  evals-of-values: 4
