  constructor Pair [BoxedRep Lifted, BoxedRep Lifted]

  pub global entry = (F$entry)

  $first (a :: BoxedRep Lifted) (b :: BoxedRep Lifted) -> BoxedRep Lifted =
    constant (a :: BoxedRep Lifted)

  $second (a :: BoxedRep Lifted) (b :: BoxedRep Lifted) -> BoxedRep Lifted =
    constant (b :: BoxedRep Lifted)

  $three (a :: BoxedRep Lifted) (b :: BoxedRep Lifted) (c :: BoxedRep Lifted) -> BoxedRep Lifted =
    store (CPair (a :: BoxedRep Lifted) (c :: BoxedRep Lifted))

  $applyKnown (f :: BoxedRep Lifted) (x :: BoxedRep Lifted) -> BoxedRep Lifted =
