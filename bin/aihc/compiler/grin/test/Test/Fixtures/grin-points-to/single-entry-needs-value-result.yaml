program: |
  constructor I# [IntRep]

  pub global entry = (F$entry)

  $inner -> BoxedRep Lifted =
    store (CI# (1 :: IntRep))

  $passThrough (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    constant (x :: BoxedRep Lifted)

  $entry -> BoxedRep Lifted =
    inner :: BoxedRep Lifted <-
      store (F$inner)
    outer :: BoxedRep Lifted <-
      store (F$passThrough (inner :: BoxedRep Lifted))
    eval @(BoxedRep Lifted) (outer :: BoxedRep Lifted)
