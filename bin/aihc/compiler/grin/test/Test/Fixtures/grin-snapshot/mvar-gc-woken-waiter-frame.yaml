reason: A woken MVar waiter can stay in the remembered set, and its thread then pops the frame that the waiter named. The first thread waits in a nested call. An allocation of more than one nursery makes its waiter old, and the waiter of the second thread then makes it a remembered entry. After the wake, the first thread returns from the nested call, pushes one wide frame of integers over the popped frames, and allocates until a collection runs. The woken waiter must not name the popped frame, or the collection scans an integer as a frame header.
