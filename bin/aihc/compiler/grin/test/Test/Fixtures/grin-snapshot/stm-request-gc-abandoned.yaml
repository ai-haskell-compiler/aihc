entry: $entry
rts-arguments: ["+RTS", "-M2048", "-RTS"]
program: |
  primitive stmWaitRequest# :: BoxedRep Unlifted/0
  primitive awaitIO# :: TupleRep []/1
  primitive stmWaitResult# :: IntRep/1
  primitive newPromptTag# :: BoxedRep Unlifted/0
  primitive +# :: IntRep/2

  $loop (counter :: IntRep) -> IntRep =
    case (counter :: IntRep) as tested :: IntRep of
      20 ->
        constant (counter :: IntRep)
      _ ->
        (request :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) stmWaitRequest#
        (next :: IntRep) <- primitive-call @IntRep +# (counter :: IntRep) (1 :: IntRep)
        call @IntRep $loop (next :: IntRep)

  $entry -> IntRep =
    call @IntRep $loop (0 :: IntRep)
return: "20"
heap: "[]"
allocated-bytes:
  macos-arm64: 2560
  linux-amd64: 2560
status: pass
reason: Unreachable requests must become reclaimable without await or result consumption.
