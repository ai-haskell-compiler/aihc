entry: $entry
gc-stress: true
rts-arguments: ["+RTS", "-M512", "-RTS"]
program: |
  constructor Done/0 []
  primitive newMVar# :: BoxedRep Unlifted/0
  primitive readMVar# :: BoxedRep Lifted/1
  primitive putMVar# :: TupleRep []/2
  primitive fork# :: BoxedRep Unlifted/1
  primitive yield# :: TupleRep []/0
  primitive +# :: IntRep/2

  $child (cell :: BoxedRep Unlifted) -> BoxedRep Lifted =
    (value :: BoxedRep Lifted) <- primitive-call @(BoxedRep Lifted) readMVar# (cell :: BoxedRep Unlifted)
    () <- primitive-call @(TupleRep []) putMVar# (cell :: BoxedRep Unlifted) (value :: BoxedRep Lifted)
    store (CDone)

  $loop (counter :: IntRep) -> IntRep =
    case (counter :: IntRep) as tested :: IntRep of
      200 ->
        constant (counter :: IntRep)
      _ ->
        (cell :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) newMVar#
        (child :: BoxedRep Lifted) <- store (P$child/[[]] (cell :: BoxedRep Unlifted))
        (thread :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) fork# (child :: BoxedRep Lifted)
        () <- primitive-call @(TupleRep []) yield#
        (next :: IntRep) <- primitive-call @IntRep +# (counter :: IntRep) (1 :: IntRep)
        call @IntRep $loop (next :: IntRep)

  $entry -> IntRep =
    call @IntRep $loop (0 :: IntRep)
return: "200"
heap: "[]"
allocated-bytes:
  macos-arm64: 59200
  linux-amd64: 59200
status: pass
reason: The collector must reclaim unreachable cycles through an MVar, its waiter, and the waiter continuation.
