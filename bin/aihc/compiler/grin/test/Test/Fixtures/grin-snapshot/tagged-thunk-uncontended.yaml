entry: $entry
program: |
  constructor Done/0 []
  global done = (CDone)
  global outer = (F$outer)
  global inner = (F$inner)

  $outer -> BoxedRep Lifted =
    eval @(BoxedRep Lifted) global-ref inner

  $inner -> BoxedRep Lifted =
    constant global-ref done

  $entry -> BoxedRep Lifted =
    eval @(BoxedRep Lifted) global-ref outer
return: "@0"
heap: |
  @0 = CDone
allocated-bytes:
  macos-arm64: 0
  linux-amd64: 0
status: pass
reason: Two uncontended thunk evaluations allocate nothing in the heap. Their update frames are on the thread stack.
