        () <- primitive-call @(TupleRep []) stmAbort#
        () <- primitive-call @(TupleRep []) stmCommit#
        (next%12 :: IntRep) <- primitive-call @IntRep +# (counter%10 :: IntRep) (1 :: IntRep)
        call @IntRep $loop (next%12 :: IntRep) (var%20 :: BoxedRep Unlifted) (value%21 :: BoxedRep Lifted)

  $entry -> IntRep =
    (value%30 :: BoxedRep Lifted) <- store (CNumber (42 :: IntRep))
    (var%31 :: BoxedRep Unlifted) <- primitive-call @(BoxedRep Unlifted) newDelayTVar# (0 :: IntRep) (value%30 :: BoxedRep Lifted) (value%30 :: BoxedRep Lifted)
    call @IntRep $loop (0 :: IntRep) (var%31 :: BoxedRep Unlifted) (value%30 :: BoxedRep Lifted)
