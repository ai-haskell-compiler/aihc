program: |
  constructor Number/1 [IntRep]
  primitive stmBegin#%1 :: TupleRep []/0
  primitive stmCommit#%2 :: TupleRep []/0
  primitive stmAbort#%3 :: TupleRep []/0
  primitive +#%4 :: IntRep/2
  primitive newDelayTVar#%5 :: BoxedRep Unlifted/3
  primitive writeTVar#%6 :: TupleRep []/2

  $loop (counter%10 :: IntRep) (var%20 :: BoxedRep Unlifted) (value%21 :: BoxedRep Lifted) -> IntRep =
    case (counter%10 :: IntRep) as tested%11 :: IntRep of
      200 ->
        constant (counter%10 :: IntRep)
      _ ->
        () <- primitive-call @(TupleRep []) stmBegin#
        () <- primitive-call @(TupleRep []) writeTVar# (var%20 :: BoxedRep Unlifted) (value%21 :: BoxedRep Lifted)
        () <- primitive-call @(TupleRep []) stmBegin#
