entry: $entry
gc-stress: true
rts-arguments: ["+RTS", "-M2048", "-RTS"]
program: |
  constructor Done/0 []
  primitive -# :: IntRep/2
  global done = (CDone)

  $step (count :: IntRep) -> BoxedRep Lifted =
    case (count :: IntRep) as tested :: IntRep of
      0 ->
        constant global-ref done
      _ ->
        (next :: IntRep) <- primitive-call @IntRep -# (count :: IntRep) (1 :: IntRep)
        (thunk :: BoxedRep Lifted) <- store (F$step (next :: IntRep))
        eval @(BoxedRep Lifted) (thunk :: BoxedRep Lifted)

  $entry -> BoxedRep Lifted =
    call @(BoxedRep Lifted) $step (256 :: IntRep)
error: heap limit exceeded
status: pass
reason: The heap limit must include all 256 active thunks. Their update frames are on the thread stack and not in the heap, so the thunks alone exceed the limit.
