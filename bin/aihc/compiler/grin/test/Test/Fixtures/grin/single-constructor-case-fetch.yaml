source: |
  module Test where
  import GHC.Prim
  data Pair = Pair Int# Int#
  data Choice = Left Int# | Right Int#
  first :: Pair -> Int#
  first p = case p of Pair a _ -> a
  pick :: Choice -> Int#
  pick c = case c of
    Left a -> a
    Right b -> b
