expected: |-
  scope 1 = "" Target

  primitive +# :: IntRep/2

  pub global 1.visible = (P1.$visible/[[IntRep]])

  global 1.helper = (P1.$helper/[[IntRep]])

  1.$helper (x :: IntRep) -> IntRep =
    primitive-call @IntRep +# (x :: IntRep) (1 :: IntRep)

  1.$twice (x :: BoxedRep Lifted) (y :: IntRep) -> IntRep =
    function_whnf :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    function_whnf%1 :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    argument :: IntRep <-
      apply @IntRep (function_whnf%1 :: BoxedRep Lifted) (y :: IntRep)
    apply @IntRep (function_whnf :: BoxedRep Lifted) (argument :: IntRep)

  1.$visible (x :: IntRep) -> IntRep =
    call @IntRep 1.$twice global-ref 1.helper (x :: IntRep)
extensions:
- MagicHash
modules:
- |
  module Target (visible) where
  import GHC.Prim
  helper :: Int# -> Int#
  helper x = x +# 1#
  twice :: (Int# -> Int#) -> Int# -> Int#
  twice f x = f (f x)
  visible :: Int# -> Int#
  visible x = twice helper x
reason: passing an unexported function names the one static closure that every use of it as a value shares
