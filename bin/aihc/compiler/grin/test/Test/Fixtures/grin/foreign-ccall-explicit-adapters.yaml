extensions:
- ForeignFunctionInterface
- MagicHash
- UnboxedTuples
source: |
  module Test where
  import GHC.Prim (Int#, RealWorld, State#)
  data Int = I# Int#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall unsafe "identity_int" identityInt :: Int -> IO Int
expected: |-
  constructor Test.I# [IntRep]

  foreign identityInt = "identity_int" :: (int) -> int ! real-world

  global "\NULTest\NULI#" = (CTest.I#/1)

  global "\NULTest\NULidentityInt" = (P$grin_identityInt_foreign_0/[[BoxedRep Lifted], []])

  $grin_identityInt_foreign_0 (foreign_argument_0 :: BoxedRep Lifted) -> TupleRep [TupleRep [],BoxedRep Lifted] =
    foreign_box :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (foreign_argument_0 :: BoxedRep Lifted)
    case (foreign_box :: BoxedRep Lifted) as foreign_box_case :: BoxedRep Lifted of
      data Test.I# (foreign_field :: IntRep) ->
        foreign_result :: IntRep <-
          foreign-call identityInt = "identity_int" :: (int) -> int ! real-world with (foreign_field :: IntRep)
        store (CTest.I# (foreign_result :: IntRep))
reason: uses only the adapters named by the System FC foreign declaration
status: pass
