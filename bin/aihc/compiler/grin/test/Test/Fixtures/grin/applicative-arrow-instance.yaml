reason: an instance for the partially applied function arrow gives its
  methods function types, and the lint equates them with the class method
  types instantiated at the arrow, also for a default method
source: |
  module Test where
  class Fun f where
    fmap' :: (a -> b) -> f a -> f b
  class (Fun f) => Ap f where
    unit :: a -> f a
    ap :: f (a -> b) -> f a -> f b
    lift2 :: (a -> b -> c) -> f a -> f b -> f c
    lift2 f x y = ap (fmap' f x) y
  instance Fun ((->) r) where
    fmap' f g x = f (g x)
  instance Ap ((->) r) where
    unit x _ = x
    ap f g x = f x (g x)
status: pass
