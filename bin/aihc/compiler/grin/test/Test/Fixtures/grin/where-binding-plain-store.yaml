extensions:
- MagicHash
source: |
  module Test where
  import GHC.Types (Int (..))
  data Box = Box Int
  data Pair = Pair Int Box
  pair :: Int -> Pair
  pair x = Pair size boxed
    where
      size = I# 3#
      boxed = Box size
expected: |-
  scope 1 = "" Test

  scope 2 = "aihc-prim" GHC.Types

  pub constructor 1.Box [BoxedRep Lifted]

  pub constructor 1.Pair [BoxedRep Lifted, BoxedRep Lifted]

  pub global 1.pair = (P$pair/1)

  $pair (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    size :: BoxedRep Lifted <-
      store (C2.I# (3 :: IntRep))
    argument :: BoxedRep Lifted <-
      store (C1.Box (size :: BoxedRep Lifted))
    store (C1.Pair (size :: BoxedRep Lifted) (argument :: BoxedRep Lifted))
status: pass
reason: a where binding that is not recursive is allocated in place instead of in a recursive group
