extensions:
- MagicHash
source: |
  module Test where
  import GHC.Prim
  data Result a = Failure Int# | Success a
  mapResult :: (a -> b) -> Result a -> Result b
  mapResult f result = case result of
    Failure position -> Failure position
    Success value -> Success (f value)
expected: |-
  scope 1 = "" Test

  pub constructor 1.Failure [IntRep]

  pub constructor 1.Success%1 [BoxedRep Lifted]

  pub global 1.mapResult = (P1.$mapResult/2)

  1.$mapResult_argument_thunk (value :: BoxedRep Lifted) (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    function_whnf :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    apply @(BoxedRep Lifted) (function_whnf :: BoxedRep Lifted) (value :: BoxedRep Lifted)

  1.$mapResult (x :: BoxedRep Lifted) (y :: BoxedRep Lifted) -> BoxedRep Lifted =
    case_value :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (y :: BoxedRep Lifted)
    case (case_value :: BoxedRep Lifted) as case_value%1 :: BoxedRep Lifted of
      data 1.Failure (position :: IntRep) ->
        constant (case_value%1 :: BoxedRep Lifted)
      data 1.Success%1 (value :: BoxedRep Lifted) ->
        argument :: BoxedRep Lifted <-
          store (F1.$mapResult_argument_thunk (value :: BoxedRep Lifted) (x :: BoxedRep Lifted))
        store (C1.Success (argument :: BoxedRep Lifted))
status: pass
reason: An alternative that builds the constructor of the scrutinee again, at another type, returns the scrutinee
