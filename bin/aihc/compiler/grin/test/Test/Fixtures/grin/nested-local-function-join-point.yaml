extensions:
  - MagicHash
source: |
  module Test where
  import GHC.Prim
  data B = T | F
  data P = P Int# Int#
  pick :: B -> B -> Int# -> Int# -> P
  pick b c x y =
    let j z = P (z +# x) (z *# y)
        k w = case c of
          T -> j w
          F -> j (w +# 1#)
     in case b of
          T -> k x
          F -> k y
expected: |-
  scope 1 = "" Test

  pub constructor 1.T []

  pub constructor 1.F%1 []

  pub constructor 1.P [IntRep, IntRep]

  primitive *# :: IntRep/2

  primitive +# :: IntRep/2

  pub global 1.pick = (P1.$pick/[[BoxedRep Lifted], [BoxedRep Lifted], [IntRep], [IntRep]])

  1.$pick_closure (x1 :: IntRep) (z :: IntRep) (x :: IntRep) -> BoxedRep Lifted =
    argument :: IntRep <-
      primitive-call @IntRep +# (x :: IntRep) (z :: IntRep)
    argument%1 :: IntRep <-
      primitive-call @IntRep *# (x :: IntRep) (x1 :: IntRep)
    store (C1.P (argument :: IntRep) (argument%1 :: IntRep))

  1.$pick_closure_2 (x1 :: IntRep) (z :: IntRep) (y :: BoxedRep Lifted) (x :: IntRep) -> BoxedRep Lifted =
    case_value :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (y :: BoxedRep Lifted)
    case (case_value :: BoxedRep Lifted) as case_value%1 :: BoxedRep Lifted of
      data 1.T ->
        call @(BoxedRep Lifted) 1.$pick_closure (x1 :: IntRep) (z :: IntRep) (x :: IntRep)
      data 1.F%1 ->
        argument :: IntRep <-
          primitive-call @IntRep +# (x :: IntRep) (1 :: IntRep)
        call @(BoxedRep Lifted) 1.$pick_closure (x1 :: IntRep) (z :: IntRep) (argument :: IntRep)

  1.$pick (x :: BoxedRep Lifted) (y :: BoxedRep Lifted) (z :: IntRep) (x1 :: IntRep) -> BoxedRep Lifted =
    case_value :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    case (case_value :: BoxedRep Lifted) as case_value%1 :: BoxedRep Lifted of
      data 1.T ->
        call @(BoxedRep Lifted) 1.$pick_closure_2 (x1 :: IntRep) (z :: IntRep) (y :: BoxedRep Lifted) (z :: IntRep)
      data 1.F%1 ->
        call @(BoxedRep Lifted) 1.$pick_closure_2 (x1 :: IntRep) (z :: IntRep) (y :: BoxedRep Lifted) (x1 :: IntRep)
status: pass
reason: a let-bound local function that only another local function calls is also a join point; the caller passes the captured values of the callee, and no closure is stored
