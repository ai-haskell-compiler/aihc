reason: a method of an instance for the function arrow has the function type,
  so the System FC lint accepts its application to a function
source: |
  module Test where
  data Nat = Z | S Nat
  data Pair a b = Pair a b
  class Arrow a where
    second :: a b c -> a (Pair d b) (Pair d c)
  instance Arrow (->) where
    second f (Pair d b) = Pair d (f b)
  apply :: (Nat -> Nat) -> Pair Nat Nat -> Pair Nat Nat
  apply f = second f
