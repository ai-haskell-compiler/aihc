extensions:
- ExistentialQuantification
source: |
  module Test where
  import GHC.Prim
  data Box = forall a. Box a
  copyBox :: Box -> Box
  copyBox box = case box of
    Box value -> Box value
expected: |-
  scope 1 = "" Test

  pub constructor 1.Box [BoxedRep Lifted]

  pub global 1.copyBox = (P1.$copyBox$p$p/1)

  pub 1.$copyBox$p$p (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    case_value :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    value :: BoxedRep Lifted <-
      fetch (C1.Box) (case_value :: BoxedRep Lifted)
    constant (case_value :: BoxedRep Lifted)
status: pass
reason: preserves the lifted representation of an existential constructor field
