  global "\NULTest\NULBox" = (CTest.Box/1)

  global "\NULTest\NULcopyBox" = (F$grin_copyBox_thunk_0)

  $grin_closure_1 (x%-1000000000 :: BoxedRep Lifted) -> BoxedRep Lifted =
