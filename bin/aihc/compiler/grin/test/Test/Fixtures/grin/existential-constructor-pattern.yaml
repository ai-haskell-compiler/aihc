source: |
  module Test where
  import GHC.Prim
  data Box = forall a. Box a
  copyBox :: Box -> Box
  copyBox box = case box of
    Box value -> Box value
expected: |-
  constructor Test.Box [BoxedRep Lifted]

  global "\NULTest\NULBox" = (CTest.Box/1)

  global "\NULTest\NULcopyBox" = (P$grin_closure_0/1)

  $grin_closure_0 (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    case_value :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    case (case_value :: BoxedRep Lifted) as _scrut :: BoxedRep Lifted of
      data Test.Box (value :: BoxedRep Lifted) ->
        store (CTest.Box (value :: BoxedRep Lifted))
status: pass
reason: preserves the lifted representation of an existential constructor field
