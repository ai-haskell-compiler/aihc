program: |
  global unboxed = (P$unboxed/1)
  global forwarded = (P$forwarding/1)

  $unboxed (x :: BoxedRep Lifted) -> IntRep =
    y :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    constant (0 :: IntRep)

  $forwarding (x :: BoxedRep Lifted) -> forwarded =
    call @forwarded $forwarding (x :: BoxedRep Lifted)

  $entry (a :: BoxedRep Lifted) -> BoxedRep Lifted =
    n :: IntRep <-
      apply @IntRep global-ref unboxed (a :: BoxedRep Lifted)
    apply @(BoxedRep Lifted) global-ref forwarded (a :: BoxedRep Lifted)

  $mismatch (a :: BoxedRep Lifted) -> BoxedRep Lifted =
    apply @(BoxedRep Lifted) global-ref unboxed (a :: BoxedRep Lifted)
