program: |
  global bind = (P$bindIO/2)

  $bindIO (x :: BoxedRep Lifted) (y :: BoxedRep Lifted) -> BoxedRep Lifted =
    constant (x :: BoxedRep Lifted)

  $saturated (a :: BoxedRep Lifted) (b :: BoxedRep Lifted) -> BoxedRep Lifted =
    f :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) global-ref bind
    g :: BoxedRep Lifted <-
      apply @(BoxedRep Lifted) (f :: BoxedRep Lifted) (a :: BoxedRep Lifted)
    apply @(BoxedRep Lifted) (g :: BoxedRep Lifted) (b :: BoxedRep Lifted)

  $partial (a :: BoxedRep Lifted) -> BoxedRep Lifted =
    apply @(BoxedRep Lifted) global-ref bind (a :: BoxedRep Lifted)

  $local (a :: BoxedRep Lifted) (b :: BoxedRep Lifted) -> BoxedRep Lifted =
    f :: BoxedRep Lifted <-
      store (P$bindIO/1 (a :: BoxedRep Lifted))
    apply @(BoxedRep Lifted) (f :: BoxedRep Lifted) (b :: BoxedRep Lifted)
