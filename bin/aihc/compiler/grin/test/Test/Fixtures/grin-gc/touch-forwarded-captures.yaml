expected: |
  primitive touch# :: TupleRep []/1

  protect (owner :: BoxedRep Unlifted) (action :: BoxedRep Lifted) ($cps_return :: BoxedRep Lifted) -> forwarded =
    $cps_return$gc :: BoxedRep Lifted, action$gc :: BoxedRep Lifted, owner$gc :: BoxedRep Unlifted <-
      ensure-heap (0 :: WordRep) ($cps_return :: BoxedRep Lifted) (action :: BoxedRep Lifted) (owner :: BoxedRep Unlifted)
    $cps_continuation :: BoxedRep Lifted <-
      store-unchecked (Pprotect_cont/[[]] ($cps_return$gc :: BoxedRep Lifted) (owner$gc :: BoxedRep Unlifted))
    cps-apply @forwarded (action$gc :: BoxedRep Lifted) () -> ($cps_continuation :: BoxedRep Lifted)

  protect_cont ($cps_return :: BoxedRep Lifted) (owner :: BoxedRep Unlifted) -> forwarded =
    () <-
      primitive-call @(TupleRep []) touch# (owner :: BoxedRep Unlifted)
    forward
status: pass
reason: The CPS stage captures the owner in an ordinary continuation frame. The frame goes on the thread stack. A stack growth can use the nursery, so the GC stage gives the push a reservation of zero words, and the owner is a root of that reservation.
