program: |
  primitive touch# :: TupleRep []/1

  protect (owner :: BoxedRep Unlifted) (action :: BoxedRep Lifted) -> forwarded =
    () <- apply @forwarded (action :: BoxedRep Lifted) ()
    () <- primitive-call @(TupleRep []) touch# (owner :: BoxedRep Unlifted)
