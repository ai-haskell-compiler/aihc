  forceA (value :: BoxedRep Lifted) (capture :: BoxedRep Lifted) -> BoxedRep Lifted =
    (ready :: BoxedRep Lifted) <- eval @(BoxedRep Lifted) (value :: BoxedRep Lifted)
    store (CPair (ready :: BoxedRep Lifted) (capture :: BoxedRep Lifted))

  forceB (value :: BoxedRep Lifted) (capture :: BoxedRep Lifted) -> BoxedRep Lifted =
    (ready :: BoxedRep Lifted) <- eval @(BoxedRep Lifted) (value :: BoxedRep Lifted)
