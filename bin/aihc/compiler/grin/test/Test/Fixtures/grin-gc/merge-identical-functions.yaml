  both (left :: BoxedRep Lifted) (right :: BoxedRep Lifted) -> BoxedRep Lifted =
    (first :: BoxedRep Lifted) <- call @(BoxedRep Lifted) forceA (left :: BoxedRep Lifted) (right :: BoxedRep Lifted)
    call @(BoxedRep Lifted) forceB (right :: BoxedRep Lifted) (first :: BoxedRep Lifted)
