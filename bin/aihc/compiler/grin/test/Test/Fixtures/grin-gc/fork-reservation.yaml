expected: |
  primitive fork# :: BoxedRep Unlifted/1

  fork (action :: BoxedRep Lifted) ($cps_return :: BoxedRep Lifted) -> BoxedRep Unlifted =
    $cps_return$gc :: BoxedRep Lifted, action$gc :: BoxedRep Lifted <-
      ensure-nursery 12 ($cps_return :: BoxedRep Lifted) (action :: BoxedRep Lifted)
    $cps_fork_action :: BoxedRep Lifted <-
      store-unchecked (Pfork_fork/[[]] (action$gc :: BoxedRep Lifted))
    cps-primitive-call @(BoxedRep Unlifted) fork# ($cps_fork_action :: BoxedRep Lifted) -> ($cps_return$gc :: BoxedRep Lifted)

  fork_cont ($cps_fork_return :: BoxedRep Lifted) ($cps_fork_evaluated :: BoxedRep Lifted) -> BoxedRep Lifted =
    cps-apply @(BoxedRep Lifted) ($cps_fork_evaluated :: BoxedRep Lifted) () -> ($cps_fork_return :: BoxedRep Lifted)

  fork_fork ($cps_fork_capture :: BoxedRep Lifted) ($cps_fork_return :: BoxedRep Lifted) -> BoxedRep Lifted =
    if-whnf ($cps_fork_capture :: BoxedRep Lifted)
      call @(TupleRep []) fork_cont ($cps_fork_return :: BoxedRep Lifted) ($cps_fork_capture :: BoxedRep Lifted)
    else
      $cps_fork_capture$gc :: BoxedRep Lifted, $cps_fork_return$gc :: BoxedRep Lifted <-
        ensure-nursery 0 ($cps_fork_capture :: BoxedRep Lifted) ($cps_fork_return :: BoxedRep Lifted)
      $cps_continuation :: BoxedRep Lifted <-
        store-unchecked (Pfork_cont/1 ($cps_fork_return$gc :: BoxedRep Lifted))
      cps-eval @(BoxedRep Lifted) ($cps_fork_capture$gc :: BoxedRep Lifted) ($cps_continuation :: BoxedRep Lifted)
status: pass
reason: A fork reservation must protect the action and the caller continuation, and it must include the closure that evaluates the action in the new thread.
