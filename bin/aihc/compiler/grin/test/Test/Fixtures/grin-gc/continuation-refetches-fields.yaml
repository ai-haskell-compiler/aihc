program: |
  constructor Triple [BoxedRep Lifted, BoxedRep Lifted, BoxedRep Lifted]
  constructor Pair [BoxedRep Lifted, BoxedRep Lifted]

  pick (record :: BoxedRep Lifted) (value :: BoxedRep Lifted) -> BoxedRep Lifted =
    (first :: BoxedRep Lifted), (second :: BoxedRep Lifted), (third :: BoxedRep Lifted) <- fetch (CTriple) (record :: BoxedRep Lifted)
    (ready :: BoxedRep Lifted) <- eval @(BoxedRep Lifted) (value :: BoxedRep Lifted)
    (inner :: BoxedRep Lifted) <- store (CPair (first :: BoxedRep Lifted) (second :: BoxedRep Lifted))
    store (CPair (inner :: BoxedRep Lifted) (third :: BoxedRep Lifted))
