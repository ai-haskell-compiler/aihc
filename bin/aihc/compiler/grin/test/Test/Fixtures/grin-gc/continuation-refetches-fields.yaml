    continue ($cps_return$gc :: BoxedRep Lifted) ($cps_result :: BoxedRep Lifted)

  pick_cont_frame ($cps_return :: BoxedRep Lifted) (record :: BoxedRep Lifted) (ready :: BoxedRep Lifted) -> BoxedRep Lifted =
