reason: |
  Dynamic allocation returns memory before byte array initialization.
  Resize preserves the pinned flag and relocates the source array.
  A movable array of a fixed size gets a fixed reservation of eight words.
  These are six header words and two payload words for 16 bytes.
  Then aihcNewByteArrayUnchecked# makes the array without a runtime call.
  The declaration of that primitive is new for the same reason.
