extensions: [PolyKinds, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE PolyKinds, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Proxy (a :: k) = Proxy
    ignore :: forall k (a :: k). Bool
    ignore = True
    result :: Bool
    result = ignore
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub type 1.tProxy (k : sType) (a : k) :: sType {
    pub 1.cProxy :: ∀(k : sType) (a : k). tProxy k a
  }

  pub val 1.vignore :: ∀(k : sType) (a : k). tBool
    = Λ(k : sType) (a : k).
      cTrue

  pub val 1.vresult :: tBool
    = vignore @(tTYPE (cBoxedRep cLifted)) @tUnit
status: pass
reason: Annotation defaulting resolves an argument kind before its type.
