---
extensions: []
modules:
- |
  module Test (pick) where
  import GHC.Types (Bool (..))
  data Choice = A | B | C
  data Box = Box Bool Bool Bool Bool
  opaque :: Bool -> Bool
  opaque x = x
  {-# NOINLINE opaque #-}
  pick :: Choice -> Bool -> Box
  pick x y =
    let shared = case x of
          A -> Box y y y y
          _ -> Box (opaque (opaque y)) (opaque (opaque y)) (opaque (opaque y)) (opaque (opaque y))
    in case x of
      A -> shared
      B -> shared
      C -> shared
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tChoice :: sType {
    1.cA :: tChoice;
    1.cB :: tChoice;
    1.cC :: tChoice
  }

  type 1.tBox :: sType {
    1.cBox :: tBool 2.→ tBool 2.→ tBool 2.→ tBool 2.→ tBox
  }

  val 1.vopaque noinline :: tBool 2.→ tBool
    = λ(x : tBool).
      x

  pub val 1.vpick :: tChoice 2.→ tBool 2.→ tBox
    = λ(x : tChoice) (y : tBool).
      let shared : tBox =
        case x of {
          cA →
            cBox y y y y;
          _ →
            cBox (vopaque (vopaque y)) (vopaque (vopaque y)) (vopaque (vopaque y)) (vopaque (vopaque y))
        };
      case x of {
        cA →
          shared;
        cB →
          shared;
        cC →
          shared
      }
status: pass
reason: The simplifier keeps the shared case when a copy can increase cost.
