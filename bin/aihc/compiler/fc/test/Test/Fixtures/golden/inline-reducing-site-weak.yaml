---
extensions: []
modules:
- |
  module Test (run, again, other) where
  import GHC.Types (Bool (..))

  data State = State Bool Bool Bool

  step :: State -> Bool -> State
  step (State a b c) x = case x of
    True -> State b c a
    False -> case a of
      True -> State c a b
      False -> State a c b
  {-# INLINE step #-}

  run :: State -> Bool -> State
  run s x = case s of
    State _ _ _ -> step s x

  again :: State -> Bool -> State
  again s x = step s x

  other :: State -> Bool -> State
  other s x = step s x
passes:
- inline:
    policy: grow
    callee-limit: 5
    site-limit: 100
    value-growth: 0
    value-slack: 0
    requested-site-limit: 0
    reducing-site-limit: 100
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tState :: sType {
    1.cState :: tBool 2.→ tBool 2.→ tBool 2.→ tState
  }

  val 1.vstep inline :: tState 2.→ tBool 2.→ tState
    = λ(x : tState) (y : tBool).
      case x as (_scrut : tState) return (tState) of {
        cState (a : tBool) (b : tBool) (c : tBool) →
          case y as (_scrut{1} : tBool) return (tState) of {
            cTrue →
              cState b c a;
            cFalse →
              case a as (_scrut{2} : tBool) return (tState) of {
                cTrue →
                  cState c a b;
                cFalse →
                  cState a c b
              }
          }
      }

  pub val 1.vrun :: tState 2.→ tBool 2.→ tState
    = λ(x : tState) (y : tBool).
      case x as (_scrut : tState) return (tState) of {
        cState (_pat : tBool) (_pat{1} : tBool) (_pat{2} : tBool) →
          case y as (_scrut{1} : tBool) return (tState) of {
            cTrue →
              cState _pat{1} _pat{2} _pat;
            cFalse →
              case _pat as (_scrut{2} : tBool) return (tState) of {
                cTrue →
                  cState _pat{2} _pat _pat{1};
                cFalse →
                  cState _pat _pat{2} _pat{1}
              }
          }
      }

  pub val 1.vagain :: tState 2.→ tBool 2.→ tState
    = λ(x : tState) (y : tBool).
      vstep x y

  pub val 1.vother :: tState 2.→ tBool 2.→ tState
    = λ(x : tState) (y : tBool).
      vstep x y
status: pass
reason: A weak reduction is free of the allowance within the site limit, so a value with no growth left takes the copy.
