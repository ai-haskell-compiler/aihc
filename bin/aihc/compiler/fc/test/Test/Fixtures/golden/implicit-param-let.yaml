---
extensions:
- ImplicitParams
modules:
- |
  {-# LANGUAGE ImplicitParams #-}
  module Test where
  data Bool = True | False

  useParam :: (?flag :: Bool) => Bool
  useParam = ?flag

  callUse :: Bool
  callUse = let ?flag = True in useParam
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub val 1.vuseParam :: 1.tBool 2.→ 1.tBool
   = λ($d0 : 1.tBool).
    $d0

  pub val 1.vcallUse :: 1.tBool
   = 1.vuseParam 1.cTrue
status: pass
reason: an implicit parameter is a plain value argument, and a let binding supplies it
