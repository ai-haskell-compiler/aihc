- |
  module Test (run) where
  import GHC.Types (Bool (..))

  data Len = One | Two | Three | Four

  data Out = Out Bool Bool Bool

  run :: Bool -> Bool -> Bool -> Out
  run a b c =
    let k l = case l of
          One -> Out a b c
          Two -> Out b c a
          Three -> Out c a b
          Four -> Out a a a
     in case a of
          True -> case b of
            True -> k One
            False -> k Two
          False -> case c of
            True -> k Three
            False -> k Four
