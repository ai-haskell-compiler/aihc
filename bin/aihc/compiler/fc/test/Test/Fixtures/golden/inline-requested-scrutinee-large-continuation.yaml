---
extensions:
- MagicHash
modules:
- |
  module Test (decode, width) where

  import GHC.Prim
  import GHC.Types (Int (..))

  -- Every tail is a known constructor, as in the leader length of a
  -- UTF-8 sequence.
  width :: Int -> Int
  width (I# w) = case w <# 128# of
    1# -> I# 1#
    _ -> case w <# 224# of
      1# -> I# 2#
      _ -> case w <# 240# of
        1# -> I# 3#
        _ -> I# 4#
  {-# INLINE width #-}

  decode :: Int -> Int
  decode x = case width x of
    I# n -> I# (n *# n +# n *# 3# +# n *# 5# +# n *# 7# +# n *# 11# +# n *# 13# +# n *# 17# +# n *# 19# +# n *# 23# +# n *# 29# +# n *# 31# +# n *# 37#)
passes:
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    *# = 2.v*# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    <# = 2.v<# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vwidth inline :: tInt → tInt
    = λ(x : tInt).
      let! cI# (w : tInt#) = x;
      let _case : tInt# =
        prim <# w lit (128#cIntRep) :: tInt#;
      case _case of {
        1#cIntRep →
          cI# lit (1#cIntRep) :: tInt#;
        _ →
          let _case{1} : tInt# =
            prim <# w lit (224#cIntRep) :: tInt#;
          case _case{1} of {
            1#cIntRep →
              cI# lit (2#cIntRep) :: tInt#;
            _ →
              let _case{2} : tInt# =
                prim <# w lit (240#cIntRep) :: tInt#;
              case _case{2} of {
                1#cIntRep →
                  cI# lit (3#cIntRep) :: tInt#;
                _ →
                  cI# lit (4#cIntRep) :: tInt#
              }
          }
      }

  pub val 1.vdecode :: tInt → tInt
    = λ(x : tInt).
      let! cI# (w : tInt#) = x;
      let _join : FUN @cIntRep @sLiftedRep tInt# tInt =
        λ(n : tInt#).
          cI# (prim +# (prim +# (prim +# (prim +# (prim +# (prim +# (prim +# (prim +# (prim +# (prim +# (prim +# (prim *# n n) (prim *# n lit (3#cIntRep) :: tInt#)) (prim *# n lit (5#cIntRep) :: tInt#)) (prim *# n lit (7#cIntRep) :: tInt#)) (prim *# n lit (11#cIntRep) :: tInt#)) (prim *# n lit (13#cIntRep) :: tInt#)) (prim *# n lit (17#cIntRep) :: tInt#)) (prim *# n lit (19#cIntRep) :: tInt#)) (prim *# n lit (23#cIntRep) :: tInt#)) (prim *# n lit (29#cIntRep) :: tInt#)) (prim *# n lit (31#cIntRep) :: tInt#)) (prim *# n lit (37#cIntRep) :: tInt#));
      case prim <# w lit (128#cIntRep) :: tInt# of {
        1#cIntRep →
          _join lit (1#cIntRep) :: tInt#;
        _ →
          case prim <# w lit (224#cIntRep) :: tInt# of {
            1#cIntRep →
              _join lit (2#cIntRep) :: tInt#;
            _ →
              case prim <# w lit (240#cIntRep) :: tInt# of {
                1#cIntRep →
                  _join lit (3#cIntRep) :: tInt#;
                _ →
                  _join lit (4#cIntRep) :: tInt#
              }
          }
      }
status: pass
reason: The function 'width' gives a known constructor in each tail, and the case in 'decode' has a large alternative. The case of the case keeps that alternative in one join point, so the copy of 'width' does not copy it four times. Thus, the growing inliner takes the site, and the call of 'width' goes away.
