---
extensions:
- RebindableSyntax
modules:
- |
  {-# LANGUAGE RebindableSyntax #-}
  module Test where
  data Bool = False | True
  enumFromThen first second = [first, second]
  result :: Bool -> Bool -> [Bool]
  result start thenExpr = [start, thenExpr ..]
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.t[] :: ∀(a : 2.tType). 2.tType;
    2.v: :: ∀(a : 2.tType). a 2.→ 2.t[] a 2.→ 2.t[] a;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity;
    2.v[] :: ∀(a : 2.tType). 2.t[] a

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tBool :: 2.tType {
      pub 1.vFalse :: 1.tBool;
      pub 1.vTrue :: 1.tBool
  }

  pub val 1.venumFromThen :: ∀(a : 2.tType). a 2.→ a 2.→ 2.t[] a
   = Λ(a : 2.tType).
    λ(x : a).
      λ(y : a).
        2.v: @a x (2.v: @a y (2.v[] @a))

  pub val 1.vresult :: 1.tBool 2.→ 1.tBool 2.→ 2.t[] 1.tBool
   = λ(x : 1.tBool).
    λ(y : 1.tBool).
      1.venumFromThen @1.tBool x y
status: pass
reason: Desugars an open arithmetic sequence with a step through the resolved enumFromThen function.
