---
extensions:
- MagicHash
modules:
- |
  module Test (count) where

  import GHC.Prim ((-#))
  import GHC.Types (Int (..))

  count :: Int -> Int
  count n = case n of
    I# i -> case i of
      0# -> n
      _ -> count (I# (i -# 1#))
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    strict [0] 3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vcount inline :: 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    case x as (wrapped : 3.tInt) return (3.tInt) of {
        3.cI# (x{1} : 2.tInt#) →
            case 1.v$wcount x{1} as (field : 2.tInt#) return (3.tInt) of {
                _ →
                    3.cI# field
            }
    }

  val 1.v$wcount :: FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#
   = λ(x : 2.tInt#).
    case x as (_scrut : 2.tInt#) return (2.tInt#) of {
        0#3.cIntRep →
            x;
        _ →
            let {
                x{1} : 2.tInt# =
                    foreign {prim 2.v-# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut 1#3.cIntRep
            } in
                1.v$wcount x{1}
    }
status: pass
reason: The worker returns the field of its result. The recursive call in the worker becomes a case on the call that returns its binder, which is the call itself, so the recursive call stays a tail call.
