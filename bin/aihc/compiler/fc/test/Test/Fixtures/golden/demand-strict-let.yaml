---
extensions:
- MagicHash
modules:
- |
  module Test (twice) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  double :: Int -> Int
  double n = case n of
    I# i -> I# (i +# i)

  twice :: Int -> Int
  twice n =
    let y = double n
     in case y of
          I# a -> case y of
            I# b -> I# (a +# b)
passes:
- demand
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  val 1.vdouble :: 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    case x as (_scrut : 3.tInt) return (3.tInt) of {
        3.cI# (i : 2.tInt#) →
            3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} i i)
    }

  pub val 1.vtwice :: 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    case 1.vdouble x as (y : 3.tInt) return (3.tInt) of {
        _ →
            case y as (_scrut : 3.tInt) return (3.tInt) of {
                3.cI# (a : 2.tInt#) →
                    case y as (_scrut{1} : 3.tInt) return (3.tInt) of {
                        3.cI# (b : 2.tInt#) →
                            3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a b)
                    }
            }
    }
status: pass
reason: The body of 'twice' evaluates 'y' on every path, so the let that binds 'y' becomes a case. The call of 'double' runs before the body instead of in a thunk that the first case enters.
