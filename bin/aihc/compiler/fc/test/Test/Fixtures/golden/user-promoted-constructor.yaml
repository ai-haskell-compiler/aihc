extensions:
  - DataKinds
modules:
  - |
    module Test where
    data Same = Same
    type TypeName = Same
    type TermName = 'Same
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tSame :: 2.sType {
      pub 1.cSame :: 1.tSame
  }

  pub type 1.sTypeName :: 2.sType =
   1.tSame

  pub type 1.sTermName :: 1.tSame =
   1.cSame
status: pass
reason: FC conversion keeps same-text type and term namespace identities separate
