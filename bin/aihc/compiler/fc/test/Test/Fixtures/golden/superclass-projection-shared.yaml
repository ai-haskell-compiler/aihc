---
extensions: []
modules:
- |
  module Test where
  data Flag = Off | On
  class Parent a where
    parent :: a -> Flag
  class Parent a => Child a where
    child :: a -> Flag
  both :: Child a => a -> a -> Flag
  both x y =
    case parent x of
      Off -> parent y
      On -> child x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tFlag :: sType {
    pub 1.cOff :: tFlag;
    pub 1.cOn :: tFlag
  }

  pub type 1.t$Dict$Parent (a : sType) :: sType {
    pub 1.c$Dict$Parent :: ∀(a : sType). (a 2.→ tFlag) 2.→ t$Dict$Parent a
  }

  pub type 1.t$Dict$Child (a : sType) :: sType {
    pub 1.c$Dict$Child :: ∀(a : sType). t$Dict$Parent a 2.→ (a 2.→ tFlag) 2.→ t$Dict$Child a
  }

  pub val 1.vparent :: ∀(a : sType). t$Dict$Parent a 2.→ a 2.→ tFlag
    = Λ(a : sType). λ($d0 : t$Dict$Parent a).
      case $d0 of {
        c$Dict$Parent ($method0 : a 2.→ tFlag) →
          $method0
      }

  pub val 1.vchild :: ∀(a : sType). t$Dict$Child a 2.→ a 2.→ tFlag
    = Λ(a : sType). λ($d0 : t$Dict$Child a).
      case $d0 of {
        c$Dict$Child ($method0 : t$Dict$Parent a) ($method1 : a 2.→ tFlag) →
          $method1
      }

  pub val 1.vboth :: ∀(a : sType). t$Dict$Child a 2.→ a 2.→ a 2.→ tFlag
    = Λ(a : sType). λ($d0 : t$Dict$Child a) (x : a) (y : a).
      let $super : t$Dict$Parent a =
        case $d0 of {
          c$Dict$Child ($super_field0 : t$Dict$Parent a) ($super_field1 : a 2.→ tFlag) →
            $super_field0
        };
      case vparent @a $super x of {
        cOff →
          vparent @a $super y;
        cOn →
          vchild @a $d0 x
      }
status: pass
reason: One binding selects the parent dictionary once for both uses.
