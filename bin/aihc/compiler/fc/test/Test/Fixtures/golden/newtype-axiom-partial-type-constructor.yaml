  module Test where
  import GHC.Types (Type)
  data Sum (f :: Type -> Type) (g :: Type -> Type) p = L1 (f p) | R1 (g p)
  newtype M1 i c (f :: Type -> Type) p = M1 (f p)
  newtype Tagged (s :: Type -> Type) b = Tagged b
  data Unit = Unit
  class SumSize f where
    sumSize :: Tagged f Unit
  instance (SumSize a, SumSize b) => SumSize (Sum a b) where
    sumSize = Tagged Unit
  instance SumSize (M1 i c a) where
    sumSize = Tagged Unit
