extensions: []
modules:
- |
  module Test where

  import GHC.Types (Int)

  data Pair = Pair Int Int
  data Packed = Packed {-# UNPACK #-} !Int {-# UNPACK #-} !Int
  data Outer = Outer {-# UNPACK #-} !Packed
  data LazyPair = LazyPair {-# UNPACK #-} !Pair
  data Kept = Kept {-# NOUNPACK #-} !Int
  data Fun = Fun {-# UNPACK #-} !(Int -> Int)
  data Sum = A | B
  data SumBox = SumBox {-# UNPACK #-} !Sum
  data LazyBox = LazyBox {-# UNPACK #-} ~Int
  newtype N = N Int
  data Through = Through {-# UNPACK #-} !N

  build :: Packed -> Pair -> Int -> (Int -> Int) -> Sum -> Int -> N -> (Outer, LazyPair, Kept, Fun, SumBox, LazyBox, Through)
  build packed pair kept function sumValue lazyValue newtypeValue =
    ( Outer packed
    , LazyPair pair
    , Kept kept
    , Fun function
    , SumBox sumValue
    , LazyBox lazyValue
    , Through newtypeValue
    )
