  pub val 1.vbuild :: tPacked → tPair → tInt → (tInt → tInt) → tSum → tInt → tN → tTuple7 tOuter tLazyPair tKept tFun tSumBox tLazyBox tThrough
    = λ(x : tPacked) (y : tPair) (z : tInt) (x1 : tInt → tInt) (x2 : tSum) (x3 : tInt) (x4 : tN).
      c(,,,,,,) @tOuter @tLazyPair @tKept @tFun @tSumBox @tLazyBox @tThrough (v$WOuter x) (v$WLazyPair y) (v$WKept z) (v$WFun x1) (v$WSumBox x2) (cLazyBox x3) (v$WThrough x4)
status: pass
reason: UNPACK flattens one product, keeps a sum and a function as one strict field, ignores a lazy field, and looks through a newtype.
