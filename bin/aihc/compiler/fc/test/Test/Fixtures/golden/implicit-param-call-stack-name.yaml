  data SrcLoc = SrcLoc [Char] [Char] [Char] Int Int Int Int
  data CallStack = EmptyCallStack | PushCallStack [Char] SrcLoc CallStack
  type HasCallStack = (?callStack :: CallStack)

  emptyCallStack :: CallStack
  emptyCallStack = EmptyCallStack

  pushCallStack :: ([Char], SrcLoc) -> CallStack -> CallStack
  pushCallStack (name, location) stack = PushCallStack name location stack

  renamed :: HasCallStack => Int -> CallStack
  renamed _ = ?callstack

  bound :: Int -> Int
  bound x = let ?foo = x in ?foo
