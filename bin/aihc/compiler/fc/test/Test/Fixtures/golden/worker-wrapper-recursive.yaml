---
extensions:
- MagicHash
modules:
- |
  module Test (loop) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  loop :: Int -> Int -> Int
  loop n acc = case n of
    I# i -> case acc of
      I# s -> case i of
        0# -> acc
        _ -> loop (I# (i -# 1#)) (I# (s +# i))
passes:
- worker-wrapper
- simplify: 1
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vloop inline :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (wrapped : 3.tInt) return (3.tInt) of {
          3.cI# (x{1} : 2.tInt#) →
              case y as (wrapped{1} : 3.tInt) return (3.tInt) of {
                  3.cI# (y{1} : 2.tInt#) →
                      case 1.v$wloop x{1} y{1} as (field : 2.tInt#) return (3.tInt) of {
                          _ →
                              3.cI# field
                      }
              }
      }

  val 1.v$wloop :: FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)
   = λ(x : 2.tInt#).
    λ(y : 2.tInt#).
      case x as (_scrut : 2.tInt#) return (2.tInt#) of {
          0#3.cIntRep →
              y;
          _ →
              let {
                  x{1} : 2.tInt# =
                      foreign {prim 2.v-# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut 1#3.cIntRep
              } in
                  let {
                      y{1} : 2.tInt# =
                          foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} y _scrut
                  } in
                      1.v$wloop x{1} y{1}
      }
status: pass
reason: The recursive call in the worker goes through a copy of the wrapper, so the worker calls itself with the fields and the loop allocates no box.
