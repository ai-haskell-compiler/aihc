---
extensions: []
modules:
- |
  module Test where

  import GHC.Types (Bool (..))

  data Pair a = Pair a a

  data Tag a = Tag

  -- Each alternative builds the value it matched, so the case is its
  -- scrutinee.
  sameBool :: Bool -> Bool
  sameBool z = case z of
    False -> False
    True -> True

  samePair :: Pair a -> Pair a
  samePair p = case p of
    Pair x y -> Pair x y

  -- The fields are in a different order, so the case stays.
  swapPair :: Pair a -> Pair a
  swapPair p = case p of
    Pair x y -> Pair y x

  -- The phantom parameter changes, so the case stays.
  retag :: Tag a -> Tag b
  retag t = case t of
    Tag -> Tag
passes:
- simplify
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tPair (a : sType) :: sType {
    pub 1.cPair :: ∀(a : sType). a → a → tPair a
  }

  pub type 1.tTag (a : sType) :: sType {
    pub 1.cTag :: ∀(a : sType). tTag a
  }

  pub val 1.vsameBool :: tBool → tBool
    = λ(x : tBool).
      x

  pub val 1.vsamePair :: ∀(a : sType). tPair a → tPair a
    = Λ(a : sType). λ(x : tPair a).
      x

  pub val 1.vswapPair :: ∀(a : sType). tPair a → tPair a
    = Λ(a : sType). λ(x : tPair a).
      let! cPair (x{1} : a) (y : a) = x;
      cPair @a y x{1}

  pub val 1.vretag :: ∀(a : sType) (b : sType). tTag a → tTag b
    = Λ(a : sType) (b : sType). λ(x : tTag a).
      let! cTag = x;
      cTag @b
