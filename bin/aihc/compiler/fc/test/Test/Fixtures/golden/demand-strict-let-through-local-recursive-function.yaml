---
extensions:
- MagicHash
modules:
- |
  module Test (count) where

  import GHC.Prim ((+#), (>=#))
  import GHC.Types (Int (..))

  double :: Int -> Int
  double n = case n of
    I# i -> I# (i +# i)

  count :: Int -> Int
  count n =
    let limit = double n
        go i = case i of
          I# j -> case limit of
            I# l -> case j >=# l of
              1# -> i
              _ -> go (I# (j +# 1#))
     in go (I# 0#)
passes:
- demand
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    >=# = 2.v>=# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cVecRep, 3.cTupleRep, 3.cSumRep, 3.cBoxedRep, 3.cIntRep, 3.cInt8Rep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cWordRep, 3.cWord8Rep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cAddrRep, 3.cFloatRep, 3.cDoubleRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vdouble :: tInt → tInt
    = λ(x : tInt).
      let! cI# (i : tInt#) = x;
      cI# (prim +# i i)

  pub val 1.vcount :: tInt → tInt
    = λ(x : tInt).
      let! _ as (limit : tInt) = vdouble x;
      rec {
        go : tInt → tInt =
          λ(x{1} : tInt).
            let! cI# (j : tInt#) = x{1};
            let! cI# (l : tInt#) = limit;
            let _case : tInt# =
              prim >=# j l;
            case _case of {
              1#cIntRep →
                x{1};
              _ →
                go (cI# (prim +# j lit (1#cIntRep) :: tInt#))
            }
      } in
      go (cI# lit (0#cIntRep) :: tInt#)
status: pass
reason: The local recursive function 'go' evaluates 'limit' on every call. The fixpoint of the free variables that a member of a recursive group evaluates confirms 'limit', so the call in the body of the let evaluates 'limit', and the let becomes a case.
