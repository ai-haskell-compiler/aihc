---
extensions: []
modules:
- |
  module Test (letFoldl, boxFoldl, firstJust, caseFirstJust, lazyFoldl) where
  import GHC.Prim (seq)
  data List a = Nil | Cons a (List a)
  data Maybe a = Nothing | Just a
  newtype Box a = Box a

  letFoldl :: (b -> a -> b) -> b -> List a -> b
  letFoldl combine initial values = case values of
    Nil -> initial
    Cons value rest -> let next = combine initial value in next `seq` letFoldl combine next rest

  boxFoldl :: (b -> a -> b) -> b -> List a -> Box b
  boxFoldl combine initial values = case values of
    Nil -> Box initial
    Cons value rest -> let next = combine initial value in Box next `seq` boxFoldl combine next rest

  firstJust :: (a -> Maybe b) -> Maybe b -> List a -> Maybe b
  firstJust check fallback values = case values of
    Nil -> fallback
    Cons value rest -> let found = check value in case found of
      Nothing -> firstJust check fallback rest
      Just _ -> found

  caseFirstJust :: (a -> Maybe b) -> Maybe b -> List (Maybe a) -> Maybe b
  caseFirstJust check fallback values = case values of
    Nil -> fallback
    Cons value rest -> let found = case value of { Nothing -> fallback; Just inner -> check inner } in case found of
      Nothing -> caseFirstJust check fallback rest
      Just _ -> found

  lazyFoldl :: (b -> a -> b) -> b -> List a -> b
  lazyFoldl combine initial values = case values of
    Nil -> initial
    Cons value rest -> let next = combine initial value in initial `seq` lazyFoldl combine next rest
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

