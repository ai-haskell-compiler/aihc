---
extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Types (Int (..))

  data Pair = Pair {-# NOUNPACK #-} !Int {-# NOUNPACK #-} !Int

  -- The shrinking inliner copies the constructor wrapper, and the
  -- simplifier drops the evaluations of the copy, because the fields of
  -- the case are values. The worker then gets the fields of the pair,
  -- and builds a pair from the first field again. That field holds a
  -- value: the pair evaluated it.
  reset :: Pair -> Pair
  reset p = case p of
    Pair a _ -> Pair a (I# 0#)

  run :: Pair -> Pair
  run p = reset (reset p)
status: pass
passes:
- inline: shrink
- simplify
- worker-wrapper
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    pub strict [0, 1] 1.cPair :: tInt → tInt → tPair
  }

  val 1.vreset inline :: tPair → tPair
    = λ(x : tPair).
      let! cPair (x{1} : tInt) (x{2} : tInt) = x;
      v$wreset x{1} x{2}

  val 1.v$wreset :: tInt → tInt → tPair
    = λ(x : tInt) (x{1} : tInt).
      let x{2} : tPair =
        let! _ = x;
        let! _ = x{1};
        cPair x x{1};
      let! _ = x;
      cPair x (cI# lit (0#cIntRep) :: tInt#)

  pub val 1.vrun inline :: tPair → tPair
    = λ(x : tPair).
      let! cPair (x{1} : tInt) (x{2} : tInt) = x;
      v$wrun x{1} x{2}

  val 1.v$wrun :: tInt → tInt → tPair
    = λ(x : tInt) (x{1} : tInt).
      let x{2} : tPair =
        let! _ = x;
        let! _ = x{1};
        cPair x x{1};
      vreset (vreset x{2})
