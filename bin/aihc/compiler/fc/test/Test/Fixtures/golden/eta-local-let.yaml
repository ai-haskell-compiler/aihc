---
extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Prim (RealWorld, State#)
  import GHC.Types (Bool (..), Int (..))

  newtype Eff a = Eff (State# RealWorld -> a)

  step :: Int -> Eff Int
  step n = Eff (\s -> n)

  andThen :: Eff Int -> Eff Int -> Eff Int
  andThen (Eff f) (Eff g) = Eff (\s -> case f s of I# _ -> g s)

  choose :: Bool -> Bool
  choose flag = case flag of
    True -> False
    False -> True

  run :: Bool -> (Int -> Int, Eff Int)
  run flag =
    let next = case flag of
          True -> step (I# 1#)
          False -> step (I# 2#)
        pick = case choose flag of
          True -> \x -> x
          False -> \x -> I# 0#
     in ( \y -> pick (pick y),
          andThen next (case flag of
            True -> next
            False -> step (I# 3#))
        )
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Tuple
  scope 4 = "aihc-prim" GHC.Types

  import headers
    constructors [4.cFalse, 4.cTrue] 4.tBool :: sType;
    constructors [4.cI#] 4.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [4.cLifted, 4.cUnlifted] 4.tLevity :: sType;
    4.sLiftedRep :: tRuntimeRep;
    2.tRealWorld :: sType;
    constructors [4.cAddrRep, 4.cBoxedRep, 4.cDoubleRep, 4.cFloatRep, 4.cInt16Rep, 4.cInt32Rep, 4.cInt64Rep, 4.cInt8Rep, 4.cIntRep, 4.cSumRep, 4.cTupleRep, 4.cVecRep, 4.cWord16Rep, 4.cWord32Rep, 4.cWord64Rep, 4.cWord8Rep, 4.cWordRep] 4.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [3.c(,)] 3.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    4.sType :: sType;
    constructors [4.c[], 4.c:] 4.t[] :: ∀(a : sType). sType;
    3.c(,) :: ∀(a1 : sType) (a2 : sType). a1 4.→ a2 4.→ tTuple2 a1 a2;
    4.cBoxedRep :: tLevity 4.→ tRuntimeRep;
    4.cFalse :: tBool;
    4.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    4.cIntRep :: tRuntimeRep;
    4.cLifted :: tLevity;
    4.cTrue :: tBool;
    4.cTupleRep :: t[] tRuntimeRep 4.→ tRuntimeRep;
    4.c[] :: ∀(a : sType). t[] a

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep

  type 1.tEff (a : sType) :: sType {}

  axiom 1.$ax$Eff (a : sType) : tEff a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tState# tRealWorld) a

  val 1.vstep :: tInt 4.→ tEff tInt
    = λ(x : tInt).
      (λ(s : tState# tRealWorld).
        x) ▷ sym (axiom-co $ax$Eff @tInt)

  val 1.vandThen :: tEff tInt 4.→ tEff tInt 4.→ tEff tInt
    = λ(x : tEff tInt) (y : tEff tInt).
      (λ(eta{2} : tState# tRealWorld).
        let f : FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tState# tRealWorld) tInt =
          x ▷ axiom-co $ax$Eff @tInt;
        let g : FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tState# tRealWorld) tInt =
          y ▷ axiom-co $ax$Eff @tInt;
        case f eta{2} return (tInt) of {
          cI# (_pat : tInt#) →
            g eta{2}
        }) ▷ sym (axiom-co $ax$Eff @tInt)

  val 1.vchoose :: tBool 4.→ tBool
    = λ(x : tBool).
      case x return (tBool) of {
        cTrue →
          cFalse;
        cFalse →
          cTrue
      }

  pub val 1.vrun :: tBool 4.→ tTuple2 (tInt 4.→ tInt) (tEff tInt)
    = λ(x : tBool).
      let pick : tInt 4.→ tInt =
        case vchoose x return (tInt 4.→ tInt) of {
          cTrue →
            λ(x{1} : tInt).
              x{1};
          cFalse →
            λ(x{1} : tInt).
              cI# 0#cIntRep
        };
      let next : tEff tInt =
        (λ(eta{3} : tState# tRealWorld).
          case x return (tInt) of {
            cTrue →
              ((vstep (cI# 1#cIntRep)) ▷ axiom-co $ax$Eff @tInt) eta{3};
            cFalse →
              ((vstep (cI# 2#cIntRep)) ▷ axiom-co $ax$Eff @tInt) eta{3}
          }) ▷ sym (axiom-co $ax$Eff @tInt);
      c(,) @(tInt 4.→ tInt) @(tEff tInt) (λ(y : tInt).
        pick (pick y)) (vandThen next ((λ(eta{4} : tState# tRealWorld).
        case x return (tInt) of {
          cTrue →
            (next ▷ axiom-co $ax$Eff @tInt) eta{4};
          cFalse →
            ((vstep (cI# 3#cIntRep)) ▷ axiom-co $ax$Eff @tInt) eta{4}
        }) ▷ sym (axiom-co $ax$Eff @tInt)))
status: pass
reason: A local binding and an argument expand as a top-level value does. 'next' is a case on a variable whose alternatives are partial applications of an Eff action, so it takes the state token and becomes a closure, not a thunk. The second argument of 'andThen' is a case of the same kind and expands too. The scrutinee of 'pick' is a call, and its lambda is not one-shot, so an expansion would repeat that call and 'pick' stays as it is.
