---
extensions:
- MagicHash
modules:
- |
  module Test (empty, space, longer) where

  import GHC.CString (unpackCString#)
  import GHC.Prim (Addr#)
  import GHC.Types (Char, Int (..))

  data Packed = Packed Addr# | Chars [Char]

  pack :: [Char] -> Packed
  pack cs = Chars cs
  {-# NOINLINE pack #-}

  {-# RULES
  "pack/literal" forall s. pack (unpackCString# s) = Packed s
    #-}

  empty :: Packed
  empty = pack ""

  space :: Packed
  space = pack " "

  longer :: Packed
  longer = pack "ab"
passes:
- inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.CString
  scope 3 = "aihc-prim" GHC.Prim
  scope 4 = "aihc-prim" GHC.Types

  import headers
    3.tAddr# :: tTYPE cAddrRep;
    constructors [4.cC#] 4.tChar :: sType;
    constructors [4.cLifted, 4.cUnlifted] 4.tLevity :: sType;
    4.sLiftedRep :: tRuntimeRep;
    constructors [4.cAddrRep, 4.cBoxedRep, 4.cDoubleRep, 4.cFloatRep, 4.cInt16Rep, 4.cInt32Rep, 4.cInt64Rep, 4.cInt8Rep, 4.cIntRep, 4.cSumRep, 4.cTupleRep, 4.cVecRep, 4.cWord16Rep, 4.cWord32Rep, 4.cWord64Rep, 4.cWord8Rep, 4.cWordRep] 4.tRuntimeRep :: sType;
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    4.sType :: sType;
    constructors [4.c[], 4.c:] 4.t[] :: ∀(a : sType). sType;
    4.cAddrRep :: tRuntimeRep;
    4.cBoxedRep :: tLevity 4.→ tRuntimeRep;
    4.cLifted :: tLevity;
    2.vunpackCString# :: FUN @cAddrRep @sLiftedRep tAddr# (t[] tChar)

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep

  type 1.tPacked :: sType {
    1.cPacked :: FUN @cAddrRep @sLiftedRep tAddr# tPacked;
    1.cChars :: t[] tChar 4.→ tPacked
  }

  val 1.vpack noinline :: t[] tChar 4.→ tPacked
    = λ(x : t[] tChar).
      cChars x

  pub val 1.vempty :: tPacked
    = cPacked lit (""#cAddrRep) :: tAddr#

  pub val 1.vspace :: tPacked
    = cPacked lit (" "#cAddrRep) :: tAddr#

  pub val 1.vlonger :: tPacked
    = cPacked lit ("ab"#cAddrRep) :: tAddr#

  rule "pack/literal" λ(s : tAddr#).
    vpack (vunpackCString# s)
   = cPacked s
   :: tPacked
status: pass
reason: A literal of at most one character is a spelled-out list, and a longer literal is unpackCString# of an address literal. A rule that names unpackCString# of a variable matches the spelled-out list as well, with the address literal of its bytes.
