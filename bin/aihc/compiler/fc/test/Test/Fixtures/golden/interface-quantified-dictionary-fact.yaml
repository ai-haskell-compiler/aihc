extensions: []
scope: module
modules:
- |
  module Lib where
  import GHC.Types (Bool(..))
  data Wrap a = Wrap a
  class Pick a where
    pick :: a -> Bool
  instance Pick (Wrap a) where
    pick x = True
- |
  module Test where
  import GHC.Types (Bool(..))
  import Lib (Pick(..), Wrap(..))
  result :: Bool
  result = pick (Wrap False)
passes:
- inline: shrink
