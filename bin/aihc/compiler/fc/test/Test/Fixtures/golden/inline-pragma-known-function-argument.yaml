---
extensions: []
modules:
- |
  module Test (run, select) where
  import GHC.Types (Bool (..))

  -- An INLINE value over the callee limit that calls its function
  -- parameter. The export keeps it, so its sites are not free.
  select :: (Bool -> Bool) -> Bool -> Bool -> Bool -> Bool
  select f a b c = case f a of
    True -> case f b of
      True -> f c
      False -> case f c of
        True -> f b
        False -> f a
    False -> case f c of
      True -> case f b of
        True -> f a
        False -> f c
      False -> case f a of
        True -> f b
        False -> f c
  {-# INLINE select #-}

  -- The lambda is a known function for a parameter that the value calls,
  -- so the site reduces and takes a copy.
  run :: Bool -> Bool -> Bool -> Bool
  run a b c = select (\x -> case x of
    True -> False
    False -> True) a b c
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
    requested-site-limit: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub val 1.vselect inline :: (tBool → tBool) → tBool → tBool → tBool → tBool
    = λ(x : tBool → tBool) (y : tBool) (z : tBool) (x1 : tBool).
      case x y of {
        cTrue →
          case x z of {
            cTrue →
              x x1;
            cFalse →
              case x x1 of {
                cTrue →
                  x z;
                cFalse →
                  x y
              }
          };
        cFalse →
          case x x1 of {
            cTrue →
              case x z of {
                cTrue →
                  x y;
                cFalse →
                  x x1
              };
            cFalse →
              case x y of {
                cTrue →
                  x z;
                cFalse →
                  x x1
              }
          }
      }

  pub val 1.vrun :: tBool → tBool → tBool → tBool
    = λ(x : tBool) (y : tBool) (z : tBool).
      let x{1} : tBool → tBool =
        λ(x{2} : tBool).
          case x{2} of {
            cTrue →
              cFalse;
            cFalse →
              cTrue
          };
      case x{1} x of {
        cTrue →
          case x{1} y of {
            cTrue →
              x{1} z;
            cFalse →
              case x{1} z of {
                cTrue →
                  x{1} y;
                cFalse →
                  x{1} x
              }
          };
        cFalse →
          case x{1} z of {
            cTrue →
              case x{1} y of {
                cTrue →
                  x{1} x;
                cFalse →
                  x{1} z
              };
            cFalse →
              case x{1} x of {
                cTrue →
                  x{1} y;
                cFalse →
                  x{1} z
              }
          }
      }
status: pass
reason: A call that gives a lambda to a parameter that an INLINE callee calls reduces. Before, a callee over the callee limit kept the call.
