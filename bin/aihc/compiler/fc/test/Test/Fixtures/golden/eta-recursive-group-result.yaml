---
extensions:
- MagicHash
modules:
- |
  module Test (count) where

  import GHC.Prim ((-#))
  import GHC.Types (Int (..))

  newtype Fn = Fn (Int -> Int)

  count :: Int -> Fn
  count n = case n of
    I# 0# -> Fn (\x -> x)
    I# m -> count (I# (m -# 1#))
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tFn :: sType {}

  axiom 1.$ax$Fn : tFn ~R tInt → tInt

  pub val 1.vcount :: tInt → tFn
    = λ(x : tInt).
      (λ(eta{2} : tInt).
        let! cI# (_pat : tInt#) = x;
        case _pat of {
          0#cIntRep →
            eta{2};
          _ →
            ((vcount (cI# (prim -# _pat lit (1#cIntRep) :: tInt#))) ▷ axiom-co $ax$Fn) eta{2}
        }) ▷ sym (axiom-co $ax$Fn)
status: pass
reason: The value 'count' is recursive. Under the guess that it takes the argument of 'Fn', the call in the tail is a partial application, which is cheap. The guess holds, so 'count' expands to two arguments, and each step calls the next one directly.
