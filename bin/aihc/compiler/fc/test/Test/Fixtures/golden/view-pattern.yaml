extensions:
- ViewPatterns
modules:
- |
  {-# LANGUAGE ViewPatterns #-}
  module Test where
  data Bool = True | False
  not True = False
  not False = True
  isFalse (not -> True) = True
  isFalse _ = False
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub val 1.vnot :: tBool 2.→ tBool
    = λ(x : tBool).
      case x return (tBool) of {
        cTrue →
          cFalse;
        cFalse →
          cTrue
      }

  pub val 1.visFalse :: tBool 2.→ tBool
    = λ(x : tBool).
      case vnot x return (tBool) of {
        cTrue →
          cTrue;
        _ →
          cFalse
      }
status: pass
reason: A view pattern binds the function result and matches it with the later rows as the failure.
