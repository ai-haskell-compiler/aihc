extensions:
- ViewPatterns
modules:
- |
  {-# LANGUAGE ViewPatterns #-}
  module Test where
  data Bool = True | False
  not True = False
  not False = True
  isFalse (not -> True) = True
  isFalse _ = False
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub val 1.vnot :: 1.tBool 2.→ 1.tBool
   = λ(x : 1.tBool).
    case x as (_scrut : 1.tBool) return (1.tBool) of {
        1.cTrue →
            1.cFalse;
        1.cFalse →
            1.cTrue
    }

  pub val 1.visFalse :: 1.tBool 2.→ 1.tBool
   = λ(x : 1.tBool).
    case 1.vnot x as (_scrut : 1.tBool) return (1.tBool) of {
        1.cTrue →
            1.cTrue;
        _ →
            1.cFalse
    }
status: pass
reason: A view pattern binds the function result and matches it with the later rows as the failure.
