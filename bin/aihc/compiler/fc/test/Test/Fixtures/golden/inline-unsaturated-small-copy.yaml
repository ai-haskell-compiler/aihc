---
extensions: []
modules:
- |
  module Test (apply) where

  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g x = f (g x)
  {-# INLINE compose #-}

  apply :: ((a -> c) -> r) -> (b -> c) -> (a -> b) -> r
  apply k f g = k (compose f g)
passes:
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub val 1.vapply :: ∀(a : sType) (c : sType) (r : sType) (b : sType). ((a → c) → r) → (b → c) → (a → b) → r
    = Λ(a : sType) (c : sType) (r : sType) (b : sType). λ(x : (a → c) → r) (y : b → c) (z : a → b).
      x (λ(z{1} : a).
        y (z z{1}))
status: pass
reason: The call 'compose f g' gives two local variables, so no argument is interesting. The copy 'λz. f (g z)' is only one unit larger than the call, so the growing inliner takes it. The lambda holds the same values as the partial application, and in the copy the body sees its arguments.
