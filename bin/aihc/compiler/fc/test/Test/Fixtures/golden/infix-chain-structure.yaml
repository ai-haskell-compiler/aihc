extensions: []
modules:
- |
  module Test where
  data Tree = Leaf | Tree :<: Tree | Tree :>: Tree
  infixl 5 :<:
  infixr 6 :>:
  left = Leaf :<: Leaf :<: Leaf
  right = Leaf Test.:>: Leaf Test.:>: Leaf
  mixed = Leaf :<: Leaf :>: Leaf :>: Leaf
  paren = (Leaf :<: Leaf) :>: Leaf
  pick (a :<: b :>: c :>: d) = d
  single (a :>: b) = b
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tTree :: sType {
    pub 1.cLeaf :: tTree;
    pub 1.c:<: :: tTree 2.→ tTree 2.→ tTree;
    pub 1.c:>: :: tTree 2.→ tTree 2.→ tTree
  }

  pub val 1.vleft :: tTree
    = c:<: (c:<: cLeaf cLeaf) cLeaf

  pub val 1.vright :: tTree
    = c:>: cLeaf (c:>: cLeaf cLeaf)

  pub val 1.vmixed :: tTree
    = c:<: cLeaf (c:>: cLeaf (c:>: cLeaf cLeaf))

  pub val 1.vparen :: tTree
    = c:>: (c:<: cLeaf cLeaf) cLeaf

  pub val 1.vpick :: tTree 2.→ tTree
    = λ(x : tTree).
      case x as (_scrut : tTree) return (tTree) of {
        c:<: (a : tTree) (_pat : tTree) →
          case _pat as (_scrut{1} : tTree) return (tTree) of {
            c:>: (b : tTree) (_pat{1} : tTree) →
              case _pat{1} as (_scrut{2} : tTree) return (tTree) of {
                c:>: (c : tTree) (d : tTree) →
                  d
              }
          }
      }

  pub val 1.vsingle :: tTree 2.→ tTree
    = λ(x : tTree).
      case x as (_scrut : tTree) return (tTree) of {
        c:>: (a : tTree) (b : tTree) →
          b
      }
status: pass
reason: Preserve left, right, mixed, qualified, and parenthesized infix trees in expressions and patterns.
