---
extensions:
- MagicHash
modules:
- |
  module Test (choose, zero) where

  import GHC.Types (Bool (..), Int (..))

  zero :: Int
  zero = I# 0#

  pair :: Int -> Int -> Int -> Int -> [Int]
  pair w x y z = [w, x, y, z]

  choose :: Bool -> [Int] -> Int -> Int -> [Int]
  choose flag items a b =
    let fallback :: [Int] -> [Int]
        fallback ignored = pair a b a b
     in case flag of
          True -> fallback items
          False -> case items of
            [] -> fallback items
            _ -> items
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cVecRep, 3.cTupleRep, 3.cSumRep, 3.cBoxedRep, 3.cIntRep, 3.cInt8Rep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cWordRep, 3.cWord8Rep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cAddrRep, 3.cFloatRep, 3.cDoubleRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a → t[] a → t[] a;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cFalse :: tBool;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vzero :: tInt
    = cI# lit (0#cIntRep) :: tInt#

  val 1.vpair :: tInt → tInt → tInt → tInt → t[] tInt
    = λ(x : tInt) (y : tInt) (z : tInt) (x1 : tInt).
      c: @tInt x (c: @tInt y (c: @tInt z (c: @tInt x1 (c[] @tInt))))

  pub val 1.vchoose :: tBool → t[] tInt → tInt → tInt → t[] tInt
    = λ(x : tBool) (y : t[] tInt) (z : tInt) (x1 : tInt).
      let fallback : FUN @cIntRep @sLiftedRep tInt# (t[] tInt) =
        λ(unused x{1} : tInt#).
          vpair z x1 z x1;
      case x of {
        cTrue →
          fallback lit (0#cIntRep) :: tInt#;
        cFalse →
          case y of {
            c[] →
              fallback lit (0#cIntRep) :: tInt#;
            _ →
              y
          }
      }
status: pass
reason: The program knows Int# through 'zero'. The local function 'fallback' ignores its parameter, and each use of it is a call. Each call gives the literal 0# in place of 'items'. The parameter keeps its place, so 'fallback' stays a function and does not become a thunk.
