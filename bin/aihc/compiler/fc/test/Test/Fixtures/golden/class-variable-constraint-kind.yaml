extensions:
  - ConstraintKinds
  - DataKinds
  - FlexibleContexts
  - KindSignatures
  - PolyKinds
  - ScopedTypeVariables
  - TypeFamilies
modules:
  - |
    {-# LANGUAGE ConstraintKinds, DataKinds, FlexibleContexts, KindSignatures, PolyKinds, ScopedTypeVariables, TypeFamilies #-}
    module Test where
    import GHC.Types (Bool (..))
    data Proxy (t :: k) = Proxy
    class Truthy a where
      truthy :: a -> Bool
    instance Truthy Bool where
      truthy b = b
    -- The kind of @c@ comes from the constraint @c a@: it is
    -- @Type -> Constraint@, and @Proxy c@ instantiates @k@ to it.
    class KnownCtxt c where
      inj :: c a => Proxy c -> a -> Bool
    instance KnownCtxt Truthy where
      inj _ = truthy
    -- The result kind of the family comes from its equation: it is
    -- @Type -> Constraint@, and @Proxy (Ctxt b)@ instantiates @k@ to it.
    type family Ctxt (b :: Bool) where
      Ctxt b = Truthy
    injCtxt :: forall b a. (Ctxt b a, KnownCtxt (Ctxt b)) => Proxy b -> a -> Bool
    injCtxt _ = inj (Proxy :: Proxy (Ctxt b))
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tProxy (k : sType) (t : k) :: sType {
    pub 1.cProxy :: ∀(k : sType) (t : k). tProxy k t
  }

  pub type 1.t$Dict$Truthy (a : sType) :: sType {
    pub 1.c$Dict$Truthy :: ∀(a : sType). (a 2.→ tBool) 2.→ t$Dict$Truthy a
  }

  pub type 1.t$Dict$KnownCtxt (c : sType 2.→ sType) :: sType {
    pub 1.c$Dict$KnownCtxt :: ∀(c : sType 2.→ sType). (∀(a : sType). c a 2.→ tProxy (tTYPE (cBoxedRep cLifted) 2.→ sType) c 2.→ a 2.→ tBool) 2.→ t$Dict$KnownCtxt c
  }

  pub type 1.tCtxt (b : tBool) :: sType 2.→ sType @N {}

  axiom 1.$ax$Ctxt$0 (b : tBool) : tCtxt b ~N t$Dict$Truthy

  pub val 1.vtruthy :: ∀(a : sType). t$Dict$Truthy a 2.→ a 2.→ tBool
    = Λ(a : sType). λ($d0 : t$Dict$Truthy a).
      case $d0 as ($dict : t$Dict$Truthy a) return (a 2.→ tBool) of {
        c$Dict$Truthy ($method0 : a 2.→ tBool) →
          $method0
      }

  pub val 1.vinj :: ∀(c : sType 2.→ sType) (a : sType). t$Dict$KnownCtxt c 2.→ c a 2.→ tProxy (tTYPE (cBoxedRep cLifted) 2.→ sType) c 2.→ a 2.→ tBool
    = Λ(c : sType 2.→ sType) (a : sType). λ($d0 : t$Dict$KnownCtxt c) ($d1 : c a).
      case $d0 as ($dict : t$Dict$KnownCtxt c) return (tProxy (tTYPE (cBoxedRep cLifted) 2.→ sType) c 2.→ a 2.→ tBool) of {
        c$Dict$KnownCtxt ($method0 : ∀(a{1} : sType). c a{1} 2.→ tProxy (tTYPE (cBoxedRep cLifted) 2.→ sType) c 2.→ a{1} 2.→ tBool) →
          $method0 @a $d1
      }

  pub val 1.v$fTruthyBool :: t$Dict$Truthy tBool
    = c$Dict$Truthy @tBool v$fTruthyBool$ctruthy

  val 1.v$fTruthyBool$ctruthy :: tBool 2.→ tBool
    = λ(x : tBool).
      x

  pub val 1.v$fKnownCtxtTruthy :: t$Dict$KnownCtxt t$Dict$Truthy
    = c$Dict$KnownCtxt @t$Dict$Truthy v$fKnownCtxtTruthy$cinj

  val 1.v$fKnownCtxtTruthy$cinj :: ∀(a : sType). t$Dict$Truthy a 2.→ tProxy (tTYPE (cBoxedRep cLifted) 2.→ sType) t$Dict$Truthy 2.→ a 2.→ tBool
    = Λ(a : sType). λ($d0 : t$Dict$Truthy a) (x : tProxy (tTYPE (cBoxedRep cLifted) 2.→ sType) t$Dict$Truthy).
      vtruthy @a $d0

  pub val 1.vinjCtxt :: ∀(b : tBool) (a : sType). tCtxt b a 2.→ t$Dict$KnownCtxt (tCtxt b) 2.→ tProxy tBool b 2.→ a 2.→ tBool
    = Λ(b : tBool) (a : sType). λ($d0 : tCtxt b a) ($d1 : t$Dict$KnownCtxt (tCtxt b)) (x : tProxy tBool b).
      vinj @t$Dict$Truthy @a $d1 $d0 (cProxy @(tTYPE (cBoxedRep cLifted) 2.→ sType) @t$Dict$Truthy)
status: pass
reason: a kind argument with a constraint in it, as Proxy takes for a class variable or a constraint family, erases the constraint to Type, and the lint accepts it
