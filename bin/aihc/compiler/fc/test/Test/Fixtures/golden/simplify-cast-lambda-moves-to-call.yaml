    3.cLifted :: tLevity;
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tEff (a : sType) :: sType {}

  axiom 1.$ax$Eff (a : sType) : tEff a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tState# tRealWorld) a

  pub val 1.vrun :: tEff tInt 3.→ tEff tInt
    = λ(x : tEff tInt).
      (λ(t : tState# tRealWorld).
        case (x ▷ axiom-co $ax$Eff @tInt) t as (_scrut : tInt) return (tInt) of {
          cI# (n : tInt#) →
            cI# n
        }) ▷ sym (axiom-co $ax$Eff @tInt)
status: pass
reason: The right side is a lambda under a newtype cast. Its one use casts it back and calls it, so the lambda moves to its call and the two casts cancel.
