---
extensions:
- MagicHash
modules:
- |
  module Test where

  import GHC.Prim (Int#, (+#), negateInt#)
  import GHC.Types (Int (..))

  data Box = Box Int#

  data Wrap = Wrap Int#

  -- Each read of the box is a case in an argument of a primitive call.
  -- The case moves out of the call and out of the strict let, so the
  -- second read finds the box known and the program reads it once.
  viaStrictLet :: Box -> Int
  viaStrictLet b =
    let x = negateInt# (case b of Box v -> v)
     in let y = negateInt# (case b of Box w -> w)
         in I# (x +# y)

  -- The same chain in the scrutinee of a case moves out of the case. The
  -- tail is then a known constructor, and the later read of the box is
  -- known.
  viaScrutinee :: Box -> Int
  viaScrutinee b =
    case (let x = negateInt# (case b of Box v -> v) in Wrap x) of
      Wrap a -> case b of Box w -> I# (a +# w)
passes:
- simplify
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    negateInt# = 2.vnegateInt# :: FUN @cIntRep @cIntRep tInt# tInt#

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tBox :: sType {
    pub 1.cBox :: FUN @cIntRep @sLiftedRep tInt# tBox
  }

  pub type 1.tWrap :: sType {
    pub 1.cWrap :: FUN @cIntRep @sLiftedRep tInt# tWrap
  }

  pub val 1.vviaStrictLet :: tBox 3.→ tInt
    = λ(x : tBox).
      case x of {
        cBox (v : tInt#) →
          let x{1} : tInt# =
            prim negateInt# v;
          cI# (prim +# x{1} x{1})
      }

  pub val 1.vviaScrutinee :: tBox 3.→ tInt
    = λ(x : tBox).
      case x of {
        cBox (v : tInt#) →
          cI# (prim +# (prim negateInt# v) v)
      }
