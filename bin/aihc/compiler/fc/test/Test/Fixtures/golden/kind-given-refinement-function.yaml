extensions:
- GADTs
- PolyKinds
- RankNTypes
- ScopedTypeVariables
modules:
- |
  module Test where
  import GHC.Types (Type)
  data Proxy (a :: k) = Proxy
  data Some where
    Some :: forall k (a :: k). Proxy a -> Some
  data IsType k where
    IsType :: IsType Type
  endo :: forall (a :: Type). Proxy a -> Proxy (a -> a)
  endo _ = Proxy
  rebuild :: forall k (a :: k). IsType k -> Proxy a -> Some
  rebuild IsType p = Some (endo p)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tProxy (k : sType) (a : k) :: sType {
    pub 1.cProxy :: ∀(k : sType) (a : k). tProxy k a
  }

  pub type 1.tSome :: sType {
    pub 1.cSome :: ∀(k : sType) (a : k). tProxy k a → tSome
  }

  pub type 1.tIsType (k : sType) :: sType {
    pub 1.cIsType :: ∀(k : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (k ~ sType) (tIsType k)
  }

  pub val 1.vendo :: ∀(a : sType). tProxy sType a → tProxy sType (a → a)
    = Λ(a : sType). λ(unused x : tProxy sType a).
      cProxy @sType @(a → a)

  pub val 1.vrebuild :: ∀(k : sType) (a : k). tIsType k → tProxy k a → tSome
    = Λ(k : sType) (a : k). λ(x : tIsType k) (y : tProxy k a).
      let! cIsType (unused $co : k ~ sType) = x;
      cSome @sType @(a → a) (vendo @a y)
status: pass
