modules:
- |
  module Test (fill) where

  import GHC.Prim ((+#), (<#))
  import GHC.Types (Int (..))

  data List = Nil | Cons Int List

  fill :: Int -> Int -> List
  fill (I# n) (I# k) =
    let go i = case i <# n of
          1# -> Cons (I# i) (go (i +# 1#))
          _ -> Nil
     in case k <# 0# of
          1# -> Nil
          _ -> go k
