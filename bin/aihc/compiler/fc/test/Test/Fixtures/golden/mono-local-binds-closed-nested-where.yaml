extensions:
- TypeFamilies
- RankNTypes
modules:
- |
  {-# LANGUAGE TypeFamilies #-}
  {-# LANGUAGE RankNTypes #-}
  module Test (run) where
  import GHC.Types (Int)

  newtype ST s a = ST a
  data Ref s = Ref
  data Unit = Unit

  unST :: ST s a -> a
  unST (ST a) = a

  runST :: (forall s. ST s a) -> a
  runST st = unST st

  newRef :: ST s (Ref s)
  newRef = ST Ref

  bind :: ST s a -> (a -> ST s b) -> ST s b
  bind (ST a) f = f a

  write :: Ref s -> a -> ST s Unit
  write _ _ = ST Unit

  run :: Int -> Unit
  run n = runST (newRef `bind` \r -> go r n)
    where
      go r = loop
        where
          loop k = write r k
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tST (s : sType) (a : sType) :: sType {}

  axiom 1.$ax$ST (s : sType) (a : sType) : tST s a ~R a

  type 1.tRef (s : sType) :: sType {
    1.cRef :: ∀(s : sType). tRef s
  }

  type 1.tUnit :: sType {
    1.cUnit :: 1.tUnit
  }

  val 1.vunST :: ∀(s : sType) (a : sType). tST s a 3.→ a
    = Λ(s : sType) (a : sType). λ(x : tST s a).
      x ▷ axiom-co $ax$ST @s @a

  val 1.vrunST :: ∀(a : sType). (∀(s : sType). tST s a) 3.→ a
    = Λ(a : sType). λ(x : ∀(s : sType). tST s a).
      vunST @2.tUnit @a (x @2.tUnit)

  val 1.vnewRef :: ∀(s : sType). tST s (tRef s)
    = Λ(s : sType).
      (cRef @s) ▷ sym (axiom-co $ax$ST @s @(tRef s))

  val 1.vbind :: ∀(s : sType) (a : sType) (b : sType). tST s a 3.→ (a 3.→ tST s b) 3.→ tST s b
    = Λ(s : sType) (a : sType) (b : sType). λ(x : tST s a) (y : a 3.→ tST s b).
      y (x ▷ axiom-co $ax$ST @s @a)

  val 1.vwrite :: ∀(s : sType) (a : sType). tRef s 3.→ a 3.→ tST s 1.tUnit
    = Λ(s : sType) (a : sType). λ(x : tRef s) (y : a).
      cUnit ▷ sym (axiom-co $ax$ST @s @1.tUnit)

  pub val 1.vrun :: tInt 3.→ 1.tUnit
    = λ(x : tInt).
      let go : ∀(a : sType) (b : sType). tRef a 3.→ b 3.→ tST a 1.tUnit =
        Λ(a : sType) (b : sType). λ(x{1} : tRef a) (x{2} : b).
          vwrite @a @b x{1} x{2};
      vrunST @1.tUnit (Λ(s : sType).
        vbind @s @(tRef s) @1.tUnit (vnewRef @s) (λ(r : tRef s).
          go @s @tInt r x))
status: pass
reason: a where-bound helper with a nested where block is closed, so it
  generalizes over the state variable under MonoLocalBinds. The helper then
  gets a type lambda, and the state variable of the rank-2 argument does not
  escape into the type of the helper.
