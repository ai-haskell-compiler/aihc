---
extensions:
- MagicHash
modules:
- |
  module Test (firstAbove) where

  import GHC.Prim ((>#))
  import GHC.Types (Int (..), isTrue#)

  data Found = Missing | Found Int

  firstAbove :: Int -> [Int] -> Int
  firstAbove (I# limit) values =
    case (let go items = case items of
                [] -> Missing
                item@(I# i) : rest -> if isTrue# (i ># limit) then Found item else go rest
          in go values) of
      Missing -> I# 0#
      Found item -> item
passes:
- simplify: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    ># = 2.v># :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cVecRep, 3.cTupleRep, 3.cSumRep, 3.cBoxedRep, 3.cIntRep, 3.cInt8Rep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cWordRep, 3.cWord8Rep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cAddrRep, 3.cFloatRep, 3.cDoubleRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a → t[] a → t[] a;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cFalse :: tBool;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool;
    3.c[] :: ∀(a : sType). t[] a;
    3.visTrue# :: FUN @cIntRep @sLiftedRep tInt# tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tFound :: sType {
    1.cMissing :: tFound;
    1.cFound :: tInt → tFound
  }

  pub val 1.vfirstAbove :: tInt → t[] tInt → tInt
    = λ(x : tInt) (y : t[] tInt).
      let! cI# (limit : tInt#) = x;
      rec {
        go : t[] tInt → tInt =
          λ(x{1} : t[] tInt).
            case x{1} of {
              c[] →
                cI# lit (0#cIntRep) :: tInt#;
              c: (_pat : tInt) (rest : t[] tInt) →
                let! cI# (i : tInt#) = _pat;
                case visTrue# (prim ># i limit) of {
                  cTrue →
                    let item : tInt =
