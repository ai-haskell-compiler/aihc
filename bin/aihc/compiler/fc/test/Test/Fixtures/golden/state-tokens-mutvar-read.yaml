---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (Pair (..), twice, again, written) where

  import GHC.Prim (MutVar#, RealWorld, State#, readMutVar#, writeMutVar#)
  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  twice :: MutVar# RealWorld Int -> State# RealWorld -> (# State# RealWorld, Pair #)
  twice r s0 =
    case readMutVar# r s0 of
      (# s1, a #) -> case readMutVar# r s1 of
        (# s2, b #) -> (# s2, Pair a b #)

  again :: MutVar# RealWorld Int -> State# RealWorld -> (# State# RealWorld, Int #)
  again r s0 =
    case readMutVar# r s0 of
      (# s1, a #) -> case a of
        I# _ -> readMutVar# r s1

  written :: MutVar# RealWorld Int -> Int -> State# RealWorld -> (# State# RealWorld, Pair #)
  written r x s0 =
    case readMutVar# r s0 of
      (# s1, a #) -> case writeMutVar# r x s1 of
        s2 -> case readMutVar# r s2 of
          (# s3, b #) -> (# s3, Pair a b #)
passes:
- simplify
- state-tokens
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    readMutVar# = 2.vreadMutVar# :: ∀(d : sType) (a{1} : sType). FUN @sUnliftedRep @sLiftedRep (tMutVar# d a{1}) (FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# d) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# d) a{1}));
    writeMutVar# = 2.vwriteMutVar# :: ∀(d : sType) (a{1} : sType). FUN @sUnliftedRep @sLiftedRep (tMutVar# d a{1}) (a{1} 3.→ FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c[] tRuntimeRep)) (tState# d) (tState# d))

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    2.tMutVar# :: ∀(d : sType) (a : sType). tTYPE sUnliftedRep;
    2.tRealWorld :: sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [3.cTuple2#] 3.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep))));
    3.sType :: sType;
    3.sUnliftedRep :: tRuntimeRep;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    unboxed-tuple 3.cTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). FUN @r1 @sLiftedRep a1 (FUN @r2 @(cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep)))) a2 (tTuple2# r1 r2 a1 a2));
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.cUnlifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep;
    3.sUnliftedRep = cBoxedRep cUnlifted

  pub type 1.tPair :: sType {
    pub 1.cPair :: tInt 3.→ tInt 3.→ tPair
  }

  pub val 1.vtwice :: FUN @sUnliftedRep @sLiftedRep (tMutVar# tRealWorld tInt) (FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# tRealWorld) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# tRealWorld) tPair))
    = λ(x : tMutVar# tRealWorld tInt) (y : tState# tRealWorld).
      let! cTuple2# (s1 : tState# tRealWorld) (a : tInt) = prim readMutVar# @tRealWorld @tInt x y;
      cTuple2# @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep @(tState# tRealWorld) @tPair s1 (cPair a a)

  pub val 1.vagain :: FUN @sUnliftedRep @sLiftedRep (tMutVar# tRealWorld tInt) (FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# tRealWorld) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# tRealWorld) tInt))
    = λ(x : tMutVar# tRealWorld tInt) (y : tState# tRealWorld).
      let! cTuple2# (s1 : tState# tRealWorld) (a : tInt) = prim readMutVar# @tRealWorld @tInt x y;
      let! cI# (_ : tInt#) = a;
      cTuple2# @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep @(tState# tRealWorld) @tInt s1 a

  pub val 1.vwritten :: FUN @sUnliftedRep @sLiftedRep (tMutVar# tRealWorld tInt) (tInt 3.→ FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# tRealWorld) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# tRealWorld) tPair))
    = λ(x : tMutVar# tRealWorld tInt) (y : tInt) (z : tState# tRealWorld).
      let! cTuple2# (s1 : tState# tRealWorld) (a : tInt) = prim readMutVar# @tRealWorld @tInt x z;
      let! cTuple2# (s3 : tState# tRealWorld) (b : tInt) =
        prim readMutVar# @tRealWorld @tInt x (prim writeMutVar# @tRealWorld @tInt x y s1);
      cTuple2# @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep @(tState# tRealWorld) @tPair s3 (cPair a b)
status: pass
reason: In 'twice' and 'again', the second read takes the token of the first read, so it gives the value of the first read. In 'written', a write is between the reads, so the second read stays.
