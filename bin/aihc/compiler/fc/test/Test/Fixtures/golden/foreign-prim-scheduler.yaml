modules:
- |
  module Test where

  import GHC.Prim (RealWorld, State#, ThreadId#)

  foreign import prim fork# ::
    (State# RealWorld -> (# State# RealWorld, a #)) ->
    State# RealWorld ->
    (# State# RealWorld, ThreadId# #)

  foreign import prim yield# :: State# RealWorld -> State# RealWorld

  spawn action state = fork# action state

  reschedule state = yield# state
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    fork# = 1.vfork# :: ∀(a{1} : sType). (tState# tRealWorld → tTuple2# (tState# tRealWorld) a{1}) → tState# tRealWorld → tTuple2# (tState# tRealWorld) tThreadId#;
    yield# = 1.vyield# :: tState# tRealWorld → tState# tRealWorld

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    2.tRealWorld :: sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.tThreadId# :: sUnliftedType;
    constructors [3.cTuple2#] 3.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: r1 (c: r2 (c[] tRuntimeRep))));
    3.sType :: sType;
    3.sUnliftedRep :: tRuntimeRep;
    3.sUnliftedType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a → t[] a → t[] a;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    3.cUnlifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep;
    3.sUnliftedRep = cBoxedRep cUnlifted;
    3.sUnliftedType = tTYPE sUnliftedRep

  pub val 1.vspawn :: ∀(a : sType). (tState# tRealWorld → tTuple2# (tState# tRealWorld) a) → tState# tRealWorld → tTuple2# (tState# tRealWorld) tThreadId#
    = Λ(a : sType). λ(x : tState# tRealWorld → tTuple2# (tState# tRealWorld) a) (y : tState# tRealWorld).
      prim fork# @a x y

  pub val 1.vreschedule :: tState# tRealWorld → tState# tRealWorld
    = λ(x : tState# tRealWorld).
      prim yield# x
status: pass
reason: The real primitive modules provide Tuple2# for lint.
