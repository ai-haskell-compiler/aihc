  module Test (run) where

  data Flag = Off | On
  turn :: Flag -> Flag
  turn x = x
  {-# NOINLINE protected #-}
  protected :: (Flag -> Flag) -> Flag -> Flag
  protected f x = f x
  {-# INLINE [0] late #-}
  late :: (Flag -> Flag) -> Flag -> Flag
  late f x = f x
  {-# RULES "ruled" [0] forall f x. ruled f x = f x #-}
  ruled :: (Flag -> Flag) -> Flag -> Flag
  ruled f x = f x
  loop :: (Flag -> Flag) -> Flag -> Flag
  loop f x = protected f (late f (ruled f x))
  run :: Flag -> Flag
  run = loop turn
