modules:
- |
  {-# LANGUAGE OverloadedStrings #-}
  module Test where

  import GHC.Prim.Base (String)
  import GHC.Prim.String (IsString (..))

  newtype Name = Name String

  instance IsString Name where
    fromString = Name

  greeting :: Name
  greeting = "hi"
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.CString
  scope 3 = "aihc-prim" GHC.Prim
  scope 4 = "aihc-prim" GHC.Prim.String
  scope 5 = "aihc-prim" GHC.Types

  import headers
    4.t$Dict$IsString :: ∀(a : 5.sType). 5.sType;
    3.tAddr# :: 5.tTYPE 5.cAddrRep;
    5.tChar :: 5.sType;
    5.tLevity :: 5.sType;
    5.sLiftedRep :: 5.tRuntimeRep;
    5.tRuntimeRep :: 5.sType;
    5.tTYPE :: ∀(rep : 5.tRuntimeRep). 5.sType;
    5.sType :: 5.sType;
    5.t[] :: ∀(a : 5.sType). 5.sType;
    4.c$Dict$IsString :: ∀(a : 5.sType). (5.t[] 5.tChar 5.→ a) 5.→ 4.t$Dict$IsString a;
    5.cAddrRep :: 5.tRuntimeRep;
    5.cBoxedRep :: 5.tLevity 5.→ 5.tRuntimeRep;
    5.cLifted :: 5.tLevity;
    4.vfromString :: ∀(a : 5.sType). 4.t$Dict$IsString a 5.→ 5.t[] 5.tChar 5.→ a;
    2.vunpackCString# :: FUN @5.cAddrRep @5.sLiftedRep 3.tAddr# (5.t[] 5.tChar)

  import synonyms
    5.sLiftedRep = 5.cBoxedRep 5.cLifted;
    5.sType = 5.tTYPE 5.sLiftedRep

  pub type 1.tName :: 5.sType {}

  axiom 1.$ax$Name : 1.tName ~R 5.t[] 5.tChar

  pub val 1.v$fIsStringName :: 4.t$Dict$IsString 1.tName
   = 4.c$Dict$IsString @1.tName 1.v$fIsStringName$cfromString

  val 1.v$fIsStringName$cfromString :: 5.t[] 5.tChar 5.→ 1.tName
   = λ(_newtype : 5.t[] 5.tChar).
    _newtype ▷ sym (axiom-co 1.$ax$Name)

  pub val 1.vgreeting :: 1.tName
   = 4.vfromString @1.tName 1.v$fIsStringName (2.vunpackCString# "hi"#5.cAddrRep)
status: pass
reason: OverloadedStrings applies the resolved fromString to the ordinary string literal.
