    {-# LANGUAGE FlexibleInstances #-}
    module Test where
    import GHC.Prim.Base (Functor (..), Applicative (..), Monad (..))
    data Ex = Ex
    data Either e a = Left e | Right a
    instance Functor (Either e) where
      fmap _ (Left e) = Left e
      fmap f (Right a) = Right (f a)
    instance Applicative (Either e) where
      pure = Right
      Left e <*> _ = Left e
      Right f <*> r = fmap f r
    instance Monad (Either e) where
      Left e >>= _ = Left e
      Right a >>= k = k a
    class Mask m where
      bracket :: m a -> (a -> m c) -> m c
    instance e ~ Ex => Mask (Either e) where
      bracket acquire release = do
        resource <- acquire
        c <- release resource
        return c
