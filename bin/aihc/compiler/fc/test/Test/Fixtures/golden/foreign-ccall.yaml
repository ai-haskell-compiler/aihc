extensions:
  - ForeignFunctionInterface
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Prim (Int#)
    data Int = I# Int#
    foreign import ccall unsafe "identity" identityInt :: Int -> Int

    run :: Int -> Int
    run x = identityInt x

    alias :: Int -> Int
    alias = identityInt
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tInt :: sType {
    pub 1.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt
  }

  pub val 1.vrun :: tInt 3.→ tInt
    = λ(x : tInt).
      foreign {ccall unsafe "identity" [Int → Int; pure] using [constructor 1.cI#] 1.videntityInt :: tInt 3.→ tInt} x

  pub val 1.valias :: tInt 3.→ tInt
    = λ(_foreign_argument : tInt).
      foreign {ccall unsafe "identity" [Int → Int; pure] using [constructor 1.cI#] 1.videntityInt :: tInt 3.→ tInt} _foreign_argument
status: pass
reason: A full use is a foreign call. A partial use is a lambda around a foreign call.
