extensions:
  - ForeignFunctionInterface
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Prim (Int#)
    data Int = I# Int#
    foreign import ccall unsafe "identity" identityInt :: Int -> Int

    run :: Int -> Int
    run x = identityInt x

    alias :: Int -> Int
    alias = identityInt
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tInt :: 3.sType {
      pub 1.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 1.tInt
  }

  pub val 1.vrun :: 1.tInt 3.→ 1.tInt
   = λ(x : 1.tInt).
    foreign {ccall unsafe "identity" [Int → Int; pure] using [constructor 1.cI#] 1.videntityInt :: 1.tInt 3.→ 1.tInt} x

  pub val 1.valias :: 1.tInt 3.→ 1.tInt
   = λ(_foreign_argument : 1.tInt).
    foreign {ccall unsafe "identity" [Int → Int; pure] using [constructor 1.cI#] 1.videntityInt :: 1.tInt 3.→ 1.tInt} _foreign_argument
status: pass
reason: A full use is a foreign call. A partial use is a lambda around a foreign call.
