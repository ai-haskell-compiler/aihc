extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Types (Char (..))

  run :: ([Char] -> [Char]) -> [Char] -> [Char]
  run g = let x = let c = C# 'a'# in \y -> c : y in \z -> x (g z)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cC#] 3.tChar :: sType;
    2.tChar# :: tTYPE cWordRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cC# :: FUN @cWordRep @sLiftedRep tChar# tChar;
    3.cLifted :: tLevity;
    3.cWordRep :: tRuntimeRep

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vrun :: (t[] tChar 3.→ t[] tChar) 3.→ t[] tChar 3.→ t[] tChar
    = λ(x : t[] tChar 3.→ t[] tChar).
      let c : tChar =
          cC# 'a'#cWordRep;
        λ(z : t[] tChar).
          c: @tChar c (x z)
status: pass
reason: The inner let floats out of the right side, so the right side is a lambda whose one use is a saturated call, and the lambda moves to its call.
