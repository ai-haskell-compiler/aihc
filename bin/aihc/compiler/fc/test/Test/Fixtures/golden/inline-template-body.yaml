---
extensions: []
modules:
- |
  module Test (useTemplate, useOther) where
  data Nat = Z | S Nat
  -- One use, inside the template. The shrinking pass would copy it there
  -- as a value with one use, but the template is copied at every call
  -- in phase 0, so the body would come with each copy.
  slow :: Nat -> Nat
  slow x = case x of
    Z -> S (S (S (S (S (S (S (S (S (S (S (S (S (S (S (S Z)))))))))))))))
    S y -> S (S (S (S (S (S (S (S (S (S (S (S (S (S (S (S y)))))))))))))))
  -- A small value with two uses, so its copies are measured like any
  -- other, inside the template too.
  mid :: Nat -> Nat
  mid x = case x of
    Z -> S Z
    S y -> S (S (S (S (S (S (S (S (S (S (S (S y)))))))))))
  template :: Nat -> Nat
  template x = case x of
    Z -> mid x
    S y -> slow y
  {-# INLINE [0] template #-}
  useTemplate :: Nat -> Nat
  useTemplate x = template x
  useOther :: Nat -> Nat
  useOther x = mid (S x)
passes:
- inline: shrink
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  type 1.tNat :: 2.sType {
      1.cZ :: 1.tNat;
      1.cS :: 1.tNat 2.→ 1.tNat
  }

  val 1.vslow :: 1.tNat 2.→ 1.tNat
   = λ(x : 1.tNat).
    case x as (_scrut : 1.tNat) return (1.tNat) of {
        1.cZ →
            1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS 1.cZ)))))))))))))));
        1.cS (y : 1.tNat) →
            1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS y)))))))))))))))
    }

  val 1.vtemplate inline [0] :: 1.tNat 2.→ 1.tNat
   = λ(x : 1.tNat).
    case x as (_scrut : 1.tNat) return (1.tNat) of {
        1.cZ →
            1.cS 1.cZ;
        1.cS (y : 1.tNat) →
            1.vslow y
    }

  pub val 1.vuseTemplate :: 1.tNat 2.→ 1.tNat
   = λ(x : 1.tNat).
    1.vtemplate x

  pub val 1.vuseOther :: 1.tNat 2.→ 1.tNat
   = λ(x : 1.tNat).
    1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS (1.cS x)))))))))))
status: pass
reason: A value with one use inside an INLINE value stays a value, because every copy of the INLINE value would repeat the use. A measured copy into the INLINE value is decided like any other.
