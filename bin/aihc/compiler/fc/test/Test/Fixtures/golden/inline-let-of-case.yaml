  module Test (pick) where
  import GHC.Types (Bool (..), Int (..))
  import GHC.Prim ((==#))

  isZero :: Int -> Bool
  isZero (I# n) = case n ==# 0# of
    1# -> True
    _ -> False

  pick :: Int -> Int
  pick i = case isZero i of
    True -> I# 1#
    False -> i
