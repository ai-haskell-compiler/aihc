---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (around, both) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  around :: Int -> Pair
  around n = case n of
    I# i -> Pair (I# (i -# 1#)) (I# (i +# 1#))

  both :: Int -> (# Int, Int #)
  both n = (# n, n #)
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [3.cTuple2#] 3.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep))));
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    unboxed-tuple 3.cTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). FUN @r1 @sLiftedRep a1 (FUN @r2 @(cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep)))) a2 (tTuple2# r1 r2 a1 a2));
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    1.cPair :: tInt 3.→ tInt 3.→ tPair
  }

  pub val 1.varound inline :: tInt 3.→ tPair
    = λ(x : tInt).
      case x return (tPair) of {
        cI# (x{1} : tInt#) →
          case v$waround x{1} return (tPair) of {
            cTuple2# (field : tInt) (field{1} : tInt) →
              cPair field field{1}
          }
      }

  val 1.v$waround :: FUN @cIntRep @(cTupleRep (c: tRuntimeRep (cBoxedRep cLifted) (c: tRuntimeRep (cBoxedRep cLifted) (c[] tRuntimeRep)))) tInt# (tTuple2# (cBoxedRep cLifted) (cBoxedRep cLifted) tInt tInt)
    = λ(x : tInt#).
      let argument : tInt# =
        prim -# x 1#cIntRep;
      let argument{1} : tInt# =
        prim +# x 1#cIntRep;
      cTuple2# @(cBoxedRep cLifted) @(cBoxedRep cLifted) @tInt @tInt (cI# argument) (cI# argument{1})

  pub val 1.vboth :: FUN @sLiftedRep @(cTupleRep (c: tRuntimeRep sLiftedRep (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) tInt (tTuple2# sLiftedRep sLiftedRep tInt tInt)
    = λ(x : tInt).
      cTuple2# @sLiftedRep @sLiftedRep @tInt @tInt x x
status: pass
reason: A result with two fields comes back from the worker in an unboxed pair, because the program already has the unboxed pair type.
