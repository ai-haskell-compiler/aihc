---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (around, both) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  around :: Int -> Pair
  around n = case n of
    I# i -> Pair (I# (i -# 1#)) (I# (i +# 1#))

  both :: Int -> (# Int, Int #)
  both n = (# n, n #)
passes:
- worker-wrapper
- simplify: 1
