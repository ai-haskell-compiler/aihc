extensions:
- DerivingStrategies
modules:
- |
  {-# LANGUAGE DerivingStrategies #-}
  module Test where

  import GHC.Prim.Show (Show)

  data Code = ExitSuccess | ExitFailure | Cλ
    deriving stock Show
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.CString
  scope 3 = "aihc-prim" GHC.Prim
  scope 4 = "aihc-prim" GHC.Prim.Show
  scope 5 = "aihc-prim" GHC.Types

  import headers
    constructors [4.c$Dict$Show] 4.t$Dict$Show :: ∀(a : sType). sType;
    3.tAddr# :: tTYPE cAddrRep;
    constructors [5.cC#] 5.tChar :: sType;
    constructors [5.cI#] 5.tInt :: sType;
    constructors [5.cLifted, 5.cUnlifted] 5.tLevity :: sType;
    5.sLiftedRep :: tRuntimeRep;
    constructors [5.cAddrRep, 5.cBoxedRep, 5.cDoubleRep, 5.cFloatRep, 5.cInt16Rep, 5.cInt32Rep, 5.cInt64Rep, 5.cInt8Rep, 5.cIntRep, 5.cSumRep, 5.cTupleRep, 5.cVecRep, 5.cWord16Rep, 5.cWord32Rep, 5.cWord64Rep, 5.cWord8Rep, 5.cWordRep] 5.tRuntimeRep :: sType;
    5.tTYPE :: ∀(rep : tRuntimeRep). sType;
    5.sType :: sType;
    constructors [5.c[], 5.c:] 5.t[] :: ∀(a : sType). sType;
    4.c$Dict$Show :: ∀(a : sType). (tInt → a → t[] tChar → t[] tChar) → (a → t[] tChar) → (t[] a → t[] tChar → t[] tChar) → t$Dict$Show a;
    4.v$dmshow :: ∀(a : sType). t$Dict$Show a → a → t[] tChar;
    4.v$dmshowList :: ∀(a : sType). t$Dict$Show a → t[] a → t[] tChar → t[] tChar;
    5.cAddrRep :: tRuntimeRep;
    5.cBoxedRep :: tLevity → tRuntimeRep;
    5.cLifted :: tLevity;
    2.vunpackAppendCString# :: tAddr# → t[] tChar → t[] tChar;
    2.vunpackAppendCStringUtf8# :: tAddr# → t[] tChar → t[] tChar

  import synonyms
    5.sLiftedRep = cBoxedRep cLifted;
    5.sType = tTYPE sLiftedRep

  pub type 1.tCode :: sType {
    pub 1.cExitSuccess :: tCode;
    pub 1.cExitFailure :: tCode;
    pub 1.cCλ :: tCode
  }

  pub val 1.v$fShowCode :: t$Dict$Show tCode
    = c$Dict$Show @tCode v$fShowCode$cshowsPrec v$fShowCode$cshow v$fShowCode$cshowList

  val 1.v$fShowCode$cshowsPrec :: tInt → tCode → t[] tChar → t[] tChar
    = λ(_ : tInt) (y : tCode).
      case y of {
        cExitSuccess →
          λ(s : t[] tChar).
            vunpackAppendCString# ("ExitSuccess" :: tAddr#) s;
        cExitFailure →
          λ(s : t[] tChar).
            vunpackAppendCString# ("ExitFailure" :: tAddr#) s;
        cCλ →
          λ(s : t[] tChar).
            vunpackAppendCStringUtf8# ("C\xce\xbb" :: tAddr#) s
      }

  val 1.v$fShowCode$cshow :: tCode → t[] tChar
    = v$dmshow @tCode v$fShowCode

  val 1.v$fShowCode$cshowList :: t[] tCode → t[] tChar → t[] tChar
    = v$dmshowList @tCode v$fShowCode
status: pass
reason: Derived Show uses compact constructor names with a variable suffix.
