---
extensions: []
modules:
- |
  {-# LANGUAGE GeneralizedNewtypeDeriving #-}
  module Test (run) where
  import GHC.Types (Bool (..))

  class Pick a where
    pick :: a -> a -> Bool

  data Base = Base Bool

  instance Pick Base where
    pick (Base b) _ = b

  newtype Inner = Inner Base deriving newtype (Pick)
  newtype Outer = Outer Inner deriving newtype (Pick)

  run :: Outer -> Outer -> Bool
  run x y = pick x y
passes:
- inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.t$Dict$Pick (a : sType) :: sType {
    1.c$Dict$Pick :: ∀(a : sType). (a 2.→ a 2.→ tBool) 2.→ t$Dict$Pick a
  }

  type 1.tBase :: sType {
    1.cBase :: tBool 2.→ tBase
  }

  type 1.tInner :: sType {}

  axiom 1.$ax$Inner : tInner ~R tBase

  type 1.tOuter :: sType {}

  axiom 1.$ax$Outer : tOuter ~R tInner

  pub val 1.v$fPickBase :: t$Dict$Pick tBase
    = c$Dict$Pick @tBase v$fPickBase$cpick

  val 1.v$fPickBase$cpick :: tBase 2.→ tBase 2.→ tBool
    = λ(x : tBase) (y : tBase).
      case x of {
        cBase (b : tBool) →
          b
      }

  pub val 1.v$fPickInner :: t$Dict$Pick tInner
    = v$fPickBase ▷ tycon-co t$Dict$Pick (sym (axiom-co $ax$Inner))

  pub val 1.v$fPickOuter :: t$Dict$Pick tOuter
    = (v$fPickBase ▷ tycon-co t$Dict$Pick (sym (axiom-co $ax$Inner))) ▷ tycon-co t$Dict$Pick (sym (axiom-co $ax$Outer))

  pub val 1.vrun :: tOuter 2.→ tOuter 2.→ tBool
    = λ(x : tOuter) (y : tOuter).
      case (x ▷ axiom-co $ax$Outer) ▷ axiom-co $ax$Inner of {
        cBase (b : tBool) →
          b
      }
status: pass
reason: |-
  Each newtype between the instance head and its use puts one cast on the head of the method
  call, and a cast is not a variable, so the call is no candidate for inlining until the casts
  move. Pushing a cast on the head into the argument the call gives it, so that
  @(f |> fun-co g h) x@ becomes @(f (x |> sym g)) |> h@, stacks the two casts on the argument
  and leaves a plain variable in the head. The one-line method then inlines, and the copy
  drops the second argument, which it does not use.
