---
extensions:
- MagicHash
modules:
- |
  module Test where

  import GHC.Prim
  import GHC.Types (Char (..), Int (..), Word (..))

  -- A subtraction from zero is a negation.
  negateBySubtraction :: Int -> Int
  negateBySubtraction (I# x) = I# (0# -# x)

  -- A word subtraction from zero of a converted Int is the conversion of
  -- the negation.
  negateWord :: Int -> Word
  negateWord (I# x) = W# (minusWord# 0## (int2Word# x))

  -- Two negations cancel.
  negateTwice :: Int -> Int
  negateTwice (I# x) = I# (negateInt# (negateInt# x))

  -- ord# undoes chr#, and chr# undoes ord#.
  ordChr :: Int -> Int
  ordChr (I# x) = I# (ord# (chr# x))

  chrOrd :: Char -> Char
  chrOrd (C# c) = C# (chr# (ord# c))

  -- A mask with all bits set keeps the word.
  maskAll :: Word -> Word
  maskAll (W# w) = W# (and# w 18446744073709551615##)

  -- A multiplication by one keeps the value.
  timesOne :: Int -> Int
  timesOne (I# x) = I# (1# *# x)

  -- The length of a C string literal is a literal. It stops at the first
  -- zero byte.
  stringLength :: Int
  stringLength = I# (cstringLength# "defined"#)

  -- Two offsets by literals become one offset.
  offsetTwice :: Int -> Int
  offsetTwice (I# x) = I# ((x +# 1#) +# 1#)

  offsetBack :: Int -> Int
  offsetBack (I# x) = I# ((x +# 1#) -# 3#)

  offsetCancel :: Word -> Word
  offsetCancel (W# w) = W# (minusWord# (plusWord# w 5##) 5##)
passes:
- simplify
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    int2Word# = 2.vint2Word# :: FUN @cIntRep @cWordRep tInt# tWord#;
    negateInt# = 2.vnegateInt# :: FUN @cIntRep @cIntRep tInt# tInt#

  import headers
    constructors [3.cC#] 3.tChar :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.cW#] 3.tWord :: sType;
    2.tWord# :: tTYPE cWordRep;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cW# :: FUN @cWordRep @sLiftedRep tWord# tWord;
    3.cWordRep :: tRuntimeRep

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vnegateBySubtraction :: tInt → tInt
    = λ(x : tInt).
      let! cI# (x{1} : tInt#) = x;
      cI# (prim negateInt# x{1})

  pub val 1.vnegateWord :: tInt → tWord
    = λ(x : tInt).
      let! cI# (x{1} : tInt#) = x;
      cW# (prim int2Word# (prim negateInt# x{1}))

  pub val 1.vnegateTwice :: tInt → tInt
    = λ(x : tInt).
      x

  pub val 1.vordChr :: tInt → tInt
    = λ(x : tInt).
      x

  pub val 1.vchrOrd :: tChar → tChar
    = λ(x : tChar).
      x

  pub val 1.vmaskAll :: tWord → tWord
    = λ(x : tWord).
      x

  pub val 1.vtimesOne :: tInt → tInt
    = λ(x : tInt).
      x

  pub val 1.vstringLength :: tInt
    = cI# lit (7#cIntRep) :: tInt#

  pub val 1.voffsetTwice :: tInt → tInt
    = λ(x : tInt).
      let! cI# (x{1} : tInt#) = x;
      cI# (prim +# x{1} lit (2#cIntRep) :: tInt#)

  pub val 1.voffsetBack :: tInt → tInt
    = λ(x : tInt).
      let! cI# (x{1} : tInt#) = x;
      cI# (prim -# x{1} lit (2#cIntRep) :: tInt#)

  pub val 1.voffsetCancel :: tWord → tWord
    = λ(x : tWord).
      x
