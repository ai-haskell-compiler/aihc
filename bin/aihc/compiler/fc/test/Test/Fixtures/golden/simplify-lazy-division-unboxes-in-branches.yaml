---
extensions:
- MagicHash
modules:
- |
  module Test (pick) where

  import GHC.Prim ((<#), quotInt#)
  import GHC.Types (Int (..))

  pick :: Int -> Int -> Int
  pick (I# n) (I# m) =
    let quotient = I# (quotInt# n 6#)
     in case m <# 0# of
          1# -> case quotient of I# y -> I# (y <# 1#)
          _ -> case m <# 5# of
            1# -> case quotient of I# y -> I# y
            _ -> case quotient of I# y -> I# (y <# 2#)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    <# = 2.v<# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    quotInt# = 2.vquotInt# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vpick :: tInt → tInt → tInt
    = λ(x : tInt) (y : tInt).
      let! cI# (n : tInt#) = x;
      let! cI# (m : tInt#) = y;
      let argument : tInt# =
        prim quotInt# n lit (6#cIntRep) :: tInt#;
      case prim <# m lit (0#cIntRep) :: tInt# of {
        1#cIntRep →
          cI# (prim <# argument lit (1#cIntRep) :: tInt#);
        _ →
          case prim <# m lit (5#cIntRep) :: tInt# of {
            1#cIntRep →
              cI# argument;
            _ →
              cI# (prim <# argument lit (2#cIntRep) :: tInt#)
          }
      }
status: pass
lint: pass
reason: A lazy box of a division by a literal is read in every branch. The divisor is not zero and not minus one, so the division cannot fail. A strict let binds the division in front of the box, and the case of a known constructor removes the box.
