extensions:
  - DataKinds
  - FlexibleInstances
  - KindSignatures
  - MultiParamTypeClasses
  - TypeFamilies
  - UndecidableSuperClasses
modules:
  - |
    {-# LANGUAGE DataKinds, KindSignatures, MultiParamTypeClasses, FlexibleInstances, TypeFamilies, UndecidableSuperClasses #-}
    module Test where
    import GHC.Types (Type)
    type NoIx = ('[] :: [Type])
    class is ~ NoIx => Accepts (is :: [Type])
    instance Accepts '[]
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.sNoIx :: t[] sType =
    c[] sType

  pub type 1.t$Dict$Accepts (is : t[] sType) :: sType {
    pub 1.c$Dict$Accepts :: ∀(is : t[] sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (is ~ c[] sType) (t$Dict$Accepts is)
  }

  pub val 1.v$fAccepts[] :: t$Dict$Accepts (c[] sType)
    = c$Dict$Accepts @(c[] sType) (coercion (refl (c[] sType)))
status: pass
reason: The instance head is a bare empty list, and the superclass of the class is is ~ NoIx with the kinded empty list. The proof of the superclass names the kinded form, so the desugarer finds its kind. Before the fix, the proof named the bare form, and the desugarer could not infer the kind argument of the empty list.
