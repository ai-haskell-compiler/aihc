---
extensions:
- MagicHash
modules:
- |
  module Test (pick) where

  import GHC.Prim (raise#)
  import GHC.Types (Int (..))

  newtype Fn = Fn (Int -> Int)

  failure :: Fn
  failure = raise# (I# 0#)

  pick :: Int -> Fn
  pick n = case n of
    I# 0# -> failure
    _ -> Fn (\x -> x)
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    raise# = 2.vraise# :: ∀(a : tRuntimeRep) (b : sType) (c : tTYPE a). FUN @sLiftedRep @a b c

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tFn :: sType {}

  axiom 1.$ax$Fn : tFn ~R tInt → tInt

  val 1.vfailure :: tFn
    = prim raise# @sLiftedRep @tInt @tFn (cI# lit (0#cIntRep) :: tInt#)

  pub val 1.vpick :: tInt → tFn
    = λ(x : tInt).
      (λ(eta{2} : tInt).
        let! cI# (_pat : tInt#) = x;
        case _pat of {
          0#cIntRep →
            (vfailure ▷ axiom-co $ax$Fn) eta{2};
          _ →
            eta{2}
        }) ▷ sym (axiom-co $ax$Fn)
status: pass
reason: The alternative 'failure' diverges, so it does not limit the arity of the case. The other alternative is a lambda under the newtype, and 'pick' expands to two arguments. An expansion only makes the diverging alternative a lambda that diverges when it is applied.
