---
extensions:
- BangPatterns
- MagicHash
modules:
- |
  module Test (fill) where

  import GHC.Prim (Int#, (+#))
  import GHC.Types (Int (..))

  data Cursor = Cursor Int# Int

  advance :: Cursor -> Cursor
  advance cursor = case cursor of
    Cursor i total -> Cursor (i +# 1#) total

  fill :: (Int -> Int) -> Cursor -> [Int] -> Int
  fill f start xs0 = go start xs0
    where
      go !cursor xs = case xs of
        [] -> case cursor of
          Cursor i _ -> I# i
        y : ys -> case f y of
          I# _ -> go (advance cursor) ys
passes:
- inline: shrink
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tCursor :: sType {
    1.cCursor :: FUN @cIntRep @sLiftedRep tInt# (tInt 3.→ tCursor)
  }

  pub val 1.vfill :: (tInt 3.→ tInt) 3.→ tCursor 3.→ t[] tInt 3.→ tInt
    = λ(x : tInt 3.→ tInt) (y : tCursor) (z : t[] tInt).
      case y return (tInt) of {
        cCursor (x{1} : tInt#) (x{2} : tInt) →
          rec {
            $wgo : FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @(cBoxedRep cLifted) @(cBoxedRep cLifted) tInt (FUN @(cBoxedRep cLifted) @cIntRep (t[] tInt) tInt#)) =
              λ(x{3} : tInt#) (x{4} : tInt) (y{1} : t[] tInt).
                case y{1} return (tInt#) of {
                  c[] →
                    x{3};
                  c: (y{2} : tInt) (ys : t[] tInt) →
                    case x y{2} return (tInt#) of {
                      cI# (_pat : tInt#) →
                        $wgo (prim +# x{3} 1#cIntRep) x{4} ys
                    }
                }
          } in
            cI# ($wgo x{1} x{2} z)
      }
status: pass
reason: The bang pattern evaluates the cursor with a case, and a later case takes apart the binder of that case. The binder is the same value, so the worker takes the fields of the cursor.
