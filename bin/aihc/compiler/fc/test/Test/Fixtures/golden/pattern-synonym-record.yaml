extensions:
- PatternSynonyms
modules:
- |
  {-# LANGUAGE PatternSynonyms #-}
  module Test where
  data Pair a = Pair a a
  pattern Point {px, py} = Pair px py
  first p = px p
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    2.tUnit :: 3.sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tPair (a : 3.sType) :: 3.sType {
      pub 1.cPair :: ∀(a : 3.sType). a 3.→ a 3.→ 1.tPair a
  }

  pub val 1.v$mPoint :: ∀(a : 3.sType) (rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tPair a 3.→ (a 3.→ FUN @3.sLiftedRep @rep a r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
   = Λ(a : 3.sType).
    Λ(rep : 3.tRuntimeRep).
      Λ(r : 3.tTYPE rep).
        λ(x : 1.tPair a).
          λ(y : a 3.→ FUN @3.sLiftedRep @rep a r).
            λ(z : FUN @3.sLiftedRep @rep 2.tUnit r).
              case x as (_scrut : 1.tPair a) return (r) of {
                  1.cPair (px : a) (py : a) →
                      y px py;
                  _ →
                      z 2.c()
              }

  pub val 1.v$bPoint :: ∀(a : 3.sType). a 3.→ a 3.→ 1.tPair a
   = Λ(a : 3.sType).
    λ(x : a).
      λ(y : a).
        1.cPair @a x y

  pub val 1.vpx :: ∀(a : 3.sType). 1.tPair a 3.→ a
   = Λ(a : 3.sType).
    λ(x : 1.tPair a).
      case x as (_scrut : 1.tPair a) return (a) of {
          1.cPair (px : a) (py : a) →
              px
      }

  pub val 1.vpy :: ∀(a : 3.sType). 1.tPair a 3.→ a
   = Λ(a : 3.sType).
    λ(x : 1.tPair a).
      case x as (_scrut : 1.tPair a) return (a) of {
          1.cPair (px : a) (py : a) →
              py
      }

  pub val 1.vfirst :: ∀(a : 3.sType). 1.tPair a 3.→ a
   = Λ(a : 3.sType).
    λ(x : 1.tPair a).
      1.vpx @a x
status: pass
reason: A record pattern synonym gives a matcher, a builder, and one selector for each field.
