extensions:
- PatternSynonyms
modules:
- |
  {-# LANGUAGE PatternSynonyms #-}
  module Test where
  data Pair a = Pair a a
  pattern Point {px, py} = Pair px py
  first p = px p
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tPair (a : sType) :: sType {
    pub 1.cPair :: ∀(a : sType). a 3.→ a 3.→ tPair a
  }

  pub val 1.v$mPoint :: ∀(a : sType) (rep : tRuntimeRep) (r : tTYPE rep). tPair a 3.→ (a 3.→ FUN @sLiftedRep @rep a r) 3.→ FUN @sLiftedRep @rep (FUN @sLiftedRep @rep tUnit r) r
    = Λ(a : sType) (rep : tRuntimeRep) (r : tTYPE rep). λ(x : tPair a) (y : a 3.→ FUN @sLiftedRep @rep a r)
    (z : FUN @sLiftedRep @rep tUnit r).
      case x as (_scrut : tPair a) return (r) of {
        cPair (px : a) (py : a) →
          y px py
      }

  pub val 1.v$bPoint :: ∀(a : sType). a 3.→ a 3.→ tPair a
    = Λ(a : sType). λ(x : a) (y : a).
      cPair @a x y

  pub val 1.vpx :: ∀(a : sType). tPair a 3.→ a
    = Λ(a : sType). λ(x : tPair a).
      case x as (_scrut : tPair a) return (a) of {
        cPair (px : a) (py : a) →
          px
      }

  pub val 1.vpy :: ∀(a : sType). tPair a 3.→ a
    = Λ(a : sType). λ(x : tPair a).
      case x as (_scrut : tPair a) return (a) of {
        cPair (px : a) (py : a) →
          py
      }

  pub val 1.vfirst :: ∀(a : sType). tPair a 3.→ a
    = Λ(a : sType). λ(x : tPair a).
      vpx @a x
status: pass
reason: A record pattern synonym gives a matcher, a builder, and one selector for each field.
