---
extensions:
- MagicHash
modules:
- |
  module Test where

  import GHC.Prim (Int#)

  data Int = I# Int#
  newtype Wrap = Wrap Int

  unwrapAll :: [Wrap] -> [Int]
  unwrapAll ws = [ n | Wrap n <- ws ]
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.t[] :: ∀(a : 3.sType). 3.sType;
    3.c: :: ∀(a : 3.sType). a 3.→ 3.t[] a 3.→ 3.t[] a;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    3.c[] :: ∀(a : 3.sType). 3.t[] a

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tInt :: 3.sType {
      pub 1.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 1.tInt
  }

  pub type 1.tWrap :: 3.sType {}

  axiom 1.$ax$Wrap : 1.tWrap ~R 1.tInt

  pub val 1.vunwrapAll :: 3.t[] 1.tWrap 3.→ 3.t[] 1.tInt
   = λ(x : 3.t[] 1.tWrap).
    rec {
        _list_comp : 3.t[] 1.tWrap 3.→ 3.t[] 1.tInt =
            λ(_list_comp_list : 3.t[] 1.tWrap).
              case _list_comp_list as (_list_comp_scrut : 3.t[] 1.tWrap) return (3.t[] 1.tInt) of {
                  3.c[] →
                      3.c[] @1.tInt;
                  3.c: (_pat : 1.tWrap) (_list_comp_tail : 3.t[] 1.tWrap) →
                      3.c: @1.tInt (_pat ▷ axiom-co 1.$ax$Wrap) (_list_comp _list_comp_tail)
              }
    } in
        _list_comp x
status: pass
reason: A newtype constructor pattern in a list comprehension generator
  unwraps the element with the newtype axiom and no type arguments.
