extensions:
  - TypeFamilies
  - KindSignatures
modules:
  - |
    {-# LANGUAGE TypeFamilies, KindSignatures #-}
    module Test where
    import GHC.Types (Type)
    data Unit = Unit
    data Array a = Array a
    data MutableArray s a = MutableArray a
    data family MVector s a
    data family Vector a
    data instance MVector s Unit = MVUnit Unit
    data instance Vector Unit = VUnit Unit
    type family Mutable (v :: Type -> Type) :: Type -> Type -> Type
    type instance Mutable Array = MutableArray
    type instance Mutable Vector = MVector
    type family Item l
    type instance Item (Array a) = a
    type instance Item (Vector e) = e
    new :: Unit -> Mutable Vector s Unit
    new value = MVUnit value
    item :: Vector e -> Item (Vector e) -> e
    item _ value = value
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tUnit :: 2.sType {
      pub 1.cUnit :: 1.tUnit
  }

  pub type 1.tArray (a : 2.sType) :: 2.sType {
      pub 1.cArray :: ∀(a : 2.sType). a 2.→ 1.tArray a
  }

  pub type 1.tMutableArray (s : 2.sType) (a : 2.sType) :: 2.sType {
      pub 1.cMutableArray :: ∀(s : 2.sType) (a : 2.sType). a 2.→ 1.tMutableArray s a
  }

  pub type 1.tMVector (s : 2.sType) (a : 2.sType) :: 2.sType @N @N {}

  pub type 1.tVector (a : 2.sType) :: 2.sType @N {}

  type 1.t$R$MVector$MVUnit (s : 2.sType) :: 2.sType {
      pub 1.cMVUnit :: ∀(s : 2.sType). 1.tUnit 2.→ 1.t$R$MVector$MVUnit s
  }

  axiom 1.$ax$MVector$MVUnit (s : 2.sType) : 1.tMVector s 1.tUnit ~R 1.t$R$MVector$MVUnit s

  type 1.t$R$Vector$VUnit :: 2.sType {
      pub 1.cVUnit :: 1.tUnit 2.→ 1.t$R$Vector$VUnit
  }

  axiom 1.$ax$Vector$VUnit : 1.tVector 1.tUnit ~R 1.t$R$Vector$VUnit

  pub type 1.tMutable (v : 2.sType 2.→ 2.sType) :: 2.sType 2.→ 2.sType 2.→ 2.sType @N {}

  axiom 1.$ax$Mutable$Array : 1.tMutable 1.tArray ~N 1.tMutableArray

  axiom 1.$ax$Mutable$Vector : 1.tMutable 1.tVector ~N 1.tMVector

  pub type 1.tItem (l : 2.sType) :: 2.sType @N {}

  axiom 1.$ax$Item$Array$a (a : 2.sType) : 1.tItem (1.tArray a) ~N a

  axiom 1.$ax$Item$Vector$e (e : 2.sType) : 1.tItem (1.tVector e) ~N e

  pub val 1.vnew :: ∀(s : 2.sType). 1.tUnit 2.→ 1.tMutable 1.tVector s 1.tUnit
   = Λ(s : 2.sType).
    λ(x : 1.tUnit).
      (λ(_field : 1.tUnit).
        (1.cMVUnit @s _field) ▷ sym (axiom-co 1.$ax$MVector$MVUnit @s)) x

  pub val 1.vitem :: ∀(e : 2.sType). 1.tVector e 2.→ 1.tItem (1.tVector e) 2.→ e
   = Λ(e : 2.sType).
    λ(x : 1.tVector e).
      λ(y : 1.tItem (1.tVector e)).
        y
status: pass
reason: A data family is generative. Its instance axioms are representational, thus a type family equation for another type constructor does not block the equation for the data family.
