extensions:
- GADTs
- PolyKinds
- TypeOperators
- KindSignatures
- ScopedTypeVariables
modules:
- |
  {-# LANGUAGE GADTs, PolyKinds, TypeOperators, KindSignatures, ScopedTypeVariables #-}
  module Test where
  data (a :: k1) :~~: (b :: k2) where
    HRefl :: forall k (a :: k). a :~~: a
  data (a :: k) :~: (b :: k) where
    Refl :: forall k (a :: k). a :~: a
  data Maybe a = Nothing | Just a
  class C f where
    m :: f a -> f b -> Maybe (a :~: b)
  instance C ((:~~:) a) where
    m (HRefl :: a :~~: b) (HRefl :: a :~~: c) = Just (Refl :: b :~: c)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.t:~~: (k1 : sType) (k2 : sType) (a : k1) (b : k2) :: sType {
    pub 1.cHRefl :: ∀(k : sType) (a : k) (k2 : sType) (b : k2). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (k2 ~ k) (FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (t:~~: k k2 a b))
  }

  pub type 1.t:~: (k : sType) (a : k) (b : k) :: sType {
    pub 1.cRefl :: ∀(k : sType) (a : k) (b : k). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (t:~: k a b)
  }

  pub type 1.tMaybe (a : sType) :: sType {
    pub 1.cNothing :: ∀(a : sType). tMaybe a;
    pub 1.cJust :: ∀(a : sType). a → tMaybe a
  }

  pub type 1.t$Dict$C (k0 : sType) (f : k0 → sType) :: sType {
    pub 1.c$Dict$C :: ∀(k0 : sType) (f : k0 → sType). (∀(a : k0) (b : k0). f a → f b → tMaybe (t:~: k0 a b)) → t$Dict$C k0 f
  }

  pub val 1.vm :: ∀(k0 : sType) (f : k0 → sType) (a : k0) (b : k0). t$Dict$C k0 f → f a → f b → tMaybe (t:~: k0 a b)
    = Λ(k0 : sType) (f : k0 → sType) (a : k0) (b : k0). λ($dC : t$Dict$C k0 f).
      let! c$Dict$C ($cm : ∀(a{1} : k0) (b{1} : k0). f a{1} → f b{1} → tMaybe (t:~: k0 a{1} b{1})) = $dC;
      $cm @a @b

  pub val 1.v$fC:~~:a :: ∀(k0 : sType) (k1 : sType) (a : k0). t$Dict$C k1 (t:~~: k0 k1 a)
    = Λ(k0 : sType) (k1 : sType) (a : k0).
      c$Dict$C @k1 @(t:~~: k0 k1 a) (v$fC:~~:a$cm @k0 @k1 @a)

  val 1.v$fC:~~:a$cm :: ∀(k0 : sType) (k1 : sType) (a : k0) (a{1} : k1) (b : k1). t:~~: k0 k1 a a{1} → t:~~: k0 k1 a b → tMaybe (t:~: k1 a{1} b)
    = Λ(k0 : sType) (k1 : sType) (a : k0) (a{1} : k1) (b : k1). λ(x : t:~~: k0 k1 a a{1}) (y : t:~~: k0 k1 a b).
      let! cHRefl (unused $co : k1 ~ k0) ($co{1} : a{1} ~ a) = x;
      let! cHRefl ($co{2} : k1 ~ k0) ($co{3} : b ~ a) = y;
      cJust @(t:~: k1 a{1} b) ((cRefl @k0 @a @a (coercion (refl a))) ▷ tycon-co t:~: (sym ($co{2})) (sym ($co{1})) (sym ($co{3})))
status: pass
reason: A pattern signature variable that a GADT match binds keeps the kind of its variable under a given kind equality.
