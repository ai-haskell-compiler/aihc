extensions:
- ExistentialQuantification
- PatternSynonyms
modules:
- |
  {-# LANGUAGE ExistentialQuantification, PatternSynonyms #-}
  module Test where
  data Bool = True | False
  data Mark = Marked | Plain
  class Markable a where
    mark :: a -> Mark
  instance Markable Bool where
    mark True = Marked
    mark False = Plain
  data Box = forall a. Markable a => Box Bool a
  pattern Tagged :: () => Markable a => a -> Box
  pattern Tagged x <- Box True x
  inspect (Tagged x) = mark x
  inspect _ = Plain
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    2.tUnit :: 3.sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tBool :: 3.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tMark :: 3.sType {
      pub 1.cMarked :: 1.tMark;
      pub 1.cPlain :: 1.tMark
  }

  pub type 1.t$Dict$Markable (a : 3.sType) :: 3.sType {
      pub 1.c$Dict$Markable :: ∀(a : 3.sType). (a 3.→ 1.tMark) 3.→ 1.t$Dict$Markable a
  }

  pub type 1.tBox :: 3.sType {
      pub 1.cBox :: ∀(a : 3.sType). 1.t$Dict$Markable a 3.→ 1.tBool 3.→ a 3.→ 1.tBox
  }

  pub val 1.vmark :: ∀(a : 3.sType). 1.t$Dict$Markable a 3.→ a 3.→ 1.tMark
   = Λ(a : 3.sType).
    λ($d0 : 1.t$Dict$Markable a).
      case $d0 as ($dict : 1.t$Dict$Markable a) return (a 3.→ 1.tMark) of {
          1.c$Dict$Markable ($method0 : a 3.→ 1.tMark) →
              $method0
      }

  pub val 1.v$fMarkableBool :: 1.t$Dict$Markable 1.tBool
   = 1.c$Dict$Markable @1.tBool 1.v$fMarkableBool$cmark

  val 1.v$fMarkableBool$cmark :: 1.tBool 3.→ 1.tMark
   = λ(x : 1.tBool).
    case x as (_scrut : 1.tBool) return (1.tMark) of {
        1.cTrue →
            1.cMarked;
        1.cFalse →
            1.cPlain
    }

  pub val 1.v$mTagged :: ∀(rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tBox 3.→ (∀(a : 3.sType). 1.t$Dict$Markable a 3.→ FUN @3.sLiftedRep @rep a r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
   = Λ(rep : 3.tRuntimeRep).
    Λ(r : 3.tTYPE rep).
      λ(x : 1.tBox).
        λ(y : ∀(a : 3.sType). 1.t$Dict$Markable a 3.→ FUN @3.sLiftedRep @rep a r).
          λ(z : FUN @3.sLiftedRep @rep 2.tUnit r).
            case x as (_scrut : 1.tBox) return (r) of {
                1.cBox @(a : 3.sType) ($pattern_d0 : 1.t$Dict$Markable a) (_pat : 1.tBool) (x{1} : a) →
                    case _pat as (_scrut{1} : 1.tBool) return (r) of {
                        1.cTrue →
                            y @a $pattern_d0 x{1};
                        _ →
                            z 2.c()
                    };
                _ →
                    z 2.c()
            }

  pub val 1.vinspect :: 1.tBox 3.→ 1.tMark
   = λ(x : 1.tBox).
    1.v$mTagged @3.sLiftedRep @1.tMark x (Λ(a : 3.sType).
      λ($pattern_d0 : 1.t$Dict$Markable a).
        λ(x{1} : a).
          1.vmark @a $pattern_d0 x{1}) (λ(_pattern_failure : 2.tUnit).
      1.cPlain)
status: pass
reason: The matcher of a pattern synonym over an existential constructor takes a continuation that binds the type variable and the dictionary.
