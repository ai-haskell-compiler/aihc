extensions:
- ExistentialQuantification
- PatternSynonyms
modules:
- |
  {-# LANGUAGE ExistentialQuantification, PatternSynonyms #-}
  module Test where
  data Bool = True | False
  data Mark = Marked | Plain
  class Markable a where
    mark :: a -> Mark
  instance Markable Bool where
    mark True = Marked
    mark False = Plain
  data Box = forall a. Markable a => Box Bool a
  pattern Tagged :: () => Markable a => a -> Box
  pattern Tagged x <- Box True x
  inspect (Tagged x) = mark x
  inspect _ = Plain
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    2.c() :: tUnit;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub type 1.tMark :: sType {
    pub 1.cMarked :: tMark;
    pub 1.cPlain :: tMark
  }

  pub type 1.t$Dict$Markable (a : sType) :: sType {
    pub 1.c$Dict$Markable :: ∀(a : sType). (a 3.→ tMark) 3.→ t$Dict$Markable a
  }

  pub type 1.tBox :: sType {
    pub 1.cBox :: ∀(a : sType). t$Dict$Markable a 3.→ tBool 3.→ a 3.→ tBox
  }

  pub val 1.vmark :: ∀(a : sType). t$Dict$Markable a 3.→ a 3.→ tMark
    = Λ(a : sType). λ($d0 : t$Dict$Markable a).
      case $d0 as ($dict : t$Dict$Markable a) return (a 3.→ tMark) of {
        c$Dict$Markable ($method0 : a 3.→ tMark) →
          $method0
      }

  pub val 1.v$fMarkableBool :: t$Dict$Markable tBool
    = c$Dict$Markable @tBool v$fMarkableBool$cmark

  val 1.v$fMarkableBool$cmark :: tBool 3.→ tMark
    = λ(x : tBool).
      case x as (_scrut : tBool) return (tMark) of {
        cTrue →
          cMarked;
        cFalse →
          cPlain
      }

  pub val 1.v$mTagged :: ∀(rep : tRuntimeRep) (r : tTYPE rep). tBox 3.→ (∀(a : sType). t$Dict$Markable a 3.→ FUN @sLiftedRep @rep a r) 3.→ FUN @sLiftedRep @rep (FUN @sLiftedRep @rep tUnit r) r
    = Λ(rep : tRuntimeRep) (r : tTYPE rep). λ(x : tBox) (y : ∀(a : sType). t$Dict$Markable a 3.→ FUN @sLiftedRep @rep a r)
    (z : FUN @sLiftedRep @rep tUnit r).
      case x as (_scrut : tBox) return (r) of {
        cBox @(a : sType) ($pattern_d0 : t$Dict$Markable a) (_pat : tBool) (x{1} : a) →
          case _pat as (_scrut{1} : tBool) return (r) of {
            cTrue →
              y @a $pattern_d0 x{1};
            _ →
              z c()
          };
        _ →
          z c()
      }

  pub val 1.vinspect :: tBox 3.→ tMark
    = λ(x : tBox).
      v$mTagged @sLiftedRep @tMark x (Λ(a : sType). λ($pattern_d0 : t$Dict$Markable a) (x{1} : a).
        vmark @a $pattern_d0 x{1}) (λ(_pattern_failure : tUnit).
        cPlain)
status: pass
reason: The matcher of a pattern synonym over an existential constructor takes a continuation that binds the type variable and the dictionary.
