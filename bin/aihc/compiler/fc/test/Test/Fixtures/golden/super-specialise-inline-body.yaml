---
extensions: []
modules:
- |
  {-# LANGUAGE NoImplicitPrelude #-}
  module Test (wrap) where

  data Flag = Off | On
  turn :: Flag -> Flag
  turn x = x
  apply :: (Flag -> Flag) -> Flag -> Flag
  apply f x = f x
  {-# INLINE wrap #-}
  wrap :: Flag -> Flag
  wrap x = apply turn x
passes:
- super-specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tFlag :: sType {
    1.cOff :: tFlag;
    1.cOn :: tFlag
  }

  val 1.vturn :: tFlag → tFlag
    = λ(x : tFlag).
      x

  val 1.vapply :: (tFlag → tFlag) → tFlag → tFlag
    = λ(x : tFlag → tFlag) (y : tFlag).
      x y

  pub val 1.vwrap inline :: tFlag → tFlag
    = λ(x : tFlag).
      vapply vturn x
status: pass
reason: Specialization must not change the body of an INLINE value, because a larger body stops the inliner from copying it at its calls.
