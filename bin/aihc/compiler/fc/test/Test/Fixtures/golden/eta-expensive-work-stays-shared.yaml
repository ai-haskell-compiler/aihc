---
extensions:
- MagicHash
modules:
- |
  module Test (action) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  newtype Fn = Fn (Int -> Int)

  plus :: Int -> Int -> Int
  plus (I# a) (I# b) = I# (a +# b)

  step :: Int -> Int -> Fn
  step a b = let total = plus a b in Fn (\x -> plus total x)

  action :: Fn
  action = step (I# 1#) (I# 2#)
eta: true
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  type 1.tFn :: 3.sType {}

  axiom 1.$ax$Fn : 1.tFn ~R 3.tInt 3.→ 3.tInt

  val 1.vplus :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (_scrut : 3.tInt) return (3.tInt) of {
          3.cI# (a : 2.tInt#) →
              case y as (_scrut{1} : 3.tInt) return (3.tInt) of {
                  3.cI# (b : 2.tInt#) →
                      3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a b)
              }
      }

  val 1.vstep :: 3.tInt 3.→ 3.tInt 3.→ 1.tFn
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      let {
          total : 3.tInt =
              1.vplus x y
      } in
          (λ(x{1} : 3.tInt).
            1.vplus total x{1}) ▷ sym (axiom-co 1.$ax$Fn)

  pub val 1.vaction :: 1.tFn
   = 1.vstep (3.cI# 1#3.cIntRep) (3.cI# 2#3.cIntRep)
status: pass
reason: The argument under the newtype is not a state token, so it is not one-shot, and eta expanding past the 'let' would recompute 'plus a b' on every call where the partial application shared it. The value stays a CAF.
