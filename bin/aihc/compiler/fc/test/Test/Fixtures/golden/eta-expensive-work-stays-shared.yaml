---
extensions:
- MagicHash
modules:
- |
  module Test (action) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  newtype Fn = Fn (Int -> Int)

  plus :: Int -> Int -> Int
  plus (I# a) (I# b) = I# (a +# b)

  step :: Int -> Int -> Fn
  step a b = let total = plus a b in Fn (\x -> plus total x)

  action :: Fn
  action = step (I# 1#) (I# 2#)
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tFn :: sType {}

  axiom 1.$ax$Fn : tFn ~R tInt 3.→ tInt

  val 1.vplus :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case x of {
        cI# (a : tInt#) →
          case y of {
            cI# (b : tInt#) →
              cI# (prim +# a b)
          }
      }

  val 1.vstep :: tInt 3.→ tInt 3.→ tFn
    = λ(x : tInt) (y : tInt).
      let total : tInt =
          vplus x y;
        (λ(x{1} : tInt).
          vplus total x{1}) ▷ sym (axiom-co $ax$Fn)

  pub val 1.vaction :: tFn
    = vstep (cI# lit (1#cIntRep) :: tInt#) (cI# lit (2#cIntRep) :: tInt#)
status: pass
reason: The argument under the newtype is not a state token, so it is not one-shot, and eta expanding past the 'let' would recompute 'plus a b' on every call where the partial application shared it. The value stays a CAF.
