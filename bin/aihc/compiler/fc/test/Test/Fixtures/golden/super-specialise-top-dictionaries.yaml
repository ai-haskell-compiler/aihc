---
extensions: []
modules:
- |
  {-# LANGUAGE NoImplicitPrelude #-}
  module Test (run, runBox, generic) where

  data Flag = Off | On
  data Box a = Box a
  class Toggle a where
    toggle :: a -> a
  instance Toggle Flag where
    toggle Off = On
    toggle On = Off
  instance Toggle a => Toggle (Box a) where
    toggle (Box x) = Box (toggle x)
  runBox :: Box Flag -> Box Flag
  runBox = loop On
  loop :: Toggle a => Flag -> a -> a
  loop Off x = x
  loop On x = loop Off (toggle x)
  generic :: Toggle a => Flag -> a -> a
  generic = loop
  run :: Flag -> Flag
  run = loop On
passes:
- super-specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

