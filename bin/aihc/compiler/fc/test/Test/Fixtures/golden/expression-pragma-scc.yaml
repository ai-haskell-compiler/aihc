extensions: []
modules:
  - |
    module Test where
    data Nat = Z | S Nat
    double :: Nat -> Nat
    double n = {-# SCC "double" #-} S n
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tNat :: 2.sType {
      pub 1.cZ :: 1.tNat;
      pub 1.cS :: 1.tNat 2.→ 1.tNat
  }

  pub val 1.vdouble :: 1.tNat 2.→ 1.tNat
   = λ(x : 1.tNat).
    1.cS x
status: pass
reason: An SCC pragma on an expression desugars to the wrapped expression.
