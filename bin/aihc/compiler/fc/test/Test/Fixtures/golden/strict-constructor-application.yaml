---
extensions: []
modules:
- |
  module Test where

  data StrictPair a = StrictPair !a !a

  makePair :: a -> a -> StrictPair a
  makePair left right = StrictPair left right
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tStrictPair (a : 2.tType) :: 2.tType {
      pub 1.vStrictPair :: ∀(a : 2.tType). a 2.→ a 2.→ 1.tStrictPair a
  }

  pub val 1.vmakePair :: ∀(a : 2.tType). a 2.→ a 2.→ 1.tStrictPair a
   = Λ(a : 2.tType).
    λ(x : a).
      λ(y : a).
        (λ(_strict_field : a).
          λ(_strict_field{1} : a).
            case _strict_field as (_strict_forced : a) return (1.tStrictPair a) of {
                _ →
                    case _strict_field{1} as (_strict_forced{1} : a) return (1.tStrictPair a) of {
                        _ →
                            1.vStrictPair @a _strict_field _strict_field{1}
                    }
            }) x y
status: pass
reason: A strict constructor application forces each strict field before it builds the value.
