---
extensions: []
modules:
- |
  module Test where

  data StrictPair a = StrictPair !a !a

  makePair :: a -> a -> StrictPair a
  makePair left right = StrictPair left right
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tStrictPair (a : 2.sType) :: 2.sType {
      pub 1.cStrictPair :: ∀(a : 2.sType). a 2.→ a 2.→ 1.tStrictPair a
  }

  pub val 1.vmakePair :: ∀(a : 2.sType). a 2.→ a 2.→ 1.tStrictPair a
   = Λ(a : 2.sType).
    λ(x : a).
      λ(y : a).
        (λ(_strict_field : a).
          λ(_strict_field{1} : a).
            case _strict_field as (_strict_forced : a) return (1.tStrictPair a) of {
                _ →
                    case _strict_field{1} as (_strict_forced{1} : a) return (1.tStrictPair a) of {
                        _ →
                            1.cStrictPair @a _strict_field _strict_field{1}
                    }
            }) x y
status: pass
reason: A strict constructor application forces each strict field before it builds the value.
