  module Test (eqBool) where
  import GHC.Types (Bool (..))

  class MyEq a where
    eq :: a -> a -> Bool
    neq :: a -> a -> Bool

  instance MyEq Bool where
    eq True True = True
    eq False False = True
    eq _ _ = False
    neq x y = case eq x y of
      True -> False
      False -> True

  eqBool :: Bool -> Bool -> Bool
  eqBool x y = eq x y
