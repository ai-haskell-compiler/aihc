---
extensions:
- MagicHash
modules:
- |
  module Test (add, triple) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> case a of
        0# -> y
        _ -> I# (a +# b)

  triple :: Int -> Int
  triple n = case n of
    I# m -> add (I# m) (add n (I# m))
passes:
- worker-wrapper
- simplify: 1
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    strict [0] 3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vadd inline :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (wrapped : 3.tInt) return (3.tInt) of {
          3.cI# (x{1} : 2.tInt#) →
              case y as (wrapped{1} : 3.tInt) return (3.tInt) of {
                  3.cI# (y{1} : 2.tInt#) →
                      case x{1} as (_scrut : 2.tInt#) return (3.tInt) of {
                          0#3.cIntRep →
                              case y{1} as (field : 2.tInt#) return (3.tInt) of {
                                  _ →
                                      3.cI# field
                              };
                          _ →
                              case foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut y{1} as (field : 2.tInt#) return (3.tInt) of {
                                  _ →
                                      3.cI# field
                              }
                      }
              }
      }

  pub val 1.vtriple inline :: 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    case x as (wrapped : 3.tInt) return (3.tInt) of {
        3.cI# (x{1} : 2.tInt#) →
            case x{1} as (_scrut : 2.tInt#) return (3.tInt) of {
                0#3.cIntRep →
                    case x{1} as (_scrut{1} : 2.tInt#) return (3.tInt) of {
                        0#3.cIntRep →
                            3.cI# x{1};
                        _ →
                            case foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut{1} _scrut{1} as (field : 2.tInt#) return (3.tInt) of {
                                _ →
                                    3.cI# field
                            }
                    };
                _ →
                    case foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut _scrut as (field : 2.tInt#) return (3.tInt) of {
                        _ →
                            case _scrut as (_scrut{1} : 2.tInt#) return (3.tInt) of {
                                0#3.cIntRep →
                                    3.cI# field;
                                _ →
                                    case foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut{1} field as (field{1} : 2.tInt#) return (3.tInt) of {
                                        _ →
                                            3.cI# field{1}
                                    }
                            }
                    }
            }
    }
status: pass
reason: The growing inliner copies the wrapper at each call, where the case of the wrapper on a constructor argument reduces. The worker is small, so it is copied too, and no box of an argument is left.
