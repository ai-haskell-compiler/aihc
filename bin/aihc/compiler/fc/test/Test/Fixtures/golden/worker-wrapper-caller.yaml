---
extensions:
- MagicHash
modules:
- |
  module Test (add, triple) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> case a of
        0# -> y
        _ -> I# (a +# b)

  triple :: Int -> Int
  triple n = case n of
    I# m -> add (I# m) (add n (I# m))
passes:
- worker-wrapper
- simplify: 1
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vadd inline :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case x return (tInt) of {
        cI# (x{1} : tInt#) →
          case y return (tInt) of {
            cI# (y{1} : tInt#) →
              cI# (case x{1} return (tInt#) of {
                  0#cIntRep →
                    y{1};
                  _ →
                    prim +# x{1} y{1}
                })
          }
      }

  pub val 1.vtriple inline :: tInt 3.→ tInt
    = λ(x : tInt).
      case x return (tInt) of {
        cI# (x{1} : tInt#) →
          let y : tInt# =
            case x{1} return (tInt#) of {
              0#cIntRep →
                x{1};
              _ →
                prim +# x{1} x{1}
            };
          cI# (case x{1} return (tInt#) of {
              0#cIntRep →
                y;
              _ →
                prim +# x{1} y
            })
      }
status: pass
reason: The growing inliner copies the wrapper at each call, where the case of the wrapper on a constructor argument reduces. The worker is small, so it is copied too, and no box of an argument is left.
