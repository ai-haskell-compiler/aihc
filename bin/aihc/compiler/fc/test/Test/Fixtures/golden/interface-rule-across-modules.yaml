---
extensions: []
scope: module
modules:
- |
  module Lib (List (..), identity, listMap) where

  data List a = Nil | Cons a (List a)

  identity :: a -> a
  identity x = x

  listMap :: (a -> b) -> List a -> List b
  listMap f xs = case xs of
    Nil -> Nil
    Cons y ys -> Cons (f y) (listMap f ys)

  {-# RULES
  "listMap/id" forall xs. listMap identity xs = xs
    #-}
- |
  module Test (use) where
  import Lib (List, identity, listMap)

  use :: List a -> List a
  use xs = listMap identity xs
passes:
- simplify
