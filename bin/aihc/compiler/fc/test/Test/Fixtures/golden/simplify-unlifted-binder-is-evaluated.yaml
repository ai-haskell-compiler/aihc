---
extensions:
- BangPatterns
- MagicHash
modules:
- |
  module Test (box) where

  import GHC.Prim (Addr#, addr2Int#, (*#), (+#))
  import GHC.Types (Int (..))

  data P = P Addr#

  wrap :: Addr# -> P
  wrap !b = P b
  {-# INLINE wrap #-}

  box :: (Int -> Int) -> Addr# -> Int
  box f a = case wrap a of
    P c -> case f (I# (addr2Int# c)) of
      I# x -> case f (I# (x *# 3#)) of
        I# y -> f (I# (x +# y))
passes:
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    *# = 2.v*# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    addr2Int# = 2.vaddr2Int# :: FUN @cAddrRep @cIntRep tAddr# tInt#

  import headers
    2.tAddr# :: tTYPE cAddrRep;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cAddrRep :: tRuntimeRep;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tP :: sType {
    1.cP :: FUN @cAddrRep @sLiftedRep tAddr# tP
  }

  pub val 1.vbox :: (tInt 3.→ tInt) 3.→ FUN @cAddrRep @sLiftedRep tAddr# tInt
    = λ(x : tInt 3.→ tInt) (y : tAddr#).
      let! cI# (x{1} : tInt#) = x (cI# (prim addr2Int# y));
      let argument : tInt# =
        prim *# x{1} lit (3#cIntRep) :: tInt#;
      let! cI# (y{1} : tInt#) = x (cI# argument);
      let argument{1} : tInt# =
        prim +# x{1} y{1};
      x (cI# argument{1})
status: pass
reason: The bang pattern on the unlifted parameter of wrap gives a case with one default alternative. A variable of an unlifted type always holds a value, so that case only names it, the copy of wrap is the constructor, and the case on it in box selects the alternative. No box is built.
