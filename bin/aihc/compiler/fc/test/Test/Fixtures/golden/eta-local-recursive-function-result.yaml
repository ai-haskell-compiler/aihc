---
extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Types (Int (..))

  data Nat = Z | S Nat

  run :: Nat -> Int -> Nat
  run start = go start
    where
      step x rest m = case m of
        I# _ -> case x of
          Z -> rest m
          S _ -> x
      go x = step x (go (S x))
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tNat :: sType {
    1.cZ :: tNat;
    1.cS :: tNat 3.→ tNat
  }

  pub val 1.vrun :: tNat 3.→ tInt 3.→ tNat
    = λ(x : tNat).
      let step : tNat 3.→ (tInt 3.→ tNat) 3.→ tInt 3.→ tNat =
          λ(x{1} : tNat) (y : tInt 3.→ tNat) (z : tInt).
            case z of {
              cI# (_pat : tInt#) →
                case x{1} of {
                  cZ →
                    y z;
                  cS (_pat{1} : tNat) →
                    x{1}
                }
            };
        rec {
          go : tNat 3.→ tInt 3.→ tNat =
            λ(x{1} : tNat) (eta{2} : tInt).
              step x{1} (go (cS x{1})) eta{2}
        } in
          go x
status: pass
reason: The local loop calls a step of three arguments with two. Under the guess that the loop takes two arguments, its own call is a partial application, so the loop expands to two arguments and builds no closure for each step.
