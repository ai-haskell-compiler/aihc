- |
  module Test (run) where

  import GHC.Types (Int (..))

  data Nat = Z | S Nat

  run :: Nat -> Int -> Nat
  run start = go start
    where
      step x rest m = case m of
        I# _ -> case x of
          Z -> rest m
          S _ -> x
      go x = step x (go (S x))
