extensions:
- GADTs
- PolyKinds
- RankNTypes
- ScopedTypeVariables
modules:
- |
  module Test where
  import GHC.Types (Type)
  data Proxy (a :: k) = Proxy
  data Some where
    Some :: forall k (a :: k). Proxy a -> Some
  data IsFun k where
    IsFun :: IsFun (Type -> Type)
  apply :: forall a b. (a -> b) -> a -> b
  apply f x = f x
  mkApp :: forall k1 k2 (f :: k1 -> k2) (x :: k1). Proxy f -> Proxy x -> Proxy (f x)
  mkApp _ _ = Proxy
  rebuild :: forall k (f :: k) (x :: Type). IsFun k -> Proxy f -> Proxy x -> Some
  rebuild IsFun pf px = apply Some (mkApp pf px)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep 2.→ tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tProxy (k : sType) (a : k) :: sType {
    pub 1.cProxy :: ∀(k : sType) (a : k). tProxy k a
  }

  pub type 1.tSome :: sType {
    pub 1.cSome :: ∀(k : sType) (a : k). tProxy k a 2.→ tSome
  }

  pub type 1.tIsFun (k : sType) :: sType {
    pub 1.cIsFun :: ∀(k : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (k ~ (tTYPE (cBoxedRep cLifted) 2.→ tTYPE (cBoxedRep cLifted))) (tIsFun k)
  }

  pub val 1.vapply :: ∀(a : sType) (b : sType). (a 2.→ b) 2.→ a 2.→ b
    = Λ(a : sType) (b : sType). λ(x : a 2.→ b) (y : a).
      x y

  pub val 1.vmkApp :: ∀(k1 : sType) (k2 : sType) (f : k1 2.→ k2) (x : k1). tProxy (k1 2.→ k2) f 2.→ tProxy k1 x 2.→ tProxy k2 (f x)
    = Λ(k1 : sType) (k2 : sType) (f : k1 2.→ k2) (x : k1). λ(x{1} : tProxy (k1 2.→ k2) f) (y : tProxy k1 x).
      cProxy @k2 @(f x)

  pub val 1.vrebuild :: ∀(k : sType) (f : k) (x : sType). tIsFun k 2.→ tProxy k f 2.→ tProxy (tTYPE (cBoxedRep cLifted)) x 2.→ tSome
    = Λ(k : sType) (f : k) (x : sType). λ(x{1} : tIsFun k) (y : tProxy k f) (z : tProxy (tTYPE (cBoxedRep cLifted)) x).
      let! cIsFun ($pattern_d0 : k ~ (tTYPE (cBoxedRep cLifted) 2.→ tTYPE (cBoxedRep cLifted))) = x{1};
      vapply @(tProxy (tTYPE (cBoxedRep cLifted)) (f x)) @tSome (cSome @(tTYPE (cBoxedRep cLifted)) @(f x)) (vmkApp @(tTYPE (cBoxedRep cLifted)) @(tTYPE (cBoxedRep cLifted)) @f @x y z)
status: pass
