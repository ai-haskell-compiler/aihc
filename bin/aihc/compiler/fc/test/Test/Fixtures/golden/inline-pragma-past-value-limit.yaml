---
extensions: []
modules:
- |
  module Test (first, second) where
  import GHC.Types (Bool (..))

  helper :: Bool -> Bool
  helper x = case x of
    True -> False
    False -> True
  {-# INLINE helper #-}

  first :: Bool -> Bool
  first y = helper y

  second :: Bool -> Bool
  second y = helper y
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: 2.sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cFalse :: 2.tBool;
    2.cLifted :: 2.tLevity;
    2.cTrue :: 2.tBool

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub val 1.vfirst :: 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    case x as (_scrut : 2.tBool) return (2.tBool) of {
        2.cTrue →
            2.cFalse;
        2.cFalse →
            2.cTrue
    }

  pub val 1.vsecond :: 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    case x as (_scrut : 2.tBool) return (2.tBool) of {
        2.cTrue →
            2.cFalse;
        2.cFalse →
            2.cTrue
    }
status: pass
reason: The growing policy copies a small INLINE value at each call that gives its arity, also when the values it lands in have no growth left.
