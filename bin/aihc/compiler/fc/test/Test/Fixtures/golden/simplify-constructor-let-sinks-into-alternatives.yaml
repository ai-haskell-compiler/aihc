---
extensions:
- MagicHash
modules:
- |
  module Test (choose) where

  import GHC.Prim ((<#))
  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  choose :: Int -> Int -> Pair
  choose (I# a) (I# b) =
    let box = I# a
     in case a <# b of
          1# -> Pair box box
          _ -> case b <# 0# of
            1# -> Pair box (I# b)
            _ -> Pair (I# b) (I# b)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    <# = 2.v<# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    pub 1.cPair :: tInt 3.→ tInt 3.→ tPair
  }

  pub val 1.vchoose :: tInt 3.→ tInt 3.→ tPair
    = λ(x : tInt) (y : tInt).
      let! cI# (a : tInt#) = x;
      let! cI# (b : tInt#) = y;
      case prim <# a b of {
        1#cIntRep →
          let box : tInt =
            cI# a;
          cPair box box;
        _ →
          case prim <# b lit (0#cIntRep) :: tInt# of {
            1#cIntRep →
              let box : tInt =
                cI# a;
              cPair box (cI# b);
            _ →
              cPair (cI# b) (cI# b)
          }
      }
status: pass
reason: The box is a constructor of a variable, and two of the three paths use it. The let moves past the comparisons into the alternatives that use it, so each of those paths builds the box once and the last path builds no box.
