---
extensions:
- MagicHash
- RankNTypes
modules:
- |
  module Test (prefix) where
  import GHC.Prim (Int#, (-#), (<#), (==#))
  import GHC.Types (Int (..))
  data Nat = Z | S Nat
  data List a = Nil | Cons a (List a)
  build :: (forall b. (a -> b -> b) -> b -> b) -> List a
  build g = g Cons Nil
  {-# INLINE [1] build #-}
  foldr :: (a -> b -> b) -> b -> List a -> b
  foldr k z xs = go xs
    where
      go Nil = z
      go (Cons y ys) = k y (go ys)
  {-# INLINE [1] foldr #-}
  {-# RULES
  "fold/build" forall k z (g :: forall b. (a -> b -> b) -> b -> b). foldr k z (build g) = g k z
    #-}
  iterate :: (a -> a) -> a -> List a
  iterate f x = Cons x (iterate f (f x))
  iterateFB :: (a -> b -> b) -> (a -> a) -> a -> b
  iterateFB c f x0 = go x0
    where
      go x = c x (go (f x))
  {-# INLINE [1] iterateFB #-}
  {-# RULES
  "iterate" [~1] forall f x. iterate f x = build (\c _n -> iterateFB c f x)
  "iterateFB" [1] iterateFB Cons = iterate
  "iterate/build" [1] forall f x. build (\c n -> iterateFB c f x) = iterate f x
    #-}
  take :: Int -> List a -> List a
  take (I# m) xs = case m <# 1# of
    1# -> Nil
    _ -> unsafeTake m xs
  unsafeTake :: Int# -> List a -> List a
  unsafeTake m xs = case xs of
    Nil -> Nil
    Cons y ys -> Cons y (case m ==# 1# of
      1# -> Nil
      _ -> unsafeTake (m -# 1#) ys)
  takeFB :: (a -> b -> b) -> b -> a -> (Int -> b) -> Int -> b
  takeFB c n x xs m = case m of
    I# k -> case k ==# 1# of
      1# -> c x n
      _ -> c x (xs (I# (k -# 1#)))
  {-# INLINE [1] takeFB #-}
  takeEnd :: b -> Int -> b
  takeEnd n m = case m of
    I# _ -> n
  {-# INLINE [1] takeEnd #-}
  takeWith :: b -> Int -> (Int -> b) -> b
  takeWith n m go = case m of
    I# k -> case k <# 1# of
      1# -> n
      _ -> go m
  {-# INLINE [1] takeWith #-}
  {-# RULES
  "take" [~1] forall m xs. take m xs = build (\c n -> takeWith n m (foldr (takeFB c n) (takeEnd n) xs))
  "takeList" [1] forall m xs. takeWith Nil m (foldr (takeFB Cons Nil) (takeEnd Nil) xs) = take m xs
  "take/build" [1] forall m xs. build (\c n -> takeWith n m (foldr (takeFB c n) (takeEnd n) xs)) = take m xs
    #-}
  count :: List a -> Nat
  count = foldr (\_ r -> S r) Z
  prefix :: Int -> Nat -> Nat
  prefix m s = count (take m (iterate S s))
passes:
- eta
- inline: shrink
- inline: grow
- eta
- worker-wrapper: locals
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    <# = 2.v<# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    ==# = 2.v==# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tNat :: sType {
    1.cZ :: tNat;
    1.cS :: tNat 3.→ tNat
  }

  type 1.tList (a : sType) :: sType {
    1.cNil :: ∀(a : sType). tList a;
    1.cCons :: ∀(a : sType). a 3.→ tList a 3.→ tList a
  }

  val 1.vbuild inline [1] :: ∀(a : sType). (∀(b : sType). (a 3.→ b 3.→ b) 3.→ b 3.→ b) 3.→ tList a
    = Λ(a : sType). λ(x : ∀(b : sType). (a 3.→ b 3.→ b) 3.→ b 3.→ b).
      x @(tList a) (cCons @a) (cNil @a)

  val 1.vfoldr inline [1] :: ∀(a : sType) (b : sType). (a 3.→ b 3.→ b) 3.→ b 3.→ tList a 3.→ b
    = Λ(a : sType) (b : sType). λ(x : a 3.→ b 3.→ b) (y : b) (z : tList a).
      rec {
        go : tList a 3.→ b =
          λ(x{1} : tList a).
            case x{1} return (b) of {
              cNil →
                y;
              cCons (y{1} : a) (ys : tList a) →
                x y{1} (go ys)
            }
      } in
      go z

  val 1.viterate :: ∀(a : sType). (a 3.→ a) 3.→ a 3.→ tList a
    = Λ(a : sType). λ(x : a 3.→ a) (y : a).
      cCons @a y (rec {
        go : a 3.→ tList a =
          λ(x{1} : a).
            cCons @a x{1} (go (x x{1}))
      } in
      go (x y))

  val 1.viterateFB inline [1] :: ∀(a : sType) (b : sType). (a 3.→ b 3.→ b) 3.→ (a 3.→ a) 3.→ a 3.→ b
    = Λ(a : sType) (b : sType). λ(x : a 3.→ b 3.→ b) (y : a 3.→ a) (z : a).
      rec {
        go : a 3.→ b =
          λ(x{1} : a).
            x x{1} (go (y x{1}))
      } in
      go z

  val 1.vtake :: ∀(a : sType). tInt 3.→ tList a 3.→ tList a
    = Λ(a : sType). λ(x : tInt) (y : tList a).
      case x return (tList a) of {
        cI# (m : tInt#) →
          case prim <# m 1#cIntRep return (tList a) of {
            1#cIntRep →
              cNil @a;
            _ →
              vunsafeTake @a m y
          }
      }

  val 1.vunsafeTake :: ∀(a : sType). FUN @cIntRep @sLiftedRep tInt# (tList a 3.→ tList a)
    = Λ(a : sType). λ(x : tInt#) (y : tList a).
      case y return (tList a) of {
        cNil →
          cNil @a;
        cCons (y{1} : a) (ys : tList a) →
          cCons @a y{1} (case prim ==# x 1#cIntRep return (tList a) of {
            1#cIntRep →
              cNil @a;
            _ →
              vunsafeTake @a (prim -# x 1#cIntRep) ys
          })
      }

  val 1.vtakeFB inline [1] :: ∀(a : sType) (b : sType). (a 3.→ b 3.→ b) 3.→ b 3.→ a 3.→ (tInt 3.→ b) 3.→ tInt 3.→ b
    = Λ(a : sType) (b : sType). λ(x : a 3.→ b 3.→ b) (y : b) (z : a) (x1 : tInt 3.→ b) (x2 : tInt).
      case x2 return (b) of {
        cI# (k : tInt#) →
          case prim ==# k 1#cIntRep return (b) of {
            1#cIntRep →
              x z y;
            _ →
              x z (let argument : tInt# =
                prim -# k 1#cIntRep;
              x1 (cI# argument))
          }
      }

  val 1.vtakeEnd inline [1] :: ∀(b : sType). b 3.→ tInt 3.→ b
    = Λ(b : sType). λ(x : b) (y : tInt).
      case y return (b) of {
        cI# (_pat : tInt#) →
          x
      }

  val 1.vtakeWith inline [1] :: ∀(b : sType). b 3.→ tInt 3.→ (tInt 3.→ b) 3.→ b
    = Λ(b : sType). λ(x : b) (y : tInt) (z : tInt 3.→ b).
      case y return (b) of {
        cI# (k : tInt#) →
          case prim <# k 1#cIntRep return (b) of {
            1#cIntRep →
              x;
            _ →
              z y
          }
      }

  pub val 1.vprefix :: tInt 3.→ tNat 3.→ tNat
    = λ(x : tInt) (y : tNat).
      case x return (tNat) of {
        cI# (k : tInt#) →
          case prim <# k 1#cIntRep return (tNat) of {
            1#cIntRep →
              cZ;
            _ →
              let x{1} : tNat 3.→ tNat 3.→ tNat =
                λ(_pat : tNat) (r : tNat).
                  cS r;
              rec {
                $wgo : FUN @(cBoxedRep cLifted) @(cBoxedRep cLifted) tNat (FUN @cIntRep @(cBoxedRep cLifted) tInt# tNat) =
                  λ(x{2} : tNat) (eta : tInt#).
                    case eta return (tNat) of {
                      1#cIntRep →
                        x{1} x{2} cZ;
                      _ →
                        x{1} x{2} ($wgo (cS x{2}) (prim -# eta 1#cIntRep))
                    }
              } in
              $wgo y k
          }
      }

  rule "fold/build" Λ(a : sType). Λ(b : sType). λ(k : a 3.→ b 3.→ b). λ(z : b). λ(g : ∀(b{1} : sType). (a 3.→ b{1} 3.→ b{1}) 3.→ b{1} 3.→ b{1}).
    vfoldr @a @b k z (vbuild @a (Λ(b{1} : sType).
      g @b{1}))
   = g @b k z
   :: b

  rule "iterate" [~1] Λ(a : sType). λ(f : a 3.→ a). λ(x : a).
    viterate @a f x
   = vbuild @a (Λ(b : sType). λ(c : a 3.→ b 3.→ b) (_n : b).
    viterateFB @a @b c f x)
   :: tList a

  rule "iterateFB" [1] Λ(a : sType).
    viterateFB @a @(tList a) (cCons @a)
   = viterate @a
   :: (a 3.→ a) 3.→ a 3.→ tList a

  rule "iterate/build" [1] Λ(a : sType). λ(f : a 3.→ a). λ(x : a).
    vbuild @a (Λ(b : sType). λ(c : a 3.→ b 3.→ b) (n : b).
      viterateFB @a @b c f x)
   = viterate @a f x
   :: tList a

  rule "take" [~1] Λ(a : sType). λ(m : tInt). λ(xs : tList a).
    vtake @a m xs
   = vbuild @a (Λ(b : sType). λ(c : a 3.→ b 3.→ b) (n : b).
    vtakeWith @b n m (vfoldr @a @(tInt 3.→ b) (vtakeFB @a @b c n) (vtakeEnd @b n) xs))
   :: tList a

  rule "takeList" [1] Λ(a : sType). λ(m : tInt). λ(xs : tList a).
    vtakeWith @(tList a) (cNil @a) m (vfoldr @a @(tInt 3.→ tList a) (vtakeFB @a @(tList a) (cCons @a) (cNil @a)) (vtakeEnd @(tList a) (cNil @a)) xs)
   = vtake @a m xs
   :: tList a

  rule "take/build" [1] Λ(a : sType). λ(m : tInt). λ(xs : tList a).
    vbuild @a (Λ(b : sType). λ(c : a 3.→ b 3.→ b) (n : b).
      vtakeWith @b n m (vfoldr @a @(tInt 3.→ b) (vtakeFB @a @b c n) (vtakeEnd @b n) xs))
   = vtake @a m xs
   :: tList a
status: pass
reason: The growing inliner makes the local loop of the fused take, after the first worker/wrapper split. Eta expansion gives the loop its two lambdas. The local split then gives the loop an Int# counter, and the recursive call builds no box. The top-level take keeps its boxed parameter, because this split is for local functions only.
