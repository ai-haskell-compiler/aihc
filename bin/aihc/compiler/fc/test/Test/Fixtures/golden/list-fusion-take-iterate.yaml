  val 1.vfoldr inline [1] :: ∀(a : 3.sType) (b : 3.sType). (a 3.→ b 3.→ b) 3.→ b 3.→ 1.tList a 3.→ b
   = Λ(a : 3.sType).
    Λ(b : 3.sType).
