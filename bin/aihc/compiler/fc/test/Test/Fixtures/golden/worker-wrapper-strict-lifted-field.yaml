---
extensions:
- MagicHash
modules:
- |
  module Test (first) where

  import GHC.Types (Int (..))

  data Pair = Pair {-# NOUNPACK #-} !Int {-# NOUNPACK #-} !Int

  first :: Pair -> Int
  first p = case p of
    Pair a _ -> a
passes:
- worker-wrapper
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    pub strict [0, 1] 1.cPair :: tInt → tInt → tPair
  }

  val 1.v$WPair :: tInt → tInt → tPair
    = λ(_strict_field : tInt) (_strict_field{1} : tInt).
      let! _ = _strict_field;
      let! _ = _strict_field{1};
      cPair _strict_field _strict_field{1}

  pub val 1.vfirst inline :: tPair → tInt
    = λ(x : tPair).
      let! cPair (x{1} : tInt) (x{2} : tInt) = x;
      v$wfirst x{1} x{2}

  val 1.v$wfirst :: tInt → tInt → tInt
    = λ(x : tInt) (x{1} : tInt).
      let x{2} : tPair =
        let! _ = x;
        let! _ = x{1};
        cPair x x{1};
      x
status: pass
reason: A constructor with a lifted strict field is taken apart. The worker builds the box again only for a use that needs it whole, and it evaluates each lifted strict field before the constructor. The fields come from a value that the wrapper took apart, so each evaluation finds a value. Here the body needs no box, so a later simplification removes the let.
