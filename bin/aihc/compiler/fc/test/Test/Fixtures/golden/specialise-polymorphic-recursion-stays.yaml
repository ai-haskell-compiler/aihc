---
extensions:
- MagicHash
modules:
- |
  module Test (depth) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  class Weight a where
    weight :: a -> Int

  instance Weight Bool where
    weight b = case b of
      True -> I# 1#
      False -> I# 0#

  instance Weight a => Weight [a] where
    weight xs = case xs of
      [] -> I# 0#
      (y : _) -> weight y

  plus :: Int -> Int -> Int
  plus x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  depth :: Int -> Bool -> Int
  depth n b = go n b
    where
      go :: Weight a => Int -> a -> Int
      go m v = case m of
        I# 0# -> weight v
        I# k -> go (I# (k +# -1#)) [v]
passes:
- specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.t$Dict$Weight (a : sType) :: sType {
    1.c$Dict$Weight :: ∀(a : sType). (a 3.→ tInt) 3.→ t$Dict$Weight a
  }

  val 1.vweight :: ∀(a : sType). t$Dict$Weight a 3.→ a 3.→ tInt
    = Λ(a : sType). λ($d0 : t$Dict$Weight a).
      case $d0 of {
        c$Dict$Weight ($method0 : a 3.→ tInt) →
          $method0
      }

  pub val 1.v$fWeightBool :: t$Dict$Weight tBool
    = c$Dict$Weight @tBool v$fWeightBool$cweight

  val 1.v$fWeightBool$cweight :: tBool 3.→ tInt
    = λ(x : tBool).
      case x of {
        cTrue →
          cI# lit (1#cIntRep) :: tInt#;
        cFalse →
          cI# lit (0#cIntRep) :: tInt#
      }

  pub val 1.v$fWeightList :: ∀(a : sType). t$Dict$Weight a 3.→ t$Dict$Weight (t[] a)
    = Λ(a : sType). λ($d0 : t$Dict$Weight a).
      c$Dict$Weight @(t[] a) (v$fWeightList$cweight @a $d0)

  val 1.v$fWeightList$cweight :: ∀(a : sType). t$Dict$Weight a 3.→ t[] a 3.→ tInt
    = Λ(a : sType). λ($d0 : t$Dict$Weight a) (x : t[] a).
      case x of {
        c[] →
          cI# lit (0#cIntRep) :: tInt#;
        c: (y : a) (_pat : t[] a) →
          vweight @a $d0 y
      }

  val 1.vplus :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case x of {
        cI# (a : tInt#) →
          case y of {
            cI# (b : tInt#) →
              cI# (prim +# a b)
          }
      }

  pub val 1.vdepth :: tInt 3.→ tBool 3.→ tInt
    = λ(x : tInt) (y : tBool).
      rec {
        go : ∀(a : sType). t$Dict$Weight a 3.→ tInt 3.→ a 3.→ tInt =
          Λ(a : sType). λ($d0 : t$Dict$Weight a) (x{1} : tInt) (y{1} : a).
            case x{1} of {
              cI# (_pat : tInt#) →
                case _pat of {
                  0#cIntRep →
                    vweight @a $d0 y{1};
                  _ →
                    go @(t[] a) (v$fWeightList @a $d0) (cI# (prim +# _pat lit (-1#cIntRep) :: tInt#)) (c: @a y{1} (c[] @a))
                }
            }
      } in
      go @tBool v$fWeightBool x y
status: pass
reason: The recursive call of 'go' gives the dictionary for lists, not its own dictionary parameter, so no copy can replace the parameter and the binding stays as it is.
