---
extensions:
- MagicHash
modules:
- |
  module Test (depth) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  class Weight a where
    weight :: a -> Int

  instance Weight Bool where
    weight b = case b of
      True -> I# 1#
      False -> I# 0#

  instance Weight a => Weight [a] where
    weight xs = case xs of
      [] -> I# 0#
      (y : _) -> weight y

  plus :: Int -> Int -> Int
  plus x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  depth :: Int -> Bool -> Int
  depth n b = go n b
    where
      go :: Weight a => Int -> a -> Int
      go m v = case m of
        I# 0# -> weight v
        I# k -> go (I# (k +# -1#)) [v]
passes:
- specialise
expected: |-
