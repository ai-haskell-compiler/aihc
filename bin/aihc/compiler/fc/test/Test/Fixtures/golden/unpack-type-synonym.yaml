modules:
- |
  module Test where

  import GHC.Types (Int)

  data Pair a = Pair a a
  type IntPair = Pair Int
  data Boxed = Boxed {-# UNPACK #-} !IntPair

  build :: IntPair -> Boxed
  build = Boxed

  unwrap :: Boxed -> IntPair
  unwrap (Boxed pair) = pair
