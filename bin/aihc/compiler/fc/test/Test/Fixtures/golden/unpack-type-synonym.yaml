---
extensions: []
modules:
- |
  module Test where

  import GHC.Types (Int)

  data Pair a = Pair a a
  type IntPair = Pair Int
  data Boxed = Boxed {-# UNPACK #-} !IntPair

  build :: IntPair -> Boxed
  build = Boxed

  unwrap :: Boxed -> IntPair
  unwrap (Boxed pair) = pair
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tPair (a : sType) :: sType {
    pub 1.cPair :: ∀(a : sType). a 2.→ a 2.→ tPair a
  }

  pub type 1.sIntPair :: sType =
    tPair tInt

  pub type 1.tBoxed :: sType {
    pub 1.cBoxed :: tInt 2.→ tInt 2.→ tBoxed
  }

  pub val 1.vbuild :: tPair tInt 2.→ tBoxed
    = λ(_strict_field : tPair tInt).
      case _strict_field of {
        cPair (_unpack_leaf0 : tInt) (_unpack_leaf1 : tInt) →
          cBoxed _unpack_leaf0 _unpack_leaf1
      }

  pub val 1.vunwrap :: tBoxed 2.→ tPair tInt
    = λ(x : tBoxed).
      case x of {
        cBoxed (_unpack_leaf0 : tInt) (_unpack_leaf1 : tInt) →
          cPair @tInt _unpack_leaf0 _unpack_leaf1
      }
status: pass
reason: UNPACK looks through a type synonym and rebuilds the product with its type arguments.
