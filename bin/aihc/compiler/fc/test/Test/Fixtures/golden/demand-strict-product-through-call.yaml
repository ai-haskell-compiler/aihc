---
extensions:
- Strict
- MagicHash
modules:
- |
  module Test (lit) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  plus :: Int -> Int -> Int
  plus (I# a) (I# b) = I# (a +# b)

  lit :: Int -> Int -> Int
  lit len dst = case len of
    I# 0# -> dst
    _ -> plus dst len
passes:
- demand: lets
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vplus inline :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      let! cI# (x{1} : tInt#) = x;
      let! cI# (y{1} : tInt#) = y;
      let field : tInt# =
        v$wplus x{1} y{1};
      cI# field

  val 1.v$wplus :: FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @cIntRep @cIntRep tInt# tInt#)
    = λ(x : tInt#) (y : tInt#).
      prim +# x y

  pub val 1.vlit inline :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      let! cI# (x{1} : tInt#) = x;
      let! cI# (y{1} : tInt#) = y;
      v$wlit x{1} y{1}

  val 1.v$wlit :: FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @cIntRep @(cBoxedRep cLifted) tInt# tInt)
    = λ(x : tInt#) (y : tInt#).
      let y{1} : tInt =
        cI# y;
      case x of {
        0#cIntRep →
          y{1};
        _ →
          vplus y{1} (cI# x)
      }
status: pass
reason: The Strict extension evaluates 'dst' with a case, and the body gives only the binder of that case to 'plus'. The binder is the same value as 'dst', and 'plus' has the StrictProduct demand on that parameter. Thus 'lit' also has the StrictProduct demand on 'dst', and its worker takes the field of 'dst'.
