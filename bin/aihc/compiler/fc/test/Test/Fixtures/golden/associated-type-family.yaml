extensions:
  - TypeFamilies
modules:
  - |
    module Test where
    data Nat = Z | S Nat
    data Bag = Bag Nat
    class Container c where
      type Elem c
      type Elem c = Nat
      size :: c -> Nat
    instance Container Bag where
      type Elem Bag = Bag
      size (Bag n) = n
    instance Container [a] where
      size _ = Z
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tNat :: sType {
    pub 1.cZ :: tNat;
    pub 1.cS :: tNat 2.→ tNat
  }

  pub type 1.tBag :: sType {
    pub 1.cBag :: tNat 2.→ tBag
  }

  pub type 1.t$Dict$Container (c : sType) :: sType {
    pub 1.c$Dict$Container :: ∀(c : sType). (c 2.→ tNat) 2.→ t$Dict$Container c
  }

  pub type 1.tElem (c : sType) :: sType @N {}

  axiom 1.$ax$Elem$Bag : tElem tBag ~N tBag

  axiom 1.$ax$Elem$List (a : sType) : tElem (t[] a) ~N tNat

  pub val 1.vsize :: ∀(c : sType). t$Dict$Container c 2.→ c 2.→ tNat
    = Λ(c : sType). λ($d0 : t$Dict$Container c).
      case $d0 return (c 2.→ tNat) of {
        c$Dict$Container ($method0 : c 2.→ tNat) →
          $method0
      }

  pub val 1.v$fContainerBag :: t$Dict$Container tBag
    = c$Dict$Container @tBag v$fContainerBag$csize

  val 1.v$fContainerBag$csize :: tBag 2.→ tNat
    = λ(x : tBag).
      case x return (tNat) of {
        cBag (n : tNat) →
          n
      }

  pub val 1.v$fContainerList :: ∀(a : sType). t$Dict$Container (t[] a)
    = Λ(a : sType).
      c$Dict$Container @(t[] a) (v$fContainerList$csize @a)

  val 1.v$fContainerList$csize :: ∀(a : sType). t[] a 2.→ tNat
    = Λ(a : sType). λ(x : t[] a).
      cZ
status: pass
reason: An associated type family becomes an empty family type next to the class dictionary,
  and the explicit and defaulted instance equations become axioms.
