---
extensions:
- MagicHash
modules:
- |
  module Test (sumTo) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  sumTo :: Int -> Int
  sumTo n = go n (I# 0#)
    where
      go m acc = case m of
        I# i -> case i of
          0# -> acc
          _ -> go (I# (i -# 1#)) (add acc m)
passes:
- demand
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vadd :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case x of {
        cI# (a : tInt#) →
          case y of {
            cI# (b : tInt#) →
              cI# (prim +# a b)
          }
      }

  pub val 1.vsumTo :: tInt 3.→ tInt
    = λ(x : tInt).
      rec {
        go : tInt 3.→ tInt 3.→ tInt =
          λ(x{1} : tInt) (y : tInt).
            case x{1} of {
              cI# (i : tInt#) →
                case i of {
                  0#cIntRep →
                    y;
                  _ →
                    case vadd y x{1} as (argument : tInt) of {
                      _ →
                        go (cI# (prim -# i lit (1#cIntRep) :: tInt#)) argument
                    }
                }
            }
      } in
      go x (cI# lit (0#cIntRep) :: tInt#)
status: pass
reason: A local recursive function gets a signature from the same fixpoint as a top-level value. 'go' is strict in its accumulator, so the call 'add acc m' inside 'go' is evaluated before the recursive call.
