---
extensions: ['ExistentialQuantification']
modules:
- |
  {-# LANGUAGE NoImplicitPrelude #-}
  module Test (run) where

  data Flag = Off | On
  data Box = forall a. Box (a -> Flag) a
  loop :: (a -> Flag) -> Flag -> a -> Flag
  loop f Off x = f x
  loop f On x = loop f Off x
  run :: Box -> Flag
  run (Box f x) = let g y = f y in loop g On x
passes:
- super-specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tFlag :: sType {
    1.cOff :: tFlag;
    1.cOn :: tFlag
  }

  type 1.tBox :: sType {
    1.cBox :: ∀(a : sType). (a → tFlag) → a → tBox
  }

  val 1.vloop :: ∀(a : sType). (a → tFlag) → tFlag → a → tFlag
    = Λ(a : sType). λ(x : a → tFlag) (y : tFlag) (z : a).
      case y of {
        cOff →
          x z;
        cOn →
          vloop @a x cOff z
      }

  pub val 1.vrun :: tBox → tFlag
    = λ(x : tBox).
      let! cBox @(a : sType) (f : a → tFlag) (x{1} : a) = x;
      let $sf : a → tFlag =
        λ(x{2} : a).
          f x{2};
      rec {
        $ssloop25 : tFlag → a → tFlag =
          λ(y : tFlag) (z : a).
            case y of {
              cOff →
                $sf z;
              cOn →
                $ssloop25 cOff z
            }
      } in
      $ssloop25 cOn x{1}
status: pass
reason: Specialization cannot remove a known function argument inside an existential case.
