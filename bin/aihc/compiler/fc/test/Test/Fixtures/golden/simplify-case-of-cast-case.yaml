status: pass
reason: After the inliner copies 'from', the case in 'size' takes apart a cast of a case. Each alternative of the inner case builds a constructor under the opposite cast. The case of a case moves the outer case and the cast into the inner alternatives. The two casts cancel, and the case of a known constructor selects each result. The simplifying walk then removes the unused 'P'. Thus 'size' builds no 'L', 'R' or 'P' and takes none apart.
