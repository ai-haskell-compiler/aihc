  import GHC.Types (Bool (..))

  data Box a = Box a

  class Pick f where
    pick :: f a -> a

  unbox :: Box a -> a
  unbox (Box a) = a

  instance Pick Box where
    pick = unbox

  run :: Box Bool -> Bool
  run b = pick b
