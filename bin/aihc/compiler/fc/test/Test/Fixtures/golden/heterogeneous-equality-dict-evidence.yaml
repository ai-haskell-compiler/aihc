modules:
- |
  {-# LANGUAGE GADTs, PolyKinds, TypeOperators, KindSignatures #-}
  module Equality where
  data (a :: k1) :~~: (b :: k2) where
    HRefl :: forall k (a :: k). a :~~: a
- |
  {-# LANGUAGE GADTs, PolyKinds, TypeOperators, ConstraintKinds, MultiParamTypeClasses, FlexibleInstances, KindSignatures, FunctionalDependencies #-}
  module Test where
  import GHC.Types (Constraint, type (~~))
  import Equality ((:~~:) (HRefl))
  data Dict (c :: Constraint) where
    Dict :: c => Dict c
  class HasDict c e | e -> c where
    evidence :: e -> Dict c
  instance HasDict (a ~~ b) (a :~~: b) where
    evidence HRefl = Dict
