  val 2.v$fHasDict~~ab:~~:ab$cevidence :: ∀(k0 : sType) (k1 : sType) (a : k0) (b : k1). t:~~: k0 k1 a b 3.→ tDict (t$Dict$~~ k0 k1 a b)
    = Λ(k0 : sType) (k1 : sType) (a : k0) (b : k1). λ(x : t:~~: k0 k1 a b).
      let! cHRefl ($pattern_d0 : k1 ~ k0) ($pattern_d1 : b ~ a) = x;
