---
extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  use :: Pair -> Int -> Int
  use _ y = y
  {-# NOINLINE use #-}

  run :: Pair -> [Int] -> Int
  run p xs = go p xs
    where
      go q ys = case q of
        Pair a _ -> case ys of
          [] -> a
          y : rest -> case use q y of
            I# _ -> go q rest
passes:
- worker-wrapper: late
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a → t[] a → t[] a;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    pub 1.cPair :: tInt → tInt → tPair
  }

  val 1.vuse noinline :: tPair → tInt → tInt
    = λ(unused x : tPair) (y : tInt).
      y

  pub val 1.vrun :: tPair → t[] tInt → tInt
    = λ(x : tPair) (y : t[] tInt).
      rec {
        go : tPair → t[] tInt → tInt =
          λ(x{1} : tPair) (y{1} : t[] tInt).
            let! cPair (a : tInt) (unused _pat : tInt) = x{1};
            case y{1} of {
              c[] →
                a;
              c: (y{2} : tInt) (rest : t[] tInt) →
                let! cI# (unused _pat{1} : tInt#) = vuse x{1} y{2};
                go x{1} rest
            }
      } in
      go x y
status: pass
reason: The loop takes q apart, and it also gives q whole to use at each step. The late split does not take q apart, because its worker would build the pair again at each step.
