---
extensions:
- GADTs
modules:
- |
  module Test where

  import GHC.Types (Char, Int)

  newtype Inner = Inner Int

  newtype Outer = Outer Inner

  -- The two newtype casts become one cast by the composed coercion.
  wrap :: Int -> Outer
  wrap x = Outer (Inner x)

  -- The composed coercion of the two casts is reflexive, so no cast stays.
  rewrap :: Int -> Int
  rewrap x = case wrap x of
    Outer (Inner y) -> y

  -- The equality gives a cast by a coercion of the list type. At the
  -- call, the coercion is reflexive, so the cast goes away.
  same :: (a ~ Char) => [a] -> [Char]
  same xs = xs

  chars :: [Char] -> [Char]
  chars xs = same xs
passes:
- inline: grow
- simplify
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cC#] 2.tChar :: sType;
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep 2.→ tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tInner :: sType {}

  axiom 1.$ax$Inner : tInner ~R tInt

  pub type 1.tOuter :: sType {}

  axiom 1.$ax$Outer : tOuter ~R tInner

  pub val 1.vwrap :: tInt 2.→ tOuter
    = λ(x : tInt).
      x ▷ trans (sym (axiom-co $ax$Inner)) (sym (axiom-co $ax$Outer))

  pub val 1.vrewrap :: tInt 2.→ tInt
    = λ(x : tInt).
      x

  pub val 1.vsame :: ∀(a : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (a ~ tChar) (t[] a 2.→ t[] tChar)
    = Λ(a : sType). λ($d0 : a ~ tChar) (x : t[] a).
      x ▷ tycon-co t[] ($d0)

  pub val 1.vchars :: t[] tChar 2.→ t[] tChar
    = λ(x : t[] tChar).
      x
