    3.sType = tTYPE sLiftedRep

  pub type 1.tEqual (a : sType) (b : sType) :: sType {
    pub 1.cRefl :: ∀(a : sType) (b : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (tEqual a b)
  }

  pub type 1.tBox (a : sType) :: sType {
    pub 1.cBox :: ∀(a : sType). a 3.→ tBox a
  }

  pub val 1.vlocal :: ∀(a : sType). tEqual a tUnit 3.→ tUnit 3.→ tBox a
    = Λ(a : sType). λ(x : tEqual a tUnit) (y : tUnit).
      case x as (_scrut : tEqual a tUnit) return (tBox a) of {
        cRefl ($pattern_d0 : tUnit ~ a) →
          vlocal$constant$0 ▷ sym (tycon-co tBox (sym ($pattern_d0)))
