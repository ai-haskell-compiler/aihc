---
extensions:
- MagicHash
modules:
- |
  module Test (swap) where

  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  swap :: Pair -> Pair
  swap (Pair a b) = Pair b a
  {-# INLINABLE swap #-}
passes:
- demand: lets
- worker-wrapper
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    pub 1.cPair :: tInt → tInt → tPair
  }

  pub val 1.vswap inline :: tPair → tPair
    = λ(x : tPair).
      let! cPair (x{1} : tInt) (x{2} : tInt) = x;
      v$wswap x{1} x{2}

  val 1.v$wswap inlinable :: tInt → tInt → tPair
    = λ(x : tInt) (x{1} : tInt).
      let x{2} : tPair =
        cPair x x{1};
      let! cPair (a : tInt) (b : tInt) = x{2};
      cPair b a
status: pass
reason: An INLINABLE function splits as a function without a pragma does, as in GHC. The wrapper is INLINE, and the worker keeps the INLINABLE pragma, so a later specialisation can copy the worker.
