extensions:
  - PolyKinds
  - TypeFamilies
modules:
  - |
    {-# LANGUAGE PolyKinds, TypeFamilies #-}
    module Test where
    type family Stuck (t :: k) :: j
    type family NoInstance t where
      NoInstance t = Stuck t
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tStuck (k : sType) (j : sType) (t : k) :: j @N @N @N {}

  pub type 1.tNoInstance (k0 : sType) (k1 : sType) (t : k0) :: k1 @N @N @N {}

  axiom 1.$ax$NoInstance$0 (k0 : sType) (k1 : sType) (t : k0) : tNoInstance k0 k1 t ~N tStuck k0 k1 t
status: pass
reason: NoInstance has no result signature, so its result kind k1 is a kind variable that no argument determines. Each equation binds k1, as GHC does. Before the fix, the equation did not bind k1, and the desugarer could not infer the kind argument of NoInstance.
