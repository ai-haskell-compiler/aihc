---
extensions:
- MagicHash
modules:
- |
  module Test where

  import GHC.Types (Char)

  firstSpace :: [Char] -> Char
  firstSpace (' ' : _) = 'y'
  firstSpace _ = 'n'

  emptyTail :: [Char] -> Char
  emptyTail (_ : []) = 'y'
  emptyTail _ = 'n'
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tChar :: 3.sType;
    2.tChar# :: 3.tTYPE 3.cWordRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.t[] :: ∀(a : 3.sType). 3.sType;
    3.c: :: ∀(a : 3.sType). a 3.→ 3.t[] a 3.→ 3.t[] a;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cC# :: FUN @3.cWordRep @3.sLiftedRep 2.tChar# 3.tChar;
    3.cLifted :: 3.tLevity;
    3.cWordRep :: 3.tRuntimeRep;
    3.c[] :: ∀(a : 3.sType). 3.t[] a

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vfirstSpace :: 3.t[] 3.tChar 3.→ 3.tChar
   = λ(x : 3.t[] 3.tChar).
    case x as (_scrut : 3.t[] 3.tChar) return (3.tChar) of {
        3.c: (_pat : 3.tChar) (_pat{1} : 3.t[] 3.tChar) →
            case _pat as (_scrut{1} : 3.tChar) return (3.tChar) of {
                3.cC# (_pat{2} : 2.tChar#) →
                    case _pat{2} as (_scrut{2} : 2.tChar#) return (3.tChar) of {
                        ' '#3.cWordRep →
                            3.cC# 'y'#3.cWordRep;
                        _ →
                            3.cC# 'n'#3.cWordRep
                    };
                _ →
                    3.cC# 'n'#3.cWordRep
            };
        _ →
            3.cC# 'n'#3.cWordRep
    }

  pub val 1.vemptyTail :: 3.t[] 3.tChar 3.→ 3.tChar
   = λ(x : 3.t[] 3.tChar).
    case x as (_scrut : 3.t[] 3.tChar) return (3.tChar) of {
        3.c: (_pat : 3.tChar) (_pat{1} : 3.t[] 3.tChar) →
            case _pat{1} as (_scrut{1} : 3.t[] 3.tChar) return (3.tChar) of {
                3.c[] →
                    3.cC# 'y'#3.cWordRep;
                _ →
                    3.cC# 'n'#3.cWordRep
            };
        _ →
            3.cC# 'n'#3.cWordRep
    }
status: pass
reason: Character literals in constructor patterns retain their checked types.
