extensions:
  - FlexibleContexts
  - KindSignatures
  - PolyKinds
  - RankNTypes
modules:
  - |
    {-# LANGUAGE FlexibleContexts, KindSignatures, PolyKinds, RankNTypes #-}
    module Test where
    import GHC.Types (Type)
    class FunctorT (t :: (k -> Type) -> k' -> Type) where
      tmap :: (forall a. f a -> g a) -> t f x -> t g x
    class FunctorT t => MonadT t where
      tjoin :: t (t f) a -> t f a
      tjoin = tembed (\x -> x)
      -- The method repeats the constraint of its class.
      tembed :: MonadT t => (forall x. f x -> t g x) -> t f a -> t g a
      tembed h x = tjoin (tmap h x)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.t$Dict$FunctorT (k : sType) (k' : sType) (t : (k → sType) → k' → sType) :: sType {
    pub 1.c$Dict$FunctorT :: ∀(k : sType) (k' : sType) (t : (k → sType) → k' → sType). (∀(f : k → sType) (g : k → sType) (x : k'). (∀(a : k). f a → g a) → t f x → t g x) → t$Dict$FunctorT t
  }

  pub type 1.t$Dict$MonadT (k0 : sType) (t : (k0 → sType) → k0 → sType) :: sType {
    pub 1.c$Dict$MonadT :: ∀(k0 : sType) (t : (k0 → sType) → k0 → sType). t$Dict$FunctorT t → (∀(f : k0 → sType) (a : k0). t (t f) a → t f a) → (∀(f : k0 → sType) (g : k0 → sType) (a : k0). t$Dict$MonadT t → (∀(x : k0). f x → t g x) → t f a → t g a) → t$Dict$MonadT t
  }

  pub val 1.vtmap :: ∀(k : sType) (k' : sType) (t : (k → sType) → k' → sType) (f : k → sType) (g : k → sType) (x : k'). t$Dict$FunctorT t → (∀(a : k). f a → g a) → t f x → t g x
    = Λ(k : sType) (k' : sType) (t : (k → sType) → k' → sType) (f : k → sType) (g : k → sType) (x : k').
    λ($dFunctorT : t$Dict$FunctorT t).
      let! c$Dict$FunctorT ($ctmap : ∀(f{1} : k → sType) (g{1} : k → sType) (x{1} : k'). (∀(a : k). f{1} a → g{1} a) → t f{1} x{1} → t g{1} x{1}) =
        $dFunctorT;
      $ctmap @f @g @x

  pub val 1.vtjoin :: ∀(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (a : k0). t$Dict$MonadT t → t (t f) a → t f a
    = Λ(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (a : k0). λ($dMonadT : t$Dict$MonadT t).
      let! c$Dict$MonadT (_ : t$Dict$FunctorT t) ($ctjoin : ∀(f{1} : k0 → sType) (a{1} : k0). t (t f{1}) a{1} → t f{1} a{1}) (_ : ∀(f{1} : k0 → sType) (g : k0 → sType) (a{1} : k0). t$Dict$MonadT t → (∀(x : k0). f{1} x → t g x) → t f{1} a{1} → t g a{1}) =
        $dMonadT;
      $ctjoin @f @a

  pub val 1.vtembed :: ∀(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (g : k0 → sType) (a : k0). t$Dict$MonadT t → t$Dict$MonadT t → (∀(x : k0). f x → t g x) → t f a → t g a
    = Λ(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (g : k0 → sType) (a : k0).
    λ($dMonadT : t$Dict$MonadT t) ($dMonadT{1} : t$Dict$MonadT t).
      let! c$Dict$MonadT (_ : t$Dict$FunctorT t) (_ : ∀(f{1} : k0 → sType) (a{1} : k0). t (t f{1}) a{1} → t f{1} a{1}) ($ctembed : ∀(f{1} : k0 → sType) (g{1} : k0 → sType) (a{1} : k0). t$Dict$MonadT t → (∀(x : k0). f{1} x → t g{1} x) → t f{1} a{1} → t g{1} a{1}) =
        $dMonadT;
      $ctembed @f @g @a $dMonadT{1}

  pub val 1.v$dmtjoin :: ∀(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (a : k0). t$Dict$MonadT t → t (t f) a → t f a
    = Λ(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (a : k0). λ($dMonadT : t$Dict$MonadT t).
      vtembed @t @(t f) @f @a $dMonadT $dMonadT (Λ(x : k0). λ(x{1} : t f x).
        x{1})

  pub val 1.v$dmtembed :: ∀(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (g : k0 → sType) (a : k0). t$Dict$MonadT t → t$Dict$MonadT t → (∀(x : k0). f x → t g x) → t f a → t g a
    = Λ(k0 : sType) (t : (k0 → sType) → k0 → sType) (f : k0 → sType) (g : k0 → sType) (a : k0).
    λ($dMonadT : t$Dict$MonadT t) (_ : t$Dict$MonadT t) (x : ∀(x : k0). f x → t g x) (y : t f a).
      vtjoin @t @g @a $dMonadT (vtmap @t @f @(t g) @a (let! c$Dict$MonadT ($dFunctorT : t$Dict$FunctorT t) (_ : ∀(f{1} : k0 → sType) (a{1} : k0). t (t f{1}) a{1} → t f{1} a{1}) (_ : ∀(f{1} : k0 → sType) (g{1} : k0 → sType) (a{1} : k0). t$Dict$MonadT t → (∀(x{1} : k0). f{1} x{1} → t g{1} x{1}) → t f{1} a{1} → t g{1} a{1}) =
        $dMonadT;
      $dFunctorT) (Λ(a{1} : k0).
        x @a{1}) y)
status: pass
reason: A class method whose signature repeats the class constraint keeps that constraint
  in the dictionary field and in its default method.
