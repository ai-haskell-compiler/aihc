      vtembed @k0 @t @(t f) @f @a $d0 $d0 (Λ(x : k0). λ(x{1} : t f x).
        x{1})

  pub val 1.v$dmtembed :: ∀(k0 : sType) (t : (k0 2.→ sType) 2.→ k0 2.→ sType) (f : k0 2.→ sType) (g : k0 2.→ sType) (a : k0). t$Dict$MonadT k0 t 2.→ t$Dict$MonadT k0 t 2.→ (∀(x : k0). f x 2.→ t g x) 2.→ t f a 2.→ t g a
    = Λ(k0 : sType) (t : (k0 2.→ sType) 2.→ k0 2.→ sType) (f : k0 2.→ sType) (g : k0 2.→ sType) (a : k0).
    λ($d0 : t$Dict$MonadT k0 t) ($d1 : t$Dict$MonadT k0 t) (x : ∀(x : k0). f x 2.→ t g x) (y : t f a).
      vtjoin @k0 @t @g @a $d0 (vtmap @k0 @k0 @t @f @(t g) @a (let! c$Dict$MonadT ($super_field0 : t$Dict$FunctorT k0 k0 t) ($super_field1 : ∀(f{1} : k0 2.→ sType) (a{1} : k0). t (t f{1}) a{1} 2.→ t f{1} a{1}) ($super_field2 : ∀(f{1} : k0 2.→ sType) (g{1} : k0 2.→ sType) (a{1} : k0). t$Dict$MonadT k0 t 2.→ (∀(x{1} : k0). f{1} x{1} 2.→ t g{1} x{1}) 2.→ t f{1} a{1} 2.→ t g{1} a{1}) =
        $d0;
      $super_field0) (Λ(a{1} : k0).
        x @a{1}) y)
status: pass
reason: A class method whose signature repeats the class constraint keeps that constraint
  in the dictionary field and in its default method.
