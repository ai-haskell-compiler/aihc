  pub val 1.vtembed :: ∀(k0 : sType) (t : (k0 2.→ sType) 2.→ k0 2.→ sType) (f : k0 2.→ sType) (g : k0 2.→ sType) (a : k0). t$Dict$MonadT k0 t 2.→ t$Dict$MonadT k0 t 2.→ (∀(x : k0). f x 2.→ t g x) 2.→ t f a 2.→ t g a
