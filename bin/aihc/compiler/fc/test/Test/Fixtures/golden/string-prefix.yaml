extensions: []
modules:
- |
  module Test where

  import GHC.Types (Char)

  prefix :: [Char] -> [Char]
  prefix suffix = 'E' : 'x' : 'i' : 't' : suffix

  complete :: [Char]
  complete = 'a' : 'b' : []

  single :: [Char] -> [Char]
  single suffix = 'x' : suffix

  nul :: [Char] -> [Char]
  nul suffix = 'a' : '\0' : 'b' : suffix

  unicode :: [Char] -> [Char]
  unicode suffix = '\955' : '\8594' : suffix

  variable :: Char -> [Char] -> [Char]
  variable char suffix = 'a' : 'b' : char : 'c' : 'd' : suffix
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.CString
  scope 3 = "aihc-prim" GHC.Prim
  scope 4 = "aihc-prim" GHC.Types

  import headers
    3.tAddr# :: tTYPE cAddrRep;
    constructors [4.cC#] 4.tChar :: sType;
    3.tChar# :: tTYPE cWordRep;
    constructors [4.cLifted, 4.cUnlifted] 4.tLevity :: sType;
    4.sLiftedRep :: tRuntimeRep;
    constructors [4.cAddrRep, 4.cBoxedRep, 4.cDoubleRep, 4.cFloatRep, 4.cInt16Rep, 4.cInt32Rep, 4.cInt64Rep, 4.cInt8Rep, 4.cIntRep, 4.cSumRep, 4.cTupleRep, 4.cVecRep, 4.cWord16Rep, 4.cWord32Rep, 4.cWord64Rep, 4.cWord8Rep, 4.cWordRep] 4.tRuntimeRep :: sType;
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    4.sType :: sType;
    constructors [4.c[], 4.c:] 4.t[] :: ∀(a : sType). sType;
    4.c: :: ∀(a : sType). a 4.→ t[] a 4.→ t[] a;
    4.cAddrRep :: tRuntimeRep;
    4.cBoxedRep :: tLevity 4.→ tRuntimeRep;
    4.cC# :: FUN @cWordRep @sLiftedRep tChar# tChar;
    4.cLifted :: tLevity;
    4.cWordRep :: tRuntimeRep;
    2.vunpackAppendCString# :: FUN @cAddrRep @sLiftedRep tAddr# (t[] tChar 4.→ t[] tChar);
    2.vunpackAppendCStringUtf8# :: FUN @cAddrRep @sLiftedRep tAddr# (t[] tChar 4.→ t[] tChar);
    2.vunpackCString# :: FUN @cAddrRep @sLiftedRep tAddr# (t[] tChar)

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep

  pub val 1.vprefix :: t[] tChar 4.→ t[] tChar
    = λ(x : t[] tChar).
      vunpackAppendCString# lit ("Exit"#cAddrRep) :: tAddr# x

  pub val 1.vcomplete :: t[] tChar
    = vunpackCString# lit ("ab"#cAddrRep) :: tAddr#

  pub val 1.vsingle :: t[] tChar 4.→ t[] tChar
    = λ(x : t[] tChar).
      c: @tChar (cC# lit ('x'#cWordRep) :: tChar#) x

  pub val 1.vnul :: t[] tChar 4.→ t[] tChar
    = λ(x : t[] tChar).
      vunpackAppendCStringUtf8# lit ("a\xc0\x80b"#cAddrRep) :: tAddr# x

  pub val 1.vunicode :: t[] tChar 4.→ t[] tChar
    = λ(x : t[] tChar).
      vunpackAppendCStringUtf8# lit ("\xce\xbb\xe2\x86\x92"#cAddrRep) :: tAddr# x

  pub val 1.vvariable :: tChar 4.→ t[] tChar 4.→ t[] tChar
    = λ(x : tChar) (y : t[] tChar).
      vunpackAppendCString# lit ("ab"#cAddrRep) :: tAddr# (c: @tChar x (vunpackAppendCString# lit ("cd"#cAddrRep) :: tAddr# y))
status: pass
reason: Constant character prefixes use compact string literals and preserve the suffix.
