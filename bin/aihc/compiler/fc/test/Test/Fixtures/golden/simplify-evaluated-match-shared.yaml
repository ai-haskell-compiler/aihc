---
extensions:
- MagicHash
modules:
- |
  module Test (Pair (..), both, Strict (..)) where

  import GHC.Prim ((+#), (*#))
  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  data Strict = Strict !Int

  -- Two lazy arguments take the same evaluated variable apart.
  both :: Strict -> Pair
  both s = case s of
    Strict x ->
      Pair
        (case x of I# a -> I# (a +# 1#))
        (case x of I# b -> I# (b *# 2#))
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    *# = 2.v*# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tPair :: sType {
    pub 1.cPair :: tInt 3.→ tInt 3.→ tPair
  }

  pub type 1.tStrict :: sType {
    pub strict [0] 1.cStrict :: tInt 3.→ tStrict
  }

  pub val 1.vboth :: tStrict 3.→ tPair
    = λ(x : tStrict).
      let! cStrict (x{1} : tInt) = x;
      let! cI# (a : tInt#) = x{1};
      let argument : tInt# =
        prim +# a lit (1#cIntRep) :: tInt#;
      let argument{1} : tInt# =
        prim *# a lit (2#cIntRep) :: tInt#;
      cPair (cI# argument) (cI# argument{1})
status: pass
reason: The strict field binder is evaluated, and its type has one constructor. Each match on it only reads the field, so the first match moves in front of the constructor application, and the second match selects the field that the first one gives.
