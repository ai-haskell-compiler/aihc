  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.t[] :: ∀(a : 2.tType). 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity;
    2.vTupleRep :: 2.t[] 2.tRuntimeRep 2.→ 2.tRuntimeRep;
    2.v[] :: ∀(a : 2.tType). 2.t[] a

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.t:~: (a : 2.tType) (b : 2.tType) :: 2.tType {
      pub 1.vRefl :: ∀(a : 2.tType) (b : 2.tType). FUN @(2.vTupleRep (2.v[] 2.tRuntimeRep)) @2.tLiftedRep (b ~ a) (1.t:~: a b)
  }

  pub val 1.vcast :: ∀(a : 2.tType) (b : 2.tType). 1.t:~: a b 2.→ a 2.→ b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      λ(x : 1.t:~: a b).
        λ(y : a).
          case x as (_scrut : 1.t:~: a b) return (b) of {
              1.vRefl ($pattern_d0 : b ~ a) →
