---
extensions:
- BangPatterns
- MagicHash
modules:
- |
  module Test (scan) where

  import GHC.Prim ((>=#))
  import GHC.Types (Int (..))

  step :: Int -> [Int] -> Int
  step n _ = n
  {-# NOINLINE step #-}

  scan :: Int -> Int -> [Int] -> Int
  scan (I# s) (I# e) !acc =
    step (I# e) (case s >=# e of
      1# -> acc
      _ -> I# s : acc)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    >=# = 2.v>=# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a → t[] a → t[] a;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vstep noinline :: tInt → t[] tInt → tInt
    = λ(x : tInt) (unused y : t[] tInt).
      x

  pub val 1.vscan :: tInt → tInt → t[] tInt → tInt
    = λ(x : tInt) (y : tInt) (z : t[] tInt).
      let! cI# (s : tInt#) = x;
      let! cI# (e : tInt#) = y;
      let! _ as (_scrut : t[] tInt) = z;
      let! _ as (speculated : t[] tInt) =
        case prim >=# s e of {
          1#cIntRep →
            _scrut;
          _ →
            c: @tInt (cI# s) _scrut
        };
      vstep (cI# e) speculated
status: pass
reason: The lazy argument is a case on a primitive comparison, and each alternative is an evaluated variable or a small constructor application. The case runs before the call, so the argument is a variable and not a thunk that holds every free variable of the case.
