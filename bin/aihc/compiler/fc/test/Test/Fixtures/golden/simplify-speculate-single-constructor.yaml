---
extensions:
- MagicHash
modules:
- |
  module Test (next) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  data Strict = Strict !Int

  data Box = Box Int

  next :: Strict -> Box
  next s = case s of
    Strict x -> Box (case x of
      I# a -> I# (a +# 1#))
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tStrict :: sType {
    pub strict [0] 1.cStrict :: tInt 3.→ tStrict
  }

  type 1.tBox :: sType {
    pub 1.cBox :: tInt 3.→ tBox
  }

  pub val 1.vnext :: tStrict 3.→ tBox
    = λ(x : tStrict).
      let! cStrict (x{1} : tInt) = x;
      cBox (let! cI# (a : tInt#) = x{1};
      cI# (prim +# a lit (1#cIntRep) :: tInt#))
status: pass
reason: The strict field binder is evaluated and I# is the only constructor of Int, but the case stays inside the lazy constructor argument. A case around a constructor application is not a value, and a binding of the application can already count as evaluated.
