---
extensions:
- MagicHash
modules:
- |
  module Test (next) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  data Strict = Strict !Int

  data Box = Box Int

  next :: Strict -> Box
  next s = case s of
    Strict x -> Box (case x of
      I# a -> I# (a +# 1#))
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  type 1.tStrict :: 3.sType {
      strict [0] 1.cStrict :: 3.tInt 3.→ 1.tStrict
  }

  type 1.tBox :: 3.sType {
      1.cBox :: 3.tInt 3.→ 1.tBox
  }

  pub val 1.vnext :: 1.tStrict 3.→ 1.tBox
   = λ(x : 1.tStrict).
    case x as (_scrut : 1.tStrict) return (1.tBox) of {
        1.cStrict (x{1} : 3.tInt) →
            case x{1} as (_scrut{1} : 3.tInt) return (1.tBox) of {
                3.cI# (a : 2.tInt#) →
                    let {
                        argument : 2.tInt# =
                            foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a 1#3.cIntRep
                    } in
                        1.cBox (3.cI# argument)
            }
    }
status: pass
reason: The strict field binder is evaluated and I# is the only constructor of Int, so the case cannot fail and needs no evaluation. It moves out of the lazy constructor argument, and the constructor gets a value instead of a thunk.
