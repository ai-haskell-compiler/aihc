---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (countDown) where

  import GHC.Prim ((+#), State#, RealWorld)
  import GHC.Types (IO (..), Int (..))

  thenIO :: IO a -> IO b -> IO b
  thenIO (IO m) k = IO (\s -> case m s of (# s', _ #) -> unIO k s')

  unIO :: IO a -> State# RealWorld -> (# State# RealWorld, a #)
  unIO (IO f) = f

  returnIO :: a -> IO a
  returnIO x = IO (\s -> (# s, x #))

  tick :: Int -> IO Int
  tick x = returnIO x

  countDown :: Int -> IO Int
  countDown n = IO (\s -> unIO (go n) s)
    where
      go m = tick m `thenIO` (case m of
        I# 0# -> returnIO m
        I# k -> go (I# (k +# -1#)))
passes:
- inline: shrink
