status: pass
reason: The continuation of 'thenIO' is a case whose alternatives give IO actions. After the inliner copies 'thenIO', the state token is applied to a cast of that case. The simplifier moves the cast and the application into the alternatives, so the recursive call of 'go' gives the state token directly and the lowered loop calls it with all its arguments. Every call of 'go' gives two arguments, so its second lambda is entered once per call, and the continuation moves under it from its let.
