---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (countDown) where

  import GHC.Prim ((+#), State#, RealWorld)
  import GHC.Types (IO (..), Int (..))

  thenIO :: IO a -> IO b -> IO b
  thenIO (IO m) k = IO (\s -> case m s of (# s', _ #) -> unIO k s')

  unIO :: IO a -> State# RealWorld -> (# State# RealWorld, a #)
  unIO (IO f) = f

  returnIO :: a -> IO a
  returnIO x = IO (\s -> (# s, x #))

  tick :: Int -> IO Int
  tick x = returnIO x

  countDown :: Int -> IO Int
  countDown n = IO (\s -> unIO (go n) s)
    where
      go m = tick m `thenIO` (case m of
        I# 0# -> returnIO m
        I# k -> go (I# (k +# -1#)))
passes:
- inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    3.tIO :: ∀(a : sType). sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    2.tRealWorld :: sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [3.cTuple2#] 3.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep))));
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    unboxed-tuple 3.cTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). FUN @r1 @sLiftedRep a1 (FUN @r2 @(cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep)))) a2 (tTuple2# r1 r2 a1 a2));
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  import axioms
    3.$ax$IO (a : sType) : tIO a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# tRealWorld) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# tRealWorld) a)

  val 1.vreturnIO :: ∀(a : sType). a 3.→ tIO a
    = Λ(a : sType). λ(x : a).
      (λ(s : tState# tRealWorld).
        cTuple2# @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep @(tState# tRealWorld) @a s x) ▷ sym (axiom-co $ax$IO @a)

  pub val 1.vcountDown :: tInt 3.→ tIO tInt
    = λ(x : tInt).
      rec {
        go : tInt 3.→ tIO tInt =
          λ(x{1} : tInt).
            (λ(s : tState# tRealWorld).
              case ((vreturnIO @tInt x{1}) ▷ axiom-co $ax$IO @tInt) s return (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# tRealWorld) tInt) of {
                cTuple2# (s' : tState# tRealWorld) (_pat : tInt) →
                  case x{1} return (tTuple2# (cTupleRep (c[] tRuntimeRep)) (cBoxedRep cLifted) (tState# tRealWorld) tInt) of {
                    cI# (_pat{1} : tInt#) →
                      case _pat{1} return (tTuple2# (cTupleRep (c[] tRuntimeRep)) (cBoxedRep cLifted) (tState# tRealWorld) tInt) of {
                        0#cIntRep →
                          ((vreturnIO @tInt x{1}) ▷ axiom-co $ax$IO @tInt) s';
                        _ →
                          let argument : tInt# =
                            prim +# _pat{1} -1#cIntRep;
                          ((go (cI# argument)) ▷ axiom-co $ax$IO @tInt) s'
                      }
                  }
              }) ▷ sym (axiom-co $ax$IO @tInt)
      } in
      (λ(s : tState# tRealWorld).
        ((go x) ▷ axiom-co $ax$IO @tInt) s) ▷ sym (axiom-co $ax$IO @tInt)
status: pass
reason: The continuation of 'thenIO' is a case whose alternatives give IO actions. After the inliner copies 'thenIO', the state token is applied to a cast of that case. The simplifier moves the cast and the application into the alternatives, so the recursive call of 'go' gives the state token directly and the lowered loop calls it with all its arguments. Every call of 'go' gives two arguments, so its second lambda is entered once per call, and the continuation moves under it from its let.
