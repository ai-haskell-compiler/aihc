extensions:
- ViewPatterns
modules:
- |
  {-# LANGUAGE ViewPatterns #-}
  module Test where
  data Bool = True | False
  data Shape = Circle Bool | Square Bool
  data Label = A | B | C | D
  data Four = Four Label Label Label Label
  isRound (Circle _) = True
  isRound _ = False
  flag (Circle b) = b
  flag (Square b) = b
  classify (Circle True) = A
  classify (isRound -> True) = B
  classify (flag -> True) = C
  classify _ = D
  guarded x
    | (flag -> True) <- x = A
  guarded _ = B
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tShape :: 2.sType {
      pub 1.cCircle :: 1.tBool 2.→ 1.tShape;
      pub 1.cSquare :: 1.tBool 2.→ 1.tShape
  }

  pub type 1.tLabel :: 2.sType {
      pub 1.cA :: 1.tLabel;
      pub 1.cB :: 1.tLabel;
      pub 1.cC :: 1.tLabel;
      pub 1.cD :: 1.tLabel
  }

  pub type 1.tFour :: 2.sType {
      pub 1.cFour :: 1.tLabel 2.→ 1.tLabel 2.→ 1.tLabel 2.→ 1.tLabel 2.→ 1.tFour
  }

  pub val 1.visRound :: 1.tShape 2.→ 1.tBool
   = λ(x : 1.tShape).
    case x as (_scrut : 1.tShape) return (1.tBool) of {
        1.cCircle (_pat : 1.tBool) →
            1.cTrue;
        _ →
            1.cFalse
    }

  pub val 1.vflag :: 1.tShape 2.→ 1.tBool
   = λ(x : 1.tShape).
    case x as (_scrut : 1.tShape) return (1.tBool) of {
        1.cCircle (b : 1.tBool) →
            b;
        1.cSquare (b : 1.tBool) →
            b
    }

  pub val 1.vclassify :: 1.tShape 2.→ 1.tLabel
   = λ(x : 1.tShape).
    let {
        _fail : 1.tLabel =
            case 1.visRound x as (_scrut : 1.tBool) return (1.tLabel) of {
                1.cTrue →
                    1.cB;
                _ →
                    case 1.vflag x as (_scrut{1} : 1.tBool) return (1.tLabel) of {
                        1.cTrue →
                            1.cC;
                        _ →
                            1.cD
                    }
            }
    } in
        case x as (_scrut : 1.tShape) return (1.tLabel) of {
            1.cCircle (_pat : 1.tBool) →
                case _pat as (_scrut{1} : 1.tBool) return (1.tLabel) of {
                    1.cTrue →
                        1.cA;
                    _ →
                        _fail
                };
            _ →
                _fail
        }

  pub val 1.vguarded :: 1.tShape 2.→ 1.tLabel
   = λ(x : 1.tShape).
    case 1.vflag x as (_do_scrut : 1.tBool) return (1.tLabel) of {
        1.cTrue →
            1.cA;
        _ →
            1.cB
    }
status: pass
reason: View pattern rows between constructor rows share one failure binding.
