extensions:
- ViewPatterns
modules:
- |
  {-# LANGUAGE ViewPatterns #-}
  module Test where
  data Bool = True | False
  data Shape = Circle Bool | Square Bool
  data Label = A | B | C | D
  data Four = Four Label Label Label Label
  isRound (Circle _) = True
  isRound _ = False
  flag (Circle b) = b
  flag (Square b) = b
  classify (Circle True) = A
  classify (isRound -> True) = B
  classify (flag -> True) = C
  classify _ = D
  guarded x
    | (flag -> True) <- x = A
  guarded _ = B
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub type 1.tShape :: sType {
    pub 1.cCircle :: tBool 2.→ tShape;
    pub 1.cSquare :: tBool 2.→ tShape
  }

  pub type 1.tLabel :: sType {
    pub 1.cA :: tLabel;
    pub 1.cB :: tLabel;
    pub 1.cC :: tLabel;
    pub 1.cD :: tLabel
  }

  pub type 1.tFour :: sType {
    pub 1.cFour :: tLabel 2.→ tLabel 2.→ tLabel 2.→ tLabel 2.→ tFour
  }

  pub val 1.visRound :: tShape 2.→ tBool
    = λ(x : tShape).
      case x as (_scrut : tShape) return (tBool) of {
        cCircle (_pat : tBool) →
          cTrue;
        _ →
          cFalse
      }

  pub val 1.vflag :: tShape 2.→ tBool
    = λ(x : tShape).
      case x as (_scrut : tShape) return (tBool) of {
        cCircle (b : tBool) →
          b;
        cSquare (b : tBool) →
          b
      }

  pub val 1.vclassify :: tShape 2.→ tLabel
    = λ(x : tShape).
      let _fail : tLabel =
        case visRound x as (_scrut : tBool) return (tLabel) of {
          cTrue →
            cB;
          _ →
            case vflag x as (_scrut{1} : tBool) return (tLabel) of {
              cTrue →
                cC;
              _ →
                cD
            }
        };
      case x as (_scrut : tShape) return (tLabel) of {
        cCircle (_pat : tBool) →
          case _pat as (_scrut{1} : tBool) return (tLabel) of {
            cTrue →
              cA;
            _ →
              _fail
          };
        _ →
          _fail
      }

  pub val 1.vguarded :: tShape 2.→ tLabel
    = λ(x : tShape).
      case vflag x as (_do_scrut : tBool) return (tLabel) of {
        cTrue →
          cA;
        _ →
          cB
      }
status: pass
reason: View pattern rows between constructor rows share one failure binding.
