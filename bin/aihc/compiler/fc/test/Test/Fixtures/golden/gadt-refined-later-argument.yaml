---
extensions:
- GADTs
modules:
- |
  {-# LANGUAGE GADTs #-}
  module Test where
  data Flag = Off | On
  data Shape a where
    Single :: Flag -> Shape ()
    Both :: Shape a -> Shape b -> Shape (a, b)
  both :: Flag -> Flag -> Flag
  both Off _ = Off
  both On other = other
  pick :: Shape a -> a -> Flag
  pick (Single f) _ = f
  pick (Both left right) (x, y) = both (pick left x) (pick right y)
  result :: Flag
  result = pick (Both (Single On) (Single Off)) ((), ())
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.c(,)] 2.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    2.c() :: tUnit;
    2.c(,) :: ∀(a1 : sType) (a2 : sType). a1 3.→ a2 3.→ tTuple2 a1 a2;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tFlag :: sType {
    pub 1.cOff :: tFlag;
    pub 1.cOn :: tFlag
  }

  pub type 1.tShape (a : sType) :: sType {
    pub 1.cSingle :: ∀(a : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (a ~ tUnit) (tFlag 3.→ tShape a);
    pub 1.cBoth :: ∀(a : sType) (a{1} : sType) (b : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (a ~ tTuple2 a{1} b) (tShape a{1} 3.→ tShape b 3.→ tShape a)
  }

  pub val 1.vboth :: tFlag 3.→ tFlag 3.→ tFlag
    = λ(x : tFlag) (y : tFlag).
      case x return (tFlag) of {
        cOff →
          cOff;
        cOn →
          y
      }

  pub val 1.vpick :: ∀(a : sType). tShape a 3.→ a 3.→ tFlag
    = Λ(a : sType). λ(x : tShape a) (y : a).
      case x return (tFlag) of {
        cSingle ($pattern_d0 : a ~ tUnit) (f : tFlag) →
          f;
        cBoth @(a{1} : sType) @(b : sType) ($pattern_d0 : a ~ tTuple2 a{1} b) (left : tShape a{1}) (right : tShape b) →
          case y ▷ $pattern_d0 return (tFlag) of {
            c(,) (x{1} : a{1}) (y{1} : b) →
              vboth (vpick @a{1} left x{1}) (vpick @b right y{1})
          }
      }

  pub val 1.vresult :: tFlag
    = vpick @(tTuple2 tUnit tUnit) (cBoth @(tTuple2 tUnit tUnit) @tUnit @tUnit (coercion (refl (tTuple2 tUnit tUnit))) (cSingle @tUnit (coercion (refl tUnit)) cOn) (cSingle @tUnit (coercion (refl tUnit)) cOff)) (c(,) @tUnit @tUnit c() c())
status: pass
reason: a GADT match refines the type of a later argument, thus the case on that
  argument casts its scrutinee with the equality the match gives.
