---
extensions:
- MonoLocalBinds
modules:
- |
  module Test (Size (..), total) where

  import GHC.Types (Int)

  class Size a where
    size :: a -> Int
    combine :: a -> Int -> Int

  data List a = Nil | Cons a (List a)

  total :: Size a => Int -> List a -> Int
  total acc xs =
    let go n ys = case ys of
          Nil -> n
          Cons y rest -> go (combine y (combine y acc)) rest
     in go acc xs
passes:
- specialise
- inline: grow
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.t$Dict$Size (a : sType) :: sType {
    pub 1.c$Dict$Size :: ∀(a : sType). (a 2.→ tInt) 2.→ (a 2.→ tInt 2.→ tInt) 2.→ t$Dict$Size a
  }

  type 1.tList (a : sType) :: sType {
    1.cNil :: ∀(a : sType). tList a;
    1.cCons :: ∀(a : sType). a 2.→ tList a 2.→ tList a
  }

  pub val 1.vsize :: ∀(a : sType). t$Dict$Size a 2.→ a 2.→ tInt
    = Λ(a : sType). λ($dSize : t$Dict$Size a).
      let! c$Dict$Size ($csize : a 2.→ tInt) ($ccombine : a 2.→ tInt 2.→ tInt) = $dSize;
      $csize

  pub val 1.vcombine :: ∀(a : sType). t$Dict$Size a 2.→ a 2.→ tInt 2.→ tInt
    = Λ(a : sType). λ($dSize : t$Dict$Size a).
      let! c$Dict$Size ($csize : a 2.→ tInt) ($ccombine : a 2.→ tInt 2.→ tInt) = $dSize;
      $ccombine

  pub val 1.vtotal :: ∀(a : sType). t$Dict$Size a 2.→ tInt 2.→ tList a 2.→ tInt
    = Λ(a : sType). λ($dSize : t$Dict$Size a) (x : tInt) (y : tList a).
      let! c$Dict$Size ($csize : FUN @(cBoxedRep cLifted) @(cBoxedRep cLifted) a tInt) ($ccombine : FUN @(cBoxedRep cLifted) @(cBoxedRep cLifted) a (FUN @(cBoxedRep cLifted) @(cBoxedRep cLifted) tInt tInt)) =
        $dSize;
      rec {
        $sgo : tInt 2.→ tList a 2.→ tInt =
          λ(x{1} : tInt) (y{1} : tList a).
            case y{1} of {
              cNil →
                x{1};
              cCons (y{2} : a) (rest : tList a) →
                $sgo ($ccombine y{2} ($ccombine y{2} x)) rest
            }
      } in
      $sgo x y
status: pass
reason: The loop takes the dictionary apart in each iteration. The value of the dictionary does not change in the loop, and a dictionary is never bottom, so one match in front of the loop gives the methods to every iteration.
