modules:
- |
  module Test (run) where

  import GHC.Types (Bool (..))

  data Pair = Pair [Bool] [Bool]

  walk :: Bool -> [Bool] -> [Bool]
  walk flag rest = case rest of
    [] -> [flag]
    value : values -> value : walk flag values

  run :: Bool -> [Bool] -> [Bool] -> Pair
  run flag xs ys =
    let step = walk flag
     in Pair (step xs) (step ys)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
