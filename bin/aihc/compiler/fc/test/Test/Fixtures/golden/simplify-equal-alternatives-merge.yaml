extensions:
- MagicHash
modules:
- |
  module Test (pick, same) where

  import GHC.Prim (Int#)

  data Mode = Closed | Reading | Writing | Appending

  pick :: Mode -> Int# -> Int#
  pick mode x = case mode of
    Closed -> 0#
    Reading -> x
    Writing -> 1#
    Appending -> 1#

  same :: Int# -> Int# -> Int#
  same x y = case x of
    0# -> y
    _ -> y
