extensions:
- PatternSynonyms
modules:
- |
  {-# LANGUAGE PatternSynonyms #-}
  module Test where
  data L a = N | C a (L a)
  pattern Head x <- C x _
  first (Head x) = x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tL (a : 2.tType) :: 2.tType {
      pub 1.vN :: ∀(a : 2.tType). 1.tL a;
      pub 1.vC :: ∀(a : 2.tType). a 2.→ 1.tL a 2.→ 1.tL a
  }

  pub val 1.v$mHead :: ∀(a : 2.tType) (b : 2.tType). 1.tL a 2.→ (a 2.→ b) 2.→ b 2.→ b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      λ($scrutinee : 1.tL a).
        λ($continue : a 2.→ b).
          λ($failure : b).
            case $scrutinee as (_do_scrut : 1.tL a) return (b) of {
                1.vC (x : a) (_pat : 1.tL a) →
                    $continue x;
                _ →
                    $failure
            }

  pub val 1.vfirst :: ∀(a : 2.tType). 1.tL a 2.→ a
   = Λ(a : 2.tType).
    λ(x : 1.tL a).
      let {
          _fail : a =
              case x as (_case_nomatch : 1.tL a) return (a) of {

              }
      } in
          1.v$mHead @a @a x (λ(x{1} : a).
            x{1}) _fail
status: pass
reason: A unidirectional pattern synonym gives a matcher only.
