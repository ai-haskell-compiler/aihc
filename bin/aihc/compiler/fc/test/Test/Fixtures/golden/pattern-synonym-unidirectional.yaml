extensions:
- PatternSynonyms
modules:
- |
  {-# LANGUAGE PatternSynonyms #-}
  module Test where
  data L a = N | C a (L a)
  pattern Head x <- C x _
  first (Head x) = x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    2.tUnit :: 3.sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tL (a : 3.sType) :: 3.sType {
      pub 1.cN :: ∀(a : 3.sType). 1.tL a;
      pub 1.cC :: ∀(a : 3.sType). a 3.→ 1.tL a 3.→ 1.tL a
  }

  pub val 1.v$mHead :: ∀(a : 3.sType) (rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tL a 3.→ (FUN @3.sLiftedRep @rep a r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
   = Λ(a : 3.sType).
    Λ(rep : 3.tRuntimeRep).
      Λ(r : 3.tTYPE rep).
        λ(x : 1.tL a).
          λ(y : FUN @3.sLiftedRep @rep a r).
            λ(z : FUN @3.sLiftedRep @rep 2.tUnit r).
              case x as (_scrut : 1.tL a) return (r) of {
                  1.cC (x{1} : a) (_pat : 1.tL a) →
                      y x{1};
                  _ →
                      z 2.c()
              }

  pub val 1.vfirst :: ∀(a : 3.sType). 1.tL a 3.→ a
   = Λ(a : 3.sType).
    λ(x : 1.tL a).
      1.v$mHead @a @3.sLiftedRep @a x (λ(x{1} : a).
        x{1}) (λ(_pattern_failure : 2.tUnit).
        case x as (_case_nomatch : 1.tL a) return (a) of {

        })
status: pass
reason: A unidirectional pattern synonym gives a matcher only.
