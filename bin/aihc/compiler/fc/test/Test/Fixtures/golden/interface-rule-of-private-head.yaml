extensions: []
scope: module
modules:
- |
  module Lib (useIt) where
  import GHC.Types (Bool(..))
  useIt :: Bool -> Bool
  useIt b = inner b
  inner :: Bool -> Bool
  {-# NOINLINE inner #-}
  inner b = b
  fast :: Bool -> Bool
  {-# NOINLINE fast #-}
  fast b = True
  {-# RULES
  "inner/fast" forall b. inner b = fast b
    #-}
- |
  module Test where
  import GHC.Types (Bool(..))
  import Lib (useIt)
  result :: Bool
  result = useIt False
passes:
- inline: shrink
- simplify
expected: |-
  scope 1 = "" Lib
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub val 1.vuseIt :: tBool → tBool
    = λ(x : tBool).
      vfast x

  pub val 1.vinner noinline :: tBool → tBool
    = λ(x : tBool).
      x

  pub val 1.vfast noinline :: tBool → tBool
    = λ(unused x : tBool).
      cTrue

  rule "inner/fast" λ(b : tBool).
    vinner b
   = vfast b
   :: tBool
  scope 1 = "" Lib
  scope 2 = "" Test
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cVecRep, 3.cTupleRep, 3.cSumRep, 3.cBoxedRep, 3.cIntRep, 3.cInt8Rep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cWordRep, 3.cWord8Rep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cAddrRep, 3.cFloatRep, 3.cDoubleRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cFalse :: tBool;
    3.cLifted :: tLevity;
    1.vfast :: tBool → tBool;
    1.vinner :: tBool → tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 2.vresult :: tBool
    = vfast cFalse

  rule "inner/fast" λ(b : tBool).
    vinner b
   = vfast b
   :: tBool
status: pass
reason: A rule whose head is private must reach a consumer that copies a body that calls the head, so that the call becomes a call of fast.
