      (λ(inner : tPair) (size{1} : tInt).
        let! cPair (inner0{1} : tInt#) (inner1{1} : tInt#) = inner;
        let! _ = size{1};
        cBox inner0{1} inner1{1} size{1}) (cPair inner0 inner1) y

  pub val 1.vnested :: (tInt 3.→ tInt 3.→ tInt) 3.→ tInt 3.→ tInt
    = λ(x : tInt 3.→ tInt 3.→ tInt) (y : tInt).
      let y{1} : tInt =
