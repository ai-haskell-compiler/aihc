    3.sType = tTYPE sLiftedRep

  pub type 1.tPair :: sType {
    pub 1.cPair :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# tPair)
  }

  pub type 1.tBox :: sType {
    pub strict [2] 1.cBox :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# (tInt 3.→ tBox))
  }

  pub val 1.vinner :: tBox 3.→ tPair
    = λ($record : tBox).
      let! cBox (inner0 : tInt#) (inner1 : tInt#) (size : tInt) = $record;
      cPair inner0 inner1

  pub val 1.vsize :: tBox 3.→ tInt
    = λ($record : tBox).
      let! cBox (inner0 : tInt#) (inner1 : tInt#) (size : tInt) = $record;
      size

  pub val 1.vbuild :: tPair 3.→ tInt 3.→ tBox
    = λ(x : tPair) (y : tInt).
      (λ(inner : tPair) (size : tInt).
        let! cPair (inner0 : tInt#) (inner1 : tInt#) = inner;
        let! _ = size;
        cBox inner0 inner1 size) x y

  pub val 1.vsizeOf :: tBox 3.→ tInt
    = λ(x : tBox).
      let! cBox (whole0 : tInt#) (whole1 : tInt#) (n : tInt) = x;
