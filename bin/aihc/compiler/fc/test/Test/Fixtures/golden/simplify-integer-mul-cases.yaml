---
extensions: []
modules:
- |
  module Test (integerMul) where
  import GHC.Types (Bool (..))

  data Number = IS Bool | IP Bool | IN Bool

  small :: Bool -> Bool -> Number
  small a b = IS a
  {-# NOINLINE small #-}

  byInt :: Number -> Bool -> Number
  byInt a b = a
  {-# NOINLINE byInt #-}

  large :: Number -> Number -> Number
  large (IS a) b = byInt b a
  large a (IS b) = byInt a b
  large a b = IP True

  integerMul :: Number -> Number -> Number
  integerMul (IS a) (IS b) = small a b
  integerMul a b = large a b
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tNumber :: sType {
    1.cIS :: tBool → tNumber;
    1.cIP :: tBool → tNumber;
    1.cIN :: tBool → tNumber
  }

  val 1.vsmall noinline :: tBool → tBool → tNumber
    = λ(x : tBool) (unused y : tBool).
      cIS x

  val 1.vbyInt noinline :: tNumber → tBool → tNumber
    = λ(x : tNumber) (unused y : tBool).
      x

  pub val 1.vintegerMul :: tNumber → tNumber → tNumber
    = λ(x : tNumber) (y : tNumber).
      case x of {
        cIS (a : tBool) →
          case y of {
            cIS (b : tBool) →
              vsmall a b;
            _ →
              vbyInt y a
          };
        _ →
          case y of {
            cIS (b : tBool) →
              vbyInt x b;
            _ →
              cIP cTrue
          }
      }
status: pass
reason: Each path tests each argument once.
