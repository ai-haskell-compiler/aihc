extensions: []
modules:
  - |
    module Test where

    data Flag = Off | On

    consume :: Flag -> Flag
    consume value = value

    switch :: Flag -> Flag
    switch value =
      consume
        (case value of
          Off -> On
          On -> Off)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tFlag :: 2.sType {
      pub 1.cOff :: 1.tFlag;
      pub 1.cOn :: 1.tFlag
  }

  pub val 1.vconsume :: 1.tFlag 2.→ 1.tFlag
   = λ(x : 1.tFlag).
    x

  pub val 1.vswitch :: 1.tFlag 2.→ 1.tFlag
   = λ(x : 1.tFlag).
    1.vconsume (case x as (_scrut : 1.tFlag) return (1.tFlag) of {
        1.cOff →
            1.cOn;
        1.cOn →
            1.cOff
    })
status: pass
reason: A case in an application argument keeps its checked result type.
