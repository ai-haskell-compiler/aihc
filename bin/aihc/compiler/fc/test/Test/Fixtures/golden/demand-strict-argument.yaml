---
extensions:
- MagicHash
modules:
- |
  module Test (loop) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  loop :: Int -> Int -> Int
  loop n acc = case n of
    I# i -> case i of
      0# -> acc
      _ -> loop (I# (i -# 1#)) (add acc n)
passes:
- demand
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  val 1.vadd :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (_scrut : 3.tInt) return (3.tInt) of {
          3.cI# (a : 2.tInt#) →
              case y as (_scrut{1} : 3.tInt) return (3.tInt) of {
                  3.cI# (b : 2.tInt#) →
                      3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a b)
              }
      }

  pub val 1.vloop :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (_scrut : 3.tInt) return (3.tInt) of {
          3.cI# (i : 2.tInt#) →
              case i as (_scrut{1} : 2.tInt#) return (3.tInt) of {
                  0#3.cIntRep →
                      y;
                  _ →
                      case 1.vadd y x as (argument : 3.tInt) return (3.tInt) of {
                          _ →
                              1.vloop (3.cI# (foreign {prim 2.v-# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} i 1#3.cIntRep)) argument
                      }
              }
      }
status: pass
reason: The fixpoint over the recursive value finds 'loop' strict in its accumulator, because the base case returns it and the recursive case passes it to a strict call of 'add'. The call 'add acc n' is evaluated before the recursive call, so the loop builds no chain of thunks. The constructor application 'I# (i -# 1#)' is a value and stays in place.
