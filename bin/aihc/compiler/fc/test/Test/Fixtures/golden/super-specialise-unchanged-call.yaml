  twice :: (Flag -> Flag) -> Flag -> Flag
  twice h y = h (h y)
  loop :: (Flag -> Flag) -> Flag -> Flag
  loop f Off = f Off
  loop f On = twice (\z -> case z of { Off -> f On; On -> z }) Off
  run :: Flag -> Flag -> Flag
  run captured x = let f y = case y of { Off -> captured; On -> y } in loop f x
