extensions: [GADTs, PolyKinds, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE GADTs, PolyKinds, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Maybe a = Nothing | Just a
    data Rep (a :: k) = Rep
    data SomeRep where
      SomeRep :: forall k (a :: k). Rep a -> SomeRep
    class Inspect a where
      inspect :: a -> Bool
    instance forall k (a :: k). Inspect (Rep a) where
      inspect _ = True
    inspectSome :: SomeRep -> Bool
    inspectSome (SomeRep rep) = inspect rep
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tMaybe (a : 2.sType) :: 2.sType {
      pub 1.cNothing :: ∀(a : 2.sType). 1.tMaybe a;
      pub 1.cJust :: ∀(a : 2.sType). a 2.→ 1.tMaybe a
  }

  pub type 1.tRep (k : 2.sType) (a : k) :: 2.sType {
      pub 1.cRep :: ∀(k : 2.sType) (a : k). 1.tRep k a
  }

  pub type 1.tSomeRep :: 2.sType {
      pub 1.cSomeRep :: ∀(k : 2.sType) (a : k). 1.tRep k a 2.→ 1.tSomeRep
  }

  pub type 1.t$Dict$Inspect (a : 2.sType) :: 2.sType {
      pub 1.c$Dict$Inspect :: ∀(a : 2.sType). (a 2.→ 1.tBool) 2.→ 1.t$Dict$Inspect a
  }

  pub val 1.vinspect :: ∀(a : 2.sType). 1.t$Dict$Inspect a 2.→ a 2.→ 1.tBool
   = Λ(a : 2.sType).
    λ($d0 : 1.t$Dict$Inspect a).
      case $d0 as ($dict : 1.t$Dict$Inspect a) return (a 2.→ 1.tBool) of {
          1.c$Dict$Inspect ($method0 : a 2.→ 1.tBool) →
              $method0
      }

  pub val 1.v$fInspectRepa :: ∀(k : 2.sType) (a : k). 1.t$Dict$Inspect (1.tRep k a)
   = Λ(k : 2.sType).
    Λ(a : k).
      1.c$Dict$Inspect @(1.tRep k a) (1.v$fInspectRepa$cinspect @k @a)

  val 1.v$fInspectRepa$cinspect :: ∀(k : 2.sType) (a : k). 1.tRep k a 2.→ 1.tBool
   = Λ(k : 2.sType).
    Λ(a : k).
      λ(x : 1.tRep k a).
        1.cTrue

  pub val 1.vinspectSome :: 1.tSomeRep 2.→ 1.tBool
   = λ(x : 1.tSomeRep).
    case x as (_scrut : 1.tSomeRep) return (1.tBool) of {
        1.cSomeRep @(k : 2.sType) @(a : k) (rep : 1.tRep k a) →
            1.vinspect @(1.tRep k a) (1.v$fInspectRepa @k @a) rep
    }
status: pass
reason: Instance evidence supplies the kind argument of an existential type.
