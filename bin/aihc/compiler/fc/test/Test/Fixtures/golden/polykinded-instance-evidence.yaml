extensions: [GADTs, PolyKinds, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE GADTs, PolyKinds, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Maybe a = Nothing | Just a
    data Rep (a :: k) = Rep
    data SomeRep where
      SomeRep :: forall k (a :: k). Rep a -> SomeRep
    class Inspect a where
      inspect :: a -> Bool
    instance forall k (a :: k). Inspect (Rep a) where
      inspect _ = True
    inspectSome :: SomeRep -> Bool
    inspectSome (SomeRep rep) = inspect rep
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub type 1.tMaybe (a : sType) :: sType {
    pub 1.cNothing :: ∀(a : sType). tMaybe a;
    pub 1.cJust :: ∀(a : sType). a 2.→ tMaybe a
  }

  pub type 1.tRep (k : sType) (a : k) :: sType {
    pub 1.cRep :: ∀(k : sType) (a : k). tRep k a
  }

  pub type 1.tSomeRep :: sType {
    pub 1.cSomeRep :: ∀(k : sType) (a : k). tRep k a 2.→ tSomeRep
  }

  pub type 1.t$Dict$Inspect (a : sType) :: sType {
    pub 1.c$Dict$Inspect :: ∀(a : sType). (a 2.→ tBool) 2.→ t$Dict$Inspect a
  }

  pub val 1.vinspect :: ∀(a : sType). t$Dict$Inspect a 2.→ a 2.→ tBool
    = Λ(a : sType). λ($d0 : t$Dict$Inspect a).
      case $d0 of {
        c$Dict$Inspect ($method0 : a 2.→ tBool) →
          $method0
      }

  pub val 1.v$fInspectRepa :: ∀(k : sType) (a : k). t$Dict$Inspect (tRep k a)
    = Λ(k : sType) (a : k).
      c$Dict$Inspect @(tRep k a) (v$fInspectRepa$cinspect @k @a)

  val 1.v$fInspectRepa$cinspect :: ∀(k : sType) (a : k). tRep k a 2.→ tBool
    = Λ(k : sType) (a : k). λ(x : tRep k a).
      cTrue

  pub val 1.vinspectSome :: tSomeRep 2.→ tBool
    = λ(x : tSomeRep).
      case x of {
        cSomeRep @(k : sType) @(a : k) (rep : tRep k a) →
          vinspect @(tRep k a) (v$fInspectRepa @k @a) rep
      }
status: pass
reason: Instance evidence supplies the kind argument of an existential type.
