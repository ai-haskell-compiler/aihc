---
extensions: []
modules:
- |
  module Test (render) where

  import GHC.Types (Bool (..))

  cons :: Bool -> [Bool] -> [Bool]
  cons x xs = x : xs

  render :: Bool -> [Bool] -> [Bool]
  render flag = case flag of
    True -> let prefix = cons True in \xs -> prefix xs
    False -> cons flag
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.c: :: ∀(a : sType). a 2.→ t[] a 2.→ t[] a;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  val 1.vcons :: tBool 2.→ t[] tBool 2.→ t[] tBool
    = λ(x : tBool) (y : t[] tBool).
      c: @tBool x y

  pub val 1.vrender :: tBool 2.→ t[] tBool 2.→ t[] tBool
    = λ(x : tBool) (eta{1} : t[] tBool).
      case x of {
        cTrue →
          let prefix : t[] tBool 2.→ t[] tBool =
            vcons cTrue;
          prefix eta{1};
        cFalse →
          vcons x eta{1}
      }
status: pass
reason: The case on 'flag' is cheap, because its scrutinee is a variable and each alternative is a lambda or a partial application, so 'render' takes both arguments. The new argument is applied inside the alternatives, through the let, and to the lambda by substitution, rather than to the case.
