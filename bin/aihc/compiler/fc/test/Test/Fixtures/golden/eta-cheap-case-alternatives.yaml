---
extensions: []
modules:
- |
  module Test (render) where

  import GHC.Types (Bool (..))

  cons :: Bool -> [Bool] -> [Bool]
  cons x xs = x : xs

  render :: Bool -> [Bool] -> [Bool]
  render flag = case flag of
    True -> let prefix = cons True in \xs -> prefix xs
    False -> cons flag
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: 2.sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : 2.sType). 2.sType;
    2.c: :: ∀(a : 2.sType). a 2.→ 2.t[] a 2.→ 2.t[] a;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cFalse :: 2.tBool;
    2.cLifted :: 2.tLevity;
    2.cTrue :: 2.tBool

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  val 1.vcons :: 2.tBool 2.→ 2.t[] 2.tBool 2.→ 2.t[] 2.tBool
   = λ(x : 2.tBool).
    λ(y : 2.t[] 2.tBool).
      2.c: @2.tBool x y

  pub val 1.vrender :: 2.tBool 2.→ 2.t[] 2.tBool 2.→ 2.t[] 2.tBool
   = λ(x : 2.tBool).
    λ(eta{1} : 2.t[] 2.tBool).
      case x as (_scrut : 2.tBool) return (2.t[] 2.tBool) of {
          2.cTrue →
              let {
                  prefix : 2.t[] 2.tBool 2.→ 2.t[] 2.tBool =
                      1.vcons 2.cTrue
              } in
                  prefix eta{1};
          2.cFalse →
              1.vcons x eta{1}
      }
status: pass
reason: The case on 'flag' is cheap, because its scrutinee is a variable and each alternative is a lambda or a partial application, so 'render' takes both arguments. The new argument is applied inside the alternatives, through the let, and to the lambda by substitution, rather than to the case.
