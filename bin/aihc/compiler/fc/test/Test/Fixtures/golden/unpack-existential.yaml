---
extensions:
- ExistentialQuantification
modules:
- |
  {-# LANGUAGE ExistentialQuantification #-}
  module Test where

  import GHC.Types (Int)

  data Box a = Box a
  data Some = forall a. Some Int !(Box a)

  size :: Some -> Int
  size (Some n _) = n
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tBox (a : sType) :: sType {
    pub 1.cBox :: ∀(a : sType). a → tBox a
  }

  pub type 1.tSome :: sType {
    pub 1.cSome :: ∀(a : sType). tInt → a → tSome
  }

  pub val 1.v$WSome :: ∀(a : sType). tInt → tBox a → tSome
    = Λ(a : sType). λ(_field : tInt) (_strict_field : tBox a).
      let! cBox (_unpack_leaf1 : a) = _strict_field;
      cSome @a _field _unpack_leaf1

  pub val 1.vsize :: tSome → tInt
    = λ(x : tSome).
      let! cSome @(a : sType) (n : tInt) (unused _unpack_leaf0 : a) = x;
      n
status: pass
reason: The unpacked leaf of an existential field uses the type variable that the alternative binds.
