extensions:
  - KindSignatures
modules:
  - |
    module Test where
    import GHC.Types (Type)
    data Box (v :: Type -> Type) a = Box a
    re :: Box u a -> Box v a
    re (Box x) = Box x
    useRe :: Box v a -> Box w a
    useRe b = re (re b)
    data Tag (v :: Type -> Type) = Tag
    data Flag = Flag
    (tag, flag) = (Tag, Flag)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tAny :: ∀(k : sType). k;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.c(,)] 2.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    3.sType :: sType;
    2.c(,) :: ∀(a1 : sType) (a2 : sType). a1 3.→ a2 3.→ tTuple2 a1 a2;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tBox (v : sType 3.→ sType) (a : sType) :: sType {
    pub 1.cBox :: ∀(v : sType 3.→ sType) (a : sType). a 3.→ tBox v a
  }

  pub type 1.tTag (v : sType 3.→ sType) :: sType {
    pub 1.cTag :: ∀(v : sType 3.→ sType). tTag v
  }

  pub type 1.tFlag :: sType {
    pub 1.cFlag :: tFlag
  }

  pub val 1.vre :: ∀(u : sType 3.→ sType) (a : sType) (v : sType 3.→ sType). tBox u a 3.→ tBox v a
    = Λ(u : sType 3.→ sType) (a : sType) (v : sType 3.→ sType). λ(x : tBox u a).
      case x as (_scrut : tBox u a) return (tBox v a) of {
        cBox (x{1} : a) →
          cBox @v @a x{1}
      }

  pub val 1.vuseRe :: ∀(v : sType 3.→ sType) (a : sType) (w : sType 3.→ sType). tBox v a 3.→ tBox w a
    = Λ(v : sType 3.→ sType) (a : sType) (w : sType 3.→ sType). λ(x : tBox v a).
      vre @(tAny (tTYPE (cBoxedRep cLifted) 3.→ tTYPE (cBoxedRep cLifted))) @a @w (vre @v @a @(tAny (tTYPE (cBoxedRep cLifted) 3.→ tTYPE (cBoxedRep cLifted))) x)

  val 1.v$pat$tag$flag :: ∀(a : sType 3.→ sType). tTuple2 (tTag a) tFlag
    = Λ(a : sType 3.→ sType).
      c(,) @(tTag a) @tFlag (cTag @a) cFlag

  val 1.v$patsel$tag :: ∀(a : sType 3.→ sType). tTuple2 (tTag a) tFlag 3.→ tTag a
    = Λ(a : sType 3.→ sType). λ(_pat_rhs : tTuple2 (tTag a) tFlag).
      case _pat_rhs as (_do_scrut : tTuple2 (tTag a) tFlag) return (tTag a) of {
        c(,) (tag : tTag a) (flag : tFlag) →
          tag
      }

  pub val 1.vtag :: ∀(a : sType 3.→ sType). tTag a
    = Λ(a : sType 3.→ sType).
      v$patsel$tag @a (v$pat$tag$flag @a)

  val 1.v$patsel$flag :: ∀(a : sType 3.→ sType). tTuple2 (tTag a) tFlag 3.→ tFlag
    = Λ(a : sType 3.→ sType). λ(_pat_rhs : tTuple2 (tTag a) tFlag).
      case _pat_rhs as (_do_scrut : tTuple2 (tTag a) tFlag) return (tFlag) of {
        c(,) (tag : tTag a) (flag : tFlag) →
          flag
      }

  pub val 1.vflag :: tFlag
    = v$patsel$flag @(tAny (tTYPE (cBoxedRep cLifted) 3.→ tTYPE (cBoxedRep cLifted))) (v$pat$tag$flag @(tAny (tTYPE (cBoxedRep cLifted) 3.→ tTYPE (cBoxedRep cLifted))))
status: pass
reason: A type variable of kind Type -> Type that nothing determines gets the type Any at that kind,
  in an expression and in a pattern binding, and the lint accepts it.
