extensions:
  - KindSignatures
modules:
  - |
    module Test where
    import GHC.Types (Type)
    data Box (v :: Type -> Type) a = Box a
    re :: Box u a -> Box v a
    re (Box x) = Box x
    useRe :: Box v a -> Box w a
    useRe b = re (re b)
    data Tag (v :: Type -> Type) = Tag
    data Flag = Flag
    (tag, flag) = (Tag, Flag)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tAny :: ∀(k : sType). k;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.c(,)] 2.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    3.sType :: sType;
    2.c(,) :: ∀(a1 : sType) (a2 : sType). a1 → a2 → tTuple2 a1 a2;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tBox (v : sType → sType) (a : sType) :: sType {
    pub 1.cBox :: ∀(v : sType → sType) (a : sType). a → tBox v a
  }

  pub type 1.tTag (v : sType → sType) :: sType {
    pub 1.cTag :: ∀(v : sType → sType). tTag v
  }

  pub type 1.tFlag :: sType {
    pub 1.cFlag :: tFlag
  }

  pub val 1.vre :: ∀(u : sType → sType) (a : sType) (v : sType → sType). tBox u a → tBox v a
    = Λ(u : sType → sType) (a : sType) (v : sType → sType). λ(x : tBox u a).
      let! cBox (x{1} : a) = x;
      cBox @v @a x{1}

  pub val 1.vuseRe :: ∀(v : sType → sType) (a : sType) (w : sType → sType). tBox v a → tBox w a
    = Λ(v : sType → sType) (a : sType) (w : sType → sType). λ(x : tBox v a).
      vre @(tAny (sType → sType)) @a @w (vre @v @a @(tAny (sType → sType)) x)

  val 1.v$pat$tag$flag :: ∀(a : sType → sType). tTuple2 (tTag a) tFlag
    = Λ(a : sType → sType).
      c(,) @(tTag a) @tFlag (cTag @a) cFlag

  val 1.v$patsel$tag :: ∀(a : sType → sType). tTuple2 (tTag a) tFlag → tTag a
    = Λ(a : sType → sType). λ(_pat_rhs : tTuple2 (tTag a) tFlag).
      let! c(,) (tag : tTag a) (_ : tFlag) = _pat_rhs;
      tag

  pub val 1.vtag :: ∀(a : sType → sType). tTag a
    = Λ(a : sType → sType).
      v$patsel$tag @a (v$pat$tag$flag @a)

  val 1.v$patsel$flag :: ∀(a : sType → sType). tTuple2 (tTag a) tFlag → tFlag
    = Λ(a : sType → sType). λ(_pat_rhs : tTuple2 (tTag a) tFlag).
      let! c(,) (_ : tTag a) (flag : tFlag) = _pat_rhs;
      flag

  pub val 1.vflag :: tFlag
    = v$patsel$flag @(tAny (sType → sType)) (v$pat$tag$flag @(tAny (sType → sType)))
status: pass
reason: A type variable of kind Type -> Type that nothing determines gets the type Any at that kind,
  in an expression and in a pattern binding, and the lint accepts it.
