---
extensions: []
modules:
- |
  module Test (run) where
  import GHC.Types (Bool (..))

  data State = State Bool Bool Bool

  step :: State -> Bool -> State
  step (State a b c) x = case x of
    True -> State b c a
    False -> case a of
      True -> State c a b
      False -> State a c b
  {-# INLINE step #-}

  run :: Bool -> Bool -> Bool -> State
  run x y z = step (step (step (State x y z) x) y) z
passes:
- inline:
    policy: grow
    callee-limit: 5
    site-limit: 0
    value-growth: 0
    value-slack: 0
    requested-site-limit: 0
    reducing-site-limit: 100
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tState :: sType {
    1.cState :: tBool 2.→ tBool 2.→ tBool 2.→ tState
  }

  pub val 1.vrun :: tBool 2.→ tBool 2.→ tBool 2.→ tState
    = λ(x : tBool) (y : tBool) (z : tBool).
      case case x return (tState) of {
          cTrue →
            cState y z x;
          cFalse →
            cState x z y
        } return (tState) of {
        cState (a : tBool) (b : tBool) (c : tBool) →
          case case y return (tState) of {
              cTrue →
                cState b c a;
              cFalse →
                case a return (tState) of {
                  cTrue →
                    cState c a b;
                  cFalse →
                    cState a c b
                }
            } return (tState) of {
            cState (a{1} : tBool) (b{1} : tBool) (c{1} : tBool) →
              case z return (tState) of {
                cTrue →
                  cState b{1} c{1} a{1};
                cFalse →
                  case a{1} return (tState) of {
                    cTrue →
                      cState c{1} a{1} b{1};
                    cFalse →
                      cState a{1} c{1} b{1}
                  }
              }
          }
      }
status: pass
reason: A call that gives a known constructor to a parameter that an INLINE callee scrutinises reduces. The site is free of the allowance within the reducing site limit, and each copy gives a known constructor to the next call.
