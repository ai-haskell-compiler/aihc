---
extensions: []
modules:
- |
  module Test (run) where
  import GHC.Types (Bool (..))

  data State = State Bool Bool Bool

  step :: State -> Bool -> State
  step (State a b c) x = case x of
    True -> State b c a
    False -> case a of
      True -> State c a b
      False -> State a c b
  {-# INLINE step #-}

  run :: Bool -> Bool -> Bool -> State
  run x y z = step (step (step (State x y z) x) y) z
passes:
- inline:
    policy: grow
    callee-limit: 5
    site-limit: 0
    value-growth: 0
    value-slack: 0
    requested-site-limit: 0
    reducing-site-limit: 100
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: 2.sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cFalse :: 2.tBool;
    2.cLifted :: 2.tLevity;
    2.cTrue :: 2.tBool

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  type 1.tState :: 2.sType {
      1.cState :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool 2.→ 1.tState
  }

  pub val 1.vrun :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool 2.→ 1.tState
   = λ(x : 2.tBool).
    λ(y : 2.tBool).
      λ(z : 2.tBool).
        case case x as (_scrut : 2.tBool) return (1.tState) of {
            2.cTrue →
                1.cState y z x;
            2.cFalse →
                1.cState x z y
        } as (_scrut : 1.tState) return (1.tState) of {
            1.cState (a : 2.tBool) (b : 2.tBool) (c : 2.tBool) →
                case case y as (_scrut{1} : 2.tBool) return (1.tState) of {
                    2.cTrue →
                        1.cState b c a;
                    2.cFalse →
                        case a as (_scrut{2} : 2.tBool) return (1.tState) of {
                            2.cTrue →
                                1.cState c a b;
                            2.cFalse →
                                1.cState a c b
                        }
                } as (_scrut{1} : 1.tState) return (1.tState) of {
                    1.cState (a{1} : 2.tBool) (b{1} : 2.tBool) (c{1} : 2.tBool) →
                        case z as (_scrut{2} : 2.tBool) return (1.tState) of {
                            2.cTrue →
                                1.cState b{1} c{1} a{1};
                            2.cFalse →
                                case a{1} as (_scrut{3} : 2.tBool) return (1.tState) of {
                                    2.cTrue →
                                        1.cState c{1} a{1} b{1};
                                    2.cFalse →
                                        1.cState a{1} c{1} b{1}
                                }
                        }
                }
        }
status: pass
reason: A call that gives a known constructor to a parameter that an INLINE callee scrutinises reduces. The site is free of the allowance within the reducing site limit, and each copy gives a known constructor to the next call.
