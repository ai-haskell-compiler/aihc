---
extensions:
- MagicHash
modules:
- |
  module Test (add) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)
passes:
- worker-wrapper
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vadd inline :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (wrapped : 3.tInt) return (3.tInt) of {
          3.cI# (x{1} : 2.tInt#) →
              case y as (wrapped{1} : 3.tInt) return (3.tInt) of {
                  3.cI# (y{1} : 2.tInt#) →
                      case 1.v$wadd x{1} y{1} as (field : 2.tInt#) return (3.tInt) of {
                          _ →
                              3.cI# field
                      }
              }
      }

  val 1.v$wadd :: FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)
   = λ(x : 2.tInt#).
    λ(y : 2.tInt#).
      let {
          x{1} : 3.tInt =
              3.cI# x
      } in
          let {
              y{1} : 3.tInt =
                  3.cI# y
          } in
              case x{1} as (_scrut : 3.tInt) return (2.tInt#) of {
                  3.cI# (a : 2.tInt#) →
                      case y{1} as (_scrut{1} : 3.tInt) return (2.tInt#) of {
                          3.cI# (b : 2.tInt#) →
                              foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a b
                      }
              }
status: pass
reason: A function that is strict in parameters of a type with one constructor and that scrutinises them splits into a worker that takes the fields and an INLINE wrapper that takes the constructors apart and calls the worker.
