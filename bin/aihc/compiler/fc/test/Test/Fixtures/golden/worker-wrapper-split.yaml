---
extensions:
- MagicHash
modules:
- |
  module Test (add) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)
passes:
- worker-wrapper
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vadd inline :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case x of {
        cI# (x{1} : tInt#) →
          case y of {
            cI# (y{1} : tInt#) →
              case v$wadd x{1} y{1} as (field : tInt#) of {
                _ →
                  cI# field
              }
          }
      }

  val 1.v$wadd :: FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @cIntRep @cIntRep tInt# tInt#)
    = λ(x : tInt#) (y : tInt#).
      let x{1} : tInt =
        cI# x;
      let y{1} : tInt =
        cI# y;
      case x{1} of {
        cI# (a : tInt#) →
          case y{1} of {
            cI# (b : tInt#) →
              prim +# a b
          }
      }
status: pass
reason: A function that is strict in parameters of a type with one constructor and that scrutinises them splits into a worker that takes the fields and an INLINE wrapper that takes the constructors apart and calls the worker.
