---
extensions:
- ExistentialQuantification
modules:
- |
  module Test (run) where

  import GHC.Types (Int)

  data Box = forall s. Box s (s -> Int)

  plus :: Int -> Int -> Int
  plus x _ = x
  {-# NOINLINE plus #-}

  run :: (Int -> Int) -> Int -> Int
  run g n = case Box (g n) g of
    Box s f -> plus (f s) (f s)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tBox :: sType {
    1.cBox :: ∀(s : sType). s 2.→ (s 2.→ tInt) 2.→ tBox
  }

  val 1.vplus noinline :: tInt 2.→ tInt 2.→ tInt
    = λ(x : tInt) (y : tInt).
      x

  pub val 1.vrun :: (tInt 2.→ tInt) 2.→ tInt 2.→ tInt
    = λ(x : tInt 2.→ tInt) (y : tInt).
      let s : tInt =
        x y;
      vplus (x s) (x s)
status: pass
lint: pass
reason: The case of a known constructor binds the field of an existential constructor to a let. The type of the let binder is the existential type that the constructor application gives, Int, and not the type variable of the alternative, which no longer has a binder.
