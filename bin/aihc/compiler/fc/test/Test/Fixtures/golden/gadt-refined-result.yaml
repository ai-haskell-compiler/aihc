---
extensions:
- GADTs
- TypeOperators
modules:
- |
  {-# LANGUAGE GADTs, TypeOperators #-}
  module Test where
  data Flag = Off | On
  data a :~: b where
    Refl :: a :~: a
  same :: a :~: b -> Flag
  same Refl = On
  cast :: a :~: b -> a -> b
  cast Refl x = x
  result :: Flag
  result = cast Refl On
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep 2.→ tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tFlag :: sType {
    pub 1.cOff :: tFlag;
    pub 1.cOn :: tFlag
  }

  pub type 1.t:~: (a : sType) (b : sType) :: sType {
    pub 1.cRefl :: ∀(a : sType) (b : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (t:~: a b)
  }

  pub val 1.vsame :: ∀(a : sType) (b : sType). t:~: a b 2.→ tFlag
    = Λ(a : sType) (b : sType). λ(x : t:~: a b).
      case x return (tFlag) of {
        cRefl ($pattern_d0 : b ~ a) →
          cOn
      }

  pub val 1.vcast :: ∀(a : sType) (b : sType). t:~: a b 2.→ a 2.→ b
    = Λ(a : sType) (b : sType). λ(x : t:~: a b) (y : a).
      case x return (b) of {
        cRefl ($pattern_d0 : b ~ a) →
          y ▷ sym ($pattern_d0)
      }

  pub val 1.vresult :: tFlag
    = vcast @tFlag @tFlag (cRefl @tFlag @tFlag (coercion (refl tFlag))) cOn
status: pass
reason: a GADT constructor whose result refines an index carries the refinement
  as an equality, so the alternative binds a coercion and the program lints.
