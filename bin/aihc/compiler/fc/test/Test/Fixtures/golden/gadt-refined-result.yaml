---
extensions:
- GADTs
- TypeOperators
modules:
- |
  {-# LANGUAGE GADTs, TypeOperators #-}
  module Test where
  data Flag = Off | On
  data a :~: b where
    Refl :: a :~: a
  same :: a :~: b -> Flag
  same Refl = On
  cast :: a :~: b -> a -> b
  cast Refl x = x
  result :: Flag
  result = cast Refl On
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.t[] :: ∀(a : 2.sType). 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity;
    2.cTupleRep :: 2.t[] 2.tRuntimeRep 2.→ 2.tRuntimeRep;
    2.c[] :: ∀(a : 2.sType). 2.t[] a

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tFlag :: 2.sType {
      pub 1.cOff :: 1.tFlag;
      pub 1.cOn :: 1.tFlag
  }

  pub type 1.t:~: (a : 2.sType) (b : 2.sType) :: 2.sType {
      pub 1.cRefl :: ∀(a : 2.sType) (b : 2.sType). FUN @(2.cTupleRep (2.c[] 2.tRuntimeRep)) @2.sLiftedRep (b ~ a) (1.t:~: a b)
  }

  pub val 1.vsame :: ∀(a : 2.sType) (b : 2.sType). 1.t:~: a b 2.→ 1.tFlag
   = Λ(a : 2.sType).
    Λ(b : 2.sType).
      λ(x : 1.t:~: a b).
        case x as (_scrut : 1.t:~: a b) return (1.tFlag) of {
            1.cRefl ($pattern_d0 : b ~ a) →
                1.cOn
        }

  pub val 1.vcast :: ∀(a : 2.sType) (b : 2.sType). 1.t:~: a b 2.→ a 2.→ b
   = Λ(a : 2.sType).
    Λ(b : 2.sType).
      λ(x : 1.t:~: a b).
        λ(y : a).
          case x as (_scrut : 1.t:~: a b) return (b) of {
              1.cRefl ($pattern_d0 : b ~ a) →
                  y ▷ sym ($pattern_d0)
          }

  pub val 1.vresult :: 1.tFlag
   = 1.vcast @1.tFlag @1.tFlag (1.cRefl @1.tFlag @1.tFlag (coercion (refl 1.tFlag))) 1.cOn
status: pass
reason: a GADT constructor whose result refines an index carries the refinement
  as an equality, so the alternative binds a coercion and the program lints.
