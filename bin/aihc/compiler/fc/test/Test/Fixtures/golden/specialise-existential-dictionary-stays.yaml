---
extensions:
- MagicHash
- ExistentialQuantification
modules:
- |
  module Test (total) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  class Weight a where
    weight :: a -> Int

  data Some = forall a. Weight a => Some a

  plus :: Int -> Int -> Int
  plus x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  total :: [Some] -> Int
  total items = walk items
    where
      walk [] = I# 0#
      walk (Some v : rest) = go (I# 3#) v (walk rest)
      go n v acc = case n of
        I# 0# -> acc
        I# k -> go (I# (k +# -1#)) v (plus acc (weight v))
passes:
- specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.t$Dict$Weight (a : sType) :: sType {
    1.c$Dict$Weight :: ∀(a : sType). (a 3.→ tInt) 3.→ t$Dict$Weight a
  }

  type 1.tSome :: sType {
    1.cSome :: ∀(a : sType). t$Dict$Weight a 3.→ a 3.→ tSome
  }

  val 1.vweight :: ∀(a : sType). t$Dict$Weight a 3.→ a 3.→ tInt
    = Λ(a : sType). λ($d0 : t$Dict$Weight a).
      let! c$Dict$Weight ($method0 : a 3.→ tInt) = $d0;
      $method0

  val 1.vplus :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      let! cI# (a : tInt#) = x;
      let! cI# (b : tInt#) = y;
      cI# (prim +# a b)

  pub val 1.vtotal :: t[] tSome 3.→ tInt
    = λ(x : t[] tSome).
      rec {
        go : ∀(a : sType). t$Dict$Weight a 3.→ tInt 3.→ a 3.→ tInt 3.→ tInt =
          Λ(a : sType). λ($d0 : t$Dict$Weight a) (x{1} : tInt) (y : a) (z : tInt).
            let! cI# (_pat : tInt#) = x{1};
            case _pat of {
              0#cIntRep →
                z;
              _ →
                go @a $d0 (cI# (prim +# _pat lit (-1#cIntRep) :: tInt#)) y (vplus z (vweight @a $d0 y))
            }
      } in
      rec {
        walk : t[] tSome 3.→ tInt =
          λ(x{1} : t[] tSome).
            case x{1} of {
              c[] →
                cI# lit (0#cIntRep) :: tInt#;
              c: (_pat : tSome) (rest : t[] tSome) →
                let! cSome @(a : sType) ($pattern_d0 : t$Dict$Weight a) (v : a) = _pat;
                go @a $pattern_d0 (cI# lit (3#cIntRep) :: tInt#) v (walk rest)
            }
      } in
      walk x
status: pass
reason: The call of 'go' gives the dictionary that the constructor pattern binds, which is not in scope where 'go' is bound, so the pass makes no copy.
