- |
  module Test (eqPair) where
  import GHC.Types (Bool (..))

  class MyEq a where
    eq :: a -> a -> Bool

  data Pair a = Pair a a

  instance MyEq Bool where
    eq True True = True
    eq False False = True
    eq _ _ = False

  instance MyEq a => MyEq (Pair a) where
    eq (Pair a b) (Pair c d) = case eq a c of
      True -> eq b d
      False -> False

  eqPair :: Pair Bool -> Pair Bool -> Bool
  eqPair x y = eq x y
