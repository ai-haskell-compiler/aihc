---
extensions: []
modules:
- |
  module Test (first, second, third) where
  import GHC.Types (Bool (..))

  once :: Bool -> Bool -> Bool
  once x w = case x of
    True -> case w of
      True -> False
      False -> True
    False -> case w of
      True -> True
      False -> False

  first :: Bool -> Bool -> Bool
  first y v = once y v

  helper :: Bool -> Bool
  helper x = case x of
    True -> False
    False -> True

  second :: Bool -> Bool -> Bool
  second z v = helper (first z v)

  third :: Bool -> Bool
  third w = helper w
passes:
- inline:
    policy: grow
    rounds: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tBool :: 2.sType;
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cFalse :: 2.tBool;
    2.cLifted :: 2.tLevity;
    2.cTrue :: 2.tBool

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub val 1.vfirst :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    λ(y : 2.tBool).
      case x as (_scrut : 2.tBool) return (2.tBool) of {
          2.cTrue →
              case y as (_scrut{1} : 2.tBool) return (2.tBool) of {
                  2.cTrue →
                      2.cFalse;
                  2.cFalse →
                      2.cTrue
              };
          2.cFalse →
              case y as (_scrut{1} : 2.tBool) return (2.tBool) of {
                  2.cTrue →
                      2.cTrue;
                  2.cFalse →
                      2.cFalse
              }
      }

  pub val 1.vsecond :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    λ(y : 2.tBool).
      case x as (_scrut : 2.tBool) return (2.tBool) of {
          2.cTrue →
              case y as (_scrut{1} : 2.tBool) return (2.tBool) of {
                  2.cTrue →
                      2.cTrue;
                  2.cFalse →
                      2.cFalse
              };
          2.cFalse →
              case y as (_scrut{1} : 2.tBool) return (2.tBool) of {
                  2.cTrue →
                      2.cFalse;
                  2.cFalse →
                      2.cTrue
              }
      }

  pub val 1.vthird :: 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    case x as (_scrut : 2.tBool) return (2.tBool) of {
        2.cTrue →
            2.cFalse;
        2.cFalse →
            2.cTrue
    }
status: pass
reason: A value with one use moves to that use in the first round and is dead from then on, although its body is only dropped at the end of the round. Its references count for nothing, so a value it was the last other user of is still copied at every live use and dropped in the same round.
