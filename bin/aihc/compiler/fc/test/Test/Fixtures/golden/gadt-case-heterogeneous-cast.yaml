extensions:
- GADTs
- PolyKinds
- ScopedTypeVariables
- TypeOperators
- KindSignatures
- RankNTypes
modules:
- |
  module Test where
  import GHC.Types (Type)
  data (a :: k1) :~~: (b :: k2) where
    HRefl :: forall k (a :: k). a :~~: a
  data Maybe a = Nothing | Just a
  data TypeRep (a :: k) = TypeRep
  data SomeTypeRep where
    SomeTypeRep :: forall k (a :: k). TypeRep a -> SomeTypeRep
  eqTypeRep :: forall k1 k2 (a :: k1) (b :: k2). TypeRep a -> TypeRep b -> Maybe (a :~~: b)
  eqTypeRep _ _ = Nothing
  pick :: forall k (a :: k). TypeRep a -> SomeTypeRep -> Maybe (TypeRep a)
  pick expected some = case some of
    SomeTypeRep rep -> case rep `eqTypeRep` expected of
      Just HRefl -> Just rep
      Nothing -> Nothing
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.t[] :: ∀(a : 2.tType). 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity;
    2.vTupleRep :: 2.t[] 2.tRuntimeRep 2.→ 2.tRuntimeRep;
    2.v[] :: ∀(a : 2.tType). 2.t[] a

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.t:~~: (k1 : 2.tType) (k2 : 2.tType) (a : k1) (b : k2) :: 2.tType {
      pub 1.vHRefl :: ∀(k : 2.tType) (a : k) (k2 : 2.tType) (b : k2). FUN @(2.vTupleRep (2.v[] 2.tRuntimeRep)) @2.tLiftedRep (k2 ~ k) (FUN @(2.vTupleRep (2.v[] 2.tRuntimeRep)) @2.tLiftedRep (b ~ a) (1.t:~~: k k2 a b))
  }

  pub type 1.tMaybe (a : 2.tType) :: 2.tType {
      pub 1.vNothing :: ∀(a : 2.tType). 1.tMaybe a;
      pub 1.vJust :: ∀(a : 2.tType). a 2.→ 1.tMaybe a
  }

  pub type 1.tTypeRep (k : 2.tType) (a : k) :: 2.tType {
      pub 1.vTypeRep :: ∀(k : 2.tType) (a : k). 1.tTypeRep k a
  }

  pub type 1.tSomeTypeRep :: 2.tType {
      pub 1.vSomeTypeRep :: ∀(k : 2.tType) (a : k). 1.tTypeRep k a 2.→ 1.tSomeTypeRep
  }

  pub val 1.veqTypeRep :: ∀(k1 : 2.tType) (k2 : 2.tType) (a : k1) (b : k2). 1.tTypeRep k1 a 2.→ 1.tTypeRep k2 b 2.→ 1.tMaybe (1.t:~~: k1 k2 a b)
   = Λ(k1 : 2.tType).
    Λ(k2 : 2.tType).
      Λ(a : k1).
        Λ(b : k2).
          λ(x : 1.tTypeRep k1 a).
            λ(y : 1.tTypeRep k2 b).
              1.vNothing @(1.t:~~: k1 k2 a b)

  pub val 1.vpick :: ∀(k : 2.tType) (a : k). 1.tTypeRep k a 2.→ 1.tSomeTypeRep 2.→ 1.tMaybe (1.tTypeRep k a)
   = Λ(k : 2.tType).
    Λ(a : k).
      λ(x : 1.tTypeRep k a).
        λ(y : 1.tSomeTypeRep).
          case y as (_scrut : 1.tSomeTypeRep) return (1.tMaybe (1.tTypeRep k a)) of {
              1.vSomeTypeRep @(k{1} : 2.tType) @(a{1} : k{1}) (rep : 1.tTypeRep k{1} a{1}) →
                  case 1.veqTypeRep @k{1} @k @a{1} @a rep x as (_scrut{1} : 1.tMaybe (1.t:~~: k{1} k a{1} a)) return (1.tMaybe (1.tTypeRep k a)) of {
                      1.vJust (_pat : 1.t:~~: k{1} k a{1} a) →
                          case _pat as (_scrut{2} : 1.t:~~: k{1} k a{1} a) return (1.tMaybe (1.tTypeRep k a)) of {
                              1.vHRefl ($pattern_d0 : k ~ k{1}) ($pattern_d1 : a ~ a{1}) →
                                  (1.vJust @(1.tTypeRep k a{1}) rep) ▷ sym (tycon-co 1.tMaybe (tycon-co 1.tTypeRep (refl k) ($pattern_d1)))
                          };
                      1.vNothing →
                          1.vNothing @(1.tTypeRep k a)
                  }
          }
status: pass
reason: HRefl at two kinds binds a kind equality and an index equality; the alternative casts through both and the lint accepts the kind argument through the given.
