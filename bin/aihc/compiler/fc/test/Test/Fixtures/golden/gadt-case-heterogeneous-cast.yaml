extensions:
- GADTs
- PolyKinds
- ScopedTypeVariables
- TypeOperators
- KindSignatures
- RankNTypes
modules:
- |
  module Test where
  import GHC.Types (Type)
  data (a :: k1) :~~: (b :: k2) where
    HRefl :: forall k (a :: k). a :~~: a
  data Maybe a = Nothing | Just a
  data TypeRep (a :: k) = TypeRep
  data SomeTypeRep where
    SomeTypeRep :: forall k (a :: k). TypeRep a -> SomeTypeRep
  eqTypeRep :: forall k1 k2 (a :: k1) (b :: k2). TypeRep a -> TypeRep b -> Maybe (a :~~: b)
  eqTypeRep _ _ = Nothing
  pick :: forall k (a :: k). TypeRep a -> SomeTypeRep -> Maybe (TypeRep a)
  pick expected some = case some of
    SomeTypeRep rep -> case rep `eqTypeRep` expected of
      Just HRefl -> Just rep
      Nothing -> Nothing
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep 2.→ tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.t:~~: (k1 : sType) (k2 : sType) (a : k1) (b : k2) :: sType {
    pub 1.cHRefl :: ∀(k : sType) (a : k) (k2 : sType) (b : k2). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (k2 ~ k) (FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (t:~~: k k2 a b))
  }

  pub type 1.tMaybe (a : sType) :: sType {
    pub 1.cNothing :: ∀(a : sType). tMaybe a;
    pub 1.cJust :: ∀(a : sType). a 2.→ tMaybe a
  }

  pub type 1.tTypeRep (k : sType) (a : k) :: sType {
    pub 1.cTypeRep :: ∀(k : sType) (a : k). tTypeRep k a
  }

  pub type 1.tSomeTypeRep :: sType {
    pub 1.cSomeTypeRep :: ∀(k : sType) (a : k). tTypeRep k a 2.→ tSomeTypeRep
  }

  pub val 1.veqTypeRep :: ∀(k1 : sType) (k2 : sType) (a : k1) (b : k2). tTypeRep k1 a 2.→ tTypeRep k2 b 2.→ tMaybe (t:~~: k1 k2 a b)
    = Λ(k1 : sType) (k2 : sType) (a : k1) (b : k2). λ(x : tTypeRep k1 a) (y : tTypeRep k2 b).
      cNothing @(t:~~: k1 k2 a b)

  pub val 1.vpick :: ∀(k : sType) (a : k). tTypeRep k a 2.→ tSomeTypeRep 2.→ tMaybe (tTypeRep k a)
    = Λ(k : sType) (a : k). λ(x : tTypeRep k a) (y : tSomeTypeRep).
      let! cSomeTypeRep @(k{1} : sType) @(a{1} : k{1}) (rep : tTypeRep k{1} a{1}) = y;
      case veqTypeRep @k{1} @k @a{1} @a rep x of {
        cJust (_pat : t:~~: k{1} k a{1} a) →
          let! cHRefl ($pattern_d0 : k ~ k{1}) ($pattern_d1 : a ~ a{1}) = _pat;
          (cJust @(tTypeRep k a{1}) rep) ▷ sym (tycon-co tMaybe (tycon-co tTypeRep (refl k) ($pattern_d1)));
        cNothing →
          cNothing @(tTypeRep k a)
      }
status: pass
reason: HRefl at two kinds binds a kind equality and an index equality; the alternative casts through both and the lint accepts the kind argument through the given.
