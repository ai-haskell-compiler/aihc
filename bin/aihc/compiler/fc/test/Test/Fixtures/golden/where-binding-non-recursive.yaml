---
extensions:
- MagicHash
modules:
- |
  module Test (pair, ones) where
  import GHC.Types (Int (..))

  data Box = Box Int
  data Pair = Pair Int Box

  pair :: Int -> Pair
  pair x = Pair size boxed
    where
      size = I# 3#
      boxed = Box size

  data Stream = Cons Int Stream

  ones :: Int -> Stream
  ones x = stream
    where
      stream = Cons x stream
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tBox :: sType {
    1.cBox :: tInt 3.→ tBox
  }

  type 1.tPair :: sType {
    1.cPair :: tInt 3.→ tBox 3.→ tPair
  }

  type 1.tStream :: sType {
    1.cCons :: tInt 3.→ tStream 3.→ tStream
  }

  pub val 1.vpair :: tInt 3.→ tPair
    = λ(x : tInt).
      let size : tInt =
        cI# 3#cIntRep;
      cPair size (cBox size)

  pub val 1.vones :: tInt 3.→ tStream
    = λ(x : tInt).
      rec {
        stream : tStream =
          cCons x stream
      } in
      stream
status: pass
reason: A where binding that refers only to earlier bindings is a plain let; a binding that refers to itself stays a recursive group.
