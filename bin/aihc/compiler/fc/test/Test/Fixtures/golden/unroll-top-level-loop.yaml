---
extensions:
- MagicHash
modules:
- |
  module Test (two, any) where

  import GHC.Prim (Int#, (-#))
  import GHC.Types (Int (..))

  countdown :: Int# -> [Int] -> [Int]
  countdown n acc = case n of
    0# -> acc
    _ -> countdown (n -# 1#) (I# n : acc)

  two :: [Int]
  two = countdown 2# []

  any :: Int# -> [Int]
  any n = countdown n []
passes:
- unroll
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vcountdown :: FUN @cIntRep @sLiftedRep tInt# (t[] tInt 3.→ t[] tInt)
    = λ(x : tInt#) (y : t[] tInt).
      case x of {
        0#cIntRep →
          y;
        _ →
          vcountdown (prim -# x lit (1#cIntRep) :: tInt#) (c: @tInt (cI# x) y)
      }

  pub val 1.vtwo :: t[] tInt
    = c: @tInt (cI# lit (1#cIntRep) :: tInt#) (c: @tInt (cI# lit (2#cIntRep) :: tInt#) (c[] @tInt))

  pub val 1.vany :: FUN @cIntRep @sLiftedRep tInt# (t[] tInt)
    = λ(x : tInt#).
      vcountdown x (c[] @tInt)
status: pass
reason: The top-level function 'countdown' calls itself. In 'two', the literal count 2 decides each recursion, so copies of the body replace the call and the list is built directly. In 'any', the count is not known, so the call stays.
