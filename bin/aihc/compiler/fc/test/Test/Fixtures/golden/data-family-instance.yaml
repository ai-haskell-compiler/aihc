extensions:
  - TypeFamilies
modules:
  - |
    module Test where
    data family Payload a
    data instance Payload a = PayloadValue a
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tPayload (a : 2.sType) :: 2.sType @N {}

  type 1.t$R$Payload$PayloadValue (a : 2.sType) :: 2.sType {
      1.cPayloadValue :: ∀(a : 2.sType). a 2.→ 1.t$R$Payload$PayloadValue a
  }

  axiom 1.$ax$Payload$PayloadValue (a : 2.sType) : 1.tPayload a ~N 1.t$R$Payload$PayloadValue a
status: pass
reason: A data family is an empty type. An instance adds a hidden representation type and a nominal axiom.
