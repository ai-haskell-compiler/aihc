---
extensions:
- RankNTypes
modules:
- |
  module Test (total, plain, twice) where
  data Nat = Z | S Nat
  data List a = Nil | Cons a (List a)
  build :: (forall b. (a -> b -> b) -> b -> b) -> List a
  build g = g Cons Nil
  {-# INLINE [1] build #-}
  foldr :: (a -> b -> b) -> b -> List a -> b
  foldr k z xs = go xs
    where
      go Nil = z
      go (Cons y ys) = k y (go ys)
  {-# INLINE [1] foldr #-}
  {-# RULES
  "fold/build" forall k z (g :: forall b. (a -> b -> b) -> b -> b). foldr k z (build g) = g k z
    #-}
  map :: (a -> b) -> List a -> List b
  map _ Nil = Nil
  map f (Cons x xs) = Cons (f x) (map f xs)
  mapFB :: (elt -> lst -> lst) -> (a -> elt) -> a -> lst -> lst
  mapFB c f = \x ys -> c (f x) ys
  {-# INLINE [1] mapFB #-}
  {-# RULES
  "map" [~1] forall f xs. map f xs = build (\c n -> foldr (mapFB c f) n xs)
  "mapList" [1] forall f. foldr (mapFB Cons f) Nil = map f
  "map/build" [1] forall f xs. build (\c n -> foldr (mapFB c f) n xs) = map f xs
  "mapFB" forall c f g. mapFB (mapFB c f) g = mapFB c (\x -> f (g x))
    #-}
  plus :: Nat -> Nat -> Nat
  plus Z n = n
  plus (S m) n = S (plus m n)
  sumList :: List Nat -> Nat
  sumList = foldr plus Z
  total :: List Nat -> Nat
  total xs = sumList (map S (map S xs))
  plain :: List Nat -> List Nat
  plain xs = map S xs
  twice :: List Nat -> List Nat
  twice xs = map S (map S xs)
passes:
- eta
- inline: shrink
- inline: grow
- eta
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.tNat :: sType {
    1.cZ :: tNat;
    1.cS :: tNat 2.→ tNat
  }

  type 1.tList (a : sType) :: sType {
    1.cNil :: ∀(a : sType). tList a;
    1.cCons :: ∀(a : sType). a 2.→ tList a 2.→ tList a
  }

  val 1.vbuild inline [1] :: ∀(a : sType). (∀(b : sType). (a 2.→ b 2.→ b) 2.→ b 2.→ b) 2.→ tList a
    = Λ(a : sType). λ(x : ∀(b : sType). (a 2.→ b 2.→ b) 2.→ b 2.→ b).
      x @(tList a) (cCons @a) (cNil @a)

  val 1.vfoldr inline [1] :: ∀(a : sType) (b : sType). (a 2.→ b 2.→ b) 2.→ b 2.→ tList a 2.→ b
    = Λ(a : sType) (b : sType). λ(x : a 2.→ b 2.→ b) (y : b) (z : tList a).
      rec {
        go : tList a 2.→ b =
          λ(x{1} : tList a).
            case x{1} return (b) of {
              cNil →
                y;
              cCons (y{1} : a) (ys : tList a) →
                x y{1} (go ys)
            }
      } in
      go z

  val 1.vmap :: ∀(a : sType) (b : sType). (a 2.→ b) 2.→ tList a 2.→ tList b
    = Λ(a : sType) (b : sType). λ(x : a 2.→ b) (y : tList a).
      case y return (tList b) of {
        cNil →
          cNil @b;
        cCons (x{1} : a) (xs : tList a) →
          cCons @b (x x{1}) (rec {
              go : tList a 2.→ tList b =
                λ(x{2} : tList a).
                  case x{2} return (tList b) of {
                    cNil →
                      cNil @b;
                    cCons (y{1} : a) (ys : tList a) →
                      cCons @b (x y{1}) (go ys)
                  }
            } in
            go xs)
      }

  val 1.vmapFB inline [1] :: ∀(elt : sType) (lst : sType) (a : sType). (elt 2.→ lst 2.→ lst) 2.→ (a 2.→ elt) 2.→ a 2.→ lst 2.→ lst
    = Λ(elt : sType) (lst : sType) (a : sType). λ(x : elt 2.→ lst 2.→ lst) (y : a 2.→ elt) (x{1} : a) (ys : lst).
      x (y x{1}) ys

  val 1.vplus :: tNat 2.→ tNat 2.→ tNat
    = λ(x : tNat) (y : tNat).
      case x return (tNat) of {
        cZ →
          y;
        cS (m : tNat) →
          cS (vplus m y)
      }

  pub val 1.vtotal :: tList tNat 2.→ tNat
    = λ(x : tList tNat).
      rec {
        go : tList tNat 2.→ tNat =
          λ(x{1} : tList tNat).
            case x{1} return (tNat) of {
              cNil →
                cZ;
              cCons (y : tNat) (ys : tList tNat) →
                vplus (cS (cS y)) (go ys)
            }
      } in
      go x

  pub val 1.vplain :: tList tNat 2.→ tList tNat
    = λ(x : tList tNat).
      rec {
        go : tList tNat 2.→ tList tNat =
          λ(x{1} : tList tNat).
            case x{1} return (tList tNat) of {
              cNil →
                cNil @tNat;
              cCons (y : tNat) (ys : tList tNat) →
                cCons @tNat (cS y) (go ys)
            }
      } in
      go x

  pub val 1.vtwice :: tList tNat 2.→ tList tNat
    = λ(x : tList tNat).
      rec {
        go : tList tNat 2.→ tList tNat =
          λ(x{1} : tList tNat).
            case x{1} return (tList tNat) of {
              cNil →
                cNil @tNat;
              cCons (y : tNat) (ys : tList tNat) →
                cCons @tNat (cS (cS y)) (go ys)
            }
      } in
      go x

  rule "fold/build" Λ(a : sType). Λ(b : sType). λ(k : a 2.→ b 2.→ b). λ(z : b). λ(g : ∀(b{1} : sType). (a 2.→ b{1} 2.→ b{1}) 2.→ b{1} 2.→ b{1}).
    vfoldr @a @b k z (vbuild @a (Λ(b{1} : sType).
          g @b{1}))
   = g @b k z
   :: b

  rule "map" [~1] Λ(a : sType). Λ(b : sType). λ(f : a 2.→ b). λ(xs : tList a).
    vmap @a @b f xs
   = vbuild @b (Λ(b{1} : sType). λ(c : b 2.→ b{1} 2.→ b{1}) (n : b{1}).
      vfoldr @a @b{1} (vmapFB @b @b{1} @a c f) n xs)
   :: tList b

  rule "mapList" [1] Λ(a : sType). Λ(b : sType). λ(f : a 2.→ b).
    vfoldr @a @(tList b) (vmapFB @b @(tList b) @a (cCons @b) f) (cNil @b)
   = vmap @a @b f
   :: tList a 2.→ tList b

  rule "map/build" [1] Λ(a : sType). Λ(b : sType). λ(f : a 2.→ b). λ(xs : tList a).
    vbuild @b (Λ(b{1} : sType). λ(c : b 2.→ b{1} 2.→ b{1}) (n : b{1}).
        vfoldr @a @b{1} (vmapFB @b @b{1} @a c f) n xs)
   = vmap @a @b f xs
   :: tList b

  rule "mapFB" Λ(a : sType). Λ(b : sType). Λ(c : sType). Λ(d : sType). λ(c{1} : a 2.→ b 2.→ b). λ(f : c 2.→ a). λ(g : d 2.→ c).
    vmapFB @c @b @d (vmapFB @a @b @c c{1} f) g
   = vmapFB @a @b @d c{1} (λ(x : d).
      f (g x))
   :: d 2.→ b 2.→ b
status: pass
reason: The fusion rules of GHC.Base in miniature. A map under a foldr fuses into one loop, a map that nothing consumes turns back into a map, and two maps collapse into one.
