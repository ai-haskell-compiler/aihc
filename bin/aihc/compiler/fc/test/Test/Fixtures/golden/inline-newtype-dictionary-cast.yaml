---
extensions: []
modules:
- |
  {-# LANGUAGE GeneralizedNewtypeDeriving #-}
  module Test (run) where
  import GHC.Types (Bool (..))

  class Pick a where
    pick :: a -> Bool
    other :: a -> Bool

  data Base = Base Bool

  instance Pick Base where
    pick (Base b) = b
    other (Base b) = b

  newtype Wrap = Wrap Base deriving newtype (Pick)

  run :: Wrap -> Bool
  run w = pick w
passes:
- inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.t$Dict$Pick (a : sType) :: sType {
    1.c$Dict$Pick :: ∀(a : sType). (a 2.→ tBool) 2.→ (a 2.→ tBool) 2.→ t$Dict$Pick a
  }

  type 1.tBase :: sType {
    pub 1.cBase :: tBool 2.→ tBase
  }

  type 1.tWrap :: sType {}

  axiom 1.$ax$Wrap : tWrap ~R tBase

  pub val 1.v$fPickBase :: t$Dict$Pick tBase
    = c$Dict$Pick @tBase v$fPickBase$cpick v$fPickBase$cother

  val 1.v$fPickBase$cpick :: tBase 2.→ tBool
    = λ(x : tBase).
      let! cBase (b : tBool) = x;
      b

  val 1.v$fPickBase$cother :: tBase 2.→ tBool
    = λ(x : tBase).
      let! cBase (b : tBool) = x;
      b

  pub val 1.v$fPickWrap :: t$Dict$Pick tWrap
    = v$fPickBase ▷ tycon-co t$Dict$Pick (sym (axiom-co $ax$Wrap))

  pub val 1.vrun :: tWrap 2.→ tBool
    = λ(x : tWrap).
      let! cBase (b : tBool) = x ▷ axiom-co $ax$Wrap;
      b
status: pass
reason: |-
  A derived newtype instance is a cast of the underlying dictionary, so a method call
  scrutinises a cast constructor application. Pushing the cast into the application selects
  the method without the case, and pushing the cast that is left into the arguments of the
  call leaves a plain variable in the head, which the site then inlines.
