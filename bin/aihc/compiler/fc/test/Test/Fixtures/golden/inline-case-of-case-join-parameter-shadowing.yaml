---
extensions:
- MagicHash
modules:
- |
  module Test (check) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  count :: Int -> Int
  count n = case n of
    I# i -> case i of
      0# -> I# 1#
      _ -> count (I# (i -# 1#))

  twice :: Int -> Int
  twice n = case n of
    I# i -> I# (i +# i)

  divide :: Int -> Int -> Int
  divide a b = case a of
    I# p -> case b of
      I# q -> I# (p -# q)

  check :: Int -> Int -> Int
  check n m = divide (twice (count n)) (twice (count m))
passes:
- demand
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vcount :: tInt 3.→ tInt
    = λ(x : tInt).
      case x of {
        cI# (i : tInt#) →
          case i of {
            0#cIntRep →
              cI# lit (1#cIntRep) :: tInt#;
            _ →
              vcount (cI# (prim -# i lit (1#cIntRep) :: tInt#))
          }
      }

  pub val 1.vcheck :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case vcount x as (argument : tInt) of {
        _ →
          case argument of {
            cI# (i : tInt#) →
              let argument{1} : tInt# =
                prim +# i i;
              case vcount y as (argument{2} : tInt) of {
                _ →
                  case argument{2} of {
                    cI# (i{1} : tInt#) →
                      let argument{3} : tInt# =
                        prim +# i{1} i{1};
                      cI# (prim -# argument{1} argument{3})
                  }
              }
          }
      }
status: pass
reason: The demand pass evaluates each strict argument in a case, so the argument of 'divide' is a case on the argument of 'twice', and the two case binders are siblings that the tidied program names 'argument' both. The case of a case turns the outer alternative into a join point and simplifies its body inside the inner alternative, where the inner 'argument' is a known constructor. The join point takes fresh parameters, so the outer 'argument' keeps the doubled value instead of the field of the inner one, and the result subtracts the doubled values.
