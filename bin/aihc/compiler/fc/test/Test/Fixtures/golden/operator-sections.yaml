---
extensions: []
modules:
  - |
    module Test where

    import GHC.Prim (seq)
    import GHC.Types (Bool (..))

    pair :: a -> b -> (a, b)
    pair left right = (left, right)

    leftSection :: Bool -> (Bool, Bool)
    leftSection = (True `pair`)

    rightSection :: Bool -> (Bool, Bool)
    rightSection = (`pair` False)

    rwhnf :: a -> ()
    rwhnf = (`seq` ())
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tBool :: 3.tType;
    3.tLevity :: 3.tType;
    3.tLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.tType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.tType;
    2.tTuple2 :: ∀(a1 : 3.tType) (a2 : 3.tType). 3.tType;
    3.tType :: 3.tType;
    2.tUnit :: 3.tType;
    2.v() :: 2.tUnit;
    2.v(,) :: ∀(a1 : 3.tType) (a2 : 3.tType). a1 3.→ a2 3.→ 2.tTuple2 a1 a2;
    3.vBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.vFalse :: 3.tBool;
    3.vLifted :: 3.tLevity;
    3.vTrue :: 3.tBool

  import synonyms
    3.tLiftedRep = 3.vBoxedRep 3.vLifted;
    3.tType = 3.tTYPE 3.tLiftedRep

  pub val 1.vpair :: ∀(a : 3.tType) (b : 3.tType). a 3.→ b 3.→ 2.tTuple2 a b
   = Λ(a : 3.tType).
    Λ(b : 3.tType).
      λ(x : a).
        λ(y : b).
          2.v(,) @a @b x y

  pub val 1.vleftSection :: 3.tBool 3.→ 2.tTuple2 3.tBool 3.tBool
   = λ(_section : 3.tBool).
    1.vpair @3.tBool @3.tBool 3.vTrue _section

  pub val 1.vrightSection :: 3.tBool 3.→ 2.tTuple2 3.tBool 3.tBool
   = λ(_section : 3.tBool).
    1.vpair @3.tBool @3.tBool _section 3.vFalse

  pub val 1.vrwhnf :: ∀(a : 3.tType). a 3.→ 2.tUnit
   = Λ(a : 3.tType).
    λ(_section : a).
      (λ(seq_first : a).
        λ(seq_second : 2.tUnit).
          case seq_first as (seq_evaluated : a) return (2.tUnit) of {
              _ →
                  seq_second
          }) _section 2.v()
status: pass
reason: Operator sections produce typed FC lambdas with the correct argument order.
