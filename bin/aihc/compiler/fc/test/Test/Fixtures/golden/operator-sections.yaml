---
extensions: []
modules:
  - |
    module Test where

    import GHC.Prim (seq)
    import GHC.Types (Bool (..))

    pair :: a -> b -> (a, b)
    pair left right = (left, right)

    leftSection :: Bool -> (Bool, Bool)
    leftSection = (True `pair`)

    rightSection :: Bool -> (Bool, Bool)
    rightSection = (`pair` False)

    rwhnf :: a -> ()
    rwhnf = (`seq` ())
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.c(,)] 2.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    2.c() :: tUnit;
    2.c(,) :: ∀(a1 : sType) (a2 : sType). a1 3.→ a2 3.→ tTuple2 a1 a2;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cLifted :: tLevity;
    3.cTrue :: tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vpair :: ∀(a : sType) (b : sType). a 3.→ b 3.→ tTuple2 a b
    = Λ(a : sType) (b : sType). λ(x : a) (y : b).
      c(,) @a @b x y

  pub val 1.vleftSection :: tBool 3.→ tTuple2 tBool tBool
    = λ(_section : tBool).
      vpair @tBool @tBool cTrue _section

  pub val 1.vrightSection :: tBool 3.→ tTuple2 tBool tBool
    = λ(_section : tBool).
      vpair @tBool @tBool _section cFalse

  pub val 1.vrwhnf :: ∀(a : sType). a 3.→ tUnit
    = Λ(a : sType). λ(_section : a).
      (λ(seq_first : a) (seq_second : tUnit).
        case seq_first of {
          _ →
            seq_second
        }) _section c()
status: pass
reason: Operator sections produce typed FC lambdas with the correct argument order.
