modules:
- |
  module Test (run) where

  import GHC.Prim ((-#))
  import GHC.Types (Int (..))

  data Handle = FileHandle Int | DuplexHandle Int Int

  newtype Action = Action (Int -> (# Int, Int #))

  pick :: Int -> Handle
  pick (I# n) = case n of
    0# -> FileHandle (I# 0#)
    _ -> pick (I# (n -# 1#))

  write :: Int -> Int -> Int -> (# Int, Int #)
  write (I# h) n s = case h of
    0# -> (# s, n #)
    _ -> write (I# (h -# 1#)) n s

  say :: Int -> Action
  say n = Action (\s -> case pick n of
    FileHandle h -> write h n s
    DuplexHandle _ h -> write h n s)

  andThen :: Action -> Action -> Action
  andThen (Action f) (Action g) = Action (\s -> case f s of
    (# s', _ #) -> g s')

  start :: Action -> Int -> Int
  start (Action f) s = case f s of
    (# s', _ #) -> s'

  run :: Int -> Int
  run = start (
    say (I# 1#) `andThen`
    say (I# 2#) `andThen`
    say (I# 3#) `andThen`
    say (I# 4#) `andThen`
    say (I# 5#) `andThen`
    say (I# 6#) `andThen`
    say (I# 7#) `andThen`
    say (I# 8#) `andThen`
    say (I# 9#) `andThen`
    say (I# 10#) `andThen`
    say (I# 11#) `andThen`
    say (I# 12#) `andThen`
    say (I# 13#) `andThen`
    say (I# 14#) `andThen`
    say (I# 15#) `andThen`
    say (I# 16#) `andThen`
    say (I# 17#) `andThen`
    say (I# 18#) `andThen`
    say (I# 19#) `andThen`
    say (I# 20#))
