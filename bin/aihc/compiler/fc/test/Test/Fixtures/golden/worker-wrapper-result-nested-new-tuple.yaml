    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [3.c(,)] 3.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    constructors [4.cTuple2#] 4.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep))));
    constructors [4.cTuple3#] 4.tTuple3# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (r3 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2) (a3 : tTYPE r3). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c: tRuntimeRep r3 (c[] tRuntimeRep)))));
    4.sType :: sType;
    constructors [4.c[], 4.c:] 4.t[] :: ∀(a : sType). sType;
    3.c(,) :: ∀(a1 : sType) (a2 : sType). a1 → a2 → tTuple2 a1 a2;
    4.c: :: ∀(a : sType). a → t[] a → t[] a;
    4.cBoxedRep :: tLevity → tRuntimeRep;
    4.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
