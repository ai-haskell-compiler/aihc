  module Test (next) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..), IO (..))

  next :: Int -> IO (Int, Int)
  next n = IO (\s -> case n of
    I# i -> (# s, (n, I# (i +# 1#)) #))
passes:
- eta
- inline: shrink
- worker-wrapper
- simplify: 1
