    4.cLifted :: tLevity;
    unboxed-tuple 4.cTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). FUN @r1 @sLiftedRep a1 (FUN @r2 @(cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep)))) a2 (tTuple2# r1 r2 a1 a2));
    unboxed-tuple 4.cTuple3# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (r3 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2) (a3 : tTYPE r3). FUN @r1 @sLiftedRep a1 (FUN @r2 @sLiftedRep a2 (FUN @r3 @(cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c: tRuntimeRep r3 (c[] tRuntimeRep))))) a3 (tTuple3# r1 r2 r3 a1 a2 a3)));
    4.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    4.c[] :: ∀(a : sType). t[] a

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep

  import axioms
    4.$ax$IO (a : sType) : tIO a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# tRealWorld) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# tRealWorld) a)

  pub val 1.vnext inline :: tInt → tIO (tTuple2 tInt tInt)
    = λ(x : tInt).
      (λ(s : tState# tRealWorld).
        let! cI# (x{1} : tInt#) = x;
        let! cTuple3# (component : tState# tRealWorld) (field : tInt) (field{1} : tInt) = v$wnext x{1} s;
        cTuple2# @(cTupleRep (c[] tRuntimeRep)) @(cBoxedRep cLifted) @(tState# tRealWorld) @(tTuple2 tInt tInt) component (c(,) @tInt @tInt field field{1})) ▷ sym (axiom-co $ax$IO @(tTuple2 tInt tInt))

  val 1.v$wnext :: FUN @cIntRep @sLiftedRep tInt# (FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep))))) (tState# tRealWorld) (tTuple3# (cTupleRep (c[] tRuntimeRep)) sLiftedRep sLiftedRep (tState# tRealWorld) tInt tInt))
    = λ(x : tInt#) (s : tState# tRealWorld).
      cTuple3# @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep @sLiftedRep @(tState# tRealWorld) @tInt @tInt s (cI# x) (cI# (prim +# x lit (1#cIntRep) :: tInt#))
status: pass
reason: The module uses only the unboxed pair. The worker of next must still return the fields of the pair in an unboxed triple of State#, Int and Int, and the program must import the triple.
