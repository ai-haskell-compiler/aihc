    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    1.cPair :: tInt 3.→ tInt 3.→ tPair
  }

  val 1.vslow noinline :: tInt 3.→ tInt
    = λ(x : tInt).
      x

  pub val 1.vpick :: tInt 3.→ tInt 3.→ tPair
    = λ(x : tInt) (y : tInt).
      case x return (tPair) of {
        cI# (a : tInt#) →
          let lazy : tInt =
            vslow y;
          case prim <# a 0#cIntRep return (tPair) of {
