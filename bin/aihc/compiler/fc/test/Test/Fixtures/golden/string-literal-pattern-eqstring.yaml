    5.c[] :: ∀(a : sType). t[] a;
    4.veqString :: t[] tChar 5.→ t[] tChar 5.→ tBool;
    2.vunpackCString# :: FUN @cAddrRep @sLiftedRep tAddr# (t[] tChar)

  import synonyms
    5.sLiftedRep = cBoxedRep cLifted;
    5.sType = tTYPE sLiftedRep

  pub type 1.tColour :: sType {
    pub 1.cRed :: tColour;
    pub 1.cGreen :: tColour;
    pub 1.cShort :: tColour;
    pub 1.cUnknown :: t[] tChar 5.→ tColour
  }

  pub val 1.vreadColour :: t[] tChar 5.→ tColour
    = λ(x : t[] tChar).
      case veqString x (vunpackCString# "red"#cAddrRep) as (_case_guard : tBool) return (tColour) of {
        cTrue →
          cRed;
        cFalse →
          case veqString x (vunpackCString# "green"#cAddrRep) as (_case_guard{1} : tBool) return (tColour) of {
            cTrue →
              cGreen;
            cFalse →
              let _fail : tColour =
                cUnknown x;
              case x as (_scrut : t[] tChar) return (tColour) of {
                c: (_pat : tChar) (_pat{1} : t[] tChar) →
                  case _pat as (_scrut{1} : tChar) return (tColour) of {
                    cC# (_pat{2} : tChar#) →
                      case _pat{2} as (_scrut{2} : tChar#) return (tColour) of {
                        'x'#cWordRep →
                          case _pat{1} as (_scrut{3} : t[] tChar) return (tColour) of {
                            c[] →
                              cShort;
                            _ →
                              _fail
                          };
                        _ →
                          _fail
                      };
                    _ →
                      _fail
                  };
                _ →
                  _fail
              }
          }
