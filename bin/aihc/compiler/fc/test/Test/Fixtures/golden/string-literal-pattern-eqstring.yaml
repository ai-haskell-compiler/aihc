---
extensions: []
modules:
  - |
    module Test where

    import GHC.Types (Char)

    data Colour = Red | Green | Short | Unknown [Char]

    readColour :: [Char] -> Colour
    readColour "red" = Red
    readColour "green" = Green
    readColour "x" = Short
    readColour name = Unknown name
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.CString
  scope 3 = "aihc-prim" GHC.Prim
  scope 4 = "aihc-prim" GHC.Prim.String
  scope 5 = "aihc-prim" GHC.Types

  import headers
    3.tAddr# :: 5.tTYPE 5.cAddrRep;
    5.tBool :: 5.sType;
    5.tChar :: 5.sType;
    3.tChar# :: 5.tTYPE 5.cWordRep;
    5.tLevity :: 5.sType;
    5.sLiftedRep :: 5.tRuntimeRep;
    5.tRuntimeRep :: 5.sType;
    5.tTYPE :: ∀(rep : 5.tRuntimeRep). 5.sType;
    5.sType :: 5.sType;
    5.t[] :: ∀(a : 5.sType). 5.sType;
    5.c: :: ∀(a : 5.sType). a 5.→ 5.t[] a 5.→ 5.t[] a;
    5.cAddrRep :: 5.tRuntimeRep;
    5.cBoxedRep :: 5.tLevity 5.→ 5.tRuntimeRep;
    5.cC# :: FUN @5.cWordRep @5.sLiftedRep 3.tChar# 5.tChar;
    5.cFalse :: 5.tBool;
    5.cLifted :: 5.tLevity;
    5.cTrue :: 5.tBool;
    5.cWordRep :: 5.tRuntimeRep;
    5.c[] :: ∀(a : 5.sType). 5.t[] a;
    4.veqString :: 5.t[] 5.tChar 5.→ 5.t[] 5.tChar 5.→ 5.tBool;
    2.vunpackCString# :: FUN @5.cAddrRep @5.sLiftedRep 3.tAddr# (5.t[] 5.tChar)

  import synonyms
    5.sLiftedRep = 5.cBoxedRep 5.cLifted;
    5.sType = 5.tTYPE 5.sLiftedRep

  pub type 1.tColour :: 5.sType {
      pub 1.cRed :: 1.tColour;
      pub 1.cGreen :: 1.tColour;
      pub 1.cShort :: 1.tColour;
      pub 1.cUnknown :: 5.t[] 5.tChar 5.→ 1.tColour
  }

  pub val 1.vreadColour :: 5.t[] 5.tChar 5.→ 1.tColour
   = λ(x : 5.t[] 5.tChar).
    case 4.veqString x (2.vunpackCString# "red"#5.cAddrRep) as (_case_guard : 5.tBool) return (1.tColour) of {
        5.cTrue →
            1.cRed;
        5.cFalse →
            case 4.veqString x (2.vunpackCString# "green"#5.cAddrRep) as (_case_guard{1} : 5.tBool) return (1.tColour) of {
                5.cTrue →
                    1.cGreen;
                5.cFalse →
                    let {
                        _fail : 1.tColour =
                            1.cUnknown x
                    } in
                        case x as (_scrut : 5.t[] 5.tChar) return (1.tColour) of {
                            5.c: (_pat : 5.tChar) (_pat{1} : 5.t[] 5.tChar) →
                                case _pat as (_scrut{1} : 5.tChar) return (1.tColour) of {
                                    5.cC# (_pat{2} : 3.tChar#) →
                                        case _pat{2} as (_scrut{2} : 3.tChar#) return (1.tColour) of {
                                            'x'#5.cWordRep →
                                                case _pat{1} as (_scrut{3} : 5.t[] 5.tChar) return (1.tColour) of {
                                                    5.c[] →
                                                        1.cShort;
                                                    _ →
                                                        _fail
                                                };
                                            _ →
                                                _fail
                                        };
                                    _ →
                                        _fail
                                };
                            _ →
                                _fail
                        }
            }
    }
status: pass
reason: A string literal pattern of two or more characters compares with eqString, and a one-character literal matches as a list pattern.
