extensions: []
modules:
- |
  module Test where

  import GHC.Types (Bool(..))

  newtype Doc ann = Doc Bool

  wrap :: Doc ann -> Doc ann
  wrap document = document

  render :: Bool -> Doc ann
  render = go
    where
      go :: Bool -> Doc ann
      go flag =
        let (again, document) = case flag of
              True -> (False, Doc True)
              False -> (True, wrap (go True))
         in case again of
              True -> wrap document
              False -> document
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.c(,)] 2.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    2.c(,) :: ∀(a1 : sType) (a2 : sType). a1 3.→ a2 3.→ tTuple2 a1 a2;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cLifted :: tLevity;
    3.cTrue :: tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tDoc (ann : sType) :: sType {}

  axiom 1.$ax$Doc (ann : sType) : tDoc ann ~R tBool

  pub val 1.vwrap :: ∀(ann : sType). tDoc ann 3.→ tDoc ann
    = Λ(ann : sType). λ(x : tDoc ann).
      x

  pub val 1.vrender :: ∀(ann : sType). tBool 3.→ tDoc ann
    = Λ(ann : sType).
      rec {
        go : ∀(ann{1} : sType). tBool 3.→ tDoc ann{1} =
          Λ(ann{1} : sType). λ(x : tBool).
            let _pat_rhs : ∀(a : sType). tTuple2 tBool (tDoc a) =
              Λ(a : sType).
                case x of {
                  cTrue →
                    c(,) @tBool @(tDoc a) cFalse (cTrue ▷ sym (axiom-co $ax$Doc @a));
                  cFalse →
                    c(,) @tBool @(tDoc a) cTrue (vwrap @a (go @a cTrue))
                };
            let document : ∀(a : sType). tDoc a =
              Λ(a : sType).
                (Λ(a{1} : sType). λ(_pat_rhs{1} : tTuple2 tBool (tDoc a{1})).
                  let! c(,) (again : tBool) (document : tDoc a{1}) = _pat_rhs{1};
                  document) @a (_pat_rhs @a);
            case (Λ(a : sType). λ(_pat_rhs{1} : tTuple2 tBool (tDoc a)).
              let! c(,) (again : tBool) (document{1} : tDoc a) = _pat_rhs{1};
              again) @tUnit (_pat_rhs @tUnit) of {
              cTrue →
                vwrap @ann{1} (document @ann{1});
              cFalse →
                document @ann{1}
            }
      } in
      go @ann
