---
extensions:
- MagicHash
modules:
- |
  module Test (box, total) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  data Pair = Pair !Int !Int

  data Box = Box Int

  plus :: Int -> Int -> Int
  plus a b = case a of
    I# i -> case b of
      I# j -> I# (i +# j)

  box :: Pair -> Box
  box p = case p of
    Pair x y -> case x of
      I# i -> case y of
        I# j -> Box (plus (I# i) (I# j))

  total :: Pair -> Int
  total p = case p of
    Pair x y -> plus x (plus y x)
passes:
- worker-wrapper
- simplify: 1
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    strict [0, 1] 1.cPair :: tInt 3.→ tInt 3.→ tPair
  }

  type 1.tBox :: sType {
    1.cBox :: tInt 3.→ tBox
  }

  pub val 1.vbox :: tPair 3.→ tBox
    = λ(x : tPair).
      case x as (_scrut : tPair) return (tBox) of {
        cPair (x{1} : tInt) (y : tInt) →
          case x{1} as (_scrut{1} : tInt) return (tBox) of {
            cI# (i : tInt#) →
              case y as (_scrut{2} : tInt) return (tBox) of {
                cI# (j : tInt#) →
                  let argument : tInt# =
                    prim +# i j;
                  cBox (cI# argument)
              }
          }
      }

  pub val 1.vtotal :: tPair 3.→ tInt
    = λ(x : tPair).
      case x as (_scrut : tPair) return (tInt) of {
        cPair (x{1} : tInt) (y : tInt) →
          case x{1} as (wrapped : tInt) return (tInt) of {
            cI# (x{2} : tInt#) →
              case y as (wrapped{1} : tInt) return (tInt) of {
                cI# (x{3} : tInt#) →
                  case x{1} as (wrapped{2} : tInt) return (tInt) of {
                    cI# (y{1} : tInt#) →
                      case prim +# x{3} y{1} as (field : tInt#) return (tInt) of {
                        _ →
                          case prim +# x{2} field as (field{1} : tInt#) return (tInt) of {
                            _ →
                              cI# field{1}
                          }
                      }
                  }
              }
          }
      }
status: pass
reason: A copy of the wrapper of a function with a constructed result gives a case on a safe primitive call. In the lazy argument of Box, that case must become a strict let of the primitive, which the constructor takes as a value, and not a thunk.
