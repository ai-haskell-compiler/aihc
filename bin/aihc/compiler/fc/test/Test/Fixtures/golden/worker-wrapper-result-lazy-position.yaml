---
extensions:
- MagicHash
modules:
- |
  module Test (box, total) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  data Pair = Pair {-# NOUNPACK #-} !Int {-# NOUNPACK #-} !Int

  data Box = Box Int

  plus :: Int -> Int -> Int
  plus a b = case a of
    I# i -> case b of
      I# j -> I# (i +# j)

  box :: Pair -> Box
  box p = case p of
    Pair x y -> case x of
      I# i -> case y of
        I# j -> Box (plus (I# i) (I# j))

  total :: Pair -> Int
  total p = case p of
    Pair x y -> plus x (plus y x)
passes:
- worker-wrapper
- simplify: 1
- inline: grow
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tPair :: sType {
    pub strict [0, 1] 1.cPair :: tInt → tInt → tPair
  }

  type 1.tBox :: sType {
    pub 1.cBox :: tInt → tBox
  }

  pub val 1.vbox inline :: tPair → tBox
    = λ(x : tPair).
      let! cPair (x{1} : tInt) (x{2} : tInt) = x;
      let! cI# (i : tInt#) = x{1};
      let! cI# (j : tInt#) = x{2};
      cBox (cI# (prim +# i j))

  pub val 1.vtotal inline :: tPair → tInt
    = λ(x : tPair).
      let! cPair (x{1} : tInt) (x{2} : tInt) = x;
      let! cI# (x{3} : tInt#) = x{2};
      let! cI# (y : tInt#) = x{1};
      cI# (prim +# y (prim +# x{3} y))
status: pass
reason: A copy of the wrapper of a function with a constructed result gives a case on a safe primitive call. In the lazy argument of Box, that case becomes the constructor of the primitive call, which the GRIN lowering runs when it builds the constructor. Thus the field is a value and not a thunk. Pair has lifted strict fields, so box and total also get workers, and the growing inliner copies them back into their wrappers.
