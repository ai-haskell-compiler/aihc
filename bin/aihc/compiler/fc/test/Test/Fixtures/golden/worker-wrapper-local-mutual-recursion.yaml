---
extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  run :: Int -> Int -> Int
  run step n0 = ping n0 (I# 0#)
    where
      ping n acc = case n of
        I# 0# -> acc
        I# k -> case acc of
          I# a -> pong (I# (k -# 1#)) (I# (a +# 1#))
      pong n acc = case n of
        I# 0# -> acc
        I# k -> case acc of
          I# a -> case step of
            I# s -> ping (I# (k -# 1#)) (I# (a +# s))
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    strict [0] 3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vrun :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      rec {
          $wping : FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# (FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# 3.tInt) =
              λ(x{1} : 2.tInt#).
                λ(y{1} : 2.tInt#).
                  case x{1} as (_scrut : 2.tInt#) return (3.tInt) of {
                      0#3.cIntRep →
                          3.cI# y{1};
                      _ →
                          let {
                              x{2} : 2.tInt# =
                                  foreign {prim 2.v-# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut 1#3.cIntRep
                          } in
                              let {
                                  y{2} : 2.tInt# =
                                      foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} y{1} 1#3.cIntRep
                              } in
                                  $wpong x{2} y{2}
                  };
          $wpong : FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# (FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# 3.tInt) =
              λ(x{1} : 2.tInt#).
                λ(y{1} : 2.tInt#).
                  case x{1} as (_scrut : 2.tInt#) return (3.tInt) of {
                      0#3.cIntRep →
                          3.cI# y{1};
                      _ →
                          case x as (_scrut{1} : 3.tInt) return (3.tInt) of {
                              3.cI# (s : 2.tInt#) →
                                  let {
                                      x{2} : 2.tInt# =
                                          foreign {prim 2.v-# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} _scrut 1#3.cIntRep
                                  } in
                                      let {
                                          y{2} : 2.tInt# =
                                              foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} y{1} s
                                      } in
                                          $wping x{2} y{2}
                          }
                  }
      } in
          case y as (wrapped : 3.tInt) return (3.tInt) of {
              3.cI# (x{1} : 2.tInt#) →
                  $wping x{1} 0#3.cIntRep
          }
status: pass
reason: The two local loops call each other and have a free variable, so they stay local. Each one gets a worker that takes the fields of its counter, and a call from one loop to the other builds no box for the counter.
