---
extensions:
- MagicHash
modules:
- |
  module Test (run) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  run :: Int -> Int -> Int
  run step n0 = ping n0 (I# 0#)
    where
      ping n acc = case n of
        I# 0# -> acc
        I# k -> case acc of
          I# a -> pong (I# (k -# 1#)) (I# (a +# 1#))
      pong n acc = case n of
        I# 0# -> acc
        I# k -> case acc of
          I# a -> case step of
            I# s -> ping (I# (k -# 1#)) (I# (a +# s))
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vrun :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case y of {
        cI# (x{1} : tInt#) →
          rec {
            $wping : FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @cIntRep @(cBoxedRep cLifted) tInt# tInt) =
              λ(x{2} : tInt#) (y{1} : tInt#).
                let y{2} : tInt =
                  cI# y{1};
                case x{2} of {
                  0#cIntRep →
                    y{2};
                  _ →
                    $wpong (prim -# x{2} lit (1#cIntRep) :: tInt#) (prim +# y{1} lit (1#cIntRep) :: tInt#)
                };
            $wpong : FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @cIntRep @(cBoxedRep cLifted) tInt# tInt) =
              λ(x{2} : tInt#) (y{1} : tInt#).
                let y{2} : tInt =
                  cI# y{1};
                case x{2} of {
                  0#cIntRep →
                    y{2};
                  _ →
                    case x of {
                      cI# (s : tInt#) →
                        $wping (prim -# x{2} lit (1#cIntRep) :: tInt#) (prim +# y{1} s)
                    }
                }
          } in
          $wping x{1} lit (0#cIntRep) :: tInt#
      }
status: pass
reason: The two local loops call each other and have a free variable, so they stay local. Each one gets a worker that takes the fields of its counter, and a call from one loop to the other builds no box for the counter.
