  module Test (run) where

  import GHC.Prim ((-#))
  import GHC.Types (Int (..))

  data Handle = FileHandle Int | DuplexHandle Int Int

  -- The recursion keeps both functions out of the inliner, so that the
  -- case on the handle keeps both alternatives.
  pick :: Int -> Handle
  pick (I# n) = case n of
    0# -> FileHandle (I# 0#)
    _ -> pick (I# (n -# 1#))

  write :: Int -> Int -> Int -> (# Int, Int #)
  write (I# h) n s = case h of
    0# -> (# s, n #)
    _ -> write (I# (h -# 1#)) n s

  run :: Int -> Int
  run s0 =
    let a1 = \s -> case pick (I# 1#) of { FileHandle h -> write h (I# 1#) s; DuplexHandle _ h -> write h (I# 1#) s } in
    let a2 = \s -> case pick (I# 2#) of { FileHandle h -> write h (I# 2#) s; DuplexHandle _ h -> write h (I# 2#) s } in
