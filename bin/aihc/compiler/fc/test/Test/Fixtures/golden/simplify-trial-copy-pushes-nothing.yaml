  import GHC.Prim ((-#))
  import GHC.Types (Int (..))

  data Handle = FileHandle Int | DuplexHandle Int Int

  -- The recursion keeps both functions out of the inliner, so that the
  -- case on the handle keeps both alternatives.
  pick :: Int -> Handle
  pick (I# n) = case n of
    0# -> FileHandle (I# 0#)
    _ -> pick (I# (n -# 1#))

  write :: Int -> Int -> Int -> (# Int, Int #)
  write (I# h) n s = case h of
    0# -> (# s, n #)
    _ -> write (I# (h -# 1#)) n s

