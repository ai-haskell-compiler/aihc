---
extensions: []
modules:
- |
  module Test where
  data Nat = Z | S Nat
  data Id a = Id a
  data Other a = Other a
  data Box v a = Box a | Wrap (v a)
  data Tag p a = Tag a
  re :: Box u a -> Box v a
  re b = case b of
    Box x -> Box x
    Wrap _ -> re b
  retag :: Tag p a -> Tag q a
  retag t = case t of
    Tag x -> Tag x
  {-# RULES
  "re/re" forall s. re (re s) = s
  "retag/retag" forall t. retag (retag t) = t
    #-}
  useRe :: Box Id Nat -> Box Id Nat
  useRe b = re (re b :: Box Other Nat)
  useRetag :: Tag Nat Nat -> Tag Nat Nat
  useRetag t = retag (retag t :: Tag (Id Nat) Nat)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tNat :: sType {
    pub 1.cZ :: tNat;
    pub 1.cS :: tNat 2.→ tNat
  }

  pub type 1.tId (a : sType) :: sType {
    pub 1.cId :: ∀(a : sType). a 2.→ tId a
  }

  pub type 1.tOther (a : sType) :: sType {
    pub 1.cOther :: ∀(a : sType). a 2.→ tOther a
  }

  pub type 1.tBox (v : sType 2.→ sType) (a : sType) :: sType {
    pub 1.cBox :: ∀(v : sType 2.→ sType) (a : sType). a 2.→ tBox v a;
    pub 1.cWrap :: ∀(v : sType 2.→ sType) (a : sType). v a 2.→ tBox v a
  }

  pub type 1.tTag (p : sType) (a : sType) :: sType {
    pub 1.cTag :: ∀(p : sType) (a : sType). a 2.→ tTag p a
  }

  pub val 1.vre :: ∀(u : sType 2.→ sType) (a : sType) (v : sType 2.→ sType). tBox u a 2.→ tBox v a
    = Λ(u : sType 2.→ sType) (a : sType) (v : sType 2.→ sType). λ(x : tBox u a).
      case x as (_scrut : tBox u a) return (tBox v a) of {
        cBox (x{1} : a) →
          cBox @v @a x{1};
        cWrap (_pat : u a) →
          vre @u @a @v x
      }

  pub val 1.vretag :: ∀(p : sType) (a : sType) (q : sType). tTag p a 2.→ tTag q a
    = Λ(p : sType) (a : sType) (q : sType). λ(x : tTag p a).
      case x as (_scrut : tTag p a) return (tTag q a) of {
        cTag (x{1} : a) →
          cTag @q @a x{1}
      }

  pub val 1.vuseRe :: tBox tId tNat 2.→ tBox tId tNat
    = λ(x : tBox tId tNat).
      x

  pub val 1.vuseRetag :: tTag tNat tNat 2.→ tTag tNat tNat
    = λ(x : tTag tNat tNat).
      x

  rule "re/re" Λ(a : sType 2.→ sType). Λ(b : sType). Λ(c : sType 2.→ sType). λ(s : tBox a b).
    vre @c @b @a (vre @a @b @c s)
   = s
   :: tBox a b

  rule "retag/retag" Λ(a : sType). Λ(b : sType). Λ(c : sType). λ(t : tTag a b).
    vretag @c @b @a (vretag @a @b @c t)
   = t
   :: tTag a b
status: pass
reason: A rule fires at each intermediate type of its left-hand side.
