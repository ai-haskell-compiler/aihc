---
extensions: []
modules:
- |
  module Test where
  data Nat = Z | S Nat
  data Id a = Id a
  data Other a = Other a
  data Box v a = Box a | Wrap (v a)
  data Tag p a = Tag a
  re :: Box u a -> Box v a
  re b = case b of
    Box x -> Box x
    Wrap _ -> re b
  retag :: Tag p a -> Tag q a
  retag t = case t of
    Tag x -> Tag x
  {-# RULES
  "re/re" forall s. re (re s) = s
  "retag/retag" forall t. retag (retag t) = t
    #-}
  useRe :: Box Id Nat -> Box Id Nat
  useRe b = re (re b :: Box Other Nat)
  useRetag :: Tag Nat Nat -> Tag Nat Nat
  useRetag t = retag (retag t :: Tag (Id Nat) Nat)
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tNat :: 2.sType {
      pub 1.cZ :: 1.tNat;
      pub 1.cS :: 1.tNat 2.→ 1.tNat
  }

  pub type 1.tId (a : 2.sType) :: 2.sType {
      pub 1.cId :: ∀(a : 2.sType). a 2.→ 1.tId a
  }

  pub type 1.tOther (a : 2.sType) :: 2.sType {
      pub 1.cOther :: ∀(a : 2.sType). a 2.→ 1.tOther a
  }

  pub type 1.tBox (v : 2.sType 2.→ 2.sType) (a : 2.sType) :: 2.sType {
      pub 1.cBox :: ∀(v : 2.sType 2.→ 2.sType) (a : 2.sType). a 2.→ 1.tBox v a;
      pub 1.cWrap :: ∀(v : 2.sType 2.→ 2.sType) (a : 2.sType). v a 2.→ 1.tBox v a
  }

  pub type 1.tTag (p : 2.sType) (a : 2.sType) :: 2.sType {
      pub 1.cTag :: ∀(p : 2.sType) (a : 2.sType). a 2.→ 1.tTag p a
  }

  pub val 1.vre :: ∀(u : 2.sType 2.→ 2.sType) (a : 2.sType) (v : 2.sType 2.→ 2.sType). 1.tBox u a 2.→ 1.tBox v a
   = Λ(u : 2.sType 2.→ 2.sType).
    Λ(a : 2.sType).
      Λ(v : 2.sType 2.→ 2.sType).
        λ(x : 1.tBox u a).
          case x as (_scrut : 1.tBox u a) return (1.tBox v a) of {
              1.cBox (x{1} : a) →
                  1.cBox @v @a x{1};
              1.cWrap (_pat : u a) →
                  1.vre @u @a @v x
          }

  pub val 1.vretag :: ∀(p : 2.sType) (a : 2.sType) (q : 2.sType). 1.tTag p a 2.→ 1.tTag q a
   = Λ(p : 2.sType).
    Λ(a : 2.sType).
      Λ(q : 2.sType).
        λ(x : 1.tTag p a).
          case x as (_scrut : 1.tTag p a) return (1.tTag q a) of {
              1.cTag (x{1} : a) →
                  1.cTag @q @a x{1}
          }

  pub val 1.vuseRe :: 1.tBox 1.tId 1.tNat 2.→ 1.tBox 1.tId 1.tNat
   = λ(x : 1.tBox 1.tId 1.tNat).
    x

  pub val 1.vuseRetag :: 1.tTag 1.tNat 1.tNat 2.→ 1.tTag 1.tNat 1.tNat
   = λ(x : 1.tTag 1.tNat 1.tNat).
    x

  rule "re/re" Λ(a : 2.sType 2.→ 2.sType). Λ(b : 2.sType). Λ(c : 2.sType 2.→ 2.sType). λ(s : 1.tBox a b).
    1.vre @c @b @a (1.vre @a @b @c s)
   = s
   :: 1.tBox a b

  rule "retag/retag" Λ(a : 2.sType). Λ(b : 2.sType). Λ(c : 2.sType). λ(t : 1.tTag a b).
    1.vretag @c @b @a (1.vretag @a @b @c t)
   = t
   :: 1.tTag a b
status: pass
reason: A rule fires at each intermediate type of its left-hand side.
