---
extensions:
- MagicHash
- BangPatterns
modules:
- |
  module Test (sumTwo, sumUntil) where

  import GHC.Prim (Int#, (+#), (>=#))
  import GHC.Types (Int (..))

  sumTwo :: Int# -> Int#
  sumTwo v =
    let go :: Int# -> Int# -> Int#
        go k acc = case k >=# 2# of
          1# -> acc
          _ -> go (k +# 1#) (acc +# v)
     in go 0# 0#

  sumUntil :: Int# -> Int# -> Int#
  sumUntil v n =
    let go :: Int# -> Int# -> Int#
        go k acc = case k >=# n of
          1# -> acc
          _ -> go (k +# 1#) (acc +# v)
     in go 0# 0#
passes:
- unroll
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    >=# = 2.v>=# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vsumTwo :: FUN @cIntRep @cIntRep tInt# tInt#
    = λ(x : tInt#).
      prim +# x x

  pub val 1.vsumUntil :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)
    = λ(x : tInt#) (y : tInt#).
      rec {
        go : FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#) =
          λ(x{1} : tInt#) (y{1} : tInt#).
            case prim >=# x{1} y of {
              1#cIntRep →
                y{1};
              _ →
                go (prim +# x{1} lit (1#cIntRep) :: tInt#) (prim +# y{1} x)
            }
      } in
      go lit (0#cIntRep) :: tInt# lit (0#cIntRep) :: tInt#
status: pass
reason: In 'sumTwo', the literal count 2 decides each recursion of 'go', so two copies of the body and the base case replace the loop. In 'sumUntil', the count 'n' is not known, so the loop stays.
