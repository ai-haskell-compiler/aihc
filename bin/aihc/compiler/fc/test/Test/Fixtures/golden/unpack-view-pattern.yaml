---
extensions:
- ViewPatterns
modules:
- |
  {-# LANGUAGE ViewPatterns #-}
  module Test where

  import GHC.Types (Int)

  data Pair = Pair Int Int
  data Boxed = Boxed {-# UNPACK #-} !Pair Int

  toFirst :: Pair -> Int
  toFirst (Pair a _) = a

  viewed :: Boxed -> Int
  viewed (Boxed (toFirst -> n) _) = n

  aliased :: Boxed -> Pair
  aliased (Boxed p@(Pair _ _) _) = p
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tPair :: sType {
    pub 1.cPair :: tInt 2.→ tInt 2.→ tPair
  }

  pub type 1.tBoxed :: sType {
    pub 1.cBoxed :: tInt 2.→ tInt 2.→ tInt 2.→ tBoxed
  }

  pub val 1.vtoFirst :: tPair 2.→ tInt
    = λ(x : tPair).
      case x as (_scrut : tPair) return (tInt) of {
        cPair (a : tInt) (_pat : tInt) →
          a
      }

  pub val 1.vviewed :: tBoxed 2.→ tInt
    = λ(x : tBoxed).
      case x as (_scrut : tBoxed) return (tInt) of {
        cBoxed (_unpack_leaf0 : tInt) (_unpack_leaf1 : tInt) (_pat : tInt) →
          vtoFirst (cPair _unpack_leaf0 _unpack_leaf1)
      }

  pub val 1.valiased :: tBoxed 2.→ tPair
    = λ(x : tBoxed).
      case x as (_scrut : tBoxed) return (tPair) of {
        cBoxed (_unpack_leaf0 : tInt) (_unpack_leaf1 : tInt) (_pat : tInt) →
          let _pat{1} : tPair =
            cPair _unpack_leaf0 _unpack_leaf1;
          case _pat{1} as (_scrut{1} : tPair) return (tPair) of {
            cPair (_pat{2} : tInt) (_pat{3} : tInt) →
              _pat{1}
          }
      }
status: pass
reason: A view pattern or an as-pattern on an unpacked field rebuilds the field instead of flattening it.
