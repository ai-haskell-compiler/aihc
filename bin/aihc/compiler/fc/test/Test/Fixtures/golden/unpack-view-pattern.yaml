---
extensions:
- ViewPatterns
modules:
- |
  {-# LANGUAGE ViewPatterns #-}
  module Test where

  import GHC.Types (Int)

  data Pair = Pair Int Int
  data Boxed = Boxed {-# UNPACK #-} !Pair Int

  toFirst :: Pair -> Int
  toFirst (Pair a _) = a

  viewed :: Boxed -> Int
  viewed (Boxed (toFirst -> n) _) = n

  aliased :: Boxed -> Pair
  aliased (Boxed p@(Pair _ _) _) = p
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cI#] 2.tInt :: 2.sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tPair :: 2.sType {
      pub 1.cPair :: 2.tInt 2.→ 2.tInt 2.→ 1.tPair
  }

  pub type 1.tBoxed :: 2.sType {
      pub 1.cBoxed :: 2.tInt 2.→ 2.tInt 2.→ 2.tInt 2.→ 1.tBoxed
  }

  pub val 1.vtoFirst :: 1.tPair 2.→ 2.tInt
   = λ(x : 1.tPair).
    case x as (_scrut : 1.tPair) return (2.tInt) of {
        1.cPair (a : 2.tInt) (_pat : 2.tInt) →
            a
    }

  pub val 1.vviewed :: 1.tBoxed 2.→ 2.tInt
   = λ(x : 1.tBoxed).
    case x as (_scrut : 1.tBoxed) return (2.tInt) of {
        1.cBoxed (_unpack_leaf0 : 2.tInt) (_unpack_leaf1 : 2.tInt) (_pat : 2.tInt) →
            1.vtoFirst (1.cPair _unpack_leaf0 _unpack_leaf1)
    }

  pub val 1.valiased :: 1.tBoxed 2.→ 1.tPair
   = λ(x : 1.tBoxed).
    case x as (_scrut : 1.tBoxed) return (1.tPair) of {
        1.cBoxed (_unpack_leaf0 : 2.tInt) (_unpack_leaf1 : 2.tInt) (_pat : 2.tInt) →
            let {
                _pat{1} : 1.tPair =
                    1.cPair _unpack_leaf0 _unpack_leaf1
            } in
                case _pat{1} as (_scrut{1} : 1.tPair) return (1.tPair) of {
                    1.cPair (_pat{2} : 2.tInt) (_pat{3} : 2.tInt) →
                        _pat{1}
                }
    }
status: pass
reason: A view pattern or an as-pattern on an unpacked field rebuilds the field instead of flattening it.
