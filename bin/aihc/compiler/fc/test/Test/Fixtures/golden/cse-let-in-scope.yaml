---
extensions:
- MagicHash
modules:
- |
  module Test (decode) where

  import GHC.Types (Int (..))

  replacement :: Int -> [Int] -> [Int]
  replacement x y = y

  append :: [Int] -> [Int] -> [Int]
  append xs ys = xs

  decode :: Int -> [Int] -> [Int]
  decode x y =
    let fallback = x : replacement x y
     in case y of
          [] -> append fallback fallback
          z : _ -> case z of
            I# 0# -> x : replacement x y
            _ -> z : x : replacement x y
passes:
- cse
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a → t[] a → t[] a;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vreplacement :: tInt → t[] tInt → t[] tInt
    = λ(unused x : tInt) (y : t[] tInt).
      y

  val 1.vappend :: t[] tInt → t[] tInt → t[] tInt
    = λ(x : t[] tInt) (unused y : t[] tInt).
      x

  pub val 1.vdecode :: tInt → t[] tInt → t[] tInt
    = λ(x : tInt) (y : t[] tInt).
      let fallback : t[] tInt =
        c: @tInt x (vreplacement x y);
      case y of {
        c[] →
          vappend fallback fallback;
        c: (z : tInt) (unused _pat : t[] tInt) →
          let! cI# (_pat{1} : tInt#) = z;
          case _pat{1} of {
            0#cIntRep →
              fallback;
            _ →
              c: @tInt z fallback
          }
      }
status: pass
reason: The let binds the list with head 'x' and tail 'replacement x y'. Two alternatives build the same list again. The pass uses 'fallback' at these two positions.
