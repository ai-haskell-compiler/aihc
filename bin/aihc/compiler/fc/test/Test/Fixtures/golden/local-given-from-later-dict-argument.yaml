  pub val 1.vpointFree :: ∀(m : sType 2.→ sType) (a : sType). t$Dict$Monad' m 2.→ tDict (t$Dict$Pure m a) 2.→ m a 2.→ m (tBox a)
    = Λ(m : sType 2.→ sType) (a : sType). λ($d0 : t$Dict$Monad' m) (x : tDict (t$Dict$Pure m a)).
      v\\ @(t$Dict$Pure m a) @(tDict (t$Dict$Pure m a)) @(m a 2.→ m (tBox a)) (v$fHasDictaDicta @(t$Dict$Pure m a)) (λ($higher_rank_d0 : t$Dict$Pure m a).
