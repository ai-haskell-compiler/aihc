  pub val 1.vwithDict :: ∀(c : sType) (e : sType) (r : sType). t$Dict$HasDict c e 2.→ e 2.→ (c 2.→ r) 2.→ r
    = Λ(c : sType) (e : sType) (r : sType). λ($d0 : t$Dict$HasDict c e) (x : e) (y : c 2.→ r).
