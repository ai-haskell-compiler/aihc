    = Λ(m : sType 2.→ sType) (a : sType). λ(x : tDict (t$Dict$Pure m a)) (y : m (tStM m a)).
      vwithDict @(t$Dict$Pure m a) @(tDict (t$Dict$Pure m a)) @(m a) (v$fHasDictaDicta @(t$Dict$Pure m a)) x (λ($higher_rank_d0 : t$Dict$Pure m a).
        let $co0 : tStM m a ~ a =
