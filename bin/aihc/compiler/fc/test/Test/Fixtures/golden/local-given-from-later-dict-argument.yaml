extensions:
- ConstraintKinds
- FlexibleInstances
- FunctionalDependencies
- GADTs
- RankNTypes
- ScopedTypeVariables
- TypeFamilies
- TypeOperators
- UndecidableInstances
- UndecidableSuperClasses
modules:
- |
  {-# LANGUAGE ConstraintKinds, FlexibleInstances, FunctionalDependencies, GADTs, RankNTypes, ScopedTypeVariables, TypeFamilies, TypeOperators, UndecidableInstances, UndecidableSuperClasses #-}
  module Test where
  import GHC.Types (Constraint, Type)
  data Dict (c :: Constraint) where
    Dict :: c => Dict c
  newtype a :- b = Sub (a => Dict b)
  class HasDict c e | e -> c where
    evidence :: e -> Dict c
  instance HasDict a (Dict a) where
    evidence d = d
  instance a => HasDict b (a :- b) where
    evidence (Sub d) = d
  withDict :: HasDict c e => e -> (c => r) -> r
  withDict d r = case evidence d of
    Dict -> r
  infixl 1 \\
  (\\) :: HasDict c e => (c => r) -> e -> r
  r \\ d = withDict d r
  type family StM (m :: Type -> Type) a
  class StM m a ~ a => Pure m a
  instance StM m a ~ a => Pure m a
  viaOperator :: forall m a. Dict (Pure m a) -> m (StM m a) -> m a
  viaOperator d x = x \\ d
  viaWithDict :: forall m a. Dict (Pure m a) -> m (StM m a) -> m a
  viaWithDict d x = withDict d x
  viaCase :: Dict (Pure m a) -> m (StM m a) -> m a
  viaCase d x = case d of
    Dict -> x
  data Box a = Box a
  class Monad' m where
    unit :: a -> m a
  boxed :: Monad' m => m a -> m (Box (StM m a))
  boxed x = boxed x
  pointFree :: forall m a. Monad' m => Dict (Pure m a) -> m a -> m (Box a)
  pointFree d = boxed \\ d
  pair :: (b a -> b c -> r) -> (forall x. m x -> b (StM m x)) -> Dict (Pure m a) -> Dict (Pure m c) -> m a -> m c -> r
  pair f run da dc left right = f (run left \\ da) (run right \\ dc)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity;
    2.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tDict (c : sType) :: sType {
    pub 1.cDict :: ∀(c : sType). c → tDict c
  }

  pub type 1.t:- (a : sType) (b : sType) :: sType {}

  axiom 1.$ax$:- (a : sType) (b : sType) : t:- a b ~R a → tDict b

  pub type 1.t$Dict$HasDict (c : sType) (e : sType) :: sType {
    pub 1.c$Dict$HasDict :: ∀(c : sType) (e : sType). (e → tDict c) → t$Dict$HasDict c e
  }

  pub type 1.tStM (m : sType → sType) (a : sType) :: sType @N @N {}

  pub type 1.t$Dict$Pure (m : sType → sType) (a : sType) :: sType {
    pub 1.c$Dict$Pure :: ∀(m : sType → sType) (a : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tStM m a ~ a) (t$Dict$Pure m a)
  }

  pub type 1.tBox (a : sType) :: sType {
    pub 1.cBox :: ∀(a : sType). a → tBox a
  }

  pub type 1.t$Dict$Monad' (m : sType → sType) :: sType {
    pub 1.c$Dict$Monad' :: ∀(m : sType → sType). (∀(a : sType). a → m a) → t$Dict$Monad' m
  }

  pub val 1.vevidence :: ∀(c : sType) (e : sType). t$Dict$HasDict c e → e → tDict c
    = Λ(c : sType) (e : sType). λ($dHasDict : t$Dict$HasDict c e).
      let! c$Dict$HasDict ($cevidence : e → tDict c) = $dHasDict;
      $cevidence

  pub val 1.vunit :: ∀(m : sType → sType) (a : sType). t$Dict$Monad' m → a → m a
    = Λ(m : sType → sType) (a : sType). λ($dMonad' : t$Dict$Monad' m).
      let! c$Dict$Monad' ($cunit : ∀(a{1} : sType). a{1} → m a{1}) = $dMonad';
      $cunit @a

  pub val 1.v$fHasDictaDicta :: ∀(a : sType). t$Dict$HasDict a (tDict a)
    = Λ(a : sType).
      c$Dict$HasDict @a @(tDict a) (v$fHasDictaDicta$cevidence @a)

  val 1.v$fHasDictaDicta$cevidence :: ∀(a : sType). tDict a → tDict a
    = Λ(a : sType). λ(x : tDict a).
      x

  pub val 1.v$fHasDictb:-ab :: ∀(a : sType) (b : sType). a → t$Dict$HasDict b (t:- a b)
    = Λ(a : sType) (b : sType). λ($d : a).
      c$Dict$HasDict @b @(t:- a b) (v$fHasDictb:-ab$cevidence @a @b $d)

  val 1.v$fHasDictb:-ab$cevidence :: ∀(a : sType) (b : sType). a → t:- a b → tDict b
    = Λ(a : sType) (b : sType). λ($d : a) (x : t:- a b).
      (x ▷ axiom-co $ax$:- @a @b) $d

  pub val 1.v$fPurema :: ∀(m : sType → sType) (a : sType). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tStM m a ~ a) (t$Dict$Pure m a)
    = Λ(m : sType → sType) (a : sType). λ($co : tStM m a ~ a).
      c$Dict$Pure @m @a (coercion ($co))

  pub val 1.vwithDict :: ∀(c : sType) (e : sType) (r : sType). t$Dict$HasDict c e → e → (c → r) → r
    = Λ(c : sType) (e : sType) (r : sType). λ($dHasDict : t$Dict$HasDict c e) (x : e) (y : c → r).
      let! cDict ($d : c) = vevidence @c @e $dHasDict x;
      y $d

  pub val 1.v\\ :: ∀(c : sType) (e : sType) (r : sType). t$Dict$HasDict c e → (c → r) → e → r
    = Λ(c : sType) (e : sType) (r : sType). λ($dHasDict : t$Dict$HasDict c e) (x : c → r) (y : e).
      vwithDict @c @e @r $dHasDict y (λ($d : c).
        x $d)

  pub val 1.vviaOperator :: ∀(m : sType → sType) (a : sType). tDict (t$Dict$Pure m a) → m (tStM m a) → m a
    = Λ(m : sType → sType) (a : sType). λ(x : tDict (t$Dict$Pure m a)) (y : m (tStM m a)).
      v\\ @(t$Dict$Pure m a) @(tDict (t$Dict$Pure m a)) @(m a) (v$fHasDictaDicta @(t$Dict$Pure m a)) (λ($dPure : t$Dict$Pure m a).
        let $co : tStM m a ~ a =
          let! c$Dict$Pure ($co{1} : tStM m a ~ a) = $dPure;
          $co{1};
        y ▷ sym (app-co (refl m) (sym ($co)))) x

  pub val 1.vviaWithDict :: ∀(m : sType → sType) (a : sType). tDict (t$Dict$Pure m a) → m (tStM m a) → m a
    = Λ(m : sType → sType) (a : sType). λ(x : tDict (t$Dict$Pure m a)) (y : m (tStM m a)).
      vwithDict @(t$Dict$Pure m a) @(tDict (t$Dict$Pure m a)) @(m a) (v$fHasDictaDicta @(t$Dict$Pure m a)) x (λ($dPure : t$Dict$Pure m a).
        let $co : tStM m a ~ a =
          let! c$Dict$Pure ($co{1} : tStM m a ~ a) = $dPure;
          $co{1};
        y ▷ sym (app-co (refl m) (sym ($co))))

  pub val 1.vviaCase :: ∀(m : sType → sType) (a : sType). tDict (t$Dict$Pure m a) → m (tStM m a) → m a
    = Λ(m : sType → sType) (a : sType). λ(x : tDict (t$Dict$Pure m a)) (y : m (tStM m a)).
      let! cDict ($dPure : t$Dict$Pure m a) = x;
      let $co : tStM m a ~ a =
        let! c$Dict$Pure ($co{1} : tStM m a ~ a) = $dPure;
        $co{1};
      y ▷ sym (app-co (refl m) (sym ($co)))

  pub val 1.vboxed :: ∀(m : sType → sType) (a : sType). t$Dict$Monad' m → m a → m (tBox (tStM m a))
    = Λ(m : sType → sType) (a : sType). λ($dMonad' : t$Dict$Monad' m) (x : m a).
      vboxed @m @a $dMonad' x

  pub val 1.vpointFree :: ∀(m : sType → sType) (a : sType). t$Dict$Monad' m → tDict (t$Dict$Pure m a) → m a → m (tBox a)
    = Λ(m : sType → sType) (a : sType). λ($dMonad' : t$Dict$Monad' m) (x : tDict (t$Dict$Pure m a)).
      v\\ @(t$Dict$Pure m a) @(tDict (t$Dict$Pure m a)) @(m a → m (tBox a)) (v$fHasDictaDicta @(t$Dict$Pure m a)) (λ($dPure : t$Dict$Pure m a).
        let $co : tStM m a ~ a =
          let! c$Dict$Pure ($co{1} : tStM m a ~ a) = $dPure;
          $co{1};
        (vboxed @m @a $dMonad') ▷ sym (fun-co (refl (m a)) (app-co (refl m) (tycon-co tBox (sym ($co)))))) x

  pub val 1.vpair :: ∀(b : sType → sType) (a : sType) (c : sType) (r : sType) (m : sType → sType). (b a → b c → r) → (∀(x : sType). m x → b (tStM m x)) → tDict (t$Dict$Pure m a) → tDict (t$Dict$Pure m c) → m a → m c → r
    = Λ(b : sType → sType) (a : sType) (c : sType) (r : sType) (m : sType → sType). λ(x : b a → b c → r)
    (y : ∀(x{1} : sType). m x{1} → b (tStM m x{1})) (z : tDict (t$Dict$Pure m a)) (x1 : tDict (t$Dict$Pure m c))
    (x2 : m a) (x3 : m c).
      x (v\\ @(t$Dict$Pure m a) @(tDict (t$Dict$Pure m a)) @(b a) (v$fHasDictaDicta @(t$Dict$Pure m a)) (λ($dPure : t$Dict$Pure m a).
        let $co : tStM m a ~ a =
          let! c$Dict$Pure ($co{1} : tStM m a ~ a) = $dPure;
          $co{1};
        (y @a x2) ▷ sym (app-co (refl b) (sym ($co)))) z) (v\\ @(t$Dict$Pure m c) @(tDict (t$Dict$Pure m c)) @(b c) (v$fHasDictaDicta @(t$Dict$Pure m c)) (λ($dPure : t$Dict$Pure m c).
        let $co : tStM m c ~ c =
          let! c$Dict$Pure ($co{1} : tStM m c ~ c) = $dPure;
          $co{1};
        (y @c x3) ▷ sym (app-co (refl b) (sym ($co)))) x1)
status: pass
reason: The given c of a (c => r) argument is Pure m a only after the HasDict fundep fixes c, and the superclass StM m a ~ a of that given then proves the argument type.
