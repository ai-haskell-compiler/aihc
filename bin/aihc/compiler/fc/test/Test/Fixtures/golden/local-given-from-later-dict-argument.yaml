        $super_field0;
      y ▷ sym (app-co (refl m) (sym ($co0)))

  pub val 1.vboxed :: ∀(m : sType 2.→ sType) (a : sType). t$Dict$Monad' m 2.→ m a 2.→ m (tBox (tStM m a))
