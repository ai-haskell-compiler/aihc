---
extensions:
- PatternSynonyms
modules:
- |
  module Test (Wrapped, pattern Shown) where
  data Wrapped = Wrapped { unwrap :: Wrapped }
  pattern Shown :: Wrapped -> Wrapped
  pattern Shown x = Wrapped x
  pattern Hidden :: Wrapped -> Wrapped
  pattern Hidden x = Wrapped x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    2.tUnit :: 3.sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tWrapped :: 3.sType {
      1.cWrapped :: 1.tWrapped 3.→ 1.tWrapped
  }

  val 1.vunwrap :: 1.tWrapped 3.→ 1.tWrapped
   = λ($record : 1.tWrapped).
    case $record as ($record_scrut : 1.tWrapped) return (1.tWrapped) of {
        1.cWrapped ($field0 : 1.tWrapped) →
            $field0
