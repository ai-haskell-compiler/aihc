  val 1.v$mHidden :: ∀(rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tWrapped 3.→ (FUN @3.sLiftedRep @rep 1.tWrapped r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
