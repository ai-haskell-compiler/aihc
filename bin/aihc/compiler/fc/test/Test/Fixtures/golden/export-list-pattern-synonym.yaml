  pub val 1.v$mShown :: ∀(rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tWrapped 3.→ (FUN @3.sLiftedRep @rep 1.tWrapped r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
   = Λ(rep : 3.tRuntimeRep).
    Λ(r : 3.tTYPE rep).
      λ(x : 1.tWrapped).
        λ(y : FUN @3.sLiftedRep @rep 1.tWrapped r).
          λ(z : FUN @3.sLiftedRep @rep 2.tUnit r).
            case x as (_scrut : 1.tWrapped) return (r) of {
                1.cWrapped (x{1} : 1.tWrapped) →
