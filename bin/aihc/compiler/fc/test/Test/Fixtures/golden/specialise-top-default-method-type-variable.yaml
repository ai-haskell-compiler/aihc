  val 1.v$sfirst_0 :: ∀($t0 : sType) (a : sType). tBox $t0 a → a
    = Λ($t0 : sType) (a : sType).
      let! c$Dict$Pair ($cfirst : ∀(a{1} : sType). tBox $t0 a{1} → a{1}) (unused $cboth : ∀(a{1} : sType). tBox $t0 a{1} → tTuple2 a{1} a{1}) =
