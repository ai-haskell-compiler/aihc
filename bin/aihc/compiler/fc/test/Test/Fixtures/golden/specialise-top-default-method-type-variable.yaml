modules:
- |
  module Test (Box (..), Pair (..)) where

  class Pair f where
    first :: f a -> a
    both :: f a -> (a, a)
    both x = (first x, first x)

  data Box s a = Box a

  instance Pair (Box s) where
    first (Box x) = x
passes:
