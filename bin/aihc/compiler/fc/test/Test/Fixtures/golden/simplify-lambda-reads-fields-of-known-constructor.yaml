---
extensions:
- MagicHash
- ExistentialQuantification
modules:
- |
  module Test where

  import GHC.Prim (Int#, (+#))
  import GHC.Types (Int (..))

  data Box = Box Int#

  use :: Box -> Int# -> Int
  use (Box a) n = I# (a +# n)
  {-# NOINLINE use #-}

  -- The lambda uses the box and, after the case of the known box, its
  -- field. It reads the field from the box, so that its closure holds the
  -- box only.
  make :: Int# -> Int -> Int
  make x =
    let b = Box x
     in \(I# y) -> case b of Box z -> use b (z +# y)

  data Some = forall a. Some a Int#

  useSome :: Some -> Int# -> Int
  useSome (Some _ a) n = I# (a +# n)
  {-# NOINLINE useSome #-}

  -- A constructor with an existential type stays as it is: the case in
  -- the lambda would have to bind the existential type.
  makeSome :: Int# -> Int -> Int
  makeSome x =
    let s = Some () x
     in \(I# y) -> case s of Some _ z -> useSome s (z +# y)
passes:
- simplify
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Tuple
  scope 4 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [4.cI#] 4.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [4.cLifted, 4.cUnlifted] 4.tLevity :: sType;
    4.sLiftedRep :: tRuntimeRep;
    constructors [4.cAddrRep, 4.cBoxedRep, 4.cDoubleRep, 4.cFloatRep, 4.cInt16Rep, 4.cInt32Rep, 4.cInt64Rep, 4.cInt8Rep, 4.cIntRep, 4.cSumRep, 4.cTupleRep, 4.cVecRep, 4.cWord16Rep, 4.cWord32Rep, 4.cWord64Rep, 4.cWord8Rep, 4.cWordRep] 4.tRuntimeRep :: sType;
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    4.sType :: sType;
    constructors [3.c()] 3.tUnit :: sType;
    3.c() :: tUnit;
    4.cBoxedRep :: tLevity 4.→ tRuntimeRep;
    4.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    4.cIntRep :: tRuntimeRep;
    4.cLifted :: tLevity

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep

  pub type 1.tBox :: sType {
    pub 1.cBox :: FUN @cIntRep @sLiftedRep tInt# tBox
  }

  pub type 1.tSome :: sType {
    pub 1.cSome :: ∀(a : sType). a 4.→ FUN @cIntRep @sLiftedRep tInt# tSome
  }

  pub val 1.vuse noinline :: tBox 4.→ FUN @cIntRep @sLiftedRep tInt# tInt
    = λ(x : tBox) (y : tInt#).
      case x of {
        cBox (a : tInt#) →
          cI# (prim +# a y)
      }

  pub val 1.vmake :: FUN @cIntRep @sLiftedRep tInt# (tInt 4.→ tInt)
    = λ(x : tInt#).
      let b : tBox =
        cBox x;
      λ(x{1} : tInt).
        case b of {
          cBox (x{2} : tInt#) →
            case x{1} of {
              cI# (y : tInt#) →
                vuse b (prim +# x{2} y)
            }
        }

  pub val 1.vuseSome noinline :: tSome 4.→ FUN @cIntRep @sLiftedRep tInt# tInt
    = λ(x : tSome) (y : tInt#).
      case x of {
        cSome @(a : sType) (_pat : a) (a{1} : tInt#) →
          cI# (prim +# a{1} y)
      }

  pub val 1.vmakeSome :: FUN @cIntRep @sLiftedRep tInt# (tInt 4.→ tInt)
    = λ(x : tInt#).
      let s : tSome =
        cSome @tUnit c() x;
      λ(x{1} : tInt).
        case x{1} of {
          cI# (y : tInt#) →
            vuseSome s (prim +# x y)
        }
