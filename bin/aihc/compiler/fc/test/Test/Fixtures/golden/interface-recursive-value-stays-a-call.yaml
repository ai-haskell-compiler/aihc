---
extensions: []
scope: module
modules:
- |
  module Lib (List (..), listReverse) where

  data List a = Nil | Cons a (List a)

  listReverse :: List a -> List a -> List a
  listReverse xs acc = case xs of
    Nil -> acc
    Cons y ys -> listReverse ys (Cons y acc)
- |
  module Test (use) where
  import Lib (List (..), listReverse)

  use :: List a -> List a
  use xs = listReverse xs Nil
passes:
- inline: shrink
