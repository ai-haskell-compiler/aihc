modules:
- |
  module Test (run) where

  import GHC.Prim ((+#), (<#))
  import GHC.Types (Bool (..), Int (..), isTrue#)

  run :: Int -> Int -> Int -> Int
  run (I# s) (I# n) m =
    let step (I# k) (I# a) = I# (k +# (a +# s))
        act = step m
        go (I# i) acc = case isTrue# (i <# n) of
          True -> go (I# (i +# 1#)) (act acc)
          False -> acc
     in step m (go (I# 0#) (I# s))
