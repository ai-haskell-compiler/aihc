---
extensions:
  - MagicHash
modules:
- |
  module Test (isMinusOne) where
  import GHC.Prim (Int#, negateInt#, (==#))
  import GHC.Types (Bool (..))

  isMinusOne :: Int# -> Bool
  isMinusOne x = case x ==# negateInt# 1# of
    1# -> True
    _ -> False
passes:
- inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    ==# = 2.v==# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.visMinusOne :: FUN @cIntRep @sLiftedRep tInt# tBool
    = λ(x : tInt#).
      case prim ==# x -1#cIntRep return (tBool) of {
        1#cIntRep →
          cTrue;
        _ →
          cFalse
      }
status: pass
reason: Folding negateInt# on a literal leaves a negative Int# literal in a case alternative, which the printed program must parse back.
