modules:
- |
  module Test (isMinusOne) where
  import GHC.Prim (Int#, negateInt#, (==#))
  import GHC.Types (Bool (..))

  isMinusOne :: Int# -> Bool
  isMinusOne x = case x ==# negateInt# 1# of
    1# -> True
    _ -> False
inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tBool :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cFalse :: 3.tBool;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    3.cTrue :: 3.tBool

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.visMinusOne :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tBool
   = λ(x : 2.tInt#).
    case x as (_scrut : 2.tInt#) return (3.tBool) of {
        -1#3.cIntRep →
