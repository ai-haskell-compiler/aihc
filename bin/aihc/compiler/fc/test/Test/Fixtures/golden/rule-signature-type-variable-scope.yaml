extensions:
- ScopedTypeVariables
modules:
- |
  {-# LANGUAGE ScopedTypeVariables #-}
  module Test where
  class Trav p where
    wander :: p a -> p (f a)
  class Ap g where
    pureA :: a -> g a
  class Cont f where
    size :: f a -> f a
  newtype Star g a = Star (a -> g a)
  instance Ap g => Trav (Star g) where
    wander (Star _) = Star (\_ -> pureA undefined)
  traversed :: (Trav p, Cont f) => p a -> p (f a)
  traversed = wander
  undefined :: a
  undefined = undefined
  {-# RULES
  "traversed/Star" forall (o :: Star g a). traversed o = wander o :: Cont f => Star g (f a)
    #-}
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.t$Dict$Trav (p : sType → sType) :: sType {
    pub 1.c$Dict$Trav :: ∀(p : sType → sType). (∀(a : sType) (f : sType → sType). p a → p (f a)) → t$Dict$Trav p
  }

  pub type 1.t$Dict$Ap (g : sType → sType) :: sType {
    pub 1.c$Dict$Ap :: ∀(g : sType → sType). (∀(a : sType). a → g a) → t$Dict$Ap g
  }

  pub type 1.t$Dict$Cont (f : sType → sType) :: sType {
    pub 1.c$Dict$Cont :: ∀(f : sType → sType). (∀(a : sType). f a → f a) → t$Dict$Cont f
  }

  pub type 1.tStar (g : sType → sType) (a : sType) :: sType {}

  axiom 1.$ax$Star (g : sType → sType) (a : sType) : tStar g a ~R a → g a

  pub val 1.vwander :: ∀(p : sType → sType) (a : sType) (f : sType → sType). t$Dict$Trav p → p a → p (f a)
    = Λ(p : sType → sType) (a : sType) (f : sType → sType). λ($dTrav : t$Dict$Trav p).
      let! c$Dict$Trav ($cwander : ∀(a{1} : sType) (f{1} : sType → sType). p a{1} → p (f{1} a{1})) = $dTrav;
      $cwander @a @f

  pub val 1.vpureA :: ∀(g : sType → sType) (a : sType). t$Dict$Ap g → a → g a
    = Λ(g : sType → sType) (a : sType). λ($dAp : t$Dict$Ap g).
      let! c$Dict$Ap ($cpureA : ∀(a{1} : sType). a{1} → g a{1}) = $dAp;
      $cpureA @a

  pub val 1.vsize :: ∀(f : sType → sType) (a : sType). t$Dict$Cont f → f a → f a
    = Λ(f : sType → sType) (a : sType). λ($dCont : t$Dict$Cont f).
      let! c$Dict$Cont ($csize : ∀(a{1} : sType). f a{1} → f a{1}) = $dCont;
      $csize @a

  pub val 1.v$fTravStarg :: ∀(g : sType → sType). t$Dict$Ap g → t$Dict$Trav (tStar g)
    = Λ(g : sType → sType). λ($dAp : t$Dict$Ap g).
      c$Dict$Trav @(tStar g) (v$fTravStarg$cwander @g $dAp)

  val 1.v$fTravStarg$cwander :: ∀(g : sType → sType). t$Dict$Ap g → (∀(a : sType) (f : sType → sType). tStar g a → tStar g (f a))
    = Λ(g : sType → sType). λ($dAp : t$Dict$Ap g). Λ(a : sType) (f : sType → sType). λ(unused x : tStar g a).
      (λ(unused _pat : f a).
        vpureA @g @(f a) $dAp (vundefined @(f a))) ▷ sym (axiom-co $ax$Star @g @(f a))

  pub val 1.vtraversed :: ∀(p : sType → sType) (f : sType → sType) (a : sType). t$Dict$Trav p → t$Dict$Cont f → p a → p (f a)
    = Λ(p : sType → sType) (f : sType → sType) (a : sType). λ($dTrav : t$Dict$Trav p) (unused $dCont : t$Dict$Cont f).
      vwander @p @a @f $dTrav

  pub val 1.vundefined :: ∀(a : sType). a
    = Λ(a : sType).
      vundefined @a

  rule "traversed/Star" Λ(a : sType → sType). Λ(b : sType). Λ(c : sType → sType). λ($dTrav : t$Dict$Trav (tStar a)). λ($dCont : t$Dict$Cont c). λ(o : tStar a b).
    vtraversed @(tStar a) @c @b $dTrav $dCont o
   = (Λ(f : sType → sType). λ(unused $dCont{1} : t$Dict$Cont f).
    vwander @(tStar a) @b @f $dTrav o) @c $dCont
   :: tStar a (c b)
status: pass
reason: 'The type variables g and a of the binder signature o :: Star g a scope over the whole rule, as in GHC. Thus, the g of the expression signature on the right-hand side is the same variable, and the rule quantifies the dictionary Trav (Star g). Before the fix, the expression signature bound a new g, and the wanted Trav (Star g) was unsolved.'
