extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test where
  import GHC.Prim (Int#)
  import GHC.Types (Int (..))
  boxed :: Int# -> Int
  boxed _ = I# 7#
  unboxed :: Int# -> (# Int#, Int# #)
  unboxed _ = (# 1#, 2# #)
passes:
- lift-constants
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.tTuple2# :: ∀(r1 : 3.tRuntimeRep) (r2 : 3.tRuntimeRep) (a1 : 3.tTYPE r1) (a2 : 3.tTYPE r2). 3.tTYPE (3.cTupleRep (3.c: 3.tRuntimeRep r1 (3.c: 3.tRuntimeRep r2 (3.c[] 3.tRuntimeRep))));
    3.sType :: 3.sType;
    3.t[] :: ∀(a : 3.sType). 3.sType;
    3.c: :: ∀(a : 3.sType). a 3.→ 3.t[] a 3.→ 3.t[] a;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    unboxed-tuple 3.cTuple2# :: ∀(r1 : 3.tRuntimeRep) (r2 : 3.tRuntimeRep) (a1 : 3.tTYPE r1) (a2 : 3.tTYPE r2). FUN @r1 @3.sLiftedRep a1 (FUN @r2 @(3.cTupleRep (3.c: 3.tRuntimeRep r1 (3.c: 3.tRuntimeRep r2 (3.c[] 3.tRuntimeRep)))) a2 (3.tTuple2# r1 r2 a1 a2));
    3.cTupleRep :: 3.t[] 3.tRuntimeRep 3.→ 3.tRuntimeRep;
    3.c[] :: ∀(a : 3.sType). 3.t[] a

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub val 1.vboxed :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt
   = λ(x : 2.tInt#).
    1.vboxed$constant$0

  pub val 1.vunboxed :: FUN @3.cIntRep @(3.cTupleRep (3.c: 3.tRuntimeRep 3.cIntRep (3.c: 3.tRuntimeRep 3.cIntRep (3.c[] 3.tRuntimeRep)))) 2.tInt# (3.tTuple2# 3.cIntRep 3.cIntRep 2.tInt# 2.tInt#)
   = λ(x : 2.tInt#).
    3.cTuple2# @3.cIntRep @3.cIntRep @2.tInt# @2.tInt# 1#3.cIntRep 2#3.cIntRep

  val 1.vboxed$constant$0 noinline :: 3.tInt
   = 3.cI# 7#3.cIntRep
status: pass
reason: An unboxed tuple cannot become a top-level lazy constant.
