                  _ →
                      x{1}
              }) ▷ sym (axiom-co 1.$ax$Eff @3.tInt))

  pub val 1.vother :: 3.tInt 3.→ 1.tEff 3.tInt
   = λ(x : 3.tInt).
    (λ(s : 2.tState# 2.tRealWorld).
      case x as (_scrut : 3.tInt) return (3.tInt) of {
          3.cI# (_pat : 2.tInt#) →
              case _pat as (_scrut{1} : 2.tInt#) return (3.tInt) of {
                  0#3.cIntRep →
                      x;
                  1#3.cIntRep →
