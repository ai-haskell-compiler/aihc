  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tEff (a : sType) :: sType {}

  axiom 1.$ax$Eff (a : sType) : tEff a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tState# tRealWorld) a

  type 1.t$Dict$Guard (f : sType 3.→ sType) :: sType {
    1.c$Dict$Guard :: ∀(f : sType 3.→ sType). (tInt 3.→ tInt 3.→ tInt 3.→ f tInt) 3.→ t$Dict$Guard f
  }

  pub val 1.v$fGuardEff :: t$Dict$Guard tEff
    = c$Dict$Guard @tEff v$fGuardEff$cguard

  val 1.v$fGuardEff$cguard inline [1] :: tInt 3.→ tInt 3.→ tInt 3.→ tEff tInt
    = λ(x : tInt) (y : tInt) (z : tInt).
      (λ(s : tState# tRealWorld).
        case z of {
