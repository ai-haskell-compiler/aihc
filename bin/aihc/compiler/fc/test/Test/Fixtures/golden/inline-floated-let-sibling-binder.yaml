status: pass
reason: The growing pass copies guard into the action, which turns its right-hand side into a lambda under the let named eta, and floats that let out over the body. The action then moves to its one call under the lambda binder named eta. The floated binder gets a fresh name first, so the location still names the floated binding and not the state token.
