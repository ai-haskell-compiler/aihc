---
extensions: []
modules:
- |
  module Test where
  data Flag = Off | On
  other x = Off
  pick 0 0 = On
  pick x _ = other x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Classes
  scope 3 = "aihc-prim" GHC.Prim
  scope 4 = "aihc-prim" GHC.Prim.Integer
  scope 5 = "aihc-prim" GHC.Prim.Num
  scope 6 = "aihc-prim" GHC.Types

  import headers
    2.t$Dict$Eq :: ∀(a : 6.sType). 6.sType;
    5.t$Dict$Num :: ∀(a : 6.sType). 6.sType;
    6.tBool :: 6.sType;
    3.tInt# :: 6.tTYPE 6.cIntRep;
    4.tInteger :: 6.sType;
    6.tLevity :: 6.sType;
    6.sLiftedRep :: 6.tRuntimeRep;
    6.tRuntimeRep :: 6.sType;
    6.tTYPE :: ∀(rep : 6.tRuntimeRep). 6.sType;
    6.sType :: 6.sType;
    2.v== :: ∀(a : 6.sType). 2.t$Dict$Eq a 6.→ a 6.→ a 6.→ 6.tBool;
    6.cBoxedRep :: 6.tLevity 6.→ 6.tRuntimeRep;
    6.cFalse :: 6.tBool;
    4.cIS :: FUN @6.cIntRep @6.sLiftedRep 3.tInt# 4.tInteger;
    6.cIntRep :: 6.tRuntimeRep;
    6.cLifted :: 6.tLevity;
    6.cTrue :: 6.tBool;
    5.vfromInteger :: ∀(a : 6.sType). 5.t$Dict$Num a 6.→ 4.tInteger 6.→ a

  import synonyms
    6.sLiftedRep = 6.cBoxedRep 6.cLifted;
    6.sType = 6.tTYPE 6.sLiftedRep

  pub type 1.tFlag :: 6.sType {
      pub 1.cOff :: 1.tFlag;
      pub 1.cOn :: 1.tFlag
  }

  pub val 1.vother :: ∀(a : 6.sType). a 6.→ 1.tFlag
   = Λ(a : 6.sType).
    λ(x : a).
      1.cOff

  pub val 1.vpick :: ∀(a : 6.sType) (b : 6.sType). 2.t$Dict$Eq b 6.→ 5.t$Dict$Num b 6.→ 2.t$Dict$Eq a 6.→ 5.t$Dict$Num a 6.→ a 6.→ b 6.→ 1.tFlag
   = Λ(a : 6.sType).
    Λ(b : 6.sType).
      λ($d0 : 2.t$Dict$Eq b).
        λ($d1 : 5.t$Dict$Num b).
          λ($d2 : 2.t$Dict$Eq a).
            λ($d3 : 5.t$Dict$Num a).
              λ(x : a).
                λ(y : b).
                  let {
                      _fail : 1.tFlag =
                          1.vother @a x
                  } in
                      case 2.v== @a $d2 x (5.vfromInteger @a $d3 (4.cIS 0#6.cIntRep)) as (_case_guard : 6.tBool) return (1.tFlag) of {
                          6.cTrue →
                              case 2.v== @b $d0 y (5.vfromInteger @b $d1 (4.cIS 0#6.cIntRep)) as (_case_guard{1} : 6.tBool) return (1.tFlag) of {
                                  6.cTrue →
                                      1.cOn;
                                  6.cFalse →
                                      _fail
                              };
                          6.cFalse →
                              _fail
                      }
status: pass
reason: Every literal test of a row names one failure binding.
