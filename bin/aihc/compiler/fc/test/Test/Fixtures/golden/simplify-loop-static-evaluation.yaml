---
extensions:
- BangPatterns
- MagicHash
modules:
- |
  module Test (member) where

  import GHC.Prim ((==#))
  import GHC.Types (Bool (..), Int (..))

  same :: Int -> Int -> Bool
  same a b = case a of
    I# x -> case b of
      I# y -> case x ==# y of
        1# -> True
        _ -> False
  {-# NOINLINE same #-}

  member :: Int -> [Int] -> Bool
  member key values = go key values
    where
      go !k ys = case ys of
        [] -> False
        y : rest -> case same k y of
          True -> True
          False -> go k rest
passes:
- simplify
expected: |-
