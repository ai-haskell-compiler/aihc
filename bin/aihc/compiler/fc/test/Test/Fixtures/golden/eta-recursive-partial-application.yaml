---
extensions: []
modules:
- |
  module Test (run) where

  import GHC.Types (Bool (..))

  step :: (Bool -> [Bool]) -> Bool -> [Bool]
  step rest flag = case flag of
    True -> []
    False -> flag : rest True

  run :: Bool -> [Bool]
  run start =
    let loop = step loop
     in loop start
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.c: :: ∀(a : sType). a → t[] a → t[] a;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  val 1.vstep :: (tBool → t[] tBool) → tBool → t[] tBool
    = λ(x : tBool → t[] tBool) (y : tBool).
      case y of {
        cTrue →
          c[] @tBool;
        cFalse →
          c: @tBool y (x cTrue)
      }

  pub val 1.vrun :: tBool → t[] tBool
    = λ(x : tBool).
      rec {
        loop : tBool → t[] tBool =
          λ(eta{1} : tBool).
            vstep loop eta{1}
      } in
      loop x
status: pass
reason: The local value 'loop' is a partial application of 'step' that refers to itself, so each step of the loop is a call of a partial application. The expansion makes 'loop' a function with a saturated call of 'step'.
