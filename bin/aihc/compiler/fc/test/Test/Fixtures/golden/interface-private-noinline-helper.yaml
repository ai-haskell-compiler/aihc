extensions: []
scope: module
modules:
- |
  module Lib (check) where
  import GHC.Types (Bool(..))
  check :: Bool -> Bool
  {-# INLINE check #-}
  check b = case b of
    True -> True
    False -> failure b
  failure :: Bool -> Bool
  {-# NOINLINE failure #-}
  failure b = b
- |
  module Test where
  import GHC.Types (Bool(..))
  import Lib (check)
  result :: Bool
  result = check True
