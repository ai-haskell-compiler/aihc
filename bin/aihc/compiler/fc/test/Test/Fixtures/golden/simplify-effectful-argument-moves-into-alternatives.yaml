---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (fill) where

  import GHC.Prim (Int#, MutableByteArray#, State#, writeIntArray#, (==#), (+#))

  newtype ST s a = ST (State# s -> (# State# s, a #))

  thenST :: ST s a -> ST s b -> ST s b
  thenST (ST m) (ST k) = ST (\s -> case m s of (# s1, _ #) -> k s1)
  {-# INLINE thenST #-}

  write :: MutableByteArray# s -> Int# -> ST s ()
  write m x = ST (\s -> case writeIntArray# m x 7# s of s1 -> (# s1, () #))
  {-# INLINE write #-}

  fill :: MutableByteArray# s -> Int# -> ST s () -> Int# -> ST s ()
  fill m n done = go
    where
      go x = write m x `thenST` (case x ==# n of
        1# -> done
        _ -> go (x +# 1#))
passes:
- inline: grow
- eta
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Tuple
  scope 4 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    ==# = 2.v==# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    writeIntArray# = 2.vwriteIntArray# :: ∀(a : sType). FUN @sUnliftedRep @sLiftedRep (tMutableByteArray# a) (FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# (FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c[] tRuntimeRep)) (tState# a) (tState# a))))

  import headers
    2.tInt# :: tTYPE cIntRep;
    constructors [4.cLifted, 4.cUnlifted] 4.tLevity :: sType;
    4.sLiftedRep :: tRuntimeRep;
    2.tMutableByteArray# :: ∀(d : sType). tTYPE sUnliftedRep;
    constructors [4.cVecRep, 4.cTupleRep, 4.cSumRep, 4.cBoxedRep, 4.cIntRep, 4.cInt8Rep, 4.cInt16Rep, 4.cInt32Rep, 4.cInt64Rep, 4.cWordRep, 4.cWord8Rep, 4.cWord16Rep, 4.cWord32Rep, 4.cWord64Rep, 4.cAddrRep, 4.cFloatRep, 4.cDoubleRep] 4.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [4.cTuple2#] 4.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep))));
    4.sType :: sType;
    constructors [3.c()] 3.tUnit :: sType;
    4.sUnliftedRep :: tRuntimeRep;
    constructors [4.c[], 4.c:] 4.t[] :: ∀(a : sType). sType;
    4.c: :: ∀(a : sType). a → t[] a → t[] a;
    4.cBoxedRep :: tLevity → tRuntimeRep;
    4.cIntRep :: tRuntimeRep;
    4.cLifted :: tLevity;
    4.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    4.cUnlifted :: tLevity;
    4.c[] :: ∀(a : sType). t[] a

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep;
    4.sUnliftedRep = cBoxedRep cUnlifted

  type 1.tST (s : sType) (a : sType) :: sType {}

  axiom 1.$ax$ST (s : sType) (a : sType) : tST s a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep sLiftedRep (c[] tRuntimeRep)))) (tState# s) (tTuple2# (cTupleRep (c[] tRuntimeRep)) sLiftedRep (tState# s) a)

  pub val 1.vfill :: ∀(s : sType). FUN @sUnliftedRep @sLiftedRep (tMutableByteArray# s) (FUN @cIntRep @sLiftedRep tInt# (tST s tUnit → FUN @cIntRep @sLiftedRep tInt# (tST s tUnit)))
    = Λ(s : sType). λ(x : tMutableByteArray# s) (y : tInt#) (z : tST s tUnit) (eta : tInt#).
      (λ(eta{1} : tState# s).
        rec {
          go : FUN @cIntRep @sLiftedRep tInt# (tST s tUnit) =
            λ(x{1} : tInt#).
              (λ(eta{2} : tState# s).
                case prim ==# x{1} y of {
                  1#cIntRep →
                    (z ▷ axiom-co $ax$ST @s @tUnit) (prim writeIntArray# @s x x{1} lit (7#cIntRep) :: tInt# eta{2});
                  _ →
                    ((go (prim +# x{1} lit (1#cIntRep) :: tInt#)) ▷ axiom-co $ax$ST @s @tUnit) (prim writeIntArray# @s x x{1} lit (7#cIntRep) :: tInt# eta{2})
                }) ▷ sym (axiom-co $ax$ST @s @tUnit)
        } in
        ((go eta) ▷ axiom-co $ax$ST @s @tUnit) eta{1}) ▷ sym (axiom-co $ax$ST @s @tUnit)
status: pass
reason: The loop applies a case of two alternatives to the write of the state token. The application moves into each alternative, so the recursive call takes the state token in one call and builds no closure. The case still runs before the write, and only one alternative runs, so the write runs once.
