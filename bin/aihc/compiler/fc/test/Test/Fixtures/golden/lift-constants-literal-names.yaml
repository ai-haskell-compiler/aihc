extensions:
- MagicHash
modules:
- |
  module Test where
  import GHC.Types (Char (..), Int (..))
  three :: () -> Int
  three _ = I# 3#
  alsoThree :: () -> Int
  alsoThree _ = I# 3#
  negative :: () -> Int
  negative _ = I# -1#
  minus :: () -> Char
  minus _ = C# '-'#
  letter :: () -> Char
  letter _ = C# 'a'#
passes:
- lift-constants
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Tuple
  scope 4 = "aihc-prim" GHC.Types

  import headers
    constructors [4.cC#] 4.tChar :: sType;
    2.tChar# :: tTYPE cWordRep;
    constructors [4.cI#] 4.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [4.cLifted, 4.cUnlifted] 4.tLevity :: sType;
    4.sLiftedRep :: tRuntimeRep;
    constructors [4.cAddrRep, 4.cBoxedRep, 4.cDoubleRep, 4.cFloatRep, 4.cInt16Rep, 4.cInt32Rep, 4.cInt64Rep, 4.cInt8Rep, 4.cIntRep, 4.cSumRep, 4.cTupleRep, 4.cVecRep, 4.cWord16Rep, 4.cWord32Rep, 4.cWord64Rep, 4.cWord8Rep, 4.cWordRep] 4.tRuntimeRep :: sType;
    4.tTYPE :: ∀(rep : tRuntimeRep). sType;
    4.sType :: sType;
    constructors [3.c()] 3.tUnit :: sType;
    4.cBoxedRep :: tLevity → tRuntimeRep;
    4.cC# :: tChar# → tChar;
    4.cI# :: tInt# → tInt;
    4.cIntRep :: tRuntimeRep;
    4.cLifted :: tLevity;
    4.cWordRep :: tRuntimeRep

  import synonyms
    4.sLiftedRep = cBoxedRep cLifted;
    4.sType = tTYPE sLiftedRep

  pub val 1.vthree :: tUnit → tInt
    = λ(_ : tUnit).
      v$int_3

  pub val 1.valsoThree :: tUnit → tInt
    = λ(_ : tUnit).
      v$int_3

  pub val 1.vnegative :: tUnit → tInt
    = λ(_ : tUnit).
      v$int_minus1

  pub val 1.vminus :: tUnit → tChar
    = λ(_ : tUnit).
      v$char_minus

  pub val 1.vletter :: tUnit → tChar
    = λ(_ : tUnit).
      v$char_a

  val 1.v$int_3 noinline :: tInt
    = cI# (3 :: tInt#)

  val 1.v$int_minus1 noinline :: tInt
    = cI# (-1 :: tInt#)

  val 1.v$char_minus noinline :: tChar
    = cC# ('-' :: tChar#)

  val 1.v$char_a noinline :: tChar
    = cC# ('a' :: tChar#)
status: pass
reason: A box of one literal gets a name from its value, and all its sites share it.
