modules:
- |
  module Test (count) where

  import GHC.Prim (Int#, (+#))
  import GHC.Types (Int (..))

  data Cursor = Cursor Int# Int

  count :: (Int -> Int) -> [Int] -> Int
  count f xs0 = go (Cursor 0# (I# 0#)) xs0
    where
      go cursor xs = case cursor of
        Cursor i total -> case xs of
          [] -> I# i
          y : ys -> go (Cursor (i +# 1#) (f y)) ys
