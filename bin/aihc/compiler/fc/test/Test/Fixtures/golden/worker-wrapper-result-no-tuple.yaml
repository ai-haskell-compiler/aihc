---
extensions:
- MagicHash
modules:
- |
  module Test (around) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  data Pair = Pair Int Int

  around :: Int -> Pair
  around n = case n of
    I# i -> Pair (I# (i -# 1#)) (I# (i +# 1#))
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    strict [0] 3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  type 1.tPair :: 3.sType {
      1.cPair :: 3.tInt 3.→ 3.tInt 3.→ 1.tPair
  }

  pub val 1.varound inline :: 3.tInt 3.→ 1.tPair
   = λ(x : 3.tInt).
    case x as (wrapped : 3.tInt) return (1.tPair) of {
        3.cI# (x{1} : 2.tInt#) →
            1.v$waround x{1}
    }

  val 1.v$waround :: FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# 1.tPair
   = λ(x : 2.tInt#).
    let {
        argument : 2.tInt# =
            foreign {prim 2.v-# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} x 1#3.cIntRep
    } in
        let {
            argument{1} : 2.tInt# =
                foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} x 1#3.cIntRep
        } in
            1.cPair (3.cI# argument) (3.cI# argument{1})
status: pass
reason: The program does not have the unboxed pair type, so the worker returns the Pair as it is. It still takes the Int# field of its parameter.
