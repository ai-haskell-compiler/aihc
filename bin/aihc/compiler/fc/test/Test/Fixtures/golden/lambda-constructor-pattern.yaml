extensions: []
modules:
  - |
    module Test where
    data Pair = Pair Bool Bool
    data Bool = True | False
    swap = \(Pair left right) -> Pair right left
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tPair :: 2.tType {
      pub 1.vPair :: 1.tBool 2.→ 1.tBool 2.→ 1.tPair
  }

  pub type 1.tBool :: 2.tType {
      pub 1.vTrue :: 1.tBool;
      pub 1.vFalse :: 1.tBool
  }

  pub val 1.vswap :: 1.tPair 2.→ 1.tPair
   = λ(x : 1.tPair).
    case x as (_scrut : 1.tPair) return (1.tPair) of {
        1.vPair (left : 1.tBool) (right : 1.tBool) →
            1.vPair right left
    }
