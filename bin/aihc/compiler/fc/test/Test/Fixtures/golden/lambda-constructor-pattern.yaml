    module Test where
    data Pair = Pair Bool Bool
    data Bool = True | False
    swap = \(Pair left right) -> Pair right left
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tPair :: 2.sType {
      pub 1.cPair :: 1.tBool 2.→ 1.tBool 2.→ 1.tPair
  }

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub val 1.vswap :: 1.tPair 2.→ 1.tPair
   = λ(x : 1.tPair).
    case x as (_scrut : 1.tPair) return (1.tPair) of {
        1.cPair (left : 1.tBool) (right : 1.tBool) →
            1.cPair right left
