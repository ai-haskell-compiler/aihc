- |
  module Test (allTrue) where
  import GHC.Types (Bool (..))

  go :: [Bool] -> Bool
  go xs = case xs of
    [] -> True
    (b : rest) -> case b of
      True -> go rest
      False -> False

  allTrue :: [Bool] -> Bool
  allTrue xs = go xs
