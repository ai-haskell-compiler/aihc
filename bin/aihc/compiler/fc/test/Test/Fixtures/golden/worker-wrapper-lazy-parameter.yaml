  val 1.v$wpick :: FUN @(cBoxedRep cLifted) @(cBoxedRep cLifted) tBool (FUN @(cBoxedRep cLifted) @cIntRep tInt tInt#)
    = λ(x : tBool) (y : tInt).
      case x as (_scrut : tBool) return (tInt#) of {
