extensions: [PolyKinds, RankNTypes, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE PolyKinds, RankNTypes, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Maybe a = Nothing | Just a
    data Proxy (a :: k) = Proxy
    invoke :: (forall k (a :: k). Proxy a -> Bool) -> Bool
    invoke continuation = continuation (Proxy :: Proxy Maybe)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub type 1.tMaybe (a : sType) :: sType {
    pub 1.cNothing :: ∀(a : sType). tMaybe a;
    pub 1.cJust :: ∀(a : sType). a 2.→ tMaybe a
  }

  pub type 1.tProxy (k : sType) (a : k) :: sType {
    pub 1.cProxy :: ∀(k : sType) (a : k). tProxy k a
  }

  pub val 1.vinvoke :: (∀(k : sType) (a : k). tProxy k a 2.→ tBool) 2.→ tBool
    = λ(x : ∀(k : sType) (a : k). tProxy k a 2.→ tBool).
      x @(tTYPE (cBoxedRep cLifted) 2.→ tTYPE (cBoxedRep cLifted)) @tMaybe (cProxy @(tTYPE (cBoxedRep cLifted) 2.→ tTYPE (cBoxedRep cLifted)) @tMaybe)
status: pass
reason: A higher-rank call instantiates each type variable at its declared kind.
