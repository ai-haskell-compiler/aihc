extensions: [PolyKinds, RankNTypes, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE PolyKinds, RankNTypes, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Maybe a = Nothing | Just a
    data Proxy (a :: k) = Proxy
    invoke :: (forall k (a :: k). Proxy a -> Bool) -> Bool
    invoke continuation = continuation (Proxy :: Proxy Maybe)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tMaybe (a : 2.sType) :: 2.sType {
      pub 1.cNothing :: ∀(a : 2.sType). 1.tMaybe a;
      pub 1.cJust :: ∀(a : 2.sType). a 2.→ 1.tMaybe a
  }

  pub type 1.tProxy (k : 2.sType) (a : k) :: 2.sType {
      pub 1.cProxy :: ∀(k : 2.sType) (a : k). 1.tProxy k a
  }

  pub val 1.vinvoke :: (∀(k : 2.sType) (a : k). 1.tProxy k a 2.→ 1.tBool) 2.→ 1.tBool
   = λ(x : ∀(k : 2.sType) (a : k). 1.tProxy k a 2.→ 1.tBool).
    x @(2.tTYPE (2.cBoxedRep 2.cLifted) 2.→ 2.tTYPE (2.cBoxedRep 2.cLifted)) @1.tMaybe (1.cProxy @(2.tTYPE (2.cBoxedRep 2.cLifted) 2.→ 2.tTYPE (2.cBoxedRep 2.cLifted)) @1.tMaybe)
status: pass
reason: A higher-rank call instantiates each type variable at its declared kind.
