extensions:
  - UnboxedTuples
modules:
  - |
    module Test where

    import GHC.Prim (seq)

    data Bool = False | True
    data Unit = Unit

    seq0Lifted :: Unit -> Bool -> Bool
    seq0Lifted = seq

    seq1Lifted :: Bool -> Bool
    seq1Lifted = seq Unit

    seq1Unboxed :: (# #) -> (# #)
    seq1Unboxed = seq Unit

    seq2Lifted :: Bool
    seq2Lifted = seq Unit True

    seq2Unboxed :: Unit -> (# #)
    seq2Unboxed value = seq value (# #)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.cTuple0#] 2.tTuple0# :: tTYPE (cTupleRep (c[] tRuntimeRep));
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity;
    unboxed-tuple 2.cTuple0# :: tTuple0#;
    2.cTupleRep :: t[] tRuntimeRep 2.→ tRuntimeRep;
    2.c[] :: ∀(a : sType). t[] a

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cFalse :: tBool;
    pub 1.cTrue :: tBool
  }

  pub type 1.tUnit :: sType {
    pub 1.cUnit :: tUnit
  }

  pub val 1.vseq0Lifted :: tUnit 2.→ tBool 2.→ tBool
    = λ(seq_first : tUnit) (seq_second : tBool).
      case seq_first of {
        _ →
          seq_second
      }

  pub val 1.vseq1Lifted :: tBool 2.→ tBool
    = (λ(seq_first : tUnit) (seq_second : tBool).
      case seq_first of {
        _ →
          seq_second
      }) cUnit

  pub val 1.vseq1Unboxed :: FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c[] tRuntimeRep)) tTuple0# tTuple0#
    = (λ(seq_first : tUnit) (seq_second : tTuple0#).
      case seq_first of {
        _ →
          seq_second
      }) cUnit

  pub val 1.vseq2Lifted :: tBool
    = (λ(seq_first : tUnit) (seq_second : tBool).
      case seq_first of {
        _ →
          seq_second
      }) cUnit cTrue

  pub val 1.vseq2Unboxed :: FUN @sLiftedRep @(cTupleRep (c[] tRuntimeRep)) tUnit tTuple0#
    = λ(x : tUnit).
