    Λ(a : 3.tTYPE r).
      λ($d0 : 1.tMessage).
        foreign {prim 2.vraise# :: ∀(r{1} : 3.tRuntimeRep) (a{1} : 3.sType) (b : 3.tTYPE r{1}). FUN @3.sLiftedRep @r{1} a{1} b} @r @1.tMessage @a $d0

