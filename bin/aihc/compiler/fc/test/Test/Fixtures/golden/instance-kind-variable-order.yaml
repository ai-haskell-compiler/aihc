  scope 1 = "" Test
  scope 2 = "" Type.Reflection.Internal
  scope 3 = "aihc-prim" GHC.Types

  import headers
    2.t$Dict$Typeable :: ∀(k : 3.tType) (a : k). 3.tType;
    3.tLevity :: 3.tType;
    3.tLiftedRep :: 3.tRuntimeRep;
