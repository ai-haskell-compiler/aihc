extensions:
- PolyKinds
- KindSignatures
- ScopedTypeVariables
- FlexibleInstances
modules:
- |
  module Type.Reflection.Internal where
  import GHC.Types (Type)
  data TypeRep (a :: k) = TypeRep
  class Typeable (a :: k) where
    typeRep :: TypeRep a
- |
  module Test where
  import GHC.Types (Type)
  import Type.Reflection.Internal
  data Unit = Unit
  class Binary a where
    put :: a -> Unit
  instance Typeable a => Binary (TypeRep (a :: k)) where
    put _ = Unit
