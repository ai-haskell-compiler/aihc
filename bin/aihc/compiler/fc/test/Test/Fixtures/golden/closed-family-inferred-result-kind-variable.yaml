extensions:
  - DataKinds
  - PolyKinds
  - TypeFamilies
  - KindSignatures
modules:
  - |
    {-# LANGUAGE DataKinds, PolyKinds, TypeFamilies, KindSignatures #-}
    module Test where
    import GHC.Types (Type)
    type family Snd (a :: (k1, k2)) where
      Snd '(x, y) = y
    data S = S
    newtype F (t :: (S, Type)) = F (Snd t)
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cVecRep, 3.cTupleRep, 3.cSumRep, 3.cBoxedRep, 3.cIntRep, 3.cInt8Rep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cWordRep, 3.cWord8Rep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cAddrRep, 3.cFloatRep, 3.cDoubleRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [2.c(,)] 2.tTuple2 :: ∀(a1 : sType) (a2 : sType). sType;
    3.sType :: sType;
    2.c(,) :: ∀(a1 : sType) (a2 : sType). a1 → a2 → tTuple2 a1 a2;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tSnd (k1 : sType) (k2 : sType) (a : tTuple2 k1 k2) :: k2 @N @N @N {}

  axiom 1.$ax$Snd$0 (k1 : sType) (k2 : sType) (x : k1) (y : k2) : tSnd k1 k2 (c(,) k1 k2 x y) ~N y

  pub type 1.tS :: sType {
    pub 1.cS :: tS
  }

  pub type 1.tF (t : tTuple2 tS sType) :: sType {}

  axiom 1.$ax$F (t : tTuple2 tS sType) : tF t ~R tSnd tS sType t
