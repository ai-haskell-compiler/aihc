extensions: []
modules:
- |
  module Test (build) where
  import GHC.Types (Bool)

  data Stream = Stream Bool Stream

  build :: Bool -> Stream
  build flag = let stream = Stream flag (step stream) in stream

  step :: Stream -> Stream
  step stream = case stream of Stream flag _ -> normalize flag

  normalize :: Bool -> Stream
  normalize flag = build flag
  {-# NOINLINE normalize #-}
