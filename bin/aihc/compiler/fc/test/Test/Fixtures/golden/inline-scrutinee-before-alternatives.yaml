---
extensions: []
modules:
- |
  module Test (opaque, wrap, use) where
  import GHC.Types (Bool (..))

  opaque :: Bool -> Bool
  opaque x = opaque x

  wrap :: Bool -> Bool
  wrap x = opaque (opaque x)

  use :: Bool -> Bool
  use x = case wrap x of
    True -> wrap x
    False -> x
passes:
- inline:
    policy: grow
    site-limit: 2
    discount: 0
    value-growth: 0
    value-slack: 2
    rounds: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub val 1.vopaque :: tBool 2.→ tBool
    = λ(x : tBool).
      vopaque x

  pub val 1.vwrap :: tBool 2.→ tBool
    = λ(x : tBool).
      vopaque (vopaque x)

  pub val 1.vuse :: tBool 2.→ tBool
    = λ(x : tBool).
      case vopaque (vopaque x) of {
        cTrue →
          vwrap x;
        cFalse →
          x
      }
status: pass
reason: |-
  The scrutinee uses the available growth before its alternatives.
  The call in the True alternative stays when no growth remains.
