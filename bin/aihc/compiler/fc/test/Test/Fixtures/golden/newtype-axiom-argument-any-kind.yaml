extensions:
  - DataKinds
  - KindSignatures
modules:
  - |
    module Test where
    import GHC.Types (Type)
    data Nat = Z | S Nat
    newtype ListN (n :: Nat) a = ListN { unListN :: [a] }
    newtype Tagged (v :: Type -> Type) a = Tagged { unTagged :: a }
    retag :: ListN n a -> ListN m a
    retag xs = ListN (unListN xs)
    rewrap :: Tagged u a -> Tagged v a
    rewrap (Tagged x) = Tagged x
    useRewrap :: Tagged u a -> Tagged w a
    useRewrap t = rewrap (rewrap t)
    inner :: ListN n a -> [a]
    inner xs = unListN (ListN (unListN xs))
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tAny :: ∀(k : sType). k;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tNat :: sType {
    pub 1.cZ :: tNat;
    pub 1.cS :: tNat 2.→ tNat
  }

  pub type 1.tListN (n : tNat) (a : sType) :: sType {}

  axiom 1.$ax$ListN (n : tNat) (a : sType) : tListN n a ~R t[] a

  pub type 1.tTagged (v : sType 2.→ sType) (a : sType) :: sType {}

  axiom 1.$ax$Tagged (v : sType 2.→ sType) (a : sType) : tTagged v a ~R a

  pub val 1.vunListN :: ∀(n : tNat) (a : sType). tListN n a 2.→ t[] a
    = Λ(n : tNat) (a : sType). λ($record : tListN n a).
      $record ▷ axiom-co $ax$ListN @n @a

  pub val 1.vunTagged :: ∀(v : sType 2.→ sType) (a : sType). tTagged v a 2.→ a
    = Λ(v : sType 2.→ sType) (a : sType). λ($record : tTagged v a).
      $record ▷ axiom-co $ax$Tagged @v @a

  pub val 1.vretag :: ∀(n : tNat) (a : sType) (m : tNat). tListN n a 2.→ tListN m a
    = Λ(n : tNat) (a : sType) (m : tNat). λ(x : tListN n a).
      (vunListN @n @a x) ▷ sym (axiom-co $ax$ListN @m @a)

  pub val 1.vrewrap :: ∀(u : sType 2.→ sType) (a : sType) (v : sType 2.→ sType). tTagged u a 2.→ tTagged v a
    = Λ(u : sType 2.→ sType) (a : sType) (v : sType 2.→ sType). λ(x : tTagged u a).
      (x ▷ axiom-co $ax$Tagged @u @a) ▷ sym (axiom-co $ax$Tagged @v @a)

  pub val 1.vuseRewrap :: ∀(u : sType 2.→ sType) (a : sType) (w : sType 2.→ sType). tTagged u a 2.→ tTagged w a
    = Λ(u : sType 2.→ sType) (a : sType) (w : sType 2.→ sType). λ(x : tTagged u a).
      vrewrap @(tAny (tTYPE (cBoxedRep cLifted) 2.→ tTYPE (cBoxedRep cLifted))) @a @w (vrewrap @u @a @(tAny (tTYPE (cBoxedRep cLifted) 2.→ tTYPE (cBoxedRep cLifted))) x)

  pub val 1.vinner :: ∀(n : tNat) (a : sType). tListN n a 2.→ t[] a
    = Λ(n : tNat) (a : sType). λ(x : tListN n a).
      vunListN @(tAny tNat) @a ((vunListN @n @a x) ▷ sym (axiom-co $ax$ListN @(tAny tNat) @a))
status: pass
reason: A newtype parameter of a kind other than Type that nothing determines becomes Any at
  that kind in the wrap coercion, as it does in a type application, and the lint accepts it.
