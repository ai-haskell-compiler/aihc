---
extensions: []
modules:
- |
  module Test (run) where
  import GHC.Types (Bool (..))

  class Base f where
    base :: f -> f

  class Base f => Derived f where
    derived :: f -> f

  newtype Wrap m = Wrap m

  instance Base m => Base (Wrap m) where
    base (Wrap x) = Wrap (base x)

  instance Derived m => Derived (Wrap m) where
    derived (Wrap x) = Wrap (derived x)

  instance Base Bool where
    base b = case b of
      True -> False
      False -> True

  instance Derived Bool where
    derived b = b

  twice :: Derived f => f -> f
  twice x = base (derived x)

  run :: Wrap Bool -> Wrap Bool
  run x = twice x
passes:
- inline: shrink
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cVecRep, 2.cTupleRep, 2.cSumRep, 2.cBoxedRep, 2.cIntRep, 2.cInt8Rep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cWordRep, 2.cWord8Rep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cAddrRep, 2.cFloatRep, 2.cDoubleRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity → tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  type 1.t$Dict$Base (f : sType) :: sType {
    1.c$Dict$Base :: ∀(f : sType). (f → f) → t$Dict$Base f
  }

  type 1.t$Dict$Derived (f : sType) :: sType {
    1.c$Dict$Derived :: ∀(f : sType). t$Dict$Base f → (f → f) → t$Dict$Derived f
  }

  type 1.tWrap (m : sType) :: sType {}

  axiom 1.$ax$Wrap (m : sType) : tWrap m ~R m

  pub val 1.v$fBaseWrapm :: ∀(m : sType). t$Dict$Base m → t$Dict$Base (tWrap m)
    = Λ(m : sType). λ($dBase : t$Dict$Base m).
      c$Dict$Base @(tWrap m) (v$fBaseWrapm$cbase @m $dBase)

  val 1.v$fBaseWrapm$cbase :: ∀(m : sType). t$Dict$Base m → tWrap m → tWrap m
    = Λ(m : sType). λ($dBase : t$Dict$Base m) (x : tWrap m).
      let! c$Dict$Base ($cbase : m → m) = $dBase;
      ($cbase (x ▷ axiom-co $ax$Wrap @m)) ▷ sym (axiom-co $ax$Wrap @m)

  pub val 1.v$fDerivedWrapm :: ∀(m : sType). t$Dict$Derived m → t$Dict$Derived (tWrap m)
    = Λ(m : sType). λ($dDerived : t$Dict$Derived m).
      c$Dict$Derived @(tWrap m) (v$fBaseWrapm @m (let! c$Dict$Derived ($dBase : t$Dict$Base m) (unused $cderived : m → m) =
        $dDerived;
      $dBase)) (v$fDerivedWrapm$cderived @m $dDerived)

  val 1.v$fDerivedWrapm$cderived :: ∀(m : sType). t$Dict$Derived m → tWrap m → tWrap m
    = Λ(m : sType). λ($dDerived : t$Dict$Derived m) (x : tWrap m).
      let! c$Dict$Derived (unused $dBase : t$Dict$Base m) ($cderived : m → m) = $dDerived;
      ($cderived (x ▷ axiom-co $ax$Wrap @m)) ▷ sym (axiom-co $ax$Wrap @m)

  pub val 1.v$fBaseBool :: t$Dict$Base tBool
    = c$Dict$Base @tBool v$fBaseBool$cbase

  val 1.v$fBaseBool$cbase :: tBool → tBool
    = λ(x : tBool).
      case x of {
        cTrue →
          cFalse;
        cFalse →
          cTrue
      }

  pub val 1.v$fDerivedBool :: t$Dict$Derived tBool
    = c$Dict$Derived @tBool v$fBaseBool v$fDerivedBool$cderived

  val 1.v$fDerivedBool$cderived :: tBool → tBool
    = λ(x : tBool).
      x

  pub val 1.vrun :: tWrap tBool → tWrap tBool
    = λ(x : tWrap tBool).
      (v$fBaseBool$cbase (x ▷ axiom-co $ax$Wrap @tBool)) ▷ sym (axiom-co $ax$Wrap @tBool)
status: pass
reason: The instance of 'Derived' for 'Wrap m' builds its 'Base' field from the superclass that it selects out of its argument. The case on the dictionary call still selects that field, so the shrinking inliner resolves both methods of 'twice' to the instance methods for 'Bool'.
