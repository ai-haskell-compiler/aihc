- MagicHash
modules:
- |
  module Test (action) where

  import GHC.Prim (RealWorld, State#)
  import GHC.Types (Int (..))

  newtype Eff a = Eff (State# RealWorld -> a)

  step :: Int -> Eff Int
  step n = Eff (\s -> n)

  action :: Eff Int
  action = step (I# 3#)
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    2.tRealWorld :: sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tEff (a : sType) :: sType {}

  axiom 1.$ax$Eff (a : sType) : tEff a ~R FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (tState# tRealWorld) a

  val 1.vstep :: tInt 3.→ tEff tInt
    = λ(x : tInt).
      (λ(s : tState# tRealWorld).
          x) ▷ sym (axiom-co $ax$Eff @tInt)

  pub val 1.vaction :: tEff tInt
    = (λ(eta{1} : tState# tRealWorld).
        ((vstep (cI# 3#cIntRep)) ▷ axiom-co $ax$Eff @tInt) eta{1}) ▷ sym (axiom-co $ax$Eff @tInt)
status: pass
reason: The type of a value says nothing about its arity, but the body does. 'step' takes two arguments, one of them hidden under the newtype's coercion, so 'step n' still takes the state token, and the value is a function rather than a CAF.
