---
extensions:
- MagicHash
modules:
- |
  module Test (action) where

  import GHC.Prim (RealWorld, State#)
  import GHC.Types (Int (..))

  newtype Eff a = Eff (State# RealWorld -> a)

  step :: Int -> Eff Int
  step n = Eff (\s -> n)

  action :: Eff Int
  action = step (I# 3#)
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    2.tRealWorld :: 3.sType;
    3.tRuntimeRep :: 3.sType;
    2.tState# :: ∀(s : 3.sType). 3.tTYPE (3.cTupleRep (3.c[] 3.tRuntimeRep));
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.t[] :: ∀(a : 3.sType). 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    3.cTupleRep :: 3.t[] 3.tRuntimeRep 3.→ 3.tRuntimeRep;
    3.c[] :: ∀(a : 3.sType). 3.t[] a

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  type 1.tEff (a : 3.sType) :: 3.sType {}

  axiom 1.$ax$Eff (a : 3.sType) : 1.tEff a ~R FUN @(3.cTupleRep (3.c[] 3.tRuntimeRep)) @3.sLiftedRep (2.tState# 2.tRealWorld) a

  val 1.vstep :: 3.tInt 3.→ 1.tEff 3.tInt
   = λ(x : 3.tInt).
    (λ(s : 2.tState# 2.tRealWorld).
      x) ▷ sym (axiom-co 1.$ax$Eff @3.tInt)

  pub val 1.vaction :: 1.tEff 3.tInt
   = (λ(eta{1} : 2.tState# 2.tRealWorld).
    ((1.vstep (3.cI# 3#3.cIntRep)) ▷ axiom-co 1.$ax$Eff @3.tInt) eta{1}) ▷ sym (axiom-co 1.$ax$Eff @3.tInt)
status: pass
reason: The type of a value says nothing about its arity, but the body does. 'step' takes two arguments, one of them hidden under the newtype's coercion, so 'step n' still takes the state token, and the value is a function rather than a CAF.
