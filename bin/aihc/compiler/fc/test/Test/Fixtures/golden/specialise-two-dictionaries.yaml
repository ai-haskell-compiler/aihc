---
extensions:
- MagicHash
modules:
- |
  module Test (both) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  class Weight a where
    weight :: a -> Int

  instance Weight Bool where
    weight b = case b of
      True -> I# 1#
      False -> I# 0#

  instance Weight Int where
    weight x = x

  plus :: Int -> Int -> Int
  plus x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  both :: [Bool] -> [Int] -> Int
  both xs ys = plus (go xs (I# 0#)) (go ys (I# 0#))
    where
      go [] acc = acc
      go (y : ys) acc = go ys (plus acc (weight y))
passes:
- specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: 3.sType;
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : 3.sType). 3.sType;
    3.c: :: ∀(a : 3.sType). a 3.→ 3.t[] a 3.→ 3.t[] a;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cFalse :: 3.tBool;
    strict [0] 3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    3.cTrue :: 3.tBool;
    3.c[] :: ∀(a : 3.sType). 3.t[] a

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  type 1.t$Dict$Weight (a : 3.sType) :: 3.sType {
      1.c$Dict$Weight :: ∀(a : 3.sType). (a 3.→ 3.tInt) 3.→ 1.t$Dict$Weight a
  }

  val 1.vweight :: ∀(a : 3.sType). 1.t$Dict$Weight a 3.→ a 3.→ 3.tInt
   = Λ(a : 3.sType).
    λ($d0 : 1.t$Dict$Weight a).
      case $d0 as ($dict : 1.t$Dict$Weight a) return (a 3.→ 3.tInt) of {
          1.c$Dict$Weight ($method0 : a 3.→ 3.tInt) →
              $method0
      }

  pub val 1.v$fWeightBool :: 1.t$Dict$Weight 3.tBool
   = 1.c$Dict$Weight @3.tBool 1.v$fWeightBool$cweight

  val 1.v$fWeightBool$cweight :: 3.tBool 3.→ 3.tInt
   = λ(x : 3.tBool).
    case x as (_scrut : 3.tBool) return (3.tInt) of {
        3.cTrue →
            3.cI# 1#3.cIntRep;
        3.cFalse →
            3.cI# 0#3.cIntRep
    }

  pub val 1.v$fWeightInt :: 1.t$Dict$Weight 3.tInt
   = 1.c$Dict$Weight @3.tInt 1.v$fWeightInt$cweight

  val 1.v$fWeightInt$cweight :: 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    x

  val 1.vplus :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    λ(y : 3.tInt).
      case x as (_scrut : 3.tInt) return (3.tInt) of {
          3.cI# (a : 2.tInt#) →
              case y as (_scrut{1} : 3.tInt) return (3.tInt) of {
                  3.cI# (b : 2.tInt#) →
                      3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a b)
              }
      }

  pub val 1.vboth :: 3.t[] 3.tBool 3.→ 3.t[] 3.tInt 3.→ 3.tInt
   = λ(x : 3.t[] 3.tBool).
    λ(y : 3.t[] 3.tInt).
      rec {
          $sgo : 3.t[] 3.tBool 3.→ 3.tInt 3.→ 3.tInt =
              λ(x{1} : 3.t[] 3.tBool).
                λ(y{1} : 3.tInt).
                  case x{1} as (_scrut : 3.t[] 3.tBool) return (3.tInt) of {
                      3.c[] →
                          y{1};
                      3.c: (y{2} : 3.tBool) (ys : 3.t[] 3.tBool) →
                          $sgo ys (1.vplus y{1} (1.vweight @3.tBool 1.v$fWeightBool y{2}))
                  }
      } in
          rec {
              $sgo{1} : 3.t[] 3.tInt 3.→ 3.tInt 3.→ 3.tInt =
                  λ(x{1} : 3.t[] 3.tInt).
                    λ(y{1} : 3.tInt).
                      case x{1} as (_scrut : 3.t[] 3.tInt) return (3.tInt) of {
                          3.c[] →
                              y{1};
                          3.c: (y{2} : 3.tInt) (ys : 3.t[] 3.tInt) →
                              $sgo{1} ys (1.vplus y{1} (1.vweight @3.tInt 1.v$fWeightInt y{2}))
                      }
          } in
              1.vplus ($sgo x (3.cI# 0#3.cIntRep)) ($sgo{1} y (3.cI# 0#3.cIntRep))
status: pass
reason: The two calls of 'go' give two dictionaries, so the pass makes one copy for each and the original binding goes away.
