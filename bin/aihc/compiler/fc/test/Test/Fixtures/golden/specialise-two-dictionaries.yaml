---
extensions:
- MagicHash
modules:
- |
  module Test (both) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  class Weight a where
    weight :: a -> Int

  instance Weight Bool where
    weight b = case b of
      True -> I# 1#
      False -> I# 0#

  instance Weight Int where
    weight x = x

  plus :: Int -> Int -> Int
  plus x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  both :: [Bool] -> [Int] -> Int
  both xs ys = plus (go xs (I# 0#)) (go ys (I# 0#))
    where
      go [] acc = acc
      go (y : ys) acc = go ys (plus acc (weight y))
passes:
- specialise
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.t$Dict$Weight (a : sType) :: sType {
    1.c$Dict$Weight :: ∀(a : sType). (a 3.→ tInt) 3.→ t$Dict$Weight a
  }

  val 1.vweight :: ∀(a : sType). t$Dict$Weight a 3.→ a 3.→ tInt
    = Λ(a : sType). λ($d0 : t$Dict$Weight a).
      case $d0 of {
        c$Dict$Weight ($method0 : a 3.→ tInt) →
          $method0
      }

  pub val 1.v$fWeightBool :: t$Dict$Weight tBool
    = c$Dict$Weight @tBool v$fWeightBool$cweight

  val 1.v$fWeightBool$cweight :: tBool 3.→ tInt
    = λ(x : tBool).
      case x of {
        cTrue →
          cI# lit (1#cIntRep) :: tInt#;
        cFalse →
          cI# lit (0#cIntRep) :: tInt#
      }

  pub val 1.v$fWeightInt :: t$Dict$Weight tInt
    = c$Dict$Weight @tInt v$fWeightInt$cweight

  val 1.v$fWeightInt$cweight :: tInt 3.→ tInt
    = λ(x : tInt).
      x

  val 1.vplus :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt) (y : tInt).
      case x of {
        cI# (a : tInt#) →
          case y of {
            cI# (b : tInt#) →
              cI# (prim +# a b)
          }
      }

  pub val 1.vboth :: t[] tBool 3.→ t[] tInt 3.→ tInt
    = λ(x : t[] tBool) (y : t[] tInt).
      rec {
        $sgo : t[] tBool 3.→ tInt 3.→ tInt =
          λ(x{1} : t[] tBool) (y{1} : tInt).
            case x{1} of {
              c[] →
                y{1};
              c: (y{2} : tBool) (ys : t[] tBool) →
                $sgo ys (vplus y{1} (vweight @tBool v$fWeightBool y{2}))
            }
      } in
        rec {
          $sgo{1} : t[] tInt 3.→ tInt 3.→ tInt =
            λ(x{1} : t[] tInt) (y{1} : tInt).
              case x{1} of {
                c[] →
                  y{1};
                c: (y{2} : tInt) (ys : t[] tInt) →
                  $sgo{1} ys (vplus y{1} (vweight @tInt v$fWeightInt y{2}))
              }
        } in
          vplus ($sgo x (cI# lit (0#cIntRep) :: tInt#)) ($sgo{1} y (cI# lit (0#cIntRep) :: tInt#))
status: pass
reason: The two calls of 'go' give two dictionaries, so the pass makes one copy for each and the original binding goes away.
