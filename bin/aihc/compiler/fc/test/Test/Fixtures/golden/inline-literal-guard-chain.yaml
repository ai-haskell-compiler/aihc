---
extensions: []
modules:
- |
  {-# LANGUAGE MagicHash #-}
  {-# LANGUAGE GeneralizedNewtypeDeriving #-}
  module Test (classify) where
  import GHC.Types (Bool (..), Int (..))
  import GHC.Prim (Int#, Int32#, int32ToInt#, intToInt32#, (==#))

  class Eq a where
    (==) :: a -> a -> Bool

  data Int32 = I32# Int32#

  intEquals :: Int# -> Int# -> Bool
  intEquals a b = case a ==# b of
    0# -> False
    _ -> True

  instance Eq Int32 where
    I32# left == I32# right = intEquals (int32ToInt# left) (int32ToInt# right)

  newtype CInt = CInt Int32 deriving newtype (Eq)
  newtype Errno = Errno CInt deriving newtype (Eq)

  ePERM, eNOENT, eSRCH :: Errno
  ePERM = Errno (CInt (I32# (intToInt32# 1#)))
  eNOENT = Errno (CInt (I32# (intToInt32# 2#)))
  eSRCH = Errno (CInt (I32# (intToInt32# 3#)))

  classify :: Errno -> Int
  classify errno
    | errno == ePERM = I# 10#
    | errno == eNOENT = I# 20#
    | errno == eSRCH = I# 30#
    | True = I# 0#
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    ==# = 2.v==# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    int32ToInt# = 2.vint32ToInt# :: FUN @cInt32Rep @cIntRep tInt32# tInt#

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    2.tInt32# :: tTYPE cInt32Rep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cInt32Rep :: tRuntimeRep;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.t$Dict$Eq (a : sType) :: sType {
    1.c$Dict$Eq :: ∀(a : sType). (a 3.→ a 3.→ tBool) 3.→ t$Dict$Eq a
  }

  type 1.tInt32 :: sType {
    1.cI32# :: FUN @cInt32Rep @sLiftedRep tInt32# tInt32
  }

  type 1.tCInt :: sType {}

  axiom 1.$ax$CInt : tCInt ~R tInt32

  type 1.tErrno :: sType {}

  axiom 1.$ax$Errno : tErrno ~R tCInt

  pub val 1.v$fEqInt32 :: t$Dict$Eq tInt32
    = c$Dict$Eq @tInt32 v$fEqInt32$c==

  val 1.v$fEqInt32$c== :: tInt32 3.→ tInt32 3.→ tBool
    = λ(x : tInt32) (y : tInt32).
      case x as (_scrut : tInt32) return (tBool) of {
        cI32# (left : tInt32#) →
          case y as (_scrut{1} : tInt32) return (tBool) of {
            cI32# (right : tInt32#) →
              let x{1} : tInt# =
                prim int32ToInt# left;
              let y{1} : tInt# =
                prim int32ToInt# right;
              let _case : tInt# =
                prim ==# x{1} y{1};
              case _case as (_scrut{2} : tInt#) return (tBool) of {
                0#cIntRep →
                  cFalse;
                _ →
                  cTrue
              }
          }
      }

  pub val 1.v$fEqCInt :: t$Dict$Eq tCInt
    = v$fEqInt32 ▷ tycon-co t$Dict$Eq (sym (axiom-co $ax$CInt))

  pub val 1.v$fEqErrno :: t$Dict$Eq tErrno
    = (v$fEqInt32 ▷ tycon-co t$Dict$Eq (sym (axiom-co $ax$CInt))) ▷ tycon-co t$Dict$Eq (sym (axiom-co $ax$Errno))

  pub val 1.vclassify :: tErrno 3.→ tInt
    = λ(x : tErrno).
      case (x ▷ axiom-co $ax$Errno) ▷ axiom-co $ax$CInt as (_scrut : tInt32) return (tInt) of {
        cI32# (left : tInt32#) →
          let x{1} : tInt# =
            prim int32ToInt# left;
          case x{1} as (_scrut{1} : tInt#) return (tInt) of {
            1#cIntRep →
              cI# 10#cIntRep;
            2#cIntRep →
              cI# 20#cIntRep;
            3#cIntRep →
              cI# 30#cIntRep;
            _ →
              cI# 0#cIntRep
          }
      }
status: pass
reason: |-
  A guard chain that compares a newtype over a boxed integer with literal constants
  becomes one case on the unboxed value.
