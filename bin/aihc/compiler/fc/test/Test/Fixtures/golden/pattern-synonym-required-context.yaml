extensions:
- PatternSynonyms
- ViewPatterns
modules:
- |
  {-# LANGUAGE PatternSynonyms, ViewPatterns #-}
  module Test where
  data Bool = True | False
  data Label = Zero | Other
  class Describe a where
    isZero :: a -> Bool
  instance Describe Bool where
    isZero False = True
    isZero True = False
  pattern IsZero :: Describe a => a
  pattern IsZero <- (isZero -> True)
  label :: Describe a => a -> Label
  label IsZero = Zero
  label _ = Other
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    2.tUnit :: 3.sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.tBool :: 3.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tLabel :: 3.sType {
      pub 1.cZero :: 1.tLabel;
      pub 1.cOther :: 1.tLabel
  }

  pub type 1.t$Dict$Describe (a : 3.sType) :: 3.sType {
      pub 1.c$Dict$Describe :: ∀(a : 3.sType). (a 3.→ 1.tBool) 3.→ 1.t$Dict$Describe a
  }

  pub val 1.visZero :: ∀(a : 3.sType). 1.t$Dict$Describe a 3.→ a 3.→ 1.tBool
   = Λ(a : 3.sType).
    λ($d0 : 1.t$Dict$Describe a).
      case $d0 as ($dict : 1.t$Dict$Describe a) return (a 3.→ 1.tBool) of {
          1.c$Dict$Describe ($method0 : a 3.→ 1.tBool) →
              $method0
      }

  pub val 1.v$fDescribeBool :: 1.t$Dict$Describe 1.tBool
   = 1.c$Dict$Describe @1.tBool 1.v$fDescribeBool$cisZero

  val 1.v$fDescribeBool$cisZero :: 1.tBool 3.→ 1.tBool
   = λ(x : 1.tBool).
    case x as (_scrut : 1.tBool) return (1.tBool) of {
        1.cFalse →
            1.cTrue;
        1.cTrue →
            1.cFalse
    }

  pub val 1.v$mIsZero :: ∀(a : 3.sType) (rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.t$Dict$Describe a 3.→ a 3.→ (FUN @3.sLiftedRep @rep 2.tUnit r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
   = Λ(a : 3.sType).
    Λ(rep : 3.tRuntimeRep).
      Λ(r : 3.tTYPE rep).
        λ($d0 : 1.t$Dict$Describe a).
          λ(x : a).
            λ(y : FUN @3.sLiftedRep @rep 2.tUnit r).
              λ(z : FUN @3.sLiftedRep @rep 2.tUnit r).
                case 1.visZero @a $d0 x as (_scrut : 1.tBool) return (r) of {
                    1.cTrue →
                        y 2.c();
                    _ →
                        z 2.c()
                }

  pub val 1.vlabel :: ∀(a : 3.sType). 1.t$Dict$Describe a 3.→ a 3.→ 1.tLabel
   = Λ(a : 3.sType).
    λ($d0 : 1.t$Dict$Describe a).
      λ(x : a).
        1.v$mIsZero @a @3.sLiftedRep @1.tLabel $d0 x (λ(_pattern_success : 2.tUnit).
          1.cZero) (λ(_pattern_failure : 2.tUnit).
          1.cOther)
status: pass
reason: The matcher of a pattern synonym with a required context takes the dictionary, and a match passes it.
