extensions:
- PatternSynonyms
- ViewPatterns
modules:
- |
  {-# LANGUAGE PatternSynonyms, ViewPatterns #-}
  module Test where
  data Bool = True | False
  data Label = Zero | Other
  class Describe a where
    isZero :: a -> Bool
  instance Describe Bool where
    isZero False = True
    isZero True = False
  pattern IsZero :: Describe a => a
  pattern IsZero <- (isZero -> True)
  label :: Describe a => a -> Label
  label IsZero = Zero
  label _ = Other
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tLabel :: 2.sType {
      pub 1.cZero :: 1.tLabel;
      pub 1.cOther :: 1.tLabel
  }

  pub type 1.t$Dict$Describe (a : 2.sType) :: 2.sType {
      pub 1.c$Dict$Describe :: ∀(a : 2.sType). (a 2.→ 1.tBool) 2.→ 1.t$Dict$Describe a
  }

  pub val 1.visZero :: ∀(a : 2.sType). 1.t$Dict$Describe a 2.→ a 2.→ 1.tBool
   = Λ(a : 2.sType).
    λ($d0 : 1.t$Dict$Describe a).
      case $d0 as ($dict : 1.t$Dict$Describe a) return (a 2.→ 1.tBool) of {
          1.c$Dict$Describe ($method0 : a 2.→ 1.tBool) →
              $method0
      }

  pub val 1.v$fDescribeBool :: 1.t$Dict$Describe 1.tBool
   = 1.c$Dict$Describe @1.tBool 1.v$fDescribeBool$cisZero

  val 1.v$fDescribeBool$cisZero :: 1.tBool 2.→ 1.tBool
   = λ(x : 1.tBool).
    case x as (_scrut : 1.tBool) return (1.tBool) of {
        1.cFalse →
            1.cTrue;
        1.cTrue →
            1.cFalse
    }

  pub val 1.v$mIsZero :: ∀(a : 2.sType) (r : 2.sType). 1.t$Dict$Describe a 2.→ a 2.→ r 2.→ r 2.→ r
   = Λ(a : 2.sType).
    Λ(r : 2.sType).
      λ($d0 : 1.t$Dict$Describe a).
        λ(x : a).
          λ(y : r).
            λ(z : r).
              case 1.visZero @a $d0 x as (_scrut : 1.tBool) return (r) of {
                  1.cTrue →
                      y;
                  _ →
                      z
              }

  pub val 1.vlabel :: ∀(a : 2.sType). 1.t$Dict$Describe a 2.→ a 2.→ 1.tLabel
   = Λ(a : 2.sType).
    λ($d0 : 1.t$Dict$Describe a).
      λ(x : a).
        1.v$mIsZero @a @1.tLabel $d0 x 1.cZero 1.cOther
status: pass
reason: The matcher of a pattern synonym with a required context takes the dictionary, and a match passes it.
