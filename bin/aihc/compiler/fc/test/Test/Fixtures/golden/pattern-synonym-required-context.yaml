extensions:
- PatternSynonyms
- ViewPatterns
modules:
- |
  {-# LANGUAGE PatternSynonyms, ViewPatterns #-}
  module Test where
  data Bool = True | False
  data Label = Zero | Other
  class Describe a where
    isZero :: a -> Bool
  instance Describe Bool where
    isZero False = True
    isZero True = False
  pattern IsZero :: Describe a => a
  pattern IsZero <- (isZero -> True)
  label :: Describe a => a -> Label
  label IsZero = Zero
  label _ = Other
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    2.c() :: tUnit;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.tBool :: sType {
    pub 1.cTrue :: tBool;
    pub 1.cFalse :: tBool
  }

  pub type 1.tLabel :: sType {
    pub 1.cZero :: tLabel;
    pub 1.cOther :: tLabel
  }

  pub type 1.t$Dict$Describe (a : sType) :: sType {
    pub 1.c$Dict$Describe :: ∀(a : sType). (a 3.→ tBool) 3.→ t$Dict$Describe a
  }

  pub val 1.visZero :: ∀(a : sType). t$Dict$Describe a 3.→ a 3.→ tBool
    = Λ(a : sType). λ($d0 : t$Dict$Describe a).
      let! c$Dict$Describe ($method0 : a 3.→ tBool) = $d0;
      $method0

  pub val 1.v$fDescribeBool :: t$Dict$Describe tBool
    = c$Dict$Describe @tBool v$fDescribeBool$cisZero

  val 1.v$fDescribeBool$cisZero :: tBool 3.→ tBool
    = λ(x : tBool).
      case x of {
        cFalse →
          cTrue;
        cTrue →
          cFalse
      }

  pub val 1.v$mIsZero :: ∀(a : sType) (rep : tRuntimeRep) (r : tTYPE rep). t$Dict$Describe a 3.→ a 3.→ (FUN @sLiftedRep @rep tUnit r) 3.→ FUN @sLiftedRep @rep (FUN @sLiftedRep @rep tUnit r) r
    = Λ(a : sType) (rep : tRuntimeRep) (r : tTYPE rep). λ($d0 : t$Dict$Describe a) (x : a)
    (y : FUN @sLiftedRep @rep tUnit r) (z : FUN @sLiftedRep @rep tUnit r).
      case visZero @a $d0 x of {
        cTrue →
          y c();
        _ →
          z c()
      }

  pub val 1.vlabel :: ∀(a : sType). t$Dict$Describe a 3.→ a 3.→ tLabel
    = Λ(a : sType). λ($d0 : t$Dict$Describe a) (x : a).
      v$mIsZero @a @sLiftedRep @tLabel $d0 x (λ(_pattern_success : tUnit).
        cZero) (λ(_pattern_failure : tUnit).
        cOther)
status: pass
reason: The matcher of a pattern synonym with a required context takes the dictionary, and a match passes it.
