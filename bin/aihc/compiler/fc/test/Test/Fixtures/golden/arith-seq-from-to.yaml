---
extensions:
- RebindableSyntax
modules:
- |
  {-# LANGUAGE RebindableSyntax #-}
  module Test where
  data Bool = False | True
  enumFromTo first lastValue = [first, lastValue]
  result :: Bool -> Bool -> [Bool]
  result start end = [start .. end]
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.t[] :: ∀(a : 2.sType). 2.sType;
    2.c: :: ∀(a : 2.sType). a 2.→ 2.t[] a 2.→ 2.t[] a;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity;
    2.c[] :: ∀(a : 2.sType). 2.t[] a

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cFalse :: 1.tBool;
      pub 1.cTrue :: 1.tBool
  }

  pub val 1.venumFromTo :: ∀(a : 2.sType). a 2.→ a 2.→ 2.t[] a
   = Λ(a : 2.sType).
    λ(x : a).
      λ(y : a).
        2.c: @a x (2.c: @a y (2.c[] @a))

  pub val 1.vresult :: 1.tBool 2.→ 1.tBool 2.→ 2.t[] 1.tBool
   = λ(x : 1.tBool).
    λ(y : 1.tBool).
      1.venumFromTo @1.tBool x y
status: pass
reason: Desugars a bounded arithmetic sequence through the resolved enumFromTo function.
