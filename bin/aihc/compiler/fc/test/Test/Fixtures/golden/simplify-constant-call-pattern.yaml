  module Test (useIt) where

  import GHC.Types (Int)

  data Tree = Leaf | Node Tree Int Tree

  merge :: Tree -> Tree -> Tree
  merge t Leaf = t
  merge Leaf t = t
  merge (Node l x r) t = Node (merge l t) x r

  useIt :: Tree -> (Tree -> Int) -> Int
  useIt t k = k (merge t Leaf)
