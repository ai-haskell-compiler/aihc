reason: The function 'merge' is recursive, so the inliner does not copy it. The call 'merge t Leaf' gives a constructor without fields. The body of 'merge' with 'Leaf' in place of its second parameter simplifies to 't', which is not larger than the call, so the call becomes 't'.
