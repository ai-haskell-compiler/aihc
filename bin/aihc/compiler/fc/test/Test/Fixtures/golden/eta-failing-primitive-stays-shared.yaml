---
extensions:
- MagicHash
modules:
- |
  module Test (render) where

  import GHC.Prim (Int#, quotInt#, (==#))
  import GHC.Types (Bool (..), Int (..))

  showInt :: Int# -> [Bool] -> [Bool]
  showInt n xs = case n ==# 0# of
    1# -> True : xs
    _ -> xs

  render :: Int -> [Bool] -> [Bool]
  render (I# value) = showInt (quotInt# 10# value)
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    ==# = 2.v==# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    quotInt# = 2.vquotInt# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vshowInt :: FUN @cIntRep @sLiftedRep tInt# (t[] tBool 3.→ t[] tBool)
    = λ(x : tInt#) (y : t[] tBool).
      let _case : tInt# =
          prim ==# x lit (0#cIntRep) :: tInt#;
        case _case of {
          1#cIntRep →
            c: @tBool cTrue y;
          _ →
            y
        }

  pub val 1.vrender :: tInt 3.→ t[] tBool 3.→ t[] tBool
    = λ(x : tInt).
      case x of {
        cI# (value : tInt#) →
          vshowInt (prim quotInt# lit (10#cIntRep) :: tInt# value)
      }
status: pass
reason: The argument of the partial application 'showInt' is a call of 'quotInt#', which can fail on a zero divisor. That call is not cheap, so 'render' keeps one argument and a partial application shares the quotient.
