---
extensions:
- MagicHash
modules:
- |
  module Test (render) where

  import GHC.Prim (Int#, quotInt#, (==#))
  import GHC.Types (Bool (..), Int (..))

  showInt :: Int# -> [Bool] -> [Bool]
  showInt n xs = case n ==# 0# of
    1# -> True : xs
    _ -> xs

  render :: Int -> [Bool] -> [Bool]
  render (I# value) = showInt (quotInt# 10# value)
passes:
- eta
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tBool :: 3.sType;
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.t[] :: ∀(a : 3.sType). 3.sType;
    3.c: :: ∀(a : 3.sType). a 3.→ 3.t[] a 3.→ 3.t[] a;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    3.cTrue :: 3.tBool

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  val 1.vshowInt :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (3.t[] 3.tBool 3.→ 3.t[] 3.tBool)
   = λ(x : 2.tInt#).
    λ(y : 3.t[] 3.tBool).
      let {
          _case : 2.tInt# =
              foreign {prim 2.v==# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} x 0#3.cIntRep
      } in
          case _case as (_scrut : 2.tInt#) return (3.t[] 3.tBool) of {
              1#3.cIntRep →
                  3.c: @3.tBool 3.cTrue y;
              _ →
                  y
          }

  pub val 1.vrender :: 3.tInt 3.→ 3.t[] 3.tBool 3.→ 3.t[] 3.tBool
   = λ(x : 3.tInt).
    case x as (_scrut : 3.tInt) return (3.t[] 3.tBool 3.→ 3.t[] 3.tBool) of {
        3.cI# (value : 2.tInt#) →
            1.vshowInt (foreign {prim 2.vquotInt# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} 10#3.cIntRep value)
    }
status: pass
reason: The argument of the partial application 'showInt' is a call of 'quotInt#', which can fail on a zero divisor. That call is not cheap, so 'render' keeps one argument and a partial application shares the quotient.
