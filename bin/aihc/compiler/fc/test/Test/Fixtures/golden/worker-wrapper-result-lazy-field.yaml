---
extensions:
- MagicHash
modules:
- |
  module Test (box) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  data Box = Box Int

  box :: Int -> Box
  box n = case n of
    I# i -> Box (I# (i +# 1#))
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cI#] 3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  type 1.tBox :: 3.sType {
      1.cBox :: 3.tInt 3.→ 1.tBox
  }

  pub val 1.vbox inline :: 3.tInt 3.→ 1.tBox
   = λ(x : 3.tInt).
    case x as (wrapped : 3.tInt) return (1.tBox) of {
        3.cI# (x{1} : 2.tInt#) →
            1.v$wbox x{1}
    }

  val 1.v$wbox :: FUN @3.cIntRep @(3.cBoxedRep 3.cLifted) 2.tInt# 1.tBox
   = λ(x : 2.tInt#).
    let {
        argument : 2.tInt# =
            foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} x 1#3.cIntRep
    } in
        1.cBox (3.cI# argument)
status: pass
reason: The one field of Box is lifted and lazy. A worker that returned it as it is would make the wrapper evaluate it, so the result keeps its constructor. The worker still takes the Int# field of its parameter.
