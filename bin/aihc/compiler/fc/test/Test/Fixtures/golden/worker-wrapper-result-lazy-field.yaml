---
extensions:
- MagicHash
modules:
- |
  module Test (box) where

  import GHC.Prim ((+#))
  import GHC.Types (Int (..))

  data Box = Box Int

  box :: Int -> Box
  box n = case n of
    I# i -> Box (I# (i +# 1#))
passes:
- worker-wrapper
- simplify: 1
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tBox :: sType {
    1.cBox :: tInt 3.→ tBox
  }

  pub val 1.vbox inline :: tInt 3.→ tBox
    = λ(x : tInt).
      let! cI# (x{1} : tInt#) = x;
      v$wbox x{1}

  val 1.v$wbox :: FUN @cIntRep @(cBoxedRep cLifted) tInt# tBox
    = λ(x : tInt#).
      let argument : tInt# =
        prim +# x lit (1#cIntRep) :: tInt#;
      cBox (cI# argument)
status: pass
reason: The one field of Box is lifted and lazy. A worker that returned it as it is would make the wrapper evaluate it, so the result keeps its constructor. The worker still takes the Int# field of its parameter.
