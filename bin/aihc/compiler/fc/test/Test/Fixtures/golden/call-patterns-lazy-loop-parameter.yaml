modules:
- |
  module Test (prefix) where

  import GHC.Prim (Int#, (*#), (+#), (-#))
  import GHC.Types (Int (..))

  data List a = Nil | Cons a (List a)

  prefix :: (Int -> Int) -> Int -> List Int
  prefix f (I# s0) = go (I# (s0 +# 1#)) 10#
    where
      go :: Int -> Int# -> List Int
      go x n = case n of
        1# -> Cons (f x) Nil
        _ -> Cons (f x) (go (case x of I# s -> I# (s *# 3#)) (n -# 1#))
