---
extensions:
- MagicHash
modules:
- |
  module Test (prefix) where

  import GHC.Prim (Int#, (*#), (+#), (-#))
  import GHC.Types (Int (..))

  data List a = Nil | Cons a (List a)

  prefix :: (Int -> Int) -> Int -> List Int
  prefix f (I# s0) = go (I# (s0 +# 1#)) 10#
    where
      go :: Int -> Int# -> List Int
      go x n = case n of
        1# -> Cons (f x) Nil
        _ -> Cons (f x) (go (case x of I# s -> I# (s *# 3#)) (n -# 1#))
passes:
- call-patterns
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    *# = 2.v*# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  type 1.tList (a : sType) :: sType {
    1.cNil :: ∀(a : sType). tList a;
    1.cCons :: ∀(a : sType). a 3.→ tList a 3.→ tList a
  }

  pub val 1.vprefix :: (tInt 3.→ tInt) 3.→ tInt 3.→ tList tInt
    = λ(x : tInt 3.→ tInt) (y : tInt).
      case y of {
        cI# (s0 : tInt#) →
          rec {
            $sgo : FUN @cIntRep @(cBoxedRep cLifted) tInt# (FUN @cIntRep @(cBoxedRep cLifted) tInt# (tList tInt)) =
              λ(x{1} : tInt#) (y{1} : tInt#).
                let x{2} : tInt =
                    cI# x{1};
                  case y{1} of {
                    1#cIntRep →
                      cCons @tInt (x x{2}) (cNil @tInt);
                    _ →
                      cCons @tInt (x x{2}) ($sgo (prim *# x{1} lit (3#cIntRep) :: tInt#) (prim -# y{1} lit (1#cIntRep) :: tInt#))
                  }
          } in
            $sgo (prim +# s0 lit (1#cIntRep) :: tInt#) lit (10#cIntRep) :: tInt#
      }
status: pass
reason: The loop uses its counter only in lazy arguments, so the worker/wrapper split leaves the box. Every call gives the constructor, so the copy takes the field, and the recursive call computes the next field without a thunk. The copy builds the box only for the uses of the parameter.
