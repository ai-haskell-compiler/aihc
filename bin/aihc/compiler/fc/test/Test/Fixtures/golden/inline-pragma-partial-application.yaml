---
extensions: []
modules:
- |
  module Test (both, other) where
  import GHC.Types (Bool (..))

  choose :: Bool -> (Bool -> Bool)
  choose b = case b of
    True -> \x -> x
    False -> \x -> False
  {-# NOINLINE choose #-}

  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g = \x -> f (g x)
  {-# INLINE compose #-}

  both :: Bool -> Bool -> Bool
  both b = compose (choose b) (choose b)

  other :: Bool -> Bool -> Bool
  other b = compose (choose b) (choose True)
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  val 1.vchoose noinline :: tBool 2.→ tBool 2.→ tBool
    = λ(x : tBool).
      case x of {
        cTrue →
          λ(x{1} : tBool).
            x{1};
        cFalse →
          λ(x{1} : tBool).
            cFalse
      }

  pub val 1.vboth :: tBool 2.→ tBool 2.→ tBool
    = λ(x : tBool).
      let x{1} : tBool 2.→ tBool =
        vchoose x;
      let y : tBool 2.→ tBool =
        vchoose x;
      λ(x{2} : tBool).
        x{1} (y x{2})

  pub val 1.vother :: tBool 2.→ tBool 2.→ tBool
    = λ(x : tBool).
      let x{1} : tBool 2.→ tBool =
        vchoose x;
      let y : tBool 2.→ tBool =
        vchoose cTrue;
      λ(x{2} : tBool).
        x{1} (y x{2})
status: pass
reason: The growing policy copies a small INLINE function at a partial call with an interesting argument, also when the values it lands in have no growth left.
