---
extensions: []
modules:
- |
  module Test (both, other) where
  import GHC.Types (Bool (..))

  choose :: Bool -> (Bool -> Bool)
  choose b = case b of
    True -> \x -> x
    False -> \x -> False
  {-# NOINLINE choose #-}

  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g = \x -> f (g x)
  {-# INLINE compose #-}

  both :: Bool -> Bool -> Bool
  both b = compose (choose b) (choose b)

  other :: Bool -> Bool -> Bool
  other b = compose (choose b) (choose True)
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tBool :: 2.sType;
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cFalse :: 2.tBool;
    2.cLifted :: 2.tLevity;
    2.cTrue :: 2.tBool

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  val 1.vchoose noinline :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    case x as (_scrut : 2.tBool) return (2.tBool 2.→ 2.tBool) of {
        2.cTrue →
            λ(x{1} : 2.tBool).
              x{1};
        2.cFalse →
            λ(x{1} : 2.tBool).
              2.cFalse
    }

  pub val 1.vboth :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    let {
        x{1} : 2.tBool 2.→ 2.tBool =
            1.vchoose x
    } in
        let {
            y : 2.tBool 2.→ 2.tBool =
                1.vchoose x
        } in
            λ(x{2} : 2.tBool).
              x{1} (y x{2})

  pub val 1.vother :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    let {
        x{1} : 2.tBool 2.→ 2.tBool =
            1.vchoose x
    } in
        let {
            y : 2.tBool 2.→ 2.tBool =
                1.vchoose 2.cTrue
        } in
            λ(x{2} : 2.tBool).
              x{1} (y x{2})
status: pass
reason: The growing policy copies a small INLINE function at a partial call with an interesting argument, also when the values it lands in have no growth left.
