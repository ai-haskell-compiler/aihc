---
extensions:
- MagicHash
modules:
- |
  module Test (select, keep) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  double :: Int -> Int
  double n = case n of
    I# i -> I# (i +# i)

  pick :: Bool -> Int -> Int -> Int
  pick b x y = case b of
    True -> x
    False -> y

  select :: Bool -> Int -> Int -> Int
  select b n m = pick b (double n) (double m)

  keep :: Int -> Int -> Int
  keep n =
    let y = double n
     in \_ -> case y of
          I# a -> case y of
            I# b -> I# (a +# b)
passes:
- demand
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#)

  import headers
    constructors [3.cFalse, 3.cTrue] 3.tBool :: sType;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cFalse :: tBool;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTrue :: tBool

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  val 1.vdouble :: tInt 3.→ tInt
    = λ(x : tInt).
      case x as (_scrut : tInt) return (tInt) of {
        cI# (i : tInt#) →
          cI# (prim +# i i)
      }

  val 1.vpick :: tBool 3.→ tInt 3.→ tInt 3.→ tInt
    = λ(x : tBool) (y : tInt) (z : tInt).
      case x as (_scrut : tBool) return (tInt) of {
        cTrue →
          y;
        cFalse →
          z
      }

  pub val 1.vselect :: tBool 3.→ tInt 3.→ tInt 3.→ tInt
    = λ(x : tBool) (y : tInt) (z : tInt).
      vpick x (vdouble y) (vdouble z)

  pub val 1.vkeep :: tInt 3.→ tInt 3.→ tInt
    = λ(x : tInt).
      let y : tInt =
        vdouble x;
      λ(_pat : tInt).
        case y as (_scrut : tInt) return (tInt) of {
          cI# (a : tInt#) →
            case y as (_scrut{1} : tInt) return (tInt) of {
              cI# (b : tInt#) →
                cI# (prim +# a b)
            }
        }
status: pass
reason: A function that evaluates an argument on one path only is lazy in it, so the two calls of 'double' in 'select' stay unevaluated arguments. A let whose body is a lambda is lazy in its binder, because the lambda is a value and its body runs only when the lambda is applied, so the let in 'keep' stays.
