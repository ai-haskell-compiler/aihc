---
extensions:
- MagicHash
modules:
- |
  module Test (select, keep) where

  import GHC.Prim ((+#))
  import GHC.Types (Bool (..), Int (..))

  double :: Int -> Int
  double n = case n of
    I# i -> I# (i +# i)

  pick :: Bool -> Int -> Int -> Int
  pick b x y = case b of
    True -> x
    False -> y

  select :: Bool -> Int -> Int -> Int
  select b n m = pick b (double n) (double m)

  keep :: Int -> Int -> Int
  keep n =
    let y = double n
     in \_ -> case y of
          I# a -> case y of
            I# b -> I# (a +# b)
passes:
- demand
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tBool :: 3.sType;
    3.tInt :: 3.sType;
    2.tInt# :: 3.tTYPE 3.cIntRep;
    3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cFalse :: 3.tBool;
    3.cI# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# 3.tInt;
    3.cIntRep :: 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    3.cTrue :: 3.tBool

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  val 1.vdouble :: 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    case x as (_scrut : 3.tInt) return (3.tInt) of {
        3.cI# (i : 2.tInt#) →
            3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} i i)
    }

  val 1.vpick :: 3.tBool 3.→ 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tBool).
    λ(y : 3.tInt).
      λ(z : 3.tInt).
        case x as (_scrut : 3.tBool) return (3.tInt) of {
            3.cTrue →
                y;
            3.cFalse →
                z
        }

  pub val 1.vselect :: 3.tBool 3.→ 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tBool).
    λ(y : 3.tInt).
      λ(z : 3.tInt).
        1.vpick x (1.vdouble y) (1.vdouble z)

  pub val 1.vkeep :: 3.tInt 3.→ 3.tInt 3.→ 3.tInt
   = λ(x : 3.tInt).
    let {
        y : 3.tInt =
            1.vdouble x
    } in
        λ(_pat : 3.tInt).
          case y as (_scrut : 3.tInt) return (3.tInt) of {
              3.cI# (a : 2.tInt#) →
                  case y as (_scrut{1} : 3.tInt) return (3.tInt) of {
                      3.cI# (b : 2.tInt#) →
                          3.cI# (foreign {prim 2.v+# :: FUN @3.cIntRep @3.sLiftedRep 2.tInt# (FUN @3.cIntRep @3.cIntRep 2.tInt# 2.tInt#)} a b)
                  }
          }
status: pass
reason: A function that evaluates an argument on one path only is lazy in it, so the two calls of 'double' in 'select' stay unevaluated arguments. A let whose body is a lambda is lazy in its binder, because the lambda is a value and its body runs only when the lambda is applied, so the let in 'keep' stays.
