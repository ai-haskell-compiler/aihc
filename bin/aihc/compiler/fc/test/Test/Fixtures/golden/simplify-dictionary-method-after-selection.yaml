reason: The method of the instance for 'Wrap m' selects 'point' of 'm' in a let and then gives a lambda. The specialised copy of 'points' takes the method from a call of the dictionary function, and the case selects the method because a copy of it only repeats the selection. The loop then builds no dictionary.
