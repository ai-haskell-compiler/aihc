- |
  module Test (run) where
  import GHC.Types (Bool (..))

  class Point f where
    point :: a -> f a

  newtype Box a = Box a

  newtype Wrap m a = Wrap (m a)

  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g = \x -> f (g x)
  {-# INLINE compose #-}

  instance Point Box where
    point x = Box x

  instance Point m => Point (Wrap m) where
    point = compose Wrap point

  points :: Point f => [a] -> [f a]
  points [] = []
  points (x : xs) = point x : points xs

  run :: [Bool] -> [Wrap Box Bool]
  run = points
