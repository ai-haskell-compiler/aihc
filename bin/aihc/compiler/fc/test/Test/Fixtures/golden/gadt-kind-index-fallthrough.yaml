  pub val 1.veqTypeRep :: ∀(k1 : 3.sType) (k2 : 3.sType) (a : k1) (b : k2). 1.tTypeRep k1 a 3.→ 1.tTypeRep k2 b 3.→ 1.tMaybe (1.t:~~: k1 k2 a b)
