    constructors [2.c()] 2.tUnit :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.t:~~: (k1 : sType) (k2 : sType) (a : k1) (b : k2) :: sType {
    pub 1.cHRefl :: ∀(k : sType) (a : k) (k2 : sType) (b : k2). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (k2 ~ k) (FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (t:~~: k k2 a b))
  }

  pub type 1.tMaybe (a : sType) :: sType {
    pub 1.cNothing :: ∀(a : sType). tMaybe a;
    pub 1.cJust :: ∀(a : sType). a 3.→ tMaybe a
  }

  pub type 1.tUnit :: sType {
    pub 1.cUnit :: 1.tUnit
