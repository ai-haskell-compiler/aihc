  pub val 1.v$mApp :: ∀(k2 : 3.sType) (t : k2) (rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tTypeRep k2 t 3.→ (∀(k1 : 3.sType) (f : k1 3.→ k2) (x : k1). FUN @(3.cTupleRep (3.c[] 3.tRuntimeRep)) @3.sLiftedRep (t ~ f x) (1.tTypeRep (k1 3.→ k2) f 3.→ FUN @3.sLiftedRep @rep (1.tTypeRep k1 x) r)) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
