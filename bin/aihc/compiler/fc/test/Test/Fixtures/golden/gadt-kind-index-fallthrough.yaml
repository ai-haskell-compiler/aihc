              λ(z : FUN @3.sLiftedRep @rep 2.tUnit r).
                case 1.vsplitApp @k2 @t x as (_scrut : 1.tAppView k2 t) return (r) of {
                    1.cIsApp @(k1 : 3.sType) @(f : k1 3.→ k2) @(x{1} : k1) ($pattern_d0 : t ~ f x{1}) (f{1} : 1.tTypeRep (k1 3.→ k2) f) (x{2} : 1.tTypeRep k1 x{1}) →
