    3.cLifted :: 3.tLevity;
    3.cTupleRep :: 3.t[] 3.tRuntimeRep 3.→ 3.tRuntimeRep;
    3.c[] :: ∀(a : 3.sType). 3.t[] a

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  pub type 1.t:~~: (k1 : 3.sType) (k2 : 3.sType) (a : k1) (b : k2) :: 3.sType {
      pub 1.cHRefl :: ∀(k : 3.sType) (a : k) (k2 : 3.sType) (b : k2). FUN @(3.cTupleRep (3.c[] 3.tRuntimeRep)) @3.sLiftedRep (k2 ~ k) (FUN @(3.cTupleRep (3.c[] 3.tRuntimeRep)) @3.sLiftedRep (b ~ a) (1.t:~~: k k2 a b))
  }

  pub type 1.tMaybe (a : 3.sType) :: 3.sType {
