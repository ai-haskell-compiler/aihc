      pub 1.cIsApp :: ∀(k2 : 3.sType) (t : k2) (k1 : 3.sType) (f : k1 3.→ k2) (x : k1). FUN @(3.cTupleRep (3.c[] 3.tRuntimeRep)) @3.sLiftedRep (t ~ f x) (1.tTypeRep (k1 3.→ k2) f 3.→ 1.tTypeRep k1 x 3.→ 1.tAppView k2 t)
