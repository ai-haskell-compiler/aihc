                1.cJust (_pat : 1.t:~~: k (3.tTYPE (3.cBoxedRep 3.cLifted)) a (3.tTYPE (3.cBoxedRep 3.cLifted))) →
                    case _pat as (_do_scrut{1} : 1.t:~~: k (3.tTYPE (3.cBoxedRep 3.cLifted)) a (3.tTYPE (3.cBoxedRep 3.cLifted))) return (1.tUnit) of {
                        1.cHRefl ($pattern_d0 : 3.tTYPE (3.cBoxedRep 3.cLifted) ~ k) ($pattern_d1 : 3.tTYPE (3.cBoxedRep 3.cLifted) ~ a) →
