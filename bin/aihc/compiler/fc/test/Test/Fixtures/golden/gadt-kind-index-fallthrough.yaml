modules:
- |
  module Test where
  import GHC.Types (Type)
  data (a :: k1) :~~: (b :: k2) where
    HRefl :: forall k (a :: k). a :~~: a
  data Maybe a = Nothing | Just a
  data Unit = Unit
  data TypeRep (a :: k) = TypeRep
  typeRep :: forall k (a :: k). TypeRep a
  typeRep = TypeRep
  eqTypeRep :: forall k1 k2 (a :: k1) (b :: k2). TypeRep a -> TypeRep b -> Maybe (a :~~: b)
  eqTypeRep _ _ = Nothing
  data AppView (a :: k) where
    IsCon :: forall k (a :: k). Unit -> AppView a
    IsApp :: forall k2 (t :: k2) k1 (f :: k1 -> k2) (x :: k1). (t ~ f x) => TypeRep f -> TypeRep x -> AppView t
  splitApp :: forall k (a :: k). TypeRep a -> AppView a
  splitApp _ = IsCon Unit
  pattern Con' :: forall k (a :: k). Unit -> TypeRep a
  pattern Con' con <- (splitApp -> IsCon con)
  pattern App :: forall k2 (t :: k2). () => forall k1 (f :: k1 -> k2) (x :: k1). (t ~ f x) => TypeRep f -> TypeRep x -> TypeRep t
  pattern App f x <- (splitApp -> IsApp f x)
  putTypeRep :: forall k (a :: k). TypeRep a -> Unit
  putTypeRep rep
    | Just HRefl <- rep `eqTypeRep` (typeRep :: TypeRep Type) = Unit
  putTypeRep (Con' con) = con
  putTypeRep (App f x) = putTypeRep f
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

