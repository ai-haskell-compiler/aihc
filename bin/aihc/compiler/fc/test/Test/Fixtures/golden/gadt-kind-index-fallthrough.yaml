extensions:
- GADTs
- PolyKinds
- ScopedTypeVariables
- TypeOperators
- KindSignatures
- PatternSynonyms
- ViewPatterns
- RankNTypes
modules:
- |
  module Test where
  import GHC.Types (Type)
  data (a :: k1) :~~: (b :: k2) where
    HRefl :: forall k (a :: k). a :~~: a
  data Maybe a = Nothing | Just a
  data Unit = Unit
  data TypeRep (a :: k) = TypeRep
  typeRep :: forall k (a :: k). TypeRep a
  typeRep = TypeRep
  eqTypeRep :: forall k1 k2 (a :: k1) (b :: k2). TypeRep a -> TypeRep b -> Maybe (a :~~: b)
  eqTypeRep _ _ = Nothing
  data AppView (a :: k) where
    IsCon :: forall k (a :: k). Unit -> AppView a
    IsApp :: forall k2 (t :: k2) k1 (f :: k1 -> k2) (x :: k1). (t ~ f x) => TypeRep f -> TypeRep x -> AppView t
  splitApp :: forall k (a :: k). TypeRep a -> AppView a
  splitApp _ = IsCon Unit
  pattern Con' :: forall k (a :: k). Unit -> TypeRep a
  pattern Con' con <- (splitApp -> IsCon con)
  pattern App :: forall k2 (t :: k2). () => forall k1 (f :: k1 -> k2) (x :: k1). (t ~ f x) => TypeRep f -> TypeRep x -> TypeRep t
  pattern App f x <- (splitApp -> IsApp f x)
  putTypeRep :: forall k (a :: k). TypeRep a -> Unit
  putTypeRep rep
    | Just HRefl <- rep `eqTypeRep` (typeRep :: TypeRep Type) = Unit
  putTypeRep (Con' con) = con
  putTypeRep (App f x) = putTypeRep f
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [2.c()] 2.tUnit :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    2.c() :: 2.tUnit;
    3.cBoxedRep :: tLevity → tRuntimeRep;
    3.cLifted :: tLevity;
    3.cTupleRep :: t[] tRuntimeRep → tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub type 1.t:~~: (k1 : sType) (k2 : sType) (a : k1) (b : k2) :: sType {
    pub 1.cHRefl :: ∀(k : sType) (a : k) (k2 : sType) (b : k2). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (k2 ~ k) (FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (b ~ a) (t:~~: a b))
  }

  pub type 1.tMaybe (a : sType) :: sType {
    pub 1.cNothing :: ∀(a : sType). tMaybe a;
    pub 1.cJust :: ∀(a : sType). a → tMaybe a
  }

  pub type 1.tUnit :: sType {
    pub 1.cUnit :: 1.tUnit
  }

  pub type 1.tTypeRep (k : sType) (a : k) :: sType {
    pub 1.cTypeRep :: ∀(k : sType) (a : k). tTypeRep a
  }

  pub type 1.tAppView (k : sType) (a : k) :: sType {
    pub 1.cIsCon :: ∀(k : sType) (a : k). 1.tUnit → tAppView a;
    pub 1.cIsApp :: ∀(k2 : sType) (t : k2) (k1 : sType) (f : k1 → k2) (x : k1). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (t ~ f x) (tTypeRep f → tTypeRep x → tAppView t)
  }

  pub val 1.v$mCon' :: ∀(k : sType) (a : k) (rep : tRuntimeRep) (r : tTYPE rep). tTypeRep a → (1.tUnit → r) → (2.tUnit → r) → r
    = Λ(k : sType) (a : k) (rep : tRuntimeRep) (r : tTYPE rep). λ(x : tTypeRep a) (y : 1.tUnit → r) (z : 2.tUnit → r).
      case vsplitApp @a x of {
        cIsCon (con : 1.tUnit) →
          y con;
        _ →
          z c()
      }

  pub val 1.v$mApp :: ∀(k2 : sType) (t : k2) (rep : tRuntimeRep) (r : tTYPE rep). tTypeRep t → (∀(k1 : sType) (f : k1 → k2) (x : k1). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (t ~ f x) (tTypeRep f → tTypeRep x → r)) → (2.tUnit → r) → r
    = Λ(k2 : sType) (t : k2) (rep : tRuntimeRep) (r : tTYPE rep). λ(x : tTypeRep t)
    (y : ∀(k1 : sType) (f : k1 → k2) (x{1} : k1). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (t ~ f x{1}) (tTypeRep f → tTypeRep x{1} → r))
    (z : 2.tUnit → r).
      case vsplitApp @t x of {
        cIsApp @(k1 : sType) @(f : k1 → k2) @(x{1} : k1) ($co : t ~ f x{1}) (f{1} : tTypeRep f) (x{2} : tTypeRep x{1}) →
          y @f @x{1} (coercion ($co)) f{1} x{2};
        _ →
          z c()
      }

  pub val 1.vtypeRep :: ∀(k : sType) (a : k). tTypeRep a
    = Λ(k : sType) (a : k).
      cTypeRep @a

  pub val 1.veqTypeRep :: ∀(k1 : sType) (k2 : sType) (a : k1) (b : k2). tTypeRep a → tTypeRep b → tMaybe (t:~~: a b)
    = Λ(k1 : sType) (k2 : sType) (a : k1) (b : k2). λ(_ : tTypeRep a) (_ : tTypeRep b).
      cNothing @(t:~~: a b)

  pub val 1.vsplitApp :: ∀(k : sType) (a : k). tTypeRep a → tAppView a
    = Λ(k : sType) (a : k). λ(_ : tTypeRep a).
      cIsCon @a cUnit

  pub val 1.vputTypeRep :: ∀(k : sType) (a : k). tTypeRep a → 1.tUnit
    = Λ(k : sType) (a : k). λ(x : tTypeRep a).
      case veqTypeRep @a @sType x (vtypeRep @sType) of {
        cJust (_pat : t:~~: a sType) →
          let! cHRefl (_ : sType ~ k) (_ : sType ~ a) = _pat;
          cUnit;
        _ →
          v$mCon' @a @1.tUnit x (λ(con : 1.tUnit).
            con) (λ(_ : 2.tUnit).
            v$mApp @a @1.tUnit x (Λ(k1 : sType) (f : k1 → k) (x{1} : k1). λ(_ : a ~ f x{1}) (f{1} : tTypeRep f)
            (_ : tTypeRep x{1}).
              vputTypeRep @f f{1}) (λ(_ : 2.tUnit).
              absurd x return (1.tUnit)))
      }
status: pass
reason: a pattern guard on HRefl at a different kind than the scrutinee falls through to pattern synonym clauses; the constructor carries a separate kind universal and a kind equality, so the match instantiates it.
