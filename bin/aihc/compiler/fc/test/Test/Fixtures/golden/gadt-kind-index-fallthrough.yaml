  pub val 1.v$mCon' :: ∀(k : 3.sType) (a : k) (rep : 3.tRuntimeRep) (r : 3.tTYPE rep). 1.tTypeRep k a 3.→ (FUN @3.sLiftedRep @rep 1.tUnit r) 3.→ FUN @3.sLiftedRep @rep (FUN @3.sLiftedRep @rep 2.tUnit r) r
