  pub type 1.tTypeRep (k : sType) (a : k) :: sType {
    pub 1.cTypeRep :: ∀(k : sType) (a : k). tTypeRep k a
  }

  pub type 1.tAppView (k : sType) (a : k) :: sType {
    pub 1.cIsCon :: ∀(k : sType) (a : k). 1.tUnit 3.→ tAppView k a;
    pub 1.cIsApp :: ∀(k2 : sType) (t : k2) (k1 : sType) (f : k1 3.→ k2) (x : k1). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (t ~ f x) (tTypeRep (k1 3.→ k2) f 3.→ tTypeRep k1 x 3.→ tAppView k2 t)
  }

  pub val 1.v$mCon' :: ∀(k : sType) (a : k) (rep : tRuntimeRep) (r : tTYPE rep). tTypeRep k a 3.→ (FUN @sLiftedRep @rep 1.tUnit r) 3.→ FUN @sLiftedRep @rep (FUN @sLiftedRep @rep 2.tUnit r) r
    = Λ(k : sType) (a : k) (rep : tRuntimeRep) (r : tTYPE rep). λ(x : tTypeRep k a) (y : FUN @sLiftedRep @rep 1.tUnit r)
    (z : FUN @sLiftedRep @rep 2.tUnit r).
      case vsplitApp @k @a x return (r) of {
        cIsCon (con : 1.tUnit) →
          y con;
        _ →
          z c()
      }

  pub val 1.v$mApp :: ∀(k2 : sType) (t : k2) (rep : tRuntimeRep) (r : tTYPE rep). tTypeRep k2 t 3.→ (∀(k1 : sType) (f : k1 3.→ k2) (x : k1). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (t ~ f x) (tTypeRep (k1 3.→ k2) f 3.→ FUN @sLiftedRep @rep (tTypeRep k1 x) r)) 3.→ FUN @sLiftedRep @rep (FUN @sLiftedRep @rep 2.tUnit r) r
    = Λ(k2 : sType) (t : k2) (rep : tRuntimeRep) (r : tTYPE rep). λ(x : tTypeRep k2 t)
    (y : ∀(k1 : sType) (f : k1 3.→ k2) (x{1} : k1). FUN @(cTupleRep (c[] tRuntimeRep)) @sLiftedRep (t ~ f x{1}) (tTypeRep (k1 3.→ k2) f 3.→ FUN @sLiftedRep @rep (tTypeRep k1 x{1}) r))
    (z : FUN @sLiftedRep @rep 2.tUnit r).
      case vsplitApp @k2 @t x return (r) of {
        cIsApp @(k1 : sType) @(f : k1 3.→ k2) @(x{1} : k1) ($pattern_d0 : t ~ f x{1}) (f{1} : tTypeRep (k1 3.→ k2) f) (x{2} : tTypeRep k1 x{1}) →
          y @k1 @f @x{1} (coercion ($pattern_d0)) f{1} x{2};
        _ →
          z c()
      }

  pub val 1.vtypeRep :: ∀(k : sType) (a : k). tTypeRep k a
    = Λ(k : sType) (a : k).
      cTypeRep @k @a

  pub val 1.veqTypeRep :: ∀(k1 : sType) (k2 : sType) (a : k1) (b : k2). tTypeRep k1 a 3.→ tTypeRep k2 b 3.→ tMaybe (t:~~: k1 k2 a b)
    = Λ(k1 : sType) (k2 : sType) (a : k1) (b : k2). λ(x : tTypeRep k1 a) (y : tTypeRep k2 b).
      cNothing @(t:~~: k1 k2 a b)

  pub val 1.vsplitApp :: ∀(k : sType) (a : k). tTypeRep k a 3.→ tAppView k a
    = Λ(k : sType) (a : k). λ(x : tTypeRep k a).
      cIsCon @k @a cUnit

  pub val 1.vputTypeRep :: ∀(k : sType) (a : k). tTypeRep k a 3.→ 1.tUnit
    = Λ(k : sType) (a : k). λ(x : tTypeRep k a).
      case veqTypeRep @k @(tTYPE (cBoxedRep cLifted)) @a @(tTYPE (cBoxedRep cLifted)) x (vtypeRep @(tTYPE (cBoxedRep cLifted)) @(tTYPE (cBoxedRep cLifted))) return (1.tUnit) of {
        cJust (_pat : t:~~: k (tTYPE (cBoxedRep cLifted)) a (tTYPE (cBoxedRep cLifted))) →
          case _pat return (1.tUnit) of {
            cHRefl ($pattern_d0 : tTYPE (cBoxedRep cLifted) ~ k) ($pattern_d1 : tTYPE (cBoxedRep cLifted) ~ a) →
              cUnit
