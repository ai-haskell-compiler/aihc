---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test where

  import GHC.Prim
  import GHC.Types (Int (..), Word (..))

  -- The outer conversion undoes the inner one, so the pair goes away.
  roundTrip :: Word -> Word
  roundTrip (W# w) = W# (int2Word# (word2Int# w))

  -- A narrowing conversion of a widened value goes away too.
  narrowWidened :: Word -> Word
  narrowWidened (W# w) = W# (word32ToWord# (wordToWord32# (word32ToWord# (wordToWord32# w))))

  -- A widening of a narrowed value drops bits, so it stays.
  widenNarrowed :: Word -> Word
  widenNarrowed (W# w) = W# (word8ToWord# (wordToWord8# w))

  -- An operand that leaves the other operand unchanged goes away.
  offsets :: Int -> Addr# -> Int
  offsets (I# n) a = case plusAddr# a 0# of
    b -> I# ((n +# 0#) -# (0# +# minusAddr# b a))

  -- Each call of realWorld# gives the same token, so the second binder
  -- of the token is the first one.
  readTwice :: Addr# -> Int
  readTwice a =
    let s = realWorld#
     in case readIntOffAddr# a 0# s of
          (# _, x #) ->
            let t = realWorld#
             in case readIntOffAddr# a 1# t of
                  (# _, y #) -> I# (x +# y)
passes:
- simplify
status: pass
