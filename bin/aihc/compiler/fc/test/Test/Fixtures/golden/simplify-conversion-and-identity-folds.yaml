---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test where

  import GHC.Prim
  import GHC.Types (Int (..), Word (..))

  -- The outer conversion undoes the inner one, so the pair goes away.
  roundTrip :: Word -> Word
  roundTrip (W# w) = W# (int2Word# (word2Int# w))

  -- A narrowing conversion of a widened value goes away too.
  narrowWidened :: Word -> Word
  narrowWidened (W# w) = W# (word32ToWord# (wordToWord32# (word32ToWord# (wordToWord32# w))))

  -- A widening of a narrowed value drops bits, so it stays.
  widenNarrowed :: Word -> Word
  widenNarrowed (W# w) = W# (word8ToWord# (wordToWord8# w))

  -- An operand that leaves the other operand unchanged goes away.
  offsets :: Int -> Addr# -> Int
  offsets (I# n) a = case plusAddr# a 0# of
    b -> I# ((n +# 0#) -# (0# +# minusAddr# b a))

  -- Each call of realWorld# gives the same token, so the second binder
  -- of the token is the first one.
  readTwice :: Addr# -> Int
  readTwice a =
    let s = realWorld#
     in case readIntOffAddr# a 0# s of
          (# _, x #) ->
            let t = realWorld#
             in case readIntOffAddr# a 1# t of
                  (# _, y #) -> I# (x +# y)
passes:
- simplify
status: pass
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import prims
    +# = 2.v+# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    -# = 2.v-# :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @cIntRep tInt# tInt#);
    minusAddr# = 2.vminusAddr# :: FUN @cAddrRep @sLiftedRep tAddr# (FUN @cAddrRep @cIntRep tAddr# tInt#);
    readIntOffAddr# = 2.vreadIntOffAddr# :: ∀(d : sType). FUN @cAddrRep @sLiftedRep tAddr# (FUN @cIntRep @sLiftedRep tInt# (FUN @(cTupleRep (c[] tRuntimeRep)) @(cTupleRep (c: tRuntimeRep (cTupleRep (c[] tRuntimeRep)) (c: tRuntimeRep cIntRep (c[] tRuntimeRep)))) (tState# d) (tTuple2# (cTupleRep (c[] tRuntimeRep)) cIntRep (tState# d) tInt#)));
    realWorld# = 2.vrealWorld# :: tState# tRealWorld;
    word32ToWord# = 2.vword32ToWord# :: FUN @cWord32Rep @cWordRep tWord32# tWord#;
    word8ToWord# = 2.vword8ToWord# :: FUN @cWord8Rep @cWordRep tWord8# tWord#;
    wordToWord32# = 2.vwordToWord32# :: FUN @cWordRep @cWord32Rep tWord# tWord32#;
    wordToWord8# = 2.vwordToWord8# :: FUN @cWordRep @cWord8Rep tWord# tWord8#

  import headers
    2.tAddr# :: tTYPE cAddrRep;
    constructors [3.cI#] 3.tInt :: sType;
    2.tInt# :: tTYPE cIntRep;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    2.tRealWorld :: sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    2.tState# :: ∀(s : sType). tTYPE (cTupleRep (c[] tRuntimeRep));
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    constructors [3.cTuple2#] 3.tTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). tTYPE (cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep))));
    3.sType :: sType;
    constructors [3.cW#] 3.tWord :: sType;
    2.tWord# :: tTYPE cWordRep;
    2.tWord32# :: tTYPE cWord32Rep;
    2.tWord8# :: tTYPE cWord8Rep;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.c: :: ∀(a : sType). a 3.→ t[] a 3.→ t[] a;
    3.cAddrRep :: tRuntimeRep;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cI# :: FUN @cIntRep @sLiftedRep tInt# tInt;
    3.cIntRep :: tRuntimeRep;
    3.cLifted :: tLevity;
    unboxed-tuple 3.cTuple2# :: ∀(r1 : tRuntimeRep) (r2 : tRuntimeRep) (a1 : tTYPE r1) (a2 : tTYPE r2). FUN @r1 @sLiftedRep a1 (FUN @r2 @(cTupleRep (c: tRuntimeRep r1 (c: tRuntimeRep r2 (c[] tRuntimeRep)))) a2 (tTuple2# r1 r2 a1 a2));
    3.cTupleRep :: t[] tRuntimeRep 3.→ tRuntimeRep;
    3.cW# :: FUN @cWordRep @sLiftedRep tWord# tWord;
    3.cWord32Rep :: tRuntimeRep;
    3.cWord8Rep :: tRuntimeRep;
    3.cWordRep :: tRuntimeRep;
    3.c[] :: ∀(a : sType). t[] a

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  pub val 1.vroundTrip :: tWord 3.→ tWord
    = λ(x : tWord).
      case x of {
        cW# (w : tWord#) →
          cW# w
      }

  pub val 1.vnarrowWidened :: tWord 3.→ tWord
    = λ(x : tWord).
      case x of {
        cW# (w : tWord#) →
          cW# (prim word32ToWord# (prim wordToWord32# w))
      }

  pub val 1.vwidenNarrowed :: tWord 3.→ tWord
    = λ(x : tWord).
      case x of {
        cW# (w : tWord#) →
          cW# (prim word8ToWord# (prim wordToWord8# w))
      }

  pub val 1.voffsets :: tInt 3.→ FUN @cAddrRep @sLiftedRep tAddr# tInt
    = λ(x : tInt) (y : tAddr#).
      case x of {
        cI# (n : tInt#) →
          cI# (prim -# n (prim minusAddr# y y))
      }

  pub val 1.vreadTwice :: FUN @cAddrRep @sLiftedRep tAddr# tInt
    = λ(x : tAddr#).
      let s : tState# tRealWorld =
        prim realWorld#;
      case prim readIntOffAddr# @tRealWorld x lit (0#cIntRep) :: tInt# s of {
        cTuple2# (_pat : tState# tRealWorld) (x{1} : tInt#) →
          case prim readIntOffAddr# @tRealWorld x lit (1#cIntRep) :: tInt# s of {
            cTuple2# (_pat{1} : tState# tRealWorld) (y : tInt#) →
              cI# (prim +# x{1} y)
          }
      }
