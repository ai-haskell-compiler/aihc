extensions: [GADTs, PolyKinds, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE GADTs, PolyKinds, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Maybe a = Nothing | Just a
    data Proxy (a :: k) = Proxy
    data Box (a :: k) where
      Box :: forall k (a :: k) j (b :: j). Proxy b -> Box a
    result :: Box Bool
    result = Box (Proxy :: Proxy Maybe)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tBool :: 2.sType {
      pub 1.cTrue :: 1.tBool;
      pub 1.cFalse :: 1.tBool
  }

  pub type 1.tMaybe (a : 2.sType) :: 2.sType {
      pub 1.cNothing :: ∀(a : 2.sType). 1.tMaybe a;
      pub 1.cJust :: ∀(a : 2.sType). a 2.→ 1.tMaybe a
  }

  pub type 1.tProxy (k : 2.sType) (a : k) :: 2.sType {
      pub 1.cProxy :: ∀(k : 2.sType) (a : k). 1.tProxy k a
  }

  pub type 1.tBox (k : 2.sType) (a : k) :: 2.sType {
      pub 1.cBox :: ∀(k : 2.sType) (a : k) (j : 2.sType) (b : j). 1.tProxy j b 2.→ 1.tBox k a
  }

  pub val 1.vresult :: 1.tBox (2.tTYPE (2.cBoxedRep 2.cLifted)) 1.tBool
   = 1.cBox @(2.tTYPE (2.cBoxedRep 2.cLifted)) @1.tBool @(2.tTYPE (2.cBoxedRep 2.cLifted) 2.→ 2.tTYPE (2.cBoxedRep 2.cLifted)) @1.tMaybe (1.cProxy @(2.tTYPE (2.cBoxedRep 2.cLifted) 2.→ 2.tTYPE (2.cBoxedRep 2.cLifted)) @1.tMaybe)
status: pass
reason: Constructor calls use the same type binder order as their declarations.
