---
extensions: []
modules:
- |
  module Test (first, second) where
  import GHC.Types (Bool (..))

  helper :: Bool -> Bool -> Bool -> Bool
  helper a b c = case a of
    True -> case b of
      True -> c
      False -> case c of
        True -> b
        False -> a
    False -> case c of
      True -> case b of
        True -> a
        False -> c
      False -> b
  {-# INLINE helper #-}

  first :: Bool -> Bool -> Bool -> Bool
  first x y z = helper x y z

  second :: Bool -> Bool -> Bool -> Bool
  second x y z = helper z y x
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
    requested-site-limit: 100
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cFalse, 2.cTrue] 2.tBool :: sType;
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cFalse :: tBool;
    2.cLifted :: tLevity;
    2.cTrue :: tBool

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub val 1.vfirst :: tBool 2.→ tBool 2.→ tBool 2.→ tBool
    = λ(x : tBool) (y : tBool) (z : tBool).
      case x as (_scrut : tBool) return (tBool) of {
        cTrue →
          case y as (_scrut{1} : tBool) return (tBool) of {
            cTrue →
              z;
            cFalse →
              case z as (_scrut{2} : tBool) return (tBool) of {
                cTrue →
                  y;
                cFalse →
                  x
              }
          };
        cFalse →
          case z as (_scrut{1} : tBool) return (tBool) of {
            cTrue →
              case y as (_scrut{2} : tBool) return (tBool) of {
                cTrue →
                  x;
                cFalse →
                  z
              };
            cFalse →
              y
          }
      }

  pub val 1.vsecond :: tBool 2.→ tBool 2.→ tBool 2.→ tBool
    = λ(x : tBool) (y : tBool) (z : tBool).
      case z as (_scrut : tBool) return (tBool) of {
        cTrue →
          case y as (_scrut{1} : tBool) return (tBool) of {
            cTrue →
              x;
            cFalse →
              case x as (_scrut{2} : tBool) return (tBool) of {
                cTrue →
                  y;
                cFalse →
                  z
              }
          };
        cFalse →
          case x as (_scrut{1} : tBool) return (tBool) of {
            cTrue →
              case y as (_scrut{2} : tBool) return (tBool) of {
                cTrue →
                  z;
                cFalse →
                  x
              };
            cFalse →
              y
          }
      }
status: pass
reason: A copy of an INLINE value within the requested site limit is free of the allowance, so a value with no growth left still takes it.
