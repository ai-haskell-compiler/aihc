---
extensions: []
modules:
- |
  module Test (first, second) where
  import GHC.Types (Bool (..))

  helper :: Bool -> Bool -> Bool -> Bool
  helper a b c = case a of
    True -> case b of
      True -> c
      False -> case c of
        True -> b
        False -> a
    False -> case c of
      True -> case b of
        True -> a
        False -> c
      False -> b
  {-# INLINE helper #-}

  first :: Bool -> Bool -> Bool -> Bool
  first x y z = helper x y z

  second :: Bool -> Bool -> Bool -> Bool
  second x y z = helper z y x
passes:
- inline:
    policy: grow
    value-growth: 0
    value-slack: 0
    requested-site-limit: 100
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tBool :: 2.sType;
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cFalse :: 2.tBool;
    2.cLifted :: 2.tLevity;
    2.cTrue :: 2.tBool

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub val 1.vfirst :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    λ(y : 2.tBool).
      λ(z : 2.tBool).
        case x as (_scrut : 2.tBool) return (2.tBool) of {
            2.cTrue →
                case y as (_scrut{1} : 2.tBool) return (2.tBool) of {
                    2.cTrue →
                        z;
                    2.cFalse →
                        case z as (_scrut{2} : 2.tBool) return (2.tBool) of {
                            2.cTrue →
                                y;
                            2.cFalse →
                                x
                        }
                };
            2.cFalse →
                case z as (_scrut{1} : 2.tBool) return (2.tBool) of {
                    2.cTrue →
                        case y as (_scrut{2} : 2.tBool) return (2.tBool) of {
                            2.cTrue →
                                x;
                            2.cFalse →
                                z
                        };
                    2.cFalse →
                        y
                }
        }

  pub val 1.vsecond :: 2.tBool 2.→ 2.tBool 2.→ 2.tBool 2.→ 2.tBool
   = λ(x : 2.tBool).
    λ(y : 2.tBool).
      λ(z : 2.tBool).
        case z as (_scrut : 2.tBool) return (2.tBool) of {
            2.cTrue →
                case y as (_scrut{1} : 2.tBool) return (2.tBool) of {
                    2.cTrue →
                        x;
                    2.cFalse →
                        case x as (_scrut{2} : 2.tBool) return (2.tBool) of {
                            2.cTrue →
                                y;
                            2.cFalse →
                                z
                        }
                };
            2.cFalse →
                case x as (_scrut{1} : 2.tBool) return (2.tBool) of {
                    2.cTrue →
                        case y as (_scrut{2} : 2.tBool) return (2.tBool) of {
                            2.cTrue →
                                z;
                            2.cFalse →
                                x
                        };
                    2.cFalse →
                        y
                }
        }
status: pass
reason: A copy of an INLINE value within the requested site limit is free of the allowance, so a value with no growth left still takes it.
