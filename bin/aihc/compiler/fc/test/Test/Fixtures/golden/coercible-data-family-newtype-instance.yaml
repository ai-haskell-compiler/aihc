extensions:
- TypeFamilies
- TypeApplications
- ScopedTypeVariables
- MultiParamTypeClasses
- MagicHash
modules:
- |
  {-# LANGUAGE TypeFamilies, TypeApplications, ScopedTypeVariables, MultiParamTypeClasses, MagicHash #-}
  module Test where
  import GHC.Types (Bool (..), Coercible, Int (..))
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data family F a
  newtype instance F Bool = FBool Int
  toF :: Int -> F Bool
  toF = coerce
  mapF :: (Int -> Int) -> F Bool -> F Bool
  mapF f = coerce f
  data Vec s a = Vec a
  data family MV s a
  newtype Wrap a = Wrap a
  newtype instance MV s (Wrap a) = MVWrap (Vec s a)
  class Len v a where
    len :: v s a -> Int
  instance Len Vec a where
    len _ = I# 0#
  instance Len MV (Wrap a) where
    len = coerce (len @Vec @a)
