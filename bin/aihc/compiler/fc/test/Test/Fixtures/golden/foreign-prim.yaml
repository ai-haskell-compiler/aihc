extensions:
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - MagicHash
modules:
  - |
    module Test where
    foreign import prim raise# :: a -> b
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub foreign import prim 1.vraise# :: ∀(a : 2.tType) (b : 2.tType). a 2.→ b
status: pass
reason: A foreign import prim keeps its checked type.
