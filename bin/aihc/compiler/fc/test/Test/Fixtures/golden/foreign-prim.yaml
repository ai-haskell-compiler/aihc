extensions:
  - ExplicitForAll
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - KindSignatures
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Types (RuntimeRep, TYPE)
    foreign import prim raise# :: forall (r :: RuntimeRep) a (b :: TYPE r). a -> b
    alias :: a -> b
    alias = raise#
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub val 1.valias :: ∀(a : 2.sType) (b : 2.sType). a 2.→ b
   = Λ(a : 2.sType).
    Λ(b : 2.sType).
      λ(_foreign_argument : a).
        foreign {prim 1.vraise# :: ∀(r : 2.tRuntimeRep) (a{1} : 2.sType) (b{1} : 2.tTYPE r). FUN @2.sLiftedRep @r a{1} b{1}} @(2.cBoxedRep 2.cLifted) @a @b _foreign_argument
status: pass
reason: A use of a foreign import prim without arguments is a lambda around a foreign call.
