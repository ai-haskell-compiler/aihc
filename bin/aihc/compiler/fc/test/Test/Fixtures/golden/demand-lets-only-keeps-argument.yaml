modules:
- |
  module Test (loop) where

  import GHC.Prim ((+#), (-#))
  import GHC.Types (Int (..))

  add :: Int -> Int -> Int
  add x y = case x of
    I# a -> case y of
      I# b -> I# (a +# b)

  loop :: Int -> Int -> Int
  loop n acc = case n of
    I# i -> case i of
      0# -> acc
      _ -> loop (I# (i -# 1#)) (add acc n)
