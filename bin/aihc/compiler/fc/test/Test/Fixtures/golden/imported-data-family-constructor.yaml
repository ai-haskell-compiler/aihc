extensions:
  - TypeFamilies
modules:
  - |
    module Base where
    data Unit = Unit
    data family Payload a
    data instance Payload Unit = PayloadUnit Unit
    newtype instance Payload [a] = PayloadList [a]
  - |
    module Test where
    import Base
    build :: Unit -> Payload Unit
    build value = PayloadUnit value
    unwrap :: Payload Unit -> Unit
    unwrap payload = case payload of
      PayloadUnit value -> value
    wrap :: [a] -> Payload [a]
    wrap values = PayloadList values
    items :: Payload [a] -> [a]
    items (PayloadList values) = values
expected: |-
  scope 1 = "" Base
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : 2.sType). 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tUnit :: 2.sType {
      pub 1.cUnit :: 1.tUnit
  }

  pub type 1.tPayload (a : 2.sType) :: 2.sType @N {}

  type 1.t$R$Payload$PayloadUnit :: 2.sType {
      pub 1.cPayloadUnit :: 1.tUnit 2.→ 1.t$R$Payload$PayloadUnit
  }

  axiom 1.$ax$Payload$PayloadUnit : 1.tPayload 1.tUnit ~R 1.t$R$Payload$PayloadUnit

  type 1.t$R$Payload$PayloadList (a : 2.sType) :: 2.sType {}

  axiom 1.$ax$R$Payload$PayloadList (a : 2.sType) : 1.t$R$Payload$PayloadList a ~R 2.t[] a

  axiom 1.$ax$Payload$PayloadList (a : 2.sType) : 1.tPayload (2.t[] a) ~R 1.t$R$Payload$PayloadList a
  scope 1 = "" Base
  scope 2 = "" Test
  scope 3 = "aihc-prim" GHC.Types

  import headers
    1.t$R$Payload$PayloadList :: ∀(a : 3.sType). 3.sType;
    constructors [1.cPayloadUnit] 1.t$R$Payload$PayloadUnit :: 3.sType;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: 3.sType;
    3.sLiftedRep :: 3.tRuntimeRep;
    1.tPayload :: 3.sType 3.→ 3.sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: 3.sType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.sType;
    3.sType :: 3.sType;
    constructors [1.cUnit] 1.tUnit :: 3.sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : 3.sType). 3.sType;
    3.cBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.cLifted :: 3.tLevity;
    1.cPayloadUnit :: 1.tUnit 3.→ 1.t$R$Payload$PayloadUnit

  import synonyms
    3.sLiftedRep = 3.cBoxedRep 3.cLifted;
    3.sType = 3.tTYPE 3.sLiftedRep

  import axioms
    1.$ax$Payload$PayloadList (a : 3.sType) : 1.tPayload (3.t[] a) ~R 1.t$R$Payload$PayloadList a;
    1.$ax$Payload$PayloadUnit : 1.tPayload 1.tUnit ~R 1.t$R$Payload$PayloadUnit;
    1.$ax$R$Payload$PayloadList (a : 3.sType) : 1.t$R$Payload$PayloadList a ~R 3.t[] a

  pub val 2.vbuild :: 1.tUnit 3.→ 1.tPayload 1.tUnit
   = λ(x : 1.tUnit).
    (λ(_field : 1.tUnit).
      (1.cPayloadUnit _field) ▷ sym (axiom-co 1.$ax$Payload$PayloadUnit)) x

  pub val 2.vunwrap :: 1.tPayload 1.tUnit 3.→ 1.tUnit
   = λ(x : 1.tPayload 1.tUnit).
    case x ▷ axiom-co 1.$ax$Payload$PayloadUnit as (_scrut : 1.t$R$Payload$PayloadUnit) return (1.tUnit) of {
        1.cPayloadUnit (value : 1.tUnit) →
            value
    }

  pub val 2.vwrap :: ∀(a : 3.sType). 3.t[] a 3.→ 1.tPayload (3.t[] a)
   = Λ(a : 3.sType).
    λ(x : 3.t[] a).
      x ▷ trans (sym (axiom-co 1.$ax$R$Payload$PayloadList @a)) (sym (axiom-co 1.$ax$Payload$PayloadList @a))

  pub val 2.vitems :: ∀(a : 3.sType). 1.tPayload (3.t[] a) 3.→ 3.t[] a
   = Λ(a : 3.sType).
    λ(x : 1.tPayload (3.t[] a)).
      x ▷ trans (axiom-co 1.$ax$Payload$PayloadList @a) (axiom-co 1.$ax$R$Payload$PayloadList @a)
status: pass
reason: An imported data-family constructor needs the instance axioms and the representation type in the import headers.
