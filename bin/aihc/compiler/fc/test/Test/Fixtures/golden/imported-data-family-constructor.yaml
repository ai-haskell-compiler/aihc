extensions:
  - TypeFamilies
modules:
  - |
    module Base where
    data Unit = Unit
    data family Payload a
    data instance Payload Unit = PayloadUnit Unit
    newtype instance Payload [a] = PayloadList [a]
  - |
    module Test where
    import Base
    build :: Unit -> Payload Unit
    build value = PayloadUnit value
    unwrap :: Payload Unit -> Unit
    unwrap payload = case payload of
      PayloadUnit value -> value
    wrap :: [a] -> Payload [a]
    wrap values = PayloadList values
    items :: Payload [a] -> [a]
    items (PayloadList values) = values
expected: |-
  scope 1 = "" Base
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    constructors [2.c[], 2.c:] 2.t[] :: ∀(a : sType). sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tUnit :: sType {
    pub 1.cUnit :: tUnit
  }

  pub type 1.tPayload (a : sType) :: sType @N {}

  type 1.t$R$Payload$PayloadUnit :: sType {
    pub 1.cPayloadUnit :: tUnit 2.→ t$R$Payload$PayloadUnit
  }

  axiom 1.$ax$Payload$PayloadUnit : tPayload tUnit ~R t$R$Payload$PayloadUnit

  type 1.t$R$Payload$PayloadList (a : sType) :: sType {}

  axiom 1.$ax$R$Payload$PayloadList (a : sType) : t$R$Payload$PayloadList a ~R t[] a

  axiom 1.$ax$Payload$PayloadList (a : sType) : tPayload (t[] a) ~R t$R$Payload$PayloadList a
  scope 1 = "" Base
  scope 2 = "" Test
  scope 3 = "aihc-prim" GHC.Types

  import headers
    1.t$R$Payload$PayloadList :: ∀(a : sType). sType;
    constructors [1.cPayloadUnit] 1.t$R$Payload$PayloadUnit :: sType;
    constructors [3.cLifted, 3.cUnlifted] 3.tLevity :: sType;
    3.sLiftedRep :: tRuntimeRep;
    1.tPayload :: sType 3.→ sType;
    constructors [3.cAddrRep, 3.cBoxedRep, 3.cDoubleRep, 3.cFloatRep, 3.cInt16Rep, 3.cInt32Rep, 3.cInt64Rep, 3.cInt8Rep, 3.cIntRep, 3.cSumRep, 3.cTupleRep, 3.cVecRep, 3.cWord16Rep, 3.cWord32Rep, 3.cWord64Rep, 3.cWord8Rep, 3.cWordRep] 3.tRuntimeRep :: sType;
    3.tTYPE :: ∀(rep : tRuntimeRep). sType;
    3.sType :: sType;
    constructors [1.cUnit] 1.tUnit :: sType;
    constructors [3.c[], 3.c:] 3.t[] :: ∀(a : sType). sType;
    3.cBoxedRep :: tLevity 3.→ tRuntimeRep;
    3.cLifted :: tLevity;
    1.cPayloadUnit :: tUnit 3.→ t$R$Payload$PayloadUnit

  import synonyms
    3.sLiftedRep = cBoxedRep cLifted;
    3.sType = tTYPE sLiftedRep

  import axioms
    1.$ax$Payload$PayloadList (a : sType) : tPayload (t[] a) ~R t$R$Payload$PayloadList a;
    1.$ax$Payload$PayloadUnit : tPayload tUnit ~R t$R$Payload$PayloadUnit;
    1.$ax$R$Payload$PayloadList (a : sType) : t$R$Payload$PayloadList a ~R t[] a

  pub val 2.vbuild :: tUnit 3.→ tPayload tUnit
    = λ(x : tUnit).
      (λ(_field : tUnit).
        (cPayloadUnit _field) ▷ sym (axiom-co $ax$Payload$PayloadUnit)) x

  pub val 2.vunwrap :: tPayload tUnit 3.→ tUnit
    = λ(x : tPayload tUnit).
      let! cPayloadUnit (value : tUnit) = x ▷ axiom-co $ax$Payload$PayloadUnit;
      value

  pub val 2.vwrap :: ∀(a : sType). t[] a 3.→ tPayload (t[] a)
    = Λ(a : sType). λ(x : t[] a).
      x ▷ trans (sym (axiom-co $ax$R$Payload$PayloadList @a)) (sym (axiom-co $ax$Payload$PayloadList @a))

  pub val 2.vitems :: ∀(a : sType). tPayload (t[] a) 3.→ t[] a
    = Λ(a : sType). λ(x : tPayload (t[] a)).
      x ▷ trans (axiom-co $ax$Payload$PayloadList @a) (axiom-co $ax$R$Payload$PayloadList @a)
status: pass
reason: An imported data-family constructor needs the instance axioms and the representation type in the import headers.
