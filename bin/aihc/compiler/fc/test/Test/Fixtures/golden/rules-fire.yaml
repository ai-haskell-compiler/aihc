---
extensions: []
modules:
- |
  module Test where
  data Nat = Z | S Nat
  data List a = Nil | Cons a (List a)
  class C a where
    op :: a -> a
  instance C Nat where
    op = S
  map :: (a -> b) -> List a -> List b
  map f xs = case xs of
    Nil -> Nil
    Cons y ys -> Cons (f y) (map f ys)
  identity :: a -> a
  identity x = x
  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g x = f (g x)
  {-# RULES
  "map/id" forall xs. map identity xs = xs
  "op/op" forall x. op (op x) = op x
  "compose/id" forall f. compose f identity = f
    #-}
  useMap :: List Nat -> List Nat
  useMap xs = map identity xs
  useOp :: Nat -> Nat
  useOp x = op (op x)
  useCompose :: (Nat -> Nat) -> Nat -> Nat
  useCompose k z = compose k identity z
passes:
- simplify
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tNat :: sType {
    pub 1.cZ :: tNat;
    pub 1.cS :: tNat 2.→ tNat
  }

  pub type 1.tList (a : sType) :: sType {
    pub 1.cNil :: ∀(a : sType). tList a;
    pub 1.cCons :: ∀(a : sType). a 2.→ tList a 2.→ tList a
  }

  pub type 1.t$Dict$C (a : sType) :: sType {
    pub 1.c$Dict$C :: ∀(a : sType). (a 2.→ a) 2.→ t$Dict$C a
  }

  pub val 1.vop :: ∀(a : sType). t$Dict$C a 2.→ a 2.→ a
    = Λ(a : sType). λ($d0 : t$Dict$C a).
      case $d0 of {
        c$Dict$C ($method0 : a 2.→ a) →
          $method0
      }

  pub val 1.v$fCNat :: t$Dict$C tNat
    = c$Dict$C @tNat v$fCNat$cop

  val 1.v$fCNat$cop :: tNat 2.→ tNat
    = cS

  pub val 1.vmap :: ∀(a : sType) (b : sType). (a 2.→ b) 2.→ tList a 2.→ tList b
    = Λ(a : sType) (b : sType). λ(x : a 2.→ b) (y : tList a).
      case y of {
        cNil →
          cNil @b;
        cCons (y{1} : a) (ys : tList a) →
          cCons @b (x y{1}) (vmap @a @b x ys)
      }

  pub val 1.videntity :: ∀(a : sType). a 2.→ a
    = Λ(a : sType). λ(x : a).
      x

  pub val 1.vcompose :: ∀(b : sType) (c : sType) (a : sType). (b 2.→ c) 2.→ (a 2.→ b) 2.→ a 2.→ c
    = Λ(b : sType) (c : sType) (a : sType). λ(x : b 2.→ c) (y : a 2.→ b) (z : a).
      x (y z)

  pub val 1.vuseMap :: tList tNat 2.→ tList tNat
    = λ(x : tList tNat).
      x

  pub val 1.vuseOp :: tNat 2.→ tNat
    = λ(x : tNat).
      vop @tNat v$fCNat x

  pub val 1.vuseCompose :: (tNat 2.→ tNat) 2.→ tNat 2.→ tNat
    = λ(x : tNat 2.→ tNat) (y : tNat).
      x y

  rule "map/id" Λ(a : sType). λ(xs : tList a).
    vmap @a @a (videntity @a) xs
   = xs
   :: tList a

  rule "op/op" Λ(a : sType). λ($rd0 : t$Dict$C a). λ(x : a).
    vop @a $rd0 (vop @a $rd0 x)
   = vop @a $rd0 x
   :: a

  rule "compose/id" Λ(a : sType). Λ(b : sType). λ(f : a 2.→ b).
    vcompose @a @b @a f (videntity @a)
   = f
   :: a 2.→ b
status: pass
reason: Rules fire in the simplifier, including at a known dictionary and with surplus arguments.
