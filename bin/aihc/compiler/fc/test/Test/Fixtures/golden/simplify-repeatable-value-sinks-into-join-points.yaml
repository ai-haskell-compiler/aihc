---
extensions:
- MagicHash
- UnboxedTuples
modules:
- |
  module Test (scan) where

  import GHC.Prim (Addr#, Int#, (+#), (<#), (==#), readIntOffAddr#, realWorld#)
  import GHC.Types (Int (..))

  scan :: Addr# -> Int# -> Int# -> Int
  scan address mode first =
    let next = case first <# 4# of
          1# -> case readIntOffAddr# address 1# realWorld# of
            (# _, value #) -> I# value
          _ -> I# 0#
        j :: Int# -> Int
        j k = case k ==# 7# of
          1# -> I# 0#
          _ -> case next of
            I# value -> case value ==# k of
              1# -> I# (value +# k)
              _ -> case k <# value of
                1# -> I# (k +# 3#)
                _ -> I# (value +# 5#)
     in case mode <# 0# of
          1# -> j 1#
          _ -> case first <# 0# of
            1# -> j 2#
            _ -> case first <# 9# of
              1# -> case next of I# value -> I# (value +# 4#)
              _ -> I# 0#
passes:
- simplify
expected: |-
  scope 1 = "" Test
