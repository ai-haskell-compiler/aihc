  pub val 1.vscan :: FUN @cAddrRep @sLiftedRep tAddr# (FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# tInt))
    = λ(x : tAddr#) (y : tInt#) (z : tInt#).
      let j : FUN @cIntRep @sLiftedRep tInt# tInt =
        λ(x{1} : tInt#).
          case x{1} of {
            7#cIntRep →
              cI# lit (0#cIntRep) :: tInt#;
            _ →
              let value : tInt# =
