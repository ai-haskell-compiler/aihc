  module Test (classify) where

  import GHC.Prim ((*#), (+#))
  import GHC.Types (Int (..))

  classify :: Int -> Int -> Int
  classify x y =
    let scale k = I# (k *# 2#)
     in case x of
          I# 0# -> scale 1#
          I# a -> case y of
            I# 0# -> scale a
            I# b -> I# (a +# b)
