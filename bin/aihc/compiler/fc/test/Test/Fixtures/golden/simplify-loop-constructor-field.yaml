        go : FUN @cIntRep @sLiftedRep tInt# tInt =
          λ(x{1} : tInt#).
            case x{1} of {
              0#cIntRep →
                cI# lit (0#cIntRep) :: tInt#;
              _ →
                go (prim -# x{1} lit (1#cIntRep) :: tInt#)
            }
