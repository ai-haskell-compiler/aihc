  pub val 1.vloop :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# tInt)
    = λ(x : tInt#) (y : tInt#).
      let argument : tInt# =
          prim -# x lit (8#cIntRep) :: tInt#;
        rec {
          go : FUN @cIntRep @sLiftedRep tInt# tInt =
            λ(x{1} : tInt#).
              case x{1} of {
                0#cIntRep →
                  cI# lit (0#cIntRep) :: tInt#;
                _ →
                  case go (prim -# x{1} lit (1#cIntRep) :: tInt#) of {
                    cI# (rest : tInt#) →
                      cI# (prim +# argument rest)
                  }
              }
        } in
          go y

  pub val 1.vlazyLoop :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# tInt)
    = λ(x : tInt#) (y : tInt#).
      let step : tInt =
          cI# (prim quotInt# lit (8#cIntRep) :: tInt# x);
        rec {
          go : FUN @cIntRep @sLiftedRep tInt# tInt =
            λ(x{1} : tInt#).
              case x{1} of {
                0#cIntRep →
                  cI# lit (0#cIntRep) :: tInt#;
                _ →
                  case step of {
                    cI# (delta : tInt#) →
                      case go (prim -# x{1} lit (1#cIntRep) :: tInt#) of {
                        cI# (rest : tInt#) →
                          cI# (prim +# delta rest)
                      }
                  }
              }
        } in
          go y

  pub val 1.vunusedField :: FUN @cIntRep @sLiftedRep tInt# (FUN @cIntRep @sLiftedRep tInt# tInt)
    = λ(x : tInt#) (y : tInt#).
