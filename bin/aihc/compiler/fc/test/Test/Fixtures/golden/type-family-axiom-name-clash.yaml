    module First where
    data Flag = Off | On
    type family F a
    type instance F Flag = Flag
  - |
    module Second where
    data Flag = Off | On
    type family F a
    type instance F Flag = Flag
  - |
    module Test where
    import qualified First
    import qualified Second
    data Unit = Unit
    result = Unit
