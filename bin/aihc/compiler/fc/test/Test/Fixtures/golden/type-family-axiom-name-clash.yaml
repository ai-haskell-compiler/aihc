extensions:
  - TypeFamilies
modules:
  - |
    module First where
    data Flag = Off | On
    type family F a
    type instance F Flag = Flag
  - |
    module Second where
    data Flag = Off | On
    type family F a
    type instance F Flag = Flag
  - |
    module Test where
    import qualified First
    import qualified Second
    data Unit = Unit
    result = Unit
expected: |-
  scope 1 = "" First
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tFlag :: 2.sType {
      pub 1.cOff :: 1.tFlag;
      pub 1.cOn :: 1.tFlag
  }

  pub type 1.tF (a : 2.sType) :: 2.sType @N {}

  axiom 1.$ax$F$Flag : 1.tF 1.tFlag ~N 1.tFlag
  scope 1 = "" Second
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tFlag :: 2.sType {
      pub 1.cOff :: 1.tFlag;
      pub 1.cOn :: 1.tFlag
  }

  pub type 1.tF (a : 2.sType) :: 2.sType @N {}

  axiom 1.$ax$F$Flag : 1.tF 1.tFlag ~N 1.tFlag
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tUnit :: 2.sType {
      pub 1.cUnit :: 1.tUnit
  }

  pub val 1.vresult :: 1.tUnit
   = 1.cUnit
status: pass
reason: Two modules may each define a type family F. Their axiom names stay distinct by package and module.
