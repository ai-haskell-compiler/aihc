extensions:
  - KindSignatures
  - PolyKinds
  - TypeFamilies
modules:
  - |
    {-# LANGUAGE PolyKinds, TypeFamilies, KindSignatures #-}
    module Test where
    data Unit = Unit
    newtype Const a (b :: k) = Const a
    data family Payload a
    newtype instance Payload (Const a b) = PayloadConst a
    build :: a -> Payload (Const a b)
    build value = PayloadConst value
    unwrap :: Payload (Const a b) -> a
    unwrap (PayloadConst value) = value
    useAtUnit :: Payload (Const Unit Unit) -> Unit
    useAtUnit payload = unwrap payload
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    constructors [2.cLifted, 2.cUnlifted] 2.tLevity :: sType;
    2.sLiftedRep :: tRuntimeRep;
    constructors [2.cAddrRep, 2.cBoxedRep, 2.cDoubleRep, 2.cFloatRep, 2.cInt16Rep, 2.cInt32Rep, 2.cInt64Rep, 2.cInt8Rep, 2.cIntRep, 2.cSumRep, 2.cTupleRep, 2.cVecRep, 2.cWord16Rep, 2.cWord32Rep, 2.cWord64Rep, 2.cWord8Rep, 2.cWordRep] 2.tRuntimeRep :: sType;
    2.tTYPE :: ∀(rep : tRuntimeRep). sType;
    2.sType :: sType;
    2.cBoxedRep :: tLevity 2.→ tRuntimeRep;
    2.cLifted :: tLevity

  import synonyms
    2.sLiftedRep = cBoxedRep cLifted;
    2.sType = tTYPE sLiftedRep

  pub type 1.tUnit :: sType {
    pub 1.cUnit :: tUnit
  }

  pub type 1.tConst (k0 : sType) (a : sType) (b : k0) :: sType {}

  axiom 1.$ax$Const (k0 : sType) (a : sType) (b : k0) : tConst k0 a b ~R a

  pub type 1.tPayload (a : sType) :: sType @N {}

  type 1.t$R$Payload$PayloadConst (k0 : sType) (a : sType) (b : k0) :: sType {}

  axiom 1.$ax$R$Payload$PayloadConst (k0 : sType) (a : sType) (b : k0) : t$R$Payload$PayloadConst k0 a b ~R a

  axiom 1.$ax$Payload$PayloadConst (k0 : sType) (a : sType) (b : k0) : tPayload (tConst k0 a b) ~R t$R$Payload$PayloadConst k0 a b

  pub val 1.vbuild :: ∀(k0 : sType) (a : sType) (b : k0). a 2.→ tPayload (tConst k0 a b)
    = Λ(k0 : sType) (a : sType) (b : k0). λ(x : a).
      x ▷ trans (sym (axiom-co $ax$R$Payload$PayloadConst @k0 @a @b)) (sym (axiom-co $ax$Payload$PayloadConst @k0 @a @b))

  pub val 1.vunwrap :: ∀(k0 : sType) (a : sType) (b : k0). tPayload (tConst k0 a b) 2.→ a
    = Λ(k0 : sType) (a : sType) (b : k0). λ(x : tPayload (tConst k0 a b)).
      x ▷ trans (axiom-co $ax$Payload$PayloadConst @k0 @a @b) (axiom-co $ax$R$Payload$PayloadConst @k0 @a @b)

  pub val 1.vuseAtUnit :: tPayload (tConst (tTYPE (cBoxedRep cLifted)) tUnit tUnit) 2.→ tUnit
    = λ(x : tPayload (tConst (tTYPE (cBoxedRep cLifted)) tUnit tUnit)).
      vunwrap @(tTYPE (cBoxedRep cLifted)) @tUnit @tUnit x
status: pass
reason: A newtype instance whose head leaves a kind open quantifies that kind. Its representation type, both axioms, and each use of the axioms take the kind as the first argument.
