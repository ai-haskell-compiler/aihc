extensions:
  - KindSignatures
  - PolyKinds
  - TypeFamilies
modules:
  - |
    {-# LANGUAGE PolyKinds, TypeFamilies, KindSignatures #-}
    module Test where
    data Unit = Unit
    newtype Const a (b :: k) = Const a
    data family Payload a
    newtype instance Payload (Const a b) = PayloadConst a
    build :: a -> Payload (Const a b)
    build value = PayloadConst value
    unwrap :: Payload (Const a b) -> a
    unwrap (PayloadConst value) = value
    useAtUnit :: Payload (Const Unit Unit) -> Unit
    useAtUnit payload = unwrap payload
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.sType;
    2.sLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.sType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.sType;
    2.sType :: 2.sType;
    2.cBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.cLifted :: 2.tLevity

  import synonyms
    2.sLiftedRep = 2.cBoxedRep 2.cLifted;
    2.sType = 2.tTYPE 2.sLiftedRep

  pub type 1.tUnit :: 2.sType {
      pub 1.cUnit :: 1.tUnit
  }

  pub type 1.tConst (k0 : 2.sType) (a : 2.sType) (b : k0) :: 2.sType {}

  axiom 1.$ax$Const (k0 : 2.sType) (a : 2.sType) (b : k0) : 1.tConst k0 a b ~R a

  pub type 1.tPayload (a : 2.sType) :: 2.sType @N {}

  type 1.t$R$Payload$PayloadConst (k0 : 2.sType) (a : 2.sType) (b : k0) :: 2.sType {}

  axiom 1.$ax$R$Payload$PayloadConst (k0 : 2.sType) (a : 2.sType) (b : k0) : 1.t$R$Payload$PayloadConst k0 a b ~R a

  axiom 1.$ax$Payload$PayloadConst (k0 : 2.sType) (a : 2.sType) (b : k0) : 1.tPayload (1.tConst k0 a b) ~N 1.t$R$Payload$PayloadConst k0 a b

  pub val 1.vbuild :: ∀(k0 : 2.sType) (a : 2.sType) (b : k0). a 2.→ 1.tPayload (1.tConst k0 a b)
   = Λ(k0 : 2.sType).
    Λ(a : 2.sType).
      Λ(b : k0).
        λ(x : a).
          x ▷ trans (sym (axiom-co 1.$ax$R$Payload$PayloadConst @k0 @a @b)) (sym (axiom-co 1.$ax$Payload$PayloadConst @k0 @a @b))

  pub val 1.vunwrap :: ∀(k0 : 2.sType) (a : 2.sType) (b : k0). 1.tPayload (1.tConst k0 a b) 2.→ a
   = Λ(k0 : 2.sType).
    Λ(a : 2.sType).
      Λ(b : k0).
        λ(x : 1.tPayload (1.tConst k0 a b)).
          x ▷ trans (axiom-co 1.$ax$Payload$PayloadConst @k0 @a @b) (axiom-co 1.$ax$R$Payload$PayloadConst @k0 @a @b)

  pub val 1.vuseAtUnit :: 1.tPayload (1.tConst (2.tTYPE (2.cBoxedRep 2.cLifted)) 1.tUnit 1.tUnit) 2.→ 1.tUnit
   = λ(x : 1.tPayload (1.tConst (2.tTYPE (2.cBoxedRep 2.cLifted)) 1.tUnit 1.tUnit)).
    1.vunwrap @(2.tTYPE (2.cBoxedRep 2.cLifted)) @1.tUnit @1.tUnit x
status: pass
reason: A newtype instance whose head leaves a kind open quantifies that kind. Its representation type, both axioms, and each use of the axioms take the kind as the first argument.
