extensions:
  - TypeFamilies
modules:
  - |
    module Test where
    data family Payload a
    data instance Payload a = PayloadValue a
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import header 2.tLevity :: 2.tType

  import header 2.tLiftedRep :: 2.tRuntimeRep

  import header 2.tRuntimeRep :: 2.tType

  import header 2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType

  import header 2.tType :: 2.tType

  import header 2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep

  import header 2.vLifted :: 2.tLevity

  import synonym 2.tLiftedRep = 2.vBoxedRep 2.vLifted

  import synonym 2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tPayload (a : 2.tType) :: 2.tType @N {}

  type 1.t$R$Payload$PayloadValue (a : 2.tType) :: 2.tType {
      1.vPayloadValue :: ∀(a : 2.tType). a 2.→ 1.t$R$Payload$PayloadValue a
  }

  axiom 1.$ax$Payload$PayloadValue (a : 2.tType) : 1.tPayload a ~N 1.t$R$Payload$PayloadValue a
status: pass
reason: A data family is an empty type. An instance adds a hidden representation type and a nominal axiom.
