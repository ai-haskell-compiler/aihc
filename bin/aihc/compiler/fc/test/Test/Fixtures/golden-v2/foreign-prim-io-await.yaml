---
extensions:
- ForeignFunctionInterface
- GHCForeignImportPrim
- MagicHash
modules:
- |
  module Test where

  import GHC.Prim (Addr#, RealWorld, State#)

  foreign import prim awaitIO# ::
    Addr# -> State# RealWorld -> State# RealWorld

  await request state = awaitIO# request state
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import header 2.tAddr# :: 3.tTYPE 3.vAddrRep

  import header 3.tLevity :: 3.tType

  import header 3.tLiftedRep :: 3.tRuntimeRep

  import header 2.tRealWorld :: 3.tType

  import header 3.tRuntimeRep :: 3.tType

  import header 2.tState# :: ∀(s : 3.tType). 3.tTYPE (3.vTupleRep (3.v[] 3.tRuntimeRep))

  import header 3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.tType

  import header 3.tType :: 3.tType

  import header 3.t[] :: ∀(a : 3.tType). 3.tType

  import header 3.vAddrRep :: 3.tRuntimeRep

  import header 3.vBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep

  import header 3.vLifted :: 3.tLevity

  import header 3.vTupleRep :: 3.t[] 3.tRuntimeRep 3.→ 3.tRuntimeRep

  import header 3.v[] :: ∀(a : 3.tType). 3.t[] a

  import synonym 3.tLiftedRep = 3.vBoxedRep 3.vLifted

  import synonym 3.tType = 3.tTYPE 3.tLiftedRep

  pub foreign import prim 1.vawaitIO# :: FUN @3.vAddrRep @3.tLiftedRep 2.tAddr# (FUN @(3.vTupleRep (3.v[] 3.tRuntimeRep)) @(3.vTupleRep (3.v[] 3.tRuntimeRep)) (2.tState# 2.tRealWorld) (2.tState# 2.tRealWorld))

  pub val 1.vawait :: FUN @3.vAddrRep @3.tLiftedRep 2.tAddr# (FUN @(3.vTupleRep (3.v[] 3.tRuntimeRep)) @(3.vTupleRep (3.v[] 3.tRuntimeRep)) (2.tState# 2.tRealWorld) (2.tState# 2.tRealWorld))
   = λ(x : 2.tAddr#).
    λ(y : 2.tState# 2.tRealWorld).
      1.vawaitIO# x y
status: pass
reason: A primitive occurrence uses the identity of its foreign import declaration.
