  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import header 2.tAddr# :: 3.tTYPE 3.vAddrRep

  import header 2.tInt# :: 3.tTYPE 3.vIntRep

