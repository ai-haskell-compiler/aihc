  import header 3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.tType

  import header 3.tType :: 3.tType

  import header 3.vAddrRep :: 3.tRuntimeRep

  import header 3.vBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep

  import header 3.vIntRep :: 3.tRuntimeRep

  import header 3.vLifted :: 3.tLevity

  import synonym 3.tLiftedRep = 3.vBoxedRep 3.vLifted

  import synonym 3.tType = 3.tTYPE 3.tLiftedRep

  pub type 1.tBoxInt :: 3.tType {
      pub 1.vBoxInt :: FUN @3.vIntRep @3.tLiftedRep 2.tInt# 1.tBoxInt
  }

  pub type 1.tBoxAddr :: 3.tType {
      pub 1.vBoxAddr :: FUN @3.vAddrRep @3.tLiftedRep 2.tAddr# 1.tBoxAddr
  }

  pub val 1.vintValue :: 1.tBoxInt
