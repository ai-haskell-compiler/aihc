    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tValue :: 2.tType {
      pub 1.vNegative :: 1.tValue;
      pub 1.vPositive :: 1.tValue
  }

  pub val 1.vabsolute :: 1.tValue 2.→ 1.tValue
   = λ(x : 1.tValue).
    case x as (_scrut : 1.tValue) return (1.tValue) of {
