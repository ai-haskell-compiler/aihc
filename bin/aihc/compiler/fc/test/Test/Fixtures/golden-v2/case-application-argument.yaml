extensions: []
modules:
  - |
    module Test where

    data Flag = Off | On

    consume :: Flag -> Flag
    consume value = value

    switch :: Flag -> Flag
    switch value =
      consume
        (case value of
          Off -> On
          On -> Off)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import header 2.tLevity :: 2.tType

  import header 2.tLiftedRep :: 2.tRuntimeRep

  import header 2.tRuntimeRep :: 2.tType

  import header 2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType

  import header 2.tType :: 2.tType

  import header 2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep

  import header 2.vLifted :: 2.tLevity

  import synonym 2.tLiftedRep = 2.vBoxedRep 2.vLifted

  import synonym 2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tFlag :: 2.tType {
      pub 1.vOff :: 1.tFlag;
      pub 1.vOn :: 1.tFlag
  }

  pub val 1.vconsume :: 1.tFlag 2.→ 1.tFlag
   = λ(x : 1.tFlag).
    x

  pub val 1.vswitch :: 1.tFlag 2.→ 1.tFlag
   = λ(x : 1.tFlag).
    1.vconsume (case x as (_scrut : 1.tFlag) return (1.tFlag) of {
        1.vOff →
            1.vOn;
        1.vOn →
            1.vOff
    })
status: pass
reason: A case in an application argument keeps its checked result type.
