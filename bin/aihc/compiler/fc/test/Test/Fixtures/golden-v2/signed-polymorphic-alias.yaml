extensions:
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - MagicHash
modules:
  - |
    module Test where
    foreign import prim unsafeCoerce# :: a -> b
    unsafeCoerce :: a -> b
    unsafeCoerce = unsafeCoerce#
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import header 2.tLevity :: 2.tType

  import header 2.tLiftedRep :: 2.tRuntimeRep

  import header 2.tRuntimeRep :: 2.tType

  import header 2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType

  import header 2.tType :: 2.tType

  import header 2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep

  import header 2.vLifted :: 2.tLevity

  import synonym 2.tLiftedRep = 2.vBoxedRep 2.vLifted

  import synonym 2.tType = 2.tTYPE 2.tLiftedRep

  pub foreign import prim 1.vunsafeCoerce# :: ∀(a : 2.tType) (b : 2.tType). a 2.→ b

  pub val 1.vunsafeCoerce :: ∀(a : 2.tType) (b : 2.tType). a 2.→ b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      1.vunsafeCoerce# @a @b
status: pass
reason: A signed polymorphic alias uses its type lambda binders in the right-hand side.
