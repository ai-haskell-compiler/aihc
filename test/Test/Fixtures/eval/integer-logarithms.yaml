modules:
  - |
    module Test where

    import GHC.Integer.Logarithms (integerLog2#, integerLogBase#, wordLog2#)
    import GHC.Types (Int (..))
    import GHC.Word (Word (..))
    import Prelude

    integerLog2 :: Integer -> Int
    integerLog2 value = I# (integerLog2# value)

    integerLogBase :: Integer -> Integer -> Int
    integerLogBase base value = I# (integerLogBase# base value)

    wordLog2 :: Word -> Int
    wordLog2 (W# value) = I# (wordLog2# value)

    main :: IO ()
    main = do
      print (map wordLog2 [0, 1, 2, 255, 256, 18446744073709551615])
      print (map integerLog2 [1, 2, 7, 18446744073709551615, 18446744073709551616, 170141183460469231731687303715884105728])
