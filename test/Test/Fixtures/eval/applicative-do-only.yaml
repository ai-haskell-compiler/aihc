extensions:
  - ApplicativeDo
modules:
  - |
    {-# LANGUAGE ApplicativeDo #-}
    module Test where

    import Prelude

    data V a = V a

    instance Functor V where
      fmap f (V x) = V (f x)

    instance Applicative V where
      pure = V
      V f <*> V x = V (f x)

    result :: Bool
    result = case (do x <- V True; y <- V True; pure (x && y)) of
      V value -> value
output: |
  True
expression: |
  result
status: pass
reason: ApplicativeDo rewrites an independent do block with fmap and <*>, so the
  block needs no Monad instance.
