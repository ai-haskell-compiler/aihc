extensions:
  - MagicHash
modules:
  - |
    module Test where

    import GHC.Int (Int (..))
    import GHC.Prim

    data Results = Results Int Int Int Int Int Int

    results :: Results
    results =
      Results
        (I# (andI# 12# 10#))
        (I# (orI# 12# 10#))
        (I# (xorI# 12# 10#))
        (I# (andI# -1# 7#))
        (I# (orI# (5# ># 3#) (2# <# 1#)))
        (I# (xorI# -1# 5#))
output: |
  Results (I# 8) (I# 14) (I# 6) (I# 7) (I# 1) (I# -6)
expression: |
  results
status: pass
reason: andI#, orI#, and xorI# combine the bits of two Int# values
