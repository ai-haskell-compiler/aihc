extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.Prim (PromptTag#, State#, RealWorld, control0#, newPromptTag#, prompt#, realWorld#)

    -- Two prompts with different tags. Aborting to the inner one leaves the
    -- outer prompt's addition in place; aborting to the outer one skips it.
    run :: Bool -> State# RealWorld -> (# State# RealWorld, Int #)
    run inner s0 =
      case newPromptTag# s0 of
        (# s1, outerTag #) ->
          case newPromptTag# s1 of
            (# s2, innerTag #) ->
              prompt# outerTag
                (\s3 -> case prompt# innerTag (body (if inner then innerTag else outerTag)) s3 of
                          (# s4, y #) -> (# s4, y + 5 #))
                s2

    body :: PromptTag# Int -> State# RealWorld -> (# State# RealWorld, Int #)
    body tag s0 =
      case control0# tag (\_k s -> (# s, 7 #)) s0 of
        (# s1, x #) -> (# s1, x * 10 #)
output: |
  ((I# 12),(I# 7))
expression: |
  case run True realWorld# of
    (# s1, innerResult #) ->
      case run False s1 of
        (# _, outerResult #) -> (innerResult, outerResult)
status: pass
reason: control0# aborts to the nearest prompt with its own tag
