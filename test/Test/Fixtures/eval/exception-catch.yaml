extensions:
  - EmptyDataDecls
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    data State# s
    data RealWorld
    data Exception = Exception Int#

    foreign import prim raise# :: Exception -> (# State# RealWorld, Int# #)
    foreign import prim catch# ::
      (State# RealWorld -> (# State# RealWorld, Int# #)) ->
      (Exception -> State# RealWorld -> (# State# RealWorld, Int# #)) ->
      State# RealWorld ->
      (# State# RealWorld, Int# #)
    foreign import prim realWorld# :: State# RealWorld
    foreign import prim (+#) :: Int# -> Int# -> Int#

    throwing _ = raise# (Exception 10#)
    handler (Exception e) s = (# s, (+#) e 32# #)
output: |
  42
expression: |
  case catch# throwing handler realWorld# of
    (# _, x #) -> x
status: pass
reason: evaluates catch# from realWorld# by passing a raised primitive exception to the handler
