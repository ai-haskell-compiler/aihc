extensions:
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Prim
      ( int16ToInt#,
        int16ToWord16#,
        int32ToInt#,
        int32ToWord32#,
        int8ToInt#,
        int8ToWord8#,
        intToInt16#,
        intToInt32#,
        intToInt8#,
        word16ToInt16#,
        word16ToWord#,
        word2Int#,
        word32ToInt32#,
        word32ToWord#,
        word8ToInt8#,
        word8ToWord#,
        wordToWord16#,
        wordToWord32#,
        wordToWord8#,
      )
    import GHC.Types (Int (..))

    signedWord8 :: Int
    signedWord8 = I# (int8ToInt# (word8ToInt8# (wordToWord8# 200##)))

    signedWord16 :: Int
    signedWord16 = I# (int16ToInt# (word16ToInt16# (wordToWord16# 40000##)))

    signedWord32 :: Int
    signedWord32 = I# (int32ToInt# (word32ToInt32# (wordToWord32# 4294967295##)))

    positiveWord32 :: Int
    positiveWord32 = I# (int32ToInt# (word32ToInt32# (wordToWord32# 1114111##)))

    unsignedInt8 :: Int
    unsignedInt8 = I# (word2Int# (word8ToWord# (int8ToWord8# (intToInt8# -56#))))

    unsignedInt16 :: Int
    unsignedInt16 = I# (word2Int# (word16ToWord# (int16ToWord16# (intToInt16# -25536#))))

    unsignedInt32 :: Int
    unsignedInt32 = I# (word2Int# (word32ToWord# (int32ToWord32# (intToInt32# -1#))))
output: |
  : (I# -56) (: (I# -25536) (: (I# -1) (: (I# 1114111) (: (I# 200) (: (I# 40000) (: (I# 4294967295) []))))))
expression: |
  [signedWord8, signedWord16, signedWord32, positiveWord32, unsignedInt8, unsignedInt16, unsignedInt32]
status: pass
reason: a sign cast keeps the bits of a narrow value and gives them the other sign
