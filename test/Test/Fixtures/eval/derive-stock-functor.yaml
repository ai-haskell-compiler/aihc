extensions:
  - DeriveFunctor
modules:
  - |
    {-# LANGUAGE DeriveFunctor #-}
    module Test where

    data Results = Results Bool Bool Bool Bool

    -- A recursive datatype: the derived instance calls itself at the
    -- subtrees and the function it was given at the elements.
    data Tree a = Leaf | Node (Tree a) a (Tree a)
      deriving (Eq, Functor)

    -- Every shape a field can have: ignored, the parameter, a container of
    -- the parameter, a container of a container, and a type whose earlier
    -- arguments do not mention the parameter.
    data Shapes b a = Shapes b a (Maybe a) [Maybe a] (Either b a)
      deriving (Eq, Functor)

    -- A record constructor and an infix one are rebuilt the same way.
    data Boxed a = Boxed {unBoxed :: a} | Int :*: a
      deriving (Eq, Functor)

    tree :: Tree Int
    tree = Node (Node Leaf 1 Leaf) 2 Leaf

    shapes :: Shapes Bool Int
    shapes = Shapes True 1 (Just 2) [Just 3, Nothing] (Right 4)

    result :: Results
    result =
      Results
        (fmap (+ 1) tree == Node (Node Leaf 2 Leaf) 3 Leaf)
        (fmap (+ 1) shapes == Shapes True 2 (Just 3) [Just 4, Nothing] (Right 5))
        (fmap (+ 1) (Leaf :: Tree Int) == Leaf)
        ( ((7 :: Int) <$ tree) == Node (Node Leaf 7 Leaf) 7 Leaf
            && fmap (+ 1) (Boxed (1 :: Int)) == Boxed 2
            && fmap (+ 1) (1 :*: (2 :: Int)) == 1 :*: 3
        )
expression: result
output: Results True True True True
status: pass
reason: derived fmap maps the parameter in place, hands nested positions to the instance of the type around them, and leaves the other fields alone
