extensions:
  - FunctionalDependencies
  - MultiParamTypeClasses
  - FlexibleInstances
modules:
  - |
    {-# LANGUAGE FunctionalDependencies #-}
    {-# LANGUAGE MultiParamTypeClasses #-}
    {-# LANGUAGE FlexibleInstances #-}
    module Test where

    import Prelude

    class D a b | a -> b where
      d :: a -> b

    instance D Bool Int where
      d _ = 1

    -- Either instance on its own is fine, but together they let one choice of
    -- the first parameter stand for two choices of the second.
    instance D Bool Char where
      d _ = 'x'

    result :: Bool
    result = True
expression: |
  result
output: |
  True
error: |
  typecheck error: Test: instance D Bool Char conflicts with instance D Bool Int under the functional dependency a → b
status: fail
reason: two instances that agree on the determining parameter and differ on the determined one are rejected
