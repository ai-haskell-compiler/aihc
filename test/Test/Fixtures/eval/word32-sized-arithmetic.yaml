    module Test where

    import Data.Bits
    import Data.Word (Word32, byteSwap32)
    import Prelude

    values :: [Word32]
    values = [0, 1, 2, 0x7fffffff, 0x80000000, 0xdeadbeef, 0xfffffffe, 0xffffffff]

    counts :: [Int]
    counts = [0, 1, 7, 31, 32, 33, 63, 64, 65]

    main :: IO ()
    main = do
      print [a + b | a <- values, b <- values]
      print [a - b | a <- values, b <- values]
      print [a * b | a <- values, b <- values]
      print (map negate values)
      print (map signum values)
      print (map abs values)
      print (map fromInteger [4294967296, 4294967301, -1, -4294967295, 18446744073709551617] :: [Word32])
      print [a .&. b | a <- values, b <- values]
      print [a .|. b | a <- values, b <- values]
      print [xor a b | a <- values, b <- values]
      print (map complement values)
      print [shiftL a n | a <- values, n <- counts]
      print [shiftR a n | a <- values, n <- counts]
      print [unsafeShiftL a n | a <- values, n <- counts, n < 32]
      print [unsafeShiftR a n | a <- values, n <- counts, n < 32]
      print [rotate a n | a <- values, n <- counts]
      print [rotate a (negate n) | a <- values, n <- counts]
      print [rotateL a n | a <- values, n <- counts]
      print [rotateR a n | a <- values, n <- counts]
      print (map bit counts :: [Word32])
      print [testBit a n | a <- values, n <- counts]
      print (map popCount values)
      print (map countLeadingZeros values)
      print (map countTrailingZeros values)
      print (map byteSwap32 values)
      print (zeroBits :: Word32, finiteBitSize (0 :: Word32), bitSizeMaybe (0 :: Word32), isSigned (0 :: Word32))
      print [(a == b, a < b, compare a b) | a <- values, b <- values]
