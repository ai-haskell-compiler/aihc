extensions: []
modules:
  - |
    module Test where

    data Nat = Z | S Nat

    data NonEmpty a = a :| [a]

    data Stream = Empty | Chunk Nat Stream

    counts :: Stream -> NonEmpty Nat
    counts stream =
      case stream of
        Empty -> Z :| []
        Chunk c rest ->
          case rest of
            Empty -> c :| []
            _ -> let ~(l :| ls) = lazyRest rest
                  in S l :| (c : ls)
              where
                lazyRest :: Stream -> NonEmpty Nat
                lazyRest s = counts s
output: |
  ((S (S Z)),(: Z (: (S Z) [])))
expression: |
  case counts (Chunk Z (Chunk (S Z) (Chunk Z Empty))) of
    l :| ls -> (l, ls)
status: pass
reason: a case alternative with a where clause whose right-hand side is a let
  expression has the type of the let body
