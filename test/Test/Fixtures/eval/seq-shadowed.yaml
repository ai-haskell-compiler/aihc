extensions:
  - MagicHash
modules:
  - |
    module Test where

    import GHC.Prim (raise#)
    import Prelude hiding (seq)

    data Unit = Unit

    seq :: Unit -> Bool -> Bool
    seq _ result = result

    result :: Bool
    result = seq (raise# Unit) True
output: |
  True
expression: result
status: pass
reason: a shadowed seq binding evaluates as an ordinary function
