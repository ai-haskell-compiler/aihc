    module Test where

    import GHC.Num.Integer (Integer (..))
    import GHC.Prim (sizeofByteArray#)
    import GHC.Types (Int (..))
    import Prelude

    representation :: Integer -> (Int, Int)
    representation (IS _) = (0, 0)
    representation (IP bytes) = (1, quot (I# (sizeofByteArray# bytes)) 8)
    representation (IN bytes) = (-1, quot (I# (sizeofByteArray# bytes)) 8)

    values :: [Integer]
    values =
      [ 9223372036854775807 + 1
      , -9223372036854775808 - 1
