      , 18446744073709551616 * 0
      , -9223372036854775808 * -1
      , quot (-9223372036854775808) (-1)
      , quot 340282366920938463463374607431768211456 18446744073709551616
      ]

    main :: IO ()
    main = print (map representation values)
