        (I# (word2Int# (word64ToWord# (castDoubleToWord64# (int2Double# 1#)))))
        (I# (double2Int# (castWord64ToDouble# (wordToWord64# 4607182418800017408##))))
        (I# (double2Int# (float2Double# (int2Float# 3#))))
        (I# (float2Int# (double2Float# (int2Double# 3#))))
