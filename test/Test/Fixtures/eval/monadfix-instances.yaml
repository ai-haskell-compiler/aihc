  [5,5,5]
  Just [1,1,1]
  Right [2,2,2]
  [[1,1,1],[2,2,2]]
  ([3,3,3],[[4,4,4]])
output: |
  ()
status: pass
reason: base gives MonadFix instances for functions, Maybe, Either, lists, and NonEmpty
