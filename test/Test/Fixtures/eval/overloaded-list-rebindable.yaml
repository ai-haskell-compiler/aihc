extensions:
  - OverloadedLists
  - RebindableSyntax
modules:
  - |
    {-# LANGUAGE OverloadedLists, RebindableSyntax #-}
    module Test where

    import Prelude
    data Box = Box Int [Int]
    fromListN :: Int -> [Int] -> Box
    fromListN n xs = Box n xs
    fromList :: [Int] -> Box
    fromList xs = Box 99 xs
    result :: Bool
    result = case [1, 2, 3] of
      Box n xs -> n == 3 && sum xs == 6 && case [] of
        Box m ys -> m == 0 && null ys
output: |
  True
expression: |
  result
status: pass
reason: RebindableSyntax uses the local fromListN function for an overloaded list.
