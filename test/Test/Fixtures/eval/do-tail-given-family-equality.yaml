extensions:
- TypeFamilies
- ScopedTypeVariables
- FlexibleContexts
modules:
- |
  {-# LANGUAGE TypeFamilies, ScopedTypeVariables, FlexibleContexts #-}
  module Test where
  import Prelude
  data Flag = Off | On
  class Monad m => PrimMonad m where
    type PrimState m
  data MutVar s a = MutVar a
  newMutVar :: PrimMonad m => a -> m (MutVar (PrimState m) a)
  newMutVar x = return (MutVar x)
  modifyMutVar :: PrimMonad m => MutVar (PrimState m) a -> (a -> a) -> m ()
  modifyMutVar _ _ = return ()
  data ST s a = ST a
  instance Functor (ST s) where
    fmap f (ST x) = ST (f x)
  instance Applicative (ST s) where
    pure = ST
    ST f <*> ST x = ST (f x)
  instance Monad (ST s) where
    ST x >>= f = f x
  instance PrimMonad (ST s) where
    type PrimState (ST s) = s
  readVar :: MutVar s a -> ST s a
  readVar (MutVar x) = ST x
  stToPrim :: PrimMonad m => ST (PrimState m) a -> m a
  stToPrim (ST x) = return x
  runBatch :: (PrimMonad m, s ~ PrimState m) => MutVar s a -> m a
  runBatch var = stToPrim (do
    _ <- readVar var
    readVar var)
  result :: Flag
  result = case runBatch (MutVar On) :: ST () Flag of
    ST x -> x
expression: result
output: |
  On
status: pass
reason: A do continuation retains the coercion for its required result type.
evaluators:
- grin
