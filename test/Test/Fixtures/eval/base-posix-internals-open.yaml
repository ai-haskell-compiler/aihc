modules:
  - |
    module Test where

    import Foreign.C.String (CString, withCString)
    import Foreign.C.Types (CInt)
    import System.Posix.Types (CMode)
    import System.Posix.Internals (c_close, c_interruptible_open, c_open, o_RDONLY)
    import Prelude

    type Open = CString -> CInt -> CMode -> IO CInt

    openClose :: Open -> FilePath -> IO (Maybe Bool)
    openClose open path =
      withCString path $ \cPath -> do
        fd <- open cPath o_RDONLY 0
        if fd < 0
          then return Nothing
          else do
            status <- c_close fd
            return (Just (status == 0))

    main :: IO ()
    main = do
      openClose c_open "." >>= print
      openClose c_open "./aihc-no-such-file" >>= print
      openClose c_interruptible_open "." >>= print
      openClose c_interruptible_open "./aihc-no-such-file" >>= print
