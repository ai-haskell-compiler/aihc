modules:
  - |
    module Test where

    import Foreign.C.String (withCString)
    import System.Posix.Internals (c_close, c_open, o_RDONLY)
    import Prelude

    openClose :: FilePath -> IO (Maybe Bool)
    openClose path =
      withCString path $ \cPath -> do
        fd <- c_open cPath o_RDONLY 0
        if fd < 0
          then return Nothing
          else do
            status <- c_close fd
            return (Just (status == 0))

    main :: IO ()
    main = do
      openClose "." >>= print
      openClose "./aihc-no-such-file" >>= print
