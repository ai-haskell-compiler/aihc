extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.Prim (State#, RealWorld, catch#, control0#, newPromptTag#, prompt#, raise#, realWorld#)

    -- A catch inside the captured continuation still handles an exception
    -- raised after the continuation is resumed.
    run :: State# RealWorld -> (# State# RealWorld, Int #)
    run s0 =
      case newPromptTag# s0 of
        (# s1, tag #) ->
          prompt# tag
            ( \s2 ->
                catch#
                  (\s3 -> case control0# tag (\k s4 -> k (\s5 -> (# s5, 1 :: Int #)) s4) s3 of
                            (# _, x #) -> raise# (x + 1))
                  (\e s -> (# s, (e :: Int) * 2 #))
                  s2
            )
            s1
output: |
  I# 4
expression: |
  case run realWorld# of
    (# _, x #) -> x
status: pass
reason: a catch frame inside a captured continuation is copied with it
