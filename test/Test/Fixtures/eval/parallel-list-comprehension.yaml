extensions:
  - ParallelListComp
modules:
  - |
    {-# LANGUAGE ParallelListComp #-}
    module Test where

    import Prelude

    pairs :: Bool
    pairs = [(x, y) | x <- [1, 2] | y <- [3, 4]] == [(1, 3), (2, 4)]

    shortest :: Bool
    shortest = [x + y + z | x <- [1, 2, 3] | y <- [10, 20] | z <- [100, 200, 300]] == [111, 222]

    statements :: Bool
    statements =
      [ (a, b, c, d)
      | (a, b) <- [(1, 'x'), (2, 'y'), (3, 'z')], odd a, let c = a * 10
      | d <- "pq"
      ]
        == [(1, 'x', 10, 'p'), (3, 'z', 30, 'q')]

    shadowing :: Int -> [Int]
    shadowing x = [x + y | y <- [x, x] | x <- [1, 2]]

    result :: Bool
    result = pairs && shortest && statements && shadowing 5 == [6, 7]
output: |
  True
expression: |
  result
status: pass
reason: a parallel list comprehension walks its branches together, stops at the shortest branch, and gives the body the variables of all branches
