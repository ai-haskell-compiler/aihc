extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where

    import GHC.Prim (State#, RealWorld, catch#, raise#, realWorld#, seq)

    error :: [Char] -> ()
    error message = raise# message

    throwing :: State# RealWorld -> (# State# RealWorld, Bool #)
    throwing state =
      case seq (error "urk") () of
        () -> (# state, False #)

    handler :: [Char] -> State# RealWorld -> (# State# RealWorld, Bool #)
    handler exception state =
      case exception of
        ['u', 'r', 'k'] -> (# state, True #)
        _ -> (# state, False #)
output: |
  True
expression: |
  case catch# throwing handler realWorld# of
    (# _, result #) -> result
status: pass
reason: seq evaluates its first argument and propagates the exact error payload to the exception handler
