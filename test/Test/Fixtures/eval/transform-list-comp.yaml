extensions:
  - TransformListComp
modules:
  - |
    {-# LANGUAGE TransformListComp #-}
    module Test where

    import Prelude

    result :: Bool
    result = ([x | x <- [1, 2, 3, 4], then take 2] :: [Int]) == [1, 2]
output: |
  True
expression: |
  result
status: pass
reason: A then qualifier applies its function to the list of the earlier variables.
