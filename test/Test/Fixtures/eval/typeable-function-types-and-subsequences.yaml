  - |
    module Test where
    import Data.List (isSubsequenceOf)
    import Data.Typeable (funResultTy, mkFunTy, typeOf)

    boolRep = typeOf True
    intRep = typeOf (0 :: Int)

    answer :: (Bool, Bool, Bool, Bool, Bool, Bool)
    answer =
      ( mkFunTy boolRep intRep == typeOf not'
      , funResultTy (typeOf not') boolRep == Just intRep
      , funResultTy (typeOf not') intRep == Nothing
      , funResultTy boolRep boolRep == Nothing
      , "ace" `isSubsequenceOf` "abcde"
      , "eca" `isSubsequenceOf` "abcde"
      )
      where
        not' :: Bool -> Int
        not' b = if b then 1 else 0
