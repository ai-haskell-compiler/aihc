    {-# LANGUAGE PatternSynonyms #-}
    module Lib (Expr (..), Flag (..), pattern Sub) where
    data Flag = On | Off
    data Expr = Lit Flag | Add Expr Expr | Neg Expr
    pattern Sub a b = Add a (Neg b)
