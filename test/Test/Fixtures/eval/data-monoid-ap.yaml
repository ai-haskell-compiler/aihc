    module Test where

    import Data.Monoid (Ap (..), Sum (..))
    import Prelude

    class Combine a where
      combine :: a -> a -> a

    instance (Num a, Applicative f) => Combine (Ap f a) where
      combine (Ap left) (Ap right) = Ap (liftA2 (+) left right)

    main :: IO ()
    main = do
      print (getAp (Ap (Just [1 :: Int]) <> Ap (Just [2, 3])))
