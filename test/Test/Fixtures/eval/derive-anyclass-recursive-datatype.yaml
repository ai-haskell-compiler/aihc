extensions:
  - DefaultSignatures
  - DeriveAnyClass
  - DeriveGeneric
  - DerivingStrategies
  - FlexibleContexts
  - KindSignatures
  - TypeOperators
modules:
  - |
    {-# LANGUAGE DefaultSignatures #-}
    {-# LANGUAGE DeriveAnyClass #-}
    {-# LANGUAGE DeriveGeneric #-}
    {-# LANGUAGE DerivingStrategies #-}
    {-# LANGUAGE FlexibleContexts #-}
    {-# LANGUAGE KindSignatures #-}
    {-# LANGUAGE TypeOperators #-}
    module Test where

    import Data.Kind (Type)
    import GHC.Generics

    class GSum (f :: Type -> Type) where
      gsum :: f p -> Int

    instance GSum U1 where
      gsum _ = 0

    -- A field asks the class of its own type, so the representation of a
    -- recursive datatype asks the very instance being derived.
    instance (Sum a) => GSum (K1 i a) where
      gsum (K1 x) = total x

    instance (GSum a) => GSum (M1 i c a) where
      gsum (M1 x) = gsum x

    instance (GSum a, GSum b) => GSum (a :*: b) where
      gsum (x :*: y) = gsum x + gsum y

    instance (GSum a, GSum b) => GSum (a :+: b) where
      gsum (L1 x) = gsum x
      gsum (R1 y) = gsum y

    class Sum a where
      total :: a -> Int
      default total :: (Generic a, GSum (Rep a)) => a -> Int
      total = gsum . from

    instance Sum Int where
      total n = n

    data Tree = Leaf | Node Int Tree Tree
      deriving stock (Generic)
      deriving anyclass (Sum)

    data Odd = Odd Int Even
      deriving stock (Generic)
      deriving anyclass (Sum)

    data Even = Even0 | Even1 Odd
      deriving stock (Generic)
      deriving anyclass (Sum)

    result :: Bool
    result =
      total (Node 1 (Node 2 Leaf Leaf) Leaf) == 3
        && total (Odd 5 (Even1 (Odd 7 Even0))) == 12
expression: result
output: |
  True
status: pass
reason: the generic default of a recursive datatype asks its own derived instance, and a mutually recursive pair resolves through the same batch
