extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.IO (IO(..))
    import GHC.Prim (newMutVar#, readMutVar#, writeMutVar#)

    test :: IO Int
    test = IO (\state -> case newMutVar# (10 :: Int) state of
      (# state1, first #) -> case newMutVar# (20 :: Int) state1 of
        (# state2, second #) -> case writeMutVar# first (30 :: Int) state2 of
          state3 -> case readMutVar# first state3 of
            (# state4, firstValue #) -> case readMutVar# second state4 of
              (# state5, secondValue #) -> (# state5, firstValue + secondValue #))
output: |
  I# 50
expression: test
status: pass
reason: independent MutVar# cells keep distinct values after a write to one cell
