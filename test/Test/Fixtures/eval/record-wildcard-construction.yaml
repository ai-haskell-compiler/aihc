extensions:
  - RecordWildCards
modules:
  - |
    {-# LANGUAGE RecordWildCards #-}
    module Test where

    data Nat = Z | S Nat

    data Point = Point { px :: Nat, py :: Nat }

    add :: Nat -> Nat -> Nat
    add Z m = m
    add (S n) m = S (add n m)

    makePoint :: Nat -> Nat -> Point
    makePoint px py = Point{..}

    swapPoint :: Point -> Point
    swapPoint Point{px = py, py = px} = Point{..}

    shiftFirst :: Nat -> Nat -> Point
    shiftFirst first py = Point{px = S first, ..}

    sumPoint :: Point -> Nat
    sumPoint (Point a b) = add a b
output: |
  S (S (S (S (S (S (S (S Z)))))))
expression: |
  add (sumPoint (makePoint (S Z) (S (S Z)))) (add (sumPoint (swapPoint (makePoint Z (S Z)))) (sumPoint (shiftFirst (S Z) (S (S Z)))))
