dependencies:
  - aihc-base
extensions:
  - MagicHash
modules:
  - |
    module Test where

    seqAlias = seq

    applyAlias :: Int# -> Int#
    applyAlias value = seqAlias () value

output: |
  42
expression: applyAlias 42#
error: "typecheck error: Test: kind mismatch: expected 'BoxedRep 'Lifted, got 'IntRep"
status: fail
reason: generalization defaults the RuntimeRep of seqAlias to LiftedRep, so the alias is a -> b -> b and cannot take an Int#
