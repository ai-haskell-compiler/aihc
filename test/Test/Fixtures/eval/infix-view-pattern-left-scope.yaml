extensions: [ViewPatterns]
modules:
  - |
    {-# LANGUAGE ViewPatterns #-}
    module Test where
    data Pair = Bool :*: Bool
    f :: Pair -> Bool
    f (x :*: (const x -> y)) = y
    result = f (True :*: False)
expression: result
output: 'True'
status: xfail
reason: >
  GHC returns True. The resolver does not put the left infix pattern variable in scope for the right view pattern.
