extensions: []
modules:
  - |
    module Test where

    import Data.Int (Int32)
    import Data.Ix (Ix (..))
    import Data.Word (Word32)

    -- The tar package indexes its unboxed arrays by Word32 and Int32.
    results :: (Int, Int, Bool, Int, Int)
    results =
      ( index (10 :: Word32, 20) 15,
        index (-5 :: Int32, 5) 0,
        inRange ('a', 'z') 'q',
        rangeSize ((0, 0, 0) :: (Int, Int, Int), (1, 2, 3)),
        index ((0, 0, 0) :: (Int, Int, Int), (1, 2, 3)) (1, 1, 1)
      )
output: |
  ((I# 5),(I# 5),True,(I# 24),(I# 17))
expression: results
status: pass
reason: the Ix class has instances for the sized integer types, characters and triples, so tar can index its unboxed arrays
