extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.Prim (State#, RealWorld, control0#, newPromptTag#, prompt#, realWorld#)

    -- The continuation is the rest of the action up to the prompt, without
    -- the prompt. Applying it to an action that yields 10 runs the addition.
    run :: State# RealWorld -> (# State# RealWorld, Int #)
    run s0 =
      case newPromptTag# s0 of
        (# s1, tag #) ->
          prompt# tag
            (\s2 -> case control0# tag (\k s3 -> k (\s4 -> (# s4, 10 #)) s3) s2 of
                      (# s5, x #) -> (# s5, x + 1 #))
            s1
output: |
  I# 11
expression: |
  case run realWorld# of
    (# _, x #) -> x
status: pass
reason: applying the captured continuation resumes the action after the capture
