extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.IO (IO(..))
    import GHC.Prim (newMutVar#, readMutVar#, writeMutVar#)

    test :: IO Int
    test = IO (\state -> case newMutVar# (1 :: Int) state of
      (# state1, mutVar #) -> case writeMutVar# mutVar (42 :: Int) state1 of
        state2 -> readMutVar# mutVar state2)
output: |
  I# 42
expression: test
status: pass
reason: readMutVar# returns the value that writeMutVar# stored
