modules:
  - |
    module Test where

    import Data.List (sort, sortBy, sortOn)
    import Data.Ord (comparing)
    import Prelude

    tagged :: [(Int, Char)]
    tagged = [(3, 'a'), (2, 'b'), (2, 'c'), (1, 'd'), (2, 'e'), (3, 'f'), (1, 'g'), (1, 'h')]

    stable :: [(Int, Char)]
    stable = [(1, 'd'), (1, 'g'), (1, 'h'), (2, 'b'), (2, 'c'), (2, 'e'), (3, 'a'), (3, 'f')]

    failures :: [Int]
    failures =
      [ index
      | (index, False) <- zip [0 ..]
          [ sort ([] :: [Int]) == [],
            sort [1 :: Int] == [1],
            sort [1 .. 8 :: Int] == [1 .. 8],
            sort [8, 7 .. 1 :: Int] == [1 .. 8],
            sort [3, 1, 2, 1, 3, 2, 1 :: Int] == [1, 1, 1, 2, 2, 3, 3],
            sort [3, 4, 1, 2, 7, 8, 5, 6, 0, 9 :: Int] == [0 .. 9],
            sortBy (flip compare) [1, 3, 2, 3, 1 :: Int] == [3, 3, 2, 1, 1],
            sortBy (comparing fst) tagged == stable,
            sortOn fst tagged == stable,
            sortBy (\_ _ -> EQ) tagged == tagged,
            null (sortBy undefined ([] :: [Int])),
            length (sortBy undefined [undefined :: Int]) == 1,
            length (sortBy (\_ _ -> EQ) [undefined, undefined, undefined :: Int]) == 3,
            map fst (sortOn fst [(2, undefined :: Int), (1, undefined)]) == [1, 2]
          ]
      ]
expression: failures
