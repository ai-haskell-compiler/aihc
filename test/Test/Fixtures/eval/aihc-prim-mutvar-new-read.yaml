extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.IO (IO(..))
    import GHC.Prim (newMutVar#, readMutVar#)

    test :: IO Int
    test = IO (\state -> case newMutVar# (41 :: Int) state of
      (# state1, mutVar #) -> readMutVar# mutVar state1)
output: |
  I# 41
expression: test
status: pass
reason: readMutVar# returns the initial value of a MutVar#
