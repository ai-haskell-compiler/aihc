extensions: []
modules:
  - |
    module Test where

    -- The body of an equation with a where clause is a let whose body
    -- applies a binder of the let itself. The where clause takes the type
    -- of the body from the let's own scope, where that binder is bound.
    render :: [Int] -> String
    render xs =
      let (r, _) = foldl f (id, 0 :: Int) xs
       in r ""
      where
        f (o, n) x = (o . shows (x + n), n + 1)

    total :: [Int] -> Int
    total xs =
      let g y = y + base
       in g 0
      where
        base = sum xs
output: |
  ((: '1' (: '3' (: '5' []))),(I# 6))
expression: |
  (render [1, 2, 3], total [1, 2, 3])
status: pass
reason: inferring the type of a let expression scopes the let's binders so a where clause on the enclosing equation does not look one up out of scope
