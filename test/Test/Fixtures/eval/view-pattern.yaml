extensions:
  - ViewPatterns
modules:
  - |
    {-# LANGUAGE ViewPatterns #-}
    module Test where
    data Bool = True | False
    not True = False
    not False = True
    isFalse (not -> True) = True
    isFalse _ = False
output: |
  True
expression: |
  isFalse False
status: pass
reason: matches the result of a view pattern function
