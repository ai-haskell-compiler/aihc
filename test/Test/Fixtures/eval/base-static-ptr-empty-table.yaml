    main :: IO ()
    main = do
      keys <- staticPtrKeys
      print (length keys)
      found <- unsafeLookupStaticPtr key :: IO (Maybe (StaticPtr Int))
      print (fmap deRefStaticPtr found)
      print (fmap staticKey found)
