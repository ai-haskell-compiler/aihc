extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where

    import GHC.Exts
    import GHC.IO (IO (..))
    import System.IO.Unsafe (unsafePerformIO)

    data Results = Results Int Int Int Int Int Int Int Int Int Int Int Int Int Int Int

    -- Each write is at an odd byte offset, then a read at the same offset
    -- gives the value back. The negative values show the sign extension.
    test :: IO Results
    test = IO (\s0 -> case newPinnedByteArray# 64# s0 of
      (# s1, buffer #) -> case mutableByteArrayContents# buffer of
        base ->
          case writeWord8ArrayAsWideChar# buffer 1# 'λ'# s1 of { s2 ->
          case writeWord8ArrayAsChar# buffer 5# 'q'# s2 of { s3 ->
          case writeWord8ArrayAsInt# buffer 7# -5# s3 of { s4 ->
          case writeWord8ArrayAsWord# buffer 15# 9## s4 of { s5 ->
          case writeWord8ArrayAsInt16# buffer 23# (intToInt16# -300#) s5 of { s6 ->
          case writeWord8ArrayAsInt32# buffer 25# (intToInt32# -70000#) s6 of { s7 ->
          case writeWord8ArrayAsFloat# buffer 29# 2.0# s7 of { s8 ->
          case writeWord8ArrayAsDouble# buffer 33# 3.0## s8 of { s9 ->
          case writeWord8ArrayAsAddr# buffer 41# (plusAddr# nullAddr# 11#) s9 of { s10 ->
          case readWord8ArrayAsWideChar# buffer 1# s10 of { (# s11, wide #) ->
          case readWord8ArrayAsChar# buffer 5# s11 of { (# s12, narrow #) ->
          case readWord8ArrayAsInt# buffer 7# s12 of { (# s13, int #) ->
          case readWord8ArrayAsWord# buffer 15# s13 of { (# s14, word #) ->
          case readWord8ArrayAsInt16# buffer 23# s14 of { (# s15, int16 #) ->
          case readWord8ArrayAsInt32# buffer 25# s15 of { (# s16, int32 #) ->
          case readWord8ArrayAsFloat# buffer 29# s16 of { (# s17, float #) ->
          case readWord8ArrayAsDouble# buffer 33# s17 of { (# s18, double #) ->
          case readWord8ArrayAsAddr# buffer 41# s18 of { (# s19, addr #) ->
          case writeWord8OffAddrAsWideChar# base 49# 'μ'# s19 of { s20 ->
          case writeWord8OffAddrAsInt16# base 53# (intToInt16# -2#) s20 of { s21 ->
          case unsafeFreezeByteArray# buffer s21 of { (# s22, frozen #) ->
            (# s22,
               Results
                 (I# (ord# wide)) (I# (ord# narrow)) (I# int) (I# (word2Int# word))
                 (I# (int16ToInt# int16)) (I# (int32ToInt# int32))
                 (I# (float2Int# float)) (I# (double2Int# double))
                 (I# (minusAddr# addr nullAddr#))
                 (I# (ord# (indexWord8ArrayAsWideChar# frozen 49#)))
                 (I# (int16ToInt# (indexWord8ArrayAsInt16# frozen 53#)))
                 (I# (ord# (indexWord8OffAddrAsWideChar# base 1#)))
                 (I# (ord# (indexWord8OffAddrAsChar# base 5#)))
                 (I# (indexWord8OffAddrAsInt# base 7#))
                 (I# (int32ToInt# (indexWord8OffAddrAsInt32# base 25#))) #)
          }}}}}}}}}}}}}}}}}}}}})
output: |
  Results (I# 955) (I# 113) (I# -5) (I# 9) (I# -300) (I# -70000) (I# 2) (I# 3) (I# 11) (I# 956) (I# -2) (I# 955) (I# 113) (I# -5) (I# -70000)
expression: |
  unsafePerformIO test
status: pass
reason: the unaligned byte-array and address families read and write each element type of GHC at a byte offset
