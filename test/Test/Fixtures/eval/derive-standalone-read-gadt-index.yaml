extensions: [GADTs, PolyKinds, StandaloneDeriving]
modules:
  - |
    {-# LANGUAGE GADTs, PolyKinds, StandaloneDeriving #-}
    module Test where
    import Data.Kind (Type)
    data Const2 :: Type -> x -> x -> Type where
      Const2 :: k -> Const2 k v v
    deriving instance Show k => Show (Const2 k v v')
    deriving instance Read k => Read (Const2 k v v)
    data WrapArg :: (k -> Type) -> (k -> Type) -> Type -> Type where
      WrapArg :: f a -> WrapArg g f (g a)
    deriving instance Show (f a) => Show (WrapArg g f (g' a))
    deriving instance Read (f a) => Read (WrapArg g f (g a))
    answer :: Bool
    answer =
      show (read "Const2 5" :: Const2 Int Bool Bool) == "Const2 5"
        && show (read "WrapArg (Just 'x')" :: WrapArg [] Maybe [Char]) == "WrapArg (Just 'x')"
expression: answer
output: |
  True
status: pass
reason: Standalone Read deriving accepts a GADT constructor with a refined result index.
