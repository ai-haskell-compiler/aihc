extensions:
  - ForeignFunctionInterface
  - MagicHash
  - UnliftedFFITypes
modules:
  - |
    {-# LANGUAGE MagicHash #-}
    {-# LANGUAGE UnliftedFFITypes #-}
    module Test where

    import GHC.Exts (Char (..), Char#)

    foreign import ccall unsafe "toupper" c_toupper :: Char# -> Char#

    upper :: Char -> Char
    upper (C# c) = C# (c_toupper c)
output: |
  'A'
expression: |
  upper 'a'
status: pass
reason: an unboxed Char# argument and result marshal as the 32-bit HsChar of the C ABI without a constructor to unwrap
