extensions:
  - PatternSynonyms
  - NamedFieldPuns
modules:
  - |
    {-# LANGUAGE NamedFieldPuns #-}
    {-# LANGUAGE PatternSynonyms #-}
    module Test where
    data Flag = On | Off
    data Pair = Pair Flag Flag
    pattern Point {px, py} = Pair px py
    swap :: Pair -> Pair
    swap Point {px, py} = Point {px = py, py = px}
output: |
  Pair Off On
expression: |
  swap (Point On Off)
status: pass
reason: a field pun in a record pattern synonym pattern binds the field it names
