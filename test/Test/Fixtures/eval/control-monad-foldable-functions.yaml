modules:
  - |
    module Test where

    import Control.Monad (foldM, foldM_, forM, forM_, msum)
    import Data.Foldable (forM_, msum)
    import Data.Traversable (forM)
    import Prelude

    -- GHC gives these Control.Monad functions Foldable and Traversable
    -- types, and Data.Foldable and Data.Traversable export the same
    -- functions. The imports above are thus not ambiguous.
    main :: IO ()
    main = do
      forM_ (Just (1 :: Int)) print
      forM_ (Nothing :: Maybe Int) print
      found <- forM (Just (2 :: Int)) (\value -> pure (value * 10))
      print found
      total <- foldM (\sum' value -> pure (sum' + value)) 0 (Just (3 :: Int))
      print total
      foldM_ (\_ value -> print value) () (Just (4 :: Int))
      print (msum (Just [5, 6 :: Int]))
