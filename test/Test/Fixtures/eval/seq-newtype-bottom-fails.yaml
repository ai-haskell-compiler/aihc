extensions:
  - MagicHash
modules:
  - |
    module Test where

    import GHC.Prim (raise#)

    data Unit = Unit
    newtype Wrapped = Wrapped Unit

    result :: Bool
    result = seq (Wrapped (raise# Unit)) True
output: ""
exception: Unit
expression: result
status: pass
reason: seq observes through a newtype and raises its field's exact Unit exception because construction has no runtime WHNF boundary
