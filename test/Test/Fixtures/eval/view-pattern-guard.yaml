extensions:
  - ViewPatterns
modules:
  - |
    {-# LANGUAGE ViewPatterns #-}
    module Test where
    data Bool = True | False
    data Shape = Circle Bool | Square Bool
    data Label = A | B | C | D
    data Four = Four Label Label Label Label
    isRound (Circle _) = True
    isRound _ = False
    flag (Circle b) = b
    flag (Square b) = b
    classify (Circle True) = A
    classify (isRound -> True) = B
    classify (flag -> True) = C
    classify _ = D
    guarded x
      | (flag -> True) <- x = A
    guarded _ = B
output: |
  Four A B A B
expression: |
  Four (guarded (Circle True)) (guarded (Circle False)) (guarded (Square True)) (guarded (Square False))
status: pass
reason: a pattern guard matches a view pattern against its scrutinee and falls through to the next equation
