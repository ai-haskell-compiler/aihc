extensions:
  - ExtendedLiterals
  - ForeignFunctionInterface
  - MagicHash
  - UnboxedTuples
  - UnliftedFFITypes
modules:
  - |
    module Test where

    import Data.Int (Int32 (..))
    import Foreign.C.Types (CInt (..), CSize (..))
    import GHC.Exts (Addr#, Ptr, RealWorld, Word64 (..))
    import GHC.IO (IO (..))
    import GHC.Prim
      ( ByteArray#,
        MutableByteArray#,
        copyAddrToByteArray#,
        mutableByteArrayContents#,
        newPinnedByteArray#,
        unsafeFreezeByteArray#,
      )
    import System.IO.Unsafe (unsafePerformIO)

    foreign import ccall unsafe "memcpy"
      c_memcpy :: MutableByteArray# RealWorld -> ByteArray# -> CSize -> IO (Ptr ())

    foreign import ccall unsafe "memcmp"
      c_memcmp :: Addr# -> Addr# -> CInt -> CInt

    test :: IO CInt
    test = IO (\state -> case newPinnedByteArray# 3# state of
      (# state1, source #) -> case copyAddrToByteArray# "ABC"# source 0# 3# state1 of
        state2 -> case unsafeFreezeByteArray# source state2 of
          (# state3, frozen #) -> case newPinnedByteArray# 3# state3 of
            (# state4, target #) -> case c_memcpy target frozen (CSize (W64# 3#Word64)) of
              IO copy -> case copy state4 of
                (# state5, _ #) ->
                  (# state5, c_memcmp (mutableByteArrayContents# target) "ABC"# (CInt (I32# 3#Int32)) #))
output: |
  I32# 0
expression: |
  unsafePerformIO test
status: pass
reason: byte array arguments of a ccall pass the payload address, and CSize marshals as Word64
