extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.Prim (State#, RealWorld, catch#, raise#, realWorld#)

    throwing :: State# RealWorld -> (# State# RealWorld, Int #)
    throwing _ = raise# (10 :: Int)

    handler :: Int -> State# RealWorld -> (# State# RealWorld, Int #)
    handler e s = (# s, e + 32 #)
output: |
  I# 42
expression: |
  case catch# throwing handler realWorld# of
    (# _, x #) -> x
status: pass
reason: catch# from aihc-prim passes a raised Int to the handler
