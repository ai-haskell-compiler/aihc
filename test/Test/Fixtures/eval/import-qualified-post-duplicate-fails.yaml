extensions:
  - ImportQualifiedPost
modules:
  - |
    {-# LANGUAGE ImportQualifiedPost #-}
    module Test where

    import qualified Data.List qualified as List
    import Prelude

    sorted :: [Int]
    sorted = List.sort [2, 1]
output: |
  [1,2]
expression: |
  sorted
error: |
  parse module error: [(SourceSpan 4 28 4 37,"unexpected 'qualified'\nexpecting import declaration without duplicate 'qualified'")]
status: fail
reason: qualified in both the prepositive and the postpositive position is rejected, at the same span GHC reports
