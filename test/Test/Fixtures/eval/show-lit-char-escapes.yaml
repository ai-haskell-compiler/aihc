    result :: Results
    result =
      Results
        (show '\233' == "'\\233'")
        (show "na\239ve \955" == "\"na\\239ve \\955\"")
        (show "\SOH" == "\"\\SOH\"")
        (show ['\SO', 'H'] == "\"\\SO\\&H\"")
        (show ['\233', '5'] == "\"\\233\\&5\"")
        (show "ok ~\DEL\n" == "\"ok ~\\DEL\\n\"")
expression: result
output: Results True True True True True True
