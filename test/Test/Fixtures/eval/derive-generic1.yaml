extensions:
  - DeriveGeneric
modules:
  - |
    {-# LANGUAGE DeriveGeneric #-}
    module Test where

    import GHC.Generics (Generic1, Generically1 (..))
    import Prelude

    data T a = A a (Maybe a) [Maybe a] Int | B deriving (Eq, Generic1)

    -- The outer type m of the composition needs Functor m in the
    -- instance context.
    newtype R r m a = R (r -> m (Maybe a)) deriving (Generic1)

    bump :: T Int -> T Int
    bump t = case fmap (+ 1) (Generically1 t) of Generically1 u -> u

    runR :: R Int [] Int -> [Maybe Int]
    runR (R f) = f 10

    bumpR :: R Int [] Int -> R Int [] Int
    bumpR r = case fmap (+ 1) (Generically1 r) of Generically1 u -> u

    result :: Bool
    result =
      map bump [A 1 (Just 2) [Just 3, Nothing] 4, B] == [A 2 (Just 3) [Just 4, Nothing] 4, B]
        && runR (bumpR (R (\x -> [Just x, Nothing]))) == [Just 11, Nothing]
output: |
  True
expression: |
  result
status: pass
