extensions:
  - DataKinds
  - MagicHash
  - StandaloneKindSignatures
  - TypeFamilies
modules:
  - |
    module Test where
    import Data.Kind (Type)
    import GHC.Exts

    type Rep :: Type -> RuntimeRep
    type family Rep a where
      Rep Int = 'IntRep
      Rep Double = 'DoubleRep

    type Raw :: forall (a :: Type) -> TYPE (Rep a)
    type family Raw a where
      Raw Int = Int#
      Raw Double = Double#

    class Unbox a where unbox :: a -> Raw a
    instance Unbox Int where unbox (I# n) = n
    instance Unbox Double where unbox (D# x) = x

    data Results = Results Int Double

    test :: Results
    test = Results (I# (unbox (6 * 7 :: Int))) (D# (unbox (2.5 :: Double)))
expression: test
output: |
  Results (I# 42) (D# 4612811918334230528)
status: pass
reason: A visible dependent binder of a standalone kind signature gives each equation of the family its result kind.
