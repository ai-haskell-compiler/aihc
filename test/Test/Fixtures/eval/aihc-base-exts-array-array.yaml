extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where

    import GHC.Exts
    import GHC.IO (IO (..))
    import System.IO.Unsafe (unsafePerformIO)

    -- Put a two-byte and a three-byte array in an ArrayArray#, and a
    -- nested ArrayArray# of one element after them. Then read the sizes
    -- back through the frozen array.
    test :: IO Bool
    test = IO (\s0 -> case newByteArray# 2# s0 of
      (# s1, two #) -> case unsafeFreezeByteArray# two s1 of
       (# s2, twoFrozen #) -> case newByteArray# 3# s2 of
        (# s3, three #) -> case unsafeFreezeByteArray# three s3 of
         (# s4, threeFrozen #) -> case newArrayArray# 1# s4 of
          (# s5, inner #) -> case unsafeFreezeArrayArray# inner s5 of
           (# s6, innerFrozen #) -> case newArrayArray# 3# s6 of
            (# s7, outer #) -> case writeByteArrayArray# outer 0# twoFrozen s7 of
             s8 -> case writeByteArrayArray# outer 1# threeFrozen s8 of
              s9 -> case writeArrayArrayArray# outer 2# innerFrozen s9 of
               s10 -> case unsafeFreezeArrayArray# outer s10 of
                (# s11, frozen #) ->
                  (# s11,
                     isTrue# (sizeofArrayArray# frozen ==# 3#)
                       && isTrue# (sizeofByteArray# (indexByteArrayArray# frozen 0#) ==# 2#)
                       && isTrue# (sizeofByteArray# (indexByteArrayArray# frozen 1#) ==# 3#)
                       && isTrue# (sizeofArrayArray# (indexArrayArrayArray# frozen 2#) ==# 1#)
                       && isTrue# (sameMutableArrayArray# outer outer)
                       && not (isTrue# (sameMutableArrayArray# outer inner)) #))
expression: |
  unsafePerformIO test
output: |
  True
status: pass
reason: GHC.Exts gives the ArrayArray# operations of GHC.ArrayArray, which contiguous imports. An ArrayArray# holds byte arrays and nested arrays, and the size of each one reads back.
