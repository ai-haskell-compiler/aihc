extensions:
  - RecordWildCards
modules:
  - |
    {-# LANGUAGE RecordWildCards #-}
    module Test where

    data Nat = Z | S Nat

    data Point = Point { px :: Nat, py :: Nat }

    add :: Nat -> Nat -> Nat
    add Z m = m
    add (S n) m = S (add n m)

    sumPoint :: Point -> Nat
    sumPoint Point{..} = add px py

    firstOnly :: Point -> Nat
    firstOnly Point{px = first, ..} = add first py
output: |
  S (S (S (S (S Z))))
expression: |
  add (sumPoint (Point (S Z) (S (S Z)))) (firstOnly (Point (S Z) (S Z)))
status: pass
reason: a record wildcard pattern binds the remaining fields by name
