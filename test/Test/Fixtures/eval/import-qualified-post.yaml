extensions:
  - ImportQualifiedPost
modules:
  - |
    {-# LANGUAGE ImportQualifiedPost #-}
    module Test where

    -- qualified after the module name, with and without an alias, with an
    -- import list, and with a hiding clause.
    import Data.Char qualified as Char (toUpper)
    import Data.List qualified as List
    import Data.List qualified as Unsorted hiding (sort)
    import Data.Maybe qualified
    import Data.Maybe (isJust)
    import Prelude
    import qualified Data.List as Prepositive

    -- The two spellings name the same imports.
    sortedBoth :: ([Int], [Int])
    sortedBoth = (List.sort [3, 1, 2], Prepositive.sort [3, 1, 2])

    -- A hiding clause still applies to the postpositive form.
    appended :: [Int]
    appended = Unsorted.nub [1, 1, 2]

    -- A qualified operator.
    difference :: [Int]
    difference = [1, 2, 3, 4] List.\\ [2, 4]

    -- No alias: the module name itself qualifies.
    firstOrDefault :: Int
    firstOrDefault = Data.Maybe.fromMaybe 5 (Data.Maybe.listToMaybe [1, 2])

    -- An unqualified import of a module that is also imported qualified.
    bothWays :: Bool
    bothWays = isJust (Data.Maybe.listToMaybe "x")

    upper :: Char
    upper = Char.toUpper 'a'

    failures :: [Int]
    failures =
      [ index
      | (index, False) <-
          zip
            [0 ..]
            [ sortedBoth == ([1, 2, 3], [1, 2, 3]),
              appended == [1, 2],
              difference == [1, 3],
              firstOrDefault == 1,
              bothWays,
              upper == 'A'
            ]
      ]
output: |
  []
expression: |
  failures
status: pass
reason: ImportQualifiedPost accepts qualified after the module name, with an alias, an import list, a hiding clause, and beside the prepositive spelling
