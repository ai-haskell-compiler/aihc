modules:
  - |
    module Test where

    import Prelude
    import System.Mem.Weak
    import System.IO.Unsafe (unsafePerformIO)
    result :: Bool
    result = unsafePerformIO $ do
      weak <- mkWeakPtr True Nothing
      value <- deRefWeak weak
      return (value == Just True)
output: |
  True
expression: |
  result
