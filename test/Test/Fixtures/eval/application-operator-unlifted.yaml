extensions:
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Exts (Int (..), Int#)

    unbox :: Int -> Int#
    unbox (I# n) = n

    boxed :: Int
    boxed = I# (unbox $ 41 + 1)

    applied :: [Int]
    applied = map ($ 2) [(+ 1), (* 3)]
output: |
  ((I# 42),(: (I# 3) (: (I# 6) [])))
expression: |
  (boxed, applied)
status: pass
reason: the application operator gives a result of any runtime representation and remains a normal function in sections
