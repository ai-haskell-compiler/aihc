extensions:
  - RebindableSyntax
modules:
  - |
    {-# LANGUAGE RebindableSyntax #-}
    module Test where

    import Prelude (Bool (..), Integer)

    data Tag = Positive | Negative

    fromInteger :: Integer -> Tag
    fromInteger _ = Positive

    negate :: Tag -> Tag
    negate Positive = Negative
    negate Negative = Positive

    (==) :: Tag -> Tag -> Bool
    Positive == Positive = True
    Negative == Negative = True
    _ == _ = False

    matches :: Tag -> Bool
    matches (-1) = True
    matches _ = False
output: |
  True
expression: |
  matches Negative
status: pass
reason: RebindableSyntax resolves fromInteger, negate, and equality for negative patterns
