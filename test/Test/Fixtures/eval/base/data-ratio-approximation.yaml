extensions: []
modules:
  - |
    module Test where

    import Data.Ratio

    ratio :: Integer -> Integer -> Rational
    ratio = (%)

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (True : values) = allTrue values
    allTrue (False : _) = False

    results :: Bool
    results =
      allTrue
        [ approxRational (ratio 3 10) (ratio 1 10) == ratio 1 3,
          approxRational (ratio 1 2) (ratio 0 1) == ratio 1 2,
          approxRational (ratio (negate 3) 10) (ratio 1 10) == ratio (negate 1) 3,
          approxRational (ratio 0 1) (ratio 2 1) == ratio 0 1,
          approxRational (ratio 3 10) (ratio (negate 1) 10) == ratio 1 3
        ]
output: |
  True
expression: |
  results
status: pass
reason: approxRational selects the unique simplest rational across positive, negative, exact, zero-crossing, and reversed intervals
