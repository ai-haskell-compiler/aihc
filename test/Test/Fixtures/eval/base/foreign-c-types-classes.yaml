extensions: []
modules:
  - |
    module Test where

    import Foreign.C.Types
    import Foreign.Ptr (IntPtr (..), WordPtr (..))

    equalityChecks :: [Bool]
    equalityChecks =
      [ (1 :: CInt) == 1
      , (1 :: CUInt) /= 2
      , (negate 1 :: CLLong) == negate 1
      , (1 :: CULLong) /= 2
      , (1 :: CSize) == 1
      , (negate 1 :: CPtrdiff) /= 1
      ]

    orderChecks :: [Bool]
    orderChecks =
      [ (negate 1 :: CInt) < 0
      , (200 :: CUChar) > 100
      , compare (3 :: CInt) 4 == LT
      , compare (3 :: CSize) 3 == EQ
      , compare (4 :: CULLong) 3 == GT
      , max (3 :: CLong) 4 == 4
      , min (negate 3 :: CShort) 4 == negate 3
      ]

    boundedChecks :: [Bool]
    boundedChecks =
      [ (minBound :: CInt) == negate 2147483648
      , (maxBound :: CInt) == 2147483647
      , (minBound :: CUInt) == 0
      , (maxBound :: CUInt) == 4294967295
      , (maxBound :: CULLong) + 1 == 0
      , (maxBound :: CSize) + 1 == 0
      , (minBound :: CChar) == negate 128
      ]

    enumChecks :: [Bool]
    enumChecks =
      [ [1 .. 4] == ([1, 2, 3, 4] :: [CInt])
      , [1, 3 .. 7] == ([1, 3, 5, 7] :: [CUInt])
      , succ (1 :: CLLong) == 2
      , pred (1 :: CSize) == 0
      , fromEnum (200 :: CUInt) == 200
      , toEnum 200 == (200 :: CULLong)
      ]

    numericChecks :: [Bool]
    numericChecks =
      [ (2 :: CInt) + 3 == 5
      , (2 :: CUInt) * 3 == 6
      , (2 :: CLLong) - 3 == negate 1
      , negate (3 :: CPtrdiff) == negate 3
      , abs (negate 3 :: CInt) == 3
      , signum (negate 3 :: CInt) == negate 1
      , signum (0 :: CULLong) == 0
      ]

    integralChecks :: [Bool]
    integralChecks =
      [ quot (17 :: CInt) 5 == 3
      , rem (17 :: CUInt) 5 == 2
      , div (negate 17 :: CLLong) 5 == negate 4
      , mod (negate 17 :: CInt) 5 == 3
      , quotRem (17 :: CSize) 5 == (3, 2)
      , divMod (negate 17 :: CPtrdiff) 5 == (negate 4, 3)
      , toInteger (255 :: CUChar) == 255
      , toInteger (negate 5 :: CInt) == negate 5
      , fromIntegral (300 :: CInt) == (300 :: CULLong)
      , fromIntegral (negate 1 :: CInt) == (4294967295 :: CUInt)
      ]

    pointerSizedChecks :: [Bool]
    pointerSizedChecks =
      [ (1 :: WordPtr) == 1
      , (1 :: WordPtr) /= 2
      , (1 :: IntPtr) < 2
      , compare (3 :: IntPtr) 3 == EQ
      , (maxBound :: WordPtr) + 1 == 0
      , (maxBound :: IntPtr) > 0
      , succ (1 :: WordPtr) == 2
      , mod (7 :: WordPtr) 4 == 3
      , div (negate 7 :: IntPtr) 2 == negate 4
      , toInteger (7 :: WordPtr) == 7
      , fromIntegral (7 :: WordPtr) == (7 :: IntPtr)
      ]

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (value : values) = value && allTrue values

    checks :: Bool
    checks =
      allTrue equalityChecks
        && allTrue orderChecks
        && allTrue boundedChecks
        && allTrue enumChecks
        && allTrue numericChecks
        && allTrue integralChecks
        && allTrue pointerSizedChecks
output: |
  True
expression: |
  checks
status: pass
reason: the C integer wrappers and the pointer-sized integers forward Eq, Ord, Enum, Bounded, Num, Real, and Integral to the type they wrap
