extensions: []
modules:
  - |
    module Test where

    import Data.Foldable (toList)
    import Data.Monoid (Alt (..), Dual (..), Product (..), Sum (..))
    import qualified Data.Monoid as Monoid
    import Data.Ord (Down (..))
    import Data.Semigroup (Arg (..), Max (..), Min (..))
    import qualified Data.Semigroup as Semigroup

    downInstances :: Bool
    downInstances =
      (Down (+ 1) <*> pure 1) == Down (2 :: Int)
        && (Down 3 >>= \n -> Down (n * 2)) == Down (6 :: Int)
        && toList (Down 'a') == "a"
        && fmap getDown (traverse Just (Down 'b')) == Just 'b'

    internalWrappers :: Bool
    internalWrappers =
      getSum (Sum 2 >>= \n -> Sum (n + 1)) == (3 :: Int)
        && getProduct (Product (* 3) <*> pure 4) == (12 :: Int)
        && getDual (pure 'c') == 'c'
        && sum (Sum (5 :: Int)) == 5
        && fmap getProduct (traverse Just (Product 'd')) == Just 'd'

    maybeWrappers :: Bool
    maybeWrappers =
      Monoid.getFirst (Monoid.First (Just (+ 1)) <*> pure 1) == Just (2 :: Int)
        && Monoid.getLast (Monoid.Last Nothing >>= \n -> pure (n :: Int)) == Nothing
        && toList (Monoid.First (Just 'e')) == "e"
        && null (Monoid.Last (Nothing :: Maybe Int))

    semigroupWrappers :: Bool
    semigroupWrappers =
      getMin (Min 1 >>= \n -> Min (n + 1)) == (2 :: Int)
        && getMax (pure 'f') == 'f'
        && Semigroup.getFirst (Semigroup.First (* 2) <*> Semigroup.First 5) == (10 :: Int)
        && toList (Semigroup.Last 'g') == "g"
        && toList (Arg 'k' 'v') == "v"
        && fmap (\(Arg _ value) -> value) (traverse Just (Arg 'k' 'w')) == Just 'w'

    altInstances :: Bool
    altInstances =
      getAlt (Alt [1, 2] >>= \n -> Alt [n, n * 10]) == [1, 10, 2, 20 :: Int]
        && length (Alt "abc") == 3
        && fmap getAlt (traverse Just (Alt "hi")) == Just "hi"

    answer :: Bool
    answer = downInstances && internalWrappers && maybeWrappers && semigroupWrappers && altInstances
output: |
  True
expression: |
  answer
status: pass
reason: Down and the monoid and semigroup wrappers have the Applicative, Monad, Foldable, and Traversable instances of base
