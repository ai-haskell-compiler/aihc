extensions:
  - MagicHash
modules:
  - |
    module Test where

    import GHC.Base (unpackCString#, unpackCStringUtf8#, unpackFoldrCString#)

    results :: Bool
    results =
      unpackCString# "abc\x00"# == "abc"
        && unpackCString# "\x00"# == ""
        && unpackCString# "\xFF\x00"# == "\xFF"
        && unpackCStringUtf8# "abc\x00"# == "abc"
        && unpackCStringUtf8# "a\xCE\xBBz\x00"# == ['a', '\x03BB', 'z']
        && unpackCStringUtf8# "\xE2\x82\xAC\x00"# == "\x20AC"
        && unpackCStringUtf8# "\xF0\x9F\x98\x80\x00"# == "\x1F600"
        && unpackFoldrCString# "abc\x00"# (:) [] == "abc"
        && unpackFoldrCString# "\x00"# (:) "tail" == "tail"
output: "True"
expression: results
status: pass
reason: GHC.Base unpacks a NUL-terminated Latin-1 or UTF-8 C string literal into a character list
