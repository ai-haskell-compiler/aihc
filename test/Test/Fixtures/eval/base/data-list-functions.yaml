          List.sortBy (\left right -> compare right left) [3, 1, 2 :: Int],
          List.sortOn negate [3, 1, 2 :: Int],
          List.insert 2 [1, 3 :: Int],
          List.delete 2 [1, 2, 3, 2 :: Int],
          [1, 2, 3, 4 :: Int] List.\\ [2, 4],
