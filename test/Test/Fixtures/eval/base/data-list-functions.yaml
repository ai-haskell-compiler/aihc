          length (List.nub [1, 1, 2, 3, 3 :: Int]),
          length (List.intercalate [0] [[1], [2], [3 :: Int]]),
          fromMaybe 0 (List.find (> 2) [1, 2, 3, 4 :: Int]),
          fromMaybe 0 (List.elemIndex 3 [1, 2, 3 :: Int]),
          sum (fst (List.partition even [1, 2, 3, 4 :: Int])),
          length (List.group [1, 1, 2, 3, 3, 3 :: Int]),
          length (List.tails [1, 2, 3 :: Int]),
          List.genericLength [1, 2, 3, 4 :: Int]
