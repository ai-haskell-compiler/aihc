          List.intersect [1, 2, 3] [2, 3, 4 :: Int],
          List.dropWhileEnd (== 0) [1, 0, 2, 0, 0 :: Int],
          List.unfoldr (\seed -> if seed > 3 then Nothing else Just (seed, seed + 1)) (1 :: Int),
