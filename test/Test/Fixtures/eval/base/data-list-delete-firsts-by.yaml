    module Test where

    import Data.List (deleteFirstsBy)
    import Prelude

    sameParity :: Int -> Int -> Bool
    sameParity left right = even left == even right

    checks :: [Bool]
    checks =
      [ deleteFirstsBy (==) [1, 2, 3, 2, 1] [2, 1] == [3, 2, 1],
        deleteFirstsBy (==) [1, 2, 3] [4] == [1, 2, 3],
        deleteFirstsBy (==) [] [1, 2] == ([] :: [Int]),
        deleteFirstsBy (==) [1, 2] [] == [1, 2],
        deleteFirstsBy sameParity [1, 2, 3, 4] [6, 7, 9] == [4]
      ]

    failures :: [Int]
    failures = [index | (index, False) <- zip [0 ..] checks]
