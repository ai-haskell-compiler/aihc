extensions: [TypeApplications]
modules:
  - |
    {-# LANGUAGE TypeApplications #-}
    module Test where
    import GHC.Exts (withDict)
    class Method a where
      method :: a -> Bool
    result :: Bool
    result = withDict @(Method Int) (1 :: Int) (method (1 :: Int))
expression: result
output: ""
error: |
  typecheck error: Test: unsolved constraint WithDict (Method Int) Int
status: fail
reason: WithDict rejects a value with the wrong method type.
