modules:
  - |
    module Test where

    import Control.Monad (mapAndUnzipM)
    import Prelude

    split :: Int -> Maybe (Int, Char)
    split value
      | value < 0 = Nothing
      | otherwise = Just (value * 2, if even value then 'e' else 'o')

    pairs :: Int -> [(Int, Int)]
    pairs value = [(value, 0), (0, value)]

    checks :: [Bool]
    checks =
      [ mapAndUnzipM split [1, 2, 3] == Just ([2, 4, 6], "oeo"),
        mapAndUnzipM split [1, -1, 3] == Nothing,
        mapAndUnzipM split [] == Just ([], ""),
        mapAndUnzipM pairs [1, 2] == [([1, 2], [0, 0]), ([1, 0], [0, 2]), ([0, 2], [1, 0]), ([0, 0], [1, 2])]
      ]

    failures :: [Int]
    failures = [index | (index, False) <- zip [0 ..] checks]
