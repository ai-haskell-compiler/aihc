extensions:
  - KindSignatures
modules:
  - |
    module Test where

    import Data.Functor.Classes
    import Data.Functor.Compose (Compose (..))
    import Data.Functor.Const (Const (..))
    import Data.Proxy (Proxy (..))
    import Prelude

    newtype Fix f = Fix (f (Fix f))

    instance (Eq1 f) => Eq (Fix f) where
      Fix a == Fix b = a == b

    instance (Ord1 f) => Ord (Fix f) where
      compare (Fix a) (Fix b) = compare a b

    instance (Show1 f) => Show (Fix f) where
      showsPrec d (Fix a) = showParen (d >= 11) (showString "Fix " . showsPrec 11 a)

    showLifted :: (Show1 f, Show a) => f a -> String
    showLifted value = show value

    readLifted :: (Read1 f, Read a) => String -> f a
    readLifted input = read input

    nested :: Fix Maybe
    nested = Fix (Just (Fix Nothing))

    checks :: [Bool]
    checks =
      [ nested == nested,
        nested /= Fix Nothing,
        compare (Fix Nothing) nested == LT,
        show nested == "Fix (Just (Fix Nothing))",
        showLifted (Const 'x' :: Const Char Int) == "Const 'x'",
        getConst (readLifted "Const 3" :: Const Int Bool) == 3,
        (readLifted "Proxy" :: Proxy Int) == Proxy,
        Compose (Just [1 :: Int]) == Compose (Just [1])
      ]

    failures :: [Int]
    failures = [index | (index, False) <- zip [0 ..] checks]
output: |
  []
expression: |
  failures
status: pass
reason: Eq1, Ord1, Read1, and Show1 have quantified superclasses as in base 4.18
