extensions:
  - MagicHash
modules:
  - |
    {-# LANGUAGE MagicHash #-}
    module Test where

    import GHC.Ptr (FunPtr (..), Ptr (..))

    class NFData a where
      rnf :: a -> ()

    rwhnf :: a -> ()
    rwhnf value = seq value ()

    instance NFData (Ptr a) where
      rnf = rwhnf

    instance NFData (FunPtr a) where
      rnf = rwhnf

    pointer :: Ptr ()
    pointer = Ptr "\0"#

    functionPointer :: FunPtr ()
    functionPointer = FunPtr "\0"#

    result :: Bool
    result =
      case rnf pointer of
        () ->
          case rnf functionPointer of
            () -> True
output: |
  True
expression: result
status: pass
