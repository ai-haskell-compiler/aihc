extensions: []
modules:
  - |
    module Test where

    import Data.Fixed
    import Data.Ratio ((%))

    data E128

    instance HasResolution E128 where
      resolution _ = 128

    ratio :: Integer -> Integer -> Rational
    ratio = (%)

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (True : values) = allTrue values
    allTrue (False : _) = False

    splitNegative :: Bool
    splitNegative =
      case properFraction (MkFixed (negate 1234) :: Milli) of
        (whole, fraction) ->
          whole == (negate 1 :: Integer) && fraction == MkFixed (negate 234)

    generalizedDivision :: Bool
    generalizedDivision =
      case divMod' (ratio (negate 7) 2) (ratio 2 1) of
        (whole, remainderValue) ->
          whole == (negate 2 :: Integer) && remainderValue == ratio 1 2

    results :: Bool
    results =
      allTrue
        [ resolution (MkFixed 0 :: Uni) == 1,
          resolution (MkFixed 0 :: Deci) == 10,
          resolution (MkFixed 0 :: Centi) == 100,
          resolution (MkFixed 0 :: Milli) == 1000,
          resolution (MkFixed 0 :: Micro) == 1000000,
          resolution (MkFixed 0 :: Nano) == 1000000000,
          resolution (MkFixed 0 :: Pico) == 1000000000000,
          (MkFixed 125 :: Centi) + MkFixed 250 == MkFixed 375,
          (MkFixed 2 :: Deci) * MkFixed 6 == MkFixed 1,
          (MkFixed 6 :: Deci) / MkFixed 4 == MkFixed 15,
          recip (MkFixed 4 :: Deci) == MkFixed 25,
          (fromInteger 12 :: Centi) == MkFixed 1200,
          (fromRational (ratio 1 3) :: Centi) == MkFixed 33,
          toRational (MkFixed 125 :: Centi) == ratio 5 4,
          truncate (MkFixed (negate 175) :: Centi) == (negate 1 :: Integer),
          floor (MkFixed (negate 175) :: Centi) == (negate 2 :: Integer),
          ceiling (MkFixed (negate 175) :: Centi) == (negate 1 :: Integer),
          round (MkFixed 250 :: Centi) == (2 :: Integer),
          round (MkFixed 350 :: Centi) == (4 :: Integer),
          splitNegative,
          succ (MkFixed 0 :: Milli) == MkFixed 1,
          show (MkFixed 12345 :: Milli) == "12.345",
          show (MkFixed (negate 12345) :: Milli) == "-12.345",
          show (MkFixed 12345 :: Uni) == "12345.0",
          showFixed True (MkFixed 10000 :: Milli) == "10",
          showFixed False (MkFixed 10000 :: Milli) == "10.000",
          show (MkFixed 1 :: Fixed E128) == "0.008",
          div' (ratio (negate 7) 2) (ratio 2 1) == (negate 2 :: Integer),
          mod' (ratio (negate 7) 2) (ratio 2 1) == ratio 1 2,
          generalizedDivision
        ]
output: |
  True
expression: |
  results
