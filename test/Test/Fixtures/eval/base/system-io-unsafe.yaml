extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.IO (IO(..))
    import GHC.Int (Int(..))
    import System.IO.Unsafe (unsafePerformIO)

    test = IO (\state -> (# state, I# 42# #))
output: |
  I# 42
expression: |
  unsafePerformIO test
status: pass
reason: evaluates System.IO.Unsafe.unsafePerformIO running an IO state transformer with realWorld#
