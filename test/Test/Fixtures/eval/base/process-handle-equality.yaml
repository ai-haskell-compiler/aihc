      second <- newEmptyMVar
      let file = FileHandle "first" first
          alias = FileHandle "alias" first
          distinct = FileHandle "first" second
          duplex = DuplexHandle "duplex" first second
          duplexAlias = DuplexHandle "alias" first first
          duplexDistinct = DuplexHandle "duplex" second first
      return (first == first && first /= second
        && file == alias && file /= distinct
        && duplex == duplexAlias && duplex /= duplexDistinct
        && file /= duplex && duplex /= file)
