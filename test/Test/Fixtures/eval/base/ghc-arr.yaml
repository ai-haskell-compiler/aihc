extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where

    import GHC.Arr
    import GHC.ST (ST, runST)

    newIntSTArray :: (Int, Int) -> Int -> ST s (STArray s Int Int)
    newIntSTArray = newSTArray

    baseArray :: Array Int Int
    baseArray = listArray (1, 3) [10, 20, 30]

    updatedArray :: Array Int Int
    updatedArray = baseArray // [(2, 42)]

    accumulatedArray :: Array Int Int
    accumulatedArray = accumArray (+) 0 (0, 2) [(0, 1), (0, 2), (2, 5)]

    mappedArray :: Array Int Int
    mappedArray = amap (\value -> value + 1) updatedArray

    remappedArray :: Array Int Int
    remappedArray = ixmap (0, 2) (\index -> index + 1) updatedArray

    mutableResults :: (Int, Int, Bool, Bool)
    mutableResults = runST (do
      first <- newIntSTArray (0, 2) 7
      second <- newIntSTArray (0, 2) 7
      writeSTArray first 1 99
      value <- readSTArray first 1
      frozen <- freezeSTArray first
      writeSTArray first 1 100
      return (value, frozen ! 1, first == first, first == second))

    thawResults :: ([Int], [Int])
    thawResults = runST (do
      mutable <- thawSTArray baseArray
      writeSTArray mutable 1 77
      changed <- freezeSTArray mutable
      return (elems baseArray, elems changed))

    arrayResults :: ((Int, Int), [Int], [Int], [(Int, Int)])
    arrayResults = (bounds updatedArray, indices updatedArray, elems updatedArray, assocs updatedArray)

    foldResults :: (Int, Int, Int, Int)
    foldResults =
      ( foldlElems (+) 0 updatedArray,
        foldrElems (+) 0 updatedArray,
        foldl1Elems (+) updatedArray,
        foldr1Elems (+) updatedArray
      )
output: |
  (((((I# 1),(I# 3)),(: (I# 1) (: (I# 2) (: (I# 3) []))),(: (I# 10) (: (I# 42) (: (I# 30) []))),(: ((I# 1),(I# 10)) (: ((I# 2),(I# 42)) (: ((I# 3),(I# 30)) [])))),((: (I# 3) (: (I# 0) (: (I# 5) []))),(: (I# 11) (: (I# 43) (: (I# 31) []))),(: (I# 10) (: (I# 42) (: (I# 30) []))))),(((I# 99),(I# 99),True,False),((: (I# 10) (: (I# 20) (: (I# 30) []))),(: (I# 77) (: (I# 20) (: (I# 30) [])))),((I# 82),(I# 82),(I# 82),(I# 82)),True))
expression: |
  ( (arrayResults, (elems accumulatedArray, elems mappedArray, elems remappedArray)),
    (mutableResults, thawResults, foldResults, baseArray == listArray (1, 3) [10, 20, 30])
  )
