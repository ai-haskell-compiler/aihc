modules:
  - |
    module Test where

    import qualified Data.Bifunctor as Bifunctor
    import Data.Char (digitToInt, intToDigit)
    import Numeric (showHex, showOct)

    results :: ((Int, Int), (Int, Int), Either Int Int, Either Int Int, Bool, Bool, Bool, Int)
    results =
      ( Bifunctor.first (+ 1) (1 :: Int, 2 :: Int),
        Bifunctor.second (* 2) (1 :: Int, 2 :: Int),
        Bifunctor.bimap (+ 1) (* 2) (Left 1 :: Either Int Int),
        Bifunctor.bimap (+ 1) (* 2) (Right 1 :: Either Int Int),
        showHex (255 :: Int) "" == "ff",
        showOct (8 :: Int) "" == "10",
        intToDigit 11 == 'b',
        digitToInt 'f'
      )
