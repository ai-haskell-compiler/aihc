      , toIntegralSized (42 :: Int) == (Just 42 :: Maybe Integer)
      ]

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (value : values) = value && allTrue values

    checks :: Bool
    checks = allTrue intChecks && allTrue boolChecks && allTrue integerChecks && allTrue defaultAndExtraChecks
