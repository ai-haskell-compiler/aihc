      , getAnd (unsafeShiftR (And 8) 2 :: And Int) == 2
      , getIor (Ior 12 .|. Ior 3 :: Ior Int) == 15
      , getXor (xor (Xor 12) (Xor 10) :: Xor Int) == 6
