    integerChecks :: [Bool]
    integerChecks =
      [ ((bit 130 .|. bit 5) .&. complement (bit 5) :: Integer) == bit 130
      , xor (bit 130 :: Integer) (bit 129) == bit 130 + bit 129
      , complement (0 :: Integer) == negate 1
