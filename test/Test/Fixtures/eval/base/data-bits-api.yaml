      , shiftR (bit 130 + 3 :: Integer) 129 == 2
      , shiftR (bit 130 + bit 64 + 1 :: Integer) 64 == bit 66 + 1
      , shiftR (negate 3 :: Integer) 1 == negate 2
      , rotate (3 :: Integer) (negate 1) == 1
      , testBit (negate 2 :: Integer) 130
