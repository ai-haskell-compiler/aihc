extensions:
  - MagicHash
modules:
  - |
    module Test where

    import Data.Functor.Identity (Identity (..))
    import GHC.Prim (raise#)

    data Unit = Unit

    raisedUnit :: Unit
    raisedUnit = raise# Unit

    result :: Bool
    result = seq (Identity raisedUnit) True
output: ""
exception: Unit
expression: result
status: pass
reason: Identity remains a representational newtype, so seq observes through it and raises its field's Unit exception
