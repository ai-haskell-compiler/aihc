extensions:
  - MagicHash
dependencies:
  - aihc-base
  - aihc-prim
modules:
  - |
    module Test where

    import Data.Functor.Identity (Identity (..))
    import GHC.Prim (raise#)

    data Unit = Unit

    result :: Bool
    result = seq (Identity (raise# Unit)) True
