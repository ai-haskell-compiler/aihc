extensions: []
modules:
  - |
    module Test where

    import Data.Bifoldable (bifoldMap)
    import Data.Bifoldable1 (bifoldMap1)
    import Data.Bitraversable (bitraverse)
    import Data.Semigroup (Arg (..))

    argInstances :: Bool
    argInstances =
      bifoldMap show show (Arg (1 :: Int) True) == "1True"
        && bifoldMap1 (: []) (: []) (Arg 'a' 'b') == "ab"
        && fmap (\(Arg key value) -> (key, value)) (bitraverse Just Just (Arg 'c' 'd')) == Just ('c', 'd')

    tupleInstances :: Bool
    tupleInstances =
      bifoldMap1 (: []) (: []) ((), (), 'e', 'f') == "ef"
        && bifoldMap (: []) (: []) ((), (), (), 'g', 'h') == "gh"
        && bifoldMap1 (: []) (: []) ((), (), (), 'i', 'j') == "ij"
        && bitraverse Just Just ((), (), (), 'k', 'l') == Just ((), (), (), 'k', 'l')

    answer :: Bool
    answer = argInstances && tupleInstances
output: |
  True
expression: |
  answer
status: pass
reason: Arg and the larger tuples have the Bifoldable, Bifoldable1, and Bitraversable instances of base
