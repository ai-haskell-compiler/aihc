extensions: []
modules:
  - |
    module Test where

    import Data.Ratio

    ratio :: Integer -> Integer -> Rational
    ratio = (%)

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (True : values) = allTrue values
    allTrue (False : _) = False

    results :: Bool
    results =
      allTrue
        [ numerator (ratio 6 (negate 8)) == negate 3,
          denominator (ratio 6 (negate 8)) == 4,
          numerator (ratio 0 (negate 5)) == 0,
          denominator (ratio 0 (negate 5)) == 1,
          ratio 1 2 + ratio 1 3 == ratio 5 6,
          ratio 3 4 - ratio 5 6 == ratio (negate 1) 12,
          ratio 2 3 * ratio 9 4 == ratio 3 2,
          ratio 2 3 / ratio 4 9 == ratio 3 2,
          recip (ratio (negate 2) 3) == ratio (negate 3) 2,
          abs (ratio (negate 2) 3) == ratio 2 3,
          signum (ratio (negate 2) 3) == ratio (negate 1) 1,
          ratio 100000000000000000000 25000000000000000000 == ratio 4 1,
          ratio 1 2 < ratio 2 3,
          compare (ratio 3 4) (ratio 6 8) == EQ,
          show (ratio (negate 3) 4) == "(-3) % 4"
        ]
output: |
  True
expression: |
  results
status: pass
reason: Data.Ratio constructs canonical ratios and implements numeric, ordering, and display behavior
