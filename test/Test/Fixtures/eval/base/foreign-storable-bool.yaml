extensions: []
modules:
  - |
    module Test where

    import Data.Int (Int32)
    import Foreign.Marshal.Alloc (alloca, allocaBytes)
    import Foreign.Marshal.Utils (with)
    import Foreign.Ptr (Ptr, castPtr)
    import Foreign.Storable (Storable (..))
    import System.IO.Unsafe (unsafePerformIO)

    -- GHC stores a Bool as a C int: four bytes, zero for False and one for True.
    sizeChecks :: [Bool]
    sizeChecks =
      [ sizeOf True == 4
      , alignment True == 4
      , sizeOf () == 0
      ]

    roundTrip :: IO [Bool]
    roundTrip =
      allocaBytes 16 $ \base -> do
        poke base True
        pokeElemOff base 1 False
        pokeElemOff base 2 True
        first <- peek base
        second <- peekElemOff base 1
        third <- peekElemOff base 2
        rawFalse <- peekElemOff (castPtr base :: Ptr Int32) 1
        rawTrue <- peekElemOff (castPtr base :: Ptr Int32) 2
        pokeElemOff (castPtr base :: Ptr Int32) 3 7
        nonZero <- peekElemOff base 3
        return [first, not second, third, rawFalse == 0, rawTrue == 1, nonZero]

    marshalled :: IO [Bool]
    marshalled = do
      stored <- with False peek
      allocated <- alloca (\pointer -> poke pointer True >> peek pointer)
      unit <- with () peek
      return [not stored, allocated, unit == ()]

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (value : values) = value && allTrue values

    checks :: Bool
    checks =
      allTrue sizeChecks
        && allTrue (unsafePerformIO roundTrip)
        && allTrue (unsafePerformIO marshalled)
output: |
  True
expression: |
  checks
status: pass
reason: Storable stores a Bool as a four-byte C int, as GHC does, and () takes no bytes
