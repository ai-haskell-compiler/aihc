modules:
  - |
    module Test where

    import Data.IORef (writeIORef)
    import Data.Word (Word8)
    import Foreign.Marshal.Array (peekArray, withArray)
    import Foreign.Marshal.Utils (copyBytes)
    import Foreign.Ptr (nullPtr, plusPtr)
    import GHC.IO.Buffer (Buffer (..), BufferState (..), newByteBuffer, withRawBuffer)
    import GHC.IO.Handle.FD (fdToHandle)
    import GHC.IO.Handle.Internals (wantReadableHandle_, wantWritableHandle)
    import GHC.IO.Handle.Types (Handle__ (..))
    import System.IO

    main :: IO Bool
    main = withArray ([120, 65, 66, 67, 68, 69, 70, 121] :: [Word8]) $ \source -> do
      input <- openBinaryFile "/dev/null" ReadMode
      buffer <- newByteBuffer 8 ReadBuffer
      withRawBuffer (bufRaw buffer) $ \raw -> copyBytes raw source 8
      wantReadableHandle_ "fixture" input $ \state ->
        writeIORef (haByteBuffer state) buffer {bufL = 1, bufR = 7}
      readOK <- withArray (replicate 8 (99 :: Word8)) $ \target -> do
        zero <- hGetBuf input nullPtr 0
        first <- hGetBuf input (target `plusPtr` 1) 2
        second <- hGetBufSome input (target `plusPtr` 3) 3
        lastByte <- hGetBuf input (target `plusPtr` 6) 1
        end <- hGetBuf input (target `plusPtr` 6) 1
        actual <- peekArray 8 target
        return (zero == 0 && first == 2 && second == 3 && lastByte == 1 && end == 0
          && actual == [99, 65, 66, 67, 68, 69, 70, 99])
      hClose input
      output <- fdToHandle 1
      hSetBuffering output (BlockBuffering (Just 8))
      outputBuffer <- newByteBuffer 8 WriteBuffer
      wantWritableHandle "fixture" output $ \state ->
        writeIORef (haByteBuffer state) outputBuffer
      hPutBuf output nullPtr 0
      hPutBuf output (source `plusPtr` 1) 3
      written <- hPutBufNonBlocking output (source `plusPtr` 4) 3
      hPutBuf output (source `plusPtr` 1) 2
      hFlush output
      return (readOK && written == 3)
