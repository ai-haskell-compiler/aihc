extensions:
  - MagicHash
modules:
  - |
    module Test where

    import System.IO (hPutStr, stdout)

    writeWithMonad :: IO ()
    writeWithMonad = putStr "monad\n" >>= \ignored -> return ()

    main :: IO ()
    main = do
      writeWithMonad
      putChar 'A'
      putStr "BC"
      putStrLn ""
      putStrLn "line"
      hPutStr stdout "handle\n"
      print True
      print (42 :: Int)
stdout: |
  monad
  ABC
  line
  handle
  True
  42
output: |
  ()
expression: main
status: pass
reason: Prelude output and System.IO.hPutStr share stdout text handling
