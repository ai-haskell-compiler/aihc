    module Test where

    import Data.Bits
    import Data.Int
    import Data.Word

    equalityChecks :: [Bool]
    equalityChecks =
      [ (1 :: Word16) == 1
      , (1 :: Word32) /= 2
      , (negate 1 :: Int8) == negate 1
      , (negate 1 :: Int16) /= 1
      , (5 :: Int32) == 5
      , (5 :: Int64) /= 6
      ]

    orderChecks :: [Bool]
    orderChecks =
      [ (1 :: Word16) < 2
      , (200 :: Word8) > 100
      , (negate 1 :: Int8) < 0
      , compare (3 :: Int64) 4 == LT
      , compare (3 :: Int32) 3 == EQ
      , max (3 :: Word32) 4 == 4
      , min (negate 3 :: Int16) 4 == negate 3
      ]

    boundedChecks :: [Bool]
    boundedChecks =
      [ (minBound :: Word8) == 0
      , (maxBound :: Word8) == 255
      , (maxBound :: Word16) == 65535
      , (maxBound :: Word32) == 4294967295
      , (maxBound :: Word64) + 1 == 0
      , (maxBound :: Word) + 1 == 0
      , (minBound :: Int8) == negate 128
      , (maxBound :: Int8) == 127
      , (maxBound :: Int16) == 32767
      , (minBound :: Int32) == negate 2147483648
      , (maxBound :: Int64) + 1 == minBound
      ]

    enumChecks :: [Bool]
    enumChecks =
      [ [1 .. 4] == ([1, 2, 3, 4] :: [Word8])
      , [1, 3 .. 7] == ([1, 3, 5, 7] :: [Int16])
      , [4, 3 .. 1] == ([4, 3, 2, 1] :: [Word32])
      , [253 ..] == ([253, 254, 255] :: [Word8])
      , succ (1 :: Word32) == 2
      , pred (1 :: Int64) == 0
      , fromEnum (200 :: Word8) == 200
      , fromEnum (negate 5 :: Int32) == negate 5
      , toEnum 200 == (200 :: Word8)
      , toEnum (negate 5) == (negate 5 :: Int16)
      ]

    integralChecks :: [Bool]
    integralChecks =
      [ quot (200 :: Word8) 7 == 28
      , rem (200 :: Word8) 7 == 4
      , div (200 :: Word16) 7 == 28
      , mod (200 :: Word32) 7 == 4
      , quot (negate 7 :: Int8) 2 == negate 3
      , rem (negate 7 :: Int8) 2 == negate 1
      , div (negate 7 :: Int16) 2 == negate 4
      , mod (negate 7 :: Int32) 2 == 1
      , quotRem (17 :: Int64) 5 == (3, 2)
      , divMod (negate 17 :: Int64) 5 == (negate 4, 3)
      , toInteger (255 :: Word8) == 255
      , toInteger (negate 5 :: Int32) == negate 5
      , toInteger (maxBound :: Word64) > 0
      , toInteger (maxBound :: Word) > 0
      , quot (maxBound :: Word64) 2 > 0
      , fromIntegral (300 :: Int16) == (44 :: Word8)
      , fromIntegral (negate 1 :: Int8) == (255 :: Word8)
      , fromIntegral (maxBound :: Word64) == (negate 1 :: Int64)
      , even (4 :: Word16)
      , odd (7 :: Int8)
      , gcd (12 :: Word32) 18 == 6
      ]

    bitsChecks :: [Bool]
    bitsChecks =
      [ (240 .&. 60 :: Word8) == 48
      , (240 .|. 15 :: Word16) == 255
      , xor (255 :: Word32) 15 == 240
      , complement (0 :: Word8) == 255
      , complement (0 :: Int16) == negate 1
      , shiftL (1 :: Word8) 7 == 128
      , shiftL (1 :: Word8) 8 == 0
      , shiftR (128 :: Word8) 7 == 1
      , shiftR (128 :: Word8) 8 == 0
      , shift (1 :: Word16) 4 == 16
      , shift (16 :: Word16) (negate 4) == 1
      , shiftR (negate 8 :: Int8) 1 == negate 4
      , shiftR (negate 1 :: Int8) 7 == negate 1
      , shiftL (1 :: Int8) 7 == negate 128
      , shiftL (1 :: Int64) 62 == 4611686018427387904
      , unsafeShiftL (3 :: Word32) 2 == 12
      , unsafeShiftR (12 :: Word32) 2 == 3
      , rotateL (129 :: Word8) 1 == 3
      , rotateR (1 :: Word8) 1 == 128
      , rotate (1 :: Word8) 8 == 1
      , rotate (1 :: Word16) (negate 1) == 32768
      , popCount (255 :: Word8) == 8
      , popCount (negate 1 :: Int8) == 8
      , popCount (maxBound :: Word64) == 64
      , testBit (128 :: Word8) 7
      , not (testBit (128 :: Word8) 8)
      , testBit (negate 1 :: Int16) 15
      , bit 3 == (8 :: Word16)
      , (bit 7 :: Int8) == negate 128
      , setBit (8 :: Word8) 1 == 10
      , clearBit (10 :: Word8) 1 == 8
      , complementBit (10 :: Int32) 2 == 14
      , (zeroBits :: Word32) == 0
      , bitSizeMaybe (0 :: Word64) == Just 64
      , bitSize (0 :: Int16) == 16
      , isSigned (0 :: Int32)
      , not (isSigned (0 :: Word64))
      , finiteBitSize (0 :: Word32) == 32
      , finiteBitSize (0 :: Int8) == 8
      , countLeadingZeros (1 :: Word32) == 31
      , countLeadingZeros (0 :: Word16) == 16
      , countLeadingZeros (negate 1 :: Int8) == 0
      , countTrailingZeros (8 :: Word8) == 3
      , countTrailingZeros (0 :: Word16) == 16
      , countTrailingZeros (negate 8 :: Int32) == 3
      ]

    allTrue :: [Bool] -> Bool
    allTrue [] = True
    allTrue (value : values) = value && allTrue values

    checks :: Bool
    checks =
      allTrue equalityChecks
        && allTrue orderChecks
        && allTrue boundedChecks
        && allTrue enumChecks
        && allTrue integralChecks
        && allTrue bitsChecks
