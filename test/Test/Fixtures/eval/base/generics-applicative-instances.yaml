extensions: [TypeOperators]
modules:
  - |
    module Test where

    import GHC.Generics (Par1 (..), Rec1 (..), U1 (..), (:*:) (..), (:.:) (..))

    par1 :: Bool
    par1 = unPar1 (Par1 (+ 1) <*> pure 1) == (2 :: Int) && unPar1 (Par1 2 >>= \n -> Par1 (n * 3)) == (6 :: Int)

    unit :: Bool
    unit = case (pure 'a' :: U1 Char) >>= \_ -> U1 :: U1 Int of U1 -> True

    rec1 :: Bool
    rec1 = unRec1 (Rec1 [1, 2] >>= \n -> Rec1 [n, n]) == [1, 1, 2, 2 :: Int]

    productRep :: Bool
    productRep =
      case (Par1 (+ 1) :*: Rec1 [(* 2)]) <*> (Par1 1 :*: Rec1 [5]) of
        Par1 left :*: Rec1 right -> left == (2 :: Int) && right == [10]

    composition :: Bool
    composition = unComp1 (Comp1 (Just [(+ 1)]) <*> Comp1 (Just [1, 2])) == Just [2, 3 :: Int]

    answer :: Bool
    answer = par1 && unit && rec1 && productRep && composition
output: |
  True
expression: |
  answer
status: pass
reason: the generic representation types have the Applicative and Monad instances of base
