extensions: []
modules:
  - |
    module Test where

    import Data.Data

    -- The shape of a hand-written GHC instance: each constructor names the
    -- data type that lists it, and the data type lists the constructors.
    firstConstr :: Constr
    firstConstr = mkConstr sampleDataType "First" [] Prefix

    secondConstr :: Constr
    secondConstr = mkConstr sampleDataType "Second" ["field"] Prefix

    thirdConstr :: Constr
    thirdConstr = mkConstr sampleDataType ":&:" [] Infix

    sampleDataType :: DataType
    sampleDataType = mkDataType "Test.Sample" [firstConstr, secondConstr, thirdConstr]

    results :: [Bool]
    results =
      [ constrIndex firstConstr == 1,
        constrIndex secondConstr == 2,
        constrIndex thirdConstr == 3,
        map constrIndex (dataTypeConstrs sampleDataType) == [1, 2, 3],
        showConstr (indexConstr sampleDataType 2) == "Second",
        constrFields (indexConstr sampleDataType 2) == ["field"],
        constrIndex (indexConstr sampleDataType 3) == 3
      ]
output: ": True (: True (: True (: True (: True (: True (: True []))))))"
