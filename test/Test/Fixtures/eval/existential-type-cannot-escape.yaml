extensions:
  - ExistentialQuantification
modules:
  - |
    {-# LANGUAGE ExistentialQuantification #-}
    module Test where

    data Box = forall a. Box a

    escape (Box value) = value
output: ""
expression: |
  escape
error: 'typecheck error: Test: existential type variable escapes its pattern-match branch: a'
status: fail
reason: a constructor-local existential type must not escape its pattern-match branch
