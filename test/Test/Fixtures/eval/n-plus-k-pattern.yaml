modules:
  - |
    {-# LANGUAGE NPlusKPatterns #-}
    module Test where

    import Prelude

    factorial :: Integer -> Integer
    factorial 0 = 1
    factorial (n+1) = (n + 1) * factorial n

    -- No signature: the type comes from the methods of the pattern.
    predecessor (n+1) = Just n
    predecessor _ = Nothing

    classify :: Int -> String
    classify value =
      case value of
        n+10 -> "big " ++ show n
        m@(n+1) -> "small " ++ show (m, n)
        _ -> "none"

    heads :: [Int] -> Int
    heads (n+2 : rest) = n + heads rest
    heads (_ : rest) = heads rest
    heads [] = 0

    -- A pattern binding and a lambda use other match paths.
    letBound :: Int
    letBound = let (k+1) = 5 in k

    lambdaBound :: Int -> Int
    lambdaBound = \(k+3) -> k

    main :: IO ()
    main = do
      print (factorial 5)
      print (predecessor (3 :: Int), predecessor (0 :: Int))
      print (map classify [12, 3, 0, -1])
      print (heads [5, 1, 2, 7])
      print (letBound, lambdaBound 10)
