modules:
  - |
    module Test where

    import Control.Concurrent (rtsSupportsBoundThreads, threadWaitWrite, threadWaitWriteSTM)
    import Control.Monad (mplus, mzero)
    import Data.IORef (atomicModifyIORef', mkWeakIORef, newIORef, readIORef)
    import Foreign.C.Error (throwErrnoIfMinus1RetryMayBlock)
    import Foreign.C.Types (CInt)
    import GHC.Conc (atomically, closeFdWith, newTVarIO, readTVar, threadDelay, writeTVar)
    import qualified GHC.Event as Ev
    import GHC.Weak (finalize)
    import System.Posix.Types (Fd (..))
    import Text.ParserCombinators.ReadP (readP_to_S)
    import Text.ParserCombinators.ReadPrec (readPrec_to_S)
    import qualified Text.Read.Lex as L
    import Prelude

    main :: IO ()
    main = do
      print rtsSupportsBoundThreads
      print (map snd (readP_to_S (L.expect (L.Ident "Socket")) "  Socket rest"))
      print (length (readP_to_S (L.expect (L.Ident "Socket")) "Other"))
      print (readPrec_to_S (mzero `mplus` return 'x') 0 "")
      print (1 :: Int, 2 :: Int, 3 :: Int, 4 :: Int, 5 :: Int, 6 :: Int, 7 :: Int, 8 :: Int)
      blocks <- newIORef (0 :: Int)
      result <- throwErrnoIfMinus1RetryMayBlock "test" (return (7 :: CInt)) (atomicModifyIORef' blocks (\n -> (n + 1, ())))
      print result
      readIORef blocks >>= print
      reference <- newIORef ()
      finalized <- newIORef False
      weak <- mkWeakIORef reference (atomicModifyIORef' finalized (\_ -> (True, ())))
      finalize weak
      readIORef finalized >>= print
      closed <- newIORef (Fd 0)
      closeFdWith (\fd -> atomicModifyIORef' closed (\_ -> (fd, ()))) (Fd 9)
      readIORef closed >>= print
      threadWaitWrite (Fd 2)
      (waitWritable, stopWait) <- threadWaitWriteSTM (Fd 2)
      atomically waitWritable
      stopWait
      putStrLn "writable"
      manager <- Ev.getSystemEventManager
      putStrLn (maybe "no event manager" (const "event manager") manager)
      timers <- Ev.getSystemTimerManager
      cancelledFired <- newTVarIO False
      key <- Ev.registerTimeout timers 1000 (atomically (writeTVar cancelledFired True))
      Ev.unregisterTimeout timers key
      threadDelay 5000
      atomically (readTVar cancelledFired) >>= print
