extensions:
  - PatternSynonyms
modules:
  - |
    {-# LANGUAGE PatternSynonyms #-}
    module Test where
    data L a = N | C a (L a)
    pattern Head x <- C x _
    first (Head x) = x
output: |
  'a'
expression: |
  first (C 'a' (C 'b' N))
status: pass
reason: matches through a unidirectional pattern synonym
