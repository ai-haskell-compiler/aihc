extensions:
  - PatternSynonyms
modules:
  - |
    {-# LANGUAGE PatternSynonyms #-}
    module Lib (Expr (.., Sub), Flag (..)) where
    data Flag = On | Off
    data Expr = Lit Flag | Add Expr Expr | Neg Expr
    pattern Sub a b = Add a (Neg b)
  - |
    module Mid (Expr (..), Flag (..)) where
    import Lib
  - |
    module Test where
    import Mid (Expr (..), Flag (..))
    swap (Sub a b) = Sub b a
    swap e = e
output: |
  Add (Lit Off) (Neg (Lit On))
expression: |
  swap (Sub (Lit On) (Lit Off))
status: pass
reason: uses a pattern synonym that a module re-exports through T(..)
