modules:
  - |
    module Test where

    import Control.Exception (ArithException, evaluate, try)
    import Data.Bits (popCount, shiftL, shiftR, (.&.))
    import Numeric.Natural (Natural, minusNaturalMaybe)
    import Prelude

    -- Every case here crosses the NS/NB boundary in one direction or the
    -- other, which is where a representation that is not a plain newtype
    -- over Integer can go wrong.
    main :: IO ()
    main = do
      print (18446744073709551615 + 1 :: Natural)
      print (18446744073709551616 - 1 :: Natural)
      print (4294967296 * 4294967296 :: Natural)
      print (quotRem 18446744073709551618 7 :: (Natural, Natural))
      print (toInteger (18446744073709551616 :: Natural))
      print (compare (18446744073709551616 :: Natural) 18446744073709551615)
      print (18446744073709551616 == (18446744073709551616 :: Natural))
      print (minusNaturalMaybe 3 5 :: Maybe Natural)
      print (minusNaturalMaybe 5 3 :: Maybe Natural)
      print (popCount (18446744073709551616 :: Natural))
      print (shiftR (18446744073709551616 :: Natural) 64)
      print (shiftL (1 :: Natural) 64)
      print (18446744073709551616 .&. (18446744073709551615 :: Natural))
      print ([1 .. 5] :: [Natural])
      -- Two small values add, subtract and multiply with word primops.
      print (fromIntegral (maxBound :: Word) :: Natural, fromIntegral (7 :: Word) :: Natural)
      print (3 * 4 + 5 - 2 :: Natural, 18446744073709551615 * 18446744073709551615 :: Natural)
      print (18446744073709551616 + 18446744073709551616 :: Natural, 18446744073709551616 * 2 :: Natural)
      print (36893488147419103232 - 18446744073709551616 :: Natural, 18446744073709551617 - 2 :: Natural)
      small <- try (evaluate (3 - 5 :: Natural)) :: IO (Either ArithException Natural)
      print small
      large <- try (evaluate (5 - 18446744073709551616 :: Natural)) :: IO (Either ArithException Natural)
      print large
