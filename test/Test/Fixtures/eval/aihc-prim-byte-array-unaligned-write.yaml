extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where

    import GHC.IO (IO (..))
    import GHC.Int (Int (..))
    import GHC.Prim
    import System.IO.Unsafe (unsafePerformIO)

    data Results = Results Int Int Int Int Int

    test :: IO Results
    test = IO (\state -> case newByteArray# 16# state of
      (# state1, buffer #) -> case setByteArray# buffer 0# 16# 0# state1 of
        state2 -> case writeWord8ArrayAsWord64# buffer 1# (wordToWord64# 0x0807060504030201##) state2 of
          state3 -> case writeWord8ArrayAsWord16# buffer 9# (wordToWord16# 0xbbaa##) state3 of
            state4 -> case writeWord8ArrayAsWord32# buffer 11# (wordToWord32# 0xddccbbaa##) state4 of
              state5 -> case readWord8ArrayAsWord16# buffer 1# state5 of
                (# state6, low #) -> case readWord8ArrayAsWord32# buffer 3# state6 of
                  (# state7, middle #) -> case readWord8ArrayAsWord64# buffer 1# state7 of
                    (# state8, wide #) -> case readWord8ArrayAsWord16# buffer 9# state8 of
                      (# state9, tail16 #) -> case readWord8ArrayAsWord32# buffer 11# state9 of
                        (# state10, tail32 #) ->
                          (# state10,
                             Results
                               (I# (word2Int# (word16ToWord# low)))
                               (I# (word2Int# (word32ToWord# middle)))
                               (I# (word2Int# (word64ToWord# wide)))
                               (I# (word2Int# (word16ToWord# tail16)))
                               (I# (word2Int# (word32ToWord# tail32))) #))
output: |
  Results (I# 513) (I# 100992003) (I# 578437695752307201) (I# 48042) (I# 3721182122)
expression: |
  unsafePerformIO test
status: pass
reason: byte array writes and reads words at an unaligned byte offset
