extensions:
  - DeriveFunctor
  - ExistentialQuantification
  - StandaloneDeriving
modules:
  - |
    {-# LANGUAGE DeriveFunctor, ExistentialQuantification, StandaloneDeriving #-}
    module Test where

    import Prelude
    data Box a = forall b. Show b => Box b a
    deriving instance Functor Box
    result :: Bool
    result = case fmap (+ 1) (Box True (3 :: Int)) of
      Box hidden value -> show hidden == "True" && value == 4
output: |
  True
expression: |
  result
status: pass
reason: A standalone Functor instance maps an existential constructor and keeps its constructor dictionary.
