extensions:
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - MagicHash
modules:
  - |
    module Test where
    foreign import prim raise# :: a -> b
    boom x = raise# x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  module 1.Test where

  foreign import prim 1.vraise# :: ∀(a : 2.tType) (b : 2.tType). a → b

  pub val 1.vboom :: ∀(a : 2.tType) (b : 2.tType). a → b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      λ(x : a).
        1.vraise# @a @b x
status: pass
reason: A use of a foreign import prim stays an ordinary application.
