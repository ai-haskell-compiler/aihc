extensions:
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - MagicHash
modules:
  - |
    module Test where
    foreign import prim unsafeCoerce# :: a -> b
    unsafeCoerce :: a -> b
    unsafeCoerce = unsafeCoerce#
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  foreign import prim 1.vunsafeCoerce# :: ∀(a : 2.tType) (b : 2.tType). a → b

  pub val 1.vunsafeCoerce :: ∀(a : 2.tType) (b : 2.tType). a → b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      1.vunsafeCoerce# @a @b
status: pass
reason: A signed polymorphic alias uses its type lambda binders in the right-hand side.
