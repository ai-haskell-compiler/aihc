  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  foreign import prim 1.vunsafeCoerce# :: ∀(a{14} : 2.tType) (b{15} : 2.tType). a{14} → b{15}

  pub val 1.vunsafeCoerce :: ∀(a{18} : 2.tType) (b{19} : 2.tType). a{18} → b{19}
   = Λ(a{18} : 2.tType).
    Λ(b{19} : 2.tType).
      1.vunsafeCoerce# @a{18} @b{19}
status: pass
reason: A signed polymorphic alias uses its type lambda binders in the right-hand side.
