extensions: []
modules:
  - |
    module Test where

    data Flag = Off | On

    consume :: Flag -> Flag
    consume value = value

    switch :: Flag -> Flag
    switch value =
      consume
        (case value of
          Off -> On
          On -> Off)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  pub type 1.tFlag :: 2.tType {
      pub 1.vOff :: 1.tFlag;
      pub 1.vOn :: 1.tFlag
  }

  pub val 1.vconsume :: 1.tFlag → 1.tFlag
   = λ(x : 1.tFlag).
    x

  pub val 1.vswitch :: 1.tFlag → 1.tFlag
   = λ(x : 1.tFlag).
    1.vconsume (case x as (_scrut : 1.tFlag) return (1.tFlag) of {
        1.vOff →
            1.vOn;
        1.vOn →
            1.vOff
    })
status: pass
reason: A case in an application argument keeps its checked result type.
