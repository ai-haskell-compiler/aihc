---
extensions:
- ForeignFunctionInterface
- GHCForeignImportPrim
- KindSignatures
- MagicHash
- StandaloneKindSignatures
- UnboxedTuples
modules:
- |
  module Test where

  import GHC.Types (Type, UnliftedType)
  import GHC.Prim (State#)

  type MutVar# :: Type -> Type -> UnliftedType
  data MutVar# d a

  foreign import prim newMutVar# ::
    value -> State# domain -> (# State# domain, MutVar# domain (# value, value #) #)
expected: ''
status: fail
reason: a lifted primitive type variable cannot use an unboxed tuple type
