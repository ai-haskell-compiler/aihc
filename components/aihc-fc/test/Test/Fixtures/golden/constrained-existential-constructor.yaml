extensions:
  - ExistentialQuantification
modules:
  - |
    {-# LANGUAGE ExistentialQuantification #-}
    module Test where
    data Mark = Marked
    class Markable a where
      mark :: a -> Mark
    data Box = forall a. Markable a => Box a
    inspect :: Box -> Mark
    inspect (Box value) = mark value
expected: |-
  core 2
  prefix 1 = Test

  data Mark where
    | Marked;

  data Markable a where
    | $Dict$Markable : a → Mark;

  mark : ∀ a. Markable a → a → Mark =
    Λ a →
      λ $d0 : Markable a →
        case $d0 as $dict : Markable a of {
          $Dict$Markable ($method0 : a → Mark) →
            $method0;
        };

  data Box where
    | Box : Markable (a{14} :: Type), (a{14} :: Type);

  inspect : Box → Mark =
    λ x1005 : Box →
      case x1005 as _scrut : Box of {
        Box ($dpattern : Markable (a{16} :: Type)) (value : (a{16} :: Type)) →
          ((1.mark : ∀ a. Markable a → a → Mark) @(a{16} :: Type)) $dpattern value;
      };
status: pass
reason: System FC stores the constructor dictionary and binds it before the existential payload
