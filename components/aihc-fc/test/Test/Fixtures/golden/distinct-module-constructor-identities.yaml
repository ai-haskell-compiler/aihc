extensions: []
modules:
  - |
    module First where

    data Item = FirstItem
    data Value = Shared Item
  - |
    module Second where

    data Item = SecondItem
    data Value = Shared Item
  - |
    module Test where

    import qualified First
    import qualified Second

    first :: First.Value -> First.Item
    first (First.Shared value) = value

    second :: Second.Value -> Second.Item
    second (Second.Shared value) = value
expected: |-
  scope 1 = "" First

  module 1.First where

  data 1.Item : Type
   = 1.FirstItem

  data 1.Value : Type
   = 1.Shared (tycon 1.Item/0 { :: Type })
  scope 1 = "" Second

  module 1.Second where

  data 1.Item : Type
   = 1.SecondItem

  data 1.Value : Type
   = 1.Shared (tycon 1.Item/0 { :: Type })
  scope 1 = "" First
  scope 2 = "" Second
  scope 3 = "" Test

  module 3.Test where

  rec {
    first{unique 1000} : tycon 1.Value/0 { :: Type } → tycon 1.Item/0 { :: Type };
    second{unique 1001} : tycon 2.Value/0 { :: Type } → tycon 2.Item/0 { :: Type };
    first{unique 1000} =
      λ(x1002{unique 1002} : tycon 1.Value/0 { :: Type }).
        case (x1002{unique 1002} : tycon 1.Value/0 { :: Type }) as (_scrut{unique 1004} : tycon 1.Value/0 { :: Type }) return (tycon 1.Item/0 { :: Type }) of {
          1.Shared (value{unique 1003} : tycon 1.Item/0 { :: Type }) →
            (value{unique 1003} : tycon 1.Item/0 { :: Type })
        };
    second{unique 1001} =
      λ(x1005{unique 1005} : tycon 2.Value/0 { :: Type }).
        case (x1005{unique 1005} : tycon 2.Value/0 { :: Type }) as (_scrut{unique 1007} : tycon 2.Value/0 { :: Type }) return (tycon 2.Item/0 { :: Type }) of {
          2.Shared (value{unique 1006} : tycon 2.Item/0 { :: Type }) →
            (value{unique 1006} : tycon 2.Item/0 { :: Type })
        }
  }
status: pass
reason: retains the full identity of each constructor pattern
