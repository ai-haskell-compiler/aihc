                      _ →
                        "aihc-prim" GHC.Types.False
                    }
                })) (λ($stock_eq_left : Tree a).
              λ($stock_eq_right : Tree a).
                case case $stock_eq_left as ($stock_eq_outer : Tree a) of {
                  Leaf ($stock_eq_left_field0 : a) →
                    case $stock_eq_right as ($stock_eq_inner : Tree a) of {
                      Leaf ($stock_eq_right_field0 : a) →
                        case case $d0 as ($stock_eq_dictionary : Eq a) of {
                          $Dict$Eq ($stock_eq_method : a → a → Bool) ($stock_neq_method : a → a → Bool) →
                            ($stock_eq_method $stock_eq_left_field0) $stock_eq_right_field0
                        } as ($stock_eq_bool : Bool) of {
                          False →
                            "aihc-prim" GHC.Types.False;
                          True →
                            "aihc-prim" GHC.Types.True
                        };
                      _ →
                        "aihc-prim" GHC.Types.False
                    };
                  Branch ($stock_eq_left_field0 : Tree a) ($stock_eq_left_field1 : Tree a) →
                    case $stock_eq_right as ($stock_eq_inner : Tree a) of {
                      Branch ($stock_eq_right_field0 : Tree a) ($stock_eq_right_field1 : Tree a) →
                        case case $stock_eq_self as ($stock_eq_dictionary : Eq (Tree a)) of {
