  data Bool
   = False
   | True
  module Test where

  external "aihc-prim" GHC.Types.False : Bool

  external "aihc-prim" GHC.Types.True : Bool

  data Eq (a : TYPE BoxedRep Lifted)
   = $Dict$Eq (a → a → Bool) (a → a → Bool)

  == : ∀ (a : TYPE BoxedRep Lifted). (Eq a) → a → a → Bool =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Eq a).
        case $d0 as ($dict : Eq a) of {
          $Dict$Eq ($method0 : a → a → Bool) ($method1 : a → a → Bool) →
            $method0
        }

  /= : ∀ (a : TYPE BoxedRep Lifted). (Eq a) → a → a → Bool =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Eq a).
        case $d0 as ($dict : Eq a) of {
          $Dict$Eq ($method0 : a → a → Bool) ($method1 : a → a → Bool) →
            $method1
        }

  data Tree (a : TYPE BoxedRep Lifted)
   = Leaf (a)
   | Branch (Tree a) (Tree a)

  rec {
    $fEqTreea : ∀ (a : TYPE BoxedRep Lifted). (Eq a) → Eq (Tree a);
    $fEqTreea =
      Λ(a : TYPE BoxedRep Lifted).
        λ($d0 : Eq a).
          let {
