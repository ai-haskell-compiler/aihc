extensions:
  - DerivingStrategies
modules:
  - |
    module GHC.Types where

    data Bool = False | True
  - |
    {-# LANGUAGE DerivingStrategies #-}
    module Test where

    import GHC.Types

    class Eq a where
      (==) :: a -> a -> Bool
      (/=) :: a -> a -> Bool

    data Tree a = Leaf a | Branch (Tree a) (Tree a)
      deriving stock Eq

    sameTree :: Eq a => Tree a -> Tree a -> Bool
    sameTree = (==)
