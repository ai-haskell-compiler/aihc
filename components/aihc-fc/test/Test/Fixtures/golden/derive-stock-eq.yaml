                        } as ($stock_eq_bool : Bool) of {
                          False →
                            "aihc-prim" GHC.Types.False;
                          True →
                            case case $stock_eq_self as ($stock_eq_dictionary : Eq (Tree a)) of {
                              $Dict$Eq ($stock_eq_method : (Tree a) → (Tree a) → Bool) ($stock_neq_method : (Tree a) → (Tree a) → Bool) →
                                ($stock_eq_method $stock_eq_left_field1) $stock_eq_right_field1
                            } as ($stock_eq_bool : Bool) of {
                              False →
                                "aihc-prim" GHC.Types.False;
                              True →
