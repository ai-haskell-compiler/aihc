  module Test where

  data Unit
   = Unit

  data Box (a : TYPE BoxedRep Lifted)
   = Box (a)

  data Required (a : TYPE BoxedRep Lifted)
   = $Dict$Required (a → a)

  required : ∀ (a : TYPE BoxedRep Lifted). (Required a) → a → a =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Required a).
        case $d0 as ($dict : Required a) of {
          $Dict$Required ($method0 : a → a) →
            $method0
        }

  data Any (a : TYPE BoxedRep Lifted)
   = $Dict$Any (a → a)

  anyValue : ∀ (a : TYPE BoxedRep Lifted). (Any a) → a → a =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Any a).
        case $d0 as ($dict : Any a) of {
          $Dict$Any ($method0 : a → a) →
            $method0
        }

  $dmanyValue : ∀ (a : TYPE BoxedRep Lifted). (Any a) → (Required a) → a → a =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Any a).
        λ($d1 : Required a).
          λ(x1011 : a).
            ((required @(a : TYPE BoxedRep Lifted)) $d1) x1011

  data Wrapped (a : TYPE BoxedRep Lifted)
   = Wrapped (Box a)

  data Parent (a : TYPE BoxedRep Lifted)
   = $Dict$Parent

  data Child (a : TYPE BoxedRep Lifted)
   = $Dict$Child (Parent a)

  data Both
   = Both

  $fRequiredBoxa : ∀ (a : TYPE BoxedRep Lifted). (Required a) → Required (Box a) =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Required a).
        ($Dict$Required @(Box a)) (λ(x1014 : Box a).
          x1014)

  $fRequiredWrappeda : ∀ (a : TYPE BoxedRep Lifted). (Required a) → Required (Wrapped a) =
    Λ(a : TYPE BoxedRep Lifted).
      λ($d0 : Required a).
        ($Dict$Required @(Wrapped a)) (λ(x1018 : Wrapped a).
          x1018)

  $fParentBoth : Parent Both =
