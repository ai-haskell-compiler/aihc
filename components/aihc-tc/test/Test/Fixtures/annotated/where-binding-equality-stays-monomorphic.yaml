extensions:
- TypeFamilies
modules:
- |
  module Test where
  data N = N
  data Ref s = Ref
  data M s a = M
  class Mon m where
    type St m
    pureM :: a -> m a
  instance Mon (M s) where
    type St (M s) = s
    pureM _ = M
  writeRef :: Mon m => Ref (St m) -> m N
  writeRef _ = pureM N
  test :: Ref s -> M s N
  test r = go N
    where
      go n = writeRef r
status: pass
reason: A where binding does not generalize the type variable of a retained equality.
