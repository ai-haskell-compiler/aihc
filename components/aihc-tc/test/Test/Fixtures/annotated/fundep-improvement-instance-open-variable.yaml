modules:
- |
  {-# LANGUAGE MultiParamTypeClasses, FunctionalDependencies, FlexibleInstances, UndecidableInstances #-}
  module Test where
  data P a = P a
  data Ii = Ii
  data Val = Val
  pureP :: a -> P a
  pureP = P
  apP :: P (a -> b) -> P a -> P b
  apP (P f) (P x) = P (f x)
  class Idiomatic f g | g -> f where
    idiomatic :: P f -> g
  instance Idiomatic x (Ii -> P x) where
    idiomatic ix Ii = ix
  instance Idiomatic f g => Idiomatic ((a -> b) -> f) ((a -> b) -> g) where
    idiomatic isf f = idiomatic (apP isf (pureP f))
  iI :: Idiomatic (a -> a) g => g
  iI = idiomatic (pureP (\x -> x))
  use :: P (Val -> Val)
  use = iI (\u -> u) Ii
reason: "the instance head gives the shape (a -> b) -> f of the dependent parameter, and f gets a fresh variable, thus the wanted Idiomatic (t0 -> t0) ((t1 -> t1) -> Ii -> P (Val -> Val)) improves and the instances solve it; reduced from uu-parsinglib Text.ParserCombinators.UU.Idioms"
