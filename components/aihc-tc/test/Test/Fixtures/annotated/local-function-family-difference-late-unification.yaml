modules:
- |
  {-# LANGUAGE TypeFamilies #-}
  module Test where
  import GHC.Classes (Eq (..), (||))
  import GHC.Types (Bool (..))
  data Nat = Z | S Nat
  data Opt a = None | Some a
  newtype Count ty = Count Nat
  data Arr ty = Arr
  newtype Str = Str (Arr Nat)
  class Subtractive a where
    type Difference a
    minus :: a -> a -> Difference a
  instance Subtractive (Count ty) where
    type Difference (Count ty) = Opt (Count ty)
    minus _ _ = None
  class Integral a where
    fromNat :: Nat -> a
  instance Integral (Count ty) where
    fromNat = Count
  type family Element c
  type instance Element (Arr ty) = ty
  class Collection c where
    length :: c -> Count (Element c)
    take :: Count (Element c) -> c -> c
    drop :: Count (Element c) -> c -> c
  instance Collection (Arr ty) where
    length _ = Count Z
    take _ x = x
    drop _ x = x
  instance Eq (Arr ty) where
    _ == _ = True
  isInfixOf :: Str -> Str -> Bool
  isInfixOf (Str needle) (Str haystack) = loop (minus hayLen needleLen) haystack
    where
      needleLen = length needle
      hayLen = length haystack
      loop None _ = False
      loop (Some cnt) haystack' =
        needle == take needleLen haystack'
          || loop (minus cnt (fromNat (S Z))) (drop (fromNat (S Z)) haystack')
