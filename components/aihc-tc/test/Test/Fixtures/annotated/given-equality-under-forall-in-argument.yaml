- |
  {-# LANGUAGE GADTs, RankNTypes, TypeFamilies, FlexibleInstances #-}
  module Test where
  data Basic
  data Name = Name
  data Ix = Ix
  data ThreadId = ThreadId
  data Program pty n a where
    ModelConc :: ((a -> n ()) -> n ()) -> Program Basic n a
  class Conc m where
    type Tid m
    forkU :: Name -> ((forall a. m a -> m a) -> m ()) -> m (Tid m)
    forkOnU :: Name -> Ix -> ((forall a. m a -> m a) -> m ()) -> m (Tid m)
  instance (pty ~ Basic) => Conc (Program pty n) where
    type Tid (Program pty n) = ThreadId
    forkU n ma = forkU n ma
    forkOnU n _ = forkU n
