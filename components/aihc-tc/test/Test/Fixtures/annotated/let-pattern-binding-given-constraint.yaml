- |
  module Main where
  class Num a where
    (+) :: a -> a -> a
  data Pair a b = Pair a b
  data List a = Nil | Cons a (List a)
  dup :: Num a => a -> Pair a a
  dup x = Pair (x + x) x
  f :: Num b => b -> b
  f y = g y
    where
      g :: Num i => i -> i
      g z =
        let Pair p q = dup z
         in p + q
  total :: Num b => List b -> b -> b
  total xs z = go xs z
    where
      go :: Num i => List i -> i -> i
      go Nil acc = addSelf acc
      go (Cons x rest) acc = go rest (x + acc)
      addSelf :: Num i => i -> i
      addSelf = \w -> w + w
