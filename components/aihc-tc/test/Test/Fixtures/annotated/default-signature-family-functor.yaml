extensions:
- DefaultSignatures
- FlexibleContexts
- TypeFamilies
modules:
- |
  {-# LANGUAGE DefaultSignatures, FlexibleContexts, TypeFamilies #-}
  module Test where
  data Maybe a = Nothing | Just a
  class Functor f where
    fmap :: (a -> b) -> f a -> f b
  instance Functor Maybe where
    fmap _ Nothing = Nothing
    fmap g (Just x) = Just (g x)
  type family Element mono
  type instance Element (Maybe a) = a
  class MonoFunctor mono where
    omap :: (Element mono -> Element mono) -> mono -> mono
    default omap :: (Functor f, Element (f a) ~ a, f a ~ mono) => (Element mono -> Element mono) -> mono -> mono
    omap = fmap
  instance MonoFunctor (Maybe a)
status: pass
reason: An instance that takes a default signature gets its stuck constraints solved after the equality "f a ~ mono" chooses f and a.
