modules:
- |
  module GHC.Num where
  import GHC.Prim (Int#)
  import GHC.Types (Int (..))
  data Integer = IS Int#
  data Double = D# Int#
  class Num a where
    fromInteger :: Integer -> a
  instance Num Int where
    fromInteger (IS x) = I# x
  instance Num Integer where
    fromInteger x = x
  instance Num Double where
    fromInteger (IS x) = D# x
- |
  module Main where
  import GHC.Num (Double, Integer, Num)
  identity :: Num a => a -> a
  identity x = x
  inferred x = identity x
reason: defaulting leaves a meta-variable that the inferred type generalizes over,
  so the binding stays polymorphic
