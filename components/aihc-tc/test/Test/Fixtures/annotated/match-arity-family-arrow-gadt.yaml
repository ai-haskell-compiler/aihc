extensions: [DataKinds, GADTs, KindSignatures, PolyKinds, ScopedTypeVariables, TypeFamilies, FlexibleContexts, AllowAmbiguousTypes, TypeApplications]
modules:
  - |
    {-# LANGUAGE DataKinds, GADTs, KindSignatures, PolyKinds, ScopedTypeVariables, TypeFamilies, FlexibleContexts, NoImplicitPrelude #-}
    module Test where
    import GHC.Types (Bool (..), Type)
    data Maybe a = Nothing | Just a
    data Proxy (a :: k) = Proxy
    type family If (c :: Bool) (t :: k) (e :: k) :: k where
      If 'True t e = t
      If 'False t e = e
    data SBool (b :: Bool) where
      STrue :: SBool 'True
      SFalse :: SBool 'False
    class SBoolI (b :: Bool) where
      sbool :: SBool b
    data Q (b :: Bool) (v :: Type)
    class Link endpoint where
      type MkLink endpoint
      toLink :: Proxy endpoint -> MkLink endpoint
    instance SBoolI b => Link (Q b v) where
      type MkLink (Q b v) = If b v (Maybe v) -> v
      toLink _ mv = case sbool :: SBool b of
        STrue -> mv
        SFalse -> fromMaybe' mv
    fromMaybe' :: Maybe v -> v
    fromMaybe' m = fromMaybe' m
status: pass
reason: An equation argument that only the reduced family result shows takes its type from that result, thus a GADT match in the body uses it at the refined types.
