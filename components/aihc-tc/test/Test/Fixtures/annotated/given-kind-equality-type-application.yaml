- |
  {-# LANGUAGE GADTs, KindSignatures, PolyKinds, QuantifiedConstraints, RankNTypes, ScopedTypeVariables, TypeApplications #-}
  module Test where
  import GHC.Types (Type)
  data HEq (a :: k1) (b :: k2) where
    HRefl :: HEq a a
  data Rep (a :: k) = Rep
  data Maybe a = Nothing | Just a
  repKind :: forall k (a :: k). Rep a -> Rep k
  repKind _ = Rep
  eqRep :: Rep a -> Rep b -> Maybe (HEq a b)
  eqRep _ _ = Nothing
  data SomeRep where
    SomeRep :: forall k (a :: k). Rep a -> SomeRep
  class Get a where
    get :: a
  getWrap :: forall cmd. (forall x. Get (cmd x)) => SomeRep -> Maybe (cmd ())
  getWrap some = case some of
    SomeRep (rep :: Rep a) -> case eqRep (repKind rep) (Rep :: Rep Type) of
      Just HRefl -> case get @(cmd a) of
        _ -> Nothing
      Nothing -> Nothing
