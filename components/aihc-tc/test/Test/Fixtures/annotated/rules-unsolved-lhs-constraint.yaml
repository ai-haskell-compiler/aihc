- |
  {-# LANGUAGE MultiParamTypeClasses, FlexibleInstances, FlexibleContexts #-}
  module Test where
  data A = A
  data B = B
  class C i p where
    c :: i -> p -> p
  newtype W i = W i
  instance C i (W i) where
    c _ p = p
  f :: C A p => p -> p
  f p = c A p
  g :: W B -> W B
  g p = p
