  module Main where
  import GHC.Types (Type)
  data Unit = Unit
  data Box a = Box a
  type family Rep a :: Type
  type family Inner (r :: Type) :: Type
  type instance Inner (Box a) = a
  class Wrapped s where
    type Unwrapped s :: Type
