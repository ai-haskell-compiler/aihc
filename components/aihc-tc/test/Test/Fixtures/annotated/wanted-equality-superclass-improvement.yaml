- |
  {-# LANGUAGE DataKinds, FlexibleInstances, KindSignatures, MultiParamTypeClasses, TypeFamilies, UndecidableSuperClasses, AllowAmbiguousTypes #-}
  module Test where
  import GHC.Types (Type)
  class is ~ '[i] => Single (is :: [Type]) (i :: Type) where
    index :: proxy is -> i -> i
  instance Single '[i] i where
    index _ x = x
  data P (is :: [Type]) = P
  keep :: Single is i => P is -> P is
  keep p = p
  use :: P '[i] -> P '[i]
  use p = keep p
