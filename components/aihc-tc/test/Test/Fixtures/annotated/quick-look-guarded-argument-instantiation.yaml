modules:
- |
  {-# LANGUAGE GADTs, RankNTypes, ScopedTypeVariables #-}
  module Test where
  data Answer b a = b ~ a => Hit a | Miss
  data Same a b where
    Same :: Same a a
  data Maybe a = Nothing | Just a
  newtype Oracle a = Oracle (forall t. t -> Answer t a)
  same :: Maybe (Same c b)
  same = Nothing
  ($) :: (a -> b) -> a -> b
  f $ x = f x
  hit :: forall b. b -> Oracle b
  hit _ = Oracle $ \(c :: c) -> case same :: Maybe (Same c b) of
    Just Same -> Hit c
    Nothing -> Miss
reason: The instantiation variable of a guarded argument, as a of Oracle, is an instantiation variable of the application. Thus the expected result type fixes it before the lambda is checked under the givens of its case branches.
status: pass
