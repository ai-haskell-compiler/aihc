modules:
- |
  module Test where
  data Nat = Z | S Nat
  data List a = Nil | Cons a (List a)
  class C a where
    op :: a -> a
  map :: (a -> b) -> List a -> List b
  map f xs = case xs of
    Nil -> Nil
    Cons y ys -> Cons (f y) (map f ys)
  build :: (forall b. (a -> b -> b) -> b -> b) -> List a
  build g = g Cons Nil
  foldr :: (a -> b -> b) -> b -> List a -> b
  foldr k z xs = case xs of
    Nil -> z
    Cons y ys -> k y (foldr k z ys)
  identity :: a -> a
  identity x = x
  {-# RULES
  "map/map" [2] forall f g xs. map f (map g xs) = map g (map f xs)
  "fold/build" forall k z (g :: forall b. (a -> b -> b) -> b -> b) . foldr k z (build g) = g k z
  "map/id" forall a. forall (xs :: List a). map identity xs = xs
  "op/op" forall x. op (op x) = op x
  "op/nat" forall (x :: Nat). op (op x) = x
  "wrong" forall (x :: Nat). identity x = Nil
    #-}
