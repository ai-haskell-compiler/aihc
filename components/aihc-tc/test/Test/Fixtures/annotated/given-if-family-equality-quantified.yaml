modules:
- |
  {-# LANGUAGE DataKinds, StandaloneKindSignatures, TypeFamilies #-}
  module Data.Type.Bool where
  import GHC.Types (Bool (..))
  type If :: Bool -> k -> k -> k
  type family If cond tru fls where
    If 'True tru _ = tru
    If 'False _ fls = fls
- |
  {-# LANGUAGE ConstraintKinds, DataKinds, FlexibleContexts, FlexibleInstances, GADTs, KindSignatures, PolyKinds, QuantifiedConstraints, RankNTypes, TypeFamilies, TypeOperators #-}
  module Test where
  import Data.Type.Bool (If)
  import GHC.Types (Bool (..), Constraint, Type)
  data Scope = User | System
  data Bytes = Bytes
  type family IsSystem (s :: Scope) :: Bool where
    IsSystem 'System = 'True
    IsSystem 'User = 'False
  class Same a where
    same :: a -> a -> Bool
  data Cmd (scope :: Scope) (cmd :: Scope -> Type -> Type -> Type) where
    Cmd :: forall arg cmd scope. If (IsSystem scope) (arg ~ Bytes) (() :: Constraint) => cmd scope arg Bool -> Cmd scope cmd
  instance (forall res. Same (cmd 'System Bytes res)) => Same (Cmd 'System cmd) where
    same (Cmd a) (Cmd b) = same a b
