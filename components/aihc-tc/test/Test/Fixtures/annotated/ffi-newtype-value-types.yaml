modules:
- |
  module Test where

  import GHC.Prim (Addr#, Int64#, Word32#, Word8#)

  data IO a
  data Ptr a = Ptr Addr#
  data Word8 = W8# Word8#
  data Word32 = W32# Word32#
  data Int64 = I64# Int64#
  newtype CUInt = CUInt Word32
  newtype CLLong = CLLong Int64
  newtype CPtrdiff = CPtrdiff Int64
  newtype Offset = Offset CPtrdiff

  foreign import ccall unsafe "fps_maximum" c_maximum :: Ptr Word8 -> CUInt -> IO Word8
  foreign import ccall unsafe "fps_sort" c_sort :: Ptr Word8 -> CLLong -> IO ()
  foreign import ccall unsafe "fps_elem_index" c_elem_index :: Ptr Word8 -> Word8 -> IO Offset
reason: foreign import value types unwrap through newtypes and boxed integer types to their primitive representation, and a unit result is accepted
