modules:
- |
  module Hidden (G, hide) where
  import GHC.Types (Bool (..), Int)
  data family G a
  newtype instance G Bool = GBool Int
  hide :: Int -> G Bool
  hide = GBool
- |
  {-# LANGUAGE TypeFamilies, TypeApplications, ScopedTypeVariables, MultiParamTypeClasses, FlexibleContexts, MagicHash #-}
  module Test where
  import GHC.Types (Bool (..), Coercible, Int (..))
  import GHC.Prim (unsafeCoerce#)
  import Hidden (G)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data family F a
  newtype instance F Bool = FBool Int
  toF :: Int -> F Bool
  toF = coerce
  fromF :: F Bool -> Int
  fromF = coerce
  mapF :: (Int -> Int) -> F Bool -> F Bool
  mapF f = coerce f
  hidden :: Int -> G Bool
  hidden = coerce
  data Vec s a = Vec a
  data family MV s a
  newtype Wrap a = Wrap a
  newtype Both a b = Both b
  newtype instance MV s (Wrap a) = MVWrap (Vec s a)
  newtype instance MV s (Both a b) = MVBoth (MV s b)
  class Len v a where
    len :: v s a -> Int
  instance Len Vec a where
    len _ = I# 0#
  instance Len MV (Wrap a) where
    len = coerce (len @Vec @a)
  instance Len MV b => Len MV (Both a b) where
    len = coerce (len @MV @b)
reason: Coercible unwraps a newtype instance of a data family when its constructor
  is in scope, also through a function type and with an ambiguous type variable
status: pass
