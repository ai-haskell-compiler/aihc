  │     └─ type: GHC.Types.Int → F GHC.Types.Bool; type-args: Int, F Bool; evidence: coercible @Int @F Bool
  └─ type: GHC.Types.Int → F GHC.Types.Bool
  fromF :: F Bool -> Int
  fromF = coerce
  │       └─ type: F GHC.Types.Bool → GHC.Types.Int; type-args: F Bool, Int; evidence: coercible @F Bool @Int
  └─ type: F GHC.Types.Bool → GHC.Types.Int
  mapF :: (Int -> Int) -> F Bool -> F Bool
  mapF f = coerce f
  │    │   └─ type: (GHC.Types.Int → GHC.Types.Int) → F GHC.Types.Bool → F GHC.Types.Bool; type-args: Int → Int, F Bool → F Bool; evidence: coercible @Int → Int @F Bool → F Bool
  │    └─ type: GHC.Types.Int → GHC.Types.Int
  └─ type: (GHC.Types.Int → GHC.Types.Int) → F GHC.Types.Bool → F GHC.Types.Bool
  hidden :: Int -> G Bool
  hidden = coerce
           └─ error: unsolved constraint Coercible Int G Bool
  data Vec s a = Vec a
       │         └─ type: ∀ s a. a → Vec s a
       └─ type: Type → Type → Type
  data family MV s a
              └─ type: Type → Type → Type
  newtype Wrap a = Wrap a
          │        └─ type: ∀ a. a → Wrap a
          └─ type: Type → Type
  newtype Both a b = Both b
          │          └─ type: ∀ a b. b → Both a b
          └─ type: Type → Type → Type
  newtype instance MV s (Wrap a) = MVWrap (Vec s a)
