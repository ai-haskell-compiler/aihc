modules:
- |
  {-# LANGUAGE TypeFamilies, FlexibleContexts, MultiParamTypeClasses, FlexibleInstances, UndecidableInstances #-}
  module Test where
  type family Elem s
  type family Storage c
  class (Elem (Storage c) ~ c) => Component c
  newtype Sys w a = Sys a
  mapSys :: (a -> b) -> Sys w a -> Sys w b
  mapSys f (Sys a) = Sys (f a)
  class Component c => Has w c where
    getStore :: w -> Sys w (Storage c)
  newtype Global c = Global c
  type instance Elem (Global c) = c
  data Counter = Counter
  instance Component Counter
  type instance Storage Counter = Global Counter
  next :: Has w Counter => w -> Counter
  next w = case getStore w of
    Sys (Global c) -> use c
  use :: Counter -> Counter
  use c = c
  data Redirect c = Redirect c
  newtype RedirectStore s = RedirectStore s
  type instance Elem (RedirectStore s) = Redirect (Elem s)
  type instance Storage (Redirect c) = RedirectStore (Storage c)
  instance Component c => Component (Redirect c)
  instance Has w c => Has w (Redirect c) where
    getStore w = mapSys RedirectStore (getStore w)
  newtype ReadOnly s = ReadOnly s
  type instance Elem (ReadOnly s) = Elem s
  class Set s where
    set :: s -> Elem s -> ()
  setReadOnly :: (Has w c, Storage c ~ ReadOnly s, Elem s ~ c, Set s) => w -> c -> ()
  setReadOnly w c = case getStore w of
    Sys (ReadOnly s) -> set s c
status: pass
reason: A stuck wanted equality rewrites a family application in another wanted
  equality, as in GHC. In next, Storage t0 ~ Global Counter rewrites the entailed
  Elem (Storage t0) ~ t0 to Counter ~ t0. In the Redirect instance, Storage t0 ~
  Storage c rewrites it to Elem (Storage c) ~ t0, and the given gives t0 ~ c. In
  setReadOnly, Elem t1 ~ c rewrites Storage (Elem t1) ~ ReadOnly t1, and the
  given Storage c ~ ReadOnly s gives t1 ~ s.
