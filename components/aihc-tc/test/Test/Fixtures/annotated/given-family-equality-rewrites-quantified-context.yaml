extensions:
- ConstraintKinds
- DataKinds
- RankNTypes
- ScopedTypeVariables
- TypeApplications
- TypeFamilies
- AllowAmbiguousTypes
modules:
- |
  {-# LANGUAGE ConstraintKinds, DataKinds, RankNTypes, ScopedTypeVariables, TypeApplications, TypeFamilies, AllowAmbiguousTypes #-}
  module Test where
  import GHC.Types
  data Tag = TagId
  type family Apply (t :: Tag) (a :: Type) :: Type where
    Apply 'TagId a = a
  type family TagOf (f :: Type -> Type) :: Tag
  type family Payload (f :: Type -> Type) (a :: Type) :: Type where
    Payload f a = Apply (TagOf f) a
  class MapMethod c f where
    mapMethod :: (forall a. c (Payload f a) => f a -> f a) -> f () -> f ()
  mapMethodF :: forall c f. (TagOf f ~ 'TagId, MapMethod c f) => (forall a. c a => f a -> f a) -> f () -> f ()
  mapMethodF g = mapMethod @c g
