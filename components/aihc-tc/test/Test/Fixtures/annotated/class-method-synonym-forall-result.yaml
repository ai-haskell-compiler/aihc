modules:
- |
  {-# LANGUAGE RankNTypes #-}
  {-# LANGUAGE PolyKinds #-}
  {-# LANGUAGE TypeOperators #-}
  module Test where
  type (:->) p q = forall a b. p a b -> q a b
  infixr 0 :->
  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g x = f (g x)
  identity :: a -> a
  identity x = x
  class BifunctorFunctor t where
    bifmap :: (p :-> q) -> t p :-> t q
  class BifunctorFunctor t => BifunctorMonad t where
    bireturn :: p :-> t p
    bibind :: (p :-> t q) -> t p :-> t q
    bibind f = compose bijoin (bifmap f)
    bijoin :: t (t p) :-> t p
    bijoin = bibind identity
  biliftM :: BifunctorMonad t => (p :-> q) -> t p :-> t q
  biliftM f = bibind (compose bireturn f)
  class Explicit t where
    explicit :: (forall a b. p a b -> q a b) -> forall a b. t p a b -> t q a b
  instance Explicit Flip where
    explicit f (Flip p) = Flip (f p)
  newtype Flip p a b = Flip (p b a)
  instance BifunctorFunctor Flip where
    bifmap f (Flip p) = Flip (f p)
