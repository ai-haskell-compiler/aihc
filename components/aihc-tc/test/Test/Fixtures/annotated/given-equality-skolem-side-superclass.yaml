extensions: [TypeFamilies, FlexibleContexts]
modules:
  - |
    {-# LANGUAGE TypeFamilies, FlexibleContexts #-}
    module Test where
    class Boolean b where
      notB :: b -> b
    type family BooleanOf a
    -- The wanted @Boolean bool@ names the rigid @bool@. The given
    -- @bool ~ BooleanOf a@ rewrites it to the superclass of @EqB a@.
    class Boolean (BooleanOf a) => EqB a where
      eqB, neB :: (bool ~ BooleanOf a) => a -> a -> bool
      neB u v = notB (eqB u v)
    class Boolean (BooleanOf a) => IfB a where
      ifB :: (bool ~ BooleanOf a) => bool -> a -> a -> a
    instance Boolean b => Boolean (z -> b) where
      notB f z = notB (f z)
    type instance BooleanOf (z -> a) = z -> BooleanOf a
    cond :: (IfB a, bool ~ BooleanOf a) => (z -> bool) -> (z -> a) -> (z -> a) -> z -> a
    cond p t e z = ifB (p z) (t z) (e z)
    -- The method type is @(bool ~ BooleanOf (z -> a)) => bool -> ...@.
    -- The given reduces to @bool ~ (z -> BooleanOf a)@, and only this
    -- given lets @bool@ match the argument type @z -> bool0@ of @cond@.
    instance IfB a => IfB (z -> a) where
      ifB = cond
