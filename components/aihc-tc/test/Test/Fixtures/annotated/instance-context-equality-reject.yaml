extensions:
- GADTs
- FlexibleInstances
- UndecidableInstances
modules:
- |
  module Test where
  data Flag = Off | On
  data Other = Other
  data Box a = Box a
  class Build a where
    build :: a
  instance (a ~ Flag) => Build (Box a) where
    build = Box On
  concrete :: Box Other
  concrete = build
  rigid :: Box a
  rigid = build
  class Loop a where
    loop :: a
  instance (a ~ [a]) => Loop (Box a) where
    loop = loop
  discard :: Box a -> Flag
  discard _ = On
  occurs :: Flag
  occurs = discard loop
status: pass
reason: Instance equalities must reject incompatible types, rigid variables, and infinite types.
annotated:
