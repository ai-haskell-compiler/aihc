    loop = loop
    │      └─ type: Box a; type-args: Box a; evidence: $fLoopBoxa @a (given a ~ [a])
    └─ loop ∷ Box a
  discard :: Box a -> Flag
  discard _ = On
  │       └─ type: Box a
