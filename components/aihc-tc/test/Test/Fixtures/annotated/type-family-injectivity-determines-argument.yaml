modules:
- |
  module Test where
  data Flag = Off | On
  data Proxy a = Proxy
  type family F a = r | r -> a
  mk :: Proxy a -> Proxy (F a)
  mk Proxy = Proxy
  useF :: Proxy (F Flag) -> Flag
  useF Proxy = On
  result = useF (mk Proxy)
