modules:
- |
  module Test where
  data Idx = Idx
  data Doc ann = Leaf ann | Fun (Idx -> Doc ann)
  data Diag ann = DLeaf ann | DFun Idx (Diag ann)
  diag :: Idx -> Doc ann -> Diag ann
  diag n = go
    where
      go d = case d of
        Leaf a -> DLeaf a
        Fun f -> apply f n
      apply :: (Idx -> Doc ann) -> Idx -> Diag ann
      apply f x = DFun x (go (f x))
reason: A reference to a local binding with a type signature is not a dependency
  edge, so go is generalized before apply is checked against its signature. The
  ann of the signature is its own type variable, not the one of the enclosing
  binding.
