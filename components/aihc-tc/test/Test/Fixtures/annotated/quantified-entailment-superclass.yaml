extensions: [ConstraintKinds, FlexibleContexts, FlexibleInstances, GADTs, PolyKinds, QuantifiedConstraints, RankNTypes, ScopedTypeVariables, UndecidableInstances, UndecidableSuperClasses]
modules:
  - |
    {-# LANGUAGE ConstraintKinds, FlexibleContexts, FlexibleInstances, GADTs, PolyKinds, QuantifiedConstraints, RankNTypes, ScopedTypeVariables, UndecidableInstances, UndecidableSuperClasses #-}
    module Test where
    import GHC.Types (Constraint)
    data Dict (c :: Constraint) where
      Dict :: c => Dict c
    newtype Sub a b = Sub (a => Dict b)
    class (forall a. p a) => Forall (p :: k -> Constraint)
    instance (forall a. p a) => Forall p
    inst :: forall p a. Sub (Forall p) (p a)
    inst = Sub Dict
    class p (f a) => ComposeC (p :: k2 -> Constraint) (f :: k1 -> k2) (a :: k1)
    instance p (f a) => ComposeC p f a
    class Forall (ComposeC p f) => ForallF p f
    instance Forall (ComposeC p f) => ForallF p f
    instF :: forall p f a. Sub (ForallF p f) (p (f a))
    instF = Sub (case inst :: Sub (Forall (ComposeC p f)) (ComposeC p f a) of
      Sub Dict -> Dict)
status: pass
reason: A constrained field pattern uses a superclass dictionary.
