extensions:
- DerivingStrategies
- FlexibleContexts
- GeneralizedNewtypeDeriving
- TypeFamilies
modules:
- |
  {-# LANGUAGE DerivingStrategies, FlexibleContexts, GeneralizedNewtypeDeriving, TypeFamilies #-}
  module Test where
  type family Element mono
  type instance Element [a] = a
  class MonoFunctor mono where
    omap :: (Element mono -> Element mono) -> mono -> mono
  instance MonoFunctor [a] where
    omap f xs = xs
  data Output = Output
  newtype Outputs = Outputs [Output]
    deriving newtype MonoFunctor
  type instance Element Outputs = Output
status: pass
reason: Newtype deriving proves a method coercion when the type family applications on both sides reduce to the same type.
annotated:
