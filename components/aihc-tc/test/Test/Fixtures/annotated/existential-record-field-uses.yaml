modules:
- |
  {-# LANGUAGE ExistentialQuantification, RecordWildCards #-}
  module Test where
  data Flag = On | Off
  data Box = forall a. MkBox { content :: a, label :: Flag }
  make :: Box
  make = MkBox { content = (), label = On }
  open :: Box -> Flag
  open MkBox { content = _, label = l } = l
  wild :: Box -> Flag
  wild MkBox {..} = label
  bad :: Box -> ()
  bad b = case content b of _ -> ()
reason: "a field whose type has an existential variable has no selector; construction, patterns, and wildcards with it are valid, and a use as a function gets the GHC diagnostic instead of an internal abort"
