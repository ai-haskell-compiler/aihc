modules:
- |
  {-# LANGUAGE DataKinds, PolyKinds, StandaloneKindSignatures, TypeFamilies, TypeOperators, UndecidableInstances #-}
  -- The shape of base's Data.Type.Ord: the compiler computes Compare on
  -- literals because the module has this name.
  module Data.Type.Ord (Compare, OrdCond, type (<=), type (<=?)) where
  import GHC.Types (Bool (..), Constraint, Ordering (..))
  type Compare :: k -> k -> Ordering
  type family Compare a b
  type OrdCond :: Ordering -> k -> k -> k -> k
  type family OrdCond o lt eq gt where
    OrdCond 'LT lt _ _ = lt
    OrdCond 'EQ _ eq _ = eq
    OrdCond 'GT _ _ gt = gt
  type family Assert (b :: Bool) (c :: Constraint) :: Constraint where
    Assert 'True c = ()
    Assert b c = c
  -- The stand-in for base's @TypeError@: a family of a declared kind.
  type Failed :: k -> k -> Constraint
  type family Failed x y
  type (<=?) :: k -> k -> Bool
  type (<=?) x y = OrdCond (Compare x y) 'True 'True 'False
  type (<=) :: k -> k -> Constraint
  type (<=) x y = Assert (x <=? y) (Failed x y)
- |
  {-# LANGUAGE ConstraintKinds, DataKinds, FlexibleContexts, KindSignatures, PolyKinds, ScopedTypeVariables, StandaloneKindSignatures, TypeApplications, TypeOperators, UndecidableInstances #-}
  module Test where
  import GHC.Prim.Natural (Natural)
  import GHC.Types (Constraint)
  import Data.Type.Ord (type (<=))
  type KnownNat :: Natural -> Constraint
  class KnownNat n where
    natSing :: Natural
  natVal :: forall n proxy. KnownNat n => proxy n -> Natural
  natVal _ = natSing @n
  data Proxy t = Proxy
  -- The shape of basement's @type SizeValid n = (KnownNat n, 1 <= n)@:
  -- a constraint tuple with a class component and a component that is
  -- itself a constraint synonym for a stuck family application.
  type SizeValid n = (KnownNat n, 1 <= n)
  newtype Bits (n :: Natural) = Bits Natural
  class Wide a where
    width :: a -> Natural
  allOne :: forall n. SizeValid n => Bits n
  allOne = Bits (natVal (Proxy @n))
  instance SizeValid n => Wide (Bits n) where
    width _ = natVal (Proxy @n)
  result :: Natural
  result = width (allOne :: Bits 8)
