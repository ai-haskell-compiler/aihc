- |
  {-# LANGUAGE TypeFamilies, DefaultSignatures, DeriveAnyClass, ScopedTypeVariables, FlexibleContexts #-}
  module Test where
  type family F a
  data Wrap d m
  class Named d where
    name :: Wrap d m -> ()
  class C a where
    c :: a -> ()
    default c :: forall d m. (F a ~ Wrap d m, Named d) => a -> ()
    c _ = name (undefinedWrap :: Wrap d m)
  undefinedWrap :: Wrap d m
  undefinedWrap = undefinedWrap
  data Tag = Tag
  instance Named Tag where
    name _ = ()
  data T = T deriving C
  type instance F T = Wrap Tag ()
status: pass
reason: An anyclass context determines the variables that a default signature
  quantifies and the class head does not bind, as GHC does. The equality F T ~
  Wrap d m gives d = Tag and m = (), and Named Tag needs no context. This is
  the FromValue default signature with Rep a ~ D1 d m in hpack.
