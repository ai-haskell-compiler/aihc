- |
  {-# LANGUAGE TemplateHaskell #-}
  module Test where
  data Exp = Exp
  data Pat = Pat
  data Dec = Dec
  newtype Q a = Q a
  class Quote m where
    newName :: m Exp
    newPat :: m Pat
  instance Quote Q where
    newName = Q Exp
    newPat = Q Pat
  quoted :: Q Exp
  quoted = [| Exp $(spliced) |]
    where
      spliced = newName
  declared :: Q [Dec]
  declared = [d| $(bound) = Exp |]
    where
      bound = newPat
