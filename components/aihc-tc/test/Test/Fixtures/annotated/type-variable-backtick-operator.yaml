extensions: [StarIsType]
modules:
- |
  {-# LANGUAGE TypeFamilies, TypeOperators #-}
  module Test where
  class C k where
    type P k :: * -> * -> *
    diag :: a `k` P k a a
  useDiag :: C k => a `k` P k a a
  useDiag = diag
  f :: a -> P (->) a a
  f = diag
  instance C (->) where
    type P (->) = (,)
    diag a = (a,a)
status: pass
reason: A type variable in backticks, as in a `k` b, is a type variable application and not a type constructor.
