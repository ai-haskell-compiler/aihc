- |
  {-# LANGUAGE KindSignatures, PolyKinds #-}
  module Test where
  import GHC.Types (Type)
  data Proxy (a :: k) = Proxy
  data T = T
  data U (a :: Type) = U
  both :: Proxy T -> Proxy U -> (Proxy T, Proxy U)
  both a b = (go a, go b)
    where
      go :: forall x. Proxy x -> Proxy x
      go p = p
reason: with PolyKinds, a local signature quantifies its open kind, as in GHC,
  thus the binding can be used at two kinds
