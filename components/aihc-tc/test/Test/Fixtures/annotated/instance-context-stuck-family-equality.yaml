modules:
- |
  {-# LANGUAGE TypeFamilies, MultiParamTypeClasses, FlexibleInstances, UndecidableInstances #-}
  module Test where
  type family N a
  data Unit = Unit
  data Located a = Loc a
  data Trail = Trail
  type instance N Trail = Unit
  class Map a b where
    amap :: a -> b
  instance Map Trail Trail where
    amap t = t
  instance (Map a b, N a ~ N b, r ~ Located b) => Map (Located a) r where
    amap (Loc x) = Loc (amap x)
  moved :: Located Trail -> Located Trail
  moved = amap
status: pass
reason: An equality of an instance context can need a variable that a later equality fixes. Here "N a ~ N b" is stuck until "r ~ Located b" gives b; reduced from diagrams-lib Diagrams.LinearMap
