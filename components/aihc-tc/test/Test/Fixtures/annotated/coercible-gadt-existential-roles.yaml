- |
  {-# LANGUAGE GADTs, MagicHash, RankNTypes, ScopedTypeVariables #-}
  module Test where
  import GHC.Types (Coercible, Int (..))
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  newtype Age = Age Int
  data Coyoneda p a b where
    Coyoneda :: (a -> x) -> (y -> b) -> p x y -> Coyoneda p a b
  data Plain p a b = forall x y. Plain (a -> x) (y -> b) (p x y)
  left :: Coyoneda p Int b -> Coyoneda p Age b
  left = coerce
  right :: Coyoneda p a Int -> Coyoneda p a Age
  right = coerce
  plain :: Plain p Int Int -> Plain p Age Age
  plain = coerce
  given :: Coercible b a => Coyoneda p b c -> Coyoneda p a c
  given = coerce
