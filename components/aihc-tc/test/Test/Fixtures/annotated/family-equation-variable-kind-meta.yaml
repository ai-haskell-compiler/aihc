extensions: [DataKinds, FlexibleInstances, FlexibleContexts, KindSignatures, PolyKinds, ScopedTypeVariables, TypeFamilies, TypeOperators]
modules:
  - |
    {-# LANGUAGE DataKinds, FlexibleInstances, FlexibleContexts, KindSignatures, PolyKinds, ScopedTypeVariables, TypeFamilies, TypeOperators #-}
    module Test where
    import GHC.Types (Type, Symbol)
    data Proxy (a :: k) = Proxy
    data (path :: k) :> (a :: Type)
    data Header (sym :: Symbol) (a :: Type)
    data E
    data Bad
    class HasLink endpoint where
      type MkLink endpoint (a :: Type)
      toLink :: Proxy endpoint -> a -> MkLink endpoint a
    instance HasLink ((arr :: a -> b) :> sub) where
      type MkLink (arr :> sub) _ = Bad
      toLink = toLink
    instance HasLink sub => HasLink (Header sym a :> sub) where
      type MkLink (Header sym a :> sub) r = MkLink sub r
      toLink = simpleToLink (Proxy :: Proxy sub)
    instance HasLink E where
      type MkLink E a = a
      toLink _ x = x
    simpleToLink :: forall sub a combinator. (HasLink sub, MkLink sub a ~ MkLink (combinator :> sub) a) => Proxy sub -> Proxy (combinator :> sub) -> a -> MkLink (combinator :> sub) a
    simpleToLink _ _ = toLink (Proxy :: Proxy sub)
status: pass
reason: A meta variable whose kind is not known yet does not match an equation variable of an arrow kind.
