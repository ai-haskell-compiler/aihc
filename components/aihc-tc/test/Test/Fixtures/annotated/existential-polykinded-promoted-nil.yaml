- |
  {-# LANGUAGE DataKinds, GADTs, KindSignatures, PolyKinds #-}
  module Main where
  import GHC.Types (Type)
  data Some :: (k -> Type) -> Type where
    Some :: f i -> Some f
  data All :: (x -> Type) -> [x] -> Type where
    Nil :: All p '[]
    Cons :: p x -> All p xs -> All p (x ': xs)
  makeAll :: (a -> Some b) -> [a] -> Some (All b)
  makeAll f [] = Some Nil
  makeAll f (x : xs) =
    case (f x, makeAll f xs) of
      (Some y, Some ys) -> Some (Cons y ys)
  data Index :: [x] -> x -> Type where
    Zero :: Index (x ': xs) x
  forget :: Index xs x -> Index xs x
  forget Zero = Zero
