extensions:
  - PolyKinds
  - KindSignatures
  - TypeApplications
modules:
  - |
    {-# LANGUAGE PolyKinds, KindSignatures, TypeApplications #-}
    module Test where
    import GHC.Types
    data P (t :: k) = P
    data M a = M
    data Two (a :: k) (b :: k') = Two
    type Pair (a :: k) (b :: k') = Two a b
    pair :: P (Pair @(Type -> Type) M Int)
    pair = P
annotated:
  - |-
    {-# LANGUAGE PolyKinds, KindSignatures, TypeApplications #-}
    module Test where
    import GHC.Types
    data P (t :: k) = P
         │            └─ type: ∀ k t. P t
         └─ type: k → Type
    data M a = M
         │     └─ type: ∀ k0 a. M a
         └─ type: k0 → Type
    data Two (a :: k) (b :: k') = Two
         └─ type: k → k' → Type   └─ type: ∀ k k' a b. Two a b
    type Pair (a :: k) (b :: k') = Two a b
         └─ type: k → k' → Type
    pair :: P (Pair @(Type -> Type) M Int)
    pair = P
    │      └─ type: P (Two M GHC.Types.Int); type-args: Type, Two M Int
    └─ type: P (Two M GHC.Types.Int)
status: pass
reason: a visible kind application on a type synonym gives a kind variable of the synonym and is not a type argument
