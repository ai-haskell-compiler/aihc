extensions:
- DerivingStrategies
- GeneralizedNewtypeDeriving
- RankNTypes
modules:
- |
  {-# LANGUAGE DerivingStrategies, GeneralizedNewtypeDeriving, RankNTypes #-}
  module Main where
  data Unit = Unit
  class Mon n where
    unit :: n
  class Ctl m where
    ctl :: (forall n. Mon n => m n -> n) -> m Unit
  data Box a = Box a
  instance Ctl Box where
    ctl _ = Box Unit
  newtype Act a = Act (Box a)
    deriving newtype Ctl
status: pass
reason: newtype deriving proves a method coercion through a qualified type inside a quantifier, as the Run t argument of liftWith has
annotated:
