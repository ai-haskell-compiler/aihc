modules:
- |
  {-# LANGUAGE PolyKinds, TypeFamilies, KindSignatures, FlexibleInstances, FlexibleContexts #-}
  module Test where
  import GHC.Types (Bool (..), Type)
  newtype Const a (b :: k) = Const a
  newtype Alt (f :: k -> Type) (a :: k) = Alt (f a)
  newtype Compose (f :: k -> Type) (g :: k1 -> k) (a :: k1) = Compose (f (g a))
  data family Vector a
  data instance Vector Bool = VBool Bool
  class Unbox a where
    size :: Vector a -> Bool
    copy :: Vector a -> Vector a
  instance Unbox Bool where
    size (VBool b) = b
    copy v = v
  newtype instance Vector (Const a b) = V_Const (Vector a)
  instance Unbox a => Unbox (Const a b) where
    size (V_Const v) = size v
    copy (V_Const v) = V_Const (copy v)
  newtype instance Vector (Alt f a) = V_Alt (Vector (f a))
  instance Unbox (f a) => Unbox (Alt f a) where
    size (V_Alt v) = size v
    copy (V_Alt v) = V_Alt (copy v)
  newtype instance Vector (Compose f g a) = V_Compose (Vector (f (g a)))
  instance Unbox (f (g a)) => Unbox (Compose f g a) where
    size (V_Compose v) = size v
    copy (V_Compose v) = V_Compose (copy v)
  wrap :: Vector a -> Vector (Const a b)
  wrap v = V_Const v
reason: the kind variables of a newtype instance head of a data family are generalized,
