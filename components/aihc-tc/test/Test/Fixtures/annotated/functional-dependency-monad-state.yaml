modules:
- |
  {-# LANGUAGE KindSignatures, UndecidableInstances #-}
  module Test where
  import GHC.Types (Type)
  data Nat = Z
  newtype State s a = State (s -> (a, s))
  newtype ReaderT r m a = ReaderT (r -> m a)
  class MonadState s (m :: Type -> Type) | m -> s where
    get :: m s
    put :: s -> m ()
  instance MonadState s (State s) where
    get = State (\s -> (s, s))
    put value = State (\_ -> ((), value))
  instance MonadState s m => MonadState s (ReaderT r m) where
    get = ReaderT (\_ -> get)
    put value = ReaderT (\_ -> put value)
  reset :: State Nat ()
  reset = put Z
  lifted :: MonadState Nat m => ReaderT r m ()
  lifted = put Z
status: pass
reason: the lifting instance of a transformer takes the state type from its context,
  which only the liberal coverage condition of UndecidableInstances accepts
