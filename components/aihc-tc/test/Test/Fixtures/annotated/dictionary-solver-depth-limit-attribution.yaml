extensions: [FlexibleInstances, UndecidableInstances, MultiParamTypeClasses]
modules:
- |
  {-# LANGUAGE FlexibleInstances, UndecidableInstances, MultiParamTypeClasses #-}
  module Test where
  data T = T
  data Flag = On
  class Loop a where
    loop :: a -> Flag
  instance Loop [a] => Loop a where
    loop _ = On
  class Missing a where
    missing :: a -> Flag
  class C a b where
    c :: a -> b -> Flag
  instance {-# INCOHERENT #-} C T b where
    c _ _ = On
  instance {-# INCOHERENT #-} Loop a => C a T where
    c _ _ = On
  mixed :: (Flag, Flag, Flag)
  mixed = (missing T, loop T, missing T)
  twice :: (Flag, Flag)
  twice = (loop T, loop T)
  both :: (Flag, Flag)
  both = (c T T, missing T)
  local :: Flag
  local = let g x = loop [x] in missing T
  nosig = loop T
reason: "each wanted that reaches the reduction depth limit gets the overflow diagnostic, each time it occurs; another unsolved wanted gets a plain unsolved constraint; a failed instance candidate that another candidate replaces leaves no record"
status: pass
