extensions:
- MagicHash
- RebindableSyntax
modules:
- |
  {-# LANGUAGE MagicHash, RebindableSyntax #-}
  module Test where
  import GHC.Prim (Int#)
  import GHC.Types (Bool (..))
  data Integer = IS Int#
  fromInteger :: Integer -> Integer
  fromInteger n = n
  _ == _ = True
  callsEq :: Integer -> Bool
  callsEq 0 = True
  callsEq _ = False
  doesNotCallEq :: Bool -> Bool
  doesNotCallEq True = False
  doesNotCallEq False = True
annotated:
