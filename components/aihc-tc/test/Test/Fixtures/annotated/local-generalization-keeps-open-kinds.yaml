- BangPatterns
modules:
- |
  {-# LANGUAGE BangPatterns, NoMonoLocalBinds, MagicHash, UnboxedTuples #-}
  module Test where
  import GHC.Prim (State#, RealWorld, Addr#, Word#, plusAddr#)
  import GHC.Types (Bool (..))
  class Mantissa a where
    quotRem100 :: a -> (a, a)
    unsafeRaw :: a -> Word#
    ten :: a -> Bool
  copyWord16 :: Word# -> Addr# -> State# RealWorld -> State# RealWorld
  copyWord16 _ _ s = s
  writeDigits :: forall a. (Mantissa a) => Addr# -> a -> State# RealWorld -> State# RealWorld
  writeDigits ptr = go ptr
    where
      go p mantissa s1
        | ten mantissa =
            let !(m', c) = quotRem100 mantissa
                s2 = copyWord16 (unsafeRaw c) (p `plusAddr#` (-1#)) s1
             in go (p `plusAddr#` (-2#)) m' s2
        | True = s1
reason: the generalization of a local binding group fixes the kinds of the
  variables it quantifies only, so a lambda-bound variable of the enclosing
  function still gets an unlifted type from a later use
status: pass
