modules:
- |
  {-# LANGUAGE GADTs, ScopedTypeVariables, TypeApplications #-}
  module Test where
  data Bool = True | False
  data Maybe a = Nothing | Just a
  data a :~: b where
    Refl :: a :~: a
  data T a where
    TB :: T Bool
  same :: T a -> T b -> Maybe (a :~: b)
  same TB TB = Just Refl
  data Field t = Field t
  data Value = forall t. Value (T t) (Field t)
  newtype K c = K c
  class Typed a where
    typeOf :: T a
  update :: forall ty c. (Typed ty, c ~ Field ty) => K c -> Value -> K c
  update (K old) (Value newTy (new :: Field newTy)) =
    case same (typeOf @ty) newTy of
      Just Refl -> K new
      _ -> K old
