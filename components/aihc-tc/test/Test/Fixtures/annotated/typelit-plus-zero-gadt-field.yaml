extensions:
- DataKinds
- GADTs
- KindSignatures
- TypeOperators
modules:
- |
  {-# LANGUAGE DataKinds, KindSignatures, TypeFamilies, TypeOperators #-}
  module GHC.TypeNats where
  import GHC.Prim.Natural (Natural)
  type family (+) (a :: Natural) (b :: Natural) :: Natural
  infixl 6 +
- |
  {-# LANGUAGE DataKinds, GADTs, KindSignatures, TypeOperators, ScopedTypeVariables, RankNTypes #-}
  module Test where
  import GHC.Prim.Natural (Natural)
  import GHC.Types (Type)
  import GHC.TypeNats (type (+))
  infix 4 <, <=
  data (<) :: Natural -> Natural -> Type where
    Lt :: a < b
  data (<=) :: Natural -> Natural -> Type where
    Lte :: a <= b
  data Fin :: Natural -> Type where
    Fin :: forall m n. !(m < n) -> Fin n
  plus :: (a < b) -> (c <= d) -> (a + c < b + d)
  plus Lt Lte = Lt
  zero :: 0 <= a
  zero = Lte
  weakenR :: forall n m. Fin n -> Fin (n + m)
  weakenR (Fin pf) = Fin (plus pf zero)
status: pass
reason: The equality n + t0 ~ n + m gives t0 ~ m, as in GHC. Thus the solver finds the bound of the Fin value.
