- |
  {-# LANGUAGE DataKinds, GADTs, RankNTypes, ScopedTypeVariables, TypeApplications, TypeFamilies, AllowAmbiguousTypes #-}
  module Test where
  import GHC.Types (Type)
  type family Curry (xs :: [Type]) (y :: Type) :: Type where
    Curry '[] y = y
    Curry (x : xs) y = x -> Curry xs y
  data IxEq i is js where
    IxEq :: IxEq i is is
  class AppendIndices (xs :: [Type]) (ys :: [Type]) (ks :: [Type]) where
    appendIndices :: IxEq i (Curry xs (Curry ys i)) (Curry ks i)
  class Pro p where
    dimap :: p i a b -> p i a b
  compose :: forall is js ks s t u v a b. AppendIndices is js ks
    => (forall p i. Pro p => p i u v -> p (Curry is i) s t)
    -> (forall p i. Pro p => p i a b -> p (Curry js i) u v)
    -> (forall p i. Pro p => p i a b -> p (Curry ks i) s t)
  compose k l = m
    where
      m :: forall p i. Pro p => p i a b -> p (Curry ks i) s t
      m | IxEq <- appendIndices @is @js @ks @i = \x -> k (l x)
