modules:
- |
  {-# LANGUAGE FunctionalDependencies, FlexibleInstances, UndecidableInstances #-}
  module Test where
  data Proxy a = Proxy
  data Bool = True
  (.) :: (b -> c) -> (a -> b) -> a -> c
  (.) f g x = f (g x)
  class Sel a r | a -> r, r -> a where
    count :: Proxy a -> Bool
    row :: Bool -> r
  instance (Sel a ra, Sel b rb) => Sel (a, b) (ra, rb) where
    count _ = True
    row b = (row b, row b)
  instance (Sel a ra, Sel b rb, Sel c rc) => Sel (a, b, c) (ra, rb, rc) where
    count = count . from3P
    row = to3 . row
  from3P :: Proxy (a, b, c) -> Proxy ((a, b), c)
  from3P _ = Proxy
  to3 :: ((a, b), c) -> (a, b, c)
  to3 ((a, b), c) = (a, b, c)
