modules:
- |
  {-# LANGUAGE GADTs, RankNTypes #-}
  module Test where
  data Box a = Box a
  data Accum w a where
    Add :: w -> Accum w ()
    Look :: Accum w w
  class Functor f where
    fmap :: (a -> b) -> f a -> f b
  instance Functor Box where
    fmap f (Box a) = Box (f a)
  (<$>) :: Functor f => (a -> b) -> f a -> f b
  (<$>) = fmap
  infixl 4 <$>
  (<$) :: Functor f => a -> f b -> f a
  (<$) a = fmap (\_ -> a)
  infixl 4 <$
  run :: Functor ctx => w -> Accum w a -> ctx () -> Box (ctx a)
  run e accum ctx = (<$ ctx) <$> case accum of
    Add _ -> Box ()
    Look -> Box e
reason: "the section (<$ ctx) fixes the element type of <$> at the result type a before the GADT branches of the case are checked under their givens; reduced from fused-effects Control.Carrier.Accum.IORef"
