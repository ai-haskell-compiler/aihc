status: pass
reason: The given equality a ~ () rewrites the given Gen (m a) to Gen (m ()). Its superclass then solves the wanted Str (m ()) of the instance superclass. Before the fix, the solver rewrote only a given of the class of the wanted, so the superclass stayed unsolved.
