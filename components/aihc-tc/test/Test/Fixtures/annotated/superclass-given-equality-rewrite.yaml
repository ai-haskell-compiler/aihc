- |
  {-# LANGUAGE TypeFamilies #-}
  {-# LANGUAGE FlexibleContexts #-}
  {-# LANGUAGE FlexibleInstances #-}
  module Test where
  class Str a where
    str :: a
  class Str l => Gen l where
    gen :: l -> l
  newtype Q m a = Q (m a)
  instance (Str (m ()), a ~ ()) => Str (Q m a) where
    str = Q str
  instance (Gen (m a), a ~ ()) => Gen (Q m a) where
