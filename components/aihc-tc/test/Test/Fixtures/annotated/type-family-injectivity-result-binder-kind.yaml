modules:
- |
  {-# LANGUAGE KindSignatures, MultiParamTypeClasses, PolyKinds, TypeFamilies, TypeFamilyDependencies #-}
  module Test where

  import GHC.Types (Type)

  data Arr a = Arr a
  data MArr s a = MArr a
  data Token s = Token

  type family Mutable (v :: Type -> Type) = (mv :: Type -> Type -> Type) | mv -> v

  type instance Mutable Arr = MArr

  class MVector (mv :: Type -> Type -> Type) a where
    newM :: a -> mv s a

  class MVector (Mutable v) a => Vector v a where
    freeze :: Mutable v s a -> Token s -> v a

  instance MVector MArr a where
    newM x = MArr x

  instance Vector Arr a where
    freeze (MArr x) _ = Arr x

  fromMutable :: Vector v a => Mutable v s a -> v a
  fromMutable m = freeze m Token

  roundTrip :: a -> Arr a
  roundTrip x = freeze (newM x) Token

  type family Plain a = r | r -> a
  type instance Plain (Arr ()) = MArr () ()

  type family Closed (v :: Type -> Type) = (mv :: Type -> Type -> Type) | mv -> v where
    Closed Arr = MArr

  closedNew :: a -> Closed Arr s a
  closedNew x = MArr x

  class Store (v :: Type -> Type) where
    type Frozen v = (mv :: Type -> Type -> Type) | mv -> v
    thaw :: v a -> Frozen v s a

  instance Store Arr where
    type Frozen Arr = MArr
    thaw (Arr x) = MArr x
