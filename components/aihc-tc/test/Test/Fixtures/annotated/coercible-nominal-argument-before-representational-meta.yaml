modules:
- |
  {-# LANGUAGE FlexibleContexts, MagicHash #-}
  module Test where
  import GHC.Types (Coercible)
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data List a = Nil | Cons a (List a)
  newtype Id a = Id a
  data Box f a = Box (f a)
  newtype Down a = Down a
  newtype Max a = Max (Box Id (Down a))
  toBox :: List b -> Box Id b
  toBox (Cons x _) = Box (Id x)
  toMax :: List a -> Max a
  toMax = coerce toBox
reason: The parameter of Box is nominal, so the argument type of toBox is Down a. A
  representational position must not first unify that type with a.
status: pass
