modules:
- |
  {-# LANGUAGE KindSignatures #-}
  module GHC.Base where
  import GHC.Types (Type)
  class Monad (m :: Type -> Type) where
    (>>=) :: m a -> (a -> m b) -> m b
    (>>) :: m a -> m b -> m b
    return :: a -> m a
- |
  {-# LANGUAGE TypeFamilies #-}
  module Test where
  import GHC.Base (Monad (..))
  data ST s a = ST a
  data Done = Done
  data Box s = Box
  data Arr s = Arr
  data MV s a = MV a
  data List a = Nil | Cons a (List a)
  instance Monad (ST s) where
    ST x >>= f = f x
    ST _ >> y = y
    return = ST
  class Monad m => PrimMonad m where
    type PrimState m
  instance PrimMonad (ST s) where
    type PrimState (ST s) = s
  counters :: Box s -> Arr s
  counters _ = Arr
  readArr :: PrimMonad m => Arr (PrimState m) -> m Done
  readArr _ = return Done
  sizeOf :: Box s -> ST s Done
  sizeOf _ = ST Done
  readMV :: PrimMonad m => MV (PrimState m) a -> m a
  readMV (MV x) = return x
  mapM :: Monad m => (a -> m b) -> List a -> m (List b)
  mapM _ Nil = return Nil
  mapM f (Cons x xs) = f x >>= \y -> mapM f xs >>= \ys -> return (Cons y ys)
  layout :: MV s Done -> List (Box s, Done) -> ST s (List Done)
  layout positions boxes = do
    placed <- mapM (\(box, _) -> do
      size <- sizeOf box
      alignment <- readArr (counters box)
      bytes <- sizeOf box
      readMV positions) boxes
    return placed
reason: the equality m ~ ST (PrimState m) gives m a solution through a fresh variable
  for the family application, and the application then reduces to that variable
status: pass
