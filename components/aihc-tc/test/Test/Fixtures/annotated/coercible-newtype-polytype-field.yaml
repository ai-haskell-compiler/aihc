- |
  {-# LANGUAGE MagicHash, RankNTypes, RoleAnnotations, KindSignatures, DataKinds #-}
  module Main where
  import GHC.Types (Coercible)
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data Effects = Union Effects Effects
  newtype Eff (es :: Effects) a = MkEff (() -> a)
  type role Eff nominal representational
  newtype Throw exn (e :: Effects) = MkThrow (forall a. exn -> Eff e a)
  castThrow :: Throw exn e -> Throw exn es
  castThrow = coerce
reason: Coercible relates two newtypes whose fields are polytypes, because the solver relates
