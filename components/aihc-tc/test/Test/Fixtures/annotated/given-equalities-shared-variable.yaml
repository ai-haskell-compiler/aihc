extensions:
  - DataKinds
  - GADTs
  - TypeOperators
modules:
  - |
    {-# LANGUAGE DataKinds, GADTs, TypeOperators #-}
    module Test where
    data RList a = RNil | RList a :> a
    class Sym a where
      sym :: a -> a
    data Insts as where
      InstsCons :: Sym a => Insts as -> Insts (as ':> a)
    data Vals as where
      ValsCons :: Vals as -> a -> Vals (as ':> a)
    headSym :: Insts as -> Vals as -> ()
    headSym (InstsCons _) (ValsCons _ v) = case sym v of _ -> ()
