  infixl 6 -
- |
  {-# LANGUAGE DataKinds, KindSignatures, TypeOperators #-}
  module Test where
  import GHC.Prim.Natural (Natural)
  import GHC.TypeNats (type (-))
  data P (n :: Natural) = P
  split :: P n -> (P p, P (n - p))
  split _ = (P, P)
  rest :: P n -> P (n - 1)
  rest v = snd (split v)
  four :: P 4
  four = snd (split (P :: P 7))
  snd :: (a, b) -> b
  snd (_, b) = b
status: pass
reason: The equality n - p0 ~ n - 1 gives p0 ~ 1, and the equality
