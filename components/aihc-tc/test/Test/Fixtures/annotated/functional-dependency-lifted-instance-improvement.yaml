- |
  {-# LANGUAGE KindSignatures, UndecidableInstances #-}
  module Test where
  import GHC.Types (Type)
  data Chr = Chr
  data Txt = Txt
  data Void
  newtype Identity a = Identity a
  type family Token s
  type instance Token Txt = Chr
  class Stream s where
    tokenOf :: s -> Token s
  instance Stream Txt where
    tokenOf _ = Chr
  class Stream s => MonadParsec e s (m :: Type -> Type) | m -> e s where
    token :: Token s -> m (Token s)
  newtype ParsecT e s m a = ParsecT (s -> m a)
  newtype ReaderT r m a = ReaderT (r -> m a)
  instance Stream s => MonadParsec e s (ParsecT e s m) where
    token t = token t
  instance MonadParsec e s m => MonadParsec e s (ReaderT r m) where
    token t = ReaderT (\_ -> token t)
  char :: (MonadParsec e s m, Token s ~ Chr) => Token s -> m (Token s)
  char = token
  type Parser = ReaderT Txt (ParsecT Void Txt Identity)
  equals :: Parser Chr
  equals = char Chr
  attempt :: MonadParsec e s m => m a -> m a
  attempt parser = parser
  retry :: Parser Chr
  retry = attempt equals
