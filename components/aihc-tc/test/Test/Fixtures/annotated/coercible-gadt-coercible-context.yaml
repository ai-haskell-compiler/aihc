- |
  {-# LANGUAGE GADTs, MultiParamTypeClasses, FlexibleContexts, MagicHash #-}
  module Test where
  import GHC.Types (Coercible, Int (..))
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  newtype Age = Age Int
  data KeyFunction a where
    KeyCoerce :: Coercible Int a => KeyFunction a
    KeyText :: (Int -> a) -> KeyFunction a
  useKey :: KeyFunction a -> Int -> a
  useKey KeyCoerce n = coerce n
  useKey (KeyText f) n = f n
  coerceKey :: Coercible a b => KeyFunction a -> KeyFunction b
  coerceKey = coerce
  ageKey :: KeyFunction Int -> KeyFunction Age
  ageKey = coerce
  class Named a
  data Tagged a where
    Tagged :: Named a => a -> Tagged a
  tagAge :: Tagged Int -> Tagged Age
  tagAge = coerce
