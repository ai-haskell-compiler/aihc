modules:
- |
  {-# LANGUAGE DataKinds, PolyKinds, GADTs, TypeOperators, KindSignatures, RankNTypes, ScopedTypeVariables #-}
  module Test where
  import GHC.Types (Type)
  data Opt a = None | Some a
  data NS (f :: k -> Type) (xs :: [k]) where
    Z :: f x -> NS f (x ': xs)
    S :: NS f xs -> NS f (x ': xs)
  compose :: (b -> c) -> (a -> b) -> a -> c
  compose f g x = f (g x)
  idNS :: NS f xs -> NS f xs
  idNS x = x
  shift :: forall f x xs . (NS f xs -> Opt ()) -> NS f (x ': xs) -> Opt ()
  shift k = compose (\ns -> case ns of Z _ -> None; S s -> k s) idNS
reason: "the type of the scrutinee ns comes from the later argument idNS, thus the given of the S branch waits for it and then proves xs ~ xs1"
