extensions: [FlexibleContexts, QuantifiedConstraints]
modules:
  - |
    {-# LANGUAGE FlexibleContexts, QuantifiedConstraints #-}
    module Test where
    import GHC.Types (Coercible)
    -- The superclass of the instance unwraps the newtype to @m (a, w)@.
    -- Only the quantified superclass of @Lift m@ solves that pair.
    class (forall a b. Coercible a b => Coercible (m a) (m b)) => Lift m
    newtype Pair w m a = Pair (m (a, w))
    instance Lift m => Lift (Pair w m)
    newtype Arrow s m a = Arrow (s -> m (a, s))
    instance Lift m => Lift (Arrow s m)
