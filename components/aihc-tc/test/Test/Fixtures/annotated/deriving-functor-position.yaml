- |
  {-# LANGUAGE DeriveFunctor #-}
  module Main where
  import GHC.Prim.Base (Functor)
  import GHC.Types (Bool)
  data Pair b a = Pair b a
  data Swapped a = Swapped (Pair a Bool)
    deriving Functor
  data Argument a = Argument (a -> Bool)
    deriving Functor
  data Nested f a = Nested (f a) (f (f a)) Bool
    deriving Functor
reason: the last parameter of a datatype has to sit in the last argument of a type,
  where the instance of that type can reach it; the types around a nested one
  become the context
