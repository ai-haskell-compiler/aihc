- |
  {-# LANGUAGE MultiParamTypeClasses, FlexibleInstances, FlexibleContexts, UndecidableInstances #-}
  module Test where
  class Monad m where
    ret :: a -> m a
  class MonadTrans t where
    lift :: Monad m => m a -> t m a
  class Monad m => MonadState s m where
    get :: m s
  data CmdM m a = CmdM (m a) | Result a
  instance Monad m => Monad (CmdM m) where
    ret = Result
  instance MonadTrans CmdM where
    lift m = CmdM m
  instance {-# OVERLAPPABLE #-} (MonadState s m, MonadTrans t, Monad (t m)) => MonadState s (t m) where
    get = lift get
  data Undo = Undo
  peek :: MonadState Undo m => CmdM m Undo
  peek = get
