modules:
- |
  {-# LANGUAGE GADTs, TypeFamilies #-}
  module A where
  data M a = M a
  data L a = L a
  type family Snd a where Snd (M y) = y
  data R r where
    C :: Snd r -> R (L r)
  newtype I a = I a
  g :: R (L (M t)) -> I t
  g (C x) = I x
