- |
  module Test where
  data Nat = Z | S Nat
  data Box a = Box { unBox :: a }
  class Ranged a where
    range :: a -> (Nat, Nat)
  useRange :: Ranged a => a -> Nat
  useRange f =
    let (lo, hi) = range f
        lo' = S lo
        hi' = S hi
     in lo' `also` hi'
  fromList :: [Nat] -> Nat
  fromList xs = a `also` b
    where
      [a, b] = xs
  fromBox :: Box Nat -> Nat
  fromBox box = inner
    where
      Box { unBox = inner } = box
  also :: a -> b -> b
  also _ b = b
