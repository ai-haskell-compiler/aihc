  │     │       │           └─ type: Int; evidence: given ?foo ∷ Int
  │     │       └─ type: Int
  │     └─ type: Int
  └─ type: Int → Int
extensions:
- ImplicitParams
- ConstraintKinds
modules:
- |
  {-# LANGUAGE ImplicitParams #-}
  module Test where
  data Int = Int
  data SrcLoc = SrcLoc
  data CallStack = EmptyCallStack | PushCallStack Int SrcLoc CallStack
  type HasCallStack = (?callStack :: CallStack)
  renamed :: HasCallStack => Int -> CallStack
  renamed _ = ?callstack
  caller :: HasCallStack => CallStack
  caller = renamed Int
  lowerGiven :: (?callstack :: CallStack) => CallStack
  lowerGiven = renamed Int
  bound :: Int -> Int
  bound x = let ?foo = x in ?foo
reason: an implicit parameter of type CallStack is a call stack whatever its name, and a plain implicit parameter is not
