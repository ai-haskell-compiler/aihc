  └─ type: (?callStack ∷ CallStack) ⇒ CallStack
  lowerGiven :: (?callstack :: CallStack) => CallStack
  lowerGiven = renamed Int
  │            └─ type: Int → CallStack; evidence: push(renamed@12:14, emptyCallStack)
  └─ type: (?callstack ∷ CallStack) ⇒ CallStack
  bound :: Int -> Int
