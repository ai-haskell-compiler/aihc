       │        └─ type: SrcLoc
       └─ type: Type
  data CallStack = EmptyCallStack | PushCallStack Int SrcLoc CallStack
       │           │                └─ type: Int → SrcLoc → CallStack → CallStack
       │           └─ type: CallStack
       └─ type: Type
