status: pass
reason: A class wanted is equal to a class given through a derived equality, as
  in GHC. The superclass Elem (Storage (Elem r)) ~ Elem r, rewritten with the given
  Storage (Elem r) ~ Reactive r s, reduces to Elem s ~ Elem r. Thus the given
  Has w (Elem r) solves the wanted Has w (Elem s). This is withReactive of apecs.
