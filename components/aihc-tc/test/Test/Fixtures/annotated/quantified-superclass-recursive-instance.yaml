- |
  {-# LANGUAGE FlexibleContexts, KindSignatures, QuantifiedConstraints, UndecidableInstances #-}
  module Test where

  import GHC.Types (Type)

  class NFData a where
    rnf :: a -> a

  class (forall a. NFData a => NFData (f a)) => NFData1 (f :: Type -> Type) where
    liftRnf :: (b -> b) -> f b -> f b

  class (forall a. NFData a => NFData1 (p a)) => NFData2 (p :: Type -> Type -> Type) where
    liftRnf2 :: (a -> a) -> (b -> b) -> p a b -> p a b

  newtype Fix p a = In (p (Fix p a) a)

  instance NFData (p (Fix p a) a) => NFData (Fix p a) where
    rnf x = x

  instance NFData2 p => NFData1 (Fix p) where
    liftRnf _ x = x
