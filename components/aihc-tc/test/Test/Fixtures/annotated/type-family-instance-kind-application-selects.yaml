modules:
- |
  {-# LANGUAGE DataKinds, GADTs, PolyKinds, StandaloneKindSignatures, TypeAbstractions, TypeFamilies, RankNTypes, TypeApplications, TypeOperators #-}
  module Test where
  import GHC.Types
  type Sing :: k -> Type
  type family Sing @k :: k -> Type
  type WrappedSing :: k -> Type
  newtype WrappedSing :: forall k. k -> Type where
    WrapSing :: forall k (a :: k). Sing a -> WrappedSing a
  type SWrappedSing :: forall k (a :: k). WrappedSing a -> Type
  newtype SWrappedSing :: forall k (a :: k). WrappedSing a -> Type where
    SWrapSing :: forall k (a :: k) (ws :: WrappedSing a). Sing a -> SWrappedSing ws
  type instance Sing @(WrappedSing a) = SWrappedSing
  data TyFun :: Type -> Type -> Type
  type (~>) :: Type -> Type -> Type
  type a ~> b = TyFun a b -> Type
  infixr 0 ~>
  type family Apply (f :: k1 ~> k2) (x :: k1) :: k2
  type a @@ b = Apply a b
  infixl 9 @@
  newtype SLambda (f :: k1 ~> k2) =
    SLambda { applySing :: forall t. Sing t -> Sing (f @@ t) }
  type instance Sing @(k1 ~> k2) = SLambda
  type SingFunction1 :: (a1 ~> b) -> Type
  type SingFunction1 (f :: a1 ~> b) = forall t. Sing t -> Sing (f @@ t)
  singFun1 :: forall f. SingFunction1 f -> Sing f
  singFun1 f = SLambda f
  type SingFunction2 :: (a1 ~> a2 ~> b) -> Type
  type SingFunction2 (f :: a1 ~> a2 ~> b) = forall t1 t2. Sing t1 -> Sing t2 -> Sing (f @@ t1 @@ t2)
  singFun2 :: forall f. SingFunction2 f -> Sing f
  singFun2 f = SLambda (\x -> singFun1 (f x))
