  │        │   ││        ││    └─ type: ∀ t. Sing t → Sing (Apply (Apply f t) t)
  │        │   ││        ││    └─ type: (∀ t. Sing t → Sing (Apply (Apply f t) t)) → Sing (Apply f t); type-args: k1, k2, Apply f t
  │        │   ││        │└─ type: Sing t
  │        │   ││        └─ type: Sing t → Sing (Apply f t)
  │        │   └─ type: ∀ t. Sing t → Sing (Apply f t)
  │        │   └─ type: (∀ t. Sing t → Sing (Apply f t)) → SLambda f; type-args: k0, TyFun k1 k2 → Type, f
  │        └─ type: ∀ t1 t2. Sing t1 → Sing t2 → Sing (Apply (Apply f t1) t2)
  └─ type: ∀ k0 k1 k2 f. (∀ t1 t2. Sing t1 → Sing t2 → Sing (Apply (Apply f t1) t2)) → Sing f
status: pass
reason: a family with an invisible kind binder, as Sing, selects the instance from the kind argument. A bare Sing does not give its kind, so it does not reduce to the first instance. singFun2 then checks, as in GHC.
