modules:
- |
  {-# LANGUAGE GADTs #-}
  module Test where
  data Bool = True | False
  data Maybe a = Nothing | Just a
  data a :~: b where
    Refl :: a :~: a
  data T a where
    TB :: T Bool
  same :: T a -> T b -> Maybe (a :~: b)
  same TB TB = Just Refl
  two :: T a -> T b -> T c -> T d -> Maybe ((a, c) :~: (b, d))
  two x y z w
    | Just Refl <- same x y
    , Just Refl <- same z w
    = Just Refl
  two _ _ _ _ = Nothing
