modules:
- |
  {-# LANGUAGE ExistentialQuantification, RankNTypes, GADTs #-}
  module Test where
  data Box = forall a. MkBox a
  ignore :: x -> ()
  ignore _ = ()
  leak :: Box -> ()
  leak b = (\k -> case b of MkBox v -> k v) ignore
  data G a where
    G :: b -> G ()
  leakG :: G () -> ()
  leakG g = (\k -> case g of G v -> k v) ignore
  ok :: Box -> ()
  ok b = case b of MkBox v -> ignore v
  ok2 :: (forall x. x -> ()) -> Box -> ()
  ok2 k b = case b of MkBox v -> k v
reason: "an existential type variable of a branch must not leave it through the type of an outer lambda binder that the branch fixes, as GHC rejects leak and leakG; ok and ok2 stay valid"
