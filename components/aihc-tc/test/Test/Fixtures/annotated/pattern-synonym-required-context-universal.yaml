modules:
- |
  {-# LANGUAGE PatternSynonyms, ViewPatterns, FunctionalDependencies #-}
  module Test where
  import GHC.Types (Bool (..), Int)
  class Conv a b | a -> b where
    to :: a -> b
  instance Conv Bool Int where
    to _ = to True
  pattern Conv :: Conv s t => t -> s
  pattern Conv a <- (to -> a)
  use :: Bool -> Int
  use (Conv n) = n
reason: A variable of the required context of a pattern synonym is universal, also when the result type does not mention it. Thus a use instantiates it and the functional dependency solves it.
