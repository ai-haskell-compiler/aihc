modules:
- |
  {-# LANGUAGE GADTs, DataKinds, KindSignatures #-}
  module Test where
  data Bool = True | False
  data Ctx = E | S Ctx
  data A (c :: Ctx) where
    AE :: A 'E
    AX :: A c -> Bool -> A ('S c)
  extend :: Bool -> A c -> A c
  extend f x = go x
    where
      go AE = AE
      go (AX a u) = AX a f
  keep :: A c -> A c
  keep t =
    let m = case t of
              AE -> AE
              _ -> t
     in m
  wrong :: Bool -> A c -> A c
  wrong f x = go x
    where
      go AE = AE
      go (AX a u) = AE
reason: The local binders have no signature and are not generalized. A GADT branch does not fix the type of a binder alone, as in GHC. The use go x, or the other branch, fixes it, and the givens of the branch then prove the branch result. The function wrong still gets an error.
