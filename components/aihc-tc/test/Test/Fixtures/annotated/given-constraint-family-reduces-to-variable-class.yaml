  data X a
  data family Param (n :: Natural) (a :: k) :: k
  type P = Param
  type family GAllRec (n :: Natural) (c :: k -> Constraint) (l :: Type) (r :: Type) :: Constraint where
    GAllRec n c (P n X _) (X a) = c a
