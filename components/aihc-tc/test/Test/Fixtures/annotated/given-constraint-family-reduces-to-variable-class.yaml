  type family GAll (n :: Natural) (c :: k -> Constraint) (repbf :: Type -> Type) :: Constraint
  type instance GAll n c (Rec l r) = GAllRec n c l r
  class GConstraints n c repbx result where
    gdict :: GAll n c repbx => Proxy repbx -> result
  data Proxy (a :: k) = Proxy
