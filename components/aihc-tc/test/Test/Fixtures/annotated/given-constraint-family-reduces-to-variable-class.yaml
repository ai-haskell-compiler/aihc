- |
  {-# LANGUAGE AllowAmbiguousTypes, FlexibleInstances, MultiParamTypeClasses, ConstraintKinds, DataKinds, FlexibleContexts, GADTs, KindSignatures, PolyKinds, ScopedTypeVariables, TypeFamilies, UndecidableInstances #-}
  module Test where
