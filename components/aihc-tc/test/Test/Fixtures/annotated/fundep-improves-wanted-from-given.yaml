- |
  {-# LANGUAGE FunctionalDependencies, AllowAmbiguousTypes, KindSignatures, DataKinds, FlexibleInstances, UndecidableInstances, PolyKinds, GADTs, TypeOperators, FlexibleContexts, TypeFamilies #-}
  module Test where
  import GHC.Types (Type, Symbol)
  data ResponseHeader (sym :: Symbol) a = Header a
  newtype I a = I a
  data NS (f :: k -> Type) (xs :: [k]) where
    Z :: f x -> NS f (x ': xs)
    S :: NS f xs -> NS f (x ': xs)
  type Union = NS I
  class AddHeader (mods :: [Type]) h v orig new | mods h v orig -> new, new -> mods, new -> h, new -> v, new -> orig where
    add :: ResponseHeader h v -> orig -> new
