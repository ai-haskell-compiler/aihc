modules:
- |
  module Test where
  data Nat = Z | S Nat
  data Bag = Bag Nat
  class Container c where
    type Elem c
    fromElems :: [Elem c] -> c
    firstElem :: c -> Elem c
  instance Container Bag where
    type Elem Bag = Nat
    fromElems xs = Bag (count xs)
    firstElem (Bag n) = n
  instance Container [a] where
    type Elem [a] = a
    fromElems xs = xs
    firstElem (x : _) = x
    firstElem [] = firstElem []
  count :: [a] -> Nat
  count [] = Z
  count (_ : rest) = S (count rest)
  type family Twice a where
    Twice Nat = [Nat]
    Twice a = a
  twiceNat :: Twice Nat
  twiceNat = [Z]
  twiceBag :: Twice Bag -> Nat
  twiceBag (Bag n) = n
  bagFirst :: Nat
  bagFirst = S (firstElem (fromElems [Z] :: Bag))
reason: a saturated type family application reduces with its equation, so an
