  │    │          │                   └─ type: ∀ a b. Stmt a b → Alt a b → Stmt a b
  │    │          └─ type: ∀ a b. b → Expr a b → Stmt a b
  │    └─ type: Type → Type → Type
  └─ deriving plans: stock Eq (Stmt a b) [context: Eq b, Eq a] [methods: ==, /=]
    deriving stock Eq
  data Alt a b = Alt (Expr a b) (Stmt a b)
  │    │         └─ type: ∀ a b. Expr a b → Stmt a b → Alt a b
  │    └─ type: Type → Type → Type
  └─ deriving plans: stock Eq (Alt a b) [context: Eq a, Eq b] [methods: ==, /=]
    deriving stock Eq
extensions:
