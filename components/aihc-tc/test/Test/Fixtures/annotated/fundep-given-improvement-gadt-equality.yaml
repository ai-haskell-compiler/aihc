modules:
- |
  {-# LANGUAGE DataKinds, FunctionalDependencies, GADTs, KindSignatures, ScopedTypeVariables, TypeOperators, FlexibleInstances, FlexibleContexts, PolyKinds #-}
  module Test where
  import GHC.Types
  data Proxy (t :: k) = Proxy
  data N = Z | S N
  data HSet (elems :: [Type]) where
    HSNil :: HSet '[]
    HSCons :: e -> HSet elems -> HSet (e ': elems)
  class HRemove els1 els2 (i :: N) | els1 i -> els2 where
    hremove :: proxy i -> HSet els1 -> HSet els2
  data Box where
    Box :: HSet els -> Box
  class Drop els (i :: N) where
    dropAt :: HSet els -> Box
  instance HRemove els elsx i => Drop (e ': els) i where
    dropAt (HSCons _ rest) = Box (hremove (Proxy :: Proxy i) rest)
