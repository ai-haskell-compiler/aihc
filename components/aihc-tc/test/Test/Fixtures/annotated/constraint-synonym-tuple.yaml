extensions:
- ConstraintKinds
- FlexibleContexts
- ScopedTypeVariables
modules:
- |
  {-# LANGUAGE ConstraintKinds, FlexibleContexts, ScopedTypeVariables #-}
  module Test where
  import GHC.Types (Bool (..))
  import GHC.Classes ((&&))
  class Named a where
    named :: a -> Bool
  class Sized a where
    sized :: a -> Bool
  -- A constraint synonym whose right-hand side is a tuple of
  -- two class constraints.
  type Valid a = (Named a, Sized a)
  newtype Box a = Box a
  -- Used in a signature: both components are givens in the body.
  valid :: Valid a => a -> Bool
  valid x = named x && sized x
  -- Used in an instance context: both components are givens in the
  -- methods, and the synonym itself is a wanted.
  instance Valid a => Named (Box a) where
    named (Box x) = valid x
  instance Valid a => Sized (Box a) where
    sized (Box x) = sized x
  data S = S
  instance Named S where
    named _ = True
  instance Sized S where
    sized _ = False
  result :: Bool
  result = valid (Box S)
