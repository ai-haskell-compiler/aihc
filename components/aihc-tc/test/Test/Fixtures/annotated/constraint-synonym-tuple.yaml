    sized (Box x) = sized x
    │      │   │    └─ type: a → GHC.Types.Bool; type-args: a; evidence: given Sized a
    │      │   └─ type: a
    │      └─ type: Box a
    └─ sized ∷ Box a → Bool
  data S = S
       │   └─ type: S
       └─ type: Type
  instance Named S where
  └─ $fNamedS ∷ () ⇒ Named S
    named _ = True
    │     └─ type: S
    └─ named ∷ S → Bool
  instance Sized S where
  └─ $fSizedS ∷ () ⇒ Sized S
    sized _ = False
    │     └─ type: S
    └─ sized ∷ S → Bool
  result :: Bool
