  import GHC.Classes ((&&))
  class Named a where
  └─ class methods: named ∷ ∀ a. (Named a) ⇒ a → Bool
    named :: a -> Bool
  class Sized a where
  └─ class methods: sized ∷ ∀ a. (Sized a) ⇒ a → Bool
    sized :: a -> Bool
  -- A constraint synonym whose right-hand side is a tuple of
