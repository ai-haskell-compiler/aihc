    named (Box x) = valid x
    │      │   │    └─ type: a → GHC.Types.Bool; type-args: a; evidence: given Named a, given Sized a
    │      │   └─ type: a
    │      └─ type: Box a
    └─ named ∷ Box a → Bool
  instance Valid a => Sized (Box a) where
