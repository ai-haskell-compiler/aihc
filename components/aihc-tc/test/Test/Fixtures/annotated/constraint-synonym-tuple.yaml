  type Valid a = (Named a, Sized a)
       └─ type: Type → GHC.Types.Constraint
  newtype Box a = Box a
          │       └─ type: ∀ a. a → Box a
          └─ type: Type → Type
  -- Used in a signature: both components are givens in the body.
  valid :: Valid a => a -> Bool
  valid x = named x && sized x
  │     │   │          └─ type: a → GHC.Types.Bool; type-args: a; evidence: given Sized a
  │     │   └─ type: a → GHC.Types.Bool; type-args: a; evidence: given Named a
  │     └─ type: a
  └─ type: ∀ a. (Named a, Sized a) ⇒ a → GHC.Types.Bool
  -- Used in an instance context: both components are givens in the
