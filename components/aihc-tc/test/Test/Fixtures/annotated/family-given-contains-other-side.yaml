            └─ type: Type → Type
    class B s p | s -> p where
    └─ class methods: interp ∷ ∀ s p. (B s p) ⇒ s → p; fundeps: s → p
      interp :: s -> p
    instance B (P p) p where
    └─ $fBPpp ∷ ∀ p. () ⇒ B (P p) p
      interp (P x) = x
      │       │ └─ type: p
      │       └─ type: P p
      └─ interp ∷ P p → p
    unit :: x -> ()
    unit _ = ()
    │    │   └─ type: ()
    │    └─ type: x
    └─ type: ∀ x. x → ()
    probe :: (F (F a) ~ F a) => P (F a) -> ()
    probe p = unit (interp p)
    │     │   │     └─ type: P (F a) → F a; type-args: P (F a), F a; evidence: $fBPpp @F a
    │     │   └─ type: F a → (); type-args: F a
