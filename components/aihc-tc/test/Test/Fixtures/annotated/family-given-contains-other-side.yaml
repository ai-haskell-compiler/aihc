extensions: [TypeFamilies, FlexibleContexts, FunctionalDependencies, FlexibleInstances]
modules:
  - |
    {-# LANGUAGE TypeFamilies, FlexibleContexts, FunctionalDependencies, FlexibleInstances #-}
    module Test where
    type family F a
    newtype P a = P a
    class B s p | s -> p where
      interp :: s -> p
    instance B (P p) p where
      interp (P x) = x
    unit :: x -> ()
    unit _ = ()
    probe :: (F (F a) ~ F a) => P (F a) -> ()
    probe p = unit (interp p)
annotated:
