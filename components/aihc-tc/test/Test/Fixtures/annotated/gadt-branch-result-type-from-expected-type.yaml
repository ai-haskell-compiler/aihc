- |
  {-# LANGUAGE DataKinds, PolyKinds, GADTs, TypeOperators, KindSignatures, RankNTypes, ScopedTypeVariables #-}
  module Test where
  import GHC.Types (Type)
  data Opt a = None | Some a
  data NS (f :: k -> Type) (xs :: [k]) where
    Z :: f x -> NS f (x ': xs)
    S :: NS f xs -> NS f (x ': xs)
  data NP (f :: k -> Type) (xs :: [k]) where
    Nil :: NP f '[]
    (:*) :: f x -> NP f xs -> NP f (x ': xs)
  infixr 5 :*
  data SList (xs :: [k]) where
    SNil :: SList '[]
    SCons :: SList (x ': xs)
  newtype K (a :: Type) (b :: k) = K a
  unK :: K a b -> a
  unK (K a) = a
  newtype (f -.-> g) a = Fn (f a -> g a)
  infixr 1 -.->
  fn :: (f a -> f' a) -> (f -.-> f') a
  fn = Fn
  newtype (:.:) (f :: l -> Type) (g :: k -> l) (p :: k) = Comp (f (g p))
  infixr 7 :.:
  (.) :: (b -> c) -> (a -> b) -> a -> c
  (.) f g x = f (g x)
  infixr 9 .
  hd :: forall f x xs . NS f (x ': xs) -> (Opt :.: f) x
  hd = Comp . (\ns -> case ns of Z fx -> Some fx; S _ -> None)
  type Ejection (f :: k -> Type) (xs :: [k]) = K (NS f xs) -.-> Opt :.: f
  ejections :: forall xs f . SList xs -> (forall g ys . NP g ys) -> NP (Ejection f xs) xs
  ejections sl tl = case sl of
    SNil -> Nil
    SCons -> fn (Comp . (\ns -> case ns of Z fx -> Some fx; S _ -> None) . unK) :* tl
