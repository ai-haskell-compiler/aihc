modules:
- |
  {-# LANGUAGE TypeFamilies #-}
  module Prelude where
  import GHC.Types (Type)
  data Unit = Unit
  newtype ST s a = ST a
  data MArr s = MArr
  data Arr = Arr
  class Assoc m where
    type State m
    freeze :: MArr (State m) -> m Arr
  instance Assoc (ST s) where
    type State (ST s) = s
    freeze _ = ST Arr
  unST :: ST s a -> a
  unST (ST x) = x
  runST :: (forall s. ST s a) -> a
  runST m = unST m
- |
  {-# LANGUAGE TypeFamilies, RankNTypes #-}
  module Use where
  import Prelude
  bind :: ST s a -> (a -> ST s b) -> ST s b
  bind (ST x) k = k x
  runArr :: (forall s. ST s (MArr s)) -> Arr
  runArr m = runST (bind m freeze)
