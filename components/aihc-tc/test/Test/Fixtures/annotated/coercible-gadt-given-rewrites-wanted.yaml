- |
  {-# LANGUAGE GADTs, MagicHash, PartialTypeSignatures, RoleAnnotations #-}
  module Test where
  import GHC.Types (Coercible, Int (..))
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data V = V
  data Codec ctx a where
    ValueCodec :: Coercible V a => Codec V a
  fromValue :: ctx -> Codec ctx a -> a
  fromValue v c = case c of
    ValueCodec -> coerce v
  type role M nominal representational
