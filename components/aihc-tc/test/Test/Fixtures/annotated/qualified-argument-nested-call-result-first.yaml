modules:
- |
  {-# LANGUAGE GADTs, RankNTypes #-}
  module Test where
  apply :: (a -> b) -> a -> b
  apply f x = f x
  data Pr a b = Pr
  data Ord x y where
    Lt :: Ord x y
    Eq :: Ord x x
  join :: Ord a b -> (a ~ b => Ord c d) -> Ord c d
  join Eq y = y
  join Lt _ = Lt
  nested :: Ord x1 y1 -> Ord x2 y2 -> Ord (Pr x1 x2) (Pr y1 y2)
  nested o1 o2 = join o1 (join o2 Eq)
  applied :: Ord x1 y1 -> Ord x2 y2 -> Ord (Pr x1 x2) (Pr y1 y2)
  applied o1 o2 = apply (join o1) (apply (join o2) Eq)
reason: The result type fixes c and d of the outer join before its qualified argument is checked, as in GHC. The inner call and Eq then see them under the givens a ~ b. With apply, the parameter type is qualified only after the look at the first argument.
status: pass
