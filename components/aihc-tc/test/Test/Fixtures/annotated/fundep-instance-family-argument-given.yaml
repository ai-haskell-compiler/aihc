extensions: [TypeFamilies, MultiParamTypeClasses, FunctionalDependencies, FlexibleInstances, FlexibleContexts]
modules:
  - |
    {-# LANGUAGE TypeFamilies, MultiParamTypeClasses, FunctionalDependencies, FlexibleInstances, FlexibleContexts #-}
    module Test where
    type family Item l
    type instance Item [a] = a
    class Like full item | full -> item where
      isp :: item -> full -> full
    instance Like [a] a where
      isp _ xs = xs
    data Bool = False | True
    data Box a = Box a
    class Sing v where
      sing :: a -> v a
    instance Sing Box where
      sing = Box
    f :: (Item full ~ Box Bool) => full -> [Item full] -> [Item full]
    f _ xs = let sp = sing True in isp sp xs
