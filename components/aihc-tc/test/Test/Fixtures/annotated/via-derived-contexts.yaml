- |
  {-# LANGUAGE DerivingStrategies, DerivingVia #-}
  module Main where
  class Semigroup a where
    append :: a -> a -> a
    append x y = x
  newtype App f a = App (f a)
  data Pair a = MkPair a a
    deriving Semigroup via (App Pair a)
  instance Semigroup a => Semigroup (App Pair a)
  class Semigroup a => Monoid a where
    empty :: a
    empty = empty
  instance Monoid a => Monoid (App Pair a)
  newtype Both a = Both (Pair a)
    deriving Monoid via (App Pair a)
  instance Semigroup (Both a)
  data Missing = Missing
    deriving Semigroup via (App Pair Missing)
reason: A via instance coerces the methods of the via type's instance, in both
  directions through the newtypes involved. The context asks the class of the via type and the superclasses at the
  derived head, simplifies them through the instances in scope, and rejects a via
  type that stands on the instance being derived
