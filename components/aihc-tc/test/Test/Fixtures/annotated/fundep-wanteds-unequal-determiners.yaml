- |
  {-# LANGUAGE FunctionalDependencies, FlexibleInstances #-}
  module Test where
  class Functor f where
    fmap :: (a -> b) -> f a -> f b
  class MonadFree f m | m -> f where
    wrap :: f (m a) -> m a
  newtype Free f a = Free (f a)
  newtype F f a = F (f a)
  instance MonadFree f (Free f) where
    wrap = wrap
  instance MonadFree f (F f) where
    wrap = wrap
  liftF :: (Functor f, MonadFree f m) => f a -> m a
  liftF = liftF
  fromF :: MonadFree f m => F f a -> m a
  fromF = fromF
  data Nat = Z | S Nat
  data Cmd px next = Set px next
  instance Functor (Cmd px) where
    fmap = fmap
  go :: Free (Cmd px) () -> Nat
  go _ = Z
  pair :: Nat -> Nat -> Nat
  pair _ n = n
  both :: F (Cmd px) () -> Nat
  both draw = pair (go (fromF (liftF (Set Z ())))) (go (fromF draw))
reason: two wanteds improve each other through a functional dependency
  only when their determining parameters are equal; the two fromF calls
  have determiners that only a later solution can make equal, and they are
  at different types
