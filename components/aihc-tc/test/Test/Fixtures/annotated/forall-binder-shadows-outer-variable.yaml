- |
  {-# LANGUAGE RankNTypes, PolyKinds #-}
  module Main where
  import GHC.Types (Bool (..))
  class Functorish t where
    promap :: (forall a b. p a b -> q a b) -> t p a b -> t q a b
  newtype Rift p q a b = Rift (forall x. p b x -> q a x)
  instance Functorish (Rift p) where
    promap f (Rift g) = Rift (\x -> f (g x))
  both :: (forall a. a -> a) -> a -> (a, Bool)
  both f x = (f x, f True)
