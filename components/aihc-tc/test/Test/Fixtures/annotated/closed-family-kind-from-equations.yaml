annotated:
- |-
  {-# LANGUAGE ConstraintKinds, DataKinds, FlexibleContexts, KindSignatures, PolyKinds, StandaloneKindSignatures, TypeFamilies, UndecidableInstances #-}
  module Test where

  import GHC.Prim.Natural (Natural)
  import GHC.Types (Bool (..), Constraint, Type)

  data Integer = Integer
       │         └─ type: Integer
       └─ type: Type
  data Word8 = Word8
       │       └─ type: Word8
       └─ type: Type
  data Proxy (n :: Natural) = Proxy
       │                      └─ type: ∀ n. Proxy n
       └─ type: GHC.Prim.Natural.Natural → Type

  class Ok
  └─ class methods:
  instance Ok
  └─ $fOk ∷ () ⇒ Ok
  class Never
  └─ class methods:

  type MaxBound :: Type -> Natural
  type family MaxBound ty
              └─ type: Type → GHC.Prim.Natural.Natural
  type instance MaxBound Word8 = 255

  type LeQ :: k -> k -> Bool
  type family LeQ a b
              └─ type: k → k → GHC.Types.Bool

  type If :: Bool -> k -> k -> k
  type family If c t e where
              └─ type: GHC.Types.Bool → k → k → k
    If 'True t e = t
    If 'False t e = e

  -- The result kind Bool and the kind Natural of @n@ come from the equations.
  type family InBound ty n where
              └─ type: Type → GHC.Prim.Natural.Natural → GHC.Types.Bool
    InBound Integer n = 'True
    InBound ty n = LeQ n (MaxBound ty)

  -- The result kind Natural comes from the literal.
  type family Limit ty where
              └─ type: Type → GHC.Prim.Natural.Natural
    Limit Integer = 0
    Limit ty = MaxBound ty

  -- The result kind Constraint comes from the branches of @If@.
  type family WithinBound ty (n :: Natural) where
              └─ type: Type → GHC.Prim.Natural.Natural → GHC.Types.Constraint
    WithinBound ty n = If (InBound ty n) Ok Never

  class Tag a where
  └─ class methods: tag ∷ ∀ a. (Tag a) ⇒ a → Bool
    tag :: a -> Bool

  instance WithinBound Word8 n => Tag (Proxy n) where
  └─ $fTagProxyn ∷ ∀ n. (WithinBound Word8 n) ⇒ Tag (Proxy n)
    tag _ = True
    │   └─ type: Proxy n
    └─ tag ∷ Proxy n → Bool

  bounded :: WithinBound Word8 n => Proxy n -> Proxy n
  bounded p = p
  │       └─ type: Proxy n
  └─ type: ∀ n. (WithinBound Word8 n) ⇒ Proxy n → Proxy n
