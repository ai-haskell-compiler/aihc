  │        │ │  │ │  └─ type: NP f xs
  │        │ │  │ └─ type: f x → NP f xs → NP f xs; type-args: k0, f, xs, x, xs; evidence: given xs ~ ': x xs
  │        │ │  └─ type: f x
  │        │ └─ type: ∀ x y. (c x y) ⇒ f x → g y
