  module Test where

  import GHC.Types (Constraint, Type)

  type family Head (xs :: [a]) :: a where
              └─ type: [a] → a
    Head (x ': xs) = x

  type family Tail (xs :: [a]) :: [a] where
              └─ type: [a] → [a]
    Tail (x ': xs) = xs

  type family SameShapeAs (xs :: [a]) (ys :: [b]) :: Constraint where
              └─ type: [a] → [b] → GHC.Types.Constraint
    SameShapeAs '[] ys = (ys ~ '[])
    SameShapeAs (x ': xs) ys = (ys ~ (Head ys ': Tail ys))

  type family AllZipF (c :: a -> b -> Constraint) (xs :: [a]) (ys :: [b]) :: Constraint where
              └─ type: (a → b → GHC.Types.Constraint) → [a] → [b] → GHC.Types.Constraint
    AllZipF _c '[] '[] = ()
    AllZipF c (x ': xs) (y ': ys) = (c x y, AllZip c xs ys)

  class (SameShapeAs xs ys, SameShapeAs ys xs, AllZipF c xs ys) => AllZip (c :: a -> b -> Constraint) (xs :: [a]) (ys :: [b])
  └─ class methods:
  instance (SameShapeAs xs ys, SameShapeAs ys xs, AllZipF c xs ys) => AllZip c xs ys
  └─ $fAllZipcxsys ∷ ∀ k0 k1 xs ys c. (SameShapeAs xs ys, SameShapeAs ys xs, AllZipF c xs ys) ⇒ AllZip c xs ys [superclasses: given SameShapeAs xs ys, given SameShapeAs ys xs, given AllZipF c xs ys]

  data NP :: (k -> Type) -> [k] -> Type where
       └─ type: (k → Type) → [k] → Type
    Nil :: NP f '[]
    └─ type: ∀ k f $parameter. ($parameter ~ 'GHC.Types.[]) ⇒ NP f $parameter
    (:*) :: f x -> NP f xs -> NP f (x ': xs)
    └─ type: ∀ k f $parameter x xs. ($parameter ~ ('GHC.Types.: x xs)) ⇒ f x → NP f xs → NP f $parameter

  data Proxy (a :: k) = Proxy
       │                └─ type: ∀ k a. Proxy a
       └─ type: k → Type

  -- The given reduces as it stands, with no other given equality.
  nil :: SameShapeAs '[] ys => Proxy ys -> Proxy '[]
  nil p = p
  │   └─ type: Proxy ys
  └─ type: ∀ k0 k1 k0 ys. (SameShapeAs 'GHC.Types.[] ys) ⇒ Proxy ys → Proxy 'GHC.Types.[]

  -- The match on @x :* xs@ gives @xs ~ (x ': xs')@. Then the superclass
  -- @SameShapeAs xs ys@ gives @ys ~ (Head ys ': Tail ys)@. With both, the
  -- superclass @AllZipF c xs ys@ gives @c x (Head ys)@ and @AllZip c xs'
  -- (Tail ys)@.
  trans_NP :: AllZip c xs ys => proxy c -> (forall x y . c x y => f x -> g y) -> NP f xs -> NP g ys
  trans_NP _ _t Nil = Nil
