  │        │ │  └─ type: NP f xs; type-args: k0, f, xs; evidence: given xs ~ '[]
  │        │ └─ type: ∀ x y. (c x y) ⇒ f x → g y
  │        └─ type: proxy c
  └─ type: ∀ k0 k1 c xs ys proxy f g. (AllZip c xs ys) ⇒ proxy c → (∀ x y. (c x y) ⇒ f x → g y) → NP f xs → NP g ys
  trans_NP p t (x :* xs) = t x :* trans_NP p t xs
