  │        │ │  │ │  │     │   │  └─ type: ∀ x y. (c x y) ⇒ f x → g y
  │        │ │  │ │  │     │   │  └─ type: proxy c → (∀ x y. (c x y) ⇒ f x → g y) → NP f xs → NP g (Tail ys); type-args: k0, k1, c, xs, Tail ys, proxy, f, g; evidence: $fAllZipcxsys @k0 @k1 @xs @Tail ys @c (super[0](super[1](cast(super[2](given AllZip c xs ys), AllZipF refl c given xs ~ ': x xs super[0](cast(super[0](given AllZip c xs ys), SameShapeAs given xs ~ ': x xs refl ys))))), super[1](super[1](cast(super[2](given AllZip c xs ys), AllZipF refl c given xs ~ ': x xs super[0](cast(super[0](given AllZip c xs ys), SameShapeAs given xs ~ ': x xs refl ys))))), super[2](super[1](cast(super[2](given AllZip c xs ys), AllZipF refl c given xs ~ ': x xs super[0](cast(super[0](given AllZip c xs ys), SameShapeAs given xs ~ ': x xs refl ys))))))
  │        │ │  │ │  │     │   └─ type: g (Head ys) → NP g (Tail ys) → NP g ('GHC.Types.: (Head ys) (Tail ys)); type-args: k1, g, ': (Head ys) (Tail ys), Head ys, Tail ys; evidence: refl ': (Head ys) (Tail ys)
