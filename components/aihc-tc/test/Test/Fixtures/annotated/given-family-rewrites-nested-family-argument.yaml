extensions: [FlexibleContexts, TypeFamilies]
modules:
- |
  {-# LANGUAGE FlexibleContexts, TypeFamilies #-}
  module Test where
  import GHC.Types (Type)
  type family V a :: Type -> Type
  type family N a :: Type
  data P n = P
  type instance N (P n) = n
  class C a where
    c :: a -> a
  instance C (P n) where
    c x = x
  g :: (V t ~ P, N t ~ n) => t -> N (V t (N t)) -> n
  g _ x = x
  h :: (V t ~ P, N t ~ n) => t -> V t (N t) -> V t (N t)
  h _ x = c x
status: pass
reason: The family V has arity one, thus V t (N t) is the application of V t to N t. The given V t ~ P rewrites it to P (N t), and the given N t ~ n rewrites it to P n. Then N (P n) reduces to n, and the class constraint C (P n) has an instance. Before the fix, a given rewrite did not find V t as a prefix of the application V t (N t), and the wanted equality and the wanted C (V t (N t)) stayed unsolved.
