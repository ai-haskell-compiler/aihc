- |
  {-# LANGUAGE DeriveAnyClass, DefaultSignatures, FlexibleInstances, FunctionalDependencies, UndecidableInstances, TypeFamilies, DataKinds, KindSignatures #-}
  module Test where
  import GHC.Types (Symbol)
  data Bool = True
  data Meta (name :: Symbol) = Meta
  data Yes = Yes
  class KnownSymbol (n :: Symbol)
  class Named a
  instance KnownSymbol n => Named (Meta n)
  class Answer a r | a -> r
  instance Answer (Meta n) Yes
  class Check r
  instance Check Yes
  class Nullary a
  instance (Answer a r, Check r) => Nullary a
  type family Rep a
  class FromJ a where
    parse :: a -> Bool
    default parse :: Named (Rep a) => a -> Bool
    parse _ = True
    nullary :: a -> Bool
    default nullary :: Nullary (Rep a) => a -> Bool
    nullary _ = True
  data T = T
    deriving (FromJ)
  type instance Rep T = Meta "T"
