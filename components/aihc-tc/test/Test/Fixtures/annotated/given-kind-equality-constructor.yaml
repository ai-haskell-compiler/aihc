  import GHC.Types (Type)
  data HEq (a :: k1) (b :: k2) where
    HRefl :: HEq a a
  data Maybe a = Nothing | Just a
  data Rep (a :: k) where
    RCon :: Rep a
    RApp :: forall k1 k2 (f :: k1 -> k2) (x :: k1). Rep f -> Rep x -> Rep (f x)
  eqRep :: Rep a -> Rep b -> Maybe (HEq a b)
  eqRep _ _ = Nothing
  data Box (a :: Type) = Box
  boxed :: Box a -> ()
  boxed _ = ()
  use :: forall (t :: Type). Rep t -> ()
  use rep = case rep of
    RApp (RApp (tup :: Rep tup) (left :: Rep l)) (right :: Rep r) -> case eqRep tup (RCon :: Rep (,)) of
      Just HRefl -> case (Box :: Box l) of
        _ -> boxed (Box :: Box (l -> ()))
      Nothing -> ()
    _ -> ()
