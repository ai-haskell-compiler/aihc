modules:
- |
  {-# LANGUAGE GADTs, MultiParamTypeClasses, FlexibleContexts, MagicHash #-}
  module Test where
  import GHC.Types (Coercible, Int (..))
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data Maybe a = Nothing | Just a
  data List a = Nil | Cons a (List a)
  mapList :: (a -> b) -> List a -> List b
  mapList f Nil = Nil
  mapList f (Cons x xs) = Cons (f x) (mapList f xs)
  newtype Key = Key Int
  data Coercion a b where
    Coercion :: Coercible a b => Coercion a b
  keyToInt :: Maybe (Coercion Key Int)
  keyToInt = Just Coercion
  data KeyFunction a where
    KeyCoerce :: Coercible Int a => KeyFunction a
    KeyText :: (Int -> a) -> KeyFunction a
  parse :: KeyFunction a -> List Int -> List a
  parse kf xs = case kf of
      KeyCoerce -> case keyToInt of
        Nothing -> text coerce
        Just Coercion -> uc (mapList Key xs)
      KeyText f -> text f
    where
      uc :: Coercible Key b => List Key -> List b
      uc = unsafeCoerce#
      text g = mapList g xs
