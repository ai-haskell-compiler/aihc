modules:
  - |
    {-# LANGUAGE PolyKinds, RankNTypes, TypeOperators, FlexibleInstances, UndecidableInstances, MultiParamTypeClasses, FunctionalDependencies #-}
    module Test where
    import GHC.Types (TYPE, Type, type (~~))
    newtype Codensity (m :: k -> TYPE rep) a = Codensity
      { runCodensity :: forall b. (a -> m b) -> m b }
    class Rd r (m :: Type -> Type) | m -> r where
      rd :: m r
      loc :: (r -> r) -> m a -> m a
      bnd :: m x -> (x -> m y) -> m y
    instance (m ~~ m', Rd r m') => Rd r (Codensity (m :: k -> TYPE rep)) where
      rd = Codensity (\c -> bnd rd c)
      loc f (Codensity g) = Codensity (\c -> bnd rd (\r -> loc f (g (\a -> loc (\_ -> r) (c a)))))
      bnd (Codensity g) h = Codensity (\c -> g (\a -> runCodensity (h a) c))
