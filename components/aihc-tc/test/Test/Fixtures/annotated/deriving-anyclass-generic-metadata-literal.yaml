  {-# LANGUAGE DeriveAnyClass, DefaultSignatures, FlexibleInstances, TypeFamilies, DataKinds, KindSignatures #-}
  module Test where
  import GHC.Types (Symbol)
  data Bool = True
  data Meta (name :: Symbol)
  class KnownSymbol (n :: Symbol)
  class Named a
  instance KnownSymbol n => Named (Meta n)
  type family Rep a
  class FromJ a where
    parse :: a -> Bool
    default parse :: Named (Rep a) => a -> Bool
