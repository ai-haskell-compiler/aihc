modules:
- |
  {-# LANGUAGE KindSignatures, RebindableSyntax #-}
  module Test where

  import GHC.Types (Bool (..), Type)

  class Applicative (m :: Type -> Type) where
    pure :: a -> m a

  class Applicative m => Monad (m :: Type -> Type) where
    (>>=) :: m a -> (a -> m b) -> m b
    (=<<) :: (a -> m b) -> m a -> m b
    return :: a -> m a

  ifThenElse :: Bool -> a -> a -> a
  ifThenElse True a _ = a
  ifThenElse False _ b = b

  almostFixM :: Monad m => m Bool -> (a -> m a) -> a -> m a
  almostFixM p f x = do
    p' <- p
    if p' then almostFixM p f =<< f x
          else return x
reason: do notation records the instantiated >>= method and preserves the monad constructor
