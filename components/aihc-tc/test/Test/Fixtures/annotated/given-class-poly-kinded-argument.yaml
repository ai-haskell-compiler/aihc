- |
  {-# LANGUAGE FlexibleContexts, KindSignatures, PolyKinds, RankNTypes #-}
  module Test where
  import GHC.Types (Type)
  data Product f g a = Pair (f a) (g a)
  newtype Alt f a = Alt (f a)
  class Empty (f :: k -> Type) where
    empty :: f a
  class ApplicativeB (b :: (k -> Type) -> Type) where
    bprod :: b f -> b g -> b (Product f g)
  class FunctorT (t :: (k -> Type) -> k' -> Type) where
    tmap :: (forall a. f a -> g a) -> t f x -> t g x
  getAlt :: Alt f a -> f a
  getAlt (Alt x) = x
  -- The given names the same poly-kinded application as the wanted.
  btprod :: (ApplicativeB (b (Alt (Product f f'))), FunctorT b, Empty f, Empty f') => b f g -> b f' g' -> b (Product f f') (Product g g')
  btprod l r = tmap getAlt (bprod (tmap oneL l) (tmap oneR r))
    where
      oneL la = Alt (Pair la empty)
      oneR ga = Alt (Pair empty ga)
