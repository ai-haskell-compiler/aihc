modules:
- |
  {-# LANGUAGE DataKinds, GADTs, KindSignatures, TypeFamilies, RankNTypes, ScopedTypeVariables #-}
  module Test where
  import GHC.Types (Type)
  data Unit = Unit
  data Lbi = Lbi
  data Files = Files
  data CF
  data BF
  data Spec = Try Type | General
  data Phase f where
    PConf :: Phase CF
    PBuild :: Phase BF
  data Args (s :: Spec) where
    NotIn :: Args General
    In :: Phase f -> Args (Try f)
  type family Res (s :: Spec) where
    Res General = Unit
    Res (Try f) = PRes f
  type family PRes f where
    PRes CF = Lbi
    PRes BF = Files
  infixr 0 $
  ($) :: (a -> b) -> a -> b
  f $ x = f x
  data M a = M a
  class Monad (m :: Type -> Type) where
    return :: a -> m a
  instance Monad M where
    return = M
  plain :: forall s. Args s -> Res s
  plain args = case args of
    NotIn -> Unit
    In p -> case p of
      PConf -> Lbi
      PBuild -> Files
  viaApply :: forall s. Args s -> M (Res s)
  viaApply args = return $ case args of
    NotIn -> Unit
    In p -> case p of
      PConf -> Lbi
      PBuild -> Files
reason: Two nested GADT matches give the givens s ~ Try f and f ~ BF. Only
  both givens together reduce the family application Res s to Files. In
  viaApply, the quick look at the left operand return of $ fixes the result
  type before the case branches are checked.
status: pass
