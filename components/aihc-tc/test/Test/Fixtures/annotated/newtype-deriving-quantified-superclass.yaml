- |
  {-# LANGUAGE KindSignatures, QuantifiedConstraints, GeneralizedNewtypeDeriving #-}
  module Test where

  import GHC.Types (Type)

  class NFData a where
    rnf :: a -> a

  class (forall a. NFData a => NFData (f a)) => NFData1 (f :: Type -> Type) where
    liftRnf :: (b -> b) -> f b -> f b

  class (forall a. NFData a => NFData1 (p a)) => NFData2 (p :: Type -> Type -> Type) where
    liftRnf2 :: (a -> a) -> (b -> b) -> p a b -> p a b

  newtype Wrap p a b = Wrap (p a b)
    deriving (NFData, NFData1, NFData2)

  newtype Lone f a = Lone (f a)
    deriving NFData1
reason: newtype deriving infers a context that proves a quantified superclass, and a missing superclass instance is an error
