extensions: [TypeFamilies, PolyKinds, KindSignatures, TypeOperators, ScopedTypeVariables, FlexibleContexts]
modules:
  - |
    {-# LANGUAGE TypeFamilies, PolyKinds, KindSignatures, TypeOperators, ScopedTypeVariables, FlexibleContexts #-}
    module Test where
    import GHC.Types
    data (path :: k) :> (a :: Type)
    data Proxy (t :: k) = Proxy
    data Q (a :: Type)
    class HasLink e where
      type MkLink e (a :: Type)
      toLink :: Proxy e -> a -> MkLink e a
    simpleToLink :: forall sub a c. (HasLink sub, MkLink sub a ~ MkLink (c :> sub) a) => Proxy sub -> Proxy (c :> sub) -> a -> MkLink (c :> sub) a
    simpleToLink _ _ = toLink (Proxy :: Proxy sub)
    instance HasLink sub => HasLink (Q v :> sub) where
      type MkLink (Q v :> sub) r = MkLink sub r
      toLink = simpleToLink (Proxy :: Proxy sub)
    instance HasLink ((arr :: x -> y) :> sub) where
      type MkLink (arr :> sub) a = Int
      toLink = toLink
