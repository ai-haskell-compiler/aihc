modules:
- |
  {-# LANGUAGE ScopedTypeVariables #-}
  module Test where
  data Nat = Z | S Nat
  data Proxy a = Proxy
  class Sized a where
    sizeOf :: Proxy a -> Nat
  data Box = Box
  instance Sized Box where
    sizeOf _ = S Z
  instance Sized a => Sized [a] where
    sizeOf _ = S (sizeOf (Proxy :: Proxy a))
  scoped :: forall a. Sized a => a -> Nat
  scoped _ = sizeOf (Proxy :: Proxy a)
  twice :: forall a. Sized a => a -> Nat
  twice x = inner x
    where
      inner :: a -> Nat
      inner _ = sizeOf (Proxy :: Proxy a)
  local :: forall a. Sized a => a -> [a] -> Nat
  local _ = go
    where
      go :: forall b. [b] -> Nat
      go _ = sizeOf (Proxy :: Proxy a)
  implicit :: Sized a => a -> Nat
  implicit _ = sizeOf (Proxy :: Proxy a)
reason: an explicit forall in a signature or an instance head scopes its type
  variables over the body, a local signature can use and rebind them, and a
  signature without forall does not scope its variables
