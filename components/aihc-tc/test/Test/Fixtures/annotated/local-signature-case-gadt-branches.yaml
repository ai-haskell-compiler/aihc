modules:
- |
  {-# LANGUAGE GADTs, KindSignatures, DataKinds, RankNTypes, ScopedTypeVariables #-}
  module Test where
  data Scope = User | System
  data SScope (s :: Scope) where
    SUser :: SScope User
    SSystem :: SScope System
  data RuleData (s :: Scope) = RuleData
  ruleBinary :: RuleData User -> RuleData System
  ruleBinary _ = RuleData
  ident :: a -> a
  ident x = x
  run :: forall s. SScope s -> RuleData s -> RuleData System
  run scope r = toBinary r
    where
      toBinary :: RuleData s -> RuleData System
      toBinary = case scope of
        SUser -> ruleBinary
        SSystem -> ident
status: pass
reason: a local binding with a signature and no arguments gives the type of the signature to its case expression, so a GADT branch does not fix the type of the other branch
