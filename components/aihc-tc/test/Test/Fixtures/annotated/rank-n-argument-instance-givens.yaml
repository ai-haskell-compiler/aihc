modules:
- |
  {-# LANGUAGE RankNTypes, KindSignatures #-}
  module Main where
  import GHC.Types (Type)
  class Container (f :: Type -> Type) where
    size :: f a -> f a
  newtype Compose f g a = Compose { getCompose :: f (g a) }
  instance (Container f, Container g) => Container (Compose f g) where
    size x = x
  class Traversing (p :: Type -> Type -> Type) where
    traverse' :: Container f => p a b -> p (f a) (f b)
    dimap :: (a -> b) -> (c -> d) -> p b c -> p a d
  newtype Cofree p a b = Cofree { runCofree :: forall f. Container f => p (f a) (f b) }
  instance Traversing q => Traversing (Cofree q) where
    traverse' (Cofree p) = Cofree (dimap Compose getCompose p)
  newtype Poly a = Poly (forall h. Container h => h a -> h a)
  outer :: Container g => (forall h. Container h => h a -> h a) -> Poly (g a)
  outer k = Poly (\x -> getCompose (k (Compose x)))
