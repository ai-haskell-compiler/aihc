  runPosixT h (ReaderT f) = f h
  data EvalTerm m = forall n. Command n => EvalTerm (forall a. n a -> m a) (forall a. m a -> n a)
  mapEvalTerm :: (forall a. n a -> m a) -> (forall a. m a -> n a) -> EvalTerm n -> EvalTerm m
  mapEvalTerm eval liftE (EvalTerm eval' liftE') = EvalTerm (eval . eval') (liftE' . liftE)
  (.) :: (b -> c) -> (a -> b) -> a -> c
  (f . g) x = f (g x)
  data Ops = Ops { evalOp :: forall m. Command m => EvalTerm m }
  make :: Handles -> (forall m. Command m => EvalTerm (PosixT m)) -> Ops
  make hs backend = Ops (mapEvalTerm (runPosixT hs) lift backend)
