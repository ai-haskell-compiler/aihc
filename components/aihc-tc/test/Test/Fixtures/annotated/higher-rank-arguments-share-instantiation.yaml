- |
  {-# LANGUAGE RankNTypes, ExistentialQuantification #-}
  module Test where
  class Monad m where
    ret :: a -> m a
  class Monad m => Command m where
    run :: m ()
  class MonadTrans t where
    lift :: Monad m => m a -> t m a
  newtype ReaderT r m a = ReaderT (r -> m a)
