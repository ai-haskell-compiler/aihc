- |
  {-# LANGUAGE KindSignatures, PolyKinds #-}
  module GHC.Internal.TH.Syntax where
  import GHC.Prim.Base (Monad)
  import GHC.Types (Char)
  data Name = Name
  data Exp = ConE Name | AppE Exp Exp
  class Monad m => Quote m where
    newName :: [Char] -> m Name
  data Code m a = Code (m Exp)
  mkNameG_d :: [Char] -> [Char] -> [Char] -> Name
  mkNameG_d _ _ _ = Name
  unsafeCodeCoerce :: Quote m => m Exp -> Code m a
  unsafeCodeCoerce expression = Code expression
- |
  {-# LANGUAGE KindSignatures, PolyKinds #-}
  module GHC.Internal.TH.Lift where
  import GHC.Internal.TH.Syntax (Code, Exp, Quote)
  import GHC.Types (RuntimeRep, TYPE)
  class Lift (t :: TYPE r) where
    lift :: Quote m => t -> m Exp
    liftTyped :: Quote m => t -> Code m t
- |
  {-# LANGUAGE DeriveLift #-}
  module Main where
  import GHC.Internal.TH.Lift (Lift)
  import GHC.Internal.TH.Syntax ()
  data Colour = Red | Green
    deriving Lift
  data Pair a = Pair a a
    deriving Lift
reason: a derived Lift rebuilds the constructor as a Template Haskell expression,
  naming the helpers of the package the class was found in. Bodies aside, the
  class and the helpers have the types the Template Haskell library gives them,
  so the class is representation polymorphic and its methods are quoted in any
  Quote monad. The helper modules are imported for their interfaces alone,
  which is what a compilation gives a module that derives the class without
  importing them
