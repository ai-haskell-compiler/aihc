- |
  {-# LANGUAGE FlexibleContexts, MagicHash #-}
  module Test where
  import GHC.Types (Coercible)
  import GHC.Prim (unsafeCoerce#)
  coerce :: Coercible a b => a -> b
  coerce = unsafeCoerce#
  data Inner a = Inner a
  -- The axiom of this newtype eta-reduces to @Outer ~R Inner@.
  newtype Outer a = Outer (Inner a)
  coerce00 :: Coercible f g => f x -> g x
  coerce00 = coerce
  wrap :: Inner x -> Outer x
  wrap = coerce00
