- |
  {-# LANGUAGE DataKinds, TypeFamilies, MultiParamTypeClasses, FlexibleContexts, FlexibleInstances, UndecidableInstances, AllowAmbiguousTypes, PolyKinds, KindSignatures, TypeOperators, ScopedTypeVariables, FunctionalDependencies, GADTs, TypeApplications #-}
  module A where
  import GHC.Types (Type)
  data Nat = Z | S Nat
  data Rec (f :: k -> Type) (rs :: [k]) where
    RNil :: Rec f '[]
    (:&) :: f r -> Rec f rs -> Rec f (r ': rs)
  class Functor g where
    fmap :: (a -> b) -> g a -> g b
  type family Idx (r :: k) (rs :: [k]) :: Nat where
    Idx r (r ': rs) = 'Z
    Idx r (s ': rs) = 'S (Idx r rs)
  class (i ~ Idx r rs) => Elem (r :: k) (r' :: k) (rs :: [k]) (rs' :: [k]) (i :: Nat) | r r' rs i -> rs' where
    lensC :: Functor g => (f r -> g (f r')) -> Rec f rs -> g (Rec f rs')
  instance Elem r r' (r ': rs) (r' ': rs) 'Z where
    lensC f (x :& xs) = fmap (:& xs) (f x)
  instance (Idx r (s ': rs) ~ 'S i, Elem r r' rs rs' i) => Elem r r' (s ': rs) (s ': rs') ('S i) where
    lensC f (x :& xs) = fmap (x :&) (lensC f xs)
