modules:
- |
  {-# LANGUAGE DeriveFunctor, GeneralizedNewtypeDeriving, StandaloneDeriving #-}
  module Main where
  import GHC.Prim.Base (Functor)
  import GHC.Types (Bool)
  newtype Matcher a = Matcher (Bool -> Bool -> a)
  deriving instance Functor Matcher
reason: Standalone Functor deriving for a newtype uses stock deriving when the
  representation type does not eta-reduce to the instance head, as in GHC.
  The result of Bool -> Bool -> a is a function type, not the parameter a.
