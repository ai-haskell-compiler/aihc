  {-# LANGUAGE DataKinds, KindSignatures, PolyKinds, TypeFamilies #-}
  module Test where

  import GHC.Types (Bool (..), Type)

  data Proxy (b :: Bool) = Proxy
       │                   └─ type: ∀ b. Proxy b
       └─ type: GHC.Types.Bool → Type
  data Box a = Box a
       │       └─ type: ∀ a. a → Box a
       └─ type: Type → Type

  type family IsArrow (k :: Type) :: Bool where
              └─ type: Type → GHC.Types.Bool
    IsArrow (a -> b) = 'True
    IsArrow a = 'False

  -- The body uses the kind variable @k@ of the binder as a type.
  type KindIsArrow (ty :: k) = IsArrow k
       └─ type: k → GHC.Types.Bool

  arrow :: Proxy (KindIsArrow Box) -> Proxy 'True
  arrow p = p
  │     └─ type: Proxy (IsArrow (Type → Type))
  └─ type: Proxy (IsArrow (Type → Type)) → Proxy 'GHC.Types.True
