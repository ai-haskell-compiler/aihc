modules:
- |
  {-# LANGUAGE ConstraintKinds, DataKinds, PolyKinds, RankNTypes, TypeFamilies, KindSignatures #-}
  module Test where
  import GHC.Types (Constraint, Type)
  data Kind = Iso | Lens
  class Pro (p :: Type -> Type -> Type -> Type) where
    dimap :: p i a b -> p i a b
  type family Constraints (k :: Kind) (p :: Type -> Type -> Type -> Type) :: Constraint where
    Constraints 'Iso p = Pro p
  newtype Optic k s t a b = Optic (forall p i. Pro p => Constraints k p => p i a b -> p i s t)
  newtype Re p s t i a b = Re (p i b a -> p i t s)
  getOptic :: Pro p => Optic k s t a b -> (Constraints k p => p i a b -> p i s t)
  getOptic (Optic o) = o
  unRe :: Re p s t i a b -> p i b a -> p i t s
  unRe (Re f) = f
  instance Pro (Re p s t) where
    dimap x = x
  re :: (Pro p, Constraints k (Re p a b)) => Optic k s t a b -> p i t s -> p i b a
  re o = unRe (getOptic o (Re (\x -> x)))
status: pass
reason: With PolyKinds, the given Constraints k (Re p a b) of the signature applies the poly-kinded Re with its kinds, and the wanted at the same type does not. The solver compares the stuck constraints in one canonical form, so the given solves the wanted. Before the fix, only class predicates had that form, and the wanted was unsolved.
