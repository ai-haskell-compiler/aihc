modules:
- |
  module Test where
  import GHC.Prim (Int#, Word#, Char#, Float#, Double#)
  data Bool = True | False
  isZero# value = case value of
    0# -> True
    _ -> False
  isOne## value = case value of
    1## -> True
    _ -> False
  isA# value = case value of
    'a'# -> True
    _ -> False
  isHalf## value = case value of
    0.5## -> True
    _ -> False
  quarter# _ = 0.25#
  probe :: Bool
  probe = isZero# True
