    module Provider (Container (..), Bag (..), Nat (..)) where
    data Nat = Z | S Nat
    data Bag = Bag Nat
    class Container c where
      type Elem c
      type Elem c = Nat
      elems :: c -> [Elem c]
    instance Container Bag where
      type Elem Bag = Nat
      elems (Bag n) = [n]
