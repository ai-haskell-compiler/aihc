modules:
  - |
    module Provider (Unit(..), Family(..)) where
    data Unit = Unit
    data family Family a
    data instance Family Unit = FamilyUnit Unit
    data instance Family (a, b) = FamilyPair !(Family a) !(Family b)
  - |
    module Consumer where
    import Provider
    first :: Family (a, b) -> Family a
    first (FamilyPair x _) = x
    unit :: Family Unit -> Family Unit
    unit (FamilyUnit u) = FamilyUnit u
  - |
    module Explicit where
    import Provider (Unit, Family(..))
    second :: Family (a, b) -> Family b
    second (FamilyPair _ y) = y
    unit :: Family Unit -> Family Unit
    unit (FamilyUnit u) = FamilyUnit u
  - |
    module Extension (Other(..), Family(..)) where
    import Provider (Unit, Family(..))
    data Other = Other
    data instance Family Other = FamilyOther Other
    unit :: Family Unit -> Family Unit
    unit (FamilyUnit u) = FamilyUnit u
  - |
    module Reexported where
    import Provider (Unit)
    import Extension
    other :: Family Other -> Other
    other (FamilyOther o) = o
    unit :: Family Unit -> Family Unit
    unit (FamilyUnit u) = FamilyUnit u
  - |
    module Combined where
    import Provider
    import Extension (Other, Family(..))
    other :: Family Other -> Other
    other (FamilyOther o) = o
    first :: Family (a, b) -> Family a
    first (FamilyPair x _) = x
