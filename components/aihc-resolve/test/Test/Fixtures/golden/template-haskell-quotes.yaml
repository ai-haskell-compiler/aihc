extensions:
  - TemplateHaskellQuotes
modules:
  - |
    module Main where
    data Box = Box
    quoteExpr = [| Box |]
    quoteType = [t| Box |]
    quoteName = 'Box
    quoteTypeName = ''Box
annotated:
  - |
    module Main where
    data Box = Box
         │     └─ v Main
         └─ t Main
    quoteExpr = [| Box |]
    └─ v Main      └─ v Main
    quoteType = [t| Box |]
    └─ v Main
    quoteName = 'Box
    └─ v Main    └─ v Main
    quoteTypeName = ''Box
    └─ v Main         └─ t Main
status: pass
reason: Template Haskell quotes are accepted. The names of an expression quote and of a name quote are resolved, and the syntax of a type quote stays unresolved
