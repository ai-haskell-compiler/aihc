reason: two imports share the alias X and the name empty, so X.empty is ambiguous, but the unqualified empty names the entity of Methods and the first import makes X.empty name it too. Thus module X re-exports it, as in GHC. Before the fix, the alias kept only the entity of the later import, and Main got an unbound empty.
