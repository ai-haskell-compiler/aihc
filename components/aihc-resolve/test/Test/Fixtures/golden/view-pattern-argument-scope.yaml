extensions:
  - ViewPatterns
modules:
  - |
    {-# LANGUAGE ViewPatterns #-}
    module Test where
    data Nat = Z | S Nat
    data Pair = Pair Nat Nat
    pick :: Nat -> Pair -> Nat
    pick Z (Pair a _) = a
    pick _ (Pair _ b) = b
    select :: Nat -> Pair -> Nat
    select n (pick n -> chosen) = chosen
    both :: (Nat, Pair) -> Nat
    both (n, pick n -> chosen) = chosen
annotated:
