site_name: The Lazy Reader
site_description: For people who will not read the manual. An illustrated guide to the ideas inside the aihc Haskell compiler.
site_url: https://lazy.aihc.app/

repo_name: ai-haskell-compiler/aihc
repo_url: https://github.com/ai-haskell-compiler/aihc
edit_uri: edit/main/docs/aihc-guide/src/

docs_dir: src

theme:
  name: material
  custom_dir: overrides
  logo: assets/mascot.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Use the light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use the dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use the system mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/lazy.css

extra_javascript:
  - path: javascripts/play.js
    type: module

extra:
  social:
    - icon: material/book-open-variant
      link: https://docs.aihc.app/
      name: The manual, for people who read manuals
    - icon: fontawesome/brands/github
      link: https://github.com/ai-haskell-compiler/aihc
      name: Source code on GitHub
    - icon: material/newspaper-variant-outline
      link: https://blog.aihc.app/
      name: Blog

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences
  - tables
  - toc:
      permalink: false

nav:
  - The Lazy Reader: index.md
  - 1. Hello, compiler: 01-hello-compiler.md
  - 2. Who is who: 02-who-is-who.md
  - 3. What is what: 03-what-is-what.md
