        <path id="gear-6" d="M15.7 -4.9L24.7 -3.7L24.7 3.7L15.7 4.9L12.1 11.2L15.5 19.6L9.2 23.2L3.6 16.1L-3.6 16.1L-9.2 23.2L-15.5 19.6L-12.1 11.2L-15.7 4.9L-24.7 3.7L-24.7 -3.7L-15.7 -4.9L-12.1 -11.2L-15.5 -19.6L-9.2 -23.2L-3.6 -16.1L3.6 -16.1L9.2 -23.2L15.5 -19.6L12.1 -11.2Z"/>
