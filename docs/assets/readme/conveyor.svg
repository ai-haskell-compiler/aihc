<svg xmlns="http://www.w3.org/2000/svg" viewBox="700 -36 1000 260" role="img" aria-label="Pieces of Haskell ride a conveyor belt into a machine with the label AIHC. Blocks of binary code come out on the other side.">
  <!-- This drawing is a copy of the machine on https://aihc.app/, with the colors of the other README drawings. -->
  <style>
    svg { fill: none; stroke: #ebe6de; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    text { stroke: none; text-anchor: middle; }
    .m-legs { stroke: #736c62; stroke-width: 2; }
    .m-belt { fill: #2b2240; stroke-width: 2; }
    .m-belt-dash { stroke: #736c62; stroke-width: 2; stroke-dasharray: 3 37; animation: belt 1.25s linear infinite; }
    .m-in, .m-out { animation: convey 40s linear infinite; }
    .m-in text { font: 500 21px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #9c958b; }
    .m-in text.hot { fill: #b7a8e6; }
    .m-out rect { fill: #27223a; stroke: #b7a8e6; stroke-width: 2; }
    .m-out text { font: 600 14px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #b7a8e6; }
    .m-box { animation: chug 0.5s ease-in-out infinite alternate; }
    .m-body, .m-part { fill: #2b2240; }
    .m-part { fill: #3a2f5c; }
    .m-slot { stroke: #ebe6de; stroke-width: 5; stroke-linecap: butt; }
    .m-foot { stroke-width: 6; }
    .m-label { font: 500 50px 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; letter-spacing: 0.04em; fill: #ebe6de; }
    .m-vent { stroke: #736c62; stroke-width: 2; }
    .m-gauge circle { fill: #1b1530; stroke-width: 2; }
    .m-needle { stroke: #b7a8e6; transform-box: fill-box; transform-origin: 50% 100%; animation: needle 2.6s ease-in-out infinite alternate; }
    .m-lights circle { stroke-width: 1.5; fill: #4cc04c; animation: lamp 1.8s steps(1) infinite; }
    .m-lights circle:nth-child(2) { animation-delay: 0.6s; }
    .m-lights circle:nth-child(3) { animation-delay: 1.2s; }
    .m-rivets circle { fill: #736c62; stroke: none; }
    .m-gear { fill: #3a2f5c; animation: spin 6s linear infinite; }
    .m-gear circle { fill: #ebe6de; stroke: none; }
    .m-puffs circle { fill: #2b2240; stroke: #736c62; stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: puff 3s ease-out infinite; }
    .m-puffs circle:nth-child(2) { animation-delay: 1s; }
    .m-puffs circle:nth-child(3) { animation-delay: 2s; }
    @keyframes convey { to { transform: translateX(1280px); } }
    @keyframes belt { to { stroke-dashoffset: -40; } }
    @keyframes chug { to { transform: translateY(-1.5px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes needle { from { transform: rotate(-50deg); } to { transform: rotate(55deg); } }
    @keyframes lamp { 0% { fill: #4cc04c; } 34% { fill: #3a2f5c; } }
    @keyframes puff {
      0% { opacity: 0; transform: translate(0, 6px) scale(0.5); }
      20% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(14px, -30px) scale(1.7); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <clipPath id="card"><rect x="700" y="-36" width="1000" height="260" rx="18"/></clipPath>
  <g clip-path="url(#card)">
  <rect x="700" y="-36" width="1000" height="260" fill="#1b1530" stroke="none"/>
