<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" role="img" aria-label="AIHC compiles Haskell source to native machine code, LLVM IR, and WebAssembly.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1530"/>
      <stop offset="1" stop-color="#3a2f5c"/>
    </linearGradient>
    <clipPath id="c"><polygon points="18,18 62,18 40,88"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fff; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sub { fill: #c9c1e0; font-size: 13px; }
    .wire { fill: none; stroke: #8e82b5; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 12; animation: flow 1.2s linear infinite; }
    .w2 { animation-delay: -0.4s; } .w3 { animation-delay: -0.8s; }
    .tile { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .node { animation: lift 3.6s ease-in-out infinite; }
    .n2 { animation-delay: -1.2s; } .n3 { animation-delay: -2.4s; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    @keyframes lift { 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="880" height="230" rx="18" fill="url(#bg)"/>
  <path class="wire" d="M208 115 H336"/>
  <path class="wire" d="M444 115 C520 115 520 49 596 49"/>
  <path class="wire w2" d="M444 115 H596"/>
  <path class="wire w3" d="M444 115 C520 115 520 181 596 181"/>
  <rect x="40" y="89" width="168" height="52" rx="12" fill="#2b2240" stroke="#5e5086" stroke-width="1.5"/>
  <text class="mono" x="124" y="121" font-size="17" text-anchor="middle">Main.hs</text>
  <g class="tile">
    <rect x="336" y="61" width="108" height="108" rx="24" fill="#5e5086"/>
    <g transform="translate(347.9 72.9) scale(0.842)" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 54 Q40 36 56 54" clip-path="url(#c)" stroke-linecap="butt"/>
      <path d="M18 18 L40 88 L62 18"/>
      <path d="M64 88 L79.1 40"/>
      <circle cx="86" cy="18" r="6" fill="#fff" stroke="none"/>
    </g>
  </g>
  <g class="node">
    <rect x="596" y="23" width="244" height="52" rx="12" fill="#2b2240" stroke="#8e82b5" stroke-width="1.5"/>
    <text x="616" y="46" font-size="16" font-weight="700">Native machine code</text>
    <text class="sub" x="616" y="64">AMD64 and ARM64</text>
  </g>
  <g class="node n2">
    <rect x="596" y="89" width="244" height="52" rx="12" fill="#2b2240" stroke="#8e82b5" stroke-width="1.5"/>
    <text x="616" y="112" font-size="16" font-weight="700">LLVM IR</text>
    <text class="sub" x="616" y="130">Compiled with Clang</text>
  </g>
  <g class="node n3">
    <rect x="596" y="155" width="244" height="52" rx="12" fill="#2b2240" stroke="#f2b8c6" stroke-width="1.5"/>
    <text x="616" y="178" font-size="16" font-weight="700">WebAssembly</text>
    <text class="sub" x="616" y="196">wasm32, also in the browser</text>
  </g>
</svg>
