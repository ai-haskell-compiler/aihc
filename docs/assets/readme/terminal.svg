<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" role="img" aria-label="A terminal. The command aihc build compiles the hello-world example in 0.2 seconds. The program prints Hello, world!">
  <defs>
    <clipPath id="t1"><rect class="type ty1" x="46" y="62" width="351" height="24"/></clipPath>
    <clipPath id="t2"><rect class="type ty2" x="46" y="182" width="243" height="24"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e8e4f2; }
    .dim { fill: #9b93b8; } .ok { fill: #8fd6a4; } .acc { fill: #b9a9ec; } .out { fill: #f2b8c6; font-weight: 700; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #9b93b8; }
    .all { animation: all 14s linear infinite; }
    .type { transform-box: fill-box; transform-origin: left; }
    .ty1 { animation: ty1 14s linear infinite; }
    .ty2 { animation: ty2 14s linear infinite; }
    .l1 { animation: l1 14s linear infinite; } .l2 { animation: l2 14s linear infinite; }
    .l3 { animation: l3 14s linear infinite; } .l4 { animation: l4 14s linear infinite; }
    .l5 { animation: l5 14s linear infinite; } .l6 { animation: l6 14s linear infinite; }
    .l7 { animation: l7 14s linear infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes all { 0%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes ty1 { 0%, 4% { transform: scaleX(0); animation-timing-function: steps(39, end); } 20%, 100% { transform: scaleX(1); } }
    @keyframes ty2 { 0%, 46% { transform: scaleX(0); animation-timing-function: steps(27, end); } 57%, 100% { transform: scaleX(1); } }
    @keyframes l1 { 0%, 24% { opacity: 0; } 24.1%, 100% { opacity: 1; } }
    @keyframes l2 { 0%, 26% { opacity: 0; } 26.1%, 100% { opacity: 1; } }
    @keyframes l3 { 0%, 35% { opacity: 0; } 35.1%, 100% { opacity: 1; } }
    @keyframes l4 { 0%, 37% { opacity: 0; } 37.1%, 100% { opacity: 1; } }
    @keyframes l5 { 0%, 42% { opacity: 0; } 42.1%, 100% { opacity: 1; } }
    @keyframes l6 { 0%, 61% { opacity: 0; } 61.1%, 100% { opacity: 1; } }
    @keyframes l7 { 0%, 64% { opacity: 0; } 64.1%, 100% { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="880" height="290" rx="14" fill="#1b1530"/>
  <path d="M0 14 A14 14 0 0 1 14 0 H866 A14 14 0 0 1 880 14 V38 H0 Z" fill="#2b2240"/>
  <circle cx="24" cy="19" r="6" fill="#f2b8c6"/>
  <circle cx="44" cy="19" r="6" fill="#e8d28f"/>
  <circle cx="64" cy="19" r="6" fill="#8fd6a4"/>
  <text class="title" x="440" y="24" text-anchor="middle">aihc</text>
  <g class="all">
    <text class="acc" x="28" y="80">$</text>
    <text x="46" y="80" textLength="351" clip-path="url(#t1)">aihc build examples/hello-world/Main.hs</text>
    <text class="l1 dim" x="28" y="104">Plan: 3 packages, 1 executable</text>
    <text class="l2 dim" x="28" y="128" xml:space="preserve">  aihc-rts-1.0.2  aihc-prim-0.13.0  aihc-base-4.21.2.0  Main (executable)</text>
    <text class="l3" x="28" y="152" xml:space="preserve"><tspan class="ok">✔</tspan> Main (executable)  2 modules  <tspan class="ok">0.2 s</tspan></text>
    <text class="l4 dim" x="28" y="176">executable: examples/hello-world/Main</text>
    <text class="l5 acc" x="28" y="200">$</text>
    <text x="46" y="200" textLength="243" clip-path="url(#t2)">./examples/hello-world/Main</text>
    <text class="l6 out" x="28" y="224">Hello, world!</text>
    <g class="l7">
      <text class="acc" x="28" y="248">$</text>
      <rect class="cur" x="46" y="234" width="9" height="18" fill="#e8e4f2"/>
    </g>
  </g>
</svg>
